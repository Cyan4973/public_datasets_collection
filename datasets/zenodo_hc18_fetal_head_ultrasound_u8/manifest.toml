manifest_version = 1
dataset_id = "zenodo_hc18_fetal_head_ultrasound_u8"
name = "HC18 Fetal-Head 2D B-Mode Ultrasound Images UInt8"
description = "The HC18 grand-challenge images (1,334 published: 999 training + 335 test; 1,325 emitted after dropping 1 exact and 8 near-duplicate re-exports): standard-plane 2D B-mode ultrasound sonograms of the fetal head from routine screening exams at Radboud UMC, each decoded from its 8-bit grayscale PNG (800x540 for 1,293 of the emitted images, native sizes 738-800 x 539-563 for 32) into one raw uint8 image sample."
homepage = "https://hc18.grand-challenge.org/"

[license]
name = "Creative Commons Attribution 4.0 International"
spdx = "CC-BY-4.0"
url = "https://creativecommons.org/licenses/by/4.0/"
citation = "van den Heuvel TLA, de Bruijn D, de Korte CL, van Ginneken B. Automated measurement of fetal head circumference using 2D ultrasound images. PLoS ONE 13(8): e0200412 (2018), doi:10.1371/journal.pone.0200412. Dataset: van den Heuvel TLA, de Bruijn D, de Korte CL, van Ginneken B. Automated measurement of fetal head circumference using 2D ultrasound images [Data set]. Zenodo (2018), doi:10.5281/zenodo.1327317 (concept doi:10.5281/zenodo.1322000)."
notes = "The Zenodo record metadata of record 1327317 declares license id 'cc-by-4.0' with access_right 'open'; download.sh fetches the record JSON and fails unless both still hold. The challenge page adds no other terms and asks users to cite the paper and the Zenodo dataset. Preserve the authors, the paper and the DOI in any redistribution."

[safety]
contains_sensitive_data = true
contains_personal_data = false
provenance_notes = "Official Zenodo deposit by the Radboud UMC authors of the challenge; no mirrors. Clinical ultrasound images acquired May 2014 - May 2015 in routine screening of 551 pregnant women. Per the paper the local ethics committee (CMO Arnhem-Nijmegen) approved collection and use, informed consent was waived for the retrospective collection, and all data were anonymized according to the Declaration of Helsinki."
usage_notes = "Samples hold only the published image pixels. Burned-in elements seen in the inspected frames (a 64-frame contact sheet plus full-resolution views) are scanner graphics only: a grey-scale bar, a tiny setting label next to it (e.g. 'Volume / 5.4'), a black masking rectangle (most frames, presumably over the on-screen measurement readout), and in a few frames a bottom scanner status strip (e.g. 'Cine 742', '15 sec'). No patient text was seen. Ellipse annotation masks, head-circumference labels and file names are not emitted. Do not attempt re-identification or linkage."

