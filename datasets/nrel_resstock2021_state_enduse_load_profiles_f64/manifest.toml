[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official NREL/DOE OEDI data lake (public anonymous S3 bucket oedi-data-lake, not requester-pays), objects pinned by key, size, single-part ETag (md5) and LastModified. Values are physics-based simulation outputs (EnergyPlus via ResStock/OpenStudio-HPXML) summed with sampling weights over thousands of modeled dwellings per state; no metered customer data, no individual buildings."
usage_notes = "State-level aggregates of simulated dwellings only; models_used and units_represented are kept as index metadata, building IDs are not present in these files."

