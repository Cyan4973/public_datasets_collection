notes = "data.ceda.ac.uk is the catalogue and redirect front end; files are served by dap.ceda.ac.uk. A CEDA recovery notice (recovery_readme_nov2025.txt) reports a Nov 2025 accidental deletion restored from tape. ukdale.zip is on disk with its original 2017 Last-Modified, size and member CRC32 values (catalogue last_audit 2026-07-25)."

