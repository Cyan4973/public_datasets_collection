[[series]]
id = "shakemap_mmi_f32"
description = "Mean and standard-deviation Modified Mercalli Intensity grids."
semantic_meaning = "Modeled earthquake shaking intensity and its uncertainty over the complete ShakeMap grid."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The ESRI BIL members natively store little-endian IEEE-754 float32 values. MMI is stored in linear intensity units."
source_resources = ["shakemap_raster_zip", "usgs_event_detail", "usgs_rights_evidence"]
source_format = "ZIP containing paired ESRI .flt/.hdr single-band rasters"
source_field = "mmi_mean and mmi_std"
filtered_input_path = "filtered/usgs_shakemap_ground_motion_f32/ingest_stats.json"
filtering = "Retain the complete 496x795 mean and standard-deviation MMI grids."
missing_value_policy = "Headers declare 999.0 as NoData, but neither selected MMI grid contains that value. Missing members, changed geometry/type, non-finite values, unexpected NoData, constant or duplicate grids, or stale output fail the recipe."
conversion = "Extract each raw little-endian float32 BIL payload without numeric conversion."
numeric_kind = "float"
bit_width = 32
endianness = "little"
sample_format = "raw homogeneous IEEE-754 float32 ShakeMap raster"
sample_geometry = "earthquake_ground_motion_grid_2d"
sample_rank = 2
sample_axes = ["latitude_north_to_south", "longitude_west_to_east"]
natural_record_kind = "complete_shakemap_measure_statistic_layer"
sample_count = 2
total_size_bytes = 3154560
output_path = "samples/usgs_shakemap_ground_motion_f32/shakemap_mmi_f32/"

