summary = "Validate every numeric EMG recording in the official archive, exactly invert the source decimal scale, and emit one signed-int8 timeline per source recording/channel."
deterministic_notes = "The decoder validates safe ZIP structure, ten-column numeric recording tables, nondecreasing time, eight channel values exactly on a 1e-5 lattice whose recovered codes fit signed int8, bounded gesture labels, complete nonconstant channel timelines, distinct outputs, aggregate and median floors, and fresh source/output byte equality."

[[series]]
id = "semg_channel_i8"
description = "Complete raw surface-EMG channel timeline from one participant recording session."
semantic_meaning = "Signed raw Myo-armband surface-electromyography amplitude code at each successive observation for one electrode channel."
role = "primary"
representation_class = "native_numeric"
representation_notes = "UCI stores the Myo readings as exact decimal physical values on a 1e-5 lattice. Multiplication by 100000 exactly recovers codes in -128..127; each is emitted as its two's-complement int8 byte. A complete archive scan found zero off-lattice or out-of-range values."
source_resources = ["emg_gestures_archive", "uci_481_metadata", "uci_481_rights_page"]
source_format = "UCI delimited raw EMG recording table"
source_field = "one of the eight raw EMG channel columns"
filtered_input_path = "filtered/uci_emg_gestures_i8/ingest_stats.json"
filtering = "Keep every observation from all eight EMG channels of every complete numeric recording member. Use timestamp and gesture class only for validation; exclude them from outputs."
missing_value_policy = "Missing or malformed rows, nonnumeric fields, backward time, channel values off the exact 1e-5 lattice, recovered codes outside signed-int8, invalid gesture labels, short or constant channel timelines, duplicate channel payloads, insufficient coverage/floors, source identity changes, or stale outputs fail the recipe. No readings are dropped, imputed, rounded, clipped, or concatenated across recordings."
conversion = "Parse each source channel token as an exact decimal, multiply by 100000, require an integral result in -128..127, and emit its two's-complement int8 byte in source row order, one source recording/channel per sample. This is exact inverse scaling, not quantization."
numeric_kind = "int"
bit_width = 8
endianness = "little"
sample_format = "raw homogeneous signed-int8 surface-EMG timeline"
sample_geometry = "semg_recording_channel_time_series_1d"
sample_rank = 1
sample_axes = ["observation_time"]
natural_record_kind = "complete_semg_recording_channel_timeline"
sample_count = 568
total_size_bytes = 33265144
output_path = "samples/uci_emg_gestures_i8/semg_channel_i8/"
