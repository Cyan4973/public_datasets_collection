notes = "The CKAN package (data.uni-hannover.de, id 93b52576-6a5a-4ce9-8c27-a0372590f7b0) declares license_id CC-BY-3.0, license_url https://creativecommons.org/licenses/by/3.0/, isopen true; the landing page shows 'License: Creative Commons Attribution 3.0' and schema:license https://creativecommons.org/licenses/by/3.0/. The six exemplary ZIPs are open resources of that package. Only the separately requested meteorological data are gated and they are not used. download.sh re-checks license_id, isopen and the DOI on every run. Attribute the authors and DOI."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official Leibniz University Hannover research data repository (CKAN, DOI 10.25835/0027803); exact byte ranges of the official exemplary ZIP resources, validated against each ZIP central directory."
usage_notes = "Engineering vibration measurements of a steel test structure; no people, locations of individuals or personal data."

