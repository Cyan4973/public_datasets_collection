[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/ascad_atmega8515_raw_power_traces_i8/samples.jsonl"
summary = "Range-fetch the head of the deflated HDF5 member, stream-inflate it with zlib (raw DEFLATE), parse HDF5 superblock v0 -> root group -> /traces (dataspace, int8 datatype, v3 contiguous layout), and write the first 1,500 complete 100,000-value traces as raw int8 samples in acquisition order."
deterministic_notes = "Pinned archive URL, size, sha1 (API), tail sha256, member offset/method/sizes/crc (central directory and local header), and range length. The parser derives dims (60000 x 100000), signed little-endian 8-bit datatype, absence of a filter pipeline, and contiguous address 3,842,144 / size 6,000,000,000 from the file and asserts they equal the expected values. Exactly traces 0..1499 are emitted; only complete traces. verify.sh re-inflates the prefix, re-parses the HDF5 header, byte-compares every sample, checks index fields and per-sample sha256, rejects exact duplicates and constant/degenerate traces (< 32 distinct values or one value > 50%)."

[[series]]
id = "ascad_atmega8515_raw_trace_i8"
description = "Raw int8 side-channel oscilloscope acquisitions, one per AES-128 execution, ATMega8515, ASCAD v1 fixed-key campaign."
semantic_meaning = "Signed 8-bit digitizer codes of the electromagnetic emanation of an ATMega8515 microcontroller during one masked AES-128 encryption, sampled over 100,000 consecutive points (ASCAD v1 raw acquisition)."
role = "primary"
representation_class = "native_numeric"
representation_notes = "HDF5 /traces is stored as signed 8-bit little-endian fixed-point (H5T_STD_I8LE) with contiguous layout; bytes are copied verbatim, no rescaling."
source_resources = ["ascad_data_zip_tail", "atmega8515_raw_traces_member_prefix"]
source_format = "HDF5 v0 file (zip member, DEFLATE) with contiguous unfiltered int8 2-D dataset"
source_field = "root dataset /traces, row i (one 100,000-sample acquisition per row)"
filtered_input_path = "filtered/ascad_atmega8515_raw_power_traces_i8/ingest_stats.json"
filtering = "Rows 0..1499 of /traces in acquisition order (the first 1,500 of 60,000). The /metadata compound dataset (plaintext, key, masks) is not emitted."
missing_value_policy = "int8 digitizer codes have no missing-value sentinel; every value is kept. A truncated prefix, wrong layout/datatype, a constant trace, a trace with < 32 distinct values or one value > 50% of samples, or an exact duplicate trace is fatal."
conversion = "Inflate the raw DEFLATE member prefix (zlib wbits -15), skip the 3,842,144-byte HDF5 header region (parsed contiguous address), and write each consecutive 100,000-byte row as a raw int8 sample file trace_NNNNN.bin."
numeric_kind = "int"
bit_width = 8
endianness = "little"
sample_format = "raw homogeneous int8 array"
sample_geometry = "oscilloscope_time_series"
sample_rank = 1
sample_axes = ["time_sample"]
natural_record_kind = "single_aes_execution_oscilloscope_acquisition_trace"
sample_count = 1500
total_size_bytes = 150000000
output_path = "samples/ascad_atmega8515_raw_power_traces_i8/ascad_atmega8515_raw_trace_i8/"
