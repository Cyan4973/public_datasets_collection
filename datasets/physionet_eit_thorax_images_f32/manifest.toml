[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/physionet_eit_thorax_images_f32/samples.jsonl"
summary = "Fetch and checksum the 20 forced-expiratory-manoeuvre Draeger PulmoVista EIT exports of PhysioNet respiratory-heartrate-dataset 1.0.0, split each file into 4358-byte frames, exclude recordings with dropped frames, and emit the 1024 float32 pixel values of every frame, in stored order, as one frames x 32 x 32 little-endian float32 sample per retained recording."
deterministic_notes = "Pinned release 1.0.0 with SHA-256 for SHA256SUMS.txt, LICENSE.txt, README.txt and Code/read_binData.m; the 20 FEM files are pinned by size and SHA-256 (cross-checked against SHA256SUMS.txt) and must be multiples of 4358 bytes. Canonical order S01..S20. Every frame's float64 time stamp must be a day fraction in [0,1) and the median frame step must be 19-21 ms (50 Hz), which rejects any frame-grid misalignment. Exclusion rule (build and verify, from source content): a recording with any frame step > 30 ms is excluded; at most 5 exclusions are allowed and the derived set must equal the documented set (S02, S08, S09). build.sh and verify.sh run a synthetic-input selftest (3 positive cases: clean, gap exclusion, reference-frame detection; 8 negative cases) of two independent decoders: build copies pixel bytes verbatim and computes statistics with array('f'); verify re-decodes with struct, re-derives the exclusion decision, re-packs as '<1024f' and byte-compares every frame, then re-checks index fields (including per-sample SHA-256 and min/max of the stored float32), the aggregate output SHA-256 and manifest totals. Floors: at least 10,000 primary values or 100 KB, median at least 1,000 values per sample. Realized 2026-10-05: 17 samples, 3 exclusions, 64,650 frames, 66,201,600 values, 264,806,400 bytes, median 3,250 frames (3,328,000 values) per sample, value range -24.786 to 216.429 AU, exact zeros 2.858% (29 out-of-mask pixels per frame plus one all-zero reference frame per recording), no non-finite values, aggregate output SHA-256 a4429e0dd5d71ca467458d25b5d536176f9c0a8dae46201123fa7be6e35583a1."

[[series]]
id = "pulmovista_eit_fem_image_f32"
description = "Complete reconstructed thoracic EIT image sequences of the forced-expiratory-manoeuvre trial, one per retained volunteer recording."
semantic_meaning = "Per-pixel relative regional conductivity (aeration) change, in device arbitrary units, of a 32 x 32 cross-sectional thoracic image reconstructed by a Draeger PulmoVista 500 from an electrode belt around the chest at axilla level, 50 frames per second, while a seated healthy volunteer breathes through a full-face mask and pressure/flow sensor and performs three forced expiratory manoeuvres. Pixels outside the device's thorax mask (29 corner pixels per frame) are exactly 0.0 as exported."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The values are the Draeger device-software export of reconstructed images (read_binData.m: 'reconstructed EIT images from the .bin file generated by the Dräger Tool'), i.e. the stable machine-facing artifact the authors publish as 'EIT_rawData'; electrode voltages are not part of the release. The recipe neither reconstructs, filters, scales, rotates nor resamples: each frame's 1024 IEEE-754 float32 words are copied bit-for-bit."
source_resources = ["eit_fem_recordings", "eit_sha256sums", "eit_reader_code"]
source_format = "Draeger PulmoVista 500 EIT .bin export: headerless sequence of 4358-byte little-endian frames (layout per Code/read_binData.m)"
source_field = "per-frame pixel block: 1024 float32 reconstructed-image values at frame byte offset 12"
filtered_input_path = "filtered/physionet_eit_thorax_images_f32/ingest_stats.json"
filtering = "Population: every FEM recording of the release (S01-S20, one per subject, 3,000-8,400 frames). Retained: the 17 recordings whose frame time stamps advance in 20 ms steps throughout. Excluded by rule (any frame step > 30 ms, i.e. dropped frames): S02_FEM (gaps of 108 and 103 ms), S08_FEM (103, 97 ms) and S09_FEM (120, 105, 100, 91 ms). These three are also off the common scale: in each, the all-zero reference frame lies 1-4 frames before a gap and nearly all frames sit on a large static baseline (median per-frame max 7,329-8,690 AU vs 23-67 AU in the retained recordings, whose global range is -24.8 to 216.4 AU), whereas the same subjects' PEEP trials are on the normal scale; the cause is undocumented upstream, and mixing them would bundle a ~150x different regime. The PEEP and PEEP_BH trials (40 recordings, 16,500-19,150 frames each; each set alone would be about 1.39 GB of primary output, above the 1 GB cap) are out of scope so the recipe takes one trial protocol across every subject. Per frame, the time stamp, dummy float, MinMax/event-marker int32, event text, timing-error int32 and 52 Medibus floats (observed as -1000 / -3.4e38 fill) are dropped."
missing_value_policy = "The export has no missing-value sentinel for pixels. Out-of-mask pixels (29 per frame) and the single all-zero frame per recording (apparently the device's relative-impedance reference frame) are native exact 0.0 and are kept. Every pixel must be finite: any NaN or +/-Inf, a size that is not a multiple of 4358, a checksum mismatch, an out-of-range time stamp or a non-50 Hz median cadence is fatal. Whole recordings with dropped frames (any frame step > 30 ms) are excluded and listed in ingest_stats.json with their gaps; more than 5 exclusions, or a derived set different from S02/S08/S09, is fatal. For retained recordings, a constant recording, more than 1% of frames identical to their predecessor, a sampled frame with fewer than 256 distinct values, or a median per-frame maximum above 1,000 AU is fatal. Nothing is imputed or partially dropped. verify.sh applies the same rules from the downloads."
conversion = "For frame k of a recording, take bytes [4358k + 12, 4358k + 4108) (1024 little-endian float32) and append them unchanged; the sample is the concatenation over all frames in stored order, shape frames x 32 x 32. Read row-major, each 32 x 32 block is the caudal-cranial display image produced by read_binData.m (its reshape + rot90 + flipud is a transpose of MATLAB's column-major fill), so axis 1 is image row and axis 2 is image column. Index min/max are computed from the stored float32 values."
numeric_kind = "float"
bit_width = 32
endianness = "little"
sample_format = "raw homogeneous little-endian float32 EIT image sequence"
sample_geometry = "eit_image_time_series_frames_by_32x32_pixels_3d"
sample_rank = 3
sample_axes = ["frame_50hz", "image_row", "image_column"]
natural_record_kind = "complete_pulmovista_eit_forced_expiratory_manoeuvre_recording"
sample_count = 17
total_size_bytes = 264806400
output_path = "samples/physionet_eit_thorax_images_f32/pulmovista_eit_fem_image_f32/"
