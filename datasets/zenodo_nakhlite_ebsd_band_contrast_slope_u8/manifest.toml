notes = "20 .ctf EBSD maps plus two MATLAB .mlx scripts. Only the 10 legacy CHANNEL5 exports (empty Author tag, 'Device 0', 4-decimal steps, 20 kV, 70 deg tilt) are used. Excluded: the 9 AZtec exports ('Author AZtec', 'Device 1'; different acquisition software and detector, so a different BC/BS scaling regime), NWA 817_N8-1_NR_crystal.ctf (AZtec-style header, 0.4 um step, TiltAngle stored in radians, 2.96 GB) and the terrestrial Caleta El Cobre map (AZtec, Device 1)."

