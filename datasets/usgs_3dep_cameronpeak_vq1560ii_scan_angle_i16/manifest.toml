[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/usgs_3dep_cameronpeak_vq1560ii_scan_angle_i16/samples.jsonl"
summary = "Fetch 24 pinned LAZ tiles, decode them with the repository's pure-stdlib LASzip decoder (tools/laz/laszip.py), keep bytes 18-19 (signed int16 scan angle) of every 30-byte LAS 1.4 PDRF-6 record unchanged, and emit one little-endian int16 sample per tile in file point order."
deterministic_notes = "Selection rule (scripts/cpk_tiles.py select, documented by discover.sh; never looks at scan angles): VPC features of the work unit from the main delivery batch (datetime 2022-03-11T00:00:00Z; skips the 11 tiles re-delivered on 2022-03-17 / 2022-06-27, 9 of which carry the variant system id 'Riegl VQ-1560II'), with a full 5,000 ft footprint (x and y extents >= 4,999 ft), and pc:count in [6,000,000, 14,000,000) (the project median is 14.2 M points; the bound keeps pure-Python decode time and the primary output moderate); sorted by tile id, the 24 tiles at ranks floor((2i+1)*380/48) of the 380 qualifying tiles. download.sh re-derives the selection from the live VPC and link list and refuses to proceed if it differs from sources.tsv. build.sh re-validates every tile, decodes all chunks in file order, checks the decoded per-return histogram against the header's 15 extended points-by-return counts (decode integrity), and fails on a point-count mismatch, on any value outside the LAS 1.4 limit -30,000..30,000, on fewer than 100 distinct values or one value above 50% of a tile. verify.sh re-decodes each tile through the whole-file decode path, re-extracts scan angles with struct.iter_unpack and compares bytes, hashes, min/max, distinct counts, index fields and manifest totals, requires a per-tile span (max - min) of at least 2,000 units (12 degrees; some tiles see only one side of the swath, e.g. w3140n1375 spans 576..4912) and a family range of at least -3,000..+3,000 (+-18 degrees). Expected realization (header counts pinned): 24 samples, 245,581,947 values, 491,163,894 bytes; median 10,820,823 values per sample (6,060,150 to 13,616,373)."

[[series]]
id = "cpk_2021_scan_angle_i16"
description = "LAS 1.4 extended scan angle of every lidar point in one published USGS 3DEP Cameron Peak Wildfire 2021 LAZ tile, as the native signed 16-bit field."
semantic_meaning = "Angle of the outgoing laser pulse relative to nadir in the scanner frame, in 0.006 degree units (value 5000 = 30 degrees; negative = left of track), recorded by the Riegl VQ-1560 II dual-channel oblique scanner and carried through the contractor's processing (header software GeoCue LAS Updater), for every point of a 5,000 ft x 5,000 ft tile over the 2020 Cameron Peak burn area (collected 2021-09-07..2021-09-22). The work-unit QC report gives a scan-angle-rank range of -33..35 degrees (about -5,500..5,833 units). In a probed chunk the values sit on a lattice of about 16 units (0.096 degrees), not every 0.006 degree step, so roughly 700 distinct levels appear across the full swath; this is the delivered field, not a recipe transform. Values follow the file's delivered point order (stored in LASzip 50,000-point chunks; GPS time is not monotonic within a chunk, so the delivery is not in pure acquisition order); the build does not reorder."
role = "primary"
representation_class = "native_numeric"
representation_notes = "LAS 1.4 PDRF 6 stores the scan angle as a signed little-endian int16 at record bytes 18-19. The sample keeps those two bytes unchanged; coordinates, intensity, return/flag bytes, classification, user data, point source id and GPS time are not emitted."
source_resources = ["laz_tiles"]
source_format = "LAZ (LASzip 3.4r3 layered-chunked compressor, POINT14 v3 item, 50,000-point chunks) encoding LAS 1.4 point data record format 6, 30-byte records"
source_field = "scan angle (signed int16, 0.006 degree increments, bytes 18-19 of each LAS 1.4 PDRF-6 point record)"
filtered_input_path = "filtered/usgs_3dep_cameronpeak_vq1560ii_scan_angle_i16/build_stats.json"
filtering = "24 tiles chosen by the selection rule. All points of each selected tile are kept regardless of classification, withheld (class 7/18 noise), overlap, synthetic or scanner-channel flags; every other field is dropped."
missing_value_policy = "The LAS scan angle has no missing sentinel (0 means nadir and is a valid angle). Every record is kept. The decoded record count must equal the header point count (== VPC pc:count), the decoded per-return histogram must equal the header's extended points-by-return counts, and every value must lie within -30,000..30,000; any violation is fatal in build.sh and verify.sh. Nothing is dropped, reordered, clipped or imputed."
conversion = "Decode each tile chunk by chunk with tools/laz/laszip.py iter_chunks; interleave records[18::30] and records[19::30] into little-endian int16 bytes; one sample file <tile file stem>.scan_angle_i16.bin per tile, value i = point i in file order."
numeric_kind = "int"
bit_width = 16
endianness = "little"
sample_format = "raw int16 1-D array"
sample_geometry = "per_point_attribute_in_file_point_order"
sample_rank = 1
sample_axes = ["point"]
natural_record_kind = "complete_published_usgs_3dep_laz_tile"
sample_count = 24
