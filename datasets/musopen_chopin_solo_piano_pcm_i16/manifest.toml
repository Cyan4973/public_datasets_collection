download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/musopen_chopin_solo_piano_pcm_i16/samples.jsonl"
summary = "Fetch the 39 pinned 16-bit/44.1 kHz/stereo Prelude and Etude FLAC tracks plus rights evidence, decode each track with ffmpeg to raw signed 16-bit little-endian interleaved stereo PCM without resampling or channel changes, and emit one sample per complete piece with a sample index."
deterministic_notes = "Selection was resolved by scripts/discover.sh: from the IA metadata, every *.flac whose name contains 'Prelude' or 'tude' (52 files, no cello-sonata tracks), keep those whose STREAMINFO (read from an 8 KiB range request) is 44100 Hz / 2 ch / 16 bps: 40 files. Excluded at 16 bps: the 12 Op. 10 Etudes at 48 kHz; no Prelude/Etude file is 24-bit or 96 kHz. One further exclusion after a spectral audit (EXCLUDED in scripts/musopen_chopin.py): Etude B. 130 (sole Donald Betts track) has a brick-wall cutoff (-116 dB above 15 kHz, digital zero above 18 kHz), the signature of a lossy or low-passed master, unlike the smooth -80..-100 dB high-band noise floor of the other 39; 39 files kept. The pinned table fixes IA name, size, md5, total_samples and STREAMINFO MD5. Build asserts decoded bytes == total_samples*2*2 and MD5(decoded PCM) == STREAMINFO MD5 (bit-exact lossless decode), sorts by sample_id, and never concatenates pieces. Pieces that are constant, >50% zero values, >50% leading+trailing digital silence, dual-mono, lacking odd values, or with <1024 distinct values are fatal."

[[series]]
id = "chopin_solo_piano_pcm_s16_stereo"
description = "Decoded 16-bit stereo PCM of one complete solo-piano Prelude or Etude recording."
semantic_meaning = "Signed 16-bit linear PCM amplitude of a professionally recorded acoustic solo-piano performance, interleaved left/right at 44.1 kHz, exactly as stored (losslessly) in the Musopen FLAC track."
role = "primary"
representation_class = "native_numeric"
representation_notes = "FLAC is lossless; the emitted values are the native 16-bit PCM samples, verified bit-exact against the FLAC STREAMINFO MD5 signature."
source_resources = ["flac_tracks"]
source_format = "FLAC (STREAMINFO 44100 Hz, 2 channels, 16 bits per sample)"
source_field = "decoded interleaved PCM audio samples (left, right)"
filtered_input_path = "filtered/musopen_chopin_solo_piano_pcm_i16/ingest_stats.json"
filtering = "Keep only the 39 pinned Prelude/Etude tracks at 44.1 kHz/stereo/16-bit; exclude 48 kHz and 96 kHz tracks, all 24-bit tracks, the spectrally band-limited Etude B. 130, the Cello Sonata and all other genres. Each complete track is kept whole, including any leading/trailing room tone or silence (recorded per sample in the index)."
missing_value_policy = "No missing values exist in PCM. Missing files, md5/size/STREAMINFO mismatches, decoder errors, decoded length != total_samples*2 values, MD5-signature mismatch, and degenerate pieces (see deterministic_notes) are fatal; nothing is trimmed or imputed."
conversion = "ffmpeg -i <track>.flac -map 0:a:0 -vn -f s16le -acodec pcm_s16le <sample>.bin (no -ar/-ac, so no resampling, remixing or dithering); output is raw little-endian int16, frames interleaved L,R; one .bin per piece named by sample_id."
