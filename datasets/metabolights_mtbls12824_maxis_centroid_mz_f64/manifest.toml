deterministic_notes = "Fixed 20-run selection (scripts/runs.tsv, sizes + SHA-256 pinned and cross-checked against upstream HASHES/data_sha256.json). Every spectrum must be ms level 1, MS1 spectrum, negative scan, centroid, with one 64-bit-float zlib m/z array and one 64-bit-float zlib intensity array whose decoded lengths equal defaultArrayLength; spectrumList count must match. No length filtering, no concatenation; zero-length spectra (if any) are counted and emit nothing. verify.sh re-decodes with an independent line-streaming regex decoder and compares index rows, sample SHA-256, and manifest totals."

[[series]]
id = "neg_hilic_ms1_centroid_mz_f64"
description = "Negative-ion HILIC MS1 centroid peak m/z arrays (float64)."
semantic_meaning = "Calibrated mass-to-charge ratios (m/z, Th) of the centroided peaks in one negative-ion MS1 survey scan of a human skeletal-muscle extract, ascending within the scan as stored by the instrument software."
role = "primary"
representation_class = "native_numeric"
representation_notes = "mzML declares the array '64-bit float' (MS:1000523); values use the full binary64 mantissa (0 of the 45,760,543 emitted values is exactly representable as float32). Bytes are emitted exactly as decoded, without rescaling or reordering."
source_resources = ["neg_hilic_tissue_runs"]
source_format = "PSI mzML 1.1 (indexedmzML, ProteoWizard 3.0.24214 from Bruker BAF, CompassXtract peak picking)"
source_field = "spectrum.binaryDataArray[m/z array MS:1000514, 64-bit float, zlib] of MS1 negative-scan centroid spectra"
filtered_input_path = "filtered/metabolights_mtbls12824_maxis_centroid_mz_f64/spectrum_stats.json"
filtering = "Keep every spectrum of the 20 pinned NEG_N/NEG_V tissue runs (all are MS1). POS, Blank, QC and PRERUN runs are not downloaded. Intensity arrays (integral detector counts stored as float64) are decoded for validation only and discarded."
missing_value_policy = "Wrong MS level/polarity/spectrum type, missing or extra arrays, non-64-bit or non-zlib declarations, base64/zlib failures, decoded length != defaultArrayLength, non-finite or out-of-range (outside 1..5000) m/z, descending m/z, and spectrumList count mismatches are fatal. Zero-length spectra emit no sample and are counted in spectrum_stats.json."
conversion = "base64-decode, zlib-decompress, check length = 8 * defaultArrayLength, write the resulting IEEE-754 binary64 little-endian bytes unchanged as one .bin per spectrum."
numeric_kind = "float"
bit_width = 64
endianness = "little"
sample_format = "raw homogeneous little-endian float64 m/z array"
sample_geometry = "centroid_peak_mz_array"
sample_rank = 1
sample_axes = ["centroid_peak"]
natural_record_kind = "negative_ion_ms1_centroid_spectrum"
sample_count = 24622
total_size_bytes = 366084344
