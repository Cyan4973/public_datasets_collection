download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/nasa_pds_voyager1_pws_wideband_waveform_u8/samples.jsonl"
summary = "Fetch 400 pinned Voyager 1 PWS 48-second waveform frames plus labels (size + upstream MD5 pinned), validate labels and every record, and emit for each frame the 4-bit waveform codes of its kept lines (samples 17-1600 of each line, high nibble first) as one raw uint8 sample."
deterministic_notes = "Selection (discover.py, resolved 2026-10-09 from INDEX.TAB): all 11,415 VGPW_1001 frames sorted by START_TIME, split into eight strata by the DATASET.CAT event table: A 1978-08-01..1979-02-28 pre-Jupiter (pool 562, 40 picks), B 1979-02-28..1979-03-23 Jupiter bow shock to bow shock (6,490, 100), C 1979-03-23..1980-11-11 Jupiter-Saturn cruise (121, 30), D 1980-11-11..1980-11-17 Saturn (41, 20), E 1980-11-17..1992-11-03 cruise with all lines (579, 70), F 1992-11-03..2004-12-16 cruise with 1-in-5 lines (1,005, 50), G 2004-12-16..2012-08-25 heliosheath (809, 40), H 2012-08-25..2023-11-07 interstellar (1,808, 50). Picks at ranks floor((i + 0.5) * n / k); a pick whose DAT has fewer than 512 records (HTTP Content-Length < 524,288) is replaced by the next unused rank (33 replacements). Label checks: DATA_SET_ID VG1-J/S/SS-PWS-1-EDR-WFRM-60MS-V1.0, INSTRUMENT_HOST_ID VG1, PRODUCT_ID and START_TIME equal the pin, RECORD_BYTES 1024, FILE_RECORDS * 1024 = DAT size, START_BYTE 221, START_BIT 1, ITEM_BITS 4, OFFSET -7.5, VALID 0-15, 0.00003472222 s sample interval. DAT header ASCII at byte 249 must start 'VOYAGER-1 PWS'. Line rule (build; re-implemented independently in verify): FDS_LINE_COUNT (MSB u16, bytes 23-24) outside 1..800 or not above the last in-order line count -> dropped; 800 waveform bytes all zero -> dropped (archive fill); waveform bytes identical to the last kept line -> dropped (archive 5x repetition after 1992-11-03); otherwise bytes 229-1020 unpacked high nibble first -> 1584 codes. Frame rule: emitted only if kept_lines >= 50, >= 6 distinct codes and the most common code <= 80% of the sample. verify.py re-derives each sample, byte-compares it, checks DAT SHA-256 against download_plan.tsv and MD5 against sources.tsv, label fields, index fields (size, sha256, min/max, distinct, line counts, stratum), value_count = 1584 * kept_lines, max code <= 15, no duplicates, all eight strata present, all 16 codes used overall, no code above 50% of all values, floors, 1 GB cap, and manifest sample_count/total_size_bytes."

[[series]]
id = "vg1_pws_wideband_4bit_code_u8"
description = "Voyager 1 PWS wideband electric-field waveform 4-bit codes (0-15) stored one per byte, one sample per 48-second frame."
semantic_meaning = "Raw 4-bit linear quantization codes of the electric field on the Voyager 1 dipole antenna after a 40 Hz-12 kHz bandpass and an automatic gain control, sampled at 28,800/s in 1600-sample (55.56 ms) lines every 60 ms: Jupiter and Saturn magnetospheric plasma waves (chorus, hiss, electron-cyclotron harmonics, upper-hybrid and plasma-frequency emissions, lightning whistlers), interplanetary shocks, heliosheath and interstellar plasma oscillations, dust impacts, plus receiver noise and spacecraft interference tones. Zero field is nominally code 7.5 (label OFFSET -7.5: code c maps to c - 7.5). The AGC gain is not telemetered, so the amplitude scale varies with time and there is no calibration to physical units; the code lattice and generation process are fixed."
role = "primary"
representation_class = "native_numeric"
representation_notes = "PDS label BIT_COLUMN WAVEFORM_SAMPLES: BIT_DATA_TYPE UNSIGNED_INTEGER, ITEMS 2, ITEM_BITS 4, START_BIT 1, OFFSET -7.5, VALID_MINIMUM 0, VALID_MAXIMUM 15, SAMPLING_PARAMETER_INTERVAL 0.00003472222 s. Each 4-bit code is stored unchanged in its own uint8 (values 0-15); uint8 is the narrowest repository width, as for other sub-byte native codes. No offset, calibration or remapping is applied."
source_resources = ["vg1_pws_waveform_frames"]
source_format = "PDS3 detached-label fixed-length binary frame (Cmmmmmnn.DAT): record 1 = engineering header; records 2..FILE_RECORDS = 220-byte big-endian WF_ROW_PREFIX + 800-byte TIME_SERIES WAVEFORM_BYTE column of packed 4-bit samples + 4 spare bytes"
source_field = "TIME_SERIES WAVEFORM_BYTE / BIT_COLUMN WAVEFORM_SAMPLES (4-bit unsigned waveform codes, high nibble first), samples 17-1600 of each kept line"
filtered_input_path = "filtered/nasa_pds_voyager1_pws_wideband_waveform_u8/ingest_stats.json"
filtering = "Frames: 400 Voyager 1 frames from VGPW_1001 only (VGPW_2001 / Voyager 2 excluded), stratified over eight mission phases, DAT >= 512 records. Lines: records with out-of-range or out-of-order FDS_LINE_COUNT, all-zero (fill) waveform bytes, or waveform bytes identical to the last kept line (archive 5x repetition after 1992-11-03) are dropped. The first 16 samples (8 bytes) of every kept line are dropped on every frame, following DATASET.CAT ('for data acquired during the Voyager 1 Jupiter Encounter mission phase, it is usually the case that the first 16 samples (8 bytes) of waveform data per data line are invalid. Hence, it is strongly recommended that these bytes be skipped'); the volume's example C code also suggests skipping zero-filled or duplicate records and the first 16 samples. Frames with < 50 kept lines, < 6 distinct codes, or one code above 80% are not emitted (rule shared by build and verify)."
missing_value_policy = "Missing lines are not represented (kept lines are concatenated in line order; gaps of 4.44 ms between lines, and 4 missing lines between returned lines after 1992-11-03, are implicit). All-zero fill lines, repeated lines, out-of-order line records and the invalid first 16 samples per line are never emitted. No code inside a kept line is masked, clipped, interpolated or rescaled; codes 0 and 15 (AGC saturation) are preserved. Any size/MD5/SHA-256 mismatch, label deviation, non-Voyager-1 header or record-count inconsistency fails the recipe."
conversion = "For each pinned frame: check the detached label, walk the 1024-byte records 2..FILE_RECORDS, read FDS_LINE_COUNT as big-endian u16 at bytes 23-24 (1-based), apply the line rule, and for each kept line split bytes 229-1020 into two 4-bit codes, high nibble first (verified byte-exact against EXTRAS/SOFTWARE/C/TESTOUT.TXT produced by the volume's VGPWS_WF_LIST.C on TESTIN.DAT). Write the concatenated codes (1584 per kept line) as samples/nasa_pds_voyager1_pws_wideband_waveform_u8/vg1_pws_wideband_4bit_code_u8/<PRODUCT_ID>.u8. Byte order is irrelevant for 8-bit values."
numeric_kind = "uint"
bit_width = 8
endianness = "little"
sample_format = "raw homogeneous uint8 4-bit waveform codes (0-15)"
sample_geometry = "frame_sequence_of_agc_waveform_lines_1d"
sample_rank = 1
sample_axes = ["line_then_sample_time"]
natural_record_kind = "voyager_pws_48s_waveform_frame"
sample_count = 400
total_size_bytes = 361186848
output_path = "samples/nasa_pds_voyager1_pws_wideband_waveform_u8/vg1_pws_wideband_4bit_code_u8/"
