manifest_version = 1
dataset_id = "ooi_ce02shbp_vel3d_adv_amplitude_correlation_u8"
name = "OOI Oregon Shelf Seafloor Nortek Vector ADV (VEL3D-C) Beam Amplitude and Correlation UInt8"
description = "Native uint8 per-beam acoustic return amplitude (counts) and Doppler beam correlation (%) at 8 Hz from the Nortek Vector ADV on the OOI Cabled Endurance Array Oregon Shelf benthic package (CE02SHBP-LJ01D, ~80 m), one beam-planar sample per complete UTC day across a single instrument deployment."
homepage = "https://rawdata.oceanobservatories.org/files/CE02SHBP/LJ01D/VEL3DC108/"

[license]
name = "OOI Data Use Policy 1102-00010 v2-00 with User Terms and Conditions 1102-00020"
spdx = "LicenseRef-OOI-Data-Use-Policy"
url = "https://oceanobservatories.org/wp-content/uploads/2024/01/1102-00010_Data_Use_Policy_OOI.pdf"
citation = "Ocean Observatories Initiative (OOI), funded by the U.S. National Science Foundation. Cabled Endurance Array, Oregon Shelf Seafloor (CE02SHBP-LJ01D) 3-D Single Point Velocity Meter VEL3D-C (VEL3DC108) raw data, https://rawdata.oceanobservatories.org/files/CE02SHBP/LJ01D/VEL3DC108/, accessed 2026-10-09."
notes = "Data Use Policy section 4.1: 'all OOI data will be made publicly available, free of charge ... The User is granted the right to use OOI data and web sites for any legal and non-prohibited purpose whatsoever ... -- to access, link to and use, create derivative works, publish, distribute, disseminate, transfer, or copy.' The User Terms and Conditions (1102-00020) add the NSF/OOI acknowledgement requirement. Not an SPDX license; a broad written grant plus mandatory attribution. Policy PDF sha256 52dc5db1709f3a264eec678fa8e71a107d3209b83f5ee7999ea1bf11d8b990d2 (2026-10-09)."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official OOI raw-data archive (Oregon State University / OOI Cabled Array), anonymous HTTPS. Seafloor oceanographic instrument telemetry; no human subjects."
usage_notes = "Only the per-beam amplitude and correlation bytes of checksum-valid Nortek Vector Velocity Data packets are emitted; port-agent framing, velocities, pressure and system packets are not emitted."

