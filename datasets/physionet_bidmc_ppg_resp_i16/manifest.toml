[[series]]
id = "bidmc_pleth_adc_i16"
description = "Complete eight-minute photoplethysmographic optical pulse waveform ADC sequences."
semantic_meaning = "Successive native integer codes from the bedside monitor's PLETH optical blood-volume pulse channel."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The WFDB headers declare scalar format 16, which stores two-byte little-endian signed integers. Values remain raw stored ADC codes rather than being converted through channel gain."
source_resources = ["bidmc_wfdb_records"]
source_format = "Interleaved WFDB format 16"
source_field = "PLETH"
filtered_input_path = "filtered/physionet_bidmc_ppg_resp_i16/ingest_stats.json"
filtering = "Keep the one complete PLETH channel from each of all 53 records; discard every other channel and all header comments or metadata."
missing_value_policy = "No selected values are dropped or imputed. Missing, malformed, checksum-invalid, constant, duplicate, or changed records fail the recipe."
conversion = "Deinterleave the complete native PLETH value stream and serialize the unchanged signed values as canonical little-endian int16."
numeric_kind = "int"
bit_width = 16
endianness = "little"
sample_format = "raw homogeneous little-endian signed-int16 ADC sequence"
sample_geometry = "fixed_length_clinical_waveform_1d"
sample_rank = 1
