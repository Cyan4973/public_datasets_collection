[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/noaa_dcdb_rainier_em2040_seabed_image_i16/samples.jsonl"
summary = "Walk every Kongsberg .all datagram (u32 length, STX, type, model, ETX, 16-bit byte-sum checksum) of each pinned EM2040 file, parse every seabed-image 'Y' (0x59) datagram, and emit per file the concatenation of all Y beam-snippet int16 samples in ping (file) order, with the per-beam sample counts as an auxiliary layout series."
deterministic_notes = "Pinned object list with sizes and locally recomputed S3 ETags; full-file datagram scan in download, build and verify. Framing errors are resynchronised by scanning to the next correctly framed datagram; a file may lose at most 16 such spans and max(0.1 %, 64 KiB) of its bytes, and every span is recorded in ingest_stats.json. Fatal: any framed datagram with model != 2040, a Y datagram with system serial != 40129, beam count != 400, implausible sampling frequency, or a length that does not equal header + 6*Nbeams + 2*sum(Nsamples) + optional zero pad + ETX/checksum; also decreasing Y timestamps, duplicate pings, duplicate file payloads, or primary output > 1e9 bytes. Files are processed in chronological order and Y datagrams in file order. verify.sh re-decodes with an independent reader (it does not import the build module) and compares sample bytes, index fields, stored-int16 min/max/distinct/zero counts, hashes, unframed-span accounting and manifest totals, and rejects constant or degenerate payloads (< 64 distinct values or range < 100)."

[[series]]
id = "em2040_seabed_image_backscatter_i16"
description = "Kongsberg EM2040 seabed-image (beam snippet) backscatter samples, one whole raw .all survey-line file per sample."
semantic_meaning = "Seabed backscatter strength in 0.1 dB steps, as logged by the EM2040 in its seabed-image datagram. For every ping, each of the 400 beams contributes Ns consecutive range samples around the bottom detection (the beam snippet), with the sonar's real-time TVG and backscatter normalisation (BSN/BSO, recorded per datagram) applied. Most values lie between -10 and -50 dB (-100..-500 stored); the build saw -123.5 to +106.6 dB overall; per-file maxima are +5.3..+36.4 dB except file 0035 (the only all-9.08 kHz-mode file) runs clearly hotter (median -7.9 dB, 3.8 % of values above +20 dB). A sample is every Y datagram of one survey-line file in ping order, with beams in datagram order and samples in range order."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The int16 little-endian sample words are copied unchanged from the Y datagram sample block. The 36-byte datagram header, the 6-byte beam entries, the optional zero pad byte, ETX and the checksum are removed. Snippets are ragged: Ns varies per beam and ping with depth, pulse and sampling mode, and em2040_beam_sample_count_u16 gives the boundaries. No rescaling."
source_resources = ["richard2023l4_em2040_all_files"]
source_format = "Kongsberg EM-series .all datagram stream (MB-System format 58, MBF_EM710RAW), seabed image datagram 89 'Y' (0x59), EM2040"
source_field = "Seabed image data 89 sample amplitudes (int16, 0.1 dB)"
filtered_input_path = "filtered/noaa_dcdb_rainier_em2040_seabed_image_i16/ingest_stats.json"
filtering = "All Y datagrams of the 20 pinned raw EM2040 files of launch 2802. Other datagram types (P, n, N, O, X, A, C, R, G, I, U, i, 0, 1 and any others) are framing-checked and skipped. Excluded: the S221 .kmall files, all MB-System derivatives in the same folder, and the 16 largest raw files."
missing_value_policy = "No sample is dropped, clipped, rescaled or imputed. The probed files contain no fill code (no -32768 values); 0 values are genuine 0 dB readings and rare. Beams flagged invalid in the detection-info byte keep their logged snippet samples. A Y datagram is lost only if its framing or checksum is broken (resync policy above); every such span is reported and bounded."
conversion = "Process files in chronological order and parse each Y datagram. Header at +6: model u16, date u32, time u32, ping counter u16, serial u16. Then sampling frequency f32, R0 u16, BSN i16, BSO i16, Tx beamwidth u16, TVG crossover u16, Nbeams u16. Then Nbeams x (sorting direction i8, detection info u8, Ns u16, centre sample u16), then sum(Ns) x int16 LE. Concatenate the int16 sample blocks of all Y datagrams in file order and write the result unchanged as one raw little-endian int16 file. Index min/max come from the stored int16 values."
numeric_kind = "int"
bit_width = 16
endianness = "little"
sample_format = "raw signed-int16 seabed-image backscatter vector (ragged beam snippets of all pings concatenated)"
sample_geometry = "em2040_file_ping_beam_snippets_ragged"
sample_rank = 1
sample_axes = ["ping_beam_sample"]
natural_record_kind = "raw_all_file_seabed_image_samples"
sample_count = 20
total_size_bytes = 346774682
output_path = "samples/noaa_dcdb_rainier_em2040_seabed_image_i16/em2040_seabed_image_backscatter_i16/"

