dataset_id = "noaa_cdr_seaice_conc_nh_daily_u8"
name = "NOAA/NSIDC Sea-Ice Concentration CDR v4 Northern-Hemisphere Daily Grids UInt8"
description = "Every 2022-2024 daily Northern-Hemisphere cdr_seaice_conc raster (F17, v04r00) of the NOAA/NSIDC passive-microwave sea-ice concentration climate data record, decoded from NetCDF4 with a pure-stdlib HDF5 reader to one native uint8 448x304 grid per day."
homepage = "https://www.ncei.noaa.gov/products/climate-data-records/sea-ice-concentration"

[license]
name = "NOAA open data (U.S. Government work, no restrictions on use)"
spdx = "LicenseRef-NOAA-NODD-Open-Data"
url = "https://registry.opendata.aws/noaa-cdr-oceanic/"
citation = "Meier, W. N., F. Fetterer, A. K. Windnagel, and J. S. Stewart. NOAA/NSIDC Climate Data Record of Passive Microwave Sea Ice Concentration, Version 4. Boulder, Colorado USA. NSIDC: National Snow and Ice Data Center. https://doi.org/10.7265/efmz-2t65"
notes = "Registry of Open Data on AWS entry for the NOAA CDR oceanic buckets (including noaa-cdr-sea-ice-concentration-pds): 'NOAA data disseminated through NODD are open to the public and can be used as desired ... NOAA requests attribution'. The bucket's documentation/UseAgreement_01B-11.pdf states 'the CDR data sets are non-proprietary, publicly available, and no restrictions are placed upon their use' and asks for acknowledgement/citation. Every file carries the global attribute license = 'No constraints on data access or use' (checked per file by build and verify). Preserve NOAA/NSIDC attribution and the DOI."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official NOAA Climate Data Record files from the NOAA Open Data Dissemination (NODD) S3 bucket; gridded geophysical satellite retrievals with no personal content."
usage_notes = "Public U.S. Government environmental data suitable for model training with NOAA/NSIDC attribution retained."

