[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/zenodo_mturk_fitbit_heartrate_u8/samples.jsonl"
summary = "Download the two pinned Zenodo zips, read only heartrate_seconds_merged.csv from each, group rows by participant Id within each export, sort by parsed local timestamp, and emit the bpm Value column as one uint8 sample per (participant, export)."
deterministic_notes = "Zip sizes and MD5s are pinned; member uncompressed sizes and CRC32s are pinned and checked on read. Exact duplicate rows are removed (first occurrence kept). Timestamps (M/D/YYYY h:mm:ss AM/PM, naive local time) are parsed and each Id's rows are stably sorted by (time, source row order); rows sharing a timestamp with different values are kept in source order and counted in the index. Rows outside the export's nominal date window are dropped (removes the 23,424 export-1 rows on 2016-04-12 that duplicate export 2 exactly). The two exports are never merged. (Id, export) series with fewer than 1,000 values are dropped. Participant ordinals are ranks of the numeric Id over the union of heart-rate Ids in both exports. verify.sh re-derives every sample with a separate parser and compares bytes, index fields, hashes and manifest totals, and rejects samples with fewer than 10 distinct values or duplicate payloads."

[[series]]
id = "fitbit_heartrate_bpm_u8"
description = "Fitbit intraday wrist optical heart rate in beats per minute."
semantic_meaning = "Successive heart-rate readings (integer bpm) reported by one participant's Fitbit tracker during one export period, in time order. Sampling is irregular: about 5 s while the tracker reports continuously, with longer gaps when it is not worn or not syncing; the gaps are not encoded."
role = "primary"
representation_class = "native_numeric"
representation_notes = "Upstream values are integer bpm; they are stored unchanged as uint8."
source_resources = ["export_2016_03_12_to_04_11", "export_2016_04_12_to_05_12"]
source_format = "Fitabase CSV export (Id,Time,Value) inside the Zenodo zip"
source_field = "heartrate_seconds_merged.csv Value column (heart rate, bpm)"
filtered_input_path = "filtered/zenodo_mturk_fitbit_heartrate_u8/ingest_stats.json"
filtering = "Keep every heart-rate row of every Id in both exports whose local date lies inside that export's nominal window (2016-03-12..2016-04-11, 2016-04-12..2016-05-12), minus exact duplicate rows. This removes 23,424 export-1 rows dated 2016-04-12, all exact (Id, Time, Value) copies of export-2 rows. Drop any (Id, export) series with fewer than 1,000 values. No other files or columns are read."
missing_value_policy = "There is no fill value upstream. Values outside 1..255, malformed rows or unparseable timestamps fail the build. Exact duplicate rows are removed. Time gaps are not filled or interpolated."
conversion = "Decode the ASCII CSV, parse Value as an integer, assert 1 <= v <= 255, stably sort each Id's rows by parsed timestamp, and write one byte per reading. Sample = one participant within one export period."
numeric_kind = "uint"
bit_width = 8
endianness = "little"
sample_format = "raw homogeneous uint8 heart-rate array"
sample_geometry = "irregular_time_series_1d"
sample_rank = 1
sample_axes = ["reading_time_order"]
natural_record_kind = "participant_export_period_heart_rate_series"
sample_count = 27
