manifest_version = 1
dataset_id = "nasa_pds_voyager_iss_saturn_raw_u8"
name = "Voyager 2 ISS Narrow-Angle Saturn-Encounter Raw Vidicon Frames (8-bit DN)"
description = "Full 800x800 unsigned-byte raw vidicon frames from the Voyager 2 Imaging Science Subsystem narrow-angle camera, Saturn and ring targets, 1981-08-22 to 1981-08-31, scan rate 3:1, full-resolution edit mode, decoded from the PDS Rings Node VGISS_0005 decompressed raw images (Cnnnnnnn_RAW.IMG) with the per-line 224-byte engineering prefix removed."
homepage = "https://asc-pds-voyager.s3.us-west-2.amazonaws.com/VGISS_0005/AAREADME.TXT"

[license]
name = "NASA SMD Open Scientific Data Policy (public NASA PDS mission data)"
spdx = "LicenseRef-NASA-SMD-Open-Data"
url = "https://science.nasa.gov/researchers/science-data/science-information-policy/"
citation = "Showalter, M.R., M.K. Gordon, and D. Olson, VG1/VG2 SATURN ISS PROCESSED IMAGES V1.0, VGISS_0001-0038, NASA Planetary Data System, 2006. Acknowledge the Voyager Imaging Team led by Dr. Brad Smith."
notes = "Voyager is a NASA mission; these products are archived by the NASA Planetary Data System (PDS Rings Node data set VG1/VG2-S-ISS-2/3/4/6-PROCESSED-V1.0) and served from the public anonymous asc-pds-voyager S3 bucket (USGS Astrogeology, PDS Cartography and Imaging Sciences Node). NASA SMD policy: information produced from SMD-funded scientific research is held as a public trust, made publicly available, and openly shared. Same rights basis as the accepted nasa_pds_cassini_vims_qube_i16 and nasa_pds_mastcamz_raw_i16 recipes. The volume AAREADME.TXT imposes no use restriction; it only asks users to cite the PDS Rings Node data set and acknowledge the Voyager imaging team. download.sh fetches that AAREADME from the bucket (size/MD5 pinned) and fails unless the citation request and DATA_SET_ID are present. The NASA policy page itself is not fetched by download.sh because science.nasa.gov is unreachable through the collection proxy."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official NASA PDS archive objects over anonymous HTTPS from the asc-pds-voyager public bucket; 1981 robotic spacecraft camera frames of Saturn and its rings."
usage_notes = "Only image DN values are emitted. VICAR labels (which contain the archivist processing user name), binary engineering headers, line prefixes and PDS label text are never written to samples. Index rows carry only observation metadata (FDS image number, image id, time, target, filter, exposure, shutter mode)."

