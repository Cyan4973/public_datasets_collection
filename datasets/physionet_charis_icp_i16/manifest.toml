manifest_version = 1
dataset_id = "physionet_charis_icp_i16"
name = "PhysioNet CHARIS Intracranial Pressure Channel Waveforms Int16"
description = "The complete 50 Hz ICP channel of the 9 majority-ICP records of the PhysioNet CHARIS database 1.0.0 (multi-day neuro-ICU monitoring after brain injury): the publisher's auto-scaled WFDB format-16 stored values, one signed-int16 sample per patient recording. charis8, charis9, charis10 and charis12, whose ICP channel is not majority ICP waveform, are excluded."
homepage = "https://physionet.org/content/charisdb/1.0.0/"

[license]
name = "Open Data Commons Attribution License v1.0"
spdx = "ODC-By-1.0"
url = "https://opendatacommons.org/licenses/by/1-0/"
citation = "Kim N, Krasner A, Kosinski C, Wininger M, Qadri M, Kappus Z, Danish S, Craelius W. Trending autoregulatory indices during treatment for traumatic brain injury. J Clin Monit Comput (2016) 30: 821. doi:10.1007/s10877-015-9779-3. CHARIS database v1.0.0, PhysioNet, DOI 10.13026/C24G6F. Standard PhysioNet citation: Goldberger A, et al. PhysioBank, PhysioToolkit, and PhysioNet. Circulation 101(23):e215-e220 (2000); and Pollard T, et al. PhysioNet as a global platform for biomedical research. Nature Health (2026), doi:10.1038/s44360-026-00096-z."
notes = "The release ships no LICENSE file. The PhysioNet project page states 'Access Policy: Anyone can access the files, as long as they conform to the terms of the specified license. License: Open Data Commons Attribution License v1.0' and links the license view page /content/charisdb/view-license/1.0.0/, which carries the ODC-By 1.0 text. download.sh saves both pages and requires those statements. Same license and open-access class as the accepted physionet_bidmc_ppg_resp_i16 and physionet_circor_pcg_i16 recipes. Preserve the article, dataset DOI, and PhysioNet attribution."

[safety]
contains_sensitive_data = true
contains_personal_data = true
provenance_notes = "De-identified clinical waveforms from patients with traumatic brain injury or other acute brain injury in the surgical ICU of Robert Wood Johnson Medical Center (Rutgers), published by PhysioNet as an open-access (non-credentialed) database. Records are named charis1..charis13. Upstream .hea headers carry comment lines with age, sex, diagnosis group and outcome (and, for charis9, a signal-quality note)."
usage_notes = "Treat as sensitive human clinical material. Emitted samples contain only the ICP-channel stored values. Header comment lines are discarded on parse; the demographic and outcome fields (age, sex, diagnoses, outcome) are never written to samples, index rows, ingest stats or logs, and verify.sh fails if such text appears in the index or stats. The only header-derived text in the outputs is the pinned exclusion reason for charis9, which quotes its signal-quality note ('Intermittent, discontinuous ICP signal'). The ABP and ECG channels are read only to validate WFDB checksums and are not emitted."

