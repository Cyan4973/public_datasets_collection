role = "primary"
representation_class = "derived_operational_numeric"
representation_notes = "Published decimal SWC parent identifiers are represented exactly as signed 32-bit integers."
source_resources = ["mouselight_completed_swc_selection"]
source_format = "SWC seven-column neuron morphology text"
source_field = "parent node ID column"
filtered_input_path = "filtered/janelia_mouselight_neuron_trees_32bit/ingest_stats.json"
filtering = "Keep the complete parent-reference field from each of 256 selected consensus axon SWCs; exclude the trivial sequential node-ID column."
missing_value_policy = "Each tree must have exactly one -1 root and every other parent must reference an earlier node; invalid links, changed source identities, degenerate fields, or duplicate outputs fail the recipe."
conversion = "Parse source decimal parent identifiers exactly and serialize as canonical little-endian signed int32 in SWC node order."
numeric_kind = "int"
bit_width = 32
endianness = "little"
sample_format = "raw homogeneous little-endian int32 neuron-tree parent-reference array"
sample_geometry = "rooted_neuron_tree_parent_pointer_1d"
sample_rank = 1
sample_axes = ["swc_node_order"]
