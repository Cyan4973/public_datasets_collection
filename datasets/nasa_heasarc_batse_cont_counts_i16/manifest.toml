[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/nasa_heasarc_batse_cont_counts_i16/samples.jsonl"
summary = "Fetch 50 pinned BATSE CONT daily gzip-FITS files, walk FITS headers to the BATSE_CNTS binary table by EXTNAME, validate its 13-column schema, and write the whole COUNTS column (128 big-endian int16 per row, detector axis fastest) of every row as one little-endian int16 sample per day."
deterministic_notes = "Day selection (scripts/select_days.py, run once by discover.sh): 50 targets t_k = 8362 + (k + 0.5) * 3329 / 50 over the full TJD span; each snaps to the nearest day (ties to the lower TJD) whose file is >= 5,000,000 bytes and whose BATSE_CNTS NAXIS2 >= 20,000 (header read from a 64 KiB range GET). 49 targets landed on their nearest day; TJD 8729 (19,833 rows) was skipped for 8730. Identical duplicate keys (cont_10500, cont_10600 stored under two range directories with equal size and ETag) are deduplicated to the in-range directory. download.sh enforces exact size, ETag, gzip integrity, FITS identity (COMPTON GRO/BATSE/BATSE_CONT/TJD), schema and pinned NAXIS2. build.sh asserts HDU order PRIMARY, BATSE_E_CALIB, BATSE_CNTS, zero-filled table padding, and that only header-only RUN_LOG extensions (NAXIS 0; present in 3 of 50 files, TJD 8595/8928/8995, written by the 1994 FITS converter) follow the table, with their logged CONTINUOUS row count equal to NAXIS2; it also asserts the row floor, >= 256 distinct values, min < max, and <= 5% rows repeating their predecessor. verify.sh is a separate implementation (own FITS parser, struct '>128h' -> '<128h' per row) checking byte equality with the source, every index statistic, the sample inventory, and manifest totals. Floors: 191,592,448 primary values, median 3,966,976 values per sample."

[[series]]
id = "batse_lad_cont_counts_i16"
description = "Whole-day CONT count tables: for each 2.048 s accumulation, 16 energy channels x 8 Large Area Detectors of raw counts."
semantic_meaning = "Number of photon/particle events registered by one BATSE Large Area Detector (NaI(Tl) scintillator) in one of 16 pulse-height (energy-loss) channels during one 2.048 s accumulation; unit COUNTS per 2.048 s per channel."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The BATSE_CNTS binary table declares COUNTS as TFORM 128I (signed 16-bit), TDIM (8,16), TUNIT COUNTS, with no TZERO, TSCAL or TNULL; the stored words are the values. Only byte order changes. Channel energy edges vary by detector and calibration epoch (per-file BATSE_E_CALIB, 8-112 rows), and 4 of the 50 days use non-standard CONT channel ladders per their own BATSE_E_CALIB rows (TJD 8395 early-mission ladder with a populated channel 0; TJD 10126 rotated ladder with channel 0 at ~1.8 MeV; TJD 10992 and 11058 fine low-energy ladder); the stored quantity, unit, 2.048 s lattice and magnitude range are unchanged on those days (see README Homogeneity notes)."
source_resources = ["batse_cont_daily_selection"]
source_format = "gzip-compressed FITS (PRIMARY + BATSE_E_CALIB + BATSE_CNTS binary tables), BATSE CONT daily file"
source_field = "BATSE_CNTS.COUNTS (TFORM 128I, TDIM (8,16), byte offset 28 in each 336-byte row)"
filtered_input_path = "filtered/nasa_heasarc_batse_cont_counts_i16/ingest_stats.json"
filtering = "50 pinned days only (see deterministic_notes); every row of each day's BATSE_CNTS table is kept. Other CONT columns (MID_TIME, positions, DEADTIME, FLAGS, pointing) and other BATSE daily products (DISCLA, DISCSP, HER, SHER) are not emitted."
missing_value_policy = "No missing-value handling: COUNTS has no TNULL or sentinel and nothing is masked, clipped, imputed, unwrapped or dropped; every stored word is emitted. Measured over the 50 days: 323 negative words (19 days; 1.7 per million values) of two kinds: sustained runs in one detector/channel during very bright episodes where the count rises smoothly past 32767 and continues near -32000 (e.g. TJD 11125 row 8185 ch 3 det 7: 31766, 32540, -31811, -31370; the count exceeded the declared signed range and is stored modulo 2^16), and isolated single-row glitch words (e.g. 136, -30530, 3732). The FITS column declares signed TFORM I without TZERO, so the declared signed reading is kept; reading the same bits as uint16 is lossless for consumers. 93,694 values (0.05%) are >= 4096, nearly all in contiguous multi-row episodes (99.4% sit in a row adjacent to another such row) (bright transients/high-background intervals), not isolated. One all-zero row (TJD 9527 row 19277) is kept as stored. Per-sample negative_count, spike_count (>= 4096) and zero_count are in the index. Days below the 20,000-row floor were excluded at selection time, never padded or merged. verify.sh applies the same policy (byte equality with the source column)."
conversion = "For each row in source order, take the 256 bytes at row offset 28 (128 big-endian int16 in FITS column-major TDIM (8,16) order: index = channel*8 + detector), byte-swap to little-endian int16, and append. One sample per daily file: shape [rows, 16, 8], rows = NAXIS2 (20,001-37,461). No scaling, calibration, sorting, splitting or concatenation across days."
numeric_kind = "int"
bit_width = 16
endianness = "little"
sample_format = "raw homogeneous little-endian signed-int16 array"
sample_geometry = "daily_cont_counts_rows_by_channel_by_detector"
sample_rank = 3
sample_axes = ["cont_accumulation_2048ms", "energy_channel", "lad_detector"]
natural_record_kind = "batse_cont_daily_file_counts_table"
sample_count = 50
total_size_bytes = 383184896
output_path = "samples/nasa_heasarc_batse_cont_counts_i16/batse_lad_cont_counts_i16/"
