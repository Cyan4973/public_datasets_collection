source_resources = ["tpehgdb_wfdb_records"]
source_format = "WFDB format 16, 12 frame-interleaved signals per .dat"
source_field = "WFDB signals '1', '2', '3' (signal indices 0, 4, 8): unfiltered EHG channels S1, S2, S3"
filtered_input_path = "filtered/physionet_tpehg_ehg_i16/ingest_stats.json"
missing_value_policy = "No values are dropped, clipped, or imputed. WFDB's -32768 invalid-sample code and the +32767 rail are preserved unchanged and counted per sample in the index (saturated_low_count, saturated_high_count; none occur in this release). A missing file, checksum mismatch, layout deviation, lattice mismatch, constant or degenerate channel (fewer than 32 distinct values, fewer than 5% value changes, or more than 50% rail values), or duplicate sample fails the recipe."
numeric_kind = "int"
bit_width = 16
endianness = "little"
sample_format = "raw homogeneous little-endian signed-int16 ADC sequence"
sample_geometry = "variable_length_biopotential_waveform_1d"
sample_rank = 1
sample_axes = ["time_sample"]
natural_record_kind = "complete_tpehg_recording_unfiltered_bipolar_channel"
filtering = "The 126 records whose header sampling frequency is '20.000110', all frames, the three unfiltered channels of each; every channel must use at most two adjacent residues mod 16. The DOCFILT signals, header comments, tpehgdb.smr, .fvl feature files and the PDF are not emitted."
conversion = "Read each .dat as frames x 12 little-endian int16, take every 12th value starting at signal index 0, 4, and 8, and write each channel unchanged as canonical little-endian int16 to samples/physionet_tpehg_ehg_i16/tpehg_ehg_unfiltered_adc_step16_i16/<record>_ch<1|2|3>.bin. The stored codes are not divided by 16 or otherwise rescaled. One sample is one complete channel of one recording; records and channels are never concatenated or split."
sample_count = 378
