manifest_version = 1
dataset_id = "naif_mro_sc_bus_attitude_ck_f64"
name = "MRO Spacecraft-Bus Reconstructed Attitude (NAIF CK Type 3) Quaternions and Angular Rates Float64"
description = "Native float64 attitude quaternions and angular-velocity vectors of the Mars Reconnaissance Orbiter spacecraft bus, decoded from 44 whole NAIF CK type-3 segments (telemetry-based reconstructed attitude, gyro era 2007-2017) in the NASA PDS MRO SPICE archive."
homepage = "https://naif.jpl.nasa.gov/pub/naif/pds/data/mro-m-spice-6-v1.0/mrosp_1000/"

[license]
name = "U.S. Government Public Domain (NASA PDS archive; NAIF SPICE kernel rules)"
spdx = "LicenseRef-US-Government-Public-Domain"
url = "https://naif.jpl.nasa.gov/naif/rules.html"
citation = "NASA Navigation and Ancillary Information Facility (NAIF/JPL); Mars Reconnaissance Orbiter SPICE data set MRO-M-SPICE-6-V1.0 (NASA Planetary Data System), C-kernels mro_sc_psp_*.bc."
notes = "NASA/JPL mission data archived in the NASA Planetary Data System, the same rights basis as the accepted nasa_naif_de440s_spk_coefficients_f64 recipe. NAIF's published rules state: 'SPICE kernels placed on the NAIF server may be downloaded and used by anyone' and 'Redistribution of SPICE kernels distributed by NAIF is permitted as long as they have not been modified'; commercial use needs 'No fees or licensing'. The rules also say a modified kernel must carry the modifier's attribution: the emitted arrays are extracts made by this recipe, not NAIF products. JPL is operated by Caltech for NASA, so the public-domain label follows the corpus convention for NAIF data; the operative explicit permission is the NAIF rules page. The USGS Astrogeology bucket used only as a fallback is an anonymous mirror of NAIF's operational kernel server and carries no license object of its own."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official NASA PDS archive copies served by NAIF/JPL (data set MRO-M-SPICE-6-V1.0, volume MROSP_1000, data/ck). Only the pinned DAF file/summary records, PDS labels, and 44 pinned segment byte ranges are fetched. Fallback: byte-identical segment arrays on the USGS Astrogeology anonymous S3 mirror (asc-isisdata), checked against the same pins."
usage_notes = "Spacecraft engineering attitude telemetry; no personal or sensitive content. NAIF export note: SPICE data are designated publicly available; publication is not restricted under ITAR."

[[origins]]
id = "nasa_pds_naif_mro_spice"
name = "NASA PDS MRO SPICE archive (NAIF node), MRO-M-SPICE-6-V1.0 / MROSP_1000"
url = "https://naif.jpl.nasa.gov/pub/naif/pds/data/mro-m-spice-6-v1.0/mrosp_1000/data/ck/"
type = "data_portal"
notes = "Archival home of the MRO reconstructed CKs. The NAIF CK aareadme says the weekly reconstructed files 'are intended for OPS use and for archiving in PDS'. PDS copies carry an embedded PDS label (one or two extra 1024-byte comment records) relative to the operational copies."

[[origins]]
id = "usgs_astrogeology_mirror"
name = "USGS Astrogeology ISIS data bucket (anonymous S3 mirror of NAIF MRO kernels)"
url = "https://asc-isisdata.s3.us-west-2.amazonaws.com/usgs_data/mro/kernels/ck/"
type = "bucket"
notes = "Fallback only, used when the NAIF host is unreachable. Object sizes equal NAIF's operational server (pub/naif/MRO/kernels/ck); segment arrays are byte-identical to the PDS copies at addresses shifted by 128 or 256 words. No license object; rights follow the NAIF/PDS basis above."

[[resources]]
id = "pds_ck_segment_ranges"
origin = "nasa_pds_naif_mro_spice"
url = "https://naif.jpl.nasa.gov/pub/naif/pds/data/mro-m-spice-6-v1.0/mrosp_1000/data/ck/"
type = "other"
version = "MRO-M-SPICE-6-V1.0 MROSP_1000; first weekly mro_sc_psp CK of each year 2007-2017 (11 kernels), 4 segments each; listing and summaries probed 2026-10-05"
access = "Anonymous HTTPS byte-range GETs of the 44 segment arrays pinned in sources.tsv (DAF word addresses, object sizes, N, NINTS, SCLK coverage). Each range is one whole CK type-3 segment of 801,002 words."
size_bytes = 281952704
