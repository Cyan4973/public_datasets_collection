name = "Magellan Venus Full-Resolution SAR Mosaic (F-MIDR) Framelets UInt8"
description = "336 native uint8 1024x1024 framelets of Magellan S-band synthetic-aperture-radar backscatter from six full-resolution (75 m/pixel) Venus mosaic image data records on six PDS MIDR volumes."
homepage = "https://asc-pds-magellan.s3.us-west-2.amazonaws.com/mg_0046/aareadme.txt"

[license]
name = "NASA SMD Open Scientific Data Policy"
spdx = "LicenseRef-NASA-SMD-Open-Data"
url = "https://science.nasa.gov/researchers/science-data/science-information-policy/"
citation = "NASA/JPL Magellan Project, MGN-V-RDRS-5-MIDR-FULL-RES-V1.0 (Magellan Venus Radar System Derived Mosaic Image Data Record, Full Resolution), NASA Planetary Data System; served by the PDS Cartography and Imaging Sciences Node / USGS Astrogeology. Preserve mission, data-set ID, and product (F-MIDR) attribution."
notes = "NASA SMD states that information produced from SMD-funded scientific research is held as a public trust, made publicly available, and openly shared; the same evidence is accepted for nasa_pds_cassini_vims_qube_i16 and nasa_pds_mastcamz_raw_i16. Magellan was a NASA mission and these 1990-1993 archive products are distributed anonymously by the official PDS node. The policy page is proxy-blocked from this environment and was not re-fetched; download.sh does not fetch it."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official PDS3 MIDR CD-ROM volumes mirrored in the anonymous USGS Astrogeology bucket asc-pds-magellan; no third-party mirrors."
usage_notes = "Planetary radar imagery of the surface of Venus; samples hold only IMAGE-object DNs (no VICAR headers, PDS labels, or ancillary tables)."

[[origins]]
id = "asc_pds_magellan"
name = "PDS Imaging Node / USGS Astrogeology Magellan archive bucket"
url = "https://asc-pds-magellan.s3.us-west-2.amazonaws.com/?list-type=2&delimiter=/"
type = "bucket"
notes = "Anonymous S3 bucket holding the Magellan PDS3 volumes: MIDR CD-ROMs mg_0001-mg_0127, later FMAP volumes mg_11xx-14xx, GxDR mg_3001/3002, and edr/. Only F-MIDR directories (f*) on MIDR volumes are in scope; C1/C2/C3 compressed MIDRs, P-MIDRs, FMAP, GxDR and EDR are excluded."

