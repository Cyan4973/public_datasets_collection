notes = "Apache listings, 14 sol_NNNN_NNNN subdirectories. Each product is ps_calib_<SOL>_<VV>.csv plus a PDS4 XML label with file_size, records and md5_checksum. collection_ps_data_calibrated_inventory.tab (2023-07-21) lists 932 ps_calib and 589 ps_calibevent products. Probed 2026-10-08: the listings show 496 full-sol ps_calib products at ~87M (sols 169-1098). The other ps_calib products are partial sols or 2 Hz/20 Hz files of other sizes. Calibrated products are version 1.0 or 2.0 ('Time conversions updated', 2023-06-04)."

