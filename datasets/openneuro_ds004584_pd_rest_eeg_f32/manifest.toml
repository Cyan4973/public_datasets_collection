contains_personal_data = false
provenance_notes = "Public de-identified human scalp EEG released by the study authors (University of Iowa, Narayanan lab) through OpenNeuro's official S3 bucket."
usage_notes = "The source study includes 100 people with Parkinson's disease and 49 controls. This recipe keeps only de-identified EEG voltage matrices plus channel-name and acquisition sidecars needed to decode them. It never downloads or emits participants.tsv, participants.json, EEGLAB .set metadata, group labels, demographics, or clinical scores, and samples carry no diagnosis. Do not attempt re-identification or linkage to clinical data."

