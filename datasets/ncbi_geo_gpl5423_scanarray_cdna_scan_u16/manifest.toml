[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/ncbi_geo_gpl5423_scanarray_cdna_scan_u16/samples.jsonl"
summary = "Download 24 pinned ScanArray Express .tif.gz scans (12 hybridizations x Cy3/Cy5), validate pins and the exact TIFF layout, gunzip, concatenate the one-row strips in StripOffsets order, and emit each whole scan as one raw little-endian uint16 raster. Cy3 and Cy5 go to separate primary series."
deterministic_notes = "Fixed file list in sources.tsv (first 12 GSMs of GSE23678 by accession; no live listing at build time). Rows are processed in (GSM, dye) order. Samples are written as samples/<id>/<series>/<GSM>_hybNN_<cy3|cy5>.bin. The parser accepts only: 'II' 42; a single IFD (next 0) with exactly the 23 ScanArray tags; ImageWidth 2200; ImageLength 6000..8000 and equal to the pin; BitsPerSample 16; Compression 1; Photometric 1; SamplesPerPixel 1; RowsPerStrip 1; every StripByteCount 4400; strips tiling the pixel area with no gaps and ending exactly at EOF; 2540 dpi (10 um); Make 'PerkinElmer'; Model 'Express<TAB>430723...'; Software starting 'ScanArray Express'; the PerkinElmer copyright boilerplate; ImageDescription FluorName matching the filename dye, Resolution 10, ProtocolName 'Easy Scan', LaserPower 90. Build and verify fail on any duplicate raster, fewer than 1,000 distinct values, more than 5% zeros, more than 2% saturated (65535) pixels, or more than 5% constant rows. verify.sh re-derives every row with a separate streaming TIFF reader and compares it byte for byte. The parsers are self-tested on synthetic ScanArray-layout TIFFs (monotone and permuted strip placement, ten malformed variants) before every run. Floor: 24 samples, 186,067,200 values per series, median 15.5 M values per sample."

[[series]]
id = "scanarray_cy3_scan_u16"
description = "Cy3-channel full-slide scan (543 nm laser, 570 nm emission filter) of one GPL5423 spruce cDNA microarray hybridization, one scan per sample."
semantic_meaning = "Per-pixel photomultiplier fluorescence intensity in scanner digital numbers (uint16, 0..65535; linear, uncalibrated) at 10 um pitch over the scanned slide area. Rows step along the ~70 mm scanned length and columns span the 22 mm scanned width. The raster contains the printed cDNA spot lattice (hybridized Cy3-labelled cDNA), slide background, saturated spot cores and slide edges."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The scanner software stores each channel as an uncompressed 16-bit grayscale TIFF. GEO serves it gzip-wrapped. The recipe only removes the gzip and TIFF wrappers and joins the 1-row strips in order. Pixel words are already little-endian ('II') and are written unchanged; no scaling, cropping, tiling or background subtraction is applied."
source_resources = ["scan_tiff_selection"]
source_format = "Uncompressed little-endian baseline TIFF (gzip-wrapped .tif.gz) written by ScanArray Express 2.1.0.0: one IFD, 2200 x H pixels, BitsPerSample 16, Photometric BlackIsZero, 1 sample per pixel, one 4,400-byte strip per row"
source_field = "IFD0 grayscale pixel plane of the <GSM>_..._Cy3_....tif scan: Cyanine 3 channel PMT intensity"
filtered_input_path = "filtered/ncbi_geo_gpl5423_scanarray_cdna_scan_u16/ingest_stats.json"
filtering = "Only the Cy3 TIFFs of the 12 selected GSMs (GSM572663..GSM575585, hyb1..hyb12). Every pixel of every scan is kept."
missing_value_policy = "A scanner raster has no missing-value code. 0 (the lowest digitized reading) and 65535 (PMT/ADC saturation in bright spot cores) are native readings and are kept in place, never remapped or dropped. A source that fails its pins or the layout checks, or a raster that is duplicated, has fewer than 1,000 distinct values, more than 5% zeros, more than 2% saturated pixels or more than 5% constant rows, fails build and verify."
conversion = "gunzip the .tif.gz (CRC32/ISIZE checked), parse IFD0 with struct, then for strip i = 0..H-1 take the 4,400 bytes at StripOffsets[i] and concatenate them. The result is H x 2200 little-endian uint16 words in row-major order, one .bin per scan."
numeric_kind = "uint"
bit_width = 16
endianness = "little"
sample_format = "raw uint16 raster, row-major H x 2200 (H = 6985..7128, per-sample shape in the index)"
sample_geometry = "2d_microarray_slide_scan_raster"
sample_rank = 2
sample_axes = ["scan_row", "scan_column"]
natural_record_kind = "single_channel_microarray_slide_scan_tiff"
sample_count = 12
total_size_bytes = 372134400
output_path = "samples/ncbi_geo_gpl5423_scanarray_cdna_scan_u16/scanarray_cy3_scan_u16/"

