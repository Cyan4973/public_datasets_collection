[[series]]
id = "era5_geopotential_pressure_levels_f32"
description = "Global ERA5 geopotential volumes over 13 pressure levels and 64 six-hour analysis times."
semantic_meaning = "Atmospheric geopotential in square metres per square second at each pressure-level, longitude, and latitude cell."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The selected Zarr array is native little-endian IEEE-754 float32; the recipe removes Blosc/LZ4 and byte-shuffle coding and preserves the decoded C-order bytes exactly."
source_resources = ["era5_copernicus_license", "era5_zarr_consolidated_metadata", "selected_era5_pressure_level_zarr_chunks"]
source_format = "Zarr v2 array with Blosc/LZ4 compression and byte shuffle"
source_field = "geopotential"
filtered_input_path = "filtered/weatherbench2_era5_pressure_level_fields_f32/ingest_stats.json"
filtering = "Retain every one of the eight six-hour slices in each of eight deterministic seasonal/decadal source chunks; preserve all 13 pressure levels and the complete 240x121 global grid."
missing_value_policy = "The source declares NaN as fill value. Every emitted value must be finite and each sample nonconstant; any missing, changed, non-finite, degenerate, duplicate, or stale output fails."
conversion = "Decode Blosc/LZ4 and reverse the byte-shuffle transform, then split only along the time axis. No numeric conversion, scaling, regridding, interpolation, transposition, or field interleaving is performed."
numeric_kind = "float"
bit_width = 32
endianness = "little"
sample_format = "raw homogeneous IEEE-754 float32 ERA5 pressure-level volume"
sample_geometry = "global_pressure_level_longitude_latitude_volume_3d"
sample_rank = 3
sample_axes = ["pressure_level", "longitude", "latitude"]
natural_record_kind = "era5_global_pressure_level_field_at_analysis_time"
sample_count = 64
total_size_bytes = 96645120
output_path = "samples/weatherbench2_era5_pressure_level_fields_f32/era5_geopotential_pressure_levels_f32/"

