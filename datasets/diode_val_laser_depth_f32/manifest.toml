[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/diode_val_laser_depth_f32/samples.jsonl"
summary = "Download the pinned DIODE validation archive, stream it twice with tarfile r|gz (inventory, then extraction), select a deterministic set of mutually non-overlapping views per scan, and emit each selected *_depth.npy payload unchanged as one raw little-endian float32 768x1024 depth map."
deterministic_notes = "Archive size 2,774,625,282 and publisher MD5 5c895d09201b88973c8fe4552a67dd85 are checked by download.sh and again (over the exact streamed bytes) by build and verify. The inventory must contain 325 indoors + 446 outdoor views over 10 + 10 scans, each with png, depth and mask members. View selection uses only member names: within each scan, views are visited in ascending SHA-256(view_id) order and a view is kept only if, on a 64x48 grid of pixel-centre rays through the devkit computational camera (fx=886.81, fy=927.06, cx=512, cy=384; 60x45 deg field of view, yaw/pitch from the view name, no roll), at most 153 of 3,072 rays (~5 %) of either view fall inside the other for every view already kept. verify.sh re-checks this greedy property against the full archive inventory, byte-compares every sample with its archive payload, checks the mask encoding, and re-derives index statistics. Acceptance floors: 85 samples x 786,432 values."

[[series]]
id = "diode_laser_depth_m_f32"
description = "Dense metric depth map for one DIODE camera view (indoor or outdoor), float32 metres."
semantic_meaning = "Per-pixel ground-truth depth in metres for one 1024x768 computational-camera view, produced by DIODE's published reprojection of a FARO Focus S350 360-degree laser scan (precision about +/-1 mm, range 0.6-350 m; same scanner and camera model for indoor and outdoor scenes); 0.0 marks pixels without a valid sensor return (for example sky)."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The upstream NPY tensor is explicitly little-endian IEEE float32 ('<f4'), C order, shape (768, 1024, 1); its payload bytes are copied verbatim, so every value keeps its source bit pattern. The trailing singleton channel axis is dropped from the declared geometry only (no data change)."
source_resources = ["diode_depth_val_archive"]
source_format = "NumPy NPY v1.0 arrays inside a gzip-compressed GNU tar archive"
source_field = "*_depth.npy depth tensor ('<f4', shape (768, 1024, 1)) of each selected view"
filtered_input_path = "filtered/diode_val_laser_depth_f32/ingest_stats.json"
filtering = "Keep only *_depth.npy members of the views chosen by the overlap-capped selection (85 of 771 views: 38 indoors, 47 outdoor; every one of the 20 scans contributes 3-6 views; pitches 0-50 deg all represented). RGB PNGs, *_depth_mask.npy validity masks (mixed '<f4'/'<f8') and normals (separate archive, not downloaded) are excluded. No view is dropped for content."
missing_value_policy = "0.0 is the source encoding for 'no valid return' and is preserved unchanged (verify checks that every zero-depth pixel is flagged invalid by the companion validity mask). Nonzero depths that the mask flags invalid (for example sub-minimum-range returns) are also preserved as published; the mask is not applied. Non-finite or negative values, a view with fewer than 1 % nonzero pixels, fewer than 1,000 distinct values, depths above a 1,000 m sanity bound, NPY header changes, or MD5/size/inventory changes are fatal; nothing is imputed or dropped."
conversion = "Stream val.tar.gz with Python tarfile r|gz, parse the NPY v1.0 header of each selected *_depth.npy (assert descr '<f4', fortran_order False, shape (768, 1024, 1), payload 3,145,728 bytes) and write the payload bytes unchanged to samples/diode_val_laser_depth_f32/diode_laser_depth_m_f32/<view_id>_depth.f32. One file per view: 768 rows x 1024 columns, row-major, little-endian float32."
numeric_kind = "float"
bit_width = 32
endianness = "little"
sample_format = "raw little-endian float32 depth raster, row-major 768 x 1024"
sample_geometry = "2d_raster"
sample_rank = 2
sample_axes = ["image_row", "image_column"]
natural_record_kind = "diode_camera_view_depth_map"
sample_count = 85
total_size_bytes = 267386880
output_path = "samples/diode_val_laser_depth_f32/diode_laser_depth_m_f32/"
