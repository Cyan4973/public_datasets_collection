conversion = "For each source row, initialize a 100,000-element uint8 zero vector and set each documented one-based sparse feature index to 1."
numeric_kind = "uint"
bit_width = 8
endianness = "little"
sample_format = "raw homogeneous uint8 binary feature vector"
sample_geometry = "100000_dimensional_compound_feature_vector"
sample_rank = 1
sample_axes = ["feature_index"]
natural_record_kind = "dorothea_compound_feature_vector"
sample_count = 1950
