manifest_version = 1
dataset_id = "nasa_pds_juno_junocam_perijove_rgb_framelets_u8"
name = "Juno JunoCam Perijove Lossless Colour EDRs: 8-bit BLUE/GREEN/RED Pushframe Framelet Rasters"
description = "The 8-bit square-root-companded JunoCam detector DN raster of 22 Jupiter colour (C-type, BLUE/GREEN/RED framelet) Experiment Data Records that were Huffman (lossless) compressed on board. There is one product per third perijove (PJ03 to PJ72, 2016-12 to 2025-05), the one closest in time to closest approach, with the highest product version across the JNOJNC_0001-0035 volumes. Source: the NASA PDS Imaging Node."
homepage = "https://planetarydata.jpl.nasa.gov/img/data/juno/"

[license]
name = "NASA SMD Open Scientific Data Policy (public NASA PDS mission data)"
spdx = "LicenseRef-NASA-SMD-Open-Data"
url = "https://science.nasa.gov/researchers/science-data/science-information-policy/"
citation = "Caplinger, M., JUNO J JUNOCAM 2 EDR L0 V1.0 (JUNO-J-JUNOCAM-2-EDR-L0-V1.0), NASA Planetary Data System, Imaging Node. Acknowledge NASA / JPL-Caltech / SwRI / MSSS."
notes = "Juno is a NASA New Frontiers mission. JunoCam EDRs are archived by the NASA Planetary Data System (data set JUNO-J-JUNOCAM-2-EDR-L0-V1.0) and served anonymously from the PDS Imaging Node at planetarydata.jpl.nasa.gov. NASA SMD policy says information produced from SMD-funded scientific research is to be made publicly available and openly shared; mission data are released as soon as possible. This is the same rights basis as the accepted nasa_pds_voyager_iss_saturn_raw_u8, nasa_pds_cassini_vims_qube_i16 and nasa_pds_mastcamz_raw_i16 recipes. The volume AAREADME.TXT (fetched and pinned by download.sh) states the archive is compiled for NASA by Malin Space Science Systems under PDS standards. It imposes no use restriction. The science.nasa.gov policy page is not fetched by download.sh because it is unreachable through the collection proxy."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official NASA PDS archive objects over anonymous HTTPS from the PDS Imaging Node (planetarydata.jpl.nasa.gov/img/data/juno/). Robotic spacecraft camera images of Jupiter's cloud tops."
usage_notes = "Only image DN values are emitted. PDS label text and index tables are selection evidence only and are never written to samples."

