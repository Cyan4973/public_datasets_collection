role = "primary"
representation_class = "native_numeric"
representation_notes = "The source tensor is torch complex128 (ComplexDoubleStorage) in little-endian byte order; a complex128 element is two IEEE-754 float64 values (re, im), so the emitted bytes equal the source storage bit-for-bit."
