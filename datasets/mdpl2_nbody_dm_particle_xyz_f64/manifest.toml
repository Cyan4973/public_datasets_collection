summary = "Range-fetch the NPY header and the first 16,000,000 particle records of the published MDPL2 particle catalog, check the header, hash and every value, and write the records verbatim as one little-endian float64 sample."
deterministic_notes = "Record id, license, listed file size and MD5, the exact 128-byte NPY header, the prefix size and SHA-256 are enforced. Every value must be finite, inside [0, 1000] Mpc/h, exactly a number with at most six decimal places, and equal to the six-decimal print of its nearest float32. The stats record per-axis min, max, mean and standard deviation, the decimal-place histogram, the float32-print and float32-exact counts, the cells and file-order runs of 250, 62.5 and 1.95 Mpc/h grids, the face-connected regions of the touched 62.5 Mpc/h cells with the number of region switches in file order, and repeated consecutive positions; verify.sh recomputes them and compares the sample, index and stats."

[[series]]
id = "mdpl2_dm_particle_xyz_f64"
description = "Comoving positions of the first 16,000,000 particles, in catalog order, of the published 72-million-particle downsample of the MDPL2 a = 0.7333 snapshot."
semantic_meaning = "Comoving Cartesian position in Mpc/h of each dark-matter particle in the periodic 1000 Mpc/h MDPL2 box at scale factor a = 0.7333 (z = 0.36), interleaved as x0, y0, z0, x1, ... in catalog record order. In that order every touched 62.5 Mpc/h and 1.95 Mpc/h cell is one contiguous run of records, so most consecutive particles are close (median 3-D step 1.38 Mpc/h), but the prefix covers two disjoint regions of the box and the order moves between them 77 times."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The publisher stores the positions as IEEE-754 float64 fields of a structured NPY array, but they are single-precision positions published as float64 through six-decimal text: every value equals the six-decimal print of its nearest float32 (enforced on all values). Their effective lattice is therefore the float32 step (3.05e-5 Mpc/h in [256, 512), 6.1e-5 Mpc/h in [512, 1000]); only below about 16 Mpc/h is the 1e-6 decimal grid the coarser one. Just 0.317% of the values are exactly representable in float32. float64 is kept because it is the publisher's stored dtype; narrowing to float32 would rewrite 99.68% of the stored bit patterns. The bytes are copied verbatim: no rescaling, casting or reordering."
source_resources = ["particle_catalog_prefix", "zenodo_record_metadata"]
source_format = "NumPy NPY v1 structured array"
source_field = "x, y and z fields ('<f8', Mpc/h) of each record of mdpl2_particles_0.7333_72m.npy"
filtered_input_path = "filtered/mdpl2_nbody_dm_particle_xyz_f64/ingest_stats.json"
filtering = "The first 16,000,000 of the catalog's 71,806,599 records in file order (22.3%). The touched 62.5 Mpc/h cells form two disjoint face-connected regions (periodic wrap does not join them): 815 cells with 14,298,713 particles (x 500-1000, y 0-1000, z 500-1000 Mpc/h) and 98 cells with 1,701,287 particles (x 0-500, y 0-500, z 0-250 Mpc/h). The halo catalog and the other files of the record are not used."
missing_value_policy = "No missing values exist upstream. A non-finite value, a value outside [0, 1000] Mpc/h, a value that is not exactly a number with at most six decimal places, a value that is not the six-decimal print of its nearest float32, a changed NPY header or a prefix whose size or SHA-256 differs fails download.sh, build.sh and verify.sh. Nothing is dropped or imputed."
conversion = "Skip the 128-byte NPY header and write the next 384,000,000 bytes (16,000,000 records of 24 bytes) verbatim; each record is already three little-endian float64 values."
numeric_kind = "float"
bit_width = 64
endianness = "little"
sample_format = "raw homogeneous little-endian float64 array, 3 values per particle"
sample_geometry = "point_cloud_xyz_interleaved"
sample_rank = 2
sample_axes = ["catalog_record_order", "xyz"]
natural_record_kind = "nbody_snapshot_downsampled_particle_catalog"
sample_count = 1
total_size_bytes = 384000000
output_path = "samples/mdpl2_nbody_dm_particle_xyz_f64/mdpl2_dm_particle_xyz_f64/"
