description = "Raw low-frequency underwater sound-pressure waveforms from the 10-unit Cornell MARU bottom-mounted recorder arrays that NOAA NEFSC and the Office of National Marine Sanctuaries deployed in the Stellwagen Bank National Marine Sanctuary (Gulf of Maine) in 2007-2010. Seven 10-channel 2 kHz AIFF deployments, two 15-minute files each (file-name times 00:00:00 and 12:00:00 on the deployment's middle day), one little-endian int16 sample per publisher-'Good', live channel (one MARU site): 1,800,000 ADC codes (12-bit values MSB-aligned in 16 bits) per sample."
