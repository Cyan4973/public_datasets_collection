[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/openneuro_ds004212_things_meg_ctf_i32/samples.jsonl"
summary = "Validate the CC0 dataset description, fetch 24 pinned res4 headers, re-derive the 8 selected gradiometer channel indices per run with an MNE-Python-layout res4 parser, range-extract each complete big-endian int32 channel block from the pinned meg4 object versions, and emit each block unchanged as one canonical little-endian int32 sample."
deterministic_notes = "Runs: sub-BIGMEG1..4 x ses-01/03/05/07/09/11 x run-01 (24 runs, selection.tsv). Channels: MLF32 MRF32 MLC32 MRC32 MLT33 MRT33 MLO32 MRO32 (mirrored L/R pair per frontal/central/temporal/occipital region), matched on the label before the '-1609' serial and re-located in each res4. Every res4 must parse with comp table ending exactly at EOF, nsamp=417600, nchan=310, 1200 Hz, 1 trial, sensor-type counts {5:272,1:19,0:9,18:8,17:1,20:1}, all 272 type-5 channels at grad_order_no=3 and qgain=2^20, and an identical 310-label order across runs. Each meg4 must still report its pinned size/ETag and start with 'MEG41CP\\0'. Ranges must return HTTP 206 with the exact byte count. Streams are rejected if they have <1000 distinct values, peak-to-peak <1000 counts, a flat run >120 samples, any constant 1-s block, int32-extreme values, or duplicate payloads/1-s blocks. Floor: 192 samples x 417,600 values far exceeds the 10,000-value / 1,000-value-median floor."

[[series]]
id = "ctf275_axial_gradiometer_counts_i32"
description = "Raw CTF-275 first-order axial-gradiometer SQUID ADC counts, one complete continuous channel per THINGS-MEG main-task run."
semantic_meaning = "Signed 32-bit CTF MEG ADC counts of one axial-gradiometer sensor (sensor_type_index 5) sampled at 1200 Hz for one full 348-s main-task run while a participant viewed THINGS object images; calibrated value in tesla = counts / (proper_gain x qgain) from res4 (MNE-Python cal convention), with 3rd-order synthetic-gradiometer compensation (grad_order_no 3) already applied by the acquisition system."
role = "primary"
representation_class = "native_numeric"
representation_notes = "CTF meg4 natively stores every channel as big-endian signed int32 counts; the values are copied unchanged and only byte-swapped to little-endian. Per-channel, per-session DC offsets put realized values in -1,009,352..893,741 (about 21 bits; 91.5% of all values lie outside the int16 range), while within-stream peak-to-peak spans 4,553-50,564 counts (median 10,354) with 3,684-31,977 distinct values per stream (median 7,291). 14 of 192 streams happen to sit near zero and fit entirely in int16; the family as a whole does not. Gains (one constant proper_gain per channel, about +/-2.8e9, qgain 2^20) are kept only as index metadata."
source_resources = ["res4_headers", "meg4_gradiometer_ranges"]
source_format = "CTF MEG4 .ds dataset (res4 header + meg4 trial-major channel-major big-endian int32 data)"
source_field = "meg4 int32 sample block of one sensor_type_index=5 axial-gradiometer channel (single trial, 417,600 samples)"
filtered_input_path = "filtered/openneuro_ds004212_things_meg_ctf_i32/ingest_stats.json"
filtering = "Keep 8 fixed axial gradiometers (MLF32, MRF32, MLC32, MRC32, MLT33, MRT33, MLO32, MRO32) from run-01 of sessions 01/03/05/07/09/11 of all 4 participants. Exclude reference magnetometers/gradiometers (types 0/1), UADC (18), SCLK01 sample clock (17), UPPT001 trigger (20), all other gradiometers, the hz/hz2 head-localisation datasets, runs 02-10 and even sessions. No EEG/EOG or HLC channels exist in these runs."
missing_value_policy = "CTF counts have no missing-value sentinel; every one of the 417,600 samples per stream is kept in source order, nothing is dropped, clipped or imputed. Changed object versions/sizes/ETags/MD5s/sha256s, res4 layout or self-check failures, short or non-206 ranges, and degenerate streams (constant blocks, flat runs >120 samples, <1000 distinct values, int32-extreme values, duplicates) are fatal in download, build and verify alike."
conversion = "Decode each 1,670,400-byte meg4 channel block as 417,600 big-endian signed int32 values and write them unchanged as little-endian signed int32, one file per (run, channel). No scaling, offset removal, filtering, compensation change, resampling or concatenation."
numeric_kind = "int"
bit_width = 32
endianness = "little"
sample_format = "raw homogeneous little-endian signed-int32 CTF SQUID gradiometer ADC counts"
sample_geometry = "1d_continuous_meg_gradiometer_channel"
sample_rank = 1
sample_shape = [417600]
sample_axes = ["time_sample"]
sample_rate_hz = 1200.0
natural_record_kind = "complete_ctf_meg4_channel_run_stream"
sample_count = 192
total_size_bytes = 320716800
output_path = "samples/openneuro_ds004212_things_meg_ctf_i32/ctf275_axial_gradiometer_counts_i32/"
