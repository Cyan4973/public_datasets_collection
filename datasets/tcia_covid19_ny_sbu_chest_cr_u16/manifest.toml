manifest_version = 1
dataset_id = "tcia_covid19_ny_sbu_chest_cr_u16"
name = "TCIA COVID-19-NY-SBU Portable Chest Radiographs UInt16"
description = "48 complete 2544x3056 12-bit-in-uint16 Pixel Data planes of portable AP chest radiographs from one Carestream DRX-Revolution regime, one image per distinct patient, from TCIA's Stony Brook University COVID-19 Positive Cases collection."
homepage = "https://doi.org/10.7937/TCIA.BBAG-2923"

[license]
name = "Creative Commons Attribution 4.0 International"
spdx = "CC-BY-4.0"
url = "https://creativecommons.org/licenses/by/4.0/"
citation = "Saltz, J., Saltz, M., Prasanna, P., Moffitt, R., Hajagos, J., Bremer, E., Balsamo, J., & Kurc, T. (2021). Stony Brook University COVID-19 Positive Cases [Data set]. The Cancer Imaging Archive. https://doi.org/10.7937/TCIA.BBAG-2923"
notes = "The TCIA collection page lists the images, clinical data and template under CC BY 4.0 (Version 1, updated 2021/08/11, status Complete, Public) and requires the data citation including the DOI. Every live NBIA series row for the pinned objects reports LicenseName 'Creative Commons Attribution 4.0 International License' and LicenseURI https://creativecommons.org/licenses/by/4.0/; download.sh re-checks this per series. TCIA's data usage policy (no re-identification) applies."

[safety]
contains_sensitive_data = true
contains_personal_data = false
provenance_notes = "Public de-identified human clinical chest radiographs released by TCIA (DICOM PS3.15 Basic Application Confidentiality Profile with Clean Pixel Data option; BurnedInAnnotation NO is asserted for every object). Source DICOM headers carry pseudonymous IDs, shifted dates, age and sex; none of that is emitted. Pixels include the usual burned-in technologist markers (L/R letter, 'PORTABLE'/'SITTING' text); no identifiers were seen in a 1/16-scale review of all 48 images."
usage_notes = "Samples contain only Pixel Data values. The committed pin file lists TCIA's public pseudonymous PatientID and UIDs for provenance only. Do not attempt re-identification or linkage; follow the TCIA data usage policy."

[[origins]]
id = "tcia_covid19_ny_sbu"
name = "The Cancer Imaging Archive: Stony Brook University COVID-19 Positive Cases (COVID-19-NY-SBU)"
url = "https://www.cancerimagingarchive.net/collection/covid-19-ny-sbu/"
type = "data_portal"
version = "Version 1, DateReleased 2021-08-11"
notes = "Accessed through the public anonymous NBIA REST API v1 at https://services.cancerimagingarchive.net/nbia-api/services/v1."

