[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Latents of synthetic Unreal Engine 5 renders: 3D environments with an animated 3D character model (Fab/Mixamo assets), filmed by virtual cameras. No real people, recordings or user records."
usage_notes = "Only latents['target'] is emitted. The source-camera latent, the two object-only control latents (source_cond, target_cond), the umT5 text embedding, the prompt and the metadata row stored in the same archive are not downloaded or are discarded."

