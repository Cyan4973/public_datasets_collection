[[series]]
id = "dorothea_molecular_feature_vector_u8"
description = "DOROTHEA 100,000-dimensional binary molecular descriptor vectors."
semantic_meaning = "Presence (1) or absence (0) of each documented DOROTHEA molecular feature for one chemical compound."
role = "primary"
representation_class = "native_numeric"
