[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/google_clusterdata2011_task_usage_f32/samples.jsonl"
summary = "Fetch the sha256-pinned task_usage parts 0-4 of clusterdata-2011-2 (plus a 256 KiB head range of part 5), read them as one start-time-sorted row stream, group rows into 5-minute windows by floor(start time / 300 s) (joining windows that straddle a part cut, dropping the trailing window that continues into part 5), and emit CPI and MAI of every complete window as two raw little-endian float32 samples in source row order, each guarded against widened half-precision content (f16_recoverable_fraction <= 0.90)."
deterministic_notes = "Inputs are sha256-pinned (bucket SHA256SUM) and size/md5-checked against the GCS listing. scripts/build_windows.py (gzip module, byte splitting, array('f')) requires 20 fields per row and decimal start/end times; start times must never decrease across the whole part stream (asserted, so window order is monotonic across parts); window = start - start mod 300,000,000 us; consecutive windows must be exactly 300 s apart; the stream must start exactly at 600 s, the trace start (ClusterData2011_2.md), so the first window is not truncated. Both lattice-aligned rows (start == window start, normally full 300 s periods) and mid-window rows (measurement periods starting inside the window, e.g. tasks that started or were rescheduled mid-window) belong to their window; per-window counts of each are recorded. The final window is dropped only because part 5's pinned head starts inside it (25,656 s in window 25,500 s); had it abutted, it would be kept. Exactly 83 complete windows 600..25,200 s are required. Rows keep source order inside a window. Empty fields of a series are dropped from that series' sample and counted (empty_fields_dropped in the index, per series and window); non-numeric or non-finite tokens are fatal; constant samples, a median below 1,000 values, or more than 1e9 primary bytes are fatal. Width-honesty guard: per sample, f16_recoverable_fraction = share of stored float32 values v with abs(v) < 65504 and float('%.4g' % h) == float('%.4g' % v), h = binary16 round trip of v; the build fails if any sample exceeds 0.90 and verify recomputes it from the stored bytes, requires equality with the index and applies the same limit (realized per-sample range: CPI 0.5624-0.6064, MAI 0.4969-0.5498). Field 6 CPU rate is excluded because it is a source code of 16 bits or fewer: a fixed 2^-20 grid below about 5e-4 and a 9-bit mantissa above, 100% float16-recoverable (1,289,426 of 1,289,426 values checked by the judge), ~5.3k distinct values per window. Negative values, end <= start and end beyond the window are counted, not altered. Index rows carry window_start_s, window_index, window_rows, empty_fields_dropped, f16_recoverable_fraction, source_files, min/max (from the stored float32), distinct and zero counts and sha256; filtered/<id>/ingest_stats.json records per-window row counts by part, lattice vs mid-window rows, straddling windows, the dropped partial window and row accounting. scripts/verify_windows.py re-derives every sample with a separate parser (raw zlib streaming, integer-division windowing, struct '<f'), requires byte equality, and re-checks index stats, stats counters, stray files and manifest totals."

[[series]]
id = "task_cycles_per_instruction_f32"
description = "Cycles per instruction of each task over its measurement period, for every task_usage row in one 5-minute window that reports it."
semantic_meaning = "Cycles per instruction (CPI) of one Borg task over its measurement period, from hardware performance counters, one value per task_usage row whose period starts in the window and whose CPI field is present."
role = "primary"
representation_class = "native_numeric"
representation_notes = "schema.csv types the column FLOAT; cast to float32 without rescaling. Float32 is the honest width: about 42% of values do not survive a float16 round trip at 4 significant digits (per-sample f16_recoverable_fraction ~0.58, guarded <= 0.90 in build and verify). The publisher notes some CPI values are implausible (counter read skew); they are kept as published, not filtered."
source_resources = ["task_usage_part_00000", "task_usage_part_00001", "task_usage_part_00002", "task_usage_part_00003", "task_usage_part_00004", "task_usage_part_00005_head", "schema_csv"]
