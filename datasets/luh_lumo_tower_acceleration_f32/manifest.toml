manifest_version = 1
dataset_id = "luh_lumo_tower_acceleration_f32"
name = "LUMO Lattice-Tower SHM Accelerometer Streams Float32"
description = "Native single-precision structural-health-monitoring acceleration streams (18 accelerometers, 1651.6 Hz, unit g) of the LUMO 9 m steel lattice tower near Hannover: one sample per accelerometer channel of 12 ten-minute SHMTS records, one record from each healthy and reversible-damage state folder of the six official exemplary ZIPs."
homepage = "https://data.uni-hannover.de/dataset/lumo"

