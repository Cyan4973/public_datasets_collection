manifest_version = 1
dataset_id = "gwtc3_imrphenomxphm_posterior_samples_f64"
name = "GWTC-3 (O3b) Bilby IMRPhenomXPHM Posterior Samples, Per-Event Parameter Columns, Float64"
description = "Native IEEE-754 float64 posterior draws from the LIGO/Virgo/KAGRA GWTC-3 parameter-estimation release (Zenodo 8177023, v2): for each of the 33 O3b binary-black-hole candidates, 18 physical parameter columns (source-frame component and remnant masses, spin magnitudes and angles, orientation, sky position, luminosity distance, geocentric coalescence time, log-likelihood) of the C01:IMRPhenomXPHM analysis (cosmologically reweighted file), one sample per (event, parameter)."
homepage = "https://zenodo.org/records/8177023"

[license]
name = "Creative Commons Attribution 4.0 International"
spdx = "CC-BY-4.0"
url = "https://creativecommons.org/licenses/by/4.0/"
citation = "LIGO Scientific Collaboration, Virgo Collaboration and KAGRA Collaboration, GWTC-3: Compact Binary Coalescences Observed by LIGO and Virgo During the Second Part of the Third Observing Run - Parameter estimation data release, Zenodo (2023), doi:10.5281/zenodo.8177023; paper: Phys. Rev. X 13, 041039 (2023), arXiv:2111.03606."
notes = "Zenodo record 8177023 declares metadata.license.id = 'cc-by-4.0' at record level, covering every file; download.sh re-fetches the record JSON and refuses to continue if the license, title, or any pinned file size/MD5 changed. Attribute the LVK collaborations and cite the GWTC-3 paper."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official LVK data release on zenodo.org, fetched from the record's file-content URLs with HTTP byte ranges. Values are Bayesian posterior draws about astrophysical sources; no personal data."
usage_notes = "Public, CC BY 4.0 scientific data; appropriate for reproducible numeric collection."

[[origins]]
id = "zenodo_gwtc3_pe"
name = "GWTC-3 parameter-estimation data release (Zenodo record 8177023)"
url = "https://zenodo.org/records/8177023"
type = "repository"
notes = "76 files, 23.6 GB: per-event *_mixed_cosmo.h5 and *_mixed_nocosmo.h5 PESummary files for 36 candidates, plus skymaps, contours and notebooks. Only the 33 *_mixed_cosmo.h5 files holding a plain C01:IMRPhenomXPHM analysis are used."

[[resources]]
id = "gwtc3_cosmo_h5_xphm_ranges"
origin = "zenodo_gwtc3_pe"
url = "https://zenodo.org/api/records/8177023/files/IGWN-GWTC3p0-v2-{event}_PEDataRelease_mixed_cosmo.h5/content"
type = "shard"
version = "GWTC-3 PE release v2 (record 8177023, published 2023-10-23); keys, sizes, MD5s, row counts, member counts and table byte spans pinned in sources.tsv"
access = "Anonymous HTTPS byte-range GETs (206 with exact Content-Range checked): 64 KiB-aligned metadata blocks (superblock, root and C01:IMRPhenomXPHM symbol tables, posterior_samples object header) and one contiguous span per event holding the whole C01:IMRPhenomXPHM/posterior_samples table."
size_bytes = 4645103433
sha256 = ""
local_path = "downloads/gwtc3_imrphenomxphm_posterior_samples_f64/blocks/ and downloads/gwtc3_imrphenomxphm_posterior_samples_f64/tables/"
notes = "size_bytes is the sum of the 33 full file sizes; about 2.34 GB of it is fetched (2,314,275,968 table bytes plus metadata blocks). The other analyses (C01:Mixed, C01:SEOBNRv4PHM), PSDs, calibration envelopes, priors, config files and skymaps are never fetched."

