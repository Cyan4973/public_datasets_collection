[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/tartanair_optical_flow_f32/samples.jsonl"
summary = "Range-fetch three deterministically selected *_flow.npy members from each of the 36 pinned TartanAir flow_flow.zip archives, raw-inflate and CRC-check them, validate the .npy header, and emit each frame's 480 x 640 x 2 little-endian float32 tensor unchanged as one sample."
deterministic_notes = "Selection rule (scripts/tartanair_flow.py select_members): within each archive, group members <env>/<Easy|Hard>/Pxxx/flow/NNNNNN_MMMMMM_flow.npy (MMMMMM = NNNNNN + 1) by trajectory; sort trajectory names (n of them); slot k = 0..2 goes to trajectory index floor((2k+1) n / 6); a trajectory with c slots and m frames (sorted by frame index) contributes positions floor((2j+1) m / (2c)), j = 0..c-1. Realized: every archive has 4-37 trajectories (369 trajectories and 306,268 flow frames upstream in total; 299-4,203 frames per trajectory), so the result is the temporal middle frame of three evenly spread trajectories per archive: 108 frames from 108 distinct trajectories, none sharing a trajectory or temporally adjacent. (The rule would spread slots over evenly spaced frames if an archive had fewer than three trajectories; none does.) The realized member list (offsets, spans, sizes, CRC32) is pinned in selection.lock.tsv. Member spans run from the local header to the next entry's local header, so local extra fields (which differ from central-directory extras) need no guessing. Validations: resolver revision + LFS sha256 + 206 Content-Range per request; ZIP64 EOCD/locator/central-directory consistency; local header name/CRC/sizes vs the central directory; DEFLATE end exactly at the compressed size; CRC32; npy v1.0 header exactly {'descr': '<f4', 'fortran_order': False, 'shape': (480, 640, 2)} with a 128-byte prefix; all values finite; both flow components non-constant. The realized selection is written to downloads/.../selection.tsv and must match the committed selection.lock.tsv exactly (checked by download.sh and verify.sh). Floors: 66,355,200 primary values, 265,420,800 bytes, median 614,400 values per sample."

[[series]]
id = "tartanair_left_optical_flow_uv_f32"
description = "Dense forward optical flow of the TartanAir left camera from frame N to frame N+1, one complete 480 x 640 x 2 float32 field per sample."
semantic_meaning = "Per-pixel 2-D image-plane displacement in pixels (two components per pixel, stored order: channel 0 then channel 1, conventionally horizontal u then vertical v) between consecutive left-camera frames, computed upstream from ground-truth depth and camera motion with the authors' ImageFlow code. 640 x 480 pinhole camera, fx = fy = 320 px."
role = "primary"
representation_class = "native_numeric"
representation_notes = "Upstream stores each flow frame as a little-endian IEEE-754 float32 .npy array of shape (480, 640, 2) in C order; the sample is that tensor's element data with the 128-byte .npy header removed, bit-for-bit. The values are simulator ground truth published by the dataset authors (not a local remap); occlusion/dynamic-object masks (separate uint8 *_mask.npy members) are not applied or emitted."
source_resources = ["flow_flow_zip_archives"]
source_format = "NumPy .npy v1.0 arrays (descr '<f4', shape (480, 640, 2), C order) stored as DEFLATE members of ZIP64 archives"
source_field = "the float32 flow tensor of each <env>/<difficulty>/Pxxx/flow/NNNNNN_MMMMMM_flow.npy member"
filtered_input_path = "filtered/tartanair_optical_flow_f32/ingest_stats.json"
filtering = "All 36 flow_flow.zip archives at the pinned revision (18 environments x Easy/Hard); three *_flow.npy members per archive chosen by the deterministic trajectory-spread rule in [processing] (108 of 369 upstream trajectories, one frame each). Realized per-frame mean |flow| ranges 1.67-54.75 px (median 7.6 px Easy, 10.4 px Hard); global value range -326.02 to 255.82 px. Masks, depth, RGB, segmentation and poses are excluded."
missing_value_policy = "TartanAir flow has no missing-value sentinel. Any NaN or infinity in a selected frame is fatal in download.sh, build.sh and verify.sh (verify re-checks via the float32 exponent bits); no values are dropped, replaced or imputed. Masked (occluded or dynamic) pixels keep their upstream geometric flow values."
conversion = "Raw-inflate the DEFLATE member (zlib wbits -15), check CRC32 and size against the central directory, parse the .npy v1.0 header, and write the following 2,457,600 bytes unchanged: 614,400 little-endian float32 values in (image_row, image_column, flow_component) C order, one file per flow frame."
numeric_kind = "float"
bit_width = 32
endianness = "little"
sample_format = "raw homogeneous little-endian float32 tensor, shape (480, 640, 2), C order"
sample_geometry = "dense_optical_flow_field_row_by_column_by_uv"
sample_rank = 3
sample_axes = ["image_row", "image_column", "flow_component"]
natural_record_kind = "one_tartanair_optical_flow_frame_pair_npy"
sample_count = 108
total_size_bytes = 265420800
output_path = "samples/tartanair_optical_flow_f32/tartanair_left_optical_flow_uv_f32/"
