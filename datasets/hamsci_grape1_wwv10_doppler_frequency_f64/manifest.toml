# Staging draft. 920 G1 WWV10 station-day files pinned; 903 kept and 17
# excluded by the pinned whole-file rules (statuses pinned in sources.tsv).
manifest_version = 1
dataset_id = "hamsci_grape1_wwv10_doppler_frequency_f64"
name = "HamSCI PSWS Grape V1 Received WWV 10 MHz Carrier Frequency Float64"
description = "Once-per-second received carrier-frequency estimates (Hz, 1 mHz print resolution) of the NIST WWV 10 MHz broadcast from six GPSDO-referenced Grape V1 receivers of the HamSCI Personal Space Weather Station network, 2020-07-21..2021-05-15; one little-endian float64 sample per station-day file (903 files, 74,966,875 values). Deviations from 10 MHz are dominated by HF ionospheric Doppler shift."
homepage = "https://doi.org/10.5281/zenodo.6590283"

[license]
name = "Creative Commons Attribution 4.0 International"
spdx = "CC-BY-4.0"
url = "https://creativecommons.org/licenses/by/4.0/"
evidence_url = "https://zenodo.org/api/records/6590283"
evidence_quote = "Zenodo record 6590283 metadata: \"license\": {\"id\": \"cc-by-4.0\"}, \"access_right\": \"open\"; the record-level license covers all 3,017 deposited files."
citation = "Collins, K. (2022). Grape V1 Data: Frequency Estimation and Amplitudes of North American Time Standard Stations [Data set]. Zenodo. https://doi.org/10.5281/zenodo.6590283. Described in: Collins, K., Gibbons, J., Frissell, N., et al. (2023). Crowdsourced Doppler measurements of time standard stations demonstrating ionospheric variability. Earth System Science Data, 15, 1403-1418. https://doi.org/10.5194/essd-15-1403-2023"
notes = "Attribute Kristina Collins / HamSCI and the Grape station volunteers; cite the Zenodo DOI and the ESSD data paper. download.sh re-checks the live record license on every run."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official Zenodo deposit by the dataset author (HamSCI community), per-file API downloads with Zenodo md5 checksums; no mirrors. The ESSD data paper's Code and data availability section cites this exact record DOI."
usage_notes = "Only the Freq column is emitted. Source file headers carry volunteer station callsigns, city names and coordinates; these are not emitted. Index rows keep only the public PSWS node id and the 6-character Maidenhead grid square that already appear in the file names."

[[origins]]
id = "zenodo_grape_v1_6590283"
name = "Zenodo record 6590283: Grape V1 Data: Frequency Estimation and Amplitudes of North American Time Standard Stations"
url = "https://zenodo.org/records/6590283"
type = "repository"
version = "record 6590283 (concept 6584416), published 2022-05-26"
notes = "Per-file deposit of 3,017 gzip CSV station-day files (1,992,244,203 bytes). The record lists 'isObsoletedBy 10.5281/zenodo.6622111': that later concept (latest record 13637199, also CC-BY-4.0) repackages the same files, uncompressed, into yearly ZIPs (2020.zip 886,979,372 bytes; 2021.zip 3,154,297,494 bytes) and extends coverage to 2024. Probe: the decompressed 2020-07-21/2020-07-23 N00009 WWV10 files from this record have the same uncompressed size and CRC32 as the matching members of 13637199/2020.zip, so the pinned per-file record is content-identical for the files it holds and avoids range-extracting multi-GB ZIPs."

