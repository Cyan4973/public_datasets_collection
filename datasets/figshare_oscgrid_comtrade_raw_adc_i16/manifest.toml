manifest_version = 1
dataset_id = "figshare_oscgrid_comtrade_raw_adc_i16"
name = "OscGrid Labeled Real-World Power-Grid Oscillograms: COMTRADE Int16 Voltage and Current Sample Codes"
description = "Point-on-wave relay-protection oscillograms from operating 0.4-35 kV substations (OscGrid labeled subset, 50 Hz grid, 1600 samples/s). For each COMTRADE-1999 ASCII oscillogram, the standardized voltage channels and the standardized current channels are emitted as two channel-major int16 matrices of the sample codes declared by the cfg."
homepage = "https://doi.org/10.6084/m9.figshare.28465427"

[license]
name = "Creative Commons Attribution 4.0 International"
spdx = "CC-BY-4.0"
url = "https://creativecommons.org/licenses/by/4.0/"
citation = "Evdakov, A., Makoldin, A., Kovalenko, A., Filatova, G., Yablokov, A. (2025). A Dataset of Real-World Oscillograms from Electric Power Grids. figshare. Dataset. https://doi.org/10.6084/m9.figshare.28465427.v6. Data descriptor: Evdakov, A., Filatova, G., Yablokov, A. et al. A dataset of real-world oscillograms from electrical power grids. Sci Data (2026). https://doi.org/10.1038/s41597-026-06587-8"
notes = "The license grant is the figshare data record itself: the public API for article 28465427 (version 6) returns license {'name': 'CC BY 4.0', 'url': 'https://creativecommons.org/licenses/by/4.0/'}, and download.sh re-checks that field and the exact file entry before downloading. The Scientific Data descriptor article is CC BY-NC-ND 4.0; it is cited for attribution and documentation only and none of its text or figures are collected. The authors' MIT-licensed converter (github.com/AIRI-Institute/oscgrid) is not used; only its published signal-name dictionary informed the channel whitelist."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official figshare deposit by the dataset authors (AIRI / Evdakov et al.). Per the descriptor, object names, manufacturer information, recording dates and file names were removed before publication: every cfg carries the placeholder date 01/01/0001 and files are named by a 32-hex hash. No site, substation, or operator identity is present in the emitted values or index."
usage_notes = "Only analog voltage and current sample codes plus their per-channel cfg scale metadata are emitted. Digital status channels, the embedded MLsignal event-label channels, sample numbers and timestamps are not emitted."

