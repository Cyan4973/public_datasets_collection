[[series]]
id = "material_roughness_u8"
description = "PBR material roughness maps for eight diverse physical surface classes."
semantic_meaning = "Per-texel scalar microsurface roughness controlling specular highlight spread in physically based rendering."
role = "primary"
representation_class = "native_numeric"
representation_notes = "Each official JPEG declares 8-bit precision. Seven are one-component grayscale; concrete_wall_008 is stored with three components whose decoded R, G, and B bytes are exactly equal at every pixel. These are Poly Haven's published byte-depth delivery representations; the recipe does not derive them by reducing the corresponding 16-bit PNG."
source_resources = ["material_roughness_jpegs"]
source_format = "JPEG, 8-bit precision, one grayscale component or exactly achromatic three-component encoding"
source_field = "decoded grayscale roughness sample plane"
filtered_input_path = "filtered/polyhaven_material_roughness_u8/ingest_stats.json"
filtering = "Keep all 1024x1024 texels from each of the eight official 1K roughness maps after strict identity, structure, achromaticity, uniqueness, and distribution validation."
missing_value_policy = "Missing or changed objects, absent CC0/API evidence, malformed JPEG markers, unsupported precision/components/geometry, unequal decoded RGB channels, duplicate or low-cardinality planes, decoder failure, or stale outputs fail the recipe. No texels are dropped, imputed, rescaled, normalized, or projected from color to luma."
conversion = "Decode each official JPEG using single-threaded FFmpeg with bitexact and accurate-rounding flags. Emit the gray bytes directly for one-component files; for a three-component file, first require exact R=G=B equality at every decoded pixel and emit that common byte in row-major order."
numeric_kind = "uint"
bit_width = 8
endianness = "little"
sample_format = "raw homogeneous uint8 material roughness plane"
sample_geometry = "2d_material_roughness_map"
sample_rank = 2
sample_axes = ["texture_y", "texture_x"]
natural_record_kind = "material_roughness_map"
sample_count = 8
total_size_bytes = 8388608
output_path = "samples/polyhaven_material_roughness_u8/material_roughness_u8/"
