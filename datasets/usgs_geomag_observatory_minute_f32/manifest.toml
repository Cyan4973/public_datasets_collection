filtering = "For each station and component, concatenate the twelve source month arrays in timestamp order and retain finite measurements whose absolute value is below the USGS 99999-class missing sentinel."
missing_value_policy = "JSON nulls, non-finite values, and absolute values at or above 90000 are omitted independently per component. Each retained station/component year must retain at least 95 percent of the expected 527040 minute slots."
conversion = "Parse retained decimal JSON values, round once to IEEE-754 binary32, and write raw little-endian float32 words in source timestamp order."
numeric_kind = "float"
bit_width = 32
endianness = "little"
sample_format = "raw homogeneous IEEE-754 float32 time-series array"
