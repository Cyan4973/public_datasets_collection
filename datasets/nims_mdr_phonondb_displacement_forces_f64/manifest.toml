notes = "Every pinned record was checked through https://mdr.nims.go.jp/api/v1/datasets/<id>: rights = [Creative Commons Attribution 4.0 International, https://creativecommons.org/licenses/by/4.0/], state published, visibility open_to_public, collection d7aab932-8512-4b9a-b93d-b61f6e5e7019. The OAI-PMH jpcoar record carries the same dc:rights. Credit A. Togo / NIMS MDR. Materials Project ids appear only as references (related_item relation 'refers'); the calculations and files are Togo/NIMS outputs."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official NIMS Materials Data Repository downloads of first-principles (VASP + phonopy) simulation outputs for inorganic crystals; no personal data."
usage_notes = "Only the displacement force sets are emitted. Lattice vectors, positions, masses, displacement vectors, PNG plots and VASP settings archives are not used."

[[origins]]
id = "nims_mdr"
name = "NIMS Materials Data Repository (MDR)"
url = "https://mdr.nims.go.jp/"
type = "data_portal"
notes = "Collection 'MDR phonon calculation database' (10,034 records as listed on 2026-10-09). Enumerated via OAI-PMH https://mdr.nims.go.jp/oai (jpcoar_2.0, datestamp window 2025-08-25); exact fileset sizes and md5 from https://mdr.nims.go.jp/api/v1/datasets/<id>. See scripts/discover.py."

[[resources]]
id = "phonopy_params_selection"
origin = "nims_mdr"
