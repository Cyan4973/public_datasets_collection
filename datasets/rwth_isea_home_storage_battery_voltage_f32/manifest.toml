name = "RWTH ISEA Residential PV Home-Storage Battery Pack Voltage 1 Hz Float32 (48 V class)"
description = "One float32 1 Hz battery pack terminal-voltage series per complete system-month from 12 privately operated 48 V-class PV home storage systems measured by ISEA/CARL RWTH Aachen in Germany, 2015-2022."
homepage = "https://doi.org/10.5281/zenodo.12091223"

[license]
name = "Creative Commons Attribution 4.0 International"
spdx = "CC-BY-4.0"
url = "https://creativecommons.org/licenses/by/4.0/"
citation = "Figgener, J., Haberschusz, D., Wessels, O., Kairies, K.-P., Bors, J., van Ouwerkerk, J., Sauer, D. U. Data for: Multi-year field measurements of home storage systems and their use in capacity estimation. Zenodo record 12091223 (2024), DOI 10.5281/zenodo.12091223; accompanying Nature Energy 9, DOI 10.1038/s41560-024-01620-9."
notes = "The Zenodo record metadata declares license id cc-by-4.0 for the deposit, which contains the Data_ID_*.zip measurement archives and Metadata_and_Code.zip. download.sh re-checks the license id on every run. Preserve attribution to the authors, ISEA/CARL RWTH Aachen University, the DOI and the Nature Energy article."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official Zenodo deposit by the measuring institute. Systems are identified only by numeric ID 1-21 and anonymized manufacturer letters A-E; no household location, owner, or address data is published or emitted."
usage_notes = "Only the battery pack voltage column is emitted. Household load or PV behaviour is not reconstructable from pack voltage alone, and no personal attributes are present."

[[origins]]
id = "zenodo_isea_hss_field_data"
name = "Zenodo record 12091223: Data for Multi-year field measurements of home storage systems and their use in capacity estimation"
url = "https://zenodo.org/records/12091223"
type = "repository"
version = "record 12091223, published 2024-08-26 (API revision 6 at probe time 2026-10-06)"
notes = "21 systems, 106 system-years, 1,270 monthly CSV files at a 1 s sample rate in 21 per-system zips (0.33-2.15 GB each, standard ZIP, deflate, no ZIP64), plus a 31,123-byte Metadata_and_Code.zip."

