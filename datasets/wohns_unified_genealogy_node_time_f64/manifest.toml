[[resources]]
id = "trees_tsz_nodes_time_members"
origin = "zenodo_5495535"
url = "https://zenodo.org/api/records/5495535/files/{file_key}/content"
type = "range_extracted_zip_member"
version = "1.0.0; per-file size, MD5, central-directory offset/size, member offsets, sizes and CRC32 pinned in resources.tsv"
access = "Two HTTP byte-range GETs per file (206 + exact Content-Range required): the ZIP central directory + EOCD tail, and one contiguous range covering the stored members nodes/time/.zarray and nodes/time/0."
size_bytes = 196693409
sha256 = ""
local_path = "downloads/wohns_unified_genealogy_node_time_f64/"
notes = "Only 196,464,596 member bytes plus 228,813 central-directory bytes of the 3.45 GB deposit are fetched. Each .tsz is a zarr v2 ZipStore with ZIP_STORED members; nodes/time is a single-chunk <f8 array compressed with numcodecs Blosc (zstd, clevel 9, byte shuffle). Whole-file MD5 cannot be checked from ranges; integrity is the ZIP CRC32 of both members (checked against both the central directory and the local headers and pinned in resources.tsv), the zarray shape, and blosc nbytes = shape * 8."

[local_paths]
downloads = "downloads/wohns_unified_genealogy_node_time_f64/"
filtered = "filtered/wohns_unified_genealogy_node_time_f64/"
index = "index/wohns_unified_genealogy_node_time_f64/"
samples = "samples/wohns_unified_genealogy_node_time_f64/"

[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/wohns_unified_genealogy_node_time_f64/samples.jsonl"
summary = "Validate the Zenodo record, range-fetch each arm's ZIP central directory and the stored nodes/time zarr members, check CRC32 and zarr/blosc schema, decode the Blosc1 frame (zstd CLI + byte unshuffle), and write the complete node-time vector of each arm as raw little-endian float64."
deterministic_notes = "resources.tsv (generated by discover.py on 2026-10-09) pins all 39 arms. scripts/blosc1.py is a stdlib Blosc1 decoder (16-byte header; flags byte-shuffle / memcpyed / dont-split; block-start table in any order whose extents must tile the frame exactly; per-block csize == raw size means stored; zstd blocks via the zstd CLI; per-block unshuffle with verbatim trailing bytes) that self-tests on synthetic frames at every build and rejects bitshuffle, split streams and non-zstd codecs. The chr16_p probe frame has flags 0x91, typesize 8, blocksize 1 MiB and its 4 blocks written in reverse order. Samples follow resources.tsv order (chr1_p .. chr22_q). verify.sh re-derives every sample with a separate central-directory-driven member reader and a second Blosc walker, and byte-compares."

[[series]]
id = "tsdate_node_time_generations_f64"
description = "Age of every node of one autosome-arm unified human tree sequence, in generations before present, one complete arm per sample."
semantic_meaning = "tskit node-table `time` column of the inferred ancestral recombination graph for one chromosome arm: the first 7,508 nodes are the sample haploid genomes of the 1000 Genomes phase 3, HGDP and SGDP individuals, with time exactly 0; every later node is an inferred ancestral haplotype dated by tsdate 0.1.4 (inside-outside posterior mean under a mutation-rate and Ne prior, then adjusted by tsdate so every parent is strictly older than its children). Realized: every arm has exactly 7,508 leading zeros; nonzero values start at 0.20-0.62 generations; every arm's maximum is 81,718.5734 (the top of tsdate's time grid, reached by a few dozen to a few hundred root-adjacent nodes per arm); distinct values are about 70-77% of node count."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The file stores nodes/time as zarr dtype <f8; the recipe removes only ZIP framing, Blosc block framing, zstd compression and the byte shuffle (all lossless) and keeps every IEEE-754 float64 bit pattern and the native node order. No value is a widened integer or f32 (0 of 410,868 nonzero chr16_p values are f32-exact)."
source_resources = ["zenodo_record_metadata", "trees_tsz_nodes_time_members"]
source_format = "tskit_zarr_v2_zipstore_trees_tsz_blosc_zstd_byteshuffle_f8"
source_field = "nodes/time"
filtered_input_path = "filtered/wohns_unified_genealogy_node_time_f64/ingest_stats.json"
filtering = "All 39 modern-sample arm files of the deposit; only the nodes/time column. Edge left/right (integer base-pair positions stored as f64), site positions, mutation, individual, population, provenance and metadata columns, and the separate ancient-genome record are excluded."
missing_value_policy = "nodes/time has no missing values: every value must be finite and >= 0, and the zeros must be exactly the leading 7,508 sample nodes (39 x 7,508 = 292,812 values, about 1.0% overall and 0.5-3.7% per arm; they are kept, not dropped, because they are part of the native column). Any NaN, infinity, negative value, zero outside the leading sample block, or a different sample-node count fails build.sh and verify.sh."
conversion = "Parse the fetched central directory, check the pinned stored members, CRC32 both, parse .zarray (zarr_format 2, dtype <f8, order C, filters null, chunks == shape, blosc zstd shuffle 1), decode the Blosc1 frame, require decoded bytes == blosc nbytes == shape * 8, and write the bytes unchanged (already little-endian float64) as one file per arm."
numeric_kind = "float"
bit_width = 64
endianness = "little"
sample_format = "raw homogeneous little-endian float64 vector in native tskit node-ID order"
sample_geometry = "per_node_vector"
sample_rank = 1
sample_axes = ["tskit_node_id"]
natural_record_kind = "chromosome_arm_tree_sequence_node_table"
sample_count = 39
total_size_bytes = 233197720
output_path = "samples/wohns_unified_genealogy_node_time_f64/tsdate_node_time_generations_f64/"
