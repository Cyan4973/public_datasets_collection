manifest_version = 1
dataset_id = "ecmwf_opendata_ifs_vo500_grib_u16"
name = "ECMWF IFS HRES Open Data 0p4-beta 500 hPa Relative Vorticity 24 h Forecast GRIB2 Packed Codes UInt16"
description = "The stored GRIB2 simple-packing 16-bit integer codes of the global 500 hPa relative vorticity field (0.4 deg, 900x451) from the 24 h forecast of every 00z ECMWF IFS HRES run published in the open-data 0p4-beta stream between 2023-01-18 and 2023-06-27 (IFS cycle 47r3), one complete field per run."
homepage = "https://registry.opendata.aws/ecmwf-forecasts/"

[license]
name = "Creative Commons Attribution 4.0 International (plus ECMWF Terms of Use)"
spdx = "CC-BY-4.0"
url = "https://creativecommons.org/licenses/by/4.0/"
citation = "ECMWF (2023). ECMWF real-time forecasts (open data). https://doi.org/10.21957/open-data"
notes = "AWS Open Data Registry entry datasets/ecmwf-forecasts.yaml: 'This ECMWF data is published under a Creative Commons Attribution 4.0 International license (CC-BY-4.0) and the ECMWF Terms of Use' (https://apps.ecmwf.int/datasets/licences/general/). Attribute ECMWF as the source; the ECMWF terms ask users not to imply ECMWF endorsement of derived products."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official ECMWF open-data replica in the public AWS Open Data bucket s3://ecmwf-forecasts (eu-central-1), anonymous HTTPS; numerical weather prediction model output, no personal data."
usage_notes = "Only the 500 hPa relative vorticity 24 h forecast message is taken from each run file; other parameters, levels, steps and run times are not fetched."

[[origins]]
id = "ecmwf_forecasts_aws"
name = "ECMWF real-time forecasts on AWS Open Data"
url = "https://ecmwf-forecasts.s3.eu-central-1.amazonaws.com/"
type = "bucket"
notes = "Public bucket listing allowed (list-type=2). Layout <yyyymmdd>/<hh>z/0p4-beta/oper/<yyyymmdd><hh>0000-<step>h-oper-fc.{grib2,index}; the .index is ECMWF JSON-lines with per-message _offset/_length."

[[resources]]
id = "vo500_24h_messages"
origin = "ecmwf_forecasts_aws"
url = "https://ecmwf-forecasts.s3.eu-central-1.amazonaws.com/<yyyymmdd>/00z/0p4-beta/oper/<yyyymmdd>000000-24h-oper-fc.grib2"
type = "file"
version = "00z runs 2023-01-18..2023-06-27 (161 calendar days), IFS cycle 47r3, GRIB2 template 5.0 simple packing"
access = "Anonymous HTTPS range GET of exactly the bytes [_offset, _offset+_length) given by the matching .index line (param=vo, levelist=500, step=24, _length must equal 811996). S3 SlowDown 503s are retried with back-off; days with HTTP 404 are skipped and logged in downloads/<id>/missing_days.tsv."
size_bytes = 125859380
sha256 = ""
local_path = "downloads/ecmwf_opendata_ifs_vo500_grib_u16/grib/"
notes = "811,996 bytes per message. Per-message SHA-256 is recorded in downloads/<id>/messages.tsv at download time and re-checked by build and verify. 155 of 161 days present (20230427..20230502 have no published 00z 0p4-beta 24 h file: HTTP 404 on the .index, logged in missing_days.tsv)."

