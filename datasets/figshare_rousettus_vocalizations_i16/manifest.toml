size_bytes = 30720
sha256 = ""
local_path = "downloads/figshare_rousettus_vocalizations_i16/zip_tails/"
notes = "End-of-central-directory records; files201 and files202 exceed 4 GiB and carry ZIP64 EOCD records, which are parsed. Entry counts, central-directory offsets and sizes must equal archives.tsv."

[[resources]]
