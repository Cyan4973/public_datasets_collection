[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/nasa_pds_sharad_edr_raw_echo_i8/samples.jsonl"
summary = "Fetch 24 pinned SS19 EDR labels and science telemetry tables, validate label mode/format and every row header, and emit bytes [186:3786) of every 3786-byte row unchanged as one int8 rows x 3600 sample per product."
deterministic_notes = "Selection rule (scripts/sharad.py select, applied to MROSH_0001 INDEX.TAB): INSTRUMENT_MODE_ID SS19, DATA_QUALITY_ID 0, product-ID PRF code 700, START-STOP duration 45-70 s (1,491 candidates); products assigned to six 30-degree bands of mid sub-spacecraft latitude; within each band sorted by (orbit, product ID) and four taken at positions floor((k+0.5)n/4), stepping forward past an orbit already chosen, so 24 products on 24 distinct orbits spanning 2006-341 to 2010-258 and -85.6 to +87.2 degrees latitude. Every selected label asserts RECORD_BYTES 3786, ^STRUCTURE SCIENCE8BIT.FMT, INSTRUMENT_MODE_ID SS19, mode text 'summing 04 sequential echoes ... to 08-bit precision', PULSE_REPETITION_INTERVAL 1428 us, COMPRESSION_SELECTION_FLAG STATIC, NO COMPENSATION, closed-loop tracking DISABLED, DATA_QUALITY_ID 0 and MANUAL_GAIN_CONTROL 10. download.sh rejects size or MD5 mismatches against the volume MD5 list; validate/build reject any row whose OPERATIVE_MODE byte is not 51 (SS19), whose gain byte differs from the label, whose SCIENTIFIC_DATA_TYPE is tracking, or whose DMA_ERROR / TC_OVERRUN / FIFO_FULL / TEST flags indicate an error (all-zero 3786-byte gap-fill rows excepted, preserved and capped at 1%), and any product with fewer than 32 distinct levels, more than 5% constant echo rows, or one level above 50% of values. Output order = sources.tsv ordinal (latitude band, then orbit). verify.sh re-derives every sample independently and byte-compares."

[[series]]
id = "sharad_edr_ss19_echo_i8"
description = "Raw SHARAD received-echo time samples, mode SS19 (on-board sum of 4 echoes, requantized from 32-bit to 8-bit), 3600 samples per echo at 26.67 MHz (real offset-video sampling, ~135 us receive window), one row per transmitted-pulse group at ~175 rows/s."
semantic_meaning = "Signed 8-bit antenna-voltage estimates in data numbers (ECHO_SAMPLES of SCIENCE8BIT.FMT): the 20 MHz chirp echo from the Martian surface and subsurface plus receiver noise, before range compression, Doppler processing or any calibration. Rows are along-track echoes (presummed), columns fast-time samples."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The archived EDR stores the instrument's own 8-bit two's-complement samples (MSB_INTEGER, 8 bits; byte order is moot at 8 bits). The bytes are copied verbatim; no scaling, re-centring or remap."
source_resources = ["ss19_edr_products", "science8bit_fmt"]
source_format = "PDS3 fixed-length binary table SCIENCE_TELEMETRY_TABLE (*_S.DAT, ROW_BYTES 3786) with detached label, structure SCIENCE8BIT.FMT"
source_field = "SCIENCE_DATA.ECHO_SAMPLES (bit column: 3600 items x 8-bit MSB_INTEGER, row bytes 187-3786)"
filtered_input_path = "filtered/nasa_pds_sharad_edr_raw_echo_i8/build_summary.json"
filtering = "Keep all rows of the 24 pinned products; drop only the 186-byte ancillary header (SCIENCE_ANCILLARY.FMT: timing, OST line, orbit model, receive-window fields) of each row."
missing_value_policy = "The format declares no fill value, but the archive contains gap-fill rows whose entire 3786 bytes (header and echo) are zero: 3 consecutive rows (9908-9910) of E_0184801_002, none elsewhere. Such rows are preserved in place as 3600 zeros (row alignment with the source table kept), counted per sample as zero_fill_rows, and capped at 1% of a product's rows. No row or sample is dropped, imputed or clipped; value 0 is otherwise a genuine sample level. Any non-fill row flagged as tracking data, with FPGA error/test flags, or with an operative mode or gain other than SS19/label gain is fatal (none occur). Constant echo rows are preserved but counted; a product with more than 5% constant rows, fewer than 32 distinct levels, or one level above 50% of values is rejected by build and verify."
conversion = "For each product, read FILE_RECORDS rows of 3786 bytes and write bytes [186:3786) of each row in order: output = rows x 3600 int8, row-major (echo, fast-time sample). One sample per EDR product; no cropping, tiling, resampling or concatenation."
numeric_kind = "int"
bit_width = 8
endianness = "little"
sample_format = "raw homogeneous int8 matrix, row-major"
sample_geometry = "radar_sounder_echo_matrix_2d"
sample_rank = 2
sample_axes = ["echo_row", "fast_time_sample"]
natural_record_kind = "sharad_edr_observation_product"
sample_count = 24
total_size_bytes = 901850400
output_path = "samples/nasa_pds_sharad_edr_raw_echo_i8/sharad_edr_ss19_echo_i8/"
