manifest_version = 1
dataset_id = "earthscope_xa_apollo_pse_lunar_seismogram_i16"
name = "Apollo Passive Seismic Experiment (FDSN XA 1969-1977) Long-Period Vertical MHZ Lunar Seismograms, Peaked Mode, Native 10-bit Digital Units as Int16"
description = "Complete UTC days of the long-period vertical (MHZ, 6.625 sps, location 00 = peaked response mode) channel of the Apollo 12, 14, 15 and 16 ALSEP Passive Seismic Experiment seismometers on the Moon, 1971-1977, from the Nunn et al. (2022) restored archive served by EarthScope as FDSN network XA (1969-1977). Steim2 miniSEED decoded losslessly to the native 10-bit digital units (0..1023) with the archive's inline -1 missing-sample marker, written as little-endian int16, one sample per station-day."
homepage = "https://www.fdsn.org/networks/detail/XA_1969/"

[license]
name = "NASA SMD Open Scientific Data Policy"
spdx = "LicenseRef-NASA-SMD-Open-Data"
url = "https://science.nasa.gov/researchers/science-data/science-information-policy/"
citation = "Latham, G. V., et al. 1970, Passive Seismic Experiment, Science 167 (3918): 455-457, https://doi.org/10.1126/science.167.3918.455; Nunn, C., Nakamura, Y., Kedar, S., Panning, M.P., 2022, A New Archive of Apollo's Lunar Seismic Data, Planet. Sci. J. 3, 219, https://doi.org/10.3847/PSJ/ac87af; network DOI https://doi.org/10.7914/SN/XA_1969 (Apollo Passive Seismic Experiments, FDSN XA 1969-1977); data retrieved from the EarthScope FDSN web services, https://service.earthscope.org/fdsnws/."
notes = "Apollo ALSEP Passive Seismic Experiment data are NASA mission data. NASA SMD Scientific Information Policy (re-fetched and validated by download.sh): 'NASA holds this information, including publications, data, and software, as a public trust to increase knowledge and serve the public good. It is Science Mission Directorate (SMD) policy, consistent with NASA and Federal policies, that information produced from SMD-funded scientific research activities be made publicly available.' The FDSN station service lists network XA (1969-1977) with restrictedStatus=open, and the archive authors' getting-started notebook states 'The archive is public at IRIS and the Planetary Data System.' No CC tag exists: the DataCite record for 10.7914/SN/XA_1969 has an empty rightsList. This is the same NASA SMD open-data basis as the accepted nasa_pds_lola_rdr_spot_radius_range_i32, grail_lgrs_kbr1c_ka_band_ranging_f64 and nasa_pds_mola_megdr_i16 recipes. Cite Latham et al. 1970 and Nunn et al. 2022 as requested on the FDSN network page."

