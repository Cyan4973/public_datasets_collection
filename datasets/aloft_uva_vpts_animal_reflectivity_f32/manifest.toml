name = "UVA_VPTS German Weather-Radar Vertical Profiles of Animal Reflectivity (eta) Float32"
description = "Animal reflectivity (eta) vertical-profile time series from 18 German DWD C-band weather radars, one float32 time-by-height matrix per published radar-month VPTS file of the UVA_VPTS deposit."
homepage = "https://doi.org/10.5281/zenodo.14711244"

[license]
name = "Creative Commons Zero v1.0 Universal"
spdx = "CC0-1.0"
url = "https://creativecommons.org/publicdomain/zero/1.0/"
citation = "Shamoun-Baranes, J., Wijers, B.-C., Kranstauber, B., Hoekstra, B., Huybrechts, P., Dokter, A. M., Leijnse, H., Reyniers, M., Stephan, K., Desmet, P. UVA_VPTS - Vertical profiles of biological targets derived from weather radars in Belgium, Germany and the Netherlands. Zenodo, 2025, DOI 10.5281/zenodo.14711244. Described in Desmet et al. (2025), Scientific Data, DOI 10.1038/s41597-025-04641-5."
notes = "Zenodo record 14711244 metadata declares license id 'cc-zero' (validated by download.sh). The Aloft data portal FAQ (https://aloftdata.eu/faq/) states: 'The data in the bucket are available under a Creative Commons Zero waiver.' The record lists https://aloftdata.eu/browse/?prefix=uva/monthly/ as isVariantFormOf. Only the uva/ (UvA-processed RMI/DWD/KNMI) data are used; the Aloft baltrad/ prefix, whose raw inputs come through an OPERA research-only agreement, is not touched. Attribution is not legally required under CC0 but the citation is preserved."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official frozen Zenodo deposit published by INBO with the University of Amsterdam; derived by vol2bird from German Weather Service (DWD) C-band radar volumes. No mirrors."
usage_notes = "Environmental remote-sensing profiles of biological scatterers (mainly migrating birds); no personal or sensitive content. Only the eta column is emitted."

