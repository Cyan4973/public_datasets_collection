manifest_version = 1
dataset_id = "comma2k19_global_pose_ecef_positions_f64"
name = "comma2k19 Global Pose ECEF Camera Positions Float64"
description = "Per-frame Earth-centred Earth-fixed (ECEF) positions of the road-facing camera, at 20 Hz, from comma.ai's post-processed INS/GNSS/vision pose optimizer. Covers all 2,035 one-minute comma2k19 highway segments; each segment's published (N,3) float64 frame_positions array is one sample."
homepage = "https://huggingface.co/datasets/commaai/comma2k19"

[license]
name = "MIT License"
spdx = "MIT"
url = "https://huggingface.co/datasets/commaai/comma2k19/blob/4bff77c7254c654c28d4c2726186b4e825adccee/README.md"
citation = "Harald Schafer, Eder Santana, Andrew Haden, Riccardo Biasini. A Commute in Data: The comma2k19 Dataset. arXiv:1812.05752, 2018."
notes = "The official commaai Hugging Face dataset card at the pinned revision declares `license: mit` in its YAML front matter. download.sh re-checks the card's SHA-256 and that line. The upstream GitHub repository was not reachable from the collection environment, so the HF card is the only license evidence checked first-hand. Keep the MIT notice and the paper citation."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official comma.ai organisation repository on Hugging Face, pinned to commit 4bff77c7254c654c28d4c2726186b4e825adccee. Only the documented raw_data chunk archives are read, by exact byte ranges."
usage_notes = "comma.ai deliberately published the positions under MIT and trimmed them to a ~20 km section of California I-280 between San Jose and San Francisco. They contain no names, plates, addresses or trip endpoints. They are vehicle trajectories from two recording devices (anonymous 16-hex-digit dongle ids) on a public highway, so a reviewer may still weigh location-privacy. The recipe emits no video, no images, and no off-highway data."

