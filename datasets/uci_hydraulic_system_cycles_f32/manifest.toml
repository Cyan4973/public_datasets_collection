source_format = "UCI ZIP archive containing whitespace-delimited decimal matrices"
source_field = "All 6,000 columns of each row in PS1.txt through PS6.txt and EPS1.txt"
filtered_input_path = "filtered/uci_hydraulic_system_cycles_f32/ingest_stats.json"
filtering = "Consider all 2,205 complete source-order rows from the seven documented 100 Hz matrices, then drop the 1,238 PS4 rows that become identical all-zero float32 samples. Exclude 10 Hz and 1 Hz sensors and all condition-label tables."
missing_value_policy = "Missing members, blank rows, malformed or non-finite values, wrong matrix dimensions, float32 overflow, an unexpected constant-cycle count, duplicate retained cycles, or stale/extra outputs fail the recipe. No values within retained cycles are dropped or imputed."
conversion = "Parse each source decimal as a finite number, round once to IEEE-754 binary32, and serialize every cycle row as 6,000 raw little-endian float32 words in source column order."
