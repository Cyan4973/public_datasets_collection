description = "Complete calibrated ~1 kHz gyroscope and accelerometer streams (float64) from the 30 Valve Index sequences of the Monado SLAM Datasets whose published imu0/data.csv carries the Basalt IMU correction exactly once; one gyro sample and one accel sample per recorded headset sequence."
homepage = "https://huggingface.co/datasets/collabora/monado-slam-datasets"

