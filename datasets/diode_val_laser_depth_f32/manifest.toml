manifest_version = 1
dataset_id = "diode_val_laser_depth_f32"
name = "DIODE Validation Laser-Scanner Depth Maps (float32)"
description = "Native float32 metric depth maps from the DIODE validation split: dense per-pixel range from a FARO Focus S350 terrestrial laser scanner reprojected into 1024x768 camera views of indoor and outdoor scenes; one complete depth map per selected, mutually non-overlapping view."
homepage = "https://diode-dataset.org/"

[license]
name = "MIT License"
spdx = "MIT"
url = "https://diode-dataset.org/"
citation = "I. Vasiljevic, N. Kolkin, S. Zhang, R. Luo, H. Wang, F. Z. Dai, A. F. Daniele, M. Mostajabi, S. Basart, M. R. Walter, G. Shakhnarovich. DIODE: A Dense Indoor and Outdoor DEpth Dataset. CoRR abs/1908.00463, 2019."
notes = "diode-dataset.org License section: \"The DIODE dataset and the code is released using the MIT license.\" The statement covers the dataset itself, not only the devkit code (devkit repository LICENSE is also MIT, Copyright (c) 2021 diode-dataset). download.sh re-checks the sentence on every run. Keep the MIT notice and citation with redistributed material."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official publisher archive on the DIODE project's public S3 bucket (linked from diode-dataset.org and the diode-devkit README), anonymous HTTPS, not requester-pays. Scenes are building interiors, campus and urban exteriors scanned with a static tripod laser scanner."
usage_notes = "Only the depth tensors are emitted. RGB images (which could incidentally show people or vehicles), validity masks and surface normals are not collected; depth maps carry no identifying metadata."

[[origins]]
id = "diode_project"
name = "DIODE: Dense Indoor and Outdoor DEpth dataset (TTI-Chicago, University of Chicago, Beihang University)"
url = "https://diode-dataset.org/"
type = "bucket"
notes = "Dataset page lists train/val archives with MD5 hashes; the devkit (https://github.com/diode-dataset/diode-devkit, master 8b1765b7d801a5f5e2877c434ffe164e62ce8c90) documents layout and camera intrinsics."

