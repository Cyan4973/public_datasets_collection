manifest_version = 1
dataset_id = "physionet_eit_thorax_images_f32"
name = "PhysioNet Aeration Study Draeger PulmoVista Thoracic EIT Image Sequences (FEM) Float32"
description = "Complete reconstructed thoracic electrical-impedance-tomography image sequences (32 x 32 pixels, 50 Hz, native float32) from the Draeger PulmoVista 500 exports of the PhysioNet 'Respiratory and heart rate monitoring dataset from aeration study' 1.0.0: the 17 of 20 forced-expiratory-manoeuvre recordings (one per healthy volunteer) that are continuous 50 Hz acquisitions, one sample per recording."
homepage = "https://physionet.org/content/respiratory-heartrate-dataset/1.0.0/"

[license]
name = "Creative Commons Attribution 4.0 International"
spdx = "CC-BY-4.0"
url = "https://creativecommons.org/licenses/by/4.0/"
citation = "Guy, E. F. S., Flett, I., Clifton, J. A., Calje-van der Klei, T., Chen, R., Knopp, J., Moeller, K., & Chase, J. G. (2024). Respiratory and heart rate monitoring dataset from aeration study (version 1.0.0). PhysioNet. RRID:SCR_007345. https://doi.org/10.13026/e4dt-f689. Goldberger, A., et al. (2000). PhysioBank, PhysioToolkit, and PhysioNet. Circulation 101(23), e215-e220."
notes = "The physionet.org project page (open access, 'Anyone can access the files, as long as they conform to the terms of the specified license') declares 'Creative Commons Attribution 4.0 International Public License' for v1.0.0 (DOI 10.13026/e4dt-f689, published 2024-03-20). The release ships LICENSE.txt (14,842 B, sha256 9a78e7f22742dde9f66ae235ec793ba2212019dc4d0ced75c4da09ced0b35fb2, itself listed in the release SHA256SUMS.txt) whose first line is 'Creative Commons Attribution 4.0 International Public License'; download.sh pins and re-checks it. Preserve the dataset, author and PhysioNet attribution."

[safety]
contains_sensitive_data = true
contains_personal_data = false
provenance_notes = "Official PhysioNet open-access (non-credentialed) project, served from the anonymous PhysioNet open-data S3 bucket. Data from 20 healthy adult volunteers recruited under University of Canterbury HREC consent (HREC 2023/30/LR-PS). Files are named only by a study subject number (S01-S20) and trial type."
usage_notes = "Treat as human physiological material. Emitted samples contain only reconstructed EIT pixel values (relative conductivity change, arbitrary units). subject-info.csv (self-reported demographics, asthma, smoking and vaping history), the pressure/flow, ECG, PPG and heart-rate-belt files are neither downloaded nor emitted, and the per-frame wall-clock time stamps, event text, MinMax/event-marker/timing-error integers and Medibus fields of the EIT frames are dropped. Do not attempt linkage or re-identification."

