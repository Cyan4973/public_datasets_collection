name = "USAF RSTN Sagamore Hill Solar Radio Spectrograph (SRS) Daily Dynamic Spectra 25-180 MHz UInt8 (2024)"
description = "Native unsigned 8-bit spectrum-analyser levels (relative logarithmic power, 0-255) from the US Air Force Radio Solar Telescope Network (RSTN) Solar Radio Spectrograph at Sagamore Hill, Massachusetts (site 5), archived by NOAA NCEI: 36 complete 2024 station-day dynamic spectra, each split into its band A (25-75 MHz) and band B (75-180 MHz) sweep-by-channel matrices of 401 linearly spaced channels at a nominal 3 s sweep cadence."
homepage = "https://www.ngdc.noaa.gov/stp/space-weather/solar-data/solar-features/solar-radio/rstn-spectral/"

