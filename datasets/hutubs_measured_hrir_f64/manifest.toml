[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/hutubs_measured_hrir_f64/samples.jsonl"
summary = "Check the DepositOnce CC BY 4.0 record, fetch the 96 pinned measured-HRIR SOFA files and the documentation, walk each file's HDF5 metadata with a pure-stdlib reader (lookup3 checksums verified), require the HUTUBS/CC BY 4.0/SimpleFreeFieldHRIR attributes and an f64 LE Data.IR of shape [440,2,256] at 44.1 kHz on one shared 440-direction grid, inflate and byte-unshuffle the single Data.IR chunk, and emit it unchanged as one raw little-endian float64 sample per subject."
deterministic_notes = "files.tsv pins the 96 file names (subjects 1..96), sizes, Last-Modified and sha256 (discover.sh documents how the list was resolved from the Apache listing: exactly the *_HRIRs_measured.sofa entries). Every file must have: global attributes DatabaseName='HUTUBS', License='cc-by 4.0 (https://creativecommons.org/licenses/by/4.0/)', Conventions='SOFA', SOFAConventions='SimpleFreeFieldHRIR' 1.0, DataType='FIR', RoomType='free field', Title='head-related impulse responses', ListenerShortName='pp<N>'; exactly the 16 SOFA FIR root variables, with name and creation-order link indexes agreeing; Data.IR datatype bytes 11203f000800000000004000340b0034ff030000 (IEEE f64 LE), shape (440,2,256), one chunk (440,2,256)x8 at offset 0 with zero filter mask, pipeline exactly shuffle(8)+deflate, no _FillValue/missing_value/scale_factor/add_offset/valid_* attributes; Data.SamplingRate=44100; SourcePosition (440,3) spherical 'degree, degree, metre' byte-identical across all 96 files. Samples are written in subject order to samples/<id>/measured_hrir_f64/pp<NNN>.bin; index rows carry subject, subject_note (FABIAN / repeated-subject flags), source sha256, Data.Delay, grid sha256, min/max (from the stored f64), distinct and zero counts, float32-exact count and sample sha256; filtered/<id>/build_summary.json holds totals. build.sh and verify.sh first run scripts/selftest.py (synthetic dense-link, dense-attribute SOFA file; 15 build rejection cases and 3 verify tamper cases). verify.sh re-resolves Data.IR through the creation-order index, re-inflates with zlib.decompress and unshuffles with an independent per-element routine, byte-compares every sample, recomputes statistics with array('d'), and rejects NaN/inf/fill, all-zero or constant (direction, ear) rows, fewer than 100,000 distinct values per sample, duplicate samples, orphan sample files, and manifest count/size mismatches."

[[series]]
id = "measured_hrir_f64"
description = "One HUTUBS subject's measured binaural head-related impulse responses: 440 loudspeaker directions x 2 blocked-ear-canal microphones x 256 taps at 44.1 kHz."
semantic_meaning = "Measured free-field head-related impulse response amplitude (dimensionless, deconvolved and processed linear impulse-response values, realized range -3.357 to 2.688 over all 96 subjects): the acoustic transfer from a loudspeaker at one of 440 directions on a full-sphere grid (SourcePosition, spherical azimuth/elevation in degrees, elevations -90..90 in 10-degree rings, radius 1.47 m) to the left and right blocked ear-canal entrances of one subject, recorded in the anechoic chamber of TU Berlin with one rig and one processing chain for all subjects. Axes: M = measurement direction (440, SOFA order), R = receiver/ear (2: index 0 left, ReceiverPosition y > 0; index 1 right), N = tap (256 samples at 44.1 kHz, about 5.8 ms). Taps 0 and 255 are exactly zero (stored as +0.0 or -0.0) in every row of every subject (window edges) and no other tap is ever exactly zero; the direct-path peak falls inside the window and the tails decay (|x| <= 0.043 over taps 200-255 across all subjects)."
role = "primary"
representation_class = "native_numeric"
representation_notes = "Data.IR is stored by the producer as IEEE-754 float64 little-endian; after inflate and HDF5 byte-unshuffle the stored 8-byte patterns are copied unchanged. Not widened float32: in every one of the 96 subjects only the 1,760 exact zeros (taps 0 and 255 of every row) are float32-representable (0.78% of values), and 223,522 of 225,280 values are distinct bit patterns (all nonzero values plus +0.0 and -0.0). The f64 width is the producer's own (the SOFA API for Matlab writes double)."
source_resources = ["measured_hrir_sofa"]
source_format = "SOFA (AES69) SimpleFreeFieldHRIR file: netCDF-4 / HDF5 superblock v2, Data.IR chunked shuffle(8)+deflate float64"
source_field = "Data.IR (M=440, R=2, N=256) float64"
filtered_input_path = "filtered/hutubs_measured_hrir_f64/build_summary.json"
filtering = "All 96 ppN_HRIRs_measured.sofa files of the HUTUBS release (subjects 1..96, the full measured population). Excluded upstream objects: ppN_HRIRs_simulated.sofa (numerically simulated BEM HRIRs on a 1730-point grid, a different generation process), spherical-harmonics .mat files, headphone impulse responses, head meshes and anthropometry. From each file only Data.IR is emitted; Data.Delay (all zero in probed files; recorded in the index), Data.SamplingRate, SourcePosition, ListenerPosition/View/Up, ReceiverPosition and EmitterPosition are metadata and are not written as samples. No directions, ears or taps are dropped."
missing_value_policy = "Data.IR defines the netCDF default double fill (9.969209968386869e36) in its HDF5 fill-value message but has no _FillValue attribute; the single chunk must be present. Fatal in download validation, build and verify: any NaN or infinity, any |x| >= 1000 (netCDF fill or corruption; realized values stay within -3.36..2.69), any (direction, ear) row that is all zero (an unmeasured direction) or constant, and fewer than 100,000 distinct values in a subject. Exact zeros at taps 0 and 255 (both signed-zero bit patterns occur) are genuine window values and are kept unchanged. No value is imputed, clipped, normalized, resampled or reordered."
conversion = "Resolve Data.IR through the root group's dense link storage (fractal heap + v2 B-tree name index, lookup3 name hashes checked); read its version-1 chunk B-tree (exactly one chunk); zlib-inflate the stored chunk to exactly 440*2*256*8 = 1,802,240 bytes and undo the HDF5 byte shuffle (byte plane j of 225,280 elements -> byte j of each element). The result is the [440,2,256] array in C order (direction-major, then ear, then tap), written as little-endian float64 to one file per subject."
numeric_kind = "float"
bit_width = 64
endianness = "little"
sample_format = "raw homogeneous little-endian float64 3-D array [440, 2, 256] in C order"
sample_geometry = "hrir_set_direction_ear_tap"
sample_rank = 3
sample_axes = ["measurement_direction", "receiver_ear", "tap"]
natural_record_kind = "one_subject_measured_hrir_sofa_file"
sample_count = 96
total_size_bytes = 173015040
output_path = "samples/hutubs_measured_hrir_f64/measured_hrir_f64/"
