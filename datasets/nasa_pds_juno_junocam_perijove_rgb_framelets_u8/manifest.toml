[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/nasa_pds_juno_junocam_perijove_rgb_framelets_u8/samples.jsonl"
summary = "Fetch the 35 pinned JunoCam volume indexes, re-derive and fetch 531 candidate labels, then re-derive and fetch the 22 selected lossless colour EDR images. Emit each image's 8-bit DN raster (LINES x 1648, already headerless) as one raw uint8 sample. Products failing the zero-fill/degeneracy rule would be dropped."
deterministic_notes = "Candidate rule (scripts/junocam.py, re-implemented in verify.py). Take every JUNOCAM-EDR row of all 35 INDEX.TAB files and keep the highest PRODUCT_VERSION per product id (later volume on ties). Keep it if: product type C (colour), TARGET_NAME JUPITER, path DATA/EDR/JUPITER/, orbit a positive multiple of 3, RATIONALE_DESC relative time to its own perijove within 60 minutes, and no 'invalid' or 'partial' in RATIONALE_DESC. That gives 531 candidates over 25 perijoves. Selection rule: per perijove, the candidate whose label says COMPRESSION_TYPE = HUFFMAN (lossless) with the smallest |relative time|, ties broken by lowest product id. That gives 22 products (PJ03-PJ72): PJ48, PJ60 and PJ75 have candidates but none that is both lossless and not flagged invalid/partial. As of JNOJNC_0035, no perijove after PJ75 has a qualifying candidate. Label checks: SAMPLE_BIT_MODE_ID SQROOT, SAMPLING_FACTOR 1, FILTER_NAME (BLUE, GREEN, RED), RECORD_BYTES = LINE_SAMPLES = 1648, SAMPLE_BITS 8 UNSIGNED_INTEGER, no line prefix/suffix, LINES = FILE_RECORDS and a multiple of 384, ^IMAGE = the IMG file. Exclusion rule (build and verify, identical): a product is not emitted if more than 2% of its lines are entirely zero (telemetry-loss fill), if one DN value holds more than 50% of its pixels, or if it has fewer than 32 distinct DN. Duplicate payloads fail. verify.sh re-derives candidates and selection with independent parsers, re-checks MD5s, byte-compares every sample with its IMG, and checks index rows, counts, totals and the aggregate DN histogram (at least 200 levels, no DN above half of all pixels)."

[[series]]
id = "junocam_perijove_rgb_lossless_dn_u8"
description = "8-bit JunoCam DN rasters (LINES x 1648) of perijove Jupiter colour pushframe images: 128-line BLUE, GREEN and RED framelets per exposure, in acquisition order, from lossless (Huffman) EDRs."
semantic_meaning = "JunoCam detector data numbers (0-255) after on-board 12-to-8-bit square-root (SQROOT) companding of the Kodak KAI-2020 CCD signal. Pixels lie behind the BLUE, GREEN and RED filter strips of the colour filter array. Each spacecraft-spin exposure reads one 128 x 1648 framelet per filter, and successive exposures follow in time order (SIS 4.3.1.1). Content: Jupiter cloud tops within 45 minutes of closest approach (3,400-62,000 km altitude), belts, zones, jets and polar cyclones. Limb, dark sky and terminator pixels are included where the strip sees them. No decompanding, flat field or geometric correction is applied."
role = "primary"
representation_class = "native_numeric"
representation_notes = "PDS label: SAMPLE_TYPE UNSIGNED_INTEGER, SAMPLE_BITS 8, SAMPLE_BIT_MODE_ID SQROOT, COMPRESSION_TYPE HUFFMAN. The products were losslessly encoded on board and decoded by the ground system, so the archived 8-bit DN equal the camera's companded output. The 8-bit DN is the native quantization; values are copied unchanged."
source_resources = ["junocam_selected_edr_images"]
source_format = "PDS3 detached-label EDR image (JNCE_yyyyddd_ooCnnnnn_Vvv.IMG): fixed-length 1648-byte records, one per image line, IMAGE object at record 1, no header, line prefix or suffix"
source_field = "IMAGE object: LINES x 1648 unsigned 8-bit SQROOT-companded detector DN (BLUE/GREEN/RED framelets)"
filtered_input_path = "filtered/nasa_pds_juno_junocam_perijove_rgb_framelets_u8/ingest_stats.json"
filtering = "Only C-type (colour) Jupiter EDRs within 60 minutes of perijove, from every third perijove, highest product version. Only lossless (HUFFMAN) products are taken: lossy ICT and uncompressed (NONE) products are excluded as different compression regimes. Excluded: methane (M), cruise, Earth-flyby, approach/departure movies and moon targets; 'invalid' or 'partial' products; products failing the zero-fill/degeneracy rule. One product per perijove: the one closest to closest approach."
missing_value_policy = "Every pixel of every emitted image is kept: zero-filled partial lines from telemetry loss (at most 2% fully zero lines per emitted image), DN 0 dark sky, saturated pixels and the zero border columns of each line. Nothing is masked, filled, interpolated or rescaled. Products over the exclusion thresholds are dropped whole by the shared rule. Any size/MD5 mismatch, label deviation, duplicate or constant image fails the recipe."
conversion = "For each pinned IMG, check the label (LINES = FILE_RECORDS, RECORD_BYTES = LINE_SAMPLES = 1648, SAMPLE_BITS 8, no prefix/suffix, ^IMAGE at record 1), the file size (LINES x 1648) and the MD5. The file holds nothing but the IMAGE object, so its LINES x 1648 unsigned bytes, in line order (frame 1 BLUE, GREEN, RED; frame 2 ...), are written to samples/nasa_pds_juno_junocam_perijove_rgb_framelets_u8/junocam_perijove_rgb_lossless_dn_u8/<PRODUCT_ID>.u8. Byte order is irrelevant for 8-bit values. Large records are not split or tiled."
numeric_kind = "uint"
bit_width = 8
endianness = "little"
sample_format = "raw homogeneous uint8 detector data numbers"
sample_geometry = "variable_lines_x_1648_junocam_pushframe_framelet_raster"
sample_rank = 2
sample_axes = ["framelet_line", "detector_sample"]
natural_record_kind = "junocam_edr_colour_pushframe_image"
sample_count = 22
total_size_bytes = 549298176
output_path = "samples/nasa_pds_juno_junocam_perijove_rgb_framelets_u8/junocam_perijove_rgb_lossless_dn_u8/"
