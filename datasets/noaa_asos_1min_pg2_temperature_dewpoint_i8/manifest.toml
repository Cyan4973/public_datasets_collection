[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/noaa_asos_1min_pg2_temperature_dewpoint_i8/samples.jsonl"
summary = "Download 509 pinned DSI 6406 station-month text files, read the dry-bulb temperature and dew-point slots from fixed columns, drop missing, bracket-flagged, out-of-int8-range and malformed values, keep the first row of each LST minute, exclude station-months where either series is valid for <80% of the month's minutes, and emit one int8 sample per station-month per series in file (time) order."
deterministic_notes = "Fixed station list (44 ICAO ids), year 2022, and a uniform 80%-of-complete-month size rule pinned in sources.tsv with exact byte sizes and listing timestamps (regenerable with discover.sh). Rows are processed in file order. A row is structural when it is printable ASCII, at least 103 characters, carries a digit WBAN + the expected ICAO + 16 timestamp digits with the file's LST year-month, column 92 is blank or ']', both 5-character slots (cols 93-97 temperature, 98-102 dew point) are ' vvv ' / '[vvv]' / missing with a right-justified optionally negative 1-3 digit value, and columns 103+ are blank; otherwise it is dropped for both series and counted. Repeated LST minutes (a second consecutive record for the same minute, ~0.25% of rows) are dropped after the first structural row. A station-month is excluded for both series if either series has valid values for fewer than 80% of the calendar month's minutes (9 of 509 in 2022: KDTW 03-05, KEYW 04 and 07, KINL 12, PATO 11-12, PHNL 11), listed in ingest_stats.json. verify.sh re-derives every sample with an independent full-line regex parser and compares bytes, sha256, index fields (including stored-int8 min/max), missing/flagged/out-of-range/duplicate-minute/bad-row counts, the excluded station-month set and manifest totals; it rejects samples with <1000 values, <3 distinct values, or a single value covering >=80% of the sample."

[[series]]
id = "air_temperature_degf_i8"
description = "ASOS average 1-minute dry-bulb air temperature, whole degrees Fahrenheit, reported every minute."
semantic_meaning = "Average dry-bulb air temperature (deg F) over each 1-minute period from the ASOS hygrothermometer at an airport station, one value per reported minute of the station-month (LST)."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The source field is a signed integer number of degrees Fahrenheit written as right-justified ASCII; stored unchanged as two's-complement int8."
source_resources = ["asos_pg2_2022_station_months"]
source_format = "NCEI DSI 6406 fixed-width ASCII station-month file (112-character records)"
source_field = "Average 1-minute dry bulb temperature (Deg F): 5-character slot at 0-based columns 93-97, value in columns 94-96"
filtered_input_path = "filtered/noaa_asos_1min_pg2_temperature_dewpoint_i8/ingest_stats.json"
filtering = "500 of the 509 pinned station-month files (both series valid for >=80% of the month's minutes); the first structural row of each LST minute whose temperature slot holds an unbracketed integer in -128..127."
missing_value_policy = "Missing slots ('[ M ]', 'M', blank) are dropped, not imputed. Repeated LST minutes keep only the first row; station-months with <80% valid minutes in either series are excluded. Values enclosed in square brackets (an undocumented source marker, also seen on pressure/lightning fields) are dropped as flagged and counted. Values outside -128..127 are dropped and counted (none expected; desert stations peak near 118 F). Non-structural rows are dropped for both series and counted; build fails if they exceed 5% of a file. Values are otherwise kept as recorded: NCEI applies no edits, so occasional sensor glitches inside the int8 range remain (one -78 F value at KMSP 2022-08). A sample is therefore the sequence of valid reported minutes in time order, not a gap-filled lattice."
conversion = "ASCII signed decimal integer -> int8, written in source row order; one raw file samples/<id>/air_temperature_degf_i8/<ICAO>_<YYYY-MM>.i8.bin per station-month."
numeric_kind = "int"
bit_width = 8
endianness = "little"
sample_format = "raw homogeneous int8 array"
sample_geometry = "station_month_minute_series"
sample_rank = 1
sample_axes = ["minute"]
natural_record_kind = "asos_station_month_file"
sample_count = 500
total_size_bytes = 20775709
