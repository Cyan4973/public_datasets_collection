[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/sxs_bbh_extrapolated_strain_modes_f64/samples.jsonl"
summary = "Range-fetch and decode (pure-stdlib HDF5: superblock v0, v1 object headers, symbol-table groups, v1 chunk B-tree, shuffle+deflate) the Extrapolated_N2.dir/Y_l{l}_m{m}.dat [N,3] float64 datasets for 2<=l<=4 of 51 SXS:BBH CoM strain files; emit columns 1-2 (Re, Im) interleaved per mode, and column 0 (retarded time) once per simulation."
deterministic_notes = "sims.tsv pins record ids, file keys, sizes and MD5s; download.sh re-validates license and file identity per record, MD5-checks metadata.json and the control file, and accepts range responses only as 206 with exact Content-Range. Build checks float64 IEEE datatype, [N,3] shape with N>=1000, identical row counts and bit-identical time columns across the 21 modes, strictly increasing time, all values finite, no constant mode, N2 group space_translation/boost_velocity attributes equal metadata.json com_parameters, and |h22| peak within -150..+250 M of metadata common_horizon_time with amplitude 0.02..0.6. Verify re-decodes every dataset through a separate row-wise extraction path, byte-compares every sample, checks index sizes/sha256/min/max, rejects constant or non-finite samples and stray files, compares manifest counts, and byte-compares the control simulation's range blocks to the MD5-verified whole file."

[[series]]
id = "sxs_bbh_rhoverm_n2_mode_reim_f64"
description = "Complex asymptotic strain mode r*h_lm/M, real and imaginary parts interleaved, for one (simulation, l, m) with 2 <= l <= 4, -l <= m <= l."
semantic_meaning = "Dimensionless gravitational-wave strain (scaled by extraction radius r and total mass M) of one spin-weight -2 spherical-harmonic mode, extrapolated to future null infinity with polynomial order N=2 and corrected to the center-of-mass frame, sampled on the simulation's non-uniform retarded-time grid from early (junk-radiation) times through inspiral, merger and ringdown."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The HDF5 datasets are IEEE binary64 little-endian; columns 1 and 2 are copied bit-exactly. Interleaving Re/Im row by row reproduces the source row order minus the time column."
source_resources = ["sxs_bbh_com_h5_n2_l4_ranges"]
source_format = "HDF5 (superblock v0) rhOverM_Asymptotic_GeometricUnits_CoM.h5, chunked float64 datasets with shuffle+deflate filters"
source_field = "Extrapolated_N2.dir/Y_l{l}_m{m}.dat columns 1-2 (Re, Im of r*h_lm/M), 2<=l<=4"
filtered_input_path = "filtered/sxs_bbh_extrapolated_strain_modes_f64/ingest_stats.json"
filtering = "Only the Extrapolated_N2.dir group (N3, N4 and OutermostExtraction are near-duplicate extrapolations and are never read) and only modes with l<=4 (21 per simulation; l=5..8 are progressively weaker, down to ~1e-6 at l=8, and increasingly dominated by numerical noise, so they are excluded to keep the amplitude regime narrower). All m including m=0 are kept. Every row of each dataset is kept."
missing_value_policy = "No missing values exist in the source; any non-finite value, constant mode, missing chunk, duplicate chunk, row-count mismatch or time-column mismatch is fatal. Nothing is dropped or imputed."
conversion = "Inflate each chunk (zlib, Adler-32 checked), undo the 8-byte shuffle, place the (C,1) column chunks into the logical [N,3] row-major array, drop edge padding, then write [Re_0, Im_0, Re_1, Im_1, ...] as little-endian float64; one file per (simulation, mode)."
numeric_kind = "float"
bit_width = 64
endianness = "little"
sample_format = "raw little-endian float64, shape [N, 2] row-major (Re, Im)"
sample_geometry = "complex_mode_time_series_interleaved_re_im"
sample_rank = 2
sample_axes = ["retarded_time_step", "re_im"]
