manifest_version = 1
dataset_id = "ncbi_geo_mm285_methylation_idat_mean_u16"
name = "GEO GSE290585 Infinium Mouse Methylation (MM285) IDAT Bead-Type Mean Intensities UInt16"
description = "Native uint16 per-bead-type mean fluorescence intensities (IDAT field 104) from 150 Illumina Infinium Mouse Methylation BeadChip (GPL30650) IDAT files of GEO series GSE290585: the Grn and Red IDATs of the first 75 GSM accessions, one sample per IDAT (one array position x one color channel)."
homepage = "https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE290585"

[license]
name = "NCBI public data (GEO); no NCBI-imposed use restrictions"
spdx = "LicenseRef-NCBI-Public-Data"
url = "https://ftp.ncbi.nlm.nih.gov/README.ftp"
citation = "GEO series GSE290585, 'A Ternary-code DNA Methylome Atlas of Mouse Tissues' (contributors SolMoe Lee and Wanding Zhou, Zhou Lab, Children's Hospital of Philadelphia), PubMed 41057935; platform GPL30650 Infinium Mouse Methylation BeadChip."
notes = "Evidence: the NCBI FTP README served from the same host states 'NOTE: ALL DATA HERE IS PUBLIC, NON-SENSITIVE, UNRESTRICTED SCIENTIFIC DATA SHARING AMONG SCIENTIFIC COMMUNITIES. THESE SERVERS ARE INTENTIONALLY PUBLIC.' download.sh re-fetches README.ftp on every run and fails if that sentence disappears. Caveat: GEO's own disclaimer page (www.ncbi.nlm.nih.gov/geo/info/disclaimer.html, proxy-blocked from this environment, wording not re-verified here) says NCBI places no restrictions on use or distribution of GEO data but that submitters may claim patent, copyright or other IP rights in data they submit, which NCBI cannot assess. No such claim is attached to GSE290585, and the emitted values are machine-generated scanner intensities. Precedents for the NCBI-public-data basis: accepted ncbi_refseq_viral_genomes_u8 (LicenseRef-NCBI-Public-Data) and ena_fastq_quality_phred (INSDC open data, instrument-derived quality values). Attribute GEO GSE290585 and PubMed 41057935."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official NCBI GEO FTP (HTTPS) per-sample supplementary files only. Organism is Mus musculus (C57BL/6J) for every selected GSM, checked against the series matrix at download time; no human subjects or personal data."
usage_notes = "Only the numeric bead-type Mean arrays are emitted. Sample annotations (tissue, BS/bACE conversion) are carried in the sample index as metadata, not as primary payload."

