[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/earthscope_xa_apollo_pse_lunar_seismogram_i16/samples.jsonl"
summary = "Fetch 119 pinned XA station-days of MHZ location-00 Steim2 miniSEED, decode with a self-tested pure-Python Steim2 reader, and emit one little-endian int16 sample (~572,400 values) per station-day that is contiguous, nearly complete and has at most 20% -1 missing-sample markers."
deterministic_notes = "plan.tsv (station, UTC day) was resolved once by discover.sh / scripts/discover.py: 8 crc32-derived candidate days per station-year (S12, S14, S15, S16 x 1971-1977, inside the location-00 MHZ epoch, <= 1977-09-29), a POST presence probe of three 10-minute windows (03:00, 12:00, 21:00 UTC) per candidate, present = >= 95% of window samples and <= 20% -1; then up to 36 days per station round-robin over years. Realized (download 2026-10-09): 106 of 119 plan station-days emitted (S12 30, S14 16, S15 31, S16 29; every year 1971-1977; 60,666,177 values, 121,332,354 bytes); skipped: 5 degenerate (<16 distinct valid levels), 4 short (<99% of a day), 2 inter-record gaps, 2 with >20% -1. 126 of 216 candidates were present (S14 location 00 has little data 1972-1975; location 00 is absent for S12/S15/S16 during the 1975-06-28..1977-03-27 flat-mode period). Build and verify use only local files, process plan rows in order, and name samples XA.<sta>.00.MHZ.<YYYYMMDD>.i16. Each record is decoded with blockette-1000 record length/encoding/word order, header byte order from BTIME, BTIME + time correction + blockette 1001, Steim2 X0/Xn integration constants checked; scripts/selftest_steim2.py (synthetic Steim2 encoder covering every sub-format, Xn corruption and short-frame rejection, chain assembly) runs before every download validation, build and verify. Index rows carry min/max, -1 count, valid min/max, distinct values, mode value and fraction, count of 1023, max |step| between valid values, source record count, max chain timing deviation and sha256; ingest_stats.json lists every skipped station-day with its reason and an aggregate hash."

[[series]]
id = "apollo_pse_mhz_peaked_du_i16"
description = "Raw long-period vertical (MHZ) output of the Apollo ALSEP Passive Seismic Experiment seismometers at stations S12, S14, S15 and S16, peaked response mode (location 00), one complete UTC day per sample, native 10-bit digital units."
semantic_meaning = "Each value is one 10-bit telemetry word (digital units 0..1023) of the long-period vertical seismometer sampled at a nominal 6.625 sps on a constant sampling interval (the archive's ATT channel records the true timing; the stream itself is uniform). The signal is a DC level (realized day modes ~440-520 DU) with thermal/tidal drift, moonquakes and impacts, and telemetry glitches including occasional full-scale 1023 words; -1 marks a missing sample (an absent or invalid telemetry frame) stored inline by the archive."
role = "primary"
representation_class = "native_numeric"
representation_notes = "Steim2 miniSEED stores the integer digital units; decoding is lossless and values are written unchanged as int16 (range -1..1023 checked). The source quantity is 10-bit, so int16 is the narrowest native signed width that also holds the -1 marker."
source_resources = ["xa_mhz_station_days", "xa_channel_inventory"]
source_format = "miniSEED 2 data records (Steim2, encoding 11, 4096-byte) from fdsnws-dataselect"
source_field = "decoded integer samples of channel XA.<station>.00.MHZ (Apollo PSE long-period vertical, peaked mode)"
filtered_input_path = "filtered/earthscope_xa_apollo_pse_lunar_seismogram_i16/ingest_stats.json"
filtering = "Keep only network XA, stations S12/S14/S15/S16, location 00, channel MHZ at 6.625 sps for the plan days (1971-01-01..1977-09-30). Excluded: S11 (Apollo 11, 1969 only), location 01 (flat response mode), the blank-location metadata epochs, the short-period SHZ channel (53 sps), the horizontals MH1/MH2/MHE/MHN and the ATT timing channel. A station-day is emitted only if its records form one contiguous chain (each record starts within 1 sample period of the previous record's nominal end; exact duplicate records dropped; conflicting duplicates, gaps or overlaps reject the day), it holds 566,676..572,401 samples (>= 99% of 86,400 s x 6.625), all values lie in -1..1023, at most 20% of the values are -1, and the valid values take at least 16 distinct levels; otherwise the whole day is skipped and logged (never split, spliced or concatenated across days)."
missing_value_policy = "The archive stores missing samples inline as -1 on its constant-interval stream (Nunn et al. 2022 getting-started notes: 'we use -1 to store a missing sample'). They are source data and are preserved verbatim; the per-sample count is recorded in the index (gap_marker_count) and days with more than 20% -1 are skipped. Full-scale 1023 words and other telemetry glitches are real archive content and are not filtered (count_1023 recorded). Time gaps between records, conflicting overlaps, short days or no data skip the whole station-day (logged in ingest_stats.json). Structurally invalid miniSEED (bad header, missing blockette 1000, non-Steim2 encoding, Steim2 X0/Xn mismatch, wrong stream identity, wrong sample rate) is fatal."
conversion = "Decode each miniSEED record (header byte order from BTIME plausibility, record length and word order from blockette 1000, BTIME + time correction + blockette 1001), integrate Steim2 differences from X0 and check the last sample equals Xn, sort the day's records by start time, drop exact duplicates, require a contiguous chain, concatenate the samples in time order and write them as little-endian int16 (2 bytes per value, ~1,144,800 bytes per day)."
numeric_kind = "int"
bit_width = 16
endianness = "little"
sample_format = "raw homogeneous little-endian int16 array"
sample_geometry = "variable_length_6p625hz_station_day_time_series"
sample_rank = 1
sample_axes = ["sample_index_within_utc_day"]
natural_record_kind = "seismometer_channel_utc_day"
sample_count = 106
total_size_bytes = 121332354
output_path = "samples/earthscope_xa_apollo_pse_lunar_seismogram_i16/apollo_pse_mhz_peaked_du_i16/"
