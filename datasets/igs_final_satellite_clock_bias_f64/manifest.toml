[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/igs_final_satellite_clock_bias_f64/samples.jsonl"
summary = "Validate 182 pinned IGS final 30-s RINEX 3.00 clock files, keep only satellite ('AS') records, and emit one little-endian float64 clock-bias series per (day, GPS PRN) in epoch order."
deterministic_notes = "Fixed source list (sources.tsv, 2024 doy 001-182, GPS weeks 2295-2321) with pinned sizes and sha256. Header checks: RINEX 3.00 type C, ANALYSIS CENTER IGS, TYPES OF DATA include AS, TIME SYSTEM ID (if present) GPS, IGST/GPS-time alignment comments, 'GPS week/Day/MJD' comment equal to the file's week/day, # OF SOLN SATS equal to the GPS-only PRN LIST, and the set of AS satellites equal to the PRN LIST. Data checks: only AR/AS record types, epochs on the 30 s lattice within the file's day and nondecreasing in file order, strictly increasing per PRN, 1-6 values per record with continuation lines for values 3-6, every value token a 12-decimal mantissa that the parsed float64 reproduces exactly. Samples are written in (doy, PRN) order; verify.sh re-derives each with a separate fixed-column parser and byte-compares."

[[series]]
id = "igs_final_gps_satellite_clock_bias_s_f64"
description = "IGS final combined GPS satellite clock offsets, one series per satellite-day at 30-second epochs."
semantic_meaning = "Offset of one GPS satellite's onboard clock from the IGS time scale (IGST, aligned to GPS time), in seconds, as estimated by the IGS final clock combination, sampled every 30 s through one GPS day (up to 2,880 epochs). Values are typically 1e-6 to 1e-3 s with a smooth per-satellite drift and picosecond-level estimation noise."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The source publishes each bias as a decimal E19.12 token (13 significant digits). Parsing to IEEE-754 binary64 is exact with respect to the published decimal: verify.sh checks that formatting every stored value with '%.12e' reproduces the source token. No scaling, differencing or detrending is applied."
source_resources = ["igs_final_30s_clk_2024_doy001_182"]
source_format = "RINEX 3.00 clock data file (gzip-compressed text, IGS0OPSFIN 01D 30S CLK)"
source_field = "AS (analysed satellite clock) data record, first data value: clock bias in seconds"
filtered_input_path = "filtered/igs_final_satellite_clock_bias_f64/ingest_stats.json"
filtering = "Keep every AS record of every file; drop all AR (receiver/station and reference) clock records and every second-and-later data value (bias sigma and any rate/acceleration terms). Satellite-days with fewer than 1,000 AS epochs are excluded and listed in ingest_stats.json; in the realized build none were excluded (5,615 complete satellite-days, 73 gapped with 1,645-2,877 epochs)."
missing_value_policy = "No fill values exist in the source: an epoch at which the combination produced no clock for a satellite simply has no AS record. Samples contain only the present epochs, in ascending epoch order, with no interpolation or sentinel; each index row records first/last epoch index, missing_epoch_count and max_internal_gap_epochs, and ingest_stats.json lists the exact missing epoch indices of every gapped sample. Malformed records, off-lattice or out-of-day epochs, duplicate epochs, non-finite or non-12-decimal tokens, PRN-list mismatches and header-identity failures are fatal."
conversion = "gzip-decompress, skip the variable-length header after END OF HEADER, parse each AS bias token with float(), group by PRN, and write the values as little-endian IEEE-754 float64 ('<d') in epoch order, one file per (doy, PRN): samples/igs_final_satellite_clock_bias_f64/igs_final_gps_satellite_clock_bias_s_f64/2024_DDD_GNN.bin. Days are never concatenated."
numeric_kind = "float"
bit_width = 64
endianness = "little"
sample_format = "raw homogeneous little-endian float64 satellite clock-bias time series"
sample_geometry = "satellite_day_clock_bias_time_series_1d"
sample_rank = 1
sample_axes = ["gps_epoch_30s"]
