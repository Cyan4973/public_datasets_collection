[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Public global atmospheric reanalysis fields produced for the Copernicus Climate Change Service and redistributed by WeatherBench2."
usage_notes = "These are model-assisted meteorological reanalysis fields, not direct observations at every grid point. Preserve Copernicus attribution and the required European Commission/ECMWF disclaimer."

