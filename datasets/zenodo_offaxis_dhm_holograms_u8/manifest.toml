manifest_version = 1
dataset_id = "zenodo_offaxis_dhm_holograms_u8"
name = "Off-Axis Digital Holographic Microscopy Raw Holograms UInt8 (custom common-path DHM, Prosilica GT2450 camera, 405 nm, Zenodo 10632465)"
description = "Raw 8-bit 2048x2048 off-axis interference holograms (carrier-fringe modulated camera frames) from a custom off-axis common-path digital holographic microscope (Wallace et al. 2015 design; Allied Vision Prosilica GT2450 camera) at 405 nm imaging unresolved nanoparticles, beads and lipid vesicles: 6 evenly spaced frames from each of the 17 405 nm videos of Zenodo record 10632465 (Dryad doi:10.5061/dryad.9cnp5hqr7)."
homepage = "https://zenodo.org/records/10632465"

[license]
name = "Creative Commons Zero v1.0 Universal"
spdx = "CC0-1.0"
url = "https://creativecommons.org/publicdomain/zero/1.0/"
citation = "Detectability of unresolved particles in off-axis digital holographic microscopy. Zenodo record 10632465 (2024), also Dryad doi:10.5061/dryad.9cnp5hqr7. Associated article (record isCitedBy): Johnston, Dubay, Serabyn and Nadeau, Applied Optics 63(7):B114 (2024), doi:10.1364/AO.507375."
notes = "The Zenodo record metadata declares license id cc-zero for the whole deposit (Dryad publishes all data under CC0). download.sh re-checks the live record id, title, license and the size and MD5 of every used zip before fetching anything."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official author deposit (Dryad mirror on Zenodo, depositor Jay Nadeau, Portland State University) of laboratory recordings from a custom off-axis common-path DHM (Johnston et al. 2024, Appl. Opt. 63:B114, Methods 2.A) of synthetic particles (alumina, gold, polystyrene beads) and lipid vesicles; no people or biological specimens from humans involved."
usage_notes = "Public CC0 scientific instrument data; only raw hologram camera intensities are emitted. timestamps.txt, macOS AppleDouble entries and the 520 nm video are not used."

[[origins]]
id = "zenodo_10632465"
name = "Zenodo record 10632465: Detectability of unresolved particles in off-axis digital holographic microscopy"
url = "https://zenodo.org/records/10632465"
type = "repository"
version = "published 2024-02-07; 18 zips + README.md"
notes = "Each zip holds one DHM video as <date time>/Holograms/NNNNN_holo.tif (~7 fps) plus timestamps.txt. Deposit README: 2048x2048 raw holograms from a common-mode off-axis DHM, illumination 405 nm unless specified 520 nm, acquired with the software KOALA (LynceeTec). Instrument per the associated article (Johnston, Dubay, Serabyn and Nadeau 2024, Appl. Opt. 63(7):B114, doi:10.1364/AO.507375, Methods 2.A): a custom off-axis common-path DHM described in Wallace et al. 2015, Opt. Express 23:17367; Thorlabs MCLS-1 fibre-coupled diode laser at 405 or 520 nm; Allied Vision Prosilica GT2450 camera (3.45 um pixels, well depth 6500); all frames 2048x2048; acquisition software DHMx. The two sources name different acquisition software (KOALA in the README, DHMx in the paper); both are recorded here as sourced statements. The microscope is not a Lyncee Tec instrument."

