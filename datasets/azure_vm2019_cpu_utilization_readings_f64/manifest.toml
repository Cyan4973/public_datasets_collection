[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/azure_vm2019_cpu_utilization_readings_f64/samples.jsonl"
summary = "Fetch the pinned V2 vm_cpu_readings files 1 and 2 of 195 (plus a 64 KiB head range of file 3), read them as one timestamp-sorted row stream, split it into 5-minute fleet snapshots (joining the one snapshot that straddles the file 1/2 cut and dropping the trailing partial snapshot that continues into file 3), and emit min, max and avg CPU of every complete snapshot as three raw little-endian float64 samples in source row order."
deterministic_notes = "Inputs are sha256-pinned. scripts/build_snapshots.py (gzip + csv module) reads file 1 then file 2 as one row stream and requires every row to have 5 fields, a decimal timestamp, a non-empty vm id and three finite values in [0, 100]; each timestamp must be one contiguous run, consecutive runs exactly 300 s apart, starting at t = 0. A run that crosses the file cut (t = 13,200: 18,322 + 207,895 rows) is one snapshot. The final run is dropped only because file 3's pinned head range starts with the same timestamp (t = 26,400: 109,061 rows dropped); had it abutted, it would be kept. Exactly 88 complete snapshots t = 0..26,100 are required. Rows keep source order inside a snapshot (no sorting by vm id). Duplicate vm ids inside a snapshot, constant samples, a median snapshot below 1,000 values, or more than 1e9 primary bytes are fatal. min <= avg <= max violations are counted, not altered. Index rows carry timestamp_s, snapshot_index, source_files, min/max (from the stored doubles), distinct and zero counts and sha256; filtered/<id>/ingest_stats.json records per-snapshot row counts (per source file) and distinct-vm counts, the straddling snapshot, the dropped partial snapshot and row accounting (20,000,000 read = 19,890,939 emitted + 109,061 dropped). scripts/verify_snapshots.py re-derives every sample with a separate parser (raw zlib streaming, byte splitting, struct '<d' packing), requires byte equality with every sample file, re-checks the missing-value policy, index statistics, stats counters, no stray files, and manifest sample_count/total_size_bytes."

[[series]]
id = "vm_cpu_min_pct_f64"
description = "Minimum CPU utilization of each VM within one 5-minute interval, for every VM reporting at that timestamp."
semantic_meaning = "Minimum CPU utilization (percent of the VM's allocated virtual cores, 0-100) observed during the 5-minute interval ending at the snapshot timestamp, one value per VM reading in the Azure V2 2019 trace."
role = "primary"
representation_class = "native_numeric"
representation_notes = "schema.csv types the column as DOUBLE and the CSV prints full binary64 precision (16-17 significant digits, e.g. 19.898441030801841), so float(token) recovers the publisher's double exactly; no rescaling, rounding or narrowing."
source_resources = ["cpu_readings_file_1", "cpu_readings_file_2", "cpu_readings_file_3_head", "schema_csv"]
source_format = "gzip-compressed headerless CSV (CRLF), rows 'timestamp,vm id,min cpu,max cpu,avg cpu', sorted by timestamp"
source_field = "vm_cpu_readings field 3 'min cpu' (DOUBLE)"
filtered_input_path = "filtered/azure_vm2019_cpu_utilization_readings_f64/ingest_stats.json"
filtering = "Every row of the 88 complete snapshots is kept; no VM or value is filtered. The only rows not emitted are the 109,061 trailing rows of file 2 at t = 26,400, an incomplete snapshot whose remainder is in file 3. The timestamp defines the sample boundary and is kept in the index; the vm id column is dropped."
missing_value_policy = "No missing values are allowed: an empty, non-numeric, NaN/infinite or out-of-range (outside [0, 100]) value, a malformed row, a timestamp gap or repeat, or a duplicate vm id inside a snapshot makes the build fail; nothing is imputed or filtered. Exact zeros are real readings and are kept (counted per sample in the index)."
conversion = "Python float() of the CSV token (exact binary64), written as raw little-endian float64 in source row order; one file per snapshot: samples/<id>/vm_cpu_min_pct_f64/t<timestamp>.f64."
numeric_kind = "float"
bit_width = 64
endianness = "little"
sample_format = "raw homogeneous little-endian float64 array"
sample_geometry = "one_value_per_vm_reading_at_one_timestamp"
sample_rank = 1
sample_axes = ["vm_reading_in_source_order"]
natural_record_kind = "azure_v2_vm_cpu_readings_5min_fleet_timestamp_snapshot"
sample_count = 88
total_size_bytes = 159127512
output_path = "samples/azure_vm2019_cpu_utilization_readings_f64/vm_cpu_min_pct_f64/"

