dataset_id = "zenodo_esrf_mxene_aerogel_microct_slices_u8"
name = "ESRF ID15 Synchrotron Micro-CT of a Freeze-Cast MXene (Ti3C2Tx) Aerogel Under Compressive Strain: Reconstructed Axial Slices UInt8"
description = "220 reconstructed 1381x1381 uint8 axial slices (3.1 um voxels), 20 evenly spaced per volume with a 5% end margin, from all 11 published ESRF ID15 X-ray micro-tomography volumes of one lamellar Ti3C2Tx MXene aerogel imaged at 0-50% compressive strain in 5% steps (Zenodo records 4761663, 4764282, 4766087)."
homepage = "https://doi.org/10.5281/zenodo.4761663"

[license]
name = "Creative Commons Attribution 4.0 International"
spdx = "CC-BY-4.0"
url = "https://creativecommons.org/licenses/by/4.0/"
citation = "Rawson, S. D., Bayram, V., McDonald, S. A., Yang, P., Courtois, L., Guo, Y., Xu, J., Burnett, T. L., Barg, S., and Withers, P. J. CT data; freeze cast aerogel as-cast and following compressive strain; uploads 1-3 of 3. Zenodo, 2021. DOI 10.5281/zenodo.4761663, 10.5281/zenodo.4764282, 10.5281/zenodo.4766087. Accompanies the publication 'Tailoring lamellar MXene aerogel microstructure by compressive straining' (Rawson et al.)."
notes = "The Zenodo metadata of all three records declares license id cc-by-4.0 with access_right open for the whole deposit (the .raw volumes and .txt descriptors). download.sh re-checks title, license, access, and every used file's size and MD5 before fetching anything else. Preserve the authors and DOIs."

