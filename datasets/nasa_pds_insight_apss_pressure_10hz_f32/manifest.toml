manifest_version = 1
dataset_id = "nasa_pds_insight_apss_pressure_10hz_f32"
name = "InSight APSS Pressure Sensor Calibrated Martian Surface Atmospheric Pressure, 10 Hz Full-Sol Records (Pa), Float32"
description = "Calibrated Mars surface atmospheric pressure in pascal measured at 10 samples/s by the InSight lander's APSS pressure sensor (Elysium Planitia), from the NASA PDS Atmospheres Node bundle urn:nasa:pds:insight_ps (data_calibrated collection). 28 full-sol 10 Hz products evenly spaced over the 496 such sol files (sols 169-1098, more than 1.4 Mars years). Each sol's PRESSURE column, 4-decimal ASCII in the source, is parsed into one raw little-endian float32 sample of about 887,770 values in row order."
homepage = "https://atmos.nmsu.edu/data_and_services/atmospheres_data/INSIGHT/insight.html"

