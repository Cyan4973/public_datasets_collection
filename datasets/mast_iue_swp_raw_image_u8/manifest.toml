manifest_version = 1
dataset_id = "mast_iue_swp_raw_image_u8"
name = "IUE SWP Low-Dispersion Raw Camera Images (8-bit DN)"
description = "256 complete 768x768 unsigned-byte raw detector frames from the International Ultraviolet Explorer Short-Wavelength Prime (SWP) SEC-vidicon camera, low dispersion, large aperture, GSFC-acquired, 1978-1995, decoded from the MAST NEWSIPS raw-image FITS files."
homepage = "https://archive.stsci.edu/missions-and-data/iue"

[license]
name = "Public domain (NASA mission data hosted at MAST)"
spdx = "LicenseRef-MAST-Public-Domain"
url = "https://archive.stsci.edu/publishing/data-use"
citation = "International Ultraviolet Explorer (NASA/ESA/UK SERC), SWP camera raw images, Mikulski Archive for Space Telescopes (MAST), Space Telescope Science Institute."
notes = "The MAST Data Use Policy states: 'Most data hosted at MAST are in the public domain (see: open data), and therefore do not have restrictions on use.' Its only copyrighted collections are the Digitized Sky Survey and the Guide Star Catalogs; IUE is neither, and IUE is not a community HLSP. download.sh re-fetches the policy page and fails if the public-domain sentence disappears or the copyrighted list starts naming IUE. Selection is restricted to frames acquired by the NASA GSFC ground station (FITS STATION = 'GSFC'); ESA VILSPA-acquired frames are excluded to keep provenance uniform. Acknowledge IUE, MAST and STScI."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official MAST IUE archive files over anonymous HTTPS; ultraviolet spectrograph detector frames of astronomical targets."
usage_notes = "Only the FITS primary data unit (detector data numbers) is emitted. FITS header text, which includes guest-observer program identifiers and observer names in HISTORY/label-copy cards, is never written to samples, index rows, or sources.tsv; only camera, image number, observing date, exposure time, IUE object class and astronomical target name are kept as metadata."

[[origins]]
id = "mast_iue"
name = "MAST International Ultraviolet Explorer archive"
url = "https://archive.stsci.edu/missions-and-data/iue"
type = "data_portal"
notes = "Selection catalogue: https://archive.stsci.edu/iue/search.php (CSV output). Files: https://archive.stsci.edu/missions/iue/data/swp/<thousand-block>/swpNNNNN.rilo.gz. MAST file-format page (https://archive.stsci.edu/iue/file_formats.html) describes RILO as 'raw image files (a 768x768 byte primary array image)'."

