[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/geoschem_gc1470_fullchem_restart_species_f64/samples.jsonl"
summary = "Check license evidence, fetch the pinned restart file, walk its HDF5 metadata (pure-stdlib reader), inflate and byte-unshuffle each species' 72 level chunks, reassemble them in C order, exclude a fixed list of non-constituent tracers (clock, KPP prod/loss trackers, O2 as a constant multiple of N2), drop single-value-dominated species under a fixed rule, and emit one raw little-endian float64 sample per kept species."
deterministic_notes = "One pinned object (size, multipart ETag). The file must carry the pinned global attributes and exactly 417 root links with 390 SpeciesRst_* variables; the name index (with lookup3 name-hash check) and the creation-order index must agree. Every species must be H5T_IEEE_F64LE, shape (1,72,46,72), chunk (1,1,46,72) x f8, filter pipeline exactly shuffle(8)+deflate (fletcher32 or any other filter is rejected), no defined fill value and no _FillValue/missing_value/scale_factor/add_offset attributes, units 'mol mol-1 dry', long_name 'Dry mixing ratio of species <name>', averaging_method 'instantaneous', 72 chunks at offsets (0,k,0,0) k=0..71 with zero filter masks and non-overlapping extents. Every Jenkins-lookup3 metadata checksum is verified. A fixed semantic exclusion list (21 species in three classes, see the series filtering) is applied before the degeneracy rule. Samples are written in codepoint order of variable name to samples/<id>/species_dry_mixing_ratio_f64/SpeciesRst_<name>.bin; per-species statistics for all 390 variables go to filtered/<id>/species_stats.tsv. build.sh and verify.sh first run scripts/selftest.py (synthetic dense-link restart, 12 rejection cases including a semantically excluded species smuggled into the index). verify.sh requires every excluded name to exist among the 390 species and to be absent from the index and sample directory, re-checks that N2/O2 is the constant 3.72696890394 off the floor, re-resolves through the creation-order index, re-decodes with its own inflate/unshuffle, byte-compares, recomputes min/max/distinct/top-fraction from the sample files, re-applies the drop rule to kept and dropped (non-excluded) species, rejects NaN/inf, netCDF fill, constant and duplicate samples, and checks manifest totals."

[[series]]
id = "species_dry_mixing_ratio_f64"
description = "GEOS-Chem 14.7.0 full-chemistry model state: dry-air mixing ratio of one chemical constituent on the 4x5-degree, 72-level global grid at 2019-01-01 00Z."
semantic_meaning = "Instantaneous dry-air volume mixing ratio (mol of species per mol of dry air) of one transported or chemically active species (gas-phase organics and inorganics, halogens, peroxy radicals, sulfate/nitrate/ammonium, sea salt, dust bins, carbonaceous and secondary organic aerosol tracers), as held in the GEOS-Chem Classic State_Chm species array and written to the restart file at 2019-01-01 00Z, the end of a run starting 2018-12-01 (the Support Team README says the fullchem restarts were obtained from the 14.7.0-rc.0 1-year benchmark). Axes: time (1), lev (72 hybrid sigma-pressure levels, surface first), lat (46, -89 to 89 with half-size polar boxes), lon (72, -180 to 175). All samples share one model, version, grid, meteorology (MERRA-2) and timestamp; diversity comes from the species chemistry (values from exact 0 and the ~1e-30 numerical floor up to 0.823 for N2; no value exceeds 1; very different vertical and horizontal structure)."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The variables are stored as IEEE-754 float64 little-endian; after inflate and HDF5 byte-unshuffle the stored 8-byte patterns are copied unchanged. Probed fields are full-mantissa doubles (float32-exact fraction about 0.000-0.001), not widened float32. Many species carry a numerical floor of about 1e-30 (jittered mantissas) where they are chemically absent, typically the top 13 levels (lev indices 59-71) and, for short-lived biogenic intermediates, much of the free troposphere: across the 365 kept samples the fraction of values below 1e-29 is 0 for 102 species, about 0.18 (13/72) for 25, above 0.5 for 39, and at most 0.79 (EBZ); no kept species holds one exact value across the top 13 levels. This is the model state as written and is kept; species whose maximum never leaves the floor are dropped. Kept fields are 23.6-96.1% distinct values (H2 lowest, HNO3 highest) with a top-value fraction from 0.0003 to 0.342 (O1D, exact zeros); no negative values occur; positive minima reach as low as 7e-80 (XYLE); maxima range up to 0.0324 (H2O) and 0.823 (N2). CO2 is a near-constant prescribed field (2.77073674e-4 to 2.77074396e-4 mol/mol, 181,083 distinct values) and is kept."
source_resources = ["gc1470_fullchem_restart_20190101"]
source_format = "NetCDF-4 / HDF5 (superblock v2) GEOS-Chem Classic restart file, chunked shuffle+deflate float64 variables"
source_field = "SpeciesRst_<species> (time, lev, lat, lon) float64, units 'mol mol-1 dry'"
filtered_input_path = "filtered/geoschem_gc1470_fullchem_restart_species_f64/species_stats.tsv"
filtering = "All 390 SpeciesRst_* variables are decoded. Excluded variables: Chem_* (photolysis J-values, KPP H value, PSC state, aerosol water, deposition, after-chemistry H2O2/SO2, ORVC), Met_* (BXHEIGHT, DELPDRY, TropLev), AREA, and coordinate/bounds/hybrid-coefficient variables: other quantities and units. Fixed semantic exclusions, applied before the degeneracy rule (21 species, recorded with class and reason in species_stats.tsv and ingest_stats.json): (a) clock_tracer: CLOCK (species_database.yml at 14.7.0-rc.0: 'Clock tracer for diagnosing age of air', placeholder MW_g 1.0; values 122 to 4.42e9, an elapsed-time clock, not mol/mol); (b) kpp_prod_loss_tracker: LBRO2H, LBRO2N, LCH4, LCO, LISOPNO3, LISOPOH, LOx, LTRO2H, LTRO2N, LXRO2H, LXRO2N, PCO, PH2O2, POx, PSO4, LNRO2H, LNRO2N (database FullName 'Dummy species to track ...') and PH2SO4, PSO4AQ (SO4-production trackers, KPP/fullchem/CHANGELOG_fullchem.md); reaction amounts accumulated for diagnostics, not constituent concentrations; (c) proportional_duplicate: O2, which equals N2/3.72696890394 at every non-floor cell (ratio range 3.72696890393159-3.72696890394384 over 195,408 cells; re-checked by verify.sh); N2 is kept. Among the remaining species, one is dropped as degenerate (listed in filtered/<id>/ingest_stats.json and the README) when one float64 bit pattern covers more than 50% of its values, it holds fewer than 1,000 distinct values, or its maximum is below 1e-28 (never above the ~1e-30 numerical floor anywhere); this removes fields stuck at a background or zero value. Realized: 365 kept, 21 excluded semantically, 4 dropped as degenerate (NAP and NRO2 81.9% zero; N 52.8% zero; HCFC123 max 4.4e-37)."
missing_value_policy = "The restart variables define no fill value (fill-value message without a defined value, no _FillValue/missing_value attributes) and every chunk must be present. NaN, +-inf and the netCDF default double fill 9.969209968386869e36 are fatal in build and verify (none expected). Zeros and the ~1e-30 numerical floor are genuine model state (no negative values occur) and are kept unchanged. No value is imputed, clipped, rescaled or reordered."
conversion = "Resolve SpeciesRst_<name> through the root group's dense link storage (fractal heap + v2 B-tree name index); read its v1 chunk B-tree; for each vertical level k zlib-inflate the stored chunk to exactly 46*72*8 bytes and undo the HDF5 byte shuffle (byte plane j of 3,312 elements -> byte j of each element); concatenate levels 0..71 so the sample is the (1,72,46,72) array in C order; write the little-endian float64 values to one file per species."
numeric_kind = "float"
bit_width = 64
endianness = "little"
sample_format = "raw homogeneous little-endian float64 3-D model field"
sample_geometry = "global_3d_model_field_time_lev_lat_lon"
sample_rank = 4
sample_axes = ["time", "lev", "lat", "lon"]
natural_record_kind = "one_species_variable_of_one_geoschem_restart_file"
sample_count = 365
total_size_bytes = 696314880
output_path = "samples/geoschem_gc1470_fullchem_restart_species_f64/species_dry_mixing_ratio_f64/"
