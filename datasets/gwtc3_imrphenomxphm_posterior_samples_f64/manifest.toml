notes = "Zenodo MD5 8155a9526c898876ac70a5421a9a20df (smallest pinned file). verify.sh checks that every range block and the table span of this event equal the same bytes of the MD5-verified whole file, and that a whole-file decode of the table matches."

[[resources]]
