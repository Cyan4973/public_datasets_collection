summary = "Validate ten pinned CC0/public-domain Met objects and JPEGs, decode each once to original-resolution RGB24 with FFmpeg's single-threaded bit-exact path, and emit each R, G, and B plane separately."
deterministic_notes = "Object IDs, public-domain flags, image/provenance URLs, source dimensions/sizes/hashes, decoder parameters, output geometry, channel order, plane hashes, distributions, and byte-for-byte re-decoding are enforced."

[[series]]
id = "met_painting_rgb_plane_u8"
description = "Original-resolution decoded RGB color planes from public-domain European painting reproductions."
semantic_meaning = "One red, green, or blue unsigned 8-bit intensity plane spanning one entire museum painting image; channel identity is recorded per sample."
role = "primary"
representation_class = "native_numeric"
representation_notes = "JPEG is the museum's intended image distribution. The recipe decodes its 8-bit three-component image to RGB24, then deinterleaves the three intended color planes without resizing, cropping, normalization, or color-space transformation beyond standard JPEG display decoding."
source_resources = ["met_678013", "met_438490", "met_436175", "met_438816", "met_437313", "met_437323", "met_437631", "met_437854", "met_437686", "met_435904"]
source_format = "8-bit three-component JPEG painting reproduction"
source_field = "decoded original-resolution RGB color intensity plane"
filtered_input_path = "filtered/met_open_access_paintings_u8/ingest_stats.json"
filtering = "Keep all ten reviewed public-domain paintings and all three nondegenerate RGB planes from each. Exclude JPEG container bytes and all API metadata from numeric output."
missing_value_policy = "Decoded color planes have no missing marker. Missing or changed rights metadata, source identity, dimensions, decoder, channel count, output size, or degenerate planes fail the recipe; no pixels are dropped or imputed."
conversion = "Decode each JPEG once to original-resolution RGB24 using single-threaded FFmpeg with bitexact, accurate-rounding, and full-chroma-integer flags; deinterleave R, G, and B bytes into separate row-major planes."
numeric_kind = "uint"
bit_width = 8
endianness = "little"
sample_format = "raw homogeneous uint8 decoded painting color plane"
sample_geometry = "2d_painting_color_plane"
sample_rank = 2
sample_axes = ["y", "x"]
natural_record_kind = "decoded_painting_color_plane"
sample_count = 30
total_size_bytes = 329612454
output_path = "samples/met_open_access_paintings_u8/met_painting_rgb_plane_u8/"
