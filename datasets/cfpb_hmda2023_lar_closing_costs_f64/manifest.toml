manifest_version = 1
dataset_id = "cfpb_hmda2023_lar_closing_costs_f64"
name = "HMDA 2023 Snapshot Public LAR Per-Loan Closing-Cost Amounts Float64"
description = "Per-loan mortgage closing-cost dollar amounts (total loan costs, origination charges, discount points, lender credits) from the FFIEC/CFPB HMDA 2023 snapshot national loan-level public LAR, one float64 column per cost field per state."
homepage = "https://ffiec.cfpb.gov/data-publication/snapshot-national-loan-level-dataset/2023"

[license]
name = "Public domain (U.S. federal government statutory data release, CFPB/FFIEC)"
spdx = "LicenseRef-US-Government-Public-Domain"
url = "https://www.consumerfinance.gov/privacy/website-privacy-policy/"
citation = "Consumer Financial Protection Bureau / Federal Financial Institutions Examination Council, HMDA 2023 Snapshot National Loan-Level Dataset, https://ffiec.cfpb.gov/data-publication/snapshot-national-loan-level-dataset/2023"
notes = "CFPB legal notice: 'Information created by the CFPB is in the public domain ... you may reproduce, publish, or otherwise use it without the Bureau's permission. Please consider appropriate citation to the Bureau as the source.' The public LAR is compiled and released by CFPB on behalf of the FFIEC under the Home Mortgage Disclosure Act (12 U.S.C. 2801 et seq.) and Regulation C (12 CFR 1003.5(c)), which require public disclosure. The extracted values are factual dollar amounts. There is no per-file license document, so the grant rests on the CFPB site notice and the statutory public-release status."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official FFIEC/CFPB static-data host. The file is the privacy-modified public LAR (Regulation C public-disclosure modifications already applied by CFPB): no names, addresses, application dates, or loan identifiers. Only four closing-cost dollar columns plus the state code used for partitioning are read. No LEI, census tract, demographic, or other quasi-identifier fields are emitted."
usage_notes = "Cite CFPB/FFIEC HMDA as the source. Only numeric cost amounts are emitted."

[[origins]]
id = "ffiec_hmda_snapshot"
name = "FFIEC HMDA Platform: Snapshot National Loan-Level Dataset"
