[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/noaa_stofs2d_glo_adcirc_station_water_level_f64/samples.jsonl"
summary = "Check 40 pinned S3 objects against fresh listings, download them resumably, validate size and multipart ETag, decode each file's zeta variable (1260 x 1688 float64, chunked (1, 1688), shuffle+deflate) with a pure-stdlib HDF5 reader, and emit one raw little-endian float64 matrix per 00z cycle in native time-major order."
deterministic_notes = "sources.tsv (date, key, size, ETag) is pinned by SHA-256 and must follow the 00z / 20-day lattice from 2024-06-01. Each file must have superblock v0, exactly the root links time/station/namelen/station_name/x/y/zeta, global version noaa.stofs.2d.glo.v2.1.0r1.v55.12 plus pinned model/agrid/title/runid/grid_type/_NCProperties/_FillValue/dry_Value/dt/ihot, rundes naming the cycle, rnday equal to the cycle day, zeta attributes (long_name, standard_name, units m, _FillValue -99999.0), zeta little-endian IEEE float64 shape (1260, 1688), chunk dims (1, 1688), filter pipeline exactly [shuffle(8), deflate(2)], 1260 chunks with offsets (t, 0) and filter mask 0, each inflating to exactly 13,504 bytes, a time axis equal to cycle - 21600 s + 360 s * (i + 1), x/y SHA-256 5849e368...519751 and station_name SHA-256 95ccd6fd... (cycles before 2025-03-08) or 228aa2dd... (from 2025-03-08; one station label renamed). h5lite verifies the lookup3 checksum of every v2 object header chunk. Build takes the chunk list by recursive B-tree descent and unshuffles; verify rebuilds it from the leaf sibling chain and re-shuffles samples for byte comparison. A synthetic HDF5 self-test (scripts/selftest_stofs.py) runs before check-downloads, build and verify. Samples sorted by cycle date. Floors: 40 samples of 2,126,880 values (median 2,126,880); 85,075,200 values total."

[[series]]
id = "stofs2d_glo_fcst61_zeta_f64"
description = "STOFS-2D-Global v2.1 ADCIRC station water-surface elevation, one full 1260 x 1688 station matrix per 00z forecast cycle."
semantic_meaning = "Simulated water-surface elevation above the geoid in metres (zeta, standard_name sea_surface_height_above_geoid; combined astronomical tide + GFS-forced storm surge + sea-ice effects) from NOAA's operational ADCIRC STOFS-2D-Global v2.1 run, at the 1,688 fixed output stations (coastal tide gauges and NOAA/NWS forecast and verification points worldwide), every 6 minutes from cycle - 5.9 h (end of the nowcast) to cycle + 120 h. Across the 40 cycles 1,687 stations stay within -10.73..+8.23 m; station index 1649 (label 'UJ816 SOUS00 SA816', 35.44E 46.22N on the Sea of Azov coast) carries an unphysical native model level of 45.9..219.8 m in every cycle (a model artifact at that node, not a real water level) and is kept unchanged as published."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The NetCDF4 variable zeta is stored as little-endian IEEE float64 (full 52-bit mantissa model output, not decimal-rounded). The recipe inflates each (1, 1688) chunk, reverses the HDF5 byte-shuffle (element size 8) and writes the resulting doubles unchanged; no scaling, rounding, masking or reordering."
source_resources = ["s3_object_listings", "fcst61_netcdf_00z_cycles"]
source_format = "NetCDF4/HDF5 (ADCIRC fort.61 station output), variable chunked (1, 1688) with shuffle + deflate filters and indexed by a version-1 chunk B-tree"
source_field = "zeta (float64, dims time=1260 x station=1688)"
filtered_input_path = "filtered/noaa_stofs2d_glo_adcirc_station_water_level_f64/ingest_stats.json"
filtering = "Keep only the 00z cycle's stofs_2d_glo_fcst.61.nc on 40 dates spaced 20 days apart (2024-06-01 .. 2026-07-21, inside the homogeneous STOFS v2.1 / 1,688-station / 1,260-step window 2024-05-21 .. 2026-08-11), so the 126-hour windows never overlap. All 1260 time steps and all 1688 stations of each matrix are kept; no cycle, station or step is dropped."
missing_value_policy = "Native fill is preserved: ADCIRC writes -99999.0 (the variable's _FillValue and the global dry_Value) where a station's node is dry at that output step. These sentinels are kept in place, counted per sample (fill_count, stations_with_fill, always_fill_stations) and excluded from the recorded min/max/mean. Realized: 132,410 fill values (0.156% of 85,075,200), 6..33 stations with any fill per cycle, and exactly one station (index 119, Fajardo PR, NOAA 9753216) that is fill at every step of every cycle; it is kept as an all-fill column. The anomalous station 1649 (see semantic_meaning) is likewise kept unmodified. Every non-fill value must be finite and inside the sanity bounds (-100, 500) m (no clipping; anything outside is fatal), each sample needs at least 100,000 distinct non-fill values and differing first/last steps, and no two samples may be identical. Build and verify apply the same rules; any NaN/Inf, out-of-bounds value, wrong product/version/lattice/station set, filter change or chunk anomaly is fatal."
conversion = "Resolve root link zeta (compact link messages), check Dataspace (1260, 1688), Datatype float64 LE, Filter Pipeline [shuffle(8), deflate(2)] and Layout v3 chunked (1, 1688, 8); take the 1260 chunk addresses from the version-1 B-tree, zlib-inflate each to exactly 13,504 bytes, byte-unshuffle with element size 8 (byte j of element k is stored at j*1688 + k) and concatenate the rows in time order. Each sample is one raw little-endian float64 file of 1260 x 1688 values (row = time step, column = station in file order), 17,015,040 bytes."
numeric_kind = "float"
bit_width = 64
endianness = "little"
sample_format = "raw homogeneous float64 station x time matrix"
sample_geometry = "1260_time_steps_x_1688_stations_6_minute"
sample_rank = 2
sample_axes = ["time", "station"]
natural_record_kind = "stofs2d_glo_00z_cycle_fort61_station_zeta_matrix"
sample_count = 40
total_size_bytes = 680601600
output_path = "samples/noaa_stofs2d_glo_adcirc_station_water_level_f64/stofs2d_glo_fcst61_zeta_f64/"
