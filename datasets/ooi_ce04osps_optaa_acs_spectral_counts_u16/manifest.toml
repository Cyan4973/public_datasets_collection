sample_index_path = "index/ooi_ce04osps_optaa_acs_spectral_counts_u16/samples.jsonl"
summary = "Strip OOI port-agent framing (type-1 frames, XOR-checksummed), reassemble the AC-S serial byte stream, keep accepted 707-byte AC-S packets (registration ff00ff00, record length 704, sum checksum, zero pad, deployment header identity), and emit each packet's 84 x 4 big-endian uint16 spectral counts as little-endian uint16 in packet order."
deterministic_notes = "Deployment window: AC-S serial 128 with 84 wavelengths, 2019-01-01 .. 2019-06-13 (after the 2019-06-14 .. 06-25 outage the archive carries serial 221 with 88 wavelengths and 736-byte records). Day selection (scripts/select_days.py, run by discover.sh): files named ..._2019MMDDT07(20|21)_UTC.dat whose listing date equals the file date, listing time 21:4x and listed size 23-25M (complete 07:20-21:44 UTC files; 154 of them in the window), targets 2019-01-01 + 5k days, an ineligible target replaced by the next eligible unused day; result 33 files in sources.tsv order. Per file: every port-agent frame XOR-valid and contiguous to EOF; first data frame 07:10-07:45 UTC and last 21:30-22:00 UTC of the file date; >= 15,000 accepted packets; every accepted packet has packet type 5, reserved 1, meter type 0x53, serial 128 and N = 84 (any deviation fails the day); accepted / (accepted + rejected length-704 candidates) >= 0.5 as a parser-sanity floor; each of the 4 channels has >= 64 distinct values and no value above 50% share. Packet acceptance: record length 704, sum(bytes[0:704]) & 0xffff equals the stored BE checksum, pad byte 0, and no ff00ff00 inside bytes [4, 704); after an accepted packet the scan resumes at +707. Rejected candidates are packets whose tail (~215-230 bytes) was lost upstream: each starts at an unusually large 272-byte port-agent frame, is followed by a ~215-byte frame and a ~208 ms gap, and the next frame opens with a fresh registration 478-499 bytes after the truncated one (0-20% of packets per probed hour)."

