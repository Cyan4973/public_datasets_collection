[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/gwtc3_imrphenomxphm_posterior_samples_f64/samples.jsonl"
summary = "Range-fetch the HDF5 metadata and the contiguous C01:IMRPhenomXPHM/posterior_samples compound table of 33 GWTC-3 BBH *_mixed_cosmo.h5 files; decode the table with a pure-stdlib HDF5 reader (superblock v0, v1 object headers, symbol-table groups, compound datatype of IEEE float64 members) and write each of 18 selected members as one raw little-endian float64 sample per event, in source row order."
deterministic_notes = "sources.tsv pins the 33 file keys, sizes and Zenodo MD5s plus each table's row count, member count and byte span; download.sh re-validates the record license and file identity, accepts range responses only as 206 with exact Content-Range, resolves every table through the HDF5 metadata and requires it to match the pinned span, MD5-checks the control file, and runs a semantic table check (finite, non-constant, inside physical bounds). build and verify use only local files; verify re-extracts every sample through an independent per-row slicing path, byte-compares it, checks index sizes/sha256/min/max, manifest totals, stray files, mass ordering, and the control-file comparison. Floor: 594 samples, median 39475 values (min 3,341, max 249,520 rows)."

