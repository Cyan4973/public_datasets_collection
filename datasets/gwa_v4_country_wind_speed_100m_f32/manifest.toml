[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/gwa_v4_country_wind_speed_100m_f32/samples.jsonl"
summary = "Fetch 31 pinned GWA 4.0 country wind-speed-at-100-m BigTIFFs, validate size, MD5 (= S3 ETag) and BigTIFF structure, decode every IFD0 tile (zstd CLI, then undo the TIFF floating-point predictor), crop edge tiles, and write each complete country grid as raw little-endian float32."
deterministic_notes = "countries.tsv is the single pinned list (iso3, URL, size, ETag/MD5, optional sha256, Last-Modified, IFD0 width/height/tile count, upper-left corner, overview valid-share estimate); discover.sh documents how it was resolved on 2026-10-06 from a 77-country hand-picked pool (rule: HEAD 200, single-part ETag, <= 17 MB, smallest-overview valid share >= 0.45; 31 of the 43 qualifying countries pinned for regional spread under ~400 MB). Only the wind-speed layer at 100 m is used; no other GWA layer or height is fetched. scripts/gwa_tiff.py self-tests its predictor/BigTIFF decoder on synthetic input at every build. verify.sh re-derives every raster with a separate decoder and byte-compares it."

[[series]]
id = "gwa_v4_wind_speed_100m_f32"
description = "Global Wind Atlas 4.0 modelled long-term mean wind speed at 100 m above ground level, one complete country raster per sample."
semantic_meaning = "Per-pixel mean wind speed (m/s) at 100 m a.g.l. from the GWA 4.0 microscale model: ERA5 reanalysis (2008-2017) drives WRF mesoscale simulations at 3 km, whose generalized wind climates are downscaled with PyWAsP to a predicted wind climate every 0.0025 degrees (Copernicus DEM30 terrain, WorldCover 2021 land cover, ETH tree heights) within each country boundary including its offshore exclusive economic zone. This is a modelled climatology, not a measurement."
role = "primary"
representation_class = "native_numeric"
representation_notes = "GWA distributes this layer as float32 GeoTIFF; the recipe only removes TIFF tiling, ZSTD compression and the floating-point predictor (all lossless) and changes byte order to little-endian. No resampling, reprojection, masking, unit change or reordering is applied; NaN nodata is kept bit-exact."
source_resources = ["gwa4_country_wind_speed_100m_tifs"]
source_format = "gdal_cloud_optimized_bigtiff_zstd_floating_point_predictor_float32"
source_field = "band_1_mean_wind_speed_100m_agl_m_per_s"
filtered_input_path = "filtered/gwa_v4_country_wind_speed_100m_f32/ingest_stats.json"
filtering = "Keep every pixel of the full-resolution IFD0 of each of the 31 pinned country files. Overview IFDs, other GWA layers (power density, capacity factors, Weibull parameters, air density, IEC classes) and other heights (10, 50, 150, 200 m) are not used."
missing_value_policy = "Pixels outside the GWA country + EEZ mask are the source nodata NaN (GDAL_NODATA 'nan', bit pattern 0x7fc00000) and are preserved in place, not stripped or imputed. build.sh and verify.sh both require every NaN to carry exactly that bit pattern, a per-country valid share within 0.30..0.90, all valid values finite within 0..40 m/s, at least 10,000 distinct valid values and a valid span of at least 0.5 m/s; verify.sh also requires the dataset-wide valid share within 0.45..0.75. Per-country nan_count, valid_count and valid_share are recorded in the sample index. Realized: valid share 0.520 (KHM) .. 0.736 (SWZ) per country; 55,783,476 valid and 39,827,941 NaN values overall (valid share 0.583); valid values span 0.066 .. 21.62 m/s. Any size/MD5/structure mismatch, short tile, foreign NaN pattern or degenerate raster is fatal."
conversion = "Parse the BigTIFF IFD chain with struct; for each IFD0 tile, decompress with the zstd CLI (each tile must yield exactly 512*512*4 bytes), undo the TIFF floating-point predictor per tile row (byte-wise cumulative sum mod 256 over 4*512 bytes, then rebuild each float from the four MSB-first byte planes at offsets 0, 512, 1024, 1536), write little-endian float32, place tiles into a height x width row-major grid (north row first, west column first) and crop right/bottom edge tiles. One sample per country file. Index min/max are computed over non-NaN stored float32 values."
numeric_kind = "float"
bit_width = 32
endianness = "little"
sample_format = "raw homogeneous float32 raster"
sample_geometry = "country_bounding_grid_0p0025_deg_wgs84"
sample_rank = 2
sample_axes = ["latitude_north_to_south", "longitude_west_to_east"]
natural_record_kind = "complete_gwa_v4_country_raster_full_resolution_ifd0"
sample_count = 31
total_size_bytes = 382445668
output_path = "samples/gwa_v4_country_wind_speed_100m_f32/gwa_v4_wind_speed_100m_f32/"
