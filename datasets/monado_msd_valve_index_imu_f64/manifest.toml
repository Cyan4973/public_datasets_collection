download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/monado_msd_valve_index_imu_f64/samples.jsonl"
summary = "Range-fetch the stored imu0/data.csv member of each of the 30 single-correction Valve Index sequence archives in the pinned HF revision, validate it against the pinned ZIP central-directory metadata, parse the 7-column EuRoC IMU table, and emit per-sequence row-major float64 gyroscope and accelerometer matrices plus an auxiliary int64 timestamp vector."
deterministic_notes = "sources.tsv (produced by discover.sh from 128 KiB archive tails, a 1 MiB central-directory window per archive and 1 KiB at each local header, then filtered to the in-scope 30) pins part file, size, LFS SHA-256, disk number, local-header offset and length, member size and CRC-32 for the 30 sequences; download.sh pins the 19 excluded sequence names and requires tree = sources + EXCLUDED. Build requires the exact header, 7 fields per row, digit-only timestamps and finite values, keeps every row in source order, reports duplicate/backward timestamp steps instead of dropping rows, fails above 0.1% non-increasing steps (realized: 0), requires each sequence's accel-x lattice step (median of distinct-value gaps below 1.5x the smallest gap) to equal the single-correction step 0.0023266877217 within 1e-9, records it as accel_x_lattice_step, and pins the realized total of 9,026,215 rows. Verify re-derives every sample with a separate parser, byte-compares it, recomputes index metadata, manifest totals and the lattice step independently (plus every distinct accel-x value on the single-correction lattice), asserts that no excluded sequence appears in sources, index or sample directories, and checks that the median accelerometer norm is near 1 g and the median timestamp step near 1 ms."

[[series]]
id = "msd_valve_index_gyro_w_rs_s_f64"
description = "Calibrated Valve Index headset gyroscope stream, one complete recorded sequence per sample."
semantic_meaning = "Angular velocity of the IMU sensor frame S relative to the world frame R, expressed in S (w_RS_S x, y, z) in rad/s, sampled at ~1 kHz on the device clock, after exactly one application of the published Basalt scale-misalignment and bias correction."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The source CSV prints IEEE-754 binary64 values in shortest round-trip form (16-17 significant digits); float() recovers the exact published doubles, so no rounding or widening occurs. Calibrated data.csv is chosen over data.raw.csv (raw measurements printed with 10 decimals before the documented correction) because it is the dataset's canonical EuRoC-format IMU stream that SLAM systems consume directly, and over data.extra.csv, which holds host arrival times rather than measurements. Scope evidence: upstream data.csv carries the Basalt correction in three states. In the kept 30 sequences (MIO04-MIO16, MIPB01-MIPB08, MIPP01-MIPP06, MIPT01-MIPT03) the accel-x count lattice step is 0.0023266877 m/s^2 (device count scale x (1 + calib_accel_bias[3] = -0.028198018)) and the gyro rest offset is ~0. In MIC02-MIC16 and MIO01-MIO03 (18) the step is 0.0022610797 (one extra factor 0.971802) and the gyro rest offset is ~(+0.018, -0.007, +0.007) rad/s, i.e. about -1x the published calib_gyro_bias (-0.0171, 0.0075, -0.0056); in MIC01 the step is 0.0021973218 (0.971802^2 more) with a rest offset of about -2x the bias. Those 19 over-corrected sequences are excluded rather than locally re-corrected (undoing the extra passes would be a synthetic remap)."
source_resources = ["valve_index_imu0_data_csv_members"]
source_format = "EuRoC/ASL-format IMU CSV (mav0/imu0/data.csv) stored in per-sequence ZIP archives"
source_field = "w_RS_S_x [rad s^-1], w_RS_S_y [rad s^-1], w_RS_S_z [rad s^-1] columns"
filtered_input_path = "filtered/monado_msd_valve_index_imu_f64/ingest_stats.json"
filtering = "All rows of the 30 Valve Index sequences whose published data.csv carries the Basalt correction exactly once: MIO04-MIO16 (13), MIPB01-MIPB08 (8, including the split MIPB08 long session), MIPP01-MIPP06 (6) and MIPT01-MIPT03 (3); 9,026,215 rows. Excluded: MIC01-MIC16 and MIO01-MIO03 (correction applied two or three times, see representation_notes) and the HP Reverb G2 (MG) and Samsung Odyssey+ (MO) devices (different IMUs)."
missing_value_policy = "No values are missing in the source. Header changes, rows without exactly 7 fields, non-digit timestamps, empty or non-finite values, CRC/size mismatches, constant components or more than 0.1% non-increasing timestamp steps fail the recipe; no rows are dropped, reordered or imputed."
conversion = "float() on each decimal field; rows written in source order as little-endian row-major (x, y, z) float64 triples; one file per sequence."
numeric_kind = "float"
bit_width = 64
endianness = "little"
sample_format = "raw homogeneous little-endian float64 row-major imu_sample x component matrix"
sample_geometry = "imu_time_series_xyz_matrix"
sample_rank = 2
sample_axes = ["imu_sample", "xyz_component"]
natural_record_kind = "complete_msd_valve_index_sequence_gyroscope_stream"
sample_count = 30
total_size_bytes = 216629160
output_path = "samples/monado_msd_valve_index_imu_f64/msd_valve_index_gyro_w_rs_s_f64/"

