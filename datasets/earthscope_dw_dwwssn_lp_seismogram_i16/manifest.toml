manifest_version = 1
dataset_id = "earthscope_dw_dwwssn_lp_seismogram_i16"
name = "Digital World-Wide Standardized Seismograph Network (FDSN DW, USGS ASL 1980-1994) Sprengnether S-5007-V Long-Period Vertical (LHZ, 1 sps) Seismograms, Native DWWSSN 16-bit Counts"
description = "Complete UTC station-days of the long-period vertical channel (LHZ, 1 sample/s) of the USGS Albuquerque Seismological Laboratory DWWSSN stations, restricted to the epochs recorded with the Sprengnether Series 201 S-5007-V seismometer at nominal scale 5.0E8 (14 stations, 1980-1993), fetched from the EarthScope FDSN dataselect service as miniSEED with data encoding 32 (DWWSSN signed 16-bit integers) and written unchanged as little-endian int16 digitizer counts, one sample per station-day."
homepage = "https://www.fdsn.org/networks/detail/DW/"

[license]
name = "U.S. Government work (USGS), public domain in the U.S.; USGS releases federal data under CC0"
spdx = "LicenseRef-US-Government-Public-Domain"
url = "https://www.usgs.gov/data-management/data-licensing"
citation = "Albuquerque Seismological Laboratory/USGS (1980): Digital World-Wide Standardized Seismograph Network (DWWSSN), International Federation of Digital Seismograph Networks, network DW, https://doi.org/10.7914/SN/DW; data retrieved from the EarthScope FDSN web services, https://service.earthscope.org/fdsnws/."
notes = "The FDSN network page (re-fetched and validated by download.sh) states network DW is 'Operated by Albuquerque Seismological Laboratory/USGS (ASL), United States of America', DOI 10.7914/SN/DW; the EarthScope station service lists <Network code=\"DW\" ... restrictedStatus=\"open\"> (also validated). USGS data-licensing page (validated): works of the U.S. Government are 'in the U.S. public domain, which means that anyone may use, copy, distribute, adapt, display and perform that work in the U.S. without permission', and data 'wholly produced by USGS employees and will be managed and released by USGS' use CC Zero. Caveat: DWWSSN stations were installed at host institutions abroad (e.g. TOL Spain, KEV Finland, GDH Greenland), but the network, instruments, digitizers and data distribution were ASL/USGS; no separate host-institution data terms are attached to the DW network or its DataCite DOI. Same U.S. public-domain basis as the accepted NOAA/USGS recipes (LicenseRef-US-Government-Public-Domain)."

[safety]
