contains_personal_data = true
provenance_notes = "Official Zenodo deposit by the study authors. Thirty eligible Fitbit users consented to the submission of their tracker data; upstream rows are keyed by a pseudonymous numeric export Id only (no names, demographics or locations)."
usage_notes = "Heart rate is health-related data, hence the conservative flags. The recipe emits only the bpm Value column; Ids are replaced by an ordinal (p01, p02, ...) in file names and index rows and are never emitted as data. Steps, calories, METs, intensities, sleep and weight logs are not read."

