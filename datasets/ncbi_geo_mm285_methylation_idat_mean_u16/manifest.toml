build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/ncbi_geo_mm285_methylation_idat_mean_u16/samples.jsonl"
summary = "Fetch the 150 pinned GSE290585 MM285 IDAT.gz files, decode the Illumina IDAT v3 field table, and emit field 104 (bead-type Mean, uint16) unchanged as one little-endian sample per IDAT, Grn and Red as two primary series of one family."
deterministic_notes = "Selection is fixed: the first 75 GSM accessions of GSE290585 in ascending numeric order (GSM8817338..GSM8817412), both channels each, pinned by name and size. download.sh checks the README.ftp public-data sentence, the filelist sizes, the series matrix (GSE290585, GPL30650, Mus musculus, exact IDAT names), and per file: gzip integrity, magic IDAT, version 3, N=361,821, off(103)-off(102)=4N, off(104)-off(103)=2N, off(107)-off(104)=2N, MidBlock count N, barcode (field 402) and position (field 404) equal to the file name, chip type (field 403) 'BeadChip 12x8', one IlluminaID order across all files, and Grn != Red per array. Every file's SHA-256 is pinned in pinned_files.tsv and enforced. Build writes samples in pin order; verify.sh re-decodes every IDAT independently and requires byte identity. Floors: 150 samples of 361,821 values (median 361,821) and 108,546,300 primary bytes."

[[series]]
id = "mm285_grn_bead_type_mean_u16"
description = "Green-channel (Cy3 scan) per-bead-type mean intensities of MM285 BeadChip array positions."
semantic_meaning = "For one MM285 BeadChip array position, the iScan-reported mean green-channel fluorescence intensity (scanner digital number) over the replicate beads of each of the 361,821 bead types, in the IDAT's native ascending IlluminaID order."
role = "primary"
representation_class = "native_numeric"
representation_notes = "IDAT field 104 stores the bead-type Mean as little-endian uint16 and the values are copied unchanged. No background subtraction, normalization, dye-bias correction or probe-to-CpG mapping is applied. SD (field 103), NBeads (107) and IlluminaID (102) are not emitted."
source_resources = ["gse290585_mm285_idats"]
source_format = "Illumina IDAT v3 (gzip)"
source_field = "Mean (field code 104)"
filtered_input_path = "filtered/ncbi_geo_mm285_methylation_idat_mean_u16/ingest_stats.json"
filtering = "The Grn IDAT of each of the 75 pinned GSMs; all 361,821 bead types kept; both bisulfite (BS, 38 arrays) and bACE (37 arrays) conversions kept without filtering."
missing_value_policy = "IDAT Mean has no missing-value sentinel; every bead type carries a value and values are preserved unchanged, including any zero (per-sample zero-Mean and NBeads==0 counts are recorded in the index; in the realized output 21 of 150 IDATs contain 1-6 zero Means, essentially all at bead types with NBeads==0, i.e. no bead decoded on that array). Any structural failure (size, pinned sha256, gzip, magic, version 3, N, field geometry, barcode/position vs file name, chip type, IlluminaID order) or degenerate-array condition (distinct values < 2,000; zero Means > 0.1% of N; p01 > 1,500; median < 200; p99 < 3,000; max < 10,000; NBeads==0 for > 1% of bead types) is fatal; arrays are never padded, imputed or silently skipped. verify.sh applies the same thresholds."
conversion = "gunzip in memory, parse the IDAT v3 field table, take the N=361,821 uint16 values at field 104's offset and write them unchanged as one little-endian uint16 .bin per IDAT in source bead-type order. Channels are never interleaved or merged: the Red IDAT of the same array is a separate sample in mm285_red_bead_type_mean_u16."
numeric_kind = "uint"
bit_width = 16
endianness = "little"
sample_format = "raw homogeneous little-endian uint16 array"
sample_geometry = "fixed_length_bead_type_vector"
sample_rank = 1
sample_axes = ["bead_type_in_ascending_illumina_id_order"]
natural_record_kind = "one_mm285_beadchip_array_position_x_one_channel_idat_mean_array"
sample_count = 75
total_size_bytes = 54273150
output_path = "samples/ncbi_geo_mm285_methylation_idat_mean_u16/mm285_grn_bead_type_mean_u16/"

