notes = "NASA SMD states that information produced from SMD-funded scientific research is held as a public trust, made publicly available, and openly shared. These are public NASA mission data from the official HEASARC archive (its anonymous nasa-heasarc S3 mirror), the same basis as the accepted nasa_heasarc_nicer_pi_i16 and nasa_heasarc_nicer_detector_u8 recipes. All 50 primary FITS headers carry ORIGIN = 'MSFC' and OBSERVER = 'G. J. Fishman': the products were produced by the BATSE team at NASA Marshall Space Flight Center. The official NASA Images and Media Usage Guidelines (https://www.nasa.gov/nasa-brand-center/images-and-media/) state that NASA content 'generally are not subject to copyright in the United States' and, under Artificial Intelligence (AI) Applications, that 'NASA is committed to transparency, open science, and making data available to everyone'; both quotes were re-read from the copies of that page pinned by the accepted nasa_wmap_healpix_sky_maps_f32 (captured 2026-08-27, sha256 3003114a6e2f7336...) and nasa_tess_lightcurves_f32 (captured 2026-08-26, sha256 178d06d54ef9d530...) recipes; this recipe does not fetch or depend on those files. The SMD policy page, heasarc.gsfc.nasa.gov and www.nasa.gov were proxy-blocked (HTTP 403 at CONNECT) from the collection environment on 2026-10-05, so the SMD wording is carried over from the NICER manifests rather than re-fetched; the BATSE archive READMEs carry no contrary terms."

