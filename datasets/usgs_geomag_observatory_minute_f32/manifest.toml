access = "Download script issues 48 explicit month-bounded queries for BOU, CMO, FRD, and HON and validates every response semantically."
local_path = "downloads/usgs_geomag_observatory_minute_f32/"
notes = "Exact query URLs, response sizes, SHA-256 hashes, metadata, and component coverage are recorded in download_plan.tsv and download_inventory.json after acquisition."

