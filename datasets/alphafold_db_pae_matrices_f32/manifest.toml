[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/alphafold_db_pae_matrices_f32/samples.jsonl"
summary = "Validate 15 versioned AlphaFold DB PAE JSON documents and emit each complete square matrix as one little-endian float32 sample."
deterministic_notes = "License asset, entry IDs, accessions, versions, URLs, source sizes/hashes, square dimensions, declared maxima, value bounds, output hashes, and aggregate totals are pinned. Verification independently reparses every JSON matrix and byte-compares each output."

[[series]]
id = "protein_predicted_aligned_error_f32"
description = "Complete directional predicted-aligned-error matrix for one AlphaFold DB protein model."
semantic_meaning = "Expected positional error in angstroms at residue i when predicted and true structures are aligned on residue j."
role = "primary"
representation_class = "derived_operational_numeric"
representation_notes = "AlphaFold DB publishes JSON numeric matrices. Values are deterministically converted once to IEEE-754 binary32; v6 documents are integer-quantized while the selected numeric-ID v1 document retains finer decimal resolution."
source_resources = ["selected_pae_documents", "alphafold_license_evidence"]
source_format = "AlphaFold DB predicted-aligned-error JSON"
source_field = "predicted_aligned_error"
filtered_input_path = "filtered/alphafold_db_pae_matrices_f32/ingest_stats.json"
filtering = "Retain the complete matrix from each of the 15 pinned entries spanning sequence lengths 103 through 1,863. Exclude the scalar maximum, sequence, model coordinates, API metadata, and JSON framing."
missing_value_policy = "Missing files, changed hashes, malformed envelopes, non-square or dimension-mismatched matrices, booleans, non-finite or negative values, values beyond the documented saturation ceiling, degenerate matrices, duplicate outputs, or aggregate drift fail the recipe; no values are dropped or imputed."
conversion = "Traverse each matrix in source row-major order, round every JSON number once to IEEE-754 binary32, and serialize raw little-endian words."
numeric_kind = "float"
bit_width = 32
endianness = "little"
sample_format = "raw homogeneous IEEE-754 float32 PAE matrix"
sample_geometry = "protein_residue_pairwise_error_matrix_2d"
sample_rank = 2
sample_axes = ["scored_residue_i", "alignment_residue_j"]
natural_record_kind = "complete_alphafold_protein_pae_matrix"
sample_count = 15
total_size_bytes = 36952932
output_path = "samples/alphafold_db_pae_matrices_f32/protein_predicted_aligned_error_f32/"
