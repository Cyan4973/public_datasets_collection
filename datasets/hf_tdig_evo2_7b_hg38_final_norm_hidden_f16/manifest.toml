[[series]]
id = "evo2_7b_final_norm_hidden_f16"
description = "Final-RMSNorm hidden state of Evo 2 7B (8K-context base model) for one hg38 chr22 genomic window: 600 token positions (every 10th base of a ~6 kb window) by 4096 channels."
semantic_meaning = "Output of the final RMSNorm of the StripedHyena 2 DNA language model, i.e. the representation fed to the unembedding, at single-nucleotide token positions of the human reference sequence. Dimensionless learned activations; one persistent outlier channel (index 3756) sits near +30 while the remaining channels have rms about 0.5."
role = "primary"
representation_class = "derived_operational_numeric"
representation_notes = "Model activations are a deterministic machine-facing artifact of a pinned public model over a public reference sequence; the publisher computed them on GPU and stored them as float16 in HDF5 for interpretability analyses. The recipe performs no inference and emits the published tensor bytes verbatim. The model computes in bfloat16, so the low 3 fp16 mantissa bits are almost always zero (publisher's bf16 -> fp16 storage, not a local widening)."
source_resources = ["chr22_raw_h_norm_windows", "chr22_tier3_head", "chr22_tier3_meta", "dataset_card", "model_card"]
source_format = "HDF5 (superblock v0) contiguous dataset"
source_field = "raw_h_norm: float16 dataset of shape (100, 600, 4096) in chr22_tier3_raw.h5; one sample per first-axis index (genomic window)"
filtered_input_path = "filtered/hf_tdig_evo2_7b_hg38_final_norm_hidden_f16/ingest_stats.json"
filtering = "All 100 windows of chr22_tier3_raw.h5 (the publisher's context-stratified chr22 subset, window_idx 0 to 12883 of 12,978 non-N chr22 windows). chr17_tier3_raw.h5 is excluded so the primary output stays well under 1 GB; raw_h_ell, raw_h_ell_rmsnormed, tier-2 scalars and variant files are excluded as different quantities."
missing_value_policy = "No values are dropped or imputed. Any NaN/Inf, wrong range length, done_mask != 1, token_stride != 10, fewer than 1,000 distinct codes, token-row spread below 0.005, a token row with std below 0.05, more than 6 duplicated consecutive rows, implausible rms, or duplicate windows fail the recipe."
conversion = "Bytes [address + w*4,915,200, +4,915,200) of the contiguous raw_h_norm storage are written verbatim; HDF5 declares IEEE binary16 little-endian, row-major (token_position, hidden_channel). Sample files are named by the upstream window_idx."
