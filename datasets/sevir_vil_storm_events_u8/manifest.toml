manifest_version = 1
dataset_id = "sevir_vil_storm_events_u8"
name = "SEVIR Storm-Event Vertically Integrated Liquid (VIL) Radar-Mosaic Cubes UInt8"
description = "Native uint8 digital-VIL codes from SEVIR STORMEVENTS NEXRAD vertically-integrated-liquid mosaics: one 384 x 384 x 49 (1 km grid, 5-minute frames, 4 hours) event cube per sample for 60 storm events spread across all six 2017-2019 half-year STORMEVENTS containers."
homepage = "https://registry.opendata.aws/sevir/"

[license]
name = "SEVIR AWS Open Data registry statement: no restrictions on use"
spdx = "LicenseRef-SEVIR-No-Restrictions"
url = "https://github.com/awslabs/open-data-registry/blob/main/datasets/sevir.yaml"
citation = "Veillette, M., Samsi, S., and Mattioli, C. (2020). SEVIR: A Storm Event Imagery Dataset for Deep Learning Applications in Radar and Satellite Meteorology. Advances in Neural Information Processing Systems 33 (NeurIPS 2020). Data: s3://sevir (AWS Open Data registry, managed by Mark S. Veillette, MIT Lincoln Laboratory)."
notes = "The AWS Open Data registry entry for SEVIR (ManagedBy: Mark S. Veillette; Contact: mark.veillette@mit.edu) states verbatim: 'License: There are no restrictions on the use of this data.' download.sh re-fetches the registry YAML and fails unless that exact line is still present. The bucket itself carries no separate license file. The underlying radar observations come from the NOAA NEXRAD WSR-88D network (public U.S. government data). Cite Veillette et al. 2020 and acknowledge NOAA NEXRAD."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official SEVIR S3 bucket (s3://sevir, us-west-2) maintained by MIT Lincoln Laboratory; exact HTTP byte ranges of the pinned (ETag-guarded) HDF5 objects; no mirrors."
usage_notes = "Meteorological radar-derived gridded fields only; no personal data. Storm Events IDs and timestamps are kept only as index metadata."

[[origins]]
id = "sevir_s3"
name = "SEVIR public S3 bucket"
url = "https://sevir.s3.amazonaws.com/"
type = "bucket"
notes = "Anonymous HTTPS access; S3 honors Range and If-Match. Objects last modified 2020-04-15."

[[origins]]
id = "aws_open_data_registry"
name = "AWS Open Data registry entry for SEVIR"
