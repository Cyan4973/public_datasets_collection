source_field = "one full-resolution native FLOAT channel"
missing_value_policy = "No values are dropped or imputed. Malformed structures, hashes, geometries, types, sampling, channel counts, or stale outputs fail the recipe."
conversion = "Losslessly decompress one channel and write its source-native IEEE-754 binary32 bit patterns in row-major little-endian order without scaling, normalization, clipping, or color conversion."
numeric_kind = "float"
bit_width = 32
endianness = "little"
sample_format = "raw homogeneous little-endian IEEE-754 binary32 OpenEXR channel plane"
