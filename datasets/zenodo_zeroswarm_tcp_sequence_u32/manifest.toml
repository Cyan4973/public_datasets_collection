deterministic_notes = "Record and PCAP identities, Ethernet/IPv4/TCP parsing, port-502 packet counts, capture/direction boundaries, counts, ranges, cardinalities, transition and decrease counts, per-sample hashes, aggregate hashes, and total output are pinned. The decoder emits no network identity, timing, option, checksum, flag, or payload field. Verification reparses every packet and compares every output byte."

[[series]]
id = "zeroswarm_tcp_sequence_u32"
description = "TCP sequence-number trajectories for request and response directions in two normal Modbus/TCP captures."
semantic_meaning = "Cumulative 32-bit TCP byte positions in packet capture order, showing payload-sized advances and repeated plateaus."
role = "primary"
representation_class = "native_numeric"
representation_notes = "TCP sequence numbers are protocol-native unsigned 32-bit network-order fields. Output preserves each value and changes only byte order to little endian."
source_resources = ["zeroswarm_normal_v2_pcap", "zeroswarm_normal_v2b_pcap", "zenodo_record_metadata"]
source_format = "Classic PCAP containing Ethernet/IPv4/Modbus-TCP"
source_field = "TCP Sequence Number for unfragmented IPv4/TCP port-502 packets"
filtered_input_path = "filtered/zenodo_zeroswarm_tcp_sequence_u32/ingest_stats.json"
filtering = "Retain every validated port-502 packet sequence number, split by capture and request/response direction while preserving packet order."
missing_value_policy = "Malformed, fragmented, non-IPv4, non-TCP, and non-port-502 frames are outside the series. Every qualifying packet contributes exactly one value; changed counts, constant or duplicate samples, identity mismatches, or stale outputs fail."
conversion = "Decode each four-byte network-order field as uint32 and serialize the identical value as little-endian uint32. No delta or relative-sequence normalization is applied."
numeric_kind = "uint"
bit_width = 32
endianness = "little"
sample_format = "raw homogeneous uint32 TCP sequence-number trajectory"
sample_geometry = "tcp_sequence_space_packet_timeline_1d"
sample_rank = 1
sample_axes = ["direction_packet_capture_order"]
natural_record_kind = "pcap_tcp_counter_field_direction"
sample_count = 4
total_size_bytes = 12143764
output_path = "samples/zenodo_zeroswarm_tcp_sequence_u32/zeroswarm_tcp_sequence_u32/"

