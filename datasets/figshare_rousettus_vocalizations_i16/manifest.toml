[[resources]]
id = "member_spans"
origin = "figshare_collection_3666502"
url = "https://ndownloader.figshare.com/files/{file_id}"
type = "other"
version = "v2"
access = "One HTTP range request per pinned member (400), each re-resolving the ndownloader presigned redirect; parallel 4, curl retries, up to 8 passes."
size_bytes = 131291409
sha256 = ""
local_path = "downloads/figshare_rousettus_vocalizations_i16/members/"
notes = "Each span is exactly [local header offset, next member offset) of its archive: 30-byte local header, 22-byte name, LZMA data. members.tsv pins archive, member name, offsets, sizes and CRC32; the Content-Range total must equal the pinned archive size, and each span must decode (raw LZMA1) to a WAV whose CRC32 matches the central directory."

[local_paths]
downloads = "downloads/figshare_rousettus_vocalizations_i16/"
filtered = "filtered/figshare_rousettus_vocalizations_i16/"
index = "index/figshare_rousettus_vocalizations_i16/"
samples = "samples/figshare_rousettus_vocalizations_i16/"

[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/figshare_rousettus_vocalizations_i16/samples.jsonl"
summary = "Range-fetch the ZIP listings of all 30 archives and FileInfo.csv, re-derive the pinned 400-member selection, range-fetch those members, decode each LZMA member to its WAV, and emit the PCM data chunk as one little-endian int16 sample per recording."
deterministic_notes = "Selection (scripts/rousettus.py select_members, pinned in members.tsv): order all 293,238 members by archive (files101..files106, files201..files224) and central-directory order (which is file-name and time order); targets t_k = floor((2k+1) N / 800) for k = 0..399; each target takes the first member at or after it (before the next target) that is a ^[0-9]{18}.WAV$ method-14 member listed in FileInfo.csv with Treatment ID 1-20 and whose FileInfo recording time is more than 10 s from every member already taken. The 10 s rule keeps one microphone channel per vocal event (the paper notes that simultaneous files on different channels of the same treatment can be the same call); it removed no target in the pinned selection (0 skips), and Treatment ID 0 (102 files, not in the paper's treatment table) is ineligible. download.sh, build.sh and verify.sh each re-derive the selection from the local central directories and FileInfo.csv and fail if it differs from members.tsv. build.sh and verify.sh run a synthetic self-test (zipfile ZIP_LZMA members including a forced ZIP64 local header, a hand-built method-14 header, ZIP64 central-directory extra and EOCD parsing, corruption and CRC rejection, non-mono rejection). verify.sh re-decodes each member with the stdlib zipfile and wave modules instead of the build decoder and compares bytes, index fields, exclusions, the aggregate output SHA-256 and the manifest totals. Floors: at least 10,000 primary values or 100 KB, median at least 1,000 values. Realized 2026-10-06: 400 samples from all 30 archives, 0 exclusions, 184,216,832 values, 368,433,664 bytes, 320,336 to 1,786,704 values per recording (median 369,488, about 1.48 s), aggregate output SHA-256 410e512ee306b4698f0532d4963d50da51d04ec2e24a97e0662791ce07c284eb; every member has RIFF layout fmt,data,TIME,bext; full-scale codes 78 in 2 recordings; per-recording peak |x| 1,069 to 32,767 (median 4,621), 509 to 18,410 distinct codes (median 2,325); closest two selected recordings are 5,263 s apart; one member (files205_121110190908022381) has a 1-byte LZMA flush overrun, discarded."

[[series]]
id = "rousettus_vocalization_pcm_i16"
description = "Whole vocalization-triggered 250 kHz mono recordings from the Egyptian fruit bat colony and isolation chambers, one sample per WAV recording."
semantic_meaning = "Successive signed 16-bit PCM amplitude codes of the sound pressure at one omnidirectional electret ultrasound microphone (Avisoft-Bioacoustics Knowles FG-O) in an acoustically isolated bat chamber, digitized by an Avisoft-Bioacoustics UltraSoundGate 1216H A/D converter at 250,000 samples per second. Each recording was kept because it contains bat vocalizations (social calls, pup isolation calls, sometimes echolocation clicks) together with the surrounding background; a file is a few seconds or less (median about 1.5 s)."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The WAV fmt chunk declares format tag 1 (PCM), 1 channel, 250000 Hz, byte rate 500000, block align 2, 16 bits per sample; build rejects anything else. Emitted values are the stored PCM codes, unchanged: no gain, filtering, resampling, trimming to voiced segments, or channel mixing."
source_resources = ["member_spans", "central_directories", "fileinfo_csv", "zip_tails", "archive_article_metadata"]
source_format = "RIFF/WAVE PCM (format tag 1, mono, 250 kHz, 16-bit) stored as LZMA (ZIP method 14) members of figshare ZIP archives"
source_field = "WAV data chunk: mono 16-bit PCM sound-pressure samples"
filtered_input_path = "filtered/figshare_rousettus_vocalizations_i16/ingest_stats.json"
filtering = "The 400 recordings pinned in members.tsv (selection rule in processing.deterministic_notes): all 30 archives, treatments 1, 2, 6, 8, 9, 10, 14, 16, 17, 18, 19, 20 in proportion to their file counts, 12 recording channels, 2012-06-01 to 2014-02-18. Recordings with fewer than 64 distinct PCM codes, or whose PCM payload is byte-identical to an earlier selected recording, are excluded and listed in ingest_stats.json; more than 1% exclusions fails the build. The TIME and bext RIFF chunks (Avisoft recording time and broadcast-extension metadata) are not emitted."
missing_value_policy = "PCM has no missing-value sentinel. Every sample of every retained recording is emitted, including full-scale (-32768 or 32767) codes, whose count is reported per sample in the index and in total in ingest_stats.json. Content-Range, local-header, LZMA, CRC32, RIFF structure or fmt mismatches are fatal; verify recomputes the same exclusion rule from the downloads."
conversion = "Parse the 30-byte ZIP local header (name, flags, method 14, CRC and sizes must equal the central directory; span must equal header + name + extra + compressed size). Method 14 data: u8 major and u8 minor LZMA SDK version, u16 properties size (5), the properties byte (lc = p % 9, lp = (p / 9) % 5, pb = p / 45) and u32 dictionary size, then a raw LZMA1 stream without end marker (flag bit 1 clear) decoded with lzma.LZMADecompressor(FORMAT_RAW, FILTER_LZMA1) to exactly the uncompressed size (the range coder's flush bytes may decode into a few spurious bytes past it, at most 1,024 and consuming all input, which are discarded as in 7-Zip and zipfile; this happens for 1 of the 400 members, 1 byte); the zlib CRC32 of the declared-size output must match the central directory. Walk the RIFF chunks (fmt, data, TIME, bext), require the exact fmt above and one data chunk, and write the data chunk bytes unchanged (already little-endian int16) as one .bin per recording, in members.tsv order."
numeric_kind = "int"
bit_width = 16
endianness = "little"
sample_format = "raw homogeneous little-endian signed-int16 PCM sequence"
sample_geometry = "variable_length_ultrasonic_audio_waveform_1d"
sample_rank = 1
sample_axes = ["time_sample_250000hz"]
natural_record_kind = "complete_triggered_bat_vocalization_wav_recording"
sample_count = 400
total_size_bytes = 368433664
output_path = "samples/figshare_rousettus_vocalizations_i16/rousettus_vocalization_pcm_i16/"
