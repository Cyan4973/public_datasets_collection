[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/fermi_gbm_tte_nai_photon_arrival_times_f64/samples.jsonl"
summary = "Fetch 60 pinned GBM burst TTE NaI FITS files, walk the FITS headers to the EVENTS binary table by EXTNAME, validate its schema and FITS checksums, and write the stored TIME double of every event row, in source order, as one little-endian float64 sample per burst file."
deterministic_notes = "Selection (scripts/select_bursts.py, run once by discover.sh): population = the 4,178 burst directories of 2008-2025 sorted by burst name; 60 targets t_k = floor((k + 0.5) * 4178 / 60); each target tries indices t, t+1, t-1, t+2, ... and takes the first burst whose current/ listing has an uncompressed NaI TTE file. Per detector only the highest vNN counts. Detector rule: the NaI file with the largest S3 Size, ties to the lowest detector index (BGO b0/b1, CTIME and CSPEC are never considered). A 40 KiB header probe must validate identity and schema, with NAXIS2 >= 100,000 and a TSTART/TSTOP window inside -400..0 s / 0..2000 s of TRIGTIME. 58 targets landed on their first candidate. bn090626707 (largest NaI file only 46,121 events) was skipped for bn090629543, and bn110318552 (window starting -644.5 s) was skipped for bn110319628. download.sh enforces exact size, ETag, FITS identity (GLAST/GBM/TTE/'GBM PHOTON LIST', DETNAM, FILENAME), HDU sequence PRIMARY/EBOUNDS/EVENTS/GTI, the EVENTS schema, every present CHECKSUM/DATASUM (both are required on EVENTS), zero padding, no trailing bytes, and the pinned NAXIS2 and TZERO1. build.sh additionally requires finite TIME in stored row order with at most 4 decreasing steps per file of at most 1 s each (realized: 2 steps in total, see missing_value_policy), PHA within 0..127 (row-alignment check), min <= first time in [-400, 0) s, last time <= max in (0, 2000] s, at least 10,000 value changes between consecutive events, and unique outputs. verify.sh is a separate implementation (own FITS parser and DATASUM, struct.iter_unpack('>dh') then pack('<d')) that checks byte equality with the source, the same ordering tolerance, span, every index statistic, the sample inventory and manifest totals. Realized: 60 samples, 45,118,967 primary values, 360,951,736 bytes, median 773,682.5 values per sample (205,859-2,726,534), global range -138.75215 s .. +482.31450 s, 189 consecutive equal times, 2 decreasing steps."

[[series]]
id = "gbm_nai_tte_photon_time_f64"
description = "Whole EVENTS.TIME column of one GBM NaI detector's burst TTE file: the arrival time of every detected photon (event) in the TTE window around one gamma-ray-burst trigger."
semantic_meaning = "Arrival time, in seconds relative to the burst trigger time (TRIGTIME), of each individual photon/particle event registered by one Fermi GBM NaI(Tl) scintillation detector (8 keV-1 MeV). Time tagging is the measurement itself: the event list is the instrument's highest-resolution data mode (2 microsecond tick), from which every GBM light curve and burst duration is derived. Absolute Fermi mission elapsed time = stored value + TZERO1."
role = "primary"
representation_class = "native_numeric"
representation_notes = "EVENTS declares TIME as FITS TFORM 1D (big-endian IEEE-754 float64), TUNIT 's', with TZERO1 = TRIGTIME and no TSCAL or TNULL. The stored doubles are emitted bit-exact, byte-swapped to little-endian. TZERO1 is deliberately NOT added: adding it in float64 would round away information (ulp about 1.2e-7 s at MET ~6e8 s) and turn a native field into a local recomputation. TZERO1 (= TRIGTIME, absolute MET) is recorded per sample in the index as metadata only. Stored + TZERO1 lies on the 2 microsecond GBM clock lattice to within double rounding (checked on header-probe rows in both processing eras)."
source_resources = ["gbm_tte_nai_selection"]
source_format = "FITS (PRIMARY + EBOUNDS + EVENTS + GTI binary tables), Fermi GBM burst TTE photon list (FILETYPE 'GBM PHOTON LIST', DATATYPE 'TTE')"
source_field = "EVENTS.TIME (TFORM 1D, TUNIT s, TZERO1 = TRIGTIME; bytes 0-7 of each 10-byte row)"
filtered_input_path = "filtered/fermi_gbm_tte_nai_photon_arrival_times_f64/ingest_stats.json"
filtering = "60 pinned burst files only (see deterministic_notes). Every row of each file's EVENTS table is kept. The PHA column (16-bit channel code), EBOUNDS, GTI and header times are not emitted as series. TZERO1/TRIGTIME, TSTART/TSTOP and the GTI intervals are kept as index and ingest metadata only."
missing_value_policy = "No missing-value handling: TIME has no TNULL or sentinel. Every stored value is emitted, and nothing is masked, clipped, imputed, sorted, deduplicated or dropped. Non-finite values, PHA codes outside 0..127, or spans outside the plausibility window are fatal in build and verify, not filtered. Times are emitted in stored row order and never sorted. 58 of 60 files are non-decreasing throughout. Two early-mission files each contain one backward step of about 0.099 s, where an interleaved run of events overlaps the preceding 0.099 s with no exact duplicate (time, PHA) rows. In bn090629543 (n3) row 235,055 steps from 140.515814 s back to 140.416888 s, a run of 74 events, and the combined rate in that window matches the neighbouring rate. In bn111018785 (n7) row 30,196 steps from -1.110846 s back to -1.209264 s, a run of 138 events, and the combined rate in that window is about twice the neighbouring rate. Both are preserved as stored. Build and verify tolerate at most 4 such steps per file, each at most 1 s, and record backsteps and max_backstep_s per sample in the index. Consecutive equal times (two events in the same clock tick, 189 in total) are legitimate and kept, and their count is recorded per sample as equal_steps. Bursts without a qualifying NaI TTE file were skipped at selection time, never padded or merged. verify.sh applies the same policy (byte equality with the source column)."
conversion = "For each row of EVENTS, in source order, take the 8 big-endian bytes at row offset 0 (NAXIS1 = 10: TIME 1D then PHA 1I) and write them as a little-endian float64. One sample per burst file: shape [NAXIS2], 205,859-2,726,534 events. No TZERO addition, scaling, sorting, splitting or concatenation across bursts."
numeric_kind = "float"
bit_width = 64
endianness = "little"
sample_format = "raw homogeneous little-endian float64 array"
sample_geometry = "variable_length_photon_event_arrival_time_1d"
sample_rank = 1
sample_axes = ["photon_event"]
natural_record_kind = "gbm_burst_tte_file_nai_detector_event_time_column"
sample_count = 60
total_size_bytes = 360951736
output_path = "samples/fermi_gbm_tte_nai_photon_arrival_times_f64/gbm_nai_tte_photon_time_f64/"
