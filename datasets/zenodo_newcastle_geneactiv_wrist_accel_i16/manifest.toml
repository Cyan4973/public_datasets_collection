[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official Zenodo deposit by the study authors (Netherlands eScience Center, Newcastle University, Freeman Hospital Regional Sleep Service), linked from the PLoS ONE protocol paper. Participants are identified only by study number (MECSLEEPnn). The GENEActiv file headers in the deposit carry subject fields (date of birth, sex, height, weight, free-text notes); the authors published them openly, but this recipe never stores, prints, logs or emits any header value: headers are parsed in memory only to assert device type, measurement frequency, accelerometer range and page count. participants_info.csv (diagnosis, age, sex) and the PSG sleep-score .txt files are never downloaded."
usage_notes = "Emitted payload is raw wrist-motion accelerometer counts only, without demographic, clinical or diagnostic information. Light, button, temperature, battery and page-time fields are not emitted."

