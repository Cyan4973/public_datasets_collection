provenance_notes = "Official EMPIAR archive files served anonymously over HTTPS by ftp.ebi.ac.uk; no mirrors. The specimen is purified recombinant mouse cGAS bound to nucleosomes isolated from the established HEK 293T cell line; the frames are 2D electron-count projections of vitrified macromolecules and carry no donor information."
usage_notes = "Samples hold only detector counts. The EMPIAR entry JSON, which lists the depositors' institutional contact details, is downloaded only to validate the imageset geometry and is never emitted."

