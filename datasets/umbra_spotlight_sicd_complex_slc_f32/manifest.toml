manifest_version = 1
dataset_id = "umbra_spotlight_sicd_complex_slc_f32"
name = "Umbra Open Data X-band Spotlight SAR SICD Complex Single-Look Images (RE32F_IM32F I/Q), Native Float32"
description = "Ten complete Umbra-04/05/06 X-band VV spotlight SAR complex single-look images (SICD 1.2.1, polar-format algorithm, Umbra Image Formation processor 0.6.x, 2023) from ten distinct scenes in the CC BY 4.0 Umbra Open Data Program bucket, each emitted as its whole rows x cols x (I,Q) float32 pixel array converted from big-endian to little-endian."
homepage = "https://registry.opendata.aws/umbra-open-data/"

[license]
name = "Creative Commons Attribution 4.0 International"
spdx = "CC-BY-4.0"
url = "https://creativecommons.org/licenses/by/4.0/"
citation = "Umbra Space, Umbra Synthetic Aperture Radar (SAR) Open Data, https://registry.opendata.aws/umbra-open-data/ (s3://umbra-open-data-catalog). Preserve collect identifiers (e.g. 2023-09-11-10-37-05_UMBRA-05) when redistributing."
notes = "AWS Open Data registry entry (https://github.com/awslabs/open-data-registry/blob/main/datasets/umbra-open-data.yaml, fetched 2026-10-08), License field: 'All data is provided with a Creative Commons License ([CC by 4.0](https://umbra.space/open-license)), which gives you the right to do just about anything you want with it.' The same entry lists the resource arn:aws:s3:::umbra-open-data-catalog with 'Umbra Spotlight collects including GEC, SICD, SIDD, CPHD data and metadata' and RequesterPays: False. umbra.space/open-data also states 'All data is provided with a Creative Commons License'. The umbra.space/open-license link now redirects to generic website terms, so the registry text is the operative evidence."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official Umbra Open Data Program objects served anonymously from the AWS Open Data bucket umbra-open-data-catalog (us-west-2, not requester-pays). No mirrors."
usage_notes = "Spaceborne radar imagery of farmland, a volcanic island, rainforest/riverine areas and harbours/sea lanes at ~1.1-1.6 m resolution. No personal data. Only complex pixel values are emitted; NITF headers and SICD XML stay in downloads."

