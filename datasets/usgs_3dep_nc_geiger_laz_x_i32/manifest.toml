[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/usgs_3dep_nc_geiger_laz_x_i32/samples.jsonl"
summary = "Fetch 25 pinned Geiger-mode LAZ tiles, decode them with the repository's pure-stdlib LASzip decoder (tools/laz/laszip.py), keep the X field (first int32 of every 30-byte LAS 1.4 point format 6 record) byte for byte, and emit one little-endian int32 sample per tile."
deterministic_notes = "Selection rule (scripts/geiger_tiles.py select, documented by discover.sh): every feature of the project VPC whose datetime is 2016-08-10 (the VPC datetime copies the LAS header file-creation date, 2016 day 223; it is not a flight date) and whose pc:count is below 9,000,000, sorted by tile id: 25 of the 1,785 tiles in that group. The selection key is the single LAS creation batch 2016/223 (VPC datetime 2016-08-10). Every selected tile is checked (download.sh, build.sh, verify.sh) to carry the system identifier 'IntelliEarthGmAPDSensorS/N003'. Other creation-date groups carry a mix of identifiers ('IntelliEarthGmAPDSensorS/N003', 'IntelliEarth GmAPD Sensor #003', 'IntelliEarth GmAPD Sensors #2&3') and are excluded to keep one processing batch, one identifier string and one acquisition window (2016-03-16/17 by GPS time). The count cap keeps the primary output under 1 GB because full interior tiles hold 17-31 million points; it favours partial tiles at project edges and over water. download.sh re-derives the selection from the live VPC and link list and refuses to proceed if it differs from sources.tsv. Point order is preserved. Index rows carry tile id, source file and URL, sample_shape, min/max computed from the stored int32 values, unit and sample sha256. verify.sh re-decodes every tile, extracts X by a different path (struct.iter_unpack) and compares value by value, re-checks the missing-value policy, checks that the decoded X extent matches the header bounds within 2 ticks (decoder integrity), rejects samples with fewer than 1,000 distinct values or a value above 50% share, and checks index fields and manifest totals. Realized (2026-10-08 build): 25 samples, 167,277,065 values, 669,108,260 bytes; median 7,614,983 values per sample (673,724 to 8,950,333); 118,373 to 250,001 distinct X values per tile, largest single-value share 0.007%; every tile uses scanner channel 0; decoded X extents within 1 tick of the header bounds; acquisition window: every point's GPS time lies between 2016-03-16 00:28:47 and 2016-03-17 00:57:20 GPS calendar time (UTC is 17 s earlier: 00:28:30 to 00:57:03; local EDT evening of 15 March to evening of 16 March), computed by build.sh from the point GPS time field (float64 at bytes 22-29 of every record; header global_encoding = 17, so bit 0 marks adjusted standard GPS time, asserted per tile), calendar time = GPS epoch 1980-01-06T00:00:00 + gps_time + 1e9 s; raw window 142,123,327.99994 to 142,211,440.00092 adjusted-standard seconds, per-tile gps_time_min/max in filtered/usgs_3dep_nc_geiger_laz_x_i32/build_stats.json; per-tile spans run from 43 minutes to about 18 hours. SHA-256 of all samples concatenated in index order 498960f71a39178d6a7174d0125d9b213f2dc4804e8960d28a11da3e559b0ad1."

[[series]]
id = "nc_geiger_anson_2016_x_i32"
description = "X record coordinate of every lidar point in one published USGS 3DEP Geiger-mode LAZ tile, as the native scaled int32 stored in the LAS record."
semantic_meaning = "Easting of each lidar return in NAD83(2011) North Carolina State Plane coordinates, in ticks of 0.01 US survey foot with offset 0 (stored value 163,000,000 = 1,630,000.00 ftUS), for every point of a 2,500 x 2,500 ft tile collected by the Harris IntelliEarth Geiger-mode avalanche-photodiode array sensor S/N003 over Anson County, NC; every point's GPS time lies between 2016-03-16 00:28:47 and 2016-03-17 00:57:20 GPS calendar time (UTC is 17 s earlier: 00:28:30 to 00:57:03; local EDT evening of 15 March to evening of 16 March), computed by build.sh from the point GPS time field (float64 at bytes 22-29 of every record; header global_encoding = 17, so bit 0 marks adjusted standard GPS time, asserted per tile), calendar time = GPS epoch 1980-01-06T00:00:00 + gps_time + 1e9 s; raw window 142,123,327.99994 to 142,211,440.00092 adjusted-standard seconds, per-tile gps_time_min/max in filtered/usgs_3dep_nc_geiger_laz_x_i32/build_stats.json; per-tile spans run from 43 minutes to about 18 hours. The LAS files were created on 2016 day 223 (2016-08-10), the date the VPC datetime copies; they were processed with ESP ANALYST and compressed with LAStools laszip. Values in a tile span at most about 250,000 ticks above a tile-dependent base of 160-174 million, in the file's point order (the headers of all 25 tiles count every point as a first return; points_by_return[1..] = 0)."
role = "primary"
representation_class = "native_numeric"
representation_notes = "LAS 1.4 point format 6 stores X as a little-endian int32 that is scaled by the header scale (0.01) and offset (0). The sample keeps that stored int32 unchanged; no scaling, rounding or float conversion is applied. Y and Z are not emitted."
source_resources = ["laz_tiles"]
source_format = "LAZ (LASzip 3.1 layered-chunked compressor, POINT14 v3 item) encoding LAS 1.4 point data record format 6, 30-byte records"
source_field = "X (int32 at byte 0 of each LAS point data record)"
filtered_input_path = "filtered/usgs_3dep_nc_geiger_laz_x_i32/build_stats.json"
filtering = "25 tiles chosen by the selection rule (VPC datetime 2016-08-10, pc:count < 9,000,000). All points of each selected tile are kept regardless of classification, withheld, overlap or synthetic flags. Y, Z, intensity, GPS time and all other fields are dropped."
missing_value_policy = "LAS point records have no missing X value and there is no sentinel. Every record is kept. The decoded record count must equal the header point count (equal to the VPC pc:count), and every stored X must lie within the header X bounds converted to ticks (+-1 tick); any violation is fatal in build.sh and verify.sh. Nothing is dropped, reordered, clipped or imputed."
conversion = "Decode each tile chunk by chunk with tools/laz/laszip.py iter_chunks; copy bytes 0-3 of every 30-byte record into a contiguous little-endian int32 array (byte-lane copy, no arithmetic); one sample file <tile file stem>.x_i32le.bin per tile, value i = point i in file order."
