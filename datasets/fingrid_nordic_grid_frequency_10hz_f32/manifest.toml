[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/fingrid_nordic_grid_frequency_10hz_f32/samples.jsonl"
summary = "Validate the dataset page license and listing, download three pinned monthly 7z archives, stream-decode them with a pure-stdlib 7z/LZMA reader (per-member CRC32 checked), and emit the Value column of every daily CSV as one raw little-endian float32 sample."
deterministic_notes = "sources.tsv pins URL, byte size, Azure Content-MD5, Last-Modified and SHA-256 per archive; members.tsv pins all 93 member names, sizes and CRC32s (resolved by discover.sh from range-fetched 7z headers). Months avoid DST transitions so each daily file covers 00:00:00.0-23:59:59.9 Finnish local time. Two pinned day rules are applied identically by build and verify: coverage (at least 777,600 of 864,000 0.1 s ticks carry a value) and resolution (coarse_token_share = share of Value tokens printed with 3 or fewer decimals must be <= 0.02; clean 10 uHz days measure 0.0099-0.0103, any day containing an hour from the 1 mHz backup chain measures >= 0.051). Excluded days are listed in filtered/<id>/build_summary.json. The 2024 archives were dropped because 53 of their 62 days contain such hours. The aggregate sample SHA-256 is computed over samples in index (date) order. verify.sh re-derives each sample through an independent parser (csv, datetime.fromisoformat, Decimal, array('f')) and byte-compares it, re-derives every per-day statistic in the index (including coarse_token_share), rejects any indexed day failing a day rule, requires every day passing both rules to be indexed, rejects degenerate days (fewer than 100 distinct values or range under 0.01 Hz), and checks the manifest scope."

[[series]]
id = "nordic_grid_frequency_10hz_f32"
description = "Nordic synchronous-area power-system frequency at 10 Hz, one sample per calendar day."
semantic_meaning = "Electrical frequency (Hz) of the Nordic synchronous power system as measured by Fingrid at 400 kV substations in Finland with a 0.1 s sample period; values sit around the 50 Hz nominal (typically 49.8-50.2 Hz) and trace load-generation imbalance and frequency-containment control."
role = "primary"
representation_class = "native_numeric"
representation_notes = "Upstream values are decimal text with at most 5 fractional digits. Each token is converted to the nearest IEEE-754 binary32; build and verify both check that every distinct token round-trips exactly (|float32 - token| <= ulp/2 = 1.9e-6 Hz near 50 Hz, below the 5e-6 half-step), so the float32 stream is lossless with respect to the published decimals."
source_resources = ["archive_2025_01", "archive_2025_07", "archive_2026_01"]
source_format = "7z archive (one solid LZMA1 folder) of daily 'Time,Value' CSV files, Finnish local time, 0.1 s timestamps"
source_field = "Value column (grid frequency in Hz) of each Taajuusdata<YYYY-MM-DD>.csv"
filtered_input_path = "filtered/fingrid_nordic_grid_frequency_10hz_f32/day_stats.jsonl"
filtering = "All 93 daily CSVs of the three pinned months are parsed. A day is kept when at least 777,600 of its 864,000 0.1 s ticks carry a value and at most 2 % of its Value tokens are printed with 3 or fewer decimals (resolution rule: excludes days containing hours from Fingrid's smoothed 1 mHz backup measurement chain, which appear in 2024 archives; the pinned 2025-2026 months are expected to have none). Within a kept day every row with a value is emitted in file order, including the occasional repeated HH:00:00.000 row where the upstream file joins hourly pieces."
missing_value_policy = "Rows missing upstream (telemetry gaps) are not filled or interpolated; the sample simply contains the rows present, and per-day covered/missing ticks, gap runs and duplicate-timestamp rows are recorded in the index and day_stats.jsonl. Blank Value tokens would be dropped and counted. Malformed rows, timestamps off the file's date or off the 100 ms lattice, non-decimal tokens, more than 5 decimals, values outside 45-55 Hz, or values that do not round-trip through float32 are fatal. Days failing the 90 % coverage rule or the coarse_token_share <= 0.02 resolution rule are excluded by build and rejected by verify if present; verify also requires every day passing both rules to be present. Individual rows are never dropped for resolution reasons."
conversion = "Stream-decode the solid 7z folder, split it by the header's substream sizes and check each member's CRC32; parse the CSV (header 'Time,Value', CRLF), convert each Value token to float32 (round-to-nearest) and write the day's values in row order as raw little-endian float32, one file per daily CSV."
numeric_kind = "float"
bit_width = 32
endianness = "little"
sample_format = "raw homogeneous little-endian float32 vector"
sample_geometry = "regularly_sampled_time_series_with_rare_gaps"
sample_rank = 1
sample_axes = ["time_0p1s_local"]
natural_record_kind = "fingrid_daily_frequency_csv_file"
sample_count = 93
total_size_bytes = 321045344
output_path = "samples/fingrid_nordic_grid_frequency_10hz_f32/nordic_grid_frequency_10hz_f32/"
