sample_index_path = "index/mpc_modis_mod15a2h_fpar_u8/samples.jsonl"
summary = "Download 96 pinned MOD15A2H.061 Fpar_500m COGs, decode each primary 2400x2400 uint8 grid (Deflate tiles, edge padding cropped), and emit it unchanged as one raw uint8 sample per tile and 8-day composite."
deterministic_notes = "Fixed scope: Terra only (MOD15A2H, never MYD15A2H or MCD15A2H), Collection 6.1, layer Fpar_500m only, calendar year 2024 8-day composites starting DOY 049 (2024-02-18..25), 137 (05-16..23), 225 (08-12..19) and 313 (11-08..15), chosen 88 days apart for seasonal spread and to avoid the DOY 017/193 periods used by the accepted mpc_modis_mod13a1_ndvi_i16. Tiles: 93 land candidates were screened at DOY 193 (scripts/probe_screen_doy193_20261006.tsv); only tiles whose 300x300 overview had >= 80% pixels in 0..100 were eligible (38 passed), and 24 of them were named for continental and biome spread before download: north_america h09v05 h10v04 h10v05 h11v03 h11v04; south_america h12v09 h13v10 h12v11 h12v12; europe h19v03 h19v04 h20v03; africa h19v08 h20v09 h21v08 h20v10 h20v11; asia h22v03 h23v04 h25v06 h26v04 h27v06; oceania h29v11 h30v11. Overview IFDs are ignored. Samples follow sources.tsv order. Index min/max/sums and class counts are computed from the stored uint8 values."

[[series]]
id = "modis_mod15a2h_8day_fpar_u8"
description = "MOD15A2H.061 8-day composite FPAR grids, one complete 2400x2400 sinusoidal tile per sample."
semantic_meaning = "Fraction of incident photosynthetically active radiation (400-700 nm) absorbed by the green elements of the vegetation canopy, retrieved per 463.3 m cell from Terra MODIS surface reflectance by inverting a 3-D radiative-transfer look-up table (empirical NDVI back-up when the main algorithm fails) and composited over 8 days by keeping the best daily retrieval (per the user guide, the maximum-FPAR day); stored value = FPAR x 100 (0..100). Non-vegetated cells keep the product's land-cover fill classes 249..255 in the same byte."
role = "primary"
representation_class = "native_numeric"
representation_notes = "Fpar_500m is a native uint8 SDS in the source HDF4-EOS granule (scale_factor 0.01, valid_range 0..100, _FillValue 255, units Percent, embedded fill legend 249..255). The Planetary Computer COG carries the same uint8 plane plus the HDF-EOS metadata; the recipe only removes TIFF tiling and Deflate compression. Fill classes are part of the source byte stream and are kept as stored."
source_resources = ["mod15a2h_061_fpar_cogs"]
source_format = "cloud_optimized_geotiff"
source_field = "Fpar_500m"
filtered_input_path = "filtered/mpc_modis_mod15a2h_fpar_u8/ingest_stats.json"
filtering = "Keep all 5,760,000 primary-resolution pixels of each of the 96 pinned complete tiles. Tiles were pre-selected as land-dominant (overview valid fraction >= 0.80); build and verify require a real valid (0..100) fraction >= 0.70, at least 50 distinct valid values, no duplicate grids, and (verify) at least 5% of pixels changing between consecutive composites of each tile. Realized (build of 2026-10-06): valid fraction 0.833-0.995 per sample (min h12v12, Pacific coast); valid values span 0..100 with 72-101 distinct valid values per sample (the arid h29v11 has the fewest); reserved codes over all 96 samples: 250 urban 2,928,932, 253 barren 6,678,392, 254 water 19,383,012, 255 fill 298,052, and 248/249/251/252 never occur; each tile's reserved-code mask is identical in all four composites (static land-cover mask); 70-99% of pixels change between consecutive composites; Shannon entropy 2.7-6.5 bits/value (median 5.8); zlib-6 compresses samples to 15-74% of raw (median 57%)."
missing_value_policy = "Values 249..255 are the source's documented fill/land-cover classes (255 _FillValue, 254 water, 253 barren/sparse, 252 perennial snow/ice, 251 permanent wetland, 250 urban, 249 unclassified) and 248 is accepted as the reserved code of the same block; all are preserved in place and counted per class in the index. Every other value must lie in 0..100; any value in 101..247, a valid fraction below 0.70, missing or truncated files, size/MD5 mismatches, unexpected TIFF structure or HDF-EOS metadata, corrupt Deflate streams, or degenerate grids are fatal."
conversion = "Parse the classic little-endian TIFF IFD0 (2400x2400, BitsPerSample 8, SampleFormat 1, Compression 8, Predictor 1, 512x512 tiles, GDAL nodata 255), inflate its 25 tiles with exact-length checks, crop the TIFF edge padding of the last tile row/column (2400 = 4x512 + 352), and write the uint8 grid row-major (y, x) without rescaling, resampling, remapping, or concatenation."
numeric_kind = "uint"
bit_width = 8
endianness = "little"
sample_format = "raw homogeneous uint8 FPAR grid (0..100 = FPAR x 100; 248..255 source fill classes)"
sample_geometry = "2400x2400_modis_sinusoidal_tile"
sample_rank = 2
sample_axes = ["y", "x"]
natural_record_kind = "complete_mod15a2h_8_day_fpar_tile"
sample_count = 96
total_size_bytes = 552960000
output_path = "samples/mpc_modis_mod15a2h_fpar_u8/modis_mod15a2h_8day_fpar_u8/"
