citation = "U.S. Air Force Radio Solar Telescope Network (RSTN), Sagamore Hill Solar Radio Spectrograph data; archived and distributed by NOAA National Centers for Environmental Information (NCEI), Solar Radio collection (gov.noaa.ngdc.stp.solar:solar-features_solar-features_solar-radio), https://www.ngdc.noaa.gov/stp/space-weather/solar-data/solar-features/solar-radio/rstn-spectral/"
notes = "The NCEI ISO 19115 record for the 'Solar Radio' collection (fileIdentifier gov.noaa.ngdc.stp.solar:solar-features_solar-features_solar-radio), whose description lists '1-sec solar flux measurements from the Radio Solar Telescope Netword (RSTN), and RSTN solar spectral measurements', states 'Access Constraints: None Use Constraints: None' followed by a NOAA distribution-liability disclaimer; download.sh re-fetches this record and checks those phrases on every run. NCEI's collection readme (documentation/readme_solar-features_solar-radio.pdf) lists 'Sagamore Hill (USAF Radio Solar Telescope Network)', so the data are a work of the U.S. Air Force, i.e. U.S. Government works with no copyright under 17 U.S.C. 105. Only Sagamore Hill is used; Learmonth (jointly operated with the Australian Bureau of Meteorology) and the other stations are excluded. Attribution to USAF RSTN and NOAA NCEI is retained as a courtesy."

