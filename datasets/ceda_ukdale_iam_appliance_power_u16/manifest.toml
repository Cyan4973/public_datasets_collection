[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/ceda_ukdale_iam_appliance_power_u16/samples.jsonl"
summary = "Range-fetch the 51 EcoManagerTxPlug channel members of houses 2-5 from the pinned UK-DALE ukdale.zip, inflate them locally, strictly parse every '<unix_seconds> <watts>' line, and emit each channel's watt readings as one uint16 little-endian sample (timestamps as an aligned uint32 auxiliary sample)."
deterministic_notes = "The selection is re-derived on every download from metadata/building{2..5}.yaml (device_model EcoManagerTxPlug) and must equal the pinned members.tsv (offsets, sizes, CRC32). discover.sh documents how members.tsv was produced. Samples follow members.tsv order (house, channel) and keep each file's line order. verify.sh does not import the build code: it re-derives the selection, re-inflates, parses line by line, re-encodes and byte-compares every sample, and checks index fields, manifest counts and sizes, and the floors. Constant samples are rejected."

[[series]]
id = "ukdale_iam_active_power_w_u16"
description = "Real (active) power drawn by one plug-monitored domestic appliance, in integer watts, about every 6 s."
semantic_meaning = "Active power in watts reported by one EDF EcoManager Transmitter Plug (individual appliance monitor; meter_devices.yaml: active power, 0-3300 W, 6 s sample period, 120 s max sample period), logged by rfm_ecomanager_logger. One value per logged reading of one appliance channel, in time order."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The source column is ASCII decimal integer watts (the format has no fractional part). Values are stored losslessly as uint16 little-endian, with no scaling, offset, clipping, resampling or reordering. The plugs' 1 W resolution and 0-3300 W rating fit uint16 natively."
source_resources = ["ukdale_zip_iam_member_ranges", "ukdale_zip_tail"]
source_format = "UK-DALE channel_M.dat text, newline-terminated '<unix_seconds> <watts>' lines, stored as DEFLATE members of the ZIP64 archive ukdale.zip"
source_field = "watts (second column) of house_N/channel_M.dat for every elec_meter whose device_model is EcoManagerTxPlug"
filtered_input_path = "filtered/ceda_ukdale_iam_appliance_power_u16/ingest_stats.json"
filtering = "Keeps every elec_meter with device_model EcoManagerTxPlug in metadata/building2-5.yaml: 51 channels (house 2: 2-19; house 3: 2-5; house 4: 2-6; house 5: 2-25). Excluded: channel_1 of each house (EcoManagerWholeHouseTx site meter, apparent power in VA up to 25 kW); mains.dat (SoundCardPowerMeter, 1 s floats with voltage); *_button_press.dat (switching events); labels.dat. Also excludes all of house_1: its 48 IAM channels hold about 587 million readings (about 1.17 GB as uint16 on their own, behind 1.63 GB compressed), which would exceed the 1 GB primary cap."
missing_value_policy = "The source has no sentinel, blank or NaN values. Logger dropouts appear as absent lines (timestamp gaps) and are left as-is, with no fill or interpolation; the aligned uint32 auxiliary sample preserves the irregular timing. Every line must be ASCII digits, one space, ASCII digits, newline. A malformed line, a watt value above 65535 or a timestamp at or above 2^32 is fatal in both build and verify. Nothing is dropped, clipped or imputed."
conversion = "Exact range -> ZIP local header checked against the central directory -> raw DEFLATE inflate with CRC32 and size checks -> strict full-text line parse -> int(watts) -> uint16 little-endian in file (time) order. One sample per channel_M.dat record."
numeric_kind = "uint"
bit_width = 16
endianness = "little"
sample_format = "raw homogeneous little-endian uint16 watt readings"
sample_geometry = "irregularly_sampled_appliance_power_time_series"
sample_rank = 1
sample_axes = ["reading"]
natural_record_kind = "ukdale_iam_channel_power_record"
sample_count = 51
total_size_bytes = 165674994
output_path = "samples/ceda_ukdale_iam_appliance_power_u16/ukdale_iam_active_power_w_u16/"

[[series]]
id = "ukdale_iam_unix_time_s_u32"
description = "Unix timestamp (seconds, UTC) of each IAM watt reading, aligned 1:1 with the primary sample of the same channel."
semantic_meaning = "Logger timestamp of each reading. Readings are irregular: nominally 6 s, typically 5-8 s, with longer logger gaps."
role = "auxiliary"
representation_class = "native_numeric"
representation_notes = "Source integer seconds stored losslessly as uint32 little-endian. Alignment metadata only; excluded from acceptance floors."
source_resources = ["ukdale_zip_iam_member_ranges"]
source_format = "UK-DALE channel_M.dat text, newline-terminated '<unix_seconds> <watts>' lines"
source_field = "unix_seconds (first column) of house_N/channel_M.dat for EcoManagerTxPlug meters"
filtered_input_path = "filtered/ceda_ukdale_iam_appliance_power_u16/ingest_stats.json"
filtering = "Same 51 channels and lines as the primary series."
missing_value_policy = "Same strict line policy as the primary series; gaps are left as-is."
conversion = "int(unix_seconds) -> uint32 little-endian, same order and count as the primary sample."
numeric_kind = "uint"
bit_width = 32
endianness = "little"
sample_format = "raw homogeneous little-endian uint32 unix seconds"
sample_geometry = "timestamps_of_irregular_time_series"
sample_rank = 1
