summary = "Stream the pinned UVA_VPTS de.tgz without extraction and emit, for each of the 465 German radar-month VPTS files, the eta column as one row-major little-endian float32 matrix of (profile datetime x 25 height bins) in stored order."
deterministic_notes = "Pins Zenodo record identity, license, publication date, file sizes and MD5s. Archive members must equal coverage.csv's 465 German radar-months; per-file rows and per-day row counts must equal coverage.csv; every file must carry the exact 26-field VPTS CSV header, the 0..4800 m step 200 m height lattice in order for every profile, unique datetimes inside the file month, rcs 11, sd_vvp_threshold 2 and C-band wavelengths; the radar column must be the ODIM code and/or one WMO number that is consistent per radar across the archive. Every finite eta token must lie within one unit of its last written decimal place of its nearest binary32 value (observed maximum 0.568 units) and is classified exact, unique (bit-exact recovery) or coarse. verify.sh re-derives every sample with an independent parser and byte-compares it. Samples are written in archive order; the index is sorted by radar then month. Realized aggregate SHA-256 of per-sample SHA-256s: a763eb29196e357598a8df0ab52676f1089a757e22186349e49f8560eb1f8ada."

[[series]]
id = "uva_vpts_eta_f32"
description = "Radar-month animal reflectivity (eta) vertical-profile time series from 18 German DWD C-band weather radars, 2015-02 to 2019-05."
semantic_meaning = "eta is the reflectivity of biological scatterers (mostly nocturnally migrating birds) in cm^2/km^3, estimated by vol2bird after rain and clutter screening for each 200 m altitude bin from 0 to 4800 m above sea level. Each matrix row is one vertical profile (one radar volume scan, normally every 15 minutes; 5 minutes for deasb 2019-02..2019-05) and each column is one height bin."
role = "primary"
representation_class = "derived_operational_numeric"
representation_notes = "The deposit publishes vol2bird eta as VPTS CSV decimal text, and each finite token is rounded once to IEEE binary32 (round to nearest). Three writer styles occur: 15-significant-digit R renderings with 'NaN' for missing (most files), the shortest repr of the binary32-exact double with blank for missing (e.g. deess 2019-04), and fixed 7-10 decimal places with blank for missing (7 files: deboo 2017-11 and 2018-11, dehnr 2017-11 and 2018-11, deros 2017-11, defld 2018-11, deess 2018-11). 24,771,271 of 24,788,600 finite values (99.93%) are exact or lie within one last-place unit of exactly one binary32 value, so the rounding recovers the source binary32 bit-exactly; arbitrary decimals would not sit on the binary32 lattice. The other 17,329 values (0.07%, all in the 7 fixed-decimal files, small magnitudes) were published with fewer digits than binary32 resolution and are stored as the binary32 nearest to the published decimal. The label is derived_operational_numeric because the stored value is the published decimal rounded once, as in other decimal-table recipes; the width is native (vol2bird binary32), not a widening."
source_resources = ["uva_vpts_de_tgz", "uva_vpts_coverage_csv", "uva_vpts_table_schema"]
source_format = "VPTS CSV v1.0 table (multi-member gzip .csv.gz), one radar-month per member of the UVA_VPTS de.tgz country archive"
source_field = "eta column (animal reflectivity, cm^2/km^3), all 25 height rows of every datetime"
filtered_input_path = "filtered/aloft_uva_vpts_animal_reflectivity_f32/ingest_stats.json"
filtering = "All 465 German radar-month members (18 radars). Only the eta column is kept. Excluded: dens (eta/rcs with rcs = 11 cm^2 where a bin is retained and 0 where screening zeroed it, i.e. a scaled, masked copy of eta), dbz (log transform of eta), dbz_all (total reflectivity including precipitation), u/v/w/ff/dd/sd_vvp kinematics, gap flag, n_* point counts, and constant radar metadata. Belgian and Dutch archives are not downloaded."
missing_value_policy = "The schema's missingValues tokens '', 'NA' and 'NaN' are each mapped to the canonical binary32 quiet NaN 0x7fc00000 and counted per sample (index nan_count); realized: 3,237,714 'NaN' and 342,736 blank tokens, no 'NA', 12.62% of values. They mark bins below the radar antenna, bins without valid biological signal, and failed scans; the time-by-height geometry is preserved. Any other non-decimal token (including Inf), negative or non-finite values, tokens farther than one last-place unit from binary32, or structural defects are fatal. A sample with no finite value, a constant finite value, or only zeros is rejected as degenerate by build.sh and verify.sh (none occur; per-sample NaN fraction 0.16%-38.9%, zero fraction of finite values 0.01%-42.7%). Zeros (bins with zero biological reflectivity) are kept as real values and counted (index zero_count; 10.16% of finite values). Missing profile times are not filled."
conversion = "Stream de.tgz with tarfile, gunzip each multi-member VPTS CSV member, parse rows, check that every datetime has exactly 25 rows in height order 0..4800 m, round each finite eta decimal once to IEEE binary32, and write the values in stored row order (profile-major, height-minor) as one little-endian float32 sample per radar-month, shape (profiles, 25). Stored order is kept even where a file lists one day's hourly profiles before the same day's 15-minute profiles (denhb 2015-04 and deumd 2015-09, one order break each, index datetime_order_breaks)."
numeric_kind = "float"
bit_width = 32
endianness = "little"
sample_format = "raw homogeneous little-endian float32 row-major profile-by-height eta matrix"
sample_geometry = "radar_month_vertical_profile_time_series_profile_by_height_matrix_2d"
sample_rank = 2
sample_axes = ["profile_datetime", "height_bin_0_to_4800_m_step_200"]
natural_record_kind = "uva_vpts_radar_month_vertical_profile_time_series"
sample_count = 465
total_size_bytes = 113476200
output_path = "samples/aloft_uva_vpts_animal_reflectivity_f32/uva_vpts_eta_f32/"
