manifest_version = 1
dataset_id = "tartanair_optical_flow_f32"
name = "TartanAir V1 Dense Optical-Flow Fields Float32"
description = "Native float32 dense forward optical-flow frames (480 x 640 x 2 pixel displacements) from the CMU AirLab TartanAir V1 simulation dataset: three frames from three different trajectories in each of the 36 environment/difficulty flow archives."
homepage = "https://theairlab.org/tartanair-dataset/"

[license]
name = "Creative Commons Attribution 4.0 International (project site); BSD-3-Clause (Hugging Face dataset card)"
spdx = "CC-BY-4.0"
url = "https://creativecommons.org/licenses/by/4.0/"
citation = "Wang, W., Zhu, D., Wang, X., Hu, Y., Qiu, Y., Wang, C., Hu, Y., Kapoor, A., and Scherer, S. TartanAir: A Dataset to Push the Limits of Visual SLAM. IEEE/RSJ International Conference on Intelligent Robots and Systems (IROS), 2020. arXiv:2003.14338."
notes = "The official project page https://theairlab.org/tartanair-dataset/ states under 'Term of use': 'This work is licensed under a Creative Commons Attribution 4.0 International License.' (linking creativecommons.org/licenses/by/4.0). The official Hugging Face dataset card theairlabcmu/tartanair at revision 65e00180ea952475878a748543e11e9ec20beaac declares `license: bsd-3-clause`. Both are permissive; the stricter attribution terms of CC BY 4.0 are followed. download.sh fails if the HF card license changes and logs whether the CC BY 4.0 notice is still present on the project page."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official CMU AirLab release on the Hugging Face hub (repository theairlabcmu/tartanair, the repo used by the official castacks/tartanair_tools downloader), pinned to one immutable revision. Content is rendered from Unreal Engine/AirSim virtual environments; no people or personal data are recorded."
usage_notes = "Synthetic simulator ground truth: the flow fields were computed upstream by the dataset authors from rendered depth and ground-truth camera motion, then published as float32 .npy arrays. Nothing is numericized locally."

