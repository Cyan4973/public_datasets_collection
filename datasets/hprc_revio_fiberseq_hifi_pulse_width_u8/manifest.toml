description = "Per-base pass-averaged polymerase pulse width of PacBio Revio HiFi reads, stored on-instrument by ccs as 8-bit CodecV1 codes in the BAM 'fp' (forward strand) and 'rp' (reverse strand) B:C arrays; one sample per read strand from fixed 12 MiB prefixes of all 30 hifi_reads BAMs (25 individuals) of the WUSTL HPRC Fiber-seq submission on the CC0 AWS Open Data bucket s3://human-pangenomics."
homepage = "https://registry.opendata.aws/hpgp-data/"

