citation = "Prouff, E., Strullu, R., Benadjila, R., Cagli, E., Dumas, C. Study of Deep Learning Techniques for Side-Channel Analysis and Introduction to ASCAD Database. IACR ePrint 2018/053. Data: ANSSI, ASCAD, https://www.data.gouv.fr/datasets/ascad"
notes = "The data.gouv.fr API record for dataset 5aaa829dc751df2fbd43eacb (slug 'ascad', organization Agence Nationale de la Sécurité des Systèmes d'Information) declares license 'fr-lo' (Licence Ouverte / Open Licence, OKD-compliant, attribution required). download.sh re-checks this on every run. The companion repository github.com/ANSSI-FR/ASCAD is BSD-licensed code. Only this fixed-key 'ascad' dataset is used; the separate variable-key ASCAD dataset on data.gouv.fr declares 'notspecified' and is NOT used."

