[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/luh_lumo_tower_acceleration_f32/samples.jsonl"
summary = "Range-fetch 12 pinned SHMTS .mat members (770,718,051 bytes) from the six official LUMO exemplary ZIPs, inflate and CRC-check them, decode the MAT v5 struct Dat with a dependency-free parser, and emit each of the 18 accelerometer columns of the mxSINGLE Data matrix as one little-endian float32 sample."
deterministic_notes = "Selection rule: in each of the 12 state folders (01..12: Healthy, DAM6_111, Healthy, DAM4_111, Healthy, DAM3_111, Healthy, DAM6_010, Healthy, DAM4_010, Healthy, DAM3_010) take the 3rd of the 5 SHMTS files in chronological order. sources.tsv pins zip, member, CRC32, compressed/uncompressed size and exact byte range; download.sh re-validates them against the live central directories, checks 206/Content-Range on every chunk, inflates, checks CRC32, size and data descriptor, and validates the MAT schema (Fs 1651.6129032258063, 990600x22 single, channel names accel01x..accel09y + strain01-03 + temp01, accel units 'g'). build.sh and verify.sh re-check size, CRC32 and the extracted-file SHA-256 pinned in mat_sha256.tsv, fail on any non-finite or constant channel, and verify.sh re-derives every sample via a second Data locator and compares bytes, SHA-256, min/max and manifest totals. Floor: 216 samples of 990,600 values each."

[[series]]
id = "lumo_tower_acceleration_f32"
description = "Ambient (wind/operational) horizontal acceleration of the LUMO lattice tower, one accelerometer channel of one 10-minute SHMTS acquisition per sample."
semantic_meaning = "Horizontal structural acceleration in g measured by one of 18 accelerometers (9 measurement levels x 2 horizontal axes x/y, channels accel01x..accel09y) on a 9 m steel lattice tower, sampled at 1651.6129 Hz for 990,600 samples (~599.8 s). Records come from healthy and reversibly damaged (DAM3/DAM4/DAM6 at levels 010/111) states of the same structure."
role = "primary"
representation_class = "native_numeric"
representation_notes = "Upstream Data is a MATLAB mxSINGLE matrix with a miSINGLE (IEEE-754 binary32, little-endian 'IM' file) payload; the emitted bytes are the exact stored float32 bit patterns of each column. The values lie on a per-channel calibrated ADC lattice (step 5.65e-7 to 6.36e-7 g depending on the channel, the same in every record, plus an offset). Realized samples have 650 to 96,352 distinct values (median 18,135) and peak-to-peak 0.0007 to 0.24 g (median 0.023 g); the two calmest records use only about 10-11 bits of real resolution. No integer counts are published upstream."
source_resources = ["exemplary_dam6_111_zip", "exemplary_dam4_111_zip", "exemplary_dam3_111_zip", "exemplary_dam6_010_zip", "exemplary_dam4_010_zip", "exemplary_dam3_010_zip"]
source_format = "MATLAB Level-5 MAT file (SHMTS_<yyyymmddHHMM>.mat) with a zlib-compressed 1x1 struct variable Dat"
source_field = "Dat.Data columns 1-18 (ChannelNames accel01x..accel09y, ChannelUnits g) of the 990600x22 mxSINGLE matrix"
filtered_input_path = "filtered/luh_lumo_tower_acceleration_f32/ingest_stats.json"
filtering = "Keep the 18 accelerometer columns of each of the 12 selected records; exclude columns 19-22 (strain01-03 in m/m, temp01 in degC), the Timestamps/Time datetime objects and the MAT subsystem element."
missing_value_policy = "No missing-value handling is expected: every emitted value must be finite. Any NaN or Inf in a selected accelerometer column, a constant column, a changed channel name/unit/Fs/row count, or a size/CRC mismatch is fatal in build.sh and verify.sh; nothing is dropped, imputed or clipped."
conversion = "Inflate the ZIP member, decompress the top-level miCOMPRESSED element of the MAT file, walk the Dat struct (skipping the MCOS datetime objects Timestamps/Time by their element size), locate the Data miSINGLE payload (column-major) and copy column j (j = 0..17) verbatim as rows x 4 bytes of little-endian float32."
numeric_kind = "float"
bit_width = 32
endianness = "little"
sample_format = "raw homogeneous little-endian float32 acceleration time series"
sample_geometry = "uniformly_sampled_time_series"
sample_rank = 1
sample_axes = ["time_sample"]
natural_record_kind = "lumo_shmts_10min_record_single_accelerometer_channel"
sample_count = 216
total_size_bytes = 855878400
output_path = "samples/luh_lumo_tower_acceleration_f32/lumo_tower_acceleration_f32/"
