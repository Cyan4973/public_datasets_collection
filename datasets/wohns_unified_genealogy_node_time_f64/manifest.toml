manifest_version = 1
dataset_id = "wohns_unified_genealogy_node_time_f64"
name = "Unified Human Genealogy (1000 Genomes + HGDP + SGDP) Tree-Sequence Node Ages Float64"
description = "Native float64 tskit node-table `time` column (tsdate node ages in generations before present) of all 39 autosome-arm tree sequences in the Wohns et al. (2022) unified genealogy of the 1000 Genomes phase 3, Human Genome Diversity and Simons Genome Diversity Projects, one complete per-arm node-age vector per sample in native node order."
homepage = "https://doi.org/10.5281/zenodo.5495535"

[license]
name = "Creative Commons Attribution 4.0 International"
spdx = "CC-BY-4.0"
url = "https://creativecommons.org/licenses/by/4.0/"
citation = "Wohns, A. W., Wong, Y., Jeffery, B., Akbari, A., Mallick, S., Pinhasi, R., Patterson, N., Reich, D., Kelleher, J., McVean, G. A unified genealogy of modern and ancient genomes: Unified, inferred tree sequences of 1000 Genomes, Human Genome Diversity, and Simons Genome Diversity Projects (v1.0.0), Zenodo, 2021, https://doi.org/10.5281/zenodo.5495535. Paper: Wohns et al., A unified genealogy of modern and ancient genomes, Science 375, eabi8264 (2022)."
notes = "The Zenodo API record https://zenodo.org/api/records/5495535 declares \"license\": {\"id\": \"cc-by-4.0\"} with access_right \"open\" for the exact deposited files; download.sh re-checks the license id, record id, title and version 1.0.0 on every run. Attribute the authors and the DOI."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official Zenodo deposit by the paper authors. The emitted values are inferred ancestral-node ages of a population-scale genealogy; sample nodes carry time 0. No genotypes, haplotypes, variant sites, individual or population metadata, or any other table is fetched or emitted, so the output contains no individual-level genetic data."
usage_notes = "Model-derived but natively published numeric artifact (tsinfer 0.2.1 topology, tsdate 0.1.4 dating); not a direct instrument measurement. Keep the attribution."

[[origins]]
id = "zenodo_5495535"
name = "Zenodo record 5495535, unified tree sequences of 1000G + HGDP + SGDP, version 1.0.0"
url = "https://zenodo.org/records/5495535"
type = "repository"
notes = "39 modern-sample files hgdp_tgp_sgdp_chr{N}_{p,q}.dated.trees.tsz (autosome arms; short arms of acrocentric chromosomes 13, 14, 15, 21, 22 are not in the deposit), 3,454,705,766 bytes in total. The ancient-genome genealogy is a separate record (5512994) and is not used."

