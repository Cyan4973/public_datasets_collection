manifest_version = 1
dataset_id = "swisstopo_swisssurface3d_alps_las_z_i32"
name = "swisstopo swissSURFACE3D 2021 High-Alpine Lidar Tiles: LAS Int32 Z Record Codes"
description = "Native little-endian int32 Z codes (0.01 m, offset 0, LN02 heights) of every point record in 15 complete 1 km2 swissSURFACE3D 2021 classified-lidar tiles from the high Alps around the Aletsch glacier and Bernese Oberland. One sample per tile, in point-record order."
homepage = "https://www.swisstopo.admin.ch/en/height-model-swisssurface3d"

[license]
name = "swisstopo Open Government Data terms (Opendata BY: open use, source attribution mandatory)"
spdx = "LicenseRef-swisstopo-OGD-BY"
url = "https://www.swisstopo.admin.ch/en/terms-of-use-free-geodata-and-geoservices"
citation = "©swisstopo (Federal Office of Topography swisstopo), swissSURFACE3D classified point cloud, 2021 acquisition, data.geo.admin.ch."
notes = "The geocat.ch ISO metadata record for 'swissSURFACE3D, die klassifizierte Punktwolke der Schweiz' (uuid 5cb73a88-887c-432d-b3a4-f4ea2b508a51) states the legal constraint 'Opendata BY: Open use. Must provide the source.' and links https://www.swisstopo.admin.ch/ogd-conditions. The swisstopo terms page says: 'The free geodata and geoservices of swisstopo may be used, distributed and made accessible. Furthermore, they may be enriched and processed and also used commercially. A reference to the source is mandatory.' Accepted source references include '©swisstopo'. The STAC collection field license='proprietary' is the generic STAC placeholder for a non-SPDX licence. These are the terms above, not a restriction."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official swisstopo federal geodata infrastructure (data.geo.admin.ch STAC asset hrefs), anonymous HTTPS. The selected tiles are uninhabited high-alpine terrain (glaciers, rock, scree, high pasture)."
usage_notes = "Only the Z field is emitted. X/Y, intensity, return bits, classification, scan angle, point source and GPS time are not collected."

[[origins]]
