size_bytes = 978017309
sha256 = "e02652108f7fcb144a62b9c3e00cd516d72a9179eb99df8ea8fb5e261eacb291"
local_path = "downloads/umbra_spotlight_sicd_complex_slc_f32/"
notes = "The SHA-256 identifies the tracked source plan sources.tsv, produced by discover.sh (metadata-only: listing, 4 KB head + 64 KB tail range probes, METADATA.json). Per product it pins key/URL, size, multipart ETag and part size, NITF HL, image subheader length, image data offset/length, DES offset/length, rows, cols, collector, processor version, polarization (from METADATA.json), SCP lat/lon, row/col sample spacing and impulse-response width, grazing angle, ValidData polygon area fraction."

