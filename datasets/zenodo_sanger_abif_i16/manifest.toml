download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/zenodo_sanger_abif_i16/samples.jsonl"
summary = "Strictly decode the four processed ABIF DATA9-DATA12 fluorescence arrays and emit one complete dye-channel trace per sample."
deterministic_notes = "Record IDs, licenses, per-record file counts and byte totals, every source MD5, ABIF identity/version/directory bounds, zero directory padding, exact trace tags/types/sizes/lengths, nonconstant distributions, output hashes, and byte-for-byte independent verification are enforced."

[[series]]
id = "sanger_processed_dye_trace_i16"
description = "Variable-length processed Sanger dye-channel electropherogram traces."
semantic_meaning = "Detector fluorescence intensity over electrophoretic scan time for one processed dye channel in one Sanger sequencing run."
role = "primary"
representation_class = "native_numeric"
representation_notes = "ABIF DATA9-DATA12 natively contain signed 16-bit processed trace values. Only byte order changes from ABIF big-endian to canonical little-endian; no scaling, clipping, smoothing, or baseline correction is performed."
source_resources = ["zenodo_10829882_abif", "zenodo_14001236_abif", "zenodo_15945185_abif", "zenodo_17172684_abif", "zenodo_7840070_abif"]
source_format = "Applied Biosystems ABIF chromatogram"
source_field = "Processed electropherogram arrays DATA9, DATA10, DATA11, and DATA12 with ABIF element type short"
filtered_input_path = "filtered/zenodo_sanger_abif_i16/ingest_stats.json"
filtering = "Retain all four complete processed channels from every one of the 63 pinned non-clinical chromatograms. Exclude base calls, quality scores, raw DATA1-DATA8 arrays, metadata, and container bytes."
missing_value_policy = "No trace values are dropped or imputed. Missing files/channels, inconsistent channel lengths, wrong element types, malformed directories, checksum changes, constant traces, or changed aggregate statistics fail the recipe."
conversion = "Decode each source big-endian ABIF short array and serialize the identical signed numeric values as little-endian int16."
numeric_kind = "int"
bit_width = 16
endianness = "little"
sample_format = "raw homogeneous signed-int16 fluorescence trace"
sample_geometry = "1d_electropherogram_channel"
sample_rank = 1
sample_axes = ["electrophoretic_scan_time"]
natural_record_kind = "complete_processed_dye_channel"
sample_count = 252
total_size_bytes = 6101144
output_path = "samples/zenodo_sanger_abif_i16/sanger_processed_dye_trace_i16/"
