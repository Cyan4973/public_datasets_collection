[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/apple_hypersim_normal_cam_f16/samples.jsonl"
summary = "Select one mid-trajectory frame for each of 200 evenly spaced public Hypersim scenes, range-GET only that frame's normal_cam.hdf5 member out of the stored scene zip, decode the float16[768, 1024, 3] HDF5 dataset with a pure-stdlib reader, and emit its binary16 words unchanged as one sample per frame."
deterministic_notes = "Selection (scripts/selection.py, pinned split CSV): public scenes = scenes with included_in_public_release rows (457), sorted; take index k*457//200 for k = 0..199 (covers all 51 Evermotion volumes); camera = cam_00, else the lowest-numbered camera with public frames (3 of the 200: ai_011_003, ai_044_003, ai_054_002 use cam_01); frame = the median (element len//2) of that camera's sorted public frame ids. The 200-scene cap exists only because one frame is 4,718,592 bytes and output is capped at 1 GB. sources.tsv pins the selection plus each zip's Content-Length and Last-Modified (discover.sh). download.sh re-derives the selection, parses EOCD/zip64 EOCD and the central directory, checks the local-header name, CRC-32 and a full HDF5 decode. build.sh runs a synthetic HDF5+zip self-test, then decodes each member (superblock v0, symbol-table root group, v1 object header, chunked layout v3 with 96x128x1 deflate chunks in a v1 B-tree, complete chunk grid required). verify.sh re-derives the selection, re-decodes every member and requires byte identity, recomputes statistics through an independent bit-level binary16 conversion, and enforces the same policy plus floors, cap and manifest scope."

[[series]]
id = "normal_cam_f16"
description = "Camera-space geometric surface normal of every pixel of one rendered Hypersim frame, 768 rows x 1024 columns x 3 components, IEEE binary16."
semantic_meaning = "For each pixel, the (x, y, z) components of the surface normal of the first visible surface, expressed in the camera coordinate frame and ignoring bump/normal mapping, as written by the Hypersim V-Ray rendering pipeline (README: 'surface normals in camera-space (ignores bump mapping)'). Mostly unit vectors (components in [-1, 1]) that are piecewise constant over planar walls, floors and furniture faces and vary smoothly over curved geometry. Pixels straddling geometric edges hold filtered (non-unit) values, and in some scenes the image reconstruction filter overshoots: realized range -5.64..4.64, minimum per-frame unit-norm pixel fraction 0.745 (NaN pixels count as non-unit), 38 of 198 frames below 0.99. No-hit pixels are NaN (see missing_value_policy)."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The upstream HDF5 datatype is IEEE binary16 (class 1, size 2, exponent 5 bits at 10, mantissa 10 bits, bias 15, little-endian), so the words are emitted exactly as stored, without widening or rescaling."
source_resources = ["hypersim_scene_zip_normal_cam_members", "hypersim_split_csv", "hypersim_readme"]
source_format = "HDF5 file per frame (superblock v0, chunked 96x128x1, deflate level 9) stored uncompressed inside the per-scene zip"
source_field = "dataset[768, 1024, 3] float16 camera-space surface normal (normal_cam)"
filtered_input_path = "filtered/apple_hypersim_normal_cam_f16/build_stats.json"
filtering = "One frame per selected scene (see deterministic_notes): 200 of the 457 public scenes selected, 198 emitted after the degenerate-frame drop, normal_cam only (no normal_world, normal_bump_*, depth, position or colour from the same zips). Frames excluded from the public release (outside viewing area, content flagged for removal) are never selected. Every pixel and component of a selected frame is kept."
missing_value_policy = "No value is filtered, renormalized, clipped, rounded or imputed. Pixels with no geometry hit (e.g. views through windows into empty space) are stored upstream as the canonical quiet NaN 0x7e00 in all three components (never a partial pixel). They are kept bit-exact and counted per sample (nan_value_count, finite_pixel_fraction in the index): realized 65 of 198 frames contain NaN, 4,104,339 NaN words in total (0.88% of all values), worst frame ai_004_010 at 19.5%; no Inf. Fatal (build and verify fail, no silent drops): a member that does not match its sidecar or does not decode to float16[768, 1024, 3]; any finite component with magnitude > 8 (genuine reconstruction-filter overshoot reaches -5.64 in ai_054_005); fewer than 50% finite pixel triplets; fewer than 50% of pixels with | |n| - 1 | <= 0.01. Dropped and recorded in build_stats.json (degenerate content, re-derived by verify): a single pixel triplet covering more than 90% of the frame, or fewer than 256 distinct words. Realized drops: ai_003_001 (14 distinct words: a few flat planes) and ai_039_003 (one triplet covers 97%: a wall filling the view). Frames whose most common triplet exceeds 50% are listed in build_stats.json (dominant-value flag, 30 of 198) but kept."
conversion = "Range-GET the stored zip member, check the CRC-32, then do a pure-stdlib HDF5 decode: superblock v0, the root group's symbol table to the link 'dataset', the v1 object header (dataspace, IEEE binary16 datatype, deflate-only filter pipeline, layout v3 chunked), the v1 chunk B-tree, then zlib-inflate each 96x128x1 chunk and scatter it into C order. Write the 2,359,296 little-endian binary16 words unchanged in (row, column, component) order. One sample per frame."
numeric_kind = "float"
bit_width = 16
endianness = "little"
sample_format = "raw little-endian IEEE binary16 array, C order [768, 1024, 3]"
sample_geometry = "image_rows_by_columns_by_vector_component"
sample_rank = 3
sample_axes = ["image_row", "image_column", "normal_component_xyz"]
natural_record_kind = "rendered_frame_camera_space_normal_gbuffer"
sample_count = 198
total_size_bytes = 934281216
output_path = "samples/apple_hypersim_normal_cam_f16/normal_cam_f16/"
