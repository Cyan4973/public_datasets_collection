[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/cloudnet_lindenberg_chm15k_beta_raw_f32/samples.jsonl"
summary = "Check 24 pinned Cloudnet files-API records, fetch the 24 daily Lindenberg CHM15k lidar NetCDF4 files whole, validate size + SHA-256 + decode, then decode each file's beta_raw variable (float32, time x 1535, shuffle + deflate) with a pure-stdlib HDF5 reader and emit one raw little-endian float32 matrix per day in native time-major order."
deterministic_notes = "sources.tsv (date, uuid, filename, size, sha256, cloudnetpy_version) is pinned by SHA-256. Each file must be HDF5 superblock v2 with root links beta_raw/time/range, global attributes serial_number CHM100110, instrument_pid https://hdl.handle.net/21.12132/3.cdf99c536bd04146, cloudnet_file_type lidar, source 'Lufft CHM15k', location Lindenberg, file_uuid equal to the pinned uuid, year/month/day equal to the pinned date and cloudnetpy_version 1.75.0; beta_raw must be IEEE float32 LE (datatype message 11201f00...7f000000), rank 2 with 1535 range gates and 5700..5800 profiles (5760 nominal), chunked, filter pipeline exactly [shuffle(4), deflate], every chunk present once, aligned, with filter mask 0 and inflating to the full chunk size; beta_raw attributes units 'sr-1 m-1', comment 'Non-screened attenuated backscatter coefficient.', _FillValue 9.969209968386869e36 (netCDF default float fill); time in hours since the measurement date, strictly increasing within [0, 24) h with a median step of 15 s (+-0.05 s); range on the 9.99 m lattice (range[i] = 9.99 (i+1) m +- 0.02 m) and byte-identical in all 24 files. h5lite verifies the lookup3 checksum of every v2 metadata block. Build takes chunks by recursive B-tree descent and unshuffles by slice assignment; verify walks the leaf sibling chain, inflates with a streamed decompressor and unshuffles by zipping byte lanes, then compares bytes. A synthetic HDF5 self-test (scripts/selftest_chm15k.py: two-level B-tree, 3 x 3 chunks with padded edges, negative cases) runs before download validation, build and verify. Samples sorted by date. Realized: 24 samples, 23 of 5760 x 1535 and one (2024-03-01) of 5720 x 1535 (largest gap 625 s), 212,137,000 values / 848,548,000 bytes, median 8,841,600 values; chunk dims (2880, 768) (2024-03-01: (2860, 768)), i.e. 2 x 2 chunks with a padded range edge; zero fill values."

[[series]]
id = "lindenberg_chm15k_beta_raw_f32"
description = "Daily non-screened attenuated backscatter (beta_raw) matrices of the DWD Lindenberg Lufft CHM15k ceilometer, as stored in Cloudnet daily lidar files."
semantic_meaning = "Range-corrected attenuated backscatter coefficient beta_raw (sr-1 m-1) of a vertically pointing 1064 nm Lufft CHM15k ceilometer, as delivered by the instrument (background-subtracted, hence signed noise) and scaled by CloudnetPy's attenuated-backscatter calibration factor (file scalar calibration_factor, 4e-12 in the probed file) at Lindenberg, Germany (52.208 N, 14.118 E, 104 m), one profile every 15 s, 1535 range gates of 9.99 m from 9.99 m to 15,334.65 m. Values are signed: clear-air gates scatter around zero (about +-1e-5 noise, roughly 40% negative) while aerosol layers, clouds and precipitation give positive returns up to about 1e-3. This is the unscreened field; the SNR-screened 'beta' and smoothed 'beta_smooth' variables of the same file are not emitted."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The NetCDF4 variable beta_raw is stored by CloudnetPy as little-endian IEEE float32. The recipe inflates each chunk, reverses the HDF5 byte shuffle (element size 4), places the in-bounds part of each chunk and writes the float32 values unchanged; no scaling, masking, gap filling or reordering."
source_resources = ["files_api_records", "lidar_daily_netcdf"]
source_format = "NetCDF4/HDF5 Cloudnet daily lidar file (CloudnetPy 1.75.0), variable chunked with shuffle + deflate filters and indexed by a version-1 chunk B-tree"
source_field = "beta_raw (float32, dims time x range = N x 1535, units sr-1 m-1)"
filtered_input_path = "filtered/cloudnet_lindenberg_chm15k_beta_raw_f32/ingest_stats.json"
filtering = "Keep only the 24 pinned days (1st and 15th of each month of 2024, all errorLevel pass, coverage >= 0.99) of the single instrument cdf99c53-6bd0-4146-be2a-604cf1164c30. All profiles and all 1535 gates of each day's beta_raw are kept; no profile, gate or value is dropped. The other variables of the file (beta, beta_smooth, time, range, height and scalars) are read only for validation and not emitted."
missing_value_policy = "Values are emitted exactly as stored. Missing profiles (instrument gaps) are simply absent from the time axis, so a day's matrix has fewer rows; no rows are synthesized (5700..5800 rows required, 5760 nominal; max gap recorded per sample). The netCDF default fill 9.969209968386869e36 (bit pattern 0x7CF00000, the variable's _FillValue) is kept in place if present, counted per sample (fill_count, fill_profiles) and excluded from the recorded min/max/mean/std; a day with more than 1% fill values is fatal. Any NaN, infinity or non-fill value with |v| > 1 sr-1 m-1 is fatal (no clipping). Each sample must also have at least 100,000 distinct values in a stride-8 subsample, nonzero variance, a negative-value fraction within 5..95% (the unscreened noise floor), differing first and last profiles, and no two samples may be identical. Build and verify apply the same rules."
conversion = "Resolve the root links (dense link storage), check Dataspace (N, 1535), Datatype float32 LE, Filter Pipeline [shuffle(4), deflate] and Layout v3 chunked; take the chunk addresses from the version-1 B-tree, zlib-inflate each chunk to exactly prod(chunk dims) x 4 bytes, byte-unshuffle with element size 4 (byte j of element k is stored at j*n + k) and copy the in-bounds rows of each chunk into a row-major N x 1535 array. Each sample is one raw little-endian float32 file of N x 1535 values (row = 15 s profile in time order, column = range gate from the instrument upward), at most 5760 x 1535 x 4 = 35,366,400 bytes. Index min/max are the stored float32 values."
numeric_kind = "float"
bit_width = 32
endianness = "little"
sample_format = "raw homogeneous float32 time x range matrix"
sample_geometry = "N_profiles_15s_x_1535_range_gates_9p99m"
sample_rank = 2
sample_axes = ["time", "range"]
natural_record_kind = "cloudnet_lidar_daily_file_beta_raw_matrix"
sample_count = 24
total_size_bytes = 848548000
output_path = "samples/cloudnet_lindenberg_chm15k_beta_raw_f32/lindenberg_chm15k_beta_raw_f32/"
