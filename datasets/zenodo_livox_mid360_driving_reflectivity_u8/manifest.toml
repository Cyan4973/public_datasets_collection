description = "Per-point calibrated laser return reflectivity (Livox native 8-bit scale) of every /livox/lidar frame (2,772 PointCloud2 messages, about 10 Hz, 277 s) in K. Koide's 'Driving SLAM Test with Livox MID360' rosbag2 recording (Zenodo 14841855, 2024-04-16). The recipe emits one uint8 sample per frame with one byte per emitted point slot, in native scan order."
