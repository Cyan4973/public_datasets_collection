manifest_version = 1
dataset_id = "hutubs_measured_hrir_f64"
name = "HUTUBS (TU Berlin) Measured Head-Related Impulse Responses: SOFA Data.IR, 96 Subjects x 440 Directions x 2 Ears x 256 Taps, Float64"
description = "Native float64 measured binaural head-related impulse responses (HRIRs) of the HUTUBS HRTF database (Audio Communication Group, TU Berlin, with Huawei and Sennheiser): for each of the 96 database subjects, the SOFA SimpleFreeFieldHRIR variable Data.IR, shape [M=440 source directions, R=2 ears, N=256 taps] at 44.1 kHz, decoded from the subject's ppN_HRIRs_measured.sofa file (netCDF-4/HDF5, shuffle+deflate) and emitted in native C order as little-endian float64, one sample per subject. The numerically simulated (BEM) HRIRs are excluded."
homepage = "https://depositonce.tu-berlin.de/items/dc2a3076-a291-417e-97f0-7697e332c960"

[license]
name = "Creative Commons Attribution 4.0 International"
spdx = "CC-BY-4.0"
url = "https://creativecommons.org/licenses/by/4.0/"
citation = "Fabian Brinkmann, Manoj Dinakaran, Robert Pelzer, Jan Joschka Wohlgemuth, Fabian Seipel, Daniel Voss, Peter Grosche, Stefan Weinzierl (2019). The HUTUBS head-related transfer function (HRTF) database. DepositOnce, TU Berlin. https://doi.org/10.14279/depositonce-8487. Related article (DepositOnce 'Is Supplement To'): Brinkmann et al. (2019), J. Audio Eng. Soc., https://doi.org/10.17743/jaes.2019.0024."
notes = "Three independent statements of the grant, all checked: (1) the DepositOnce item page (DOI 10.14279/depositonce-8487 resolves to handle 11303/9429 = item dc2a3076-...) carries dc.rights.uri = https://creativecommons.org/licenses/by/4.0/ and is displayed as 'Creative Commons Attribution (CC BY)'; download.sh fetches the page and requires that field in the HUTUBS item's embedded metadata block; (2) every downloaded ppN_HRIRs_measured.sofa carries the global attribute License = 'cc-by 4.0 (https://creativecommons.org/licenses/by/4.0/)' plus DatabaseName = 'HUTUBS'; download.sh and build.sh require both exactly, so the grant is attached to the exact objects decoded; (3) the database Documentation.pdf states 'The data is provided under the free culture CC BY license that grants unlimited access for everyone' with the CC BY 4.0 URL. The files are fetched from the sofacoustics.org SOFA database mirror (the SOFA/AES69 community data server) rather than from the DepositOnce HRIRs.zip (1.27 GB, mixes measured and simulated data); the per-file DatabaseName/License attributes identify them as the HUTUBS release. Attribution: cite the DOI and article above."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Published research database. Subjects are identified only by pseudonymous IDs pp1..pp96 (SOFA ListenerShortName); the DepositOnce deposit includes the depositor's privacy/consent statement and the documentation marks which data parts each subject consented to publish (HRIRs are published for all 96). Only acoustic impulse responses are collected; head meshes, anthropometric measures and headphone responses are not downloaded."
usage_notes = "Subjects 1 and 96 are two measurements of the FABIAN head-and-torso simulator (a dummy head), and subjects 22 and 88 are two measurements of one human subject (Documentation.pdf, 'Database' section). All four are kept: each is a separate acoustic measurement with its own noise and positioning; they are flagged per sample in the index (subject_note)."

