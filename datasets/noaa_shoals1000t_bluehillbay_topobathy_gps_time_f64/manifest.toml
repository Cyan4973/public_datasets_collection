verify_script = "verify.sh"
sample_index_path = "index/noaa_shoals1000t_bluehillbay_topobathy_gps_time_f64/samples.jsonl"
summary = "Download all 92 pinned SHOALS-1000T COPC tiles of project 8526, decode them with the repository LAZ decoder (tools/laz/laszip.py, layered POINT14 v3), and copy each point record's native eight-byte GPS time into one float64 sample per tile."
deterministic_notes = "Tiles are processed in sources.tsv (key) order. download.sh pins size and MD5 per object and validates LAS 1.4, compressed PDRF 6, 30-byte records, global_encoding bit 0 (adjusted standard GPS time), LASzip compressor 3 with items [(POINT14,30,3)] and variable chunks, the COPC info VLR, and header point count = STAC pc:count. build.sh preserves stored record order and source bytes; per tile it requires decoded count = header count, all values finite, decoded min/max bit-identical to the COPC info VLR gpstime extent, min/max/mean within publisher STAC rounding, and at least two distinct values; it enforces floors and the 1 GB cap. verify.sh re-decodes every tile, re-extracts via struct.iter_unpack, byte-compares every sample, and checks index fields, sha256, min/max from stored float64, and the manifest totals."

[[series]]
id = "shoals_gps_time_f64"
description = "Per-point GPS time of the SHOALS-1000T bathymetric lidar, one sample per COPC tile, in stored record order."
semantic_meaning = "Acquisition time of each lidar return in adjusted standard GPS seconds (GPS seconds minus 1e9), about 1.8246e8 to 1.8332e8 s (2017-06-25 to 2017-07-05), from a 2.5 kHz pulse-rate airborne bathymetric lidar (single return per pulse record)."
role = "primary"
representation_class = "native_numeric"
representation_notes = "LAS 1.4 point data record format 6 stores GPS time as a little-endian IEEE-754 double at record offset 22; COPC/LAZ compression is lossless, so the decoded bytes are the source values. Stored order is COPC octree-node order (points stored node after node, roughly time-ordered within a node, with backward jumps between nodes), not global acquisition order."
source_resources = ["copc_tiles_8526"]
source_format = "LAS 1.4 point data record format 6 in COPC LAZ (LASzip compressor 3, POINT14 v3)"
source_field = "GPS Time"
filtered_input_path = "filtered/noaa_shoals1000t_bluehillbay_topobathy_gps_time_f64/ingest_stats.json"
filtering = "Keep every point record of all 92 tiles, including the smallest tile 20170705_tile_538000_4903000 (468 points), which is part of the published population; no class, return, or flag filtering."
missing_value_policy = "GPS time is mandatory in PDRF 6; no sentinel exists. Truncated tiles, decoder desynchronisation (count or COPC extent mismatch), non-finite values, or constant tiles fail build and verify. Nothing is dropped or imputed."
conversion = "Decode each tile's point records with tools/laz/laszip.py iter_chunks and copy bytes 22..29 of every 30-byte record unchanged into a raw little-endian float64 array; one file per tile under samples/<id>/shoals_gps_time_f64/."
numeric_kind = "float"
bit_width = 64
endianness = "little"
