name = "Creative Commons Attribution 4.0 International"
spdx = "CC-BY-4.0"
url = "https://creativecommons.org/licenses/by/4.0/"
citation = "M. de Mayo, D. Cremers, T. Pire. The Monado SLAM Dataset for Egocentric Visual-Inertial Tracking. IEEE/RSJ IROS 2025, pp. 13111-13118, doi:10.1109/IROS60139.2025.11247240. Data: https://huggingface.co/datasets/collabora/monado-slam-datasets (Collabora)."
notes = "The dataset card at the pinned revision declares `license: cc-by-4.0` in its metadata, its License section states the work is licensed under CC BY 4.0, and the introduction says the data may be used for any purpose with a mention of the original project. download.sh re-checks the card metadata and README text at the pinned revision."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official Collabora/TUM upload on Hugging Face (repository collabora/monado-slam-datasets, revision 74c07d42d980c55775dd0edc06e58c486b848be1). Only headset IMU CSV members are fetched; no camera images or other members are downloaded."
usage_notes = "Headset inertial measurements only (angular velocity and specific force of the device). No images, audio, names or identifiers of the wearer are emitted."

