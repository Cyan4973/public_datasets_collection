[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/nasa_pds_magellan_fmidr_sar_u8/samples.jsonl"
summary = "Fetch 685 pinned files (354,780,608 bytes) for six F-MIDRs, validate every detached PDS3 label and VICAR2 header, and emit each framelet's 1024x1024 uint8 IMAGE object as one raw sample (336 samples, 352,321,536 bytes)."
deterministic_notes = "sources.tsv (SHA-256 pinned in download.sh and the parser) fixes every volume, directory, file, byte size and MD5. discover.sh documents the selection from the 765 F-MIDR directories: name unique across volumes, not on mg_0001 (older 1-record VICAR layout), whole-MIDR DN-0 fraction below 0.2 % and max DN <= 251 by the MIDR's HIST.TAB, one MIDR per volume, spread over latitude -35..+65 and longitude 3..286 E. Build and verify require DATA_SET_ID MGN-V-RDRS-5-MIDR-FULL-RES-V1.0, MAGELLAN/VENUS/RADAR SYSTEM/PRIMARY_MISSION, FILE_RECORDS 1026, ^IMAGE record 3, 2-record VICAR2 header, 1024x1024 UNSIGNED_INTEGER 8-bit, the pinned DN-law note, sinusoidal 75 m/pixel projection, VICAR LBLSIZE 2048 / BYTE / BSQ / NL=NS=1024 / NBB=NLB=0 / SPDN_1=0 'MISSING DATA' / LOW_REP -20 / HI_REP 30 / PRODUCT = IMAGE_ID / SUBFRAME, SUBF_ROW, SUBF_COL = framelet position. The 56 framelet histograms of each MIDR must sum exactly to its published HIST.TAB. Samples are sorted by volume, MIDR and framelet; the aggregate SHA-256 of (sample_path, sha256) lines is pinned in expected_output.json."

[[series]]
id = "magellan_fmidr_sar_backscatter_u8"
description = "Magellan full-resolution Venus SAR mosaic framelets as stored 8-bit backscatter DNs."
semantic_meaning = "Each value is a stored F-MIDR DN of Magellan S-band (12.6 cm) SAR backscatter on a 75 m/pixel sinusoidal map grid: DN = INT((MIN(MAX(RV,-20),30) + 20) * 5) + 1, where RV is the radar cross section per unit area divided by the Muhleman law, in dB, giving 0.2 dB per DN over DN 1..251 (-20..+30 dB). DN 0 is the single VICAR-declared special value, MISSING DATA."
role = "primary"
representation_class = "native_numeric"
representation_notes = "This is the archive's own quantized product: each detached PDS3 label declares the IMAGE object as UNSIGNED_INTEGER with SAMPLE_BITS 8 and states the DN law. The build emits the declared IMAGE DNs as stored, with no rescaling, no dB conversion, and no remapping of DN 0."
source_resources = ["fmidr_25s003", "fmidr_65n018", "fmidr_35s130", "fmidr_05s098", "fmidr_10n188", "fmidr_20n286"]
source_format = "PDS3 detached-label Magellan F-MIDR framelet: 2048-byte VICAR2 header followed by a 1024x1024 UNSIGNED_INTEGER 8-bit IMAGE object"
source_field = "IMAGE object DN (F-MIDR normalized radar backscatter, 0.2 dB per DN, DN 0 = MISSING DATA)"
filtered_input_path = "filtered/nasa_pds_magellan_fmidr_sar_u8/ingest_stats.json"
filtering = "All 56 framelets of each of the six pinned F-MIDRs are inspected. Drop rule, applied identically in build and verify: a framelet is dropped iff more than 524,288 of its 1,048,576 pixels are DN 0, so all-zero framelets are always dropped. For this selection the rule drops nothing, because the largest whole-MIDR DN-0 count is 111,758 (F-MIDR.05S098). VICAR headers, PDS labels, browse images and the geom/frame tables are not emitted; HIST.TAB is used only as an exact cross-check."
missing_value_policy = "DN 0 (MISSING DATA) stays in place inside retained framelets (221,906 pixels, 0.063 % of retained pixels, by HIST.TAB); it is never remapped, masked or imputed. Framelets over the 50 % DN-0 threshold are dropped as above. Fatal: any DN above 251, a constant framelet, fewer than 16 distinct DNs, any label or VICAR header deviation, a size or MD5 mismatch, or a MIDR whose framelet histograms do not sum to its HIST.TAB."
conversion = "Parse the detached label. Its ^IMAGE pointer names the upper-case file FFNN.IMG at record 3, which is mapped explicitly to the bucket's lower-case key ffNN.img. Skip (3 - 1) * 1024 = 2048 header bytes and write the next 1,048,576 bytes (1024 lines x 1024 samples, line-major as stored) as one raw uint8 sample per framelet. 8-bit values need no byte-order change."
numeric_kind = "uint"
bit_width = 8
endianness = "little"
sample_format = "raw homogeneous uint8 1024x1024 framelet raster"
sample_geometry = "fixed_1024x1024_sinusoidal_map_framelet"
sample_rank = 2
sample_shape = [1024, 1024]
sample_axes = ["line", "sample"]
natural_record_kind = "magellan_fmidr_framelet_file"
sample_count = 336
total_size_bytes = 352321536
output_path = "samples/nasa_pds_magellan_fmidr_sar_u8/magellan_fmidr_sar_backscatter_u8/"
