manifest_version = 1
dataset_id = "ncbi_geo_gpl5423_scanarray_cdna_scan_u16"
name = "GEO GSE23678 Spruce cDNA Microarray Raw Laser-Scanner Images (PerkinElmer ScanArray Express, uint16)"
description = "Native uint16 photomultiplier intensity rasters (10 um pixels, full slide) from a PerkinElmer ScanArray Express laser scanner: the Cy3 and Cy5 channel scans of 12 two-colour hybridizations of the Treenomix 21.8K spruce cDNA microarray (GEO platform GPL5423), GEO series GSE23678. The scans were decoded from the submitter's uncompressed TIFFs as published in GEO."
homepage = "https://ftp.ncbi.nlm.nih.gov/geo/series/GSE23nnn/GSE23678/"

[license]
name = "NCBI GEO public data (no NCBI-imposed use restrictions)"
spdx = "LicenseRef-NCBI-Public-Data"
url = "https://ftp.ncbi.nlm.nih.gov/README.ftp"
citation = "GEO series GSE23678, 'Interior spruce_Bark_Leptographium abietinum_inoculation' (contributors N. Kolosova, R. White, S. Ralph, C. Breuil, J. Bohlmann; Michael Smith Laboratories, University of British Columbia), platform GPL5423 Treenomix spruce 21.8K cDNA microarray, NCBI Gene Expression Omnibus, public 2012-12-01, BioProject PRJNA130807."
notes = "Evidence: the NCBI FTP README on the same host says 'NOTE: ALL DATA HERE IS PUBLIC, NON-SENSITIVE, UNRESTRICTED SCIENTIFIC DATA SHARING AMONG SCIENTIFIC COMMUNITIES. THESE SERVERS ARE INTENTIONALLY PUBLIC.' download.sh re-fetches README.ftp on every run and stops if that sentence is gone. Caveat: GEO's own disclaimer page (www.ncbi.nlm.nih.gov/geo/info/disclaimer.html) is proxy-blocked from this environment, so its wording was not re-verified here. As commonly quoted, it says NCBI places no restrictions on the use or distribution of GEO data, but submitters may claim patent, copyright or other IP rights in data they submit, and NCBI cannot assess such claims. The GSE23678 series and sample records carry no rights, license, copyright or restriction statement (checked in the series-matrix header). The emitted values are machine-generated scanner intensities. TIFF tag 33432 (Copyright) in every file reads 'Copyright (C) 2002 PerkinElmer, Inc.'. This is boilerplate that the ScanArray Express 2.1 acquisition software writes into each image it saves: it is byte-identical in all 24 files, dated 2002, four years before the August 2006 scans, and names the software vendor, not the lab. It is not a rights claim on the measurements, and the parser requires that exact string so a different claim would fail the build. Precedent for the NCBI-public-data basis: accepted ncbi_refseq_viral_genomes_u8 (LicenseRef-NCBI-Public-Data). Attribute GEO GSE23678 and its contributors."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official NCBI GEO FTP (HTTPS) per-sample supplementary files only, pinned by name, size, gzip CRC32/ISIZE and sha256. The organism is interior spruce (Picea glauca x engelmannii) bark RNA. There are no human subjects. The TIFF Artist tag names the institution ('BC Forestry Sciences') and the HostComputer tag says 'Windows 2000'; ImageDescription carries 'ProtocolDesc=Dr. Tai'. These stay in the source files and are not emitted."
usage_notes = "Only the decoded pixel planes are emitted. Scanner settings (PMT gain, laser power, fluor) and GEO sample identity are carried in the sample index as provenance metadata."

