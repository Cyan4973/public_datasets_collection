# Accepted after user-run download and successful local build/verification.
manifest_version = 1
dataset_id = "noaa_cors_rinex_observations_f64"
name = "NOAA CORS RINEX GNSS Observations Float64"
description = "Raw satellite-navigation pseudorange, carrier-phase, and signal-strength observations decoded from NOAA CORS RINEX station-day files."
