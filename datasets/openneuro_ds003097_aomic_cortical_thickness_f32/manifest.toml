manifest_version = 1
dataset_id = "openneuro_ds003097_aomic_cortical_thickness_f32"
name = "AOMIC-ID1000 FreeSurfer 6 Per-Vertex Cortical Thickness Float32"
description = "Per-vertex cortical grey-matter thickness maps (mm, native float32) from FreeSurfer 6.0.1 recon-all, one map per hemisphere for 200 evenly spaced AOMIC-ID1000 participants on OpenNeuro ds003097."
homepage = "https://openneuro.org/datasets/ds003097"

[license]
name = "Creative Commons CC0 1.0 Universal"
spdx = "CC0-1.0"
url = "https://creativecommons.org/publicdomain/zero/1.0/"
citation = "Snoek, L., van der Miesen, M.M., Beemsterboer, T., van der Leij, A., Eigenhuis, A., & Scholte, H.S. (2021). The Amsterdam Open MRI Collection, a set of multimodal MRI datasets for individual difference analyses. Scientific Data 8, 85. OpenNeuro ds003097 (AOMIC-ID1000), DOI 10.18112/openneuro.ds003097.v1.2.1."
notes = "The dataset-level dataset_description.json declares \"License\": \"CC0\" for ds003097; the dataset README states the dataset contains both raw and preprocessed data and other derivatives. The FreeSurfer derivatives directory carries no separate license file. (derivatives/fmriprep/dataset_description.json contains only the unfilled fMRIPrep template string for License; it is not used by this recipe.) Preserve the HowToAcknowledge citation."

[safety]
contains_sensitive_data = true
contains_personal_data = false
provenance_notes = "Public deidentified human-subject MRI derivatives released by the AOMIC authors (University of Amsterdam) through OpenNeuro's official S3 bucket; anonymization was designed with GDPR advice per the dataset acknowledgements."
usage_notes = "Human-subject neuroimaging derivative, flagged sensitive per the openneuro_ds000030 precedent. The recipe keeps only per-vertex cortical thickness values; it downloads no participant tables, demographics, psychometrics, images or free text. Participant IDs appear only as the OpenNeuro sub-NNNN directory labels."

