[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/grail_lgrs_kbr1c_ka_band_ranging_f64/samples.jsonl"
summary = "Fetch the 107 pinned extended-mission KBR1C daily ASCII products (plus labels and the volume MD5 manifest), parse columns 1-4 of every record (DPSIS Table 43), and emit per product three little-endian float64 primary samples (biased range, range rate, range acceleration) and one int64 auxiliary TDB-seconds sample, all from the same records in source order."
deterministic_notes = "Scope rule (discover.sh): every KBR1C_YYYY_MM_DD_X_04.ASC listed in grail_0101_230316.md5 dated in the extended mission, 2012-08-30..2012-12-14 (107 products, 2 s cadence); sources.tsv pins them in date order. The 90 primary-mission products (2012-03-01..2012-05-29) are 5 s cadence, a different sampling lattice, and are excluded rather than mixed. Two products are partial days as published: 2012_08_30 starts 16:31:38 (13,373 records) and 2012_12_14 ends 20:54:42 (37,195 records); 2012_12_13/14 follow the end of the science phase (2012-12-12) but are the same instrument, product version and cadence. 28 further days have published data gaps (42,501..43,122 of 43,200 epochs, mostly the weekly Ka boresight-calibration days); records are never spliced, filled or reordered, and the auxiliary TDB series plus index fields gap_count, missing_epochs, max_gap_s, gaps (first 50), rebias_steps (steps where |d range - mean rate * dt| > 1 m, i.e. new carrier-phase arcs with a new range bias) and calslew_flag_records make every discontinuity explicit. Index rows also carry date, source_file, source_md5, record_count, first/last TDB, partial_day, distinct_values, sample_sha256 and min/max computed from the stored float64 values. verify.sh re-checks size and published MD5 of every product, re-parses the ASCII with its own reader, re-derives all four samples byte for byte, checks that within phase arcs the published range rate integrates to the range (>= 99% of steps within 1 m), and rejects constant, low-distinct (< 100) or float32-representable samples. Realized: 107 products, 4,578,310 records, 321 primary samples, 13,734,930 primary values, 109,879,440 primary bytes (36,626,480 per series) plus 36,626,480 auxiliary bytes; 13,373..43,200 values per sample, median 43,200; every primary sample has all-distinct values. 30 days carry 38 gaps (8,783 missing 2 s epochs, longest 996 s), 29 range re-bias steps on 25 days, 31,202 calibration-slew-flagged records, 0 records with other flag digits. SHA-256 of all primary samples concatenated in index order 018188b69b8e41fea56b429540de9608d2b66b5b5eb59fe5a490dd6747fdc00b."

[[series]]
id = "kbr1c_biased_range_f64"
description = "Biased dual one-way Ka-band range between GRAIL-A and GRAIL-B, one array per daily KBR1C product."
semantic_meaning = "DPSIS Table 43 column 2: 'Biased dual one-way range between GRAIL-A and GRAIL-B (m)', digitally filtered, not corrected for time of flight or antenna offset. Within each continuous carrier-phase arc the value equals the true inter-spacecraft range plus an unknown constant bias; at a phase break (data gap) a new arc starts with a new bias, so the series jumps by up to tens of km there (e.g. +34.5 km after the 956 s gap at TDB 408433978 on 2012-12-10). Realized values span -211,773.19 .. +475,435.13 m across the 107 days (the bias makes the absolute level arbitrary per arc), printed to 1e-10 m."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The archive prints each double with up to 16-17 significant digits (e.g. -29030.1360341154, 0.07050382816793005); Python float() yields the correctly rounded IEEE-754 double of the published decimal, stored unchanged as little-endian float64. The values are not float32-representable, so 64 bits is the native precision, not a widening."
source_resources = ["kbr1c_products", "kbr1c_labels", "volume_md5_manifest"]
source_format = "PDS3 STREAM ASCII table (GRAIL LGRS KBR1C RL04, CRLF lines): variable-length text header ending 'END OF HEADER', then one 20-column whitespace-separated record per 2 s epoch (DPSIS Table 43)"
source_field = "column 2, biased dual one-way range between GRAIL-A and GRAIL-B (m)"
filtered_input_path = "filtered/grail_lgrs_kbr1c_ka_band_ranging_f64/build_stats.json"
filtering = "All records of the 107 pinned products, in source order; no records, columns or time ranges are dropped."
missing_value_policy = "The products contain no sentinel or fill values in columns 1-4 (gaps up to 20 s are already interpolated upstream; longer gaps are simply absent records). All records are kept as published, including records flagged with quality digit 1 ('from raw data for Ka boresight calibration slew'), which are counted per sample (calslew_flag_records); records with any other flag digit set are counted (other_flag_records). Fatal in download validation, build and verify: a record without exactly 20 columns, a non-integer TDB, a non-finite value, |value| >= 1e7 m, a malformed 8-digit flag, a record count or first/last TDB different from the header and sources.tsv, or a TDB step that is not a positive multiple of 2 s."
conversion = "For each record (lines after 'END OF HEADER', CRLF-split, whitespace-split), float(column 2) packed as '<d'; one sample <date>.f64 per product, records in source (time) order."
numeric_kind = "float"
bit_width = 64
endianness = "little"
sample_format = "raw little-endian float64 1-D array"
sample_geometry = "time_series"
sample_rank = 1
sample_axes = ["epoch"]
natural_record_kind = "published_grail_kbr1c_daily_product"
sample_count = 107
total_size_bytes = 36626480
output_path = "samples/grail_lgrs_kbr1c_ka_band_ranging_f64/kbr1c_biased_range_f64/"

