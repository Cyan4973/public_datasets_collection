summary = "Decode the pinned large normal Modbus/TCP capture and emit one uint16 sequence per server-read register address."
deterministic_notes = "Source identity, size, MD5, record title, and CC BY 4.0 license are enforced. The parser accepts classic Ethernet/IPv4/TCP PCAP, decodes complete port-502 Modbus ADUs, correlates function-3/4 responses to requests using flow, transaction, unit, and function identifiers, and preserves response packet order. Only four exact read-register streams are emitted. The source contains exactly seven extra read responses lacking correlatable requests; they cannot be assigned register addresses, are excluded, and their exact count is enforced."

[[series]]
id = "zeroswarm_modbus_input_register_u16"
description = "Anonymous Modbus input-register read sequences from the normal Factory I/O run."
semantic_meaning = "Unsigned 16-bit values returned by Modbus function 4 for input register addresses 0 and 1, one natural sample per address."
role = "primary"
representation_class = "native_numeric"
representation_notes = "Modbus registers are protocol-native unsigned 16-bit big-endian words; outputs preserve each word and convert only to little-endian corpus order."
source_resources = ["zeroswarm_normal_v2_pcap"]
source_format = "Classic PCAP containing Ethernet/IPv4/Modbus-TCP"
source_field = "Function-4 response register words correlated to request start addresses"
