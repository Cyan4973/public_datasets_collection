[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/the_well_post_neutron_star_merger_density_f32/samples.jsonl"
summary = "Validate the pinned CC BY 4.0 revision, parse each file's HDF5 metadata from two small byte ranges, range-fetch nine complete density dumps (indices 20, 40, ..., 180) from each of the 8 simulations, apply the disk-presence scope rule (6 files qualify), and emit each 192 x 128 x 66 float32 volume unchanged as one sample."
deterministic_notes = "Revision, file sizes, LFS sha256 and xet hashes are pinned in sources.tsv and re-checked against the live API; every range response must be HTTP 206 with the exact Content-Range and the pinned content identity. A stdlib HDF5 reader (superblock v2 with lookup3 checksum, v1 object headers, symbol-table groups) validates that /t0_fields/density is (1, 181, 192, 128, 66) IEEE F32LE, contiguous at byte 16,777,216 with 1,174,339,584 bytes and no filter pipeline, and that /dimensions/time has 181 strictly increasing entries. The parser is self-tested on a synthetic HDF5 file in build.sh. Samples are byte-identical to the fetched ranges; verify.sh re-parses the metadata, byte-compares samples with downloads, recomputes all statistics through two decode paths, rejects duplicates, and checks manifest totals. Emitted samples must also have >= 50% distinct values, a modal value <= 10% of cells, <= 25% of (r, theta) rows constant along phi, and >= 6 decades between max and min-positive. Realized: 54 samples x 1,622,016 values."

[[series]]
id = "post_neutron_star_merger_density_f32"
description = "Fluid rest-mass density volumes from saved dumps of nubhlight GR neutrino-radiation MHD post-merger accretion-disk simulations."
semantic_meaning = "Rest-mass density rho_0 of the plasma on the simulation's 192 (log r) x 128 (theta code coordinate, equator-focused) x 66 (phi) log-spherical grid at one saved dump time, in per-simulation code units (multiply by the scenario's RHO_unit in simulation_parameters.json for g/cm^3)."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The publisher stores the field as IEEE binary32 little-endian (the simulations ran in double precision; the float32 HDF5 dataset is the published artifact). Bytes are copied unchanged; no rescaling, unit conversion, transposition or resampling."
source_resources = ["scenario_0_density_snapshots", "scenario_1_density_snapshots", "scenario_2_density_snapshots", "scenario_3_density_snapshots", "scenario_4_density_snapshots", "scenario_7_density_snapshots"]
source_format = "HDF5 (superblock v2) file in The Well layout, contiguous unfiltered F32LE dataset"
source_field = "/t0_fields/density[0, dump, :, :, :] (dimensions log_r, theta, phi)"
filtered_input_path = "filtered/the_well_post_neutron_star_merger_density_f32/ingest_stats.json"
filtering = "From each of the 8 published simulation files, the 9 saved dumps with index 20, 40, ..., 180 (code times ~1500 to ~9500 in steps of ~1000; dump 180 is the last) are fetched. Dump 0 (code time ~500, the earliest saved state) is excluded by the stride rule, so the near-untouched initial atmosphere never enters the family. Scope rule, evaluated on the fetched data in build.sh and verify.sh: a file is emitted only if every selected dump has maximum density >= 1e-2 code units (an order-unity-normalized disk is present). Scenarios 0, 1, 2, 3, 4 and 7 qualify (every dump max >= 0.057). Scenarios 5 and 6 are excluded (every dump max <= 2.2e-5; floor-dominated fields with 150k-860k distinct values), and a mixed outcome is fatal. Result: 6 files x 9 dumps = 54 samples. Other fields (electron_fraction, temperature, entropy, internal_energy, pressure, velocity, magnetic_field, g_contravariant) are not emitted."
missing_value_policy = "The source has no missing-value sentinel. Every value must be finite and non-negative (no NaN, Inf, negative or -0.0); any violation is fatal in download.sh, build.sh and verify.sh. Atmosphere-floor cells are genuine stored values and are kept. Every fetched snapshot must have at least 100,000 distinct values, a modal value covering at most 25% of cells, at most 50% of rows constant along phi and max/min-positive >= 1e3. Emitted samples must meet the stricter family floors listed in deterministic_notes. Duplicate samples are fatal."
conversion = "Fetch bytes [16777216 + dump * 6488064, +6488064) of the pinned file, which is exactly one C-order (192, 128, 66) F32LE slab of /t0_fields/density, and write it unchanged as one raw little-endian float32 sample with phi varying fastest. Index min/max are taken from the stored float32 values."
numeric_kind = "float"
bit_width = 32
endianness = "little"
sample_format = "raw homogeneous little-endian float32 3-D density volume, C order"
sample_geometry = "log_spherical_grid_volume_log_r_by_theta_by_phi"
sample_rank = 3
sample_axes = ["log_r", "theta", "phi"]
natural_record_kind = "nubhlight_saved_simulation_dump_density_volume"
sample_count = 54
total_size_bytes = 350355456
output_path = "samples/the_well_post_neutron_star_merger_density_f32/post_neutron_star_merger_density_f32/"
