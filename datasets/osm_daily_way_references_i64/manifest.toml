[[series]]
id = "osm_way_node_reference_i64"
description = "Ordered node references forming edited OpenStreetMap ways."
semantic_meaning = "Node identifiers referenced by way geometry/topology, preserving daily diff, way, and within-way order."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The OSM XML ref attribute is a signed 64-bit identifier domain; accepted samples must contain values above 2^32-1."
source_resources = ["osm_daily_diff_5066", "osm_daily_diff_5067", "osm_daily_diff_5068"]
source_format = "gzip-compressed OpenStreetMap change XML"
source_field = "osmChange/*/way/nd/@ref"
filtered_input_path = "filtered/osm_daily_way_references_i64/ingest_stats.json"
filtering = "Keep every positive in-range nd/@ref from created or modified ways, in source order; deleted ways without node lists contribute no values."
missing_value_policy = "Missing or malformed ref attributes fail the build; no references are dropped or imputed."
conversion = "Parse each decimal ref as signed int64 and write little-endian values in source order, one sample per daily replication diff."
numeric_kind = "int"
bit_width = 64
endianness = "little"
sample_format = "raw homogeneous signed int64 way-node reference array"
sample_geometry = "graph_topology_reference_stream"
sample_rank = 1
sample_axes = ["ordered_way_reference"]
natural_record_kind = "osm_daily_replication_diff_way_reference_stream"
