sample_index_path = "index/tcia_eclipse_rtdose_u32/samples.jsonl"
summary = "Validate three pinned CC BY 4.0 TCIA Eclipse RTDOSE objects and copy each complete native unsigned-32 Pixel Data field as one 3D volume."
deterministic_notes = "The downloader pins three SeriesInstanceUIDs from distinct studies and checks live collection, modality, body region, vendor/model, Eclipse description, license, object count, source size, ZIP structure, and embedded license. Build accepts only uncompressed Implicit VR Little Endian RT Dose Storage objects with MONOCHROME2, GY/PHYSICAL/PLAN semantics, one sample per voxel, BitsAllocated=BitsStored=32, HighBit=31, PixelRepresentation=0, positive DoseGridScaling, nondegenerate values, and an exact frames*rows*columns*4 Pixel Data length. Verification reparses all source objects and byte-compares every emitted sample."

[[series]]
id = "eclipse_physical_dose_grid_u32"
description = "Three-dimensional Eclipse physical radiotherapy dose grids."
semantic_meaning = "Per-voxel stored physical treatment-dose magnitude for a complete planned pancreatic radiotherapy volume; physical gray values equal stored uint32 values multiplied by the source object's DoseGridScaling."
role = "primary"
representation_class = "native_numeric"
representation_notes = "DICOM natively stores these RTDOSE Pixel Data fields as unsigned 32-bit little-endian values. The recipe preserves stored integers rather than applying the per-volume floating-point physical scaling."
source_resources = ["eclipse_rtdose_01", "eclipse_rtdose_02", "eclipse_rtdose_03"]
source_format = "DICOM RT Dose Storage, uncompressed Implicit VR Little Endian"
source_field = "Pixel Data (7FE0,0010), interpreted with DoseGridScaling (3004,000E)"
filtered_input_path = "filtered/tcia_eclipse_rtdose_u32/ingest_stats.json"
filtering = "Keep all voxels from the three pinned, validated RTDOSE objects as three separate natural 3D volumes."
missing_value_policy = "No voxels are dropped or imputed. Missing series, changed metadata/license/size, malformed archives, unsupported transfer syntax, wrong RTDOSE/vendor/model/anatomy/dose semantics, non-uint32 pixel representation, invalid scaling/geometry, truncated or trailing Pixel Data, or degenerate stored values fail the recipe."
conversion = "Remove the DICOM container and copy the complete Pixel Data value field byte-for-byte in source frame-row-column order; record DoseGridScaling as metadata without applying it."
numeric_kind = "uint"
bit_width = 32
endianness = "little"
sample_format = "raw homogeneous uint32 DICOM RTDOSE Pixel Data"
sample_geometry = "3d_dose_volume"
sample_rank = 3
sample_axes = ["z", "y", "x"]
natural_record_kind = "dicom_rtdose_object"
sample_count = 3
total_size_bytes = 14041140
output_path = "samples/tcia_eclipse_rtdose_u32/eclipse_physical_dose_grid_u32/"
