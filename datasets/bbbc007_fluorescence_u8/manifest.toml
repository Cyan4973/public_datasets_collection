missing_value_policy = "Unsafe or corrupt ZIP members, multiple TIFF images, unsupported TIFF tags or compression, malformed strips, non-uint8 samples, short or constant planes, insufficient coverage, hash drift, missing license evidence, or stale outputs fail the recipe. No pixels are dropped, filled, rescaled, normalized, color-converted, or quantized."
conversion = "Decode TIFF strips (compression 1 or PackBits 32773); concatenate rows in stored top-left order; for RGB, deinterleave the native chunky samples into R, G, and B planes; write each unique plane unchanged as raw uint8 bytes."
