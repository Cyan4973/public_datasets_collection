[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/zenodo_janus_solar_system_integer_phase_space_i64/samples.jsonl"
summary = "Fetch the 24 pinned SimulationArchive files, parse each REBOUND tagged header, and cut every body record of every 448-byte snapshot into its verbatim int64 position triple and velocity triple, giving one raw little-endian int64 position sample and one velocity sample per integration (shape [snapshots, 9, 3]); snapshot times go to an auxiliary float64 series."
deterministic_notes = "Zenodo identity, CC-BY-4.0 license id and the exact 24-file list (size + md5) are re-validated on every download. Each file must carry the banner 'REBOUND Binary File. Version: 3.2.2', N=9, integrator=JANUS(8), JANUS safe_mode=0, SASIZESNAPSHOT=448, SASIZEFIRST equal to the parsed header end (3340 in all files, read per file, never hard-coded), and (size - header) % 448 == 0. Snapshot times must be strictly increasing with spacing within 2*dt of the archive interval (misalignment guard). verify.sh re-hashes each source, re-walks snapshots and body records by stride and byte-compares every position, velocity and time sample, checks that re-interleaving position and velocity reproduces each file's native int block, rejects constant samples/columns and duplicate integrations per series, and checks manifest totals for all three series. Samples are ordered by file name."

[source_format_notes]
janus_scale_field = "Binary field 108 (REB_BINARY_FIELD_TYPE_JANUS_SCALE in the writing build, git b0f792d) = 1.0e16 in every file. In this pre-3.4.0 build a single scale multiplies both positions and velocities: int = (int64)(double * 1e16). Later releases split it into scale_pos/scale_vel (fields 113/114, divisors); those fields do not exist in these files."
units = "Simulation units G = 1 (field 1), lengths in AU, masses in solar masses (Sun m = 1), time in yr/(2*pi). Integer unit = 1e-16 AU for positions and 1e-16 AU/(yr/2pi) for velocities."
other_header_fields = "dt (field 3) = 0.01032145430337509; archive interval (field 47) = 32317.289318010637 (~5,143 yr); first snapshot t ~ 32317.3, last ~1.9e9 (~3.0e8 yr)."
frame = "JANUS integrates in the simulation's inertial frame; the Sun starts 0.0037 AU from the origin (barycentric-style setup), so coordinates are not heliocentric. The frame is not re-centred: in restart_0000 the Sun drifts linearly with the barycentre to ~(-0.42, 0.57, 0.15) AU by ~3e8 yr, while its velocity stays |v| < 6e-4."

[[series]]
id = "janus_solar_system_position_i64"
description = "JANUS integer position (x, y, z) of Sun, Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune at every SimulationArchive snapshot of one integration."
semantic_meaning = "Fixed-point Cartesian positions on the JANUS integer lattice, 1 unit = 1e-16 AU. These integers are the integrator's authoritative state: JANUS advances them with exact integer arithmetic, which is what makes it bit-wise reversible; the doubles are derived from them."
role = "primary"
representation_class = "native_numeric"
representation_notes = "Bytes are verbatim 24-byte slices (x, y, z) of each body's native 48-byte little-endian int64 reb_particle_int record; no rescaling or reordering within a triple. The complementary velocity triples form the other primary series; re-interleaving the two reproduces the archive block byte-for-byte (checked by verify.sh)."
source_resources = ["restart_0000", "restart_0001", "restart_0002", "restart_0003", "restart_0004", "restart_0005", "restart_0006", "restart_0007", "restart_0008", "restart_0009", "restart_0010", "restart_0011", "restart_0012", "restart_0013", "restart_0014", "restart_0015", "restart_0016", "restart_0017", "restart_0018", "restart_0019", "restart_0020", "restart_0021", "restart_0022", "restart_0023"]
