summary = "Download seven pinned GWOSC O3b H1 4 kHz bulk HDF5 files, decode /strain/Strain (deflate + Fletcher-32 chunks) with a pure-stdlib HDF5 reader, and emit each file's complete 16,777,216-value strain record as one raw little-endian float64 sample."
deterministic_notes = "File selection (discover.sh, author time): over the O3b GPS span 1256655618-1269363618, split into 7 equal bins, take the 4096-s archive slot nearest each bin centre that lies wholly inside one H1_DATA segment and whose GWOSC detail reports dutycycle 100 and nans_fraction 0. Every file is validated in download, build and verify with identical checks: exact size; HDF5 superblock v0, v1 object headers, v1 chunk B-tree; meta StrainChannel/Detector/FrameType/GPSstart/Duration; strain shape, dtype and filters [deflate, fletcher32]; Npoints/Xspacing/Xstart attributes; per-chunk Fletcher-32; finite values, no all-zero or repeated chunk; DQ DATA bit in all 4096 seconds; min/max equal to GWOSC's published values. verify also byte-compares every sample against a fresh decode and recomputes index fields. Floors: 7 samples x 16,777,216 values, 939,524,096 bytes."

[[series]]
id = "h1_o3b_strain_4khz_f64"
description = "LIGO Hanford calibrated, 60-Hz-subtracted strain h(t) at 4096 Hz, one complete 4096-s GWOSC archive record per sample."
semantic_meaning = "Dimensionless calibrated gravitational-wave strain of the LIGO Hanford 4-km interferometer during O3b science-mode operation (channel H1:DCS-CALIB_STRAIN_CLEAN_SUB60HZ_C01, downsampled by GWOSC to 4096 Hz). Values are about 1e-20 to 1e-18: colored detector noise dominated by low frequencies, with spectral lines."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The HDF5 dataset is IEEE binary64 little-endian. Values are written exactly as stored, with no rescaling, narrowing or reordering."
source_resources = ["o3b_h1_4khz_bulk_files"]
source_format = "GWOSC bulk strain HDF5 (superblock v0, chunked 8192-value deflate+fletcher32 float64 dataset)"
source_field = "/strain/Strain (Npoints 16777216, Xspacing 1/4096 s, Xstart = file GPS start)"
filtered_input_path = "filtered/gwosc_o3b_h1_bulk_strain_f64/ingest_stats.json"
filtering = "H1 only, O3b_4KHZ_R1 only (no L1/V1, no 16 kHz release). Seven files spread evenly over O3b, each wholly inside an H1_DATA segment. Within a file nothing is dropped: all 16,777,216 values in time order."
missing_value_policy = "No missing values are allowed. Every second must carry the DQ DATA bit and every value must be finite. A NaN or inf value, an all-zero chunk, a repeated chunk, a Fletcher-32 mismatch or any metadata mismatch is fatal in download, build and verify alike. Nothing is imputed or dropped."
conversion = "Walk the v1 chunk B-tree of /strain/Strain. For each 8192-value chunk in element order: verify the trailing little-endian Fletcher-32 over the stored bytes, inflate (zlib) to exactly 65,536 bytes, and append. Output = the 134,217,728 logical bytes of the dataset (float64 LE), one file per source HDF5 file."
numeric_kind = "float"
bit_width = 64
endianness = "little"
