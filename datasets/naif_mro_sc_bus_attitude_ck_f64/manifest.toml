notes = "Whole kernels are 208-256 MB each (about 2.7 GB for 11), so only the selected segments are fetched. All 44 per-segment SHA-256 values are pinned in the sources.tsv segment_sha256 column (2 measured at authoring time on both hosts, 42 from the first realized download; the 2 authoring-time pins matched it) and are enforced by download.sh, build.sh and verify.sh."

