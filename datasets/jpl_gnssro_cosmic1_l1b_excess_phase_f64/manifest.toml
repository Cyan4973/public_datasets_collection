[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/jpl_gnssro_cosmic1_l1b_excess_phase_f64/samples.jsonl"
summary = "Validate 2,393 pinned JPL COSMIC-1 v2.6 L1b NetCDF4 files, locate the GPS L1 row of excess_phase through phase_observation_code and carrier_frequency, strip leading/trailing _FillValue, and emit the remaining native little-endian float64 values of each occultation as one sample."
deterministic_notes = "sources.tsv pins keys, sizes and S3 MD5 ETags (list SHA-256 enforced). Every file must carry mission=cosmic1, institution=jpl, institution_version=v2.6, VersionID=2.0, ShortName=gnssro_cosmic1_jpl_l1b, ProcessingLevel=1B, data_use_license=CC BY 4.0 and GranuleID equal to its key, or the recipe fails. A pure-stdlib HDF5 reader (scripts/h5lite.py) verifies every Jenkins-lookup3 metadata checksum; excess_phase must be the exact IEEE little-endian f8 datatype with contiguous layout and no filter pipeline. Samples are written in sources.tsv order under samples/<id>/<series>/<year>/. verify.sh re-derives every sample through the creation-order link index with separate array-based code, byte-compares, re-reads each sample to reject fill, NaN/inf, |x| >= 1e9, fewer than 1,000 values, constant or low-diversity series and exact duplicates, recomputes the drop counts and aggregate SHA-256, requires all ten years to be present, and checks manifest totals. A synthetic HDF5 self-test (scripts/selftest_gnssro.py) runs first in build and verify."

[[series]]
id = "cosmic1_jpl_l1b_l1_excess_phase_f64"
description = "Calibrated GPS L1 excess phase of one COSMIC-1 radio-occultation sounding, JPL processing v2.6."
semantic_meaning = "Excess phase, the carrier phase path in excess of the vacuum optical path between the GPS transmitter and the COSMIC-1 receiver, in metres, sampled at 50 Hz (open-loop tracking) over one atmospheric limb occultation of about 1-2.5 minutes. The profile is a smooth ramp of up to several thousand metres as the ray descends into or rises out of the troposphere, with fine atmospheric and tracking structure superimposed."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The NetCDF4 variable is stored as IEEE-754 little-endian float64; emitted bytes are copied unchanged from the contiguous raw-data extent of the L1 row (no rescaling, differencing or re-encoding)."
source_resources = ["cosmic1_jpl_l1b_pinned_selection"]
source_format = "NetCDF4 (HDF5) GNSS-RO L1b calibratedPhase file, AWS RO archive format version 2.0"
source_field = "excess_phase (signal, time), the row whose phase_observation_code starts with L1 and whose carrier_frequency is 1575.42 MHz"
filtered_input_path = "filtered/jpl_gnssro_cosmic1_l1b_excess_phase_f64/ingest_stats.json"
filtering = "One sample per pinned occultation file. Only the GPS L1 row is kept; L2 rows (semi-codeless L2W or L2C/L2X, often with long fill runs) and all other variables are excluded. A sounding is dropped (counted by reason in ingest_stats.json) if it has no unique L1 row at 1575.42 MHz, the L1 row is entirely fill, the trimmed L1 span contains interior fill/NaN, is shorter than 1,000 values or is constant, the time axis over the span is not monotonic 50 Hz (median step outside 0.0199-0.0201 s), or excess_phase is not contiguous unfiltered little-endian f8."
missing_value_policy = "_FillValue -9.99e20 and non-finite values are missing. Leading and trailing missing values of the L1 row are stripped; a sounding with any missing value inside the remaining span is dropped rather than gap-concatenated. No value is imputed or altered; verify.sh asserts no fill, NaN or inf remains in any sample."
conversion = "Parse the HDF5 metadata with scripts/h5lite.py, resolve excess_phase, phase_observation_code, carrier_frequency and time through the root group's dense link index, select the L1 row, and copy bytes [addr + 8*(row*ntimes + start), addr + 8*(row*ntimes + end)) of the contiguous excess_phase extent to one sample file in time order."
numeric_kind = "float"
bit_width = 64
endianness = "little"
sample_format = "raw homogeneous little-endian float64 excess-phase time series"
sample_geometry = "occultation_time_series_1d"
sample_rank = 1
sample_axes = ["time_50hz"]
natural_record_kind = "gnss_radio_occultation_sounding_l1_excess_phase_profile"
