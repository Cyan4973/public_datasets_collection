[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/cmip6_cesm2_historical_daily_precip_f32/samples.jsonl"
summary = "Download the single pinned 1940-1949 CESM2 historical r1i1p1f1 daily pr NetCDF4 file, decode the pr variable with a pure-stdlib HDF5 reader (v1 B-tree chunk index, deflate + 4-byte unshuffle), and emit each of the 3650 daily 192x288 float32 fields unchanged as one raw little-endian sample."
deterministic_notes = "Single pinned object (size + multipart-MD5 ETag). The HDF5 reader verifies the lookup3 checksum of every metadata block it touches (OHDR/OCHK object headers, fractal heap, v2 B-trees). Build and verify require: global attributes source_id CESM2, institution_id NCAR, experiment_id historical, activity_id CMIP, variant_label r1i1p1f1, variable_id pr, table_id day, frequency day, grid_label gn, mip_era CMIP6, and the pinned tracking_id. pr must be shape (3650,192,288), little-endian IEEE float32, chunked (1,192,288) with the pipeline shuffle(4)+deflate exactly, units kg m-2 s-1, standard_name precipitation_flux, cell_methods 'area: time: mean', and _FillValue/missing_value 1e20. The time axis must be days since 0001-01-01, noleap calendar, with time[i] = 707735 + i (1940-01-01 .. 1949-12-31 in the file's time coordinate) and time_bnds[i] = (time[i]-1, time[i]). lat must run from -90 to 90 (192 points) and lon from 0 to 358.75 in 1.25 degree steps. The chunk index must hold exactly one chunk per time step with filter mask 0. Samples are written in time order and named by the noleap date of the time coordinate. Build resolves pr through the name index; verify resolves it through the creation-order index, byte-compares every sample against a fresh decode, and checks 11 spot days with an independent per-element unshuffle. It also recomputes all statistics from bit patterns and sorted values and checks the manifest totals. A synthetic HDF5 self-test (scripts/selftest.py: superblock v0, shuffle+deflate chunks, 12 rejection cases) runs before build and verify. Floors: 3650 samples of 55,296 values each (median 55,296); 201,830,400 values; 807,321,600 bytes."

[[series]]
id = "pr_day_f32"
description = "Daily-mean global precipitation flux from the CESM2 coupled climate model (CMIP6 historical, r1i1p1f1), 1940-1949."
semantic_meaning = "Surface precipitation flux (liquid plus solid, large-scale plus convective) in kg m-2 s-1, averaged over one model day, on the CESM2 native 0.9x1.25 degree finite-volume lat-lon grid (192 latitudes from -90 to 90, 288 longitudes from 0 to 358.75 east). Values are the model's float32 output as published to CMIP6."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The NetCDF4 variable pr is stored as little-endian IEEE float32 (HDF5 floating-point class, size 4). The recipe inflates each chunk, reverses the 4-byte shuffle and writes the stored float32 values unchanged. There is no scaling, masking, regridding, thinning or remapping."
source_resources = ["pr_day_1940_1949"]
source_format = "NetCDF4/HDF5 (superblock v0, version-2 object headers); variable chunked one time step per chunk, shuffle+deflate, indexed by a version-1 B-tree"
source_field = "pr (float32, dims time=3650 x lat=192 x lon=288)"
filtered_input_path = "filtered/cmip6_cesm2_historical_daily_precip_f32/build_summary.json"
filtering = "Keep all 3650 time steps of the one pinned decade file, and only its pr variable. No days are dropped. Excluded: other decades of the same run, other ensemble members, other models, experiments and variables, and coordinate and bounds variables (they are validated but not emitted)."
missing_value_policy = "The source declares _FillValue = missing_value = 1e20. The CESM2 atmosphere has no masked cells, so none are expected. Any 1e20 sentinel, any value of magnitude 1e19 or more, any NaN or Inf, a field with fewer than 1000 distinct values or no positive value, a missing or duplicate chunk, a nonzero chunk filter mask, or a chunk that does not inflate to exactly 221,184 bytes is fatal in both build and verify. Exact zeros (about 1% of cells, for example dry subtropical cells) and any tiny negative values the model emits are genuine model output and are kept verbatim. Their counts are recorded per sample in the index (zero_values, negative_values)."
conversion = "Resolve root link 'pr', read Dataspace, Datatype, Fill Value, Filter Pipeline and Layout v3 chunked (1,192,288,4). Walk the version-1 B-tree to get each chunk's address and stored size. zlib-inflate each chunk, reverse the HDF5 byte shuffle (element size 4) and write the 55,296 float32 values in stored row-major (lat, lon) order, one raw little-endian file per time step, named pr_day_<YYYYMMDD>.bin from the noleap date of time[i]. Index min/max are computed from the stored float32 values."
numeric_kind = "float"
bit_width = 32
endianness = "little"
sample_format = "raw homogeneous float32 precipitation-flux grid"
sample_geometry = "192x288_cesm2_fv_0.9x1.25_lat_lon_grid"
sample_rank = 2
sample_axes = ["lat", "lon"]
natural_record_kind = "cmip6_model_daily_mean_global_field_time_step"
sample_count = 3650
total_size_bytes = 807321600
output_path = "samples/cmip6_cesm2_historical_daily_precip_f32/pr_day_f32/"
