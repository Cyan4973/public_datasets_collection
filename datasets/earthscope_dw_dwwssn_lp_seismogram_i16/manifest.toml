[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/earthscope_dw_dwwssn_lp_seismogram_i16/samples.jsonl"
summary = "Fetch 651 pinned DW LHZ station-days of DWWSSN-encoded miniSEED from EarthScope dataselect, decode with a self-tested pure-Python reader, and emit one little-endian int16 sample (nominally 86,400 values) per station-day that is contiguous, complete and not dominated by fill, clipping, a constant value or step noise. Realized: 512 of 651 plan station-days, 14 stations, 1980-1993, 88,473,738 bytes."
deterministic_notes = "plan.tsv (station, UTC day) was resolved once by discover.sh / scripts/discover.py on 2026-10-14: from the DW channel inventory keep the LHZ epochs with SensorDescription 'Sprengnether Series 201 S-5007-V Seismometer', Scale 5.0E8, 1 sps (14 stations); split each station's full-day epoch span into 96 strata and pick one crc32(station:k)-offset day per stratum; probe three 10-minute windows per candidate (03:00, 12:00, 21:00 UTC) with fdsnws-dataselect POSTs (48 windows per POST); a candidate is present if record spans cover >= 570 of 600 s in every window; take 48 present days per station evenly spaced in time (BDF had 41 and LEM 34 present). 948 of 1,344 candidates were present; plan = 651 rows. Build and verify use only local files, process plan rows in order, and name samples DW.<sta>..LHZ.<YYYYMMDD>.i16. Every record must be DW.<sta>..LHZ, 1 sps, blockette-1000 encoding 32 and overlap the requested day (records starting before 00:00 or at/after the next 00:00 are dropped); records are sorted by start, exact duplicates dropped, and must chain within 1 sample. scripts/selftest_mseed.py (independent synthetic DWWSSN record encoder: both word orders and header byte orders, int16 extremes, blockette 1001, dedup, gap/overlap/conflict, out-of-day and wrong-rate records, wrong encoding, missing blockette 1000, truncated payload) runs before every download validation, build and verify. verify.sh also re-decodes each day with an independent minimal fixed-layout record decoder that does not use scripts/mseed.py. Index rows carry min/max, distinct values, mode value and fraction, clip_count (|v| >= 32767), flat_run_samples, std, max and median |step|, source record count, max chain timing deviation and sha256; filtered/<id>/ingest_stats.json lists every skipped station-day with its reason and an aggregate hash."

[[series]]
id = "dwwssn_lhz_sprengnether_counts_i16"
description = "Raw long-period vertical (LHZ, 1 sps) output of the DWWSSN Sprengnether S-5007-V seismometers at 14 USGS ASL stations, one complete UTC day per sample, native 16-bit digitizer counts."
semantic_meaning = "Each value is one signed 16-bit DWWSSN digitizer count of the long-period vertical ground-motion channel, sampled once per second (nominal sensitivity 5.0E8 counts per metre at 0.04 Hz per the station inventory). The signal is microseism background and teleseismic/regional earthquakes, plus brief large excursions that most probed days share (day extremes of roughly +-15,000-17,500 counts against a standard deviation of a few hundred, consistent with routine calibration pulses; not individually verified) and occasional full-scale clipping at +-32,767 on large events."
role = "primary"
representation_class = "native_numeric"
representation_notes = "miniSEED data encoding 32 (DWWSSN) stores each sample as a big-endian two's-complement int16; values are decoded losslessly and written unchanged as little-endian int16. No scaling, filtering or instrument correction."
source_resources = ["dw_lhz_station_days", "dw_channel_inventory"]
source_format = "miniSEED 2 data records (DWWSSN 16-bit integers, encoding 32, 4096-byte, big-endian) from fdsnws-dataselect"
source_field = "decoded integer samples of channel DW.<station>..LHZ (Sprengnether S-5007-V long-period vertical)"
filtered_input_path = "filtered/earthscope_dw_dwwssn_lp_seismogram_i16/ingest_stats.json"
filtering = "Keep only network DW, blank location, channel LHZ at 1 sps, for plan days strictly inside a Sprengnether Series 201 S-5007-V epoch at Scale 5.0E8 (stations AFI, ALQ, BDF, COL, GDH, HON, KBS, KEV, LEM, LON, SCP, SLR, TAU, TOL; 1980-10..1993-10). Excluded: the Geotech SL-210 stations (BER, CMB, JAS, JAS1), the Streckeisen STS-1 epochs that replaced the Sprengnether at AFI/COL/KEV/TOL in 1987 (different transfer function and much smaller counts, about +-60 on a quiet day), CMB's Guralp CMG3, the SCP 1990-12-07..1991-02-20 epoch logged at double gain (1.0E9), the horizontals LHE/LHN and all short-period/other channels. A station-day is emitted only if its records form one contiguous chain (each record starts within 1 sample of the previous record's nominal end; exact duplicates dropped; conflicting duplicates, gaps or overlaps reject the day), it holds 85,536..86,410 samples, runs of >= 60 identical consecutive samples (digitizer fill, typically the value 128) cover at most 1% of it, at most 5% of its samples sit at |v| >= 32767, its most frequent value covers at most 50% of it, it takes at least 64 distinct values, and its median absolute first difference is at most 128 counts (accepted days 0..53, median 5; three HON 1984-05..07 days with a broadband oscillation, median |step| 220..324 and std ~7,000, are skipped as a malfunction regime); otherwise the whole day is skipped and logged (never split, spliced, filled or concatenated across days)."
missing_value_policy = "DWWSSN miniSEED has no inline missing-value sentinel; missing data appear either as time gaps between records or as long runs of a constant fill value (128 in all probed cases). Days with a gap, overlap, conflicting duplicate, short coverage or more than 1% of samples in >= 60-sample constant runs are skipped whole and logged in ingest_stats.json; shorter constant runs are kept verbatim and counted in the index (flat_run_samples). Full-scale clipping (+-32767) and calibration pulses are genuine recorder output and are kept (clip_count recorded; days with more than 5% clipped samples are skipped as mostly clipped). Structurally invalid miniSEED (bad header, missing blockette 1000, non-32 encoding, truncated payload, wrong stream identity, wrong sample rate, record not overlapping the requested day) is fatal."
conversion = "Decode each miniSEED record (header byte order from BTIME plausibility, record length/encoding/word order from blockette 1000, BTIME + time correction + blockette 1001), unpack nsamples big-endian int16 values after the data offset, sort the day's records by start time, drop exact duplicates, require a contiguous chain, concatenate the samples in time order and write them as little-endian int16 (2 bytes per value, 172,800 bytes per full day)."
numeric_kind = "int"
bit_width = 16
endianness = "little"
sample_format = "raw homogeneous little-endian int16 array"
sample_geometry = "1hz_station_day_time_series"
sample_rank = 1
sample_axes = ["second_within_utc_day"]
natural_record_kind = "seismometer_channel_utc_day"
sample_count = 512
total_size_bytes = 88473738
output_path = "samples/earthscope_dw_dwwssn_lp_seismogram_i16/dwwssn_lhz_sprengnether_counts_i16/"
