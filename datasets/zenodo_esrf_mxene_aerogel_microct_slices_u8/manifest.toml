[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/zenodo_esrf_mxene_aerogel_microct_slices_u8/samples.jsonl"
summary = "Range-fetch 20 evenly spaced reconstructed axial slices (5% end margin) from each of the 11 ESRF ID15 MXene aerogel micro-CT volumes, then write each 1381x1381 uint8 slice unchanged as its own sample (220 samples, 419,575,420 bytes)."
deterministic_notes = "Fixed records, files, exact .raw sizes, MD5s and descriptor SHA-256s (volumes.tsv). Slice plan per volume of Z slices: margin m = ceil(0.05*Z), z_k = m + round_half_up(k*(Z-1-2m)/19) for k = 0..19; download.sh computes it in bash integer arithmetic, build in Python integer arithmetic, verify with exact fractions. download.sh requires HTTP 206 with the exact Content-Range 'bytes start-end/<pinned size>' and exactly 1,907,161 bytes per slice, rejects degenerate slices, and enforces the per-slice SHA-256 pins in slice_sha256.tsv when present (always writing realized values to downloads/<id>/slice_sha256.tsv). Degeneracy rules, identical in download, build and verify: at least 64 distinct values, modal value at most 10% of voxels, no constant voxel row or column, slice mean grey level within [72, 104], no duplicate payloads. Samples are ordered by strain then z. verify.sh re-parses the descriptors, re-derives the plan, byte-compares every sample with its downloaded slice, checks the pins, recomputes every index field and statistic, checks that the sample directory holds exactly the planned files, and checks manifest sample_count and total_size_bytes. Per-slice SHA-256 pins come from the verified 2026-10-06 autocollect download (all 220 slices 206 on the first attempt); the SHA-256 over '<sample name>\\t<sample sha256>' lines in index order is pinned in verify (eff23b6f7a8b4102e9ccea6c767e81e1273477d89bc17080c641acb20bbbe0d3)."

[[series]]
id = "mxene_aerogel_microct_slice_u8"
description = "Reconstructed synchrotron X-ray micro-CT axial slices (1381x1381 uint8, 3.1 um voxels) of one freeze-cast lamellar Ti3C2Tx MXene aerogel at 11 compressive-strain states."
semantic_meaning = "Each value is the authors' published 8-bit grey level of one 3.1 x 3.1 x 3.1 um voxel of a tomographic reconstruction (X-ray attenuation) recorded at ESRF beamline ID15: bright thin sheets are the MXene lamellae, the mid-grey background is pore space plus reconstruction noise. A faint circle marks the edge of the reconstructed field of view; the sample is wider than that field, so lamellar texture continues to the square edges. Slices from the 11 volumes show the same specimen at 0, 5, ..., 50% applied compressive strain."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The authors exported each reconstructed volume as a headerless 8-bit little-endian raw stack (lattice 1381 x 1381 x Z, x fastest, then y, then z) and chose the 8-bit grey-level windowing of the reconstruction per volume; the mapping to attenuation coefficient is not published. Values are emitted exactly as published: no rescaling, re-windowing, cropping, masking or filtering. Interior slice means sit near 85-90 in every volume."
source_resources = ["volume_descriptors", "raw_00pct_slices", "raw_05pct_slices", "raw_10pct_slices", "raw_15pct_slices", "raw_20pct_slices", "raw_25pct_slices", "raw_30pct_slices", "raw_35pct_slices", "raw_40pct_slices", "raw_45pct_slices", "raw_50pct_slices"]
source_format = "Headerless 8-bit little-endian raw voxel volume (Fiji 'Import > Raw' layout: width 1381, height 1381, Z images), geometry from the per-volume .txt descriptor"
source_field = "Reconstructed voxel grey level (uint8) of axial slice z: the 1381x1381 image at byte offset z*1907161"
filtered_input_path = "filtered/zenodo_esrf_mxene_aerogel_microct_slices_u8/ingest_stats.json"
filtering = "All 11 volumes; per volume 20 axial slices evenly spaced between ceil(5% of Z) and Z-1-ceil(5% of Z), i.e. 83-150 slices (0.26-0.47 mm) apart. The end zones are excluded because their slices are not aerogel interior: probes show the slice mean rising from about 85-90 to 101-113 within the last 1-3% of every volume (z = 0 reads 92-106 in 10 of 11 volumes), and the final slice of the 50% volume is a uniform disc with ring artefacts and no aerogel texture (most likely the compression platen or the reconstruction edge). Every voxel of each kept slice is emitted."
missing_value_policy = "uint8 reconstructed grey levels have no missing-value sentinel. Every voxel is kept as published, including 0 and 255, which are the clipped extremes of the authors' windowing. Fatal, identically in download, build and verify: a wrong Content-Range, size or pinned SHA-256; fewer than 64 distinct values; a modal value above 10% of voxels; a constant voxel row or column; a slice mean outside [72, 104]; a duplicate slice payload. Nothing is dropped or imputed."
conversion = "Each kept slice is the byte range [z*1907161, (z+1)*1907161) of the .raw stack, i.e. 1381 rows of 1381 uint8 voxels (y-major, x fastest), written unchanged as one sample named strainNNpct_zZZZZ.bin; byte order is irrelevant for 8-bit values."
numeric_kind = "uint"
bit_width = 8
endianness = "little"
sample_format = "raw homogeneous uint8 1381x1381 reconstructed CT slice, row-major"
sample_geometry = "tomographic_reconstruction_axial_slice_2d"
sample_rank = 2
sample_shape = [1381, 1381]
sample_axes = ["voxel_y", "voxel_x"]
natural_record_kind = "reconstructed_axial_slice"
sample_count = 220
total_size_bytes = 419575420
output_path = "samples/zenodo_esrf_mxene_aerogel_microct_slices_u8/mxene_aerogel_microct_slice_u8/"
