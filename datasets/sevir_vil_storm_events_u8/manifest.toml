type = "other"
version = "Six objects pinned by size and S3 ETag in containers.tsv (Last-Modified 2020-04-15)"
access = "HTTP Range requests only, each with If-Match on the pinned ETag: metadata head bytes [0, 2048), metadata tail [2048 + N*7225344, EOF), and one 7,225,344-byte range per selected event at offset 2048 + file_index*7225344. Whole objects are never fetched."
size_bytes = 433584316
sha256 = ""
local_path = "downloads/sevir_vil_storm_events_u8/"
notes = "Containers: SEVIR_VIL_STORMEVENTS_{2017,2018,2019}_{0101_0630,0701_1231}.h5 (1,394,497,418 / 4,949,371,586 / 5,729,709,818 / 6,119,878,934 / 6,148,780,350 / 3,908,920,610 bytes; N = 193 / 685 / 793 / 847 / 851 / 541 events). size_bytes here is the fetched total: 6 x 2,048 head + 51,388 tail + 60 x 7,225,344 event bytes. Per-event SHA-256 pins live in event_sha256.tsv (recorded from the first driver download on 2026-10-05) and are enforced by download, build and verify; there is no single checksum for this multi-range resource."

[local_paths]
downloads = "downloads/sevir_vil_storm_events_u8/"
