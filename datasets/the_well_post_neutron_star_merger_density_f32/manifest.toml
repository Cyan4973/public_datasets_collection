citation = "Ohana, McCabe, Meyer et al., The Well: a Large-Scale Collection of Diverse Physics Simulations for Machine Learning, arXiv:2412.00568 (2024); Miller, Ryan and Dolence, nubhlight: radiation GRMHD for neutrino-driven accretion flows, ApJS 241, 30 (2019); plus the per-scenario papers listed in the dataset card (Miller et al. 2019 PRD 100 023008; Miller et al. 2020 ApJ 902 66; Curtis et al. 2023 ApJL 945 L13; Lund et al. 2024 ApJ 964 111)."
notes = "The dataset card of the exact pinned repository revision declares `license: cc-by-4.0` in its YAML front matter, and the Hugging Face API reports cardData.license = cc-by-4.0 and the tag license:cc-by-4.0; download.sh re-checks all three live. Attribute The Well and the nubhlight papers."

