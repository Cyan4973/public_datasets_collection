summary = "Range-fetch every 8th scan row of NORDIF EBSD maps II and III, then write each 240x240 uint8 Kikuchi pattern unchanged as its own sample."
deterministic_notes = "Fixed record, files, sizes, MD5s, Setting.txt SHA-256s, row stride 8 (rows 0..56 of each map), and per-row SHA-256 pins. download.sh checks 206 status, exact Content-Range and length per row, and rejects rows that contain a pattern with fewer than 16 distinct values. Build and verify re-parse [Acquisition settings] and [Area] from Setting.txt and require 240x240 and a grid that tiles the .dat size exactly. Samples are written in map, scan-row, scan-column order. verify.sh byte-compares every sample with its source slice and rejects constant or degenerate patterns, wrong sizes, and duplicate rates above 0.5%. Realized aggregate SHA-256 of all samples in index order: e66e79ec7451768f4747d37ca61a13cad123b005f575bc81985ee27f13d4ec67."

[[series]]
id = "ebsd_kikuchi_pattern_u8"
description = "Raw 8-bit EBSD Kikuchi patterns (240x240) from a NORDIF UF-1100 detector, one per SEM scan point."
semantic_meaning = "Electron backscatter diffraction detector intensity (8-bit digital number) at each pixel of the 240x240 phosphor-screen camera frame recorded at one beam position on a tilted (70 deg) cold-metal-transfer Al-steel weld cross-section; Kikuchi bands on a smooth backscatter background, Hitachi SU-6600 at 20 kV, acquisition gain 10, 20 fps, 49.95 ms exposure."
role = "primary"
representation_class = "native_numeric"
representation_notes = "NORDIF Pattern.dat stores each pattern as 57,600 uint8 detector values in row-major order with no header; patterns follow the scan raster (row by row, x fastest). Values are emitted exactly as stored; nothing is rescaled, background-corrected, or binned."
source_resources = ["ii_setting", "iii_setting", "ii_ebsd_rows", "iii_ebsd_rows"]
source_format = "NORDIF Pattern.dat (EBSD.dat): headerless raw uint8 Kikuchi pattern stack in scan-raster order, geometry from the Setting.txt [Acquisition settings] Resolution and [Area] Number of samples"
source_field = "Kikuchi pattern detector intensity (uint8 DN per 240x240 pixel)"
filtered_input_path = "filtered/zenodo_nordif_ebsd_kikuchi_patterns_u8/ingest_stats.json"
filtering = "Maps II (59x208 scan points) and III (64x323) only; scan rows 0, 8, 16, 24, 32, 40, 48, 56 of each map; every scan point of each kept row (II 8x208 = 1,664 patterns, III 8x323 = 2,584 patterns). Map I (truncated .dat), calibration/background/acquisition BMPs, and SEM area images are not emitted."
missing_value_policy = "uint8 detector frames have no missing-value sentinel. Every value is kept as stored, including 255 (2.35e-5 of values, from fixed detector hot pixels such as (117,217), which is 255 in every pattern) and 0 (none observed). A constant pattern, a pattern with fewer than 16 distinct values, a short row, a Content-Range or checksum mismatch, or byte-identical duplicates above 0.5% of patterns fail the recipe; nothing is dropped or imputed."
conversion = "Split each downloaded scan row into C consecutive 57,600-byte patterns (C = 208 for II, 323 for III) and write each pattern unchanged as one 240x240 uint8 sample named <map>_r<row>_c<col>.bin; byte order is irrelevant for 8-bit values."
