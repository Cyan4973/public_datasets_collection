summary = "Fetch 97 pinned GRACE-FO L1B RL04 ACX2 daily tarballs. Stream each through Python tarfile, keep only the ACH1B_<date>_D_04.txt member in memory, check every member's md5 against the in-tarball checksum, parse the YAML header and the whitespace-separated rows, and emit the lin_accl_x/y/z columns as one row-major little-endian float64 [records, 3] sample per day."
deterministic_notes = "Selection (scripts/select_days.py, documented by discover.sh): every ACX2 tarball dated 2023-01-01..2026-06-30 (1,155 candidates), sorted by date, every 12th starting with the first. Result: 97 dates, 2023-01-01..2026-06-28, with 21 in 2023, 30 in 2024, 31 in 2025 and 15 in 2026. Build runs a synthetic tar/ACH1B self-test first. It then requires, for every file: the ACH1B member present; every member's md5 equal to the checksum member, with the listing matching the member set; title 'GRACE-FO Level-1B Hybrid Transplant Accelerometer Data'; platform GRACE D; product_version 04; id 10.5067/GFJPL-L1B04; the NASA license URL; ACC1A input ACH1A_<same date>; and software_version V04.10.2020-11-09-82-gd120e-dirty. Column positions come from the header's variables list and are cross-checked against each 'Nth column' comment, with no hard-coded indices. Rows must match the declared column count, the 1 s gps_time lattice of the UTC day, and num_records. Values must be finite with |a| < 1e-4 m/s^2. Each component must be nonconstant and sample hashes distinct. The index records stored-dtype per-component and global min/max, distinct counts, qualflg-nonzero and ang_accl-nonzero row counts, missing seconds, the member md5 and the tar member list. Verify re-reads each tarball through random-access tarfile, re-checks the md5, re-parses rows with a regex and packs with struct.pack('<3d'), byte-compares with the stored sample, and re-checks the index, manifest counts and floors."

[[series]]
id = "gracefo_ach1b_lin_accl_srf_f64"
description = "Daily GRACE-FO 2 (GRACE D) hybrid-transplant 1 Hz linear accelerations in the science reference frame."
semantic_meaning = "Non-gravitational linear acceleration of the GRACE D spacecraft, in m/s^2, along the X (roughly along-track, toward the partner satellite), Y (roughly cross-track) and Z (roughly radial) axes of the science reference frame, at 1 Hz. The sources are atmospheric drag, solar radiation pressure, Earth albedo/IR and thruster events, about 1e-8..3e-7 m/s^2 on X and Z, plus a ~1.05e-5 m/s^2 instrument bias on Y. JPL publishes it as the Level-1B RL04 product ACH1B, 'GRACE-FO Level-1B Hybrid Transplant Accelerometer Data', summarised in the file as '1-Hz linear accelerations derived from a hybrid transplant in SRF'. GRACE D's own SuperSTAR accelerometer degraded soon after launch. JPL therefore derives the GRACE D accelerations by transplanting GRACE C accelerometer data to GRACE D and combining them with GRACE D-specific information. The exact hybrid algorithm is documented by JPL, not in the file; the header input lineage is ACC1A<-ACH1A. ACH1B is the official GRACE D accelerometer input to gravity-field processing. One sample is one complete UTC day."
role = "primary"
representation_class = "derived_operational_numeric"
representation_notes = "ACH1B is a pinned, machine-facing JPL Level-1B operational product (DOI 10.5067/GFJPL-L1B04, RL04) consumed as-is by gravity-field processing centres. It is not a local transform. The recipe only parses the published ASCII decimal strings, printed with up to 16 significant digits, with Python float() (correctly rounded) into IEEE-754 binary64. There is no rescaling, filtering or resampling. It is 'derived' only because the upstream product is a hybrid transplant rather than raw GRACE D instrument output. Probe evidence on 7 real days: every component has 86,400 distinct values per day, and no stored value is exactly representable in float32."
source_resources = ["acx2_daily_selection"]
source_format = "JPL GRACE-FO Level-1B RL04 ASCII text (YAML header terminated by '# End of YAML header', then whitespace-separated rows), member ACH1B_<YYYY-MM-DD>_D_04.txt of the daily gzip tar gracefo_1B_<YYYY-MM-DD>_RL04.ascii.ACX2.tgz"
source_field = "ACH1B variables lin_accl_x, lin_accl_y, lin_accl_z (3rd-5th columns per the header variables list; units m/s2; coverage_content_type physicalMeasurement)"
filtered_input_path = "filtered/gracefo_l1b_ach1b_transplant_accelerometer_f64/ingest_stats.json"
filtering = "Keep only lin_accl_x/y/z of the ACH1B member. Excluded: the other tar members (AC01B and AC11B thruster-model products for GRACE C and D, ACU1B, the .rpt reports), all discarded after md5 checking; gps_time (on the 1 s lattice of the UTC day, so absent seconds are listed in the index and the time axis is recoverable); GRACEFO_id (always D); ang_accl_x/y/z (published as zero in ACH1B, nonzero rows counted in the index); the acl_*_res residuals of lin_accl from non-CRN-filtered values (a model-result side product); and qualflg (nonzero rows counted in the index, no rows dropped)."
missing_value_policy = "ACH1B has no fill value. Build and verify share these rules: each row has one token per declared variable; GRACEFO_id is D; gps_time is an integer on the 1 s lattice of the file's UTC day (day start = (date - 2000-01-01) * 86400 - 43200 s), strictly increasing, with row count equal to the header num_records; and lin_accl values are finite with |a| < 1e-4 m/s^2. Absent lattice seconds are not filled. The sample keeps exactly the rows present, in order, and the index lists the absent seconds. A day with fewer than 43,200 rows, or any NaN, infinity, off-lattice, duplicated or out-of-order row, is fatal. Nothing is dropped, imputed or reordered."
conversion = "Stream the gzip tar with Python tarfile ('r|gz'). Hash every member with md5 and keep only ACH1B_<date>_D_04.txt. Check the hashes against the checksum member. Split the text at '\\n# End of YAML header\\n', locate the lin_accl_x/y/z columns from the header variables list, parse each value with float(), and write row-major little-endian float64 [records, 3]: the interleaved triple (x, y, z) for each 1 s epoch."
numeric_kind = "float"
bit_width = 64
endianness = "little"
sample_format = "raw homogeneous little-endian float64 array, row-major [records, 3] (records = 86,400 minus absent seconds), interleaved (lin_accl_x, lin_accl_y, lin_accl_z) per epoch"
sample_geometry = "satellite_daily_vector_time_series_2d"
sample_rank = 2
sample_axes = ["gps_second_of_utc_day", "srf_axis"]
natural_record_kind = "gracefo_l1b_ach1b_daily_file_lin_accl_array"
sample_count = 97
total_size_bytes = 201139200
output_path = "samples/gracefo_l1b_ach1b_transplant_accelerometer_f64/gracefo_ach1b_lin_accl_srf_f64/"
