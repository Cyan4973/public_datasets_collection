notes = "The exact Figshare article declares CC BY 4.0. Preserve the article DOI, title, authors, version, and related publication attribution."

[safety]
contains_sensitive_data = false
contains_personal_data = true
provenance_notes = "De-identified subject-coded anatomical-marker trajectories from 42 healthy volunteers, including young and older adults. Walking kinematics can have biometric character even without names or demographics."
usage_notes = "Use only under CC BY 4.0. Do not attempt participant identification, linkage, health inference, or biometric profiling. The recipe excludes participant spreadsheets, anthropometrics, analog force-platform channels, and descriptive metadata."

