[license]
name = "NASA SMD Open Scientific Data Policy"
spdx = "LicenseRef-NASA-SMD-Open-Data"
url = "https://science.nasa.gov/researchers/science-data/science-information-policy/"
citation = "IRIS is a NASA small explorer mission developed and operated by LMSAL with mission operations executed at NASA Ames Research Center and major contributions to downlink communications funded by ESA and the Norwegian Space Centre. De Pontieu et al. 2014, Solar Physics 289, 2733 (The Interface Region Imaging Spectrograph). Data served by the NASA GSFC HelioCloud (gov-nasa-hdrl-data1, SDAC holdings)."
notes = "IRIS project statement, read from https://iris.lmsal.com/data.html (HTTP 200 on 2026-10-05, 9,810 bytes, sha256 b0b34efe6c92421936d5a39536ab3e5bcdac0401fcc1ecb4b803e811106776e8; download.sh re-fetches it best effort into downloads/<id>/evidence/iris_lmsal_data.html): 'IRIS has an open data policy. When you publish work based on IRIS data, please acknowledge IRIS as follows: IRIS is a NASA small explorer mission developed and operated by LMSAL with mission operations executed at NASA Ames Research Center and major contributions to downlink communications funded by ESA and the Norwegian Space Centre.' NASA basis, the same as the accepted nasa_heasarc_nicer_pi_i16 and nasa_heasarc_batse_cont_counts_i16 recipes: the NASA SMD Science Information Policy page, fetched by the 2026-10-05 download run (downloads/<id>/evidence/nasa_smd_science_information_policy.html, 268,037 bytes, sha256 d1fdc2da6f0da6c9723a7057d7439167c1f086704420c8df7aa952d96e10efdb), states: 'NASA holds this information, including publications, data, and software, as a public trust to increase knowledge and serve the public good. It is Science Mission Directorate (SMD) policy, consistent with NASA and Federal policies, that information produced from SMD-funded scientific research activities be made publicly available.' and lists among its principles 'Mission data are released as soon as possible'. These are open-data policies, not a named license. IRIS is a NASA Small Explorer (SMD Heliophysics); these are its level-1 mission products served anonymously by NASA GSFC's HelioCloud bucket, whose catalog.json describes it as 'GSFC HelioCloud' / 'NASA TOPS ODR datasets' with a NASA contact; that catalog has no license field and no IRIS entry, and the bucket holds no README or license object for IRIS. The NASA Images and Media Usage Guidelines, re-read from the copy pinned by the accepted nasa_wmap_healpix_sky_maps_f32 recipe (captured 2026-08-27, sha256 3003114a6e2f7336...), state that NASA content 'generally are not subject to copyright in the United States' and, under Artificial Intelligence (AI) Applications, that 'NASA is committed to transparency, open science, and making data available to everyone'; the same section forbids attributing AI outputs to NASA, using NASA insignia with AI imagery or AI training, and implying NASA review or endorsement. Use the IRIS acknowledgement above."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official NASA GSFC HelioCloud public bucket (anonymous HTTPS, not requester-pays); dispersed far-ultraviolet spectra of the solar chromosphere and transition region recorded by the IRIS spectrograph CCDs."
usage_notes = "Samples contain only CCD counts of solar spectra. No personal, human-subject or Earth-observation data. Do not attribute model outputs to NASA or use NASA insignia (NASA AI guidance)."

