manifest_version = 1
dataset_id = "mpc_modis_mod10a1_ndsi_snow_cover_u8"
name = "Terra MODIS MOD10A1 v061 Daily 500 m NDSI Snow Cover UInt8 Tiles"
description = "Complete source-native uint8 NDSI_Snow_Cover grids (NDSI x 100 for 0..100, plus the product's in-band flag codes for cloud, night, ocean, inland water, and missing data) from the Terra MODIS MOD10A1 Collection 6.1 daily snow product: 70 tile-days (28 tiles, North America, Europe, and Asia) selected by a fixed clear-sky/snow rule from every row-v02..v05 (about 30-70 N) sinusoidal tile on the 1st and 15th of each month, December 2023 to April 2024."
homepage = "https://planetarycomputer.microsoft.com/dataset/modis-10A1-061"

[license]
name = "Creative Commons Zero 1.0 Universal (NASA Earthdata data use guidance; NSIDC DAAC openly shared)"
spdx = "CC0-1.0"
url = "https://nsidc.org/data/data-programs/nsidc-daac/citing-nsidc-daac"
citation = "Hall, D. K. and G. A. Riggs. 2021. MODIS/Terra Snow Cover Daily L3 Global 500m SIN Grid, Version 61. [Subset: 70 tile-days listed in sources.tsv]. Boulder, Colorado USA. NASA National Snow and Ice Data Center Distributed Active Archive Center. https://doi.org/10.5067/MODIS/MOD10A1.061"
notes = "The Planetary Computer collection modis-10A1-061 has STAC 'license' = 'proprietary', and its rel=license link (titled 'Use and Copyright | National Snow and Ice Data Center') is https://nsidc.org/data/data-programs/nsidc-daac/citing-nsidc-daac. That page says: 'Data hosted by the NSIDC DAAC are openly shared, without restriction, in accordance with NASA's Earth Science program Data and Information Guidance. NASA data are freely accessible; however, when you publish these data or works based on the data, you should clearly cite the data in your research.' NASA Earthdata Data Use Guidance (https://www.earthdata.nasa.gov/engage/open-data-services-software-policies/data-use-guidance): 'Unless the content is marked with a use restriction or license, data provided from a NASA-led mission are licensed as Creative Commons Zero (CC0). While there are no restrictions on the use of these data, data users are very strongly urged to cite the data used in their work products.' MOD10A1 is NASA Terra mission data; the STAC collection names NSIDC as producer/licensor. The NSIDC product page and user guide add 'As a condition of using these data, you must cite the use of this data set' - a citation condition, kept here as the required citation. The same page's 'may not be resold' sentence covers NSIDC website photographs and images, not data products. Preserve the DOI (embedded in every file as identifier_product_doi), NSIDC/NASA attribution, version, item IDs, and dates."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Public NASA Earth-observation snow-cover grids produced by MODAPS (PGE MOD_PR10A1, C6.1 snow algorithm of Hall and Riggs) and distributed by NSIDC DAAC, mirrored by Microsoft Planetary Computer as COGs; no personal or sensitive data."
usage_notes = "CC0 NASA mission data suitable for model training; cite the MOD10A1.061 DOI."

