[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/srsp_scotland_phase1_lidar_scan_angle_i8/samples.jsonl"
summary = "Download 88 pinned Phase I LAZ tiles, decode every point with tools/laz/laszip.py, and emit each tile's complete scan-angle-rank field as one raw int8 sample in file point order."
deterministic_notes = "Pinned keys, sizes and S3 ETags (MD5 or 8 MiB multipart MD5) are checked on download, plus LAS 1.2 / PDRF 1 / record length 28 / LASzip compressor 2 with POINT10 v2 + GPSTIME11 v2 / pinned point count. Build and verify reject a tile with fewer than 5 distinct values, any value above half of its points, a span under 10 degrees, or values outside -90..+90. Verify re-decodes every tile and requires byte-identical samples."

[[series]]
id = "srsp_phase1_scan_angle_rank_i8"
description = "Per-point LAS scan angle rank of Scottish Phase I airborne LiDAR tiles."
semantic_meaning = "Angle of the laser pulse off nadir, in whole degrees (negative to the left of the flight direction, positive to the right), for every point of one 1 km tile, in the tile's stored point order (flight-line sweeps, reversing at swath edges; overlap zones interleave lines)."
role = "primary"
representation_class = "native_numeric"
representation_notes = "LAS 1.2 point data record format 1 stores Scan Angle Rank as a signed char; the byte is copied unchanged."
source_resources = ["phase1_laz_tile_selection"]
source_format = "LAZ (LAS 1.2 point data record format 1, LASzip compressor 2)"
source_field = "Scan Angle Rank (PDRF 1 record byte offset 16, signed char, degrees)"
filtered_input_path = "filtered/srsp_scotland_phase1_lidar_scan_angle_i8/ingest_stats.json"
filtering = "All points of each of the 88 pinned tiles; no points dropped. Tiles from collection areas delivered with an all-zero scan angle field were excluded at selection time (see resource notes)."
missing_value_policy = "LAS scan angle rank has no sentinel; 0 is a valid nadir value and is kept. A tile whose field is constant or near-constant (fewer than 5 distinct values, a value holding more than half of the points, or a span under 10 degrees) or outside -90..+90 is a fatal build and verify error, as is any header, count, size, or checksum mismatch."
conversion = "Decode all LASzip chunks to 28-byte PDRF-1 records with tools/laz/laszip.py iter_chunks, take byte 16 of each record as int8, and write the values in point order as a raw int8 array (endianness is moot at 8 bits), one file per tile."
numeric_kind = "int"
bit_width = 8
endianness = "little"
sample_format = "raw homogeneous int8 array"
sample_geometry = "las_point_attribute_1d"
sample_rank = 1
sample_axes = ["las_point_order"]
natural_record_kind = "srsp_phase1_1km_laz_tile_scan_angle_field"
sample_count = 88
