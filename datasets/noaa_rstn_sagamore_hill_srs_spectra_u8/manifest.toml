verify_script = "verify.sh"
sample_index_path = "index/noaa_rstn_sagamore_hill_srs_spectra_u8/samples.jsonl"
summary = "Fetch 36 pinned Sagamore Hill 2024 SRS day files from NCEI, validate every 826-byte sweep record header, and split each day into a band A (25-75 MHz) and a band B (75-180 MHz) row-major uint8 matrix of sweeps x 401 channels, plus an auxiliary uint32 sweep-start time series per day."
deterministic_notes = "Selection (discover.sh): requested days 2024-MM-01/11/21; first acceptable file among d..d+9 in the same month, where acceptable means listed, gzip ISIZE a multiple of 826 with >= 5000 records, and every record decoded from a 32 KiB head range matching site 5 / 2 bands / (25,75,401,20,0) / (75,180,401,20,0) / the file's own date. download.sh and build.sh re-validate every record of every file: site 5, nbands 2, band A descriptor exactly (25 MHz, 75 MHz, 401 bytes, ref level 20, attenuation 0 dB), band B exactly (75, 180, 401, 20, 0), header date equal to the file date or the following UT day, valid h/m/s; any violation is fatal (no mixing of analyser scales). Pinned per file: size, gzip CRC32 and ISIZE, record count, first sweep time, and (after the first download) SHA-256. Sweep cadence is not enforced: realized steps are mostly 3 s with occasional 2 s, 4 s and 5 s steps (per day: 0-12 steps of 4 s, 1-9 of 2 s), plus 19 intra-day observing gaps longer than 5 s on 11 of 36 days (12 s to 4,124 s, the longest on 2024-09-11); timestamps are strictly increasing on every day and are kept in the auxiliary series. On 33 of 36 days the file begins with a fixed ~35-record start-up sequence (records ~19-53, about 1.5 min after the first sweep) in which levels repeat in groups of four identical sweeps (24-30 verbatim repeats per day, all within records 20-59) and which holds every code-0 value except two sweeps on 2024-03-01 (records 6308-6309); 2024-06-21, 2024-08-23 and 2024-10-11 lack it. It is part of the station-day file and is kept verbatim (no trimming). Output names: samples/<id>/<series>/sagamore_hill_YYYYMMDD_band_{a,b}.u8 and ..._sweep_start_utc_s.u32; index rows sorted by sample_path. Realized scope: 36 station-days, 504,393 sweeps (9,076-17,942 per day, median 13,834.5); 72 primary samples totalling 404,523,186 bytes; median primary sample 5,547,634.5 values. Realized value statistics per band sample: 178-256 distinct codes, mode share <= 7.83%, code 0 <= 0.0134%, code 255 <= 0.0167%, one flat sweep in the whole collection (an all-255 band B sweep on 2024-01-11 13:45:29 UT); daily means 33.2-51.0 DN (band A) and 61.2-71.4 DN (band B). verify.sh re-decodes with an independent streaming parser and compares every sample byte for byte."

[[series]]
id = "srs_band_a_25_75mhz_u8"
description = "Band A (25-75 MHz) dynamic spectrum of one Sagamore Hill SRS station-day: sweeps x 401 channels of uint8 analyser level."
semantic_meaning = "Output level of the band A swept spectrum analyser (relative logarithmic power, 0-255, no absolute calibration) at 401 linearly spaced frequencies f = 25 + 50*(n-1)/400 MHz, n = 1..401, for every sweep of the observing day at Sagamore Hill (site 5); analyser reference level 20 and attenuation 0 dB on every sweep. Daily mean 33-51 DN; quiet-Sun and galactic background with man-made interference lines (the documentation notes TV, FM, aviation and utility carriers in this range) and, on active days, solar radio bursts."
role = "primary"
representation_class = "native_numeric"
representation_notes = "Each SRS record stores the band A analyser levels as 401 unsigned bytes in increasing frequency; they are copied verbatim, with no scaling, offset, masking or resampling."
source_resources = ["sagamore_hill_2024_srs_days"]
source_format = "RSTN Solar Radio Spectrograph day file (.srs, gzip): fixed 826-byte sweep records, 24-byte header + 401 band A levels + 401 band B levels (NCEI Srsdispl.doc section 2.2)"
source_field = "record bytes 25-425 (1-based): band A spectrum-analyser level per frequency channel, 25.00-75.00 MHz"
filtered_input_path = "filtered/noaa_rstn_sagamore_hill_srs_spectra_u8/ingest_stats.json"
filtering = "All sweep records of the 36 pinned Sagamore Hill 2024 day files; no sweeps or channels are dropped. Other RSTN stations and other years are excluded."
missing_value_policy = "No values are dropped, imputed or masked. Codes 0 and 255 are genuine analyser extremes and are kept (realized code 0 occurs only inside the daily start-up sequence apart from two sweeps on 2024-03-01, at most 0.0134% of a sample; code 255 at most 0.0167%); verify requires their combined share below 1% per sample. Gaps in observing (between sweeps) are not filled; the auxiliary sweep-start series records the actual sweep times. A file with any header violation, a length that is not a multiple of 826, or fewer than 5000 records is fatal, never partially used."
conversion = "Decompress the .gz, split into 826-byte records, and write bytes [24:425) (0-based) of each record in file order: a row-major (sweeps x 401) uint8 matrix per station-day, channel fastest."
numeric_kind = "uint"
bit_width = 8
endianness = "little"
sample_format = "raw uint8 matrix, sweep-major, frequency channel fastest"
sample_geometry = "dynamic_spectrum_sweep_by_frequency_channel_2d"
sample_rank = 2
sample_axes = ["sweep", "frequency_channel"]
natural_record_kind = "rstn_srs_station_day_band_dynamic_spectrum"
sample_count = 36
