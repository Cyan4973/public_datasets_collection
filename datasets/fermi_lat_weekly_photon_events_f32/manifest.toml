[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/fermi_lat_weekly_photon_events_f32/samples.jsonl"
summary = "Fetch 18 pinned LAT weekly photon FITS files, walk the headers to the EVENTS binary table by EXTNAME, validate its 23-column schema and every FITS checksum, and write the stored ENERGY, RA, DEC, THETA and PHI float32 values of every row, in stored row order, as one little-endian float32 sample per week per field."
deterministic_notes = "Selection (scripts/select_weeks.py, run once by discover.sh): population = the 940 listed weekly files w010..w950 (w009 is the partial first week; w512, the March 2018 safe-mode week, is absent upstream; weeks after w950 excluded because the newest files are still being regenerated). 18 targets at population index floor((k + 0.5) * 940 / 18), k = 0..17, which land on one week in early February of every year 2009-2026: w036, w088, w140, w192, w245, w297, w349, w401, w453, w506, w559, w611, w663, w716, w768, w820, w872, w924. N = 18 rather than 20 keeps the 3.51 GB download plus 0.72 GB output under the pipeline's 5 GB per-candidate cap. download.sh enforces the exact size, HDU sequence PRIMARY/EVENTS/GTI, primary identity (GLAST/LAT, PROC_VER 305), the full EVENTS schema (NAXIS1 98, 23 TTYPE/TFORM pairs, TFORM-derived offsets ENERGY 0, RA 4, DEC 8, THETA 20, PHI 24, TUNIT MeV/deg, no TSCAL/TZERO/TNULL, PASS_VER P8R3, DSTYP2 BIT_MASK(EVENT_CLASS,128,P8R3)), every HDU CHECKSUM, the EVENTS and GTI DATASUM, zero padding, no trailing bytes, and the pinned NAXIS2, EVENTS DATASUM, TSTART, TSTOP and GTI row count. build.sh re-walks the file, extracts each field by strided byte copy (byte-swapping big-endian to little-endian), and requires finite values inside the physical ranges (ENERGY 0..1e7 MeV, RA 0..360, DEC -90..90, THETA 0..180, PHI 0..360 deg), the SOURCE bit set on every row's EVENT_CLASS and every TIME inside TSTART..TSTOP (row-alignment checks), at least 1,000 distinct values and min < max per sample, and unique outputs. verify.sh is a separate implementation (own FITS card parser over mmap, own DATASUM, struct.iter_unpack with a format derived from the TFORM offsets) that checks byte equality, ranges, every index statistic, the sample inventory and the manifest totals. Pinned: 18 files, 3,507,436,800 bytes, 35,784,618 photon rows (605,624-3,260,127 per week). Realized: 90 samples (18 per series), 178,923,090 primary values, 715,692,360 bytes, median 1,982,040.5 values per sample; ENERGY 7.666..3,489,360 MeV, RA 3.1e-6..360.0, DEC -89.989..89.991, THETA 0.0046..83.54, PHI 5.3e-6..360.0 deg; distinct-value fraction per sample 0.83-0.99; TIME non-decreasing in every file (0 backsteps); SOURCE bit set on every row; all CHECKSUM/DATASUM verified."

[[series]]
id = "lat_photon_energy_f32"
description = "Whole EVENTS.ENERGY column of one LAT weekly photon file: the reconstructed energy of every SOURCE-class photon recorded in that mission week."
semantic_meaning = "Reconstructed gamma-ray photon energy in MeV (Pass 8 R3 energy reconstruction), one value per detected photon, all-sky, in stored (time) order. Realized range 7.67 MeV to 3.49 TeV (most photons below a few GeV; steeply falling spectrum)."
role = "primary"
representation_class = "native_numeric"
representation_notes = "EVENTS declares ENERGY as TFORM 'E' (big-endian IEEE-754 float32), TUNIT 'MeV', no TSCAL/TZERO/TNULL. The stored floats are emitted bit-exact, byte-swapped to little-endian."
source_resources = ["lat_weekly_photon_selection"]
source_format = "FITS (PRIMARY + EVENTS + GTI binary tables), Fermi LAT weekly photon file, P305 / P8R3 SOURCE class"
source_field = "EVENTS.ENERGY (TFORM E, TUNIT MeV; bytes 0-3 of each 98-byte row)"
filtered_input_path = "filtered/fermi_lat_weekly_photon_events_f32/ingest_stats.json"
filtering = "18 pinned weekly files (see deterministic_notes). Every row of each EVENTS table is kept. The other EVENTS columns (L, B, ZENITH_ANGLE, EARTH_AZIMUTH_ANGLE, TIME, EVENT_ID, RUN_ID, versions, EVENT_CLASS/EVENT_TYPE bit arrays, CONVERSION_TYPE, LIVETIME, DIFRSP0-4) and the GTI table are not emitted."
missing_value_policy = "No missing-value handling: the column has no TNULL or sentinel. Every stored value is emitted unchanged in stored row order; nothing is masked, clipped, imputed, sorted, deduplicated or dropped. Non-finite values or values outside 0..1e7 MeV are fatal in build and verify. verify.sh applies the same policy (byte equality with the source column)."
conversion = "For each EVENTS row, in stored order, take the 4 big-endian bytes at row offset 0 and write them as a little-endian float32. One sample per weekly file, shape [NAXIS2]. No scaling, sorting, splitting or concatenation across weeks."
numeric_kind = "float"
bit_width = 32
endianness = "little"
sample_format = "raw homogeneous little-endian float32 array"
sample_geometry = "variable_length_photon_event_column_1d"
sample_rank = 1
sample_axes = ["photon_event"]
natural_record_kind = "lat_weekly_photon_file_events_column"
sample_count = 18
total_size_bytes = 143138472
output_path = "samples/fermi_lat_weekly_photon_events_f32/lat_photon_energy_f32/"

