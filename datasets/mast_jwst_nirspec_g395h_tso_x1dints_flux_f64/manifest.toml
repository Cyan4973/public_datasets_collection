verify_script = "verify.sh"
sample_index_path = "index/mast_jwst_nirspec_g395h_tso_x1dints_flux_f64/samples.jsonl"
summary = "Range-read the FLUX column of the EXTRACT1D table of 66 pinned public NIRSpec BOTS G395H NRS1 seg001 x1dints products and emit each product's full FLUX matrix (integrations x wavelength bins) as one little-endian float64 sample."
deterministic_notes = "discover.sh: Caom.Filtered (JWST, timeseries, NIRSPEC/SLIT, F290LP;G395H, calib_level 3) -> 140 observations, 125 PUBLIC (122 SUB2048, 3 SUB1024B excluded); Caom.Products -> 128 PUBLIC *-seg001_nrs1_x1dints.fits; sparse header walk of all 128 -> all pass the regime; one product per normalized target (70 targets; newest CAL_VER first, then lowest file name), then the largest products are dropped until FLUX bytes <= 500,000,000 (4 dropped) -> 66 products, 45 programs, 49,094 integrations. Regime (checked by discover, download, build and verify from the FITS cards): TELESCOP JWST, INSTRUME NIRSPEC, DATAMODL TSOMultiSpecModel, DETECTOR NRS1, FILTER F290LP, GRATING G395H, FXD_SLIT S1600A1, EXP_TYPE NRS_BRIGHTOBJ, SUBARRAY SUB2048, TSOVISIT T, EXSEGNUM 1, INTSTART 1, NAXIS2 = INTEND - INTSTART + 1, FLUX column TFORM nD with TUNIT 'Jy', WAVELENGTH nD 'um' of the same length, 1000 <= n <= 2048. The FLUX byte offset inside each row is computed from the TFORMn of the preceding columns (never hard-coded); observed 4 + 8n (after INT_NUM J and WAVELENGTH nD). Multipart parts are matched to the plan by exact Content-Range; ETag and total size must equal the values seen during the header walk. verify.sh re-walks the header pieces with a separate parser, re-decodes FLUX with struct (build uses array.byteswap), byte-compares every sample, re-applies the NaN policy, rejects constant or duplicate rows and duplicate samples, recomputes finite min/max/NaN counts against the index and checks manifest totals, one-product-per-target and >= 40 programs. scripts/selftest.py exercises both header walkers, the multipart and single-range parsers and all rejection paths on a synthetic FITS file."

[[series]]
id = "nirspec_g395h_nrs1_x1dints_flux_jy_f64"
description = "Per-integration extracted 1-D spectra of bright stars (and a few brown dwarfs / planetary-mass companions) observed with JWST NIRSpec bright-object time series in G395H on detector NRS1: the whole FLUX matrix of one x1dints segment-1 product per sample."
semantic_meaning = "Spectral flux density (Jy) of the target in each wavelength bin (~2.87-3.72 um, ~1271-1274 bins on NRS1) for each integration of the first exposure segment of a transit, eclipse, phase-curve or variability time series, as produced by the STScI calwebb_spec2 extract_1d step (CAL_VER 2.0.1 or 3.0.0). Consecutive rows differ by photon and detector noise plus the astrophysical signal (transit depth, systematics); brightness spans roughly 1e-4 to 1 Jy across targets."
role = "primary"
representation_class = "native_numeric"
representation_notes = "FITS binary-table column FLUX, TFORM nD (IEEE-754 big-endian float64) with TUNIT 'Jy'; values are byte-swapped to little-endian and otherwise untouched (no rounding, no rescaling, no masking). Values are genuine float64 (none of the sampled finite values is float32-representable)."
source_resources = ["x1dints_flux_ranges"]
source_format = "FITS (JWST TSOMultiSpecModel *_x1dints.fits): PRIMARY header, INT_TIMES binary table, EXTRACT1D binary table with one row per integration and vector columns"
source_field = "EXTRACT1D binary-table column FLUX (TFORM nD, TUNIT Jy), all NAXIS2 rows"
filtered_input_path = "filtered/mast_jwst_nirspec_g395h_tso_x1dints_flux_f64/ingest_stats.json"
filtering = "Only PUBLIC observations; only NRS1, segment 1, SUB2048, G395H/F290LP; one product per target (spread over 45 programs). NRS2, later segments, other gratings/prisms, SOSS and MIRI are excluded. Only the FLUX column is read; WAVELENGTH, FLUX_ERROR, variance, SURF_BRIGHT, background, DQ and NPIXELS columns are never downloaded."
missing_value_policy = "NaN is the native fill of the pipeline for wavelength bins without valid extraction (mostly the first ~27-30 and last ~4-5 bins of each row, ~2.6% of values) and is preserved bit-for-bit as quiet NaN. Each row must be at least 90% finite with at least two distinct finite values and no infinities; any all-NaN, mostly-NaN or constant integration fails the recipe (download, build and verify apply the same rule). Every product has one extreme bin per row (bin 230-233, i.e. column 231 of a 1272-bin grid, a bad detector column; |flux| > 1000x median, typically ~-6e3 Jy, up to +/-2.6e6 Jy) totalling 0.08% of values; it is native pipeline output and is kept unmasked, so index finite_min/finite_max reflect that column rather than the target brightness. Index finite_min/finite_max are computed over finite stored values only."
conversion = "Parse the FITS header cards from range-fetched pieces to locate EXTRACT1D (data offset, NAXIS1, NAXIS2) and the FLUX column (offset = sum of preceding TFORM widths, n = repeat count); fetch bytes [data_offset + r*NAXIS1 + flux_offset, +8n) for every row r with HTTP multi-range requests; concatenate rows in table order; byte-swap big-endian float64 to little-endian; write one file per product to samples/mast_jwst_nirspec_g395h_tso_x1dints_flux_f64/nirspec_g395h_nrs1_x1dints_flux_jy_f64/<product stem>.f64, row-major [integration][wavelength_bin]."
numeric_kind = "float"
bit_width = 64
endianness = "little"
sample_format = "raw homogeneous little-endian float64 matrix"
sample_geometry = "variable_integrations_x_nrs1_g395h_wavelength_bins"
sample_rank = 2
sample_axes = ["integration", "wavelength_bin"]
natural_record_kind = "jwst_x1dints_segment_product_flux_matrix"
sample_count = 66
