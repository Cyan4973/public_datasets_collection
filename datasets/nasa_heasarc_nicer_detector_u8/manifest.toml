deterministic_notes = "The decoder validates the shared 36-row source inventory and every compressed payload by exact size and SHA-256, gzip/FITS structure, NICER/XTI and OBS_ID identity, complete binary-table row geometry, and the exact TFORM/scaling/unit/null schema of all three fields. It selects all 31 observations with at least 1,000 events, checks nondegenerate output and uniqueness per series, and byte-compares every output with a fresh source parse."

[[series]]
id = "nicer_rawx_u8"
description = "Native detector focal-plane X-address sequence for each cleaned NICER observation."
semantic_meaning = "FITS RAWX detector pixel address of each successive cleaned X-ray photon event."
role = "primary"
representation_class = "native_numeric"
representation_notes = "EVENTS.RAWX is a scalar unsigned-byte FITS 1B field with TSCAL=1, TZERO=0, no TNULL, and unit pixel."
source_resources = ["nicer_june_2017_cleaned_event_files"]
source_format = "gzip-compressed FITS with OGIP EVENTS binary table"
source_field = "EVENTS.RAWX scalar FITS 1B column"
filtered_input_path = "filtered/nasa_heasarc_nicer_detector_u8/ingest_stats.json"
filtering = "Use the same fixed 36-observation inventory as the accepted PI recipe. Keep every RAWX event from all 31 observations whose full EVENTS table contains at least 1,000 rows."
missing_value_policy = "RAWX has no declared null sentinel. Missing columns, nonidentity scaling, schema drift, malformed FITS rows, constant samples, insufficient rows, duplicate outputs, source drift, or stale outputs fail the recipe; no event is dropped or imputed."
conversion = "Extract each unsigned RAWX byte in FITS event-row order and emit it unchanged. No scaling, sorting, splitting, padding, or concatenation is applied."
numeric_kind = "uint"
bit_width = 8
endianness = "little"
sample_format = "raw homogeneous uint8 detector X-address array"
sample_geometry = "variable_length_xray_photon_detector_address_1d"
sample_rank = 1
sample_axes = ["photon_event"]
natural_record_kind = "nicer_observation_rawx_event_sequence"
sample_count = 31
total_size_bytes = 8938390
output_path = "samples/nasa_heasarc_nicer_detector_u8/nicer_rawx_u8/"

