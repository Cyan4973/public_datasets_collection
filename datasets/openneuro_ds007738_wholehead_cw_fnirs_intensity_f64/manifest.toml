name = "OpenNeuro ds007738 Whole-Head Cocktail-Party fNIRS: Resting-State High-Density CW-fNIRS Raw Intensity (Float64)"
description = "Complete stored raw continuous-wave near-infrared intensity matrices (SNIRF /nirs/data1/dataTimeSeries, measurementList dataType 1; time x 1134 source-detector-wavelength channels at ~8.99 Hz) of all 24 published resting-state runs of OpenNeuro ds007738 1.0.0, range-extracted from the SNIRF (HDF5) files and kept bit for bit as little-endian float64."
homepage = "https://openneuro.org/datasets/ds007738/versions/1.0.0"

