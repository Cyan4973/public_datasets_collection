description = "Complete daily 1 Hz geomagnetic field vectors (North, East, Centre; nT) from the AOCS fluxgate magnetometers of GRACE-FO 1 and 2 as published in GFZ ACAL_CORR v0201 (aligned and vector-calibrated B_NEC): one native float64 [records, 3] B_NEC array per selected satellite-day, 64 days spread over 2018-06..2026-08. In 47 samples the published satellite-disturbance corrections (dB_* terms) are nonzero; in the 17 samples dated 2022-11-21..2024-11-10 all seven dB_* variables are published as exactly 0.0, so those B_NEC values carry no disturbance correction (recorded per sample as index field disturbance_terms_zero)."
