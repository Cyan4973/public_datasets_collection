verify_script = "verify.sh"
sample_index_path = "index/gavo_hdap_walz_photographic_plate_scans_u16/samples.jsonl"
summary = "Fetch 25 pinned HDAP Walz lunar plate FITS files, validate the primary-only uint16 header regime, and emit each complete primary image as one little-endian uint16 raster."
deterministic_notes = "Header regime enforced in download, build and verify: SIMPLE = T, BITPIX = 16, NAXIS = 2, NAXIS1/NAXIS2 equal to the pin, BZERO = 32768, BSCALE = 1, no BLANK, TELESCOP = '72cm Walz Reflektor', OBJECT starting 'Moon', header SHA-256 equal to the pin, and file size exactly header (5,760) + NAXIS1*NAXIS2*2 + padding to 2,880, so no extension HDU exists (EXTEND = T is declared but unused). Build fails on fewer than 256 distinct values, a single value covering more than 90% of a plate (a blank plate), duplicate images, or missing season coverage; it records min, max, distinct count, dominant value and fraction, 0 and 65535 counts and nonzero padding bytes per plate. verify.sh uses its own header reader, decodes by array byteswap + sign-bit XOR and by exact struct arithmetic on every 97th row, byte-compares every sample, recomputes the statistics from the stored uint16, and checks manifest totals. scripts/selftest.py (run by build.sh) checks both parsers, both decoders and the regime rejections on a synthetic 1003 x 1001 FITS plate with edge values 0..65535."

[[series]]
id = "walz_lunar_plate_scan_dn_u16"
description = "Complete 16-bit scanner rasters of historic Walz-reflector photographic glass plates of the Moon, one per plate."
semantic_meaning = "16-bit gray value (DN) recorded by the HDAP flatbed scan of one photographic glass negative of the Moon exposed with the Heidelberg-Königstuhl 72 cm Walz reflector (focal length 2,815 mm, 73.3 arcsec/mm); most plates carry two 1 s exposures of the lunar disk. Values increase with emulsion density, so the dense lunar disks are bright and unexposed clear glass sits at the tone-curve floor 1422. HDAP publishes no density calibration for these plates. The rasters hold lunar surface detail, emulsion grain, plate edges, defects and scanner-border columns."
role = "primary"
representation_class = "native_numeric"
representation_notes = "FITS stores the image as BITPIX = 16 with BZERO = 32768 and BSCALE = 1, the standard encoding of unsigned 16-bit integers; adding BZERO recovers the archived uint16 exactly. Values are neither scaled nor clipped. The archived codes occupy a sparse, non-uniform subset of 0..65535 (a probe of D482 found about 3,400 distinct codes in 1 M pixels, with typical gaps of 10-22 DN in the 47,000-58,000 range), consistent with a scanner tone curve; this is preserved as archived."
source_resources = ["walz_lunar_plate_fits_selection"]
source_format = "FITS primary HDU (BITPIX 16, NAXIS 2, BZERO 32768, BSCALE 1), no extensions"
source_field = "primary HDU image data unit: scanner gray value, NAXIS1 columns x NAXIS2 rows"
filtered_input_path = "filtered/gavo_hdap_walz_photographic_plate_scans_u16/ingest_stats.json"
filtering = "Only Walz-reflector plates whose lsw.plates object is 'Moon' or 'Moon (Eclipse)'; Bruce astrograph, Doppelastrograph, Calar Alto and all non-lunar Walz plates are excluded. 25 of the 43 lunar plates <= 62 MB are pinned (selection rule in scripts/discover.py); D59, D60 and D61 (75-147 MB) are excluded by size."
missing_value_policy = "Every pixel of the primary image is kept, including unexposed clear glass, which the scanner tone curve clips to its floor code 1422 (0% to 86% of a plate, 40.7% of all values; see README), the constant scanner-border columns, saturated 65535 and any 0 values; FITS declares no BLANK and nothing is masked, filled or dropped. Any size, header-hash, header-regime, full-file SHA-256, extension-HDU, degeneracy (fewer than 256 distinct values or one value covering more than 90%) or duplicate-image deviation fails the recipe instead of being skipped."
conversion = "Parse the 2,880-byte header blocks to END (5,760 bytes), read NAXIS1*NAXIS2 big-endian two's-complement int16 values, add BZERO = 32768 (equivalently flip bit 15) and write them as little-endian uint16 in FITS order (column fastest, then row) to samples/gavo_hdap_walz_photographic_plate_scans_u16/walz_lunar_plate_scan_dn_u16/<plate>.u16. One sample per plate; no cropping, tiling or resampling."
numeric_kind = "uint"
bit_width = 16
endianness = "little"
sample_format = "raw homogeneous little-endian uint16 plate-scan raster"
sample_geometry = "variable_2d_plate_scan_raster"
sample_rank = 2
sample_axes = ["scan_row", "scan_column"]
natural_record_kind = "hdap_walz_lunar_photographic_plate_scan"
