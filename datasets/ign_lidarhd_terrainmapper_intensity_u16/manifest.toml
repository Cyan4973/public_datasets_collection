[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/ign_lidarhd_terrainmapper_intensity_u16/samples.jsonl"
summary = "Download 12 pinned COPC tiles of IGN LiDAR HD mission 21LHD2GO, decode them with the repository LAZ decoder tools/laz/laszip.py, and emit each tile's native uint16 Intensity field as one raw little-endian sample."
deterministic_notes = "sources.tsv (from discover.sh: WFS metadata + Atom feed + 375-byte header range requests) pins tile names, URLs, sizes, MD5s and LAS header point counts. Tile rule: 12 anchors on an interior grid (NW-corner km x 442/454/466/478, y 6342/6358/6374), >= 6 km from every block edge; nearest qualifying tile with 15M..32M catalogue points and <= 230 MB. download.sh checks size, MD5, LAS 1.4/PDRF 6/rl 30, LASzip compressor 3 with only POINT14 v3, COPC info VLR, Lambert-93 WKT VLR, COPC hierarchy EVLR and header point count. build.sh checks decoded point count, points-by-return against the header and decoded XYZ within header bounds, and applies regime guards (>= 1000 distinct intensities, max >= 1000, no value above 5% of a tile). verify.sh re-decodes every tile, re-extracts Intensity via struct.iter_unpack and byte-compares samples, checks index fields/sha256/min/max and manifest totals, and enforces floors and the 1 GB cap."

[[series]]
id = "ign_lidarhd_intensity_u16"
description = "Per-point laser-return intensity of every point of one 1 km x 1 km IGN LiDAR HD COPC tile, in stored COPC order."
semantic_meaning = "Return-pulse intensity recorded by the Leica TerrainMapper (serial 90560) airborne lidar for each classified point (all classes, all returns) of mission 21LHD2GO; a radiometric magnitude on the instrument's native uint16 scale. Realized: 0.1-99.9 percentiles about 290..4400, median about 900..1800 per tile, 4,331..5,962 distinct values per tile, order-0 entropy 11.06..11.69 bits; rare outliers reach 65535 (54 points in 6 tiles) and 0 (360 points in one tile)."
role = "primary"
representation_class = "native_numeric"
representation_notes = "LAS 1.4 point data record format 6 stores Intensity as a little-endian uint16 at record offset 12; the values are copied unchanged (no rescaling, clipping or reordering)."
source_resources = ["tile_0441_6373", "tile_0442_6342", "tile_0442_6358", "tile_0454_6342", "tile_0454_6358", "tile_0454_6374", "tile_0466_6342", "tile_0466_6358", "tile_0466_6374", "tile_0478_6342", "tile_0478_6358", "tile_0478_6374"]
source_format = "COPC 1.0 (LAS 1.4 point data record format 6, LASzip layered-chunked compressor 3)"
source_field = "Intensity"
filtered_input_path = "filtered/ign_lidarhd_terrainmapper_intensity_u16/ingest_stats.json"
filtering = "All point records of the 12 pinned tiles are kept: every classification code (ground, vegetation, building, water, virtual, etc.), every return number, withheld/overlap points included. Tiles come only from mission 21LHD2GO, whose 2,500 WFS records all carry capteur ['Leica TerrainMapper:90560']; regime guards reject any tile that looks like another sensor."
missing_value_policy = "Intensity is a required field of point format 6; there is no sentinel. Zero and 65535 values are kept as recorded; realized zero fraction 1.15e-6 (360 points, all in tile 0442-6342) and 65535 fraction 1.73e-7 (54 points), reported per tile in ingest_stats.json and verify output. Truncated, desynchronised or header-inconsistent tiles fail the build."
conversion = "tools/laz/laszip.py iter_chunks (unmodified) decodes each COPC chunk to 30-byte POINT14 records; bytes 12..13 of every record are copied into a raw little-endian uint16 array. Point order is the file's stored order: COPC octree-node chunks in the order PDAL 2.8.2 wrote them (points clustered per octree node, not acquisition-time order). One sample per tile, named after the tile."
