missing_value_policy = "Same as the gyroscope series: malformed, empty or non-finite fields fail the recipe; no rows are dropped, reordered or imputed."
conversion = "float() on each decimal field; rows written in source order as little-endian row-major (x, y, z) float64 triples; one file per sequence."
