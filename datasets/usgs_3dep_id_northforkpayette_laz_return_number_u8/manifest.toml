[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/usgs_3dep_id_northforkpayette_laz_return_number_u8/samples.jsonl"
summary = "Fetch 20 pinned QL1 LAZ tiles, decode them with the repository's pure-stdlib LASzip decoder (tools/laz/laszip.py), keep the low nibble of byte 14 (return number) of every 30-byte LAS 1.4 PDRF-6 record, and emit one uint8 sample per tile in file point order."
deterministic_notes = "Selection rule (scripts/nfp_tiles.py select, documented by discover.sh; never looks at return numbers): VPC features of the work unit whose proj:bbox minimum easting is >= 500,000 m (the contiguous Idaho area; drops the disjoint 596-tile 11TLL block near lon -118.5 in northeastern Oregon), with a full 750 m footprint (x and y extents >= 749 m), and pc:count in [8,000,000, 11,000,000) (lower quartile of per-tile counts, to bound pure-Python decode time); sorted by tile id, the 20 tiles at ranks floor((2i+1)*962/40) of the 962 qualifying tiles. download.sh re-derives the selection from the live VPC and link list and refuses to proceed if it differs from sources.tsv. build.sh re-validates every tile, decodes all chunks in file order, fails on any return number 0, on any difference between the decoded per-return histogram and the header's 15 extended points-by-return counts, on a point-count mismatch, on a constant tile, or if more than 0.1% of points have return number > number of returns. verify.sh re-decodes each tile through the whole-file decode path, re-extracts return numbers with struct.iter_unpack and compares bytes, hashes, histograms (against the header again), index fields and manifest totals, and rejects samples with fewer than 1,000 non-first returns or one value above 99.99%. Expected realization (header counts pinned): 20 samples, 196,763,633 values and bytes; median 9,834,908 values per sample (8,321,172 to 10,980,768)."

[[series]]
id = "nfp_2020_return_number_u8"
description = "LAS 1.4 return number of every lidar point in one published USGS 3DEP North Fork Payette QL1 LAZ tile, as the native 4-bit field widened to one byte."
semantic_meaning = "Ordinal position (1 = first echo, 2 = second, ... up to 15; up to 9 occur in the pinned headers) of each recorded echo within the laser pulse that produced it, as assigned by the Riegl VQ-1560i's online waveform processing and kept through the contractor's processing (header system id MERGE, software LiDAR Suite), for every point of a 750 m x 750 m tile over the Payette National Forest (conifer forest, meadows, reservoirs) collected 2020-09-03..2020-10-09. High values mark deep canopy penetration; runs of 1 mark open ground, water or single-surface targets. Values follow the file's delivered point order (stored in LASzip 50,000-point chunks); the build does not reorder."
role = "primary"
representation_class = "native_numeric"
representation_notes = "LAS 1.4 PDRF 6 packs return number (bits 0-3) and number of returns (bits 4-7) into record byte 14. The sample keeps bits 0-3 unchanged as an unsigned byte (b & 0x0F); number of returns, classification, scan angle, intensity and coordinates are not emitted."
source_resources = ["laz_tiles"]
source_format = "LAZ (LASzip 3.4r3 layered-chunked compressor, POINT14 v3 item, 50,000-point chunks) encoding LAS 1.4 point data record format 6, 30-byte records"
source_field = "return number (bits 0-3 of byte 14 of each LAS 1.4 PDRF-6 point record)"
filtered_input_path = "filtered/usgs_3dep_id_northforkpayette_laz_return_number_u8/build_stats.json"
filtering = "20 tiles chosen by the selection rule. All points of each selected tile are kept regardless of classification, withheld, overlap, synthetic or scanner-channel flags; every other field is dropped."
missing_value_policy = "LAS return numbers have no missing sentinel; 0 is invalid in LAS 1.4 and is fatal. Every record is kept. The decoded record count must equal the header point count (== VPC pc:count) and the per-return histogram must equal the header's 15 extended points-by-return counts exactly; any violation is fatal in build.sh and verify.sh. Nothing is dropped, reordered, clipped or imputed."
conversion = "Decode each tile chunk by chunk with tools/laz/laszip.py iter_chunks; take records[14::30] and map each byte through a 256-entry low-nibble table (b & 0x0F); one sample file <tile file stem>.return_number_u8.bin per tile, value i = point i in file order."
numeric_kind = "uint"
bit_width = 8
endianness = "little"
sample_format = "raw uint8 1-D array"
sample_geometry = "per_point_attribute_in_file_point_order"
sample_rank = 1
sample_axes = ["point"]
natural_record_kind = "complete_published_usgs_3dep_laz_tile"
sample_count = 20
total_size_bytes = 196763633
output_path = "samples/usgs_3dep_id_northforkpayette_laz_return_number_u8/nfp_2020_return_number_u8/"
