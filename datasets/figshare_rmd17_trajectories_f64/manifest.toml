summary = "Download a pinned rMD17 payload selection, locate five molecule NPZ files, require native C-order little-endian float64 coordinate and force arrays, and emit one raw tensor per molecule and field."
deterministic_notes = "Build is local-only. It preserves source molecule, configuration, atom, component, and byte order; rejects float32, Fortran order, malformed shapes, non-finite values, duplicate molecules, or output above 1 GB. Verification independently rereads NPY headers and byte-compares every emitted value."

[[series]]
id = "rmd17_coordinates_f64"
description = "Atomic Cartesian coordinate tensors from revised MD17 trajectories."
semantic_meaning = "Atom positions for each molecular configuration, in the dataset's coordinate units."
role = "primary"
representation_class = "native_numeric"
representation_notes = "Accepted only when the source NPY header explicitly declares little-endian float64; source data bytes are copied unchanged."
source_resources = ["rmd17_bounded_molecule_files"]
source_format = "NumPy NPZ containing NPY tensor"
source_field = "coords (or legacy alias R)"
filtered_input_path = "filtered/figshare_rmd17_trajectories_f64/ingest_stats.json"
filtering = "Keep the configured molecules only when coordinates and forces are finite C-order float64 tensors with identical configuration×atom×3 shapes."
missing_value_policy = "Missing molecule files, arrays, configurations, atoms, or non-finite values fail the build; no imputation or frame dropping."
conversion = "Copy the source NPY float64 data payload unchanged into one raw row-major tensor per molecule."
numeric_kind = "float"
bit_width = 64
endianness = "little"
sample_format = "raw row-major float64 molecular coordinate tensor"
sample_geometry = "molecular_trajectory_tensor"
sample_rank = 3
sample_axes = ["configuration", "atom", "xyz_component"]
natural_record_kind = "rmd17_molecule_coordinate_trajectory"
sample_count = 5
total_size_bytes = 158400000
output_path = "samples/figshare_rmd17_trajectories_f64/rmd17_coordinates_f64/"

