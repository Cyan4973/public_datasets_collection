manifest_version = 1
dataset_id = "nrel_resstock2021_state_enduse_load_profiles_f64"
name = "NREL ResStock 2021 (AMY2018) State Single-Family-Detached 15-Minute End-Use Energy Load Profiles Float64"
description = "Full-precision float64 annual 15-minute energy-consumption profiles (kWh per interval) of the single-family-detached housing stock of 48 US states plus DC, by end use, from the NREL End-Use Load Profiles ResStock 2021 AMY2018 release 1 state aggregates; one sample per (state, end-use) column of 35,040 values. 17 end uses (13 electric, 4 natural gas) survive a global non-degeneracy rule; totals and fixed-schedule end uses are excluded."
