[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/comma2k19_global_pose_ecef_positions_f64/samples.jsonl"
summary = "Range-fetch the ZIP64 central directory and every <route>/<segment>/global_pose/frame_positions member from the ten pinned comma2k19 chunk archives (~58 MB instead of ~94 GB), inflate and CRC-check each member, decode its (N,3) '<f8' NPY array, and emit the array body unchanged as one little-endian float64 sample per segment."
deterministic_notes = "chunks.tsv pins revision, archive sizes, LFS sha256, ZIP64 EOCD and central-directory offsets/sizes/SHA-256/entry counts, and per-chunk member counts and byte totals. A member's range runs from its local header to the next local header in offset order, so local extra lengths (28 B, different from the central directory) are re-read from the local header. Build requires exactly 2,035 segments, 7,291,422 values and 58,331,376 bytes; finite values, 6.3e6 < |r| < 6.4e6 m, no all-zero rows, no constant component, and no duplicate segment payloads. Samples follow chunk then archive-offset order. Inter-frame steps over 4 m (80 m/s) are flagged in the index and stats, never dropped. Verify re-derives the member set from the central directories, re-inflates, re-parses NPY headers with a separate parser, and compares every sample byte."

[[series]]
id = "comma2k19_frame_positions_ecef_f64"
description = "Per-frame ECEF position of the road-facing camera for one one-minute comma2k19 segment, row-major x,y,z."
semantic_meaning = "Earth-centred, Earth-fixed Cartesian camera position in metres (x, y, z), one row per 20 Hz video frame. Estimated by comma.ai's tightly coupled INS/GNSS/vision pose optimizer on Laika-processed raw GNSS. Values are near (-2.71e6, -4.26e6, 3.88e6) m with sub-millimetre fractional digits."
role = "primary"
representation_class = "native_numeric"
representation_notes = "Upstream publishes each segment's positions as an NPY array with descr '<f8', C order, shape (N, 3). The emitted sample is that array body byte-for-byte, with no rescaling, reordering, or width change."
source_resources = ["chunk_01", "chunk_02", "chunk_03", "chunk_04", "chunk_05", "chunk_06", "chunk_07", "chunk_08", "chunk_09", "chunk_10"]
source_format = "deflate-compressed ZIP64 member holding a NumPy .npy v1.0 array"
source_field = "global_pose/frame_positions (N x 3 float64 ECEF x, y, z in metres)"
filtered_input_path = "filtered/comma2k19_global_pose_ecef_positions_f64/ingest_stats.json"
filtering = "Keep every segment in the ten chunks: 2,035 segments on 178 routes from two devices, 2018-05-01..2018-11-19. Exclude frame_times, frame_gps_times, frame_orientations, frame_velocities, processed_log CAN/IMU/GNSS, raw_log, video and preview members."
missing_value_policy = "No missing-value sentinel exists. Non-finite values, all-zero rows, geocentric radius outside (6.3e6, 6.4e6) m, wrong dtype/order/shape, or CRC/size mismatches are fatal; nothing is dropped or imputed. Large inter-frame steps (> 4 m) are flagged, not removed. Short segments (min 194 frames) are kept as natural records."
conversion = "Inflate the raw deflate stream (zlib wbits -15), check CRC32 and size against the central directory, parse the NPY header, and write the (N,3) little-endian float64 body unchanged. Index min/max come from the stored float64 values."
