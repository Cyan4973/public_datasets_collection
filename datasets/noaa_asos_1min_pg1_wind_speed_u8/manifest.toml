[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/noaa_asos_1min_pg1_wind_speed_u8/samples.jsonl"
summary = "Download 360 pinned DSI 6405 station-month text files, take the 2-minute-average and 5-second-peak wind-speed fields from fixed columns, drop missing/malformed values, and emit one uint8 sample per station-month per series in file (time) order."
deterministic_notes = "Fixed station list (30 ICAO ids) and months (2024-01..2024-12) pinned in sources.tsv with exact byte sizes and listing timestamps (regenerable with discover.sh). Rows are processed in file order. A row is structural when it is printable ASCII, at least 89 characters, carries digits WBAN + the expected ICAO + 16 timestamp digits with the file's LST year-month, all four wind fields (cols 69-88) are right-justified 1-3 digits, '   M ' or blank (so bracket-wrapped wind groups are rejected), the visibility region (cols 29-68, brackets ignored) is 0-3 pairs of extinction value (-?d+.ddd or M) and one-letter flag, and the tail (cols 89+) is blank, M, or one runway group (ddL/R/C/space + dd[+] or FFF); otherwise it is dropped and counted. These rules reject garbled transmissions (e.g. KRAP 2024-01, KPHL 2024-12) whose shifted columns would otherwise yield false speeds. Then every row whose LST minute occurs more than once in the file is dropped (19,220 rows; some files repeat day-long blocks with different wind). verify.sh re-derives every sample with an independent regex parser and compares bytes, sha256, index fields, ingest counts and manifest totals; it rejects samples with <1000 values, <3 distinct values, or a single value covering >=80% of the sample."

[[series]]
id = "wind_speed_2min_avg_kt_u8"
description = "ASOS 2-minute average wind speed, whole knots, reported every minute."
semantic_meaning = "Scalar wind speed (knots) averaged over the 2 minutes ending at each 1-minute observation time, from the ASOS ultrasonic/cup wind sensor at an airport station; one value per reported minute of the station-month."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The source field is an integer number of knots written as right-justified ASCII digits; stored unchanged as uint8."
source_resources = ["asos_pg1_2024_station_months"]
source_format = "NCEI DSI 6405 fixed-width ASCII station-month file (112-character records)"
source_field = "Speed of 2-minute average wind (knots), columns 74-78 (0-based slice [74:79])"
filtered_input_path = "filtered/noaa_asos_1min_pg1_wind_speed_u8/ingest_stats.json"
filtering = "All 360 pinned station-month files; every structural row whose 2-minute speed field holds digits in 0..255."
missing_value_policy = "'M' or blank speed fields are dropped (not imputed); values >255 are dropped and counted (none expected). Non-structural rows (malformed or garbled layout, bracket-wrapped wind group, other month, other station, non-printable) and all rows of a duplicated LST minute are dropped for both series and counted; build fails if non-structural rows exceed 5% of a file. Dropped minutes are not represented, so a sample is the sequence of valid reported minutes in time order, not a gap-filled lattice."
conversion = "ASCII decimal integer -> uint8, written in source row order; one raw file samples/<id>/wind_speed_2min_avg_kt_u8/<ICAO>_<YYYY-MM>.u8.bin per station-month."
numeric_kind = "uint"
bit_width = 8
endianness = "little"
sample_format = "raw homogeneous uint8 array"
sample_geometry = "station_month_minute_series"
sample_rank = 1
sample_axes = ["minute"]
natural_record_kind = "asos_station_month_file"
sample_count = 360
total_size_bytes = 13834055
output_path = "samples/noaa_asos_1min_pg1_wind_speed_u8/wind_speed_2min_avg_kt_u8/"

