provenance_notes = "Official DaRUS (University of Stuttgart) Dataverse deposit of the PDEBench benchmark by its authors; numerical PDE simulation output with no human subjects."
usage_notes = "Public, CC BY 4.0, anonymous access through the DaRUS access API. Only the /density dataset is emitted."

