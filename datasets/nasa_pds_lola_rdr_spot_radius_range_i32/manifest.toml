manifest_version = 1
dataset_id = "nasa_pds_lola_rdr_spot_radius_range_i32"
name = "LRO LOLA Level-3 RDR Per-Spot Lunar Radius and Two-Way Laser Range (mm), Mapping Orbit, Native LSB Int32"
description = "Per-laser-spot lunar surface radius from the Moon's centre (RADIUS_k, LSB_INTEGER mm, ~1.73e9) and per-spot two-way laser range from LRO to the surface (RANGE_k, mm, 2.9e7-7.4e7) from the Lunar Orbiter Laser Altimeter (LOLA) Reduced Data Record, PDS collection LRO-L-LOLA-3-RDR-V1.0. One orbit product per phase directory of LRO's quasi-circular ~50 km polar mapping orbit (lro_no_01..13, lro_sm_01..15; 28 orbits, 2009-10-04 .. 2011-10-17). One sample per orbit and quantity: all valid spots in shot order (28 Hz), spots 1..5 within a shot, as native little-endian int32."
homepage = "https://pds-geosciences.wustl.edu/missions/lro/lola.htm"

