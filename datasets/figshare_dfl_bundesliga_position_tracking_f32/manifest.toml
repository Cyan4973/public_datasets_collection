[[series]]
id = "person_speed_f32"
description = "Instantaneous speed of one player or referee over one half, 25 Hz."
semantic_meaning = "DFL tracking-system speed attribute S in km/h (checked against frame-to-frame displacement: e.g. 0.232 m per 40 ms = 20.9 km/h vs S=20.53), 0.01 resolution. Computed by the DFL provider pipeline and published as a first-class per-frame channel alongside X/Y; it is not recomputed locally."
role = "primary"
representation_class = "native_numeric"
representation_notes = "Two-decimal ASCII attribute S parsed and rounded to the nearest float32. S is a provider-filtered kinematic channel, not a local finite difference of X/Y; the D (provider distance-rate) and A (acceleration) attributes are not emitted."
source_resources = ["positions_raw_observed_xml"]
source_format = "DFL PutDataRequest/Positions XML (positions_raw_observed)"
