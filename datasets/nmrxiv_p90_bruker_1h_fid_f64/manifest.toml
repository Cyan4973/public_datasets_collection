summary = "Validate the P90 license via the nmrXiv API, range-read the pinned project ZIP's central directory, fetch every 1D experiment's acqus, select by parsed acquisition parameters, range-fetch and CRC-check the selected Bruker fid files, and emit each fid's 65,536 float64 values unchanged as one little-endian sample."
deterministic_notes = "Pinned archive URL, size, EOCD position, central-directory SHA-256 and selected-list SHA-256. Selection (from acqus, re-derived in build and independently in verify): DTYPA=2, NUC1=<1H>, PULPROG=<zg30>, TD=65536, PARMODE=0 (1D), SOLVENT=<DMSO>, INSTRUM=<Avance Neo 600>, TopSpin 4.0.5 in ##TITLE, BF1 600 MHz; BYTORDA honored (all 0). Excluded by the rule: 81 noesyigld1d 1H, 7 deptqgpsp 13C, 15 zg30 1H written by TopSpin 4.0.3 in 2018 (14 in MeOD, 1 in DMSO; different solvent/receiver regime, DE 23.70 vs 24.64 us). 2D ser experiments have no fid member and are never considered. Samples sorted by fraction/experiment; named <fraction>__<experiment>.f64. Floors: 152 samples x 65,536 values (median 65,536)."

[[series]]
id = "bruker_1h_zg30_fid_f64"
description = "Complex 1H free-induction decays (32,768 complex points, interleaved real/imaginary) from a Bruker Avance NEO 600 with TopSpin 4.0.5, 16 scans of zg30, DMSO-d6 solutions of a plant extract and its fractions."
semantic_meaning = "Digitized quadrature receiver signal (arbitrary units, summed over NS=16 scans) of the 1H nuclear magnetization after a 30-degree pulse: a sum of exponentially decaying complex oscillations (solvent, water and metabolite resonances) plus noise, sampled at SW_h 9615.38 Hz. The first ~76 complex points are the Bruker digital-filter group delay (GRPDLY=76), kept as native content."
role = "primary"
representation_class = "native_numeric"
representation_notes = "TopSpin writes DTYPA=2 fid files as IEEE-754 float64 (BYTORDA=0, little-endian). The values are copied bit-for-bit; no phase correction, group-delay removal, apodization, Fourier transform or scaling (scaledByRG=no in acqus). Values lie on a 1/128 lattice with magnitudes up to ~2.6e9 (about 38 significant bits), so they are not representable as int32 or float32."
source_resources = ["p90_project_zip"]
source_format = "Bruker TopSpin 1D experiment directory (acqus JCAMP-style parameters + fid binary, DTYPA=2) inside a ZIP archive"
source_field = "fid: interleaved real/imaginary float64 time-domain samples, TD=65536 values"
filtered_input_path = "filtered/nmrxiv_p90_bruker_1h_fid_f64/build_stats.json"
filtering = "Keep every 1D experiment whose acqus satisfies the selection rule in processing.deterministic_notes: 152 FIDs = 76 fractions/extracts x 2 independent zg30 acquisitions (experiment 20 or 21, and proton_NN, recorded about two weeks apart in October 2019)."
missing_value_policy = "No missing values exist in fid files. Any non-finite value, wrong size (must be 524,288 bytes), CRC32 mismatch against the ZIP central directory, fewer than half distinct values, or a selection that differs from the pinned list is fatal; nothing is dropped, imputed or clipped."
conversion = "Inflate the ZIP member with raw DEFLATE, check CRC32, unpack 65,536 float64 values with the byte order from BYTORDA (0 -> little-endian), and repack them as little-endian float64 in source order. One fid file (one acquisition) = one sample."
numeric_kind = "float"
bit_width = 64
endianness = "little"
sample_format = "raw homogeneous little-endian float64 interleaved complex FID"
sample_geometry = "nmr_time_domain_complex_interleaved"
sample_rank = 1
sample_axes = ["time_point_x_quadrature_channel"]
natural_record_kind = "bruker_1d_experiment_fid_file"
sample_count = 152
