summary = "Validate three pinned CC BY 4.0 TCIA RTDOSE objects and copy each complete native unsigned-16 Pixel Data field as one 3D volume."
deterministic_notes = "The downloader pins three SeriesInstanceUIDs from distinct studies and checks live collection, modality, license, object count, source size, ZIP structure, and embedded license. Build accepts only uncompressed Implicit VR Little Endian RT Dose Storage objects from Elekta GammaPlan with MONOCHROME2, GY/PHYSICAL/PLAN semantics, one sample per voxel, BitsAllocated=BitsStored=16, HighBit=15, PixelRepresentation=0, positive DoseGridScaling, nondegenerate values, and an exact frames*rows*columns*2 Pixel Data length. Verification reparses all source objects and byte-compares every emitted sample."

[[series]]
id = "gamma_plan_physical_dose_grid_u16"
description = "Three-dimensional GammaPlan physical radiotherapy dose grids."
semantic_meaning = "Per-voxel stored physical treatment-dose magnitude for a complete planned vestibular-schwannoma radiotherapy volume; physical gray values equal stored uint16 values multiplied by the source object's DoseGridScaling."
role = "primary"
representation_class = "native_numeric"
representation_notes = "DICOM natively stores these RTDOSE Pixel Data fields as unsigned 16-bit little-endian values. The recipe preserves stored integers rather than applying the per-volume floating-point physical scaling."
source_resources = ["gamma_plan_rtdose_01", "gamma_plan_rtdose_02", "gamma_plan_rtdose_03"]
source_format = "DICOM RT Dose Storage, uncompressed Implicit VR Little Endian"
source_field = "Pixel Data (7FE0,0010), interpreted with DoseGridScaling (3004,000E)"
filtered_input_path = "filtered/tcia_gamma_plan_rtdose_u16/ingest_stats.json"
filtering = "Keep all voxels from the three pinned, validated RTDOSE objects as three separate natural 3D volumes."
missing_value_policy = "No voxels are dropped or imputed. Missing series, changed metadata/license/size, malformed archives, unsupported transfer syntax, wrong RTDOSE/vendor/model/dose semantics, non-uint16 pixel representation, invalid scaling/geometry, truncated or trailing Pixel Data, or degenerate stored values fail the recipe."
conversion = "Remove the DICOM container and copy the complete Pixel Data value field byte-for-byte in source frame-row-column order; record DoseGridScaling as metadata without applying it."
numeric_kind = "uint"
bit_width = 16
endianness = "little"
sample_format = "raw homogeneous uint16 DICOM RTDOSE Pixel Data"
sample_geometry = "3d_dose_volume"
sample_rank = 3
sample_axes = ["z", "y", "x"]
natural_record_kind = "dicom_rtdose_object"
sample_count = 3
total_size_bytes = 24994568
output_path = "samples/tcia_gamma_plan_rtdose_u16/gamma_plan_physical_dose_grid_u16/"
