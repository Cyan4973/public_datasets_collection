manifest_version = 1
dataset_id = "sxs_bbh_extrapolated_strain_modes_f64"
name = "SXS:BBH Extrapolated Asymptotic Strain Modes rh/M (N2, CoM, l<=4) Float64"
description = "Native float64 spin-weight -2 spherical-harmonic modes r*h_lm/M (real and imaginary parts) of the asymptotic gravitational-wave strain from 51 SpEC binary-black-hole merger simulations of the SXS catalog (2019 Zenodo deposits, highest available resolution), extrapolation order N=2, center-of-mass corrected, all 21 modes with 2 <= l <= 4."
homepage = "https://zenodo.org/communities/sxs"

[license]
name = "Creative Commons Attribution 4.0 International"
spdx = "CC-BY-4.0"
url = "https://creativecommons.org/licenses/by/4.0/"
citation = "SXS Collaboration, Binary black-hole simulation SXS:BBH:NNNN, Zenodo (2019), one DOI per record listed in sims.tsv; Boyle et al., The SXS Collaboration catalog of binary black hole simulations, Class. Quantum Grav. 36, 195006 (2019), arXiv:1904.04831."
notes = "Each of the 51 pinned Zenodo records declares metadata.license.id = 'cc-by-4.0'; download.sh re-fetches every record JSON and refuses to continue if any license, title, file size or MD5 changed. Attribute the SXS Collaboration and cite the catalog paper."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official SXS Collaboration deposits in the Zenodo 'sxs' community, fetched from zenodo.org file-content URLs. Output values are numerical-relativity simulation results; no personal data. metadata.json is read only for consistency checks (it contains a point-of-contact e-mail that is not emitted)."
usage_notes = "Public, CC BY 4.0, simulation output; appropriate for reproducible numeric collection."

[[origins]]
id = "zenodo_sxs_community"
name = "SXS Collaboration catalog on Zenodo (community 'sxs')"
url = "https://zenodo.org/communities/sxs"
type = "repository"
notes = "2,165 records match 'SXS:BBH'; 2,019 of them are 2019-07..09 deposits with cc-by-4.0 and a rhOverM_Asymptotic_GeometricUnits_CoM.h5 file. Newer catalog versions (CaltechDATA, RPDMB-compressed) are deliberately not used."

