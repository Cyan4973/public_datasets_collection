manifest_version = 1
dataset_id = "zenodo_starlink_irtt_rtt_i32"
name = "Starlink IRTT 10 ms UDP Probe RTT and Receive Delay, Nanosecond Int32 per 2-Minute Session"
description = "Per-probe round-trip time and NTP-synchronized one-way receive (downstream) delay, in integer nanoseconds, measured by IRTT every 10 ms over a residential Starlink link (Victoria BC dish, Seattle PoP) to a GCP us-west1-a server; one sample per 2-minute IRTT session per delay field (two fields), every session from 2023-09-13 to 2023-09-17. The one-way send delay is omitted as a near-duplicate view (send ~= rtt - receive)."
homepage = "https://doi.org/10.5281/zenodo.10020034"

[license]
name = "Creative Commons Attribution 4.0 International"
spdx = "CC-BY-4.0"
url = "https://creativecommons.org/licenses/by/4.0/"
