[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/leap_climsim_lowres_e3sm_mmf_state_fields_f64/samples.jsonl"
summary = "Range-fetch the CDF-5 header and the state_t variable of 825 pinned ClimSim low-res E3SM-MMF input files, parse each header with a pure-stdlib CDF-5 parser, and emit each timestep's complete 60 x 384 big-endian NC_DOUBLE temperature field as one raw little-endian float64 sample."
deterministic_notes = "Timestep rule (scripts/climsim.py planned_steps): model years 0002-0008 of the NO_LEAP calendar (72 twenty-minute steps per day), one mli file every 223 steps (74 h 20 min) from 0002-01-01-00000; 223 mod 72 = 7 rotates the time of day through all 72 steps and no two selected files are adjacent, giving 825 files. selection.tsv pins path, in-file ymd/tod, size, LFS sha256 and xet hash for each and is re-validated against the deterministic rule and the paths-info API. Header checks: magic CDF\\x05, dims ncol=384 and lev=60, calendar NO_LEAP, state_t NC_DOUBLE (lev, ncol), non-record, vsize 184,320, begin inside the file, in-file ymd/tod equal to the file name. Offsets are never hard-coded: the state_t range is computed from each file's parsed header. Sample order follows selection.tsv. The CDF-5 parser is self-tested on synthetic CDF-1/2/5 files (64-bit counts and offsets, padding, truncation) at download, build and verify time."

[[series]]
id = "climsim_e3sm_mmf_state_t_f64"
description = "E3SM-MMF model air temperature on 60 hybrid vertical levels for all 384 ne4pg2 physics columns at one model timestep."
semantic_meaning = "Atmospheric air temperature in kelvin (input state `state_t` to the E3SM-MMF cloud-resolving superparameterization) from a multi-year E3SM-MMF climate simulation on the ne4pg2 low-resolution grid; one global 3D snapshot per sample."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The source variable is stored as big-endian IEEE-754 NC_DOUBLE. Values are byte-swapped to little-endian with every bit pattern preserved; probed values carry full 52-bit mantissas (none round-trip through float32)."
source_resources = ["climsim_mli_state_t_ranges"]
source_format = "NetCDF classic CDF-5 (64-bit data) E3SM-MMF.mli input-state file"
source_field = "variable `state_t` (NC_DOUBLE, dims lev=60 x ncol=384, kelvin)"
filtered_input_path = "filtered/leap_climsim_lowres_e3sm_mmf_state_fields_f64/ingest_stats.json"
filtering = "Only the mli (input) files selected by the deterministic 223-step rule over model years 0002-0008 (825 files), and only their state_t variable. Other variables (humidity and condensates, winds, pressure, prescribed gases, surface fields) and all mlo output files are not used."
missing_value_policy = "The variable has no _FillValue and none is expected; every value must be finite and within a wide 50-1000 K decode-garbage guard (not a physics filter: genuine model-top transients occur, e.g. 414.2 K and 663.6 K at lev 0 in the 0008-06-10-68400 field, verified against that file's sha256-checked whole-file canary and kept), the lowest level must average more than 20 K warmer than levels 15-25, and each field must be non-constant and distinct from every other selected field. Any violation is fatal in download, build and verify; nothing is dropped or imputed."
conversion = "Parse the CDF-5 header (64-bit NON_NEG counts and OFFSETs), read vsize = 184,320 bytes at the state_t begin offset, unpack as 23,040 big-endian float64, and write them unchanged in source order (lev-major, ncol fastest) as little-endian float64. One sample per selected timestep file; index min/max are computed from the stored little-endian values."
numeric_kind = "float"
bit_width = 64
endianness = "little"
sample_format = "raw homogeneous little-endian float64 array"
sample_geometry = "global_model_level_by_column_field_2d"
sample_rank = 2
sample_axes = ["lev", "ncol"]
natural_record_kind = "e3sm_mmf_model_timestep_input_state_file_variable_field"
sample_count = 825
total_size_bytes = 152064000
output_path = "samples/leap_climsim_lowres_e3sm_mmf_state_fields_f64/climsim_e3sm_mmf_state_t_f64/"
