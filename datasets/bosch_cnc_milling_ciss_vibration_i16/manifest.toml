description = "Complete tri-axial (X, Y, Z) 2 kHz accelerometer recordings of individual machining operations on two brownfield CNC milling machines (M01, M02), one int16 (n, 3) sample per published run, from the CC BY 4.0 Bosch CNC_Machining dataset."
homepage = "https://github.com/boschresearch/CNC_Machining"

[license]
name = "Creative Commons Attribution 4.0 International"
spdx = "CC-BY-4.0"
url = "https://creativecommons.org/licenses/by/4.0/"
citation = "Tnani, M.-A.; Feil, M.; Diepold, K. Smart Data Collection System for Brownfield CNC Milling Machines: A New Benchmark Dataset for Data-Driven Machine Monitoring. Procedia CIRP 2022, 107, 131-136. https://doi.org/10.1016/j.procir.2022.04.022"
notes = "The repository README at commit d60581d6a3ab6015dcc5488c3d76112bb8e1bcb1 states: 'The dataset created for the research located in the directory [data](data) are licensed under a Creative Commons Attribution 4.0 International License (CC-BY-4.0).' The repository LICENSE file (BSD-3-Clause) covers the code only; no code is used. download.sh re-fetches that README by git blob SHA-1 and fails if the CC BY 4.0 statement is missing. Cite the paper and credit Robert Bosch GmbH / Bosch Rexroth AG."

[safety]
