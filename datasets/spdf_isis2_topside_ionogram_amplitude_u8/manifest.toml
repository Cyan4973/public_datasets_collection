[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/spdf_isis2_topside_ionogram_amplitude_u8/samples.jsonl"
summary = "Fetch the 1,604 pinned ULA-1974 ISIS-2 average-ionogram CDFs, decode each with a pure-stdlib CDF v2.6 walker (CDR -> GDR -> zVDR -> VXR -> GZIP CVVR), keep complete calibrated 0.1-10 MHz ionograms under a declared rule, and write each kept ionogram's 'ampl' raster as raw uint8 plus its 'freq' axis as auxiliary little-endian float64."
deterministic_notes = "Sources are processed in sources.tsv (key) order. Keep rule: MaxRec+1 equals vh_num, or exceeds it by 1-4 trailing records that are all-zero ampl rows with freq 0.0 and Epoch reset to the first record (a writer artifact, trimmed); 500 <= rows <= 1100; freq has no fill (< -1e30) and lies in (0, 10.6] MHz; min freq <= 0.11 MHz (sweep start present) and max freq >= 9.5 MHz (sweep reached the 10 MHz end); Epoch strictly increasing; at most 5% of the kept rows are all-zero amplitude rows (heavier dropout, e.g. the day-079 1.95 MHz runs with every other fixed-frequency row empty, is dropped as too_many_zero_rows). Every file must also pass structural checks (ampl CDF_UINT1, dims [223], record-variant, no pad value, GZIP CPR, FILLVAL -128, VALIDMIN/MAX 0/255, f_num 223, year 74). Per-file decisions are written to filtered/.../selection.tsv. verify.sh re-decodes all sources, re-applies the rule, byte-compares every sample, checks index rows, sha256, min/max, duplicate content, <= 5% all-zero rows, >= 32 distinct codes and <= 50% modal share per sample, the repository floors and the manifest totals. The parser is self-tested on synthetic CDF v2.6 files (nested VXR, multiple GZIP CVVRs, VVR inside a compressed variable, truncation, record gaps, corrupt gzip, length mismatch) at the start of build.sh."

[[series]]
id = "isis2_ula1974_ampl_u8"
description = "ISIS-2 SFS sounder-receiver video amplitude raster of one complete topside ionogram."
semantic_meaning = "8-bit relative amplitude of the ISIS-2 swept-frequency sounder receiver video output after each sounder pulse, averaged over four 25 us samples (100 us = 15 km apparent-range bins), for 223 delay bins per frequency step; rows cover the fixed-frequency portion followed by the 0.1-10 MHz swept portion. 255 is a valid code (the receiver/A-D saturation level produced by the archive's 16-to-8-bit reduction), not fill."
role = "primary"
representation_class = "native_numeric"
representation_notes = "Stored upstream as CDF_UINT1; bytes are copied unchanged after GZIP decompression (single-byte elements, so no byte-order change)."
source_resources = ["isis2_ula_1974_cdfs"]
source_format = "NASA CDF v2.6 (big-endian network encoding), GZIP-compressed zVariable records"
source_field = "zVariable 'ampl' (CDF_UINT1, dims [223], DEPEND_0 Epoch, DEPEND_1 v_height)"
filtered_input_path = "filtered/spdf_isis2_topside_ionogram_amplitude_u8/selection.tsv"
filtering = "All 1,604 ULA 1974 files are decoded; only complete calibrated 0.1-10 MHz ionograms pass the declared keep rule (processing.deterministic_notes). Short or truncated sweeps, files with uncalibrated (fill) frequency axes, MaxRec/vh_num mismatches other than the zero-row trailer, and non-monotonic Epochs and ionograms with more than 5% all-zero rows are dropped with the reason recorded."
missing_value_policy = "ampl declares no pad value and its FILLVAL (-128, INT4) lies outside the UINT1 domain, so no in-band sentinel exists; all 0-255 codes are kept as measured. Records not covered by the VXR tree, corrupt gzip streams or length mismatches are fatal. Trailing all-zero writer-artifact records beyond vh_num are removed (only when exactly matching the artifact signature). Interior all-zero rows (telemetry dropouts, mostly in the fixed-frequency portion) are source content and kept up to 5% of the rows; ionograms with more are dropped by the keep rule (42 files), and verify re-checks the bound."
conversion = "Walk CDR -> GDR -> zVDR 'ampl' -> VXR tree; gunzip each CVVR (wbits 31), require exactly (last-first+1)*223 bytes per block and full 0..MaxRec coverage; keep the first vh_num records; write the uint8 bytes in stored record order (frequency-step-major, delay-bin-minor) to one .u8 file per ionogram."
numeric_kind = "uint"
bit_width = 8
endianness = "little"
sample_format = "raw homogeneous uint8 2-D raster, row-major [frequency_step][223]"
sample_geometry = "ionogram_frequency_step_by_apparent_range"
sample_rank = 2
sample_axes = ["frequency_step", "apparent_range_bin"]
natural_record_kind = "one_digitized_isis2_topside_ionogram"
sample_count = 1007
total_size_bytes = 143655485
output_path = "samples/spdf_isis2_topside_ionogram_amplitude_u8/isis2_ula1974_ampl_u8/"

