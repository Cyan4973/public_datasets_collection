[[series]]
id = "wmap_temperature_f32"
description = "WMAP nine-year Stokes-I thermodynamic-temperature maps across five frequency bands."
semantic_meaning = "Full-sky microwave brightness-temperature anisotropy and foreground emission in each WMAP band."
role = "primary"
representation_class = "native_numeric"
representation_notes = "Native FITS TFORM=E IEEE-754 float32; endian normalization only."
source_resources = ["wmap_k_band_iqu", "wmap_ka_band_iqu", "wmap_q_band_iqu", "wmap_v_band_iqu", "wmap_w_band_iqu", "wmap_dr5_product_page", "nasa_ai_and_media_guidance"]
source_format = "FITS binary-table HEALPix maps"
source_field = "Stokes Maps.TEMPERATURE"
filtered_input_path = "filtered/nasa_wmap_healpix_sky_maps_f32/ingest_stats.json"
filtering = "Retain the complete Nside-512 NESTED field for each K, Ka, Q, V, and W band, preserving pixel order and band boundaries."
missing_value_policy = "Require every value finite and non-sentinel; constant, duplicate, changed, or stale outputs fail."
conversion = "Reverse each native FITS big-endian float32 word to the identical little-endian bit pattern."
numeric_kind = "float"
bit_width = 32
endianness = "little"
sample_format = "raw homogeneous IEEE-754 float32 HEALPix temperature field"
sample_geometry = "full_sky_healpix_nested_sphere_1d"
sample_rank = 1
sample_axes = ["healpix_nested_pixel_index"]
natural_record_kind = "complete_wmap_frequency_band_healpix_field"
sample_count = 5
total_size_bytes = 62914560
output_path = "samples/nasa_wmap_healpix_sky_maps_f32/wmap_temperature_f32/"

