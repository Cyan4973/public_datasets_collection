[[resources]]
id = "p1018_proxcen_subint_rows"
origin = "csiro_dap_p1018"
url = "https://data.csiro.au/dap/ws/v2/collections/{collection_id}/data"
type = "shard"
version = "DAP collections v1 (published 2019-05-07 .. 2019-10-04); pinned file ids, sizes and SHA-256 values in sources.tsv"
access = "Anonymous DAP API listing returns presigned s3.data.csiro.au links (48 h expiry), refreshed every run. Two exact HTTP 206 byte ranges per file: bytes 0-25919 (primary + HISTORY + SUBINT headers) and one 54,792,232-byte SUBINT row (row 112 of 224) starting at 25920 + 112 * 54792232."
size_bytes = 438545216
sha256 = ""
local_path = "downloads/csiro_parkes_uwl_search_mode_u8/"
notes = "Eight ProxCen_S on-source observations, one row each from file _8 (the middle file of each 16-file observation): uwl_190429_130235, uwl_190429_163748, uwl_190430_162008, uwl_190501_150103, uwl_190502_150319, uwl_190503_135452, uwl_190504_134200, uwl_190504_173107. Every source file is 12,273,488,640 bytes; whole-file MD5s from the collection logs are recorded in sources.tsv for provenance but cannot be checked against ranges. Header-range, row-aux-prefix and full-row SHA-256 values are all pinned in sources.tsv (row hashes recorded from the first driver download on 2026-10-05; every row arrived in one exact 206 range). Size = 8 * (25,920 + 54,792,232) = 438,545,216 bytes, excluding ~1 MB of DAP API JSON; the realized downloads directory is 439,509,771 bytes including API JSON and checksum sidecars."

[local_paths]
downloads = "downloads/csiro_parkes_uwl_search_mode_u8/"
filtered = "filtered/csiro_parkes_uwl_search_mode_u8/"
index = "index/csiro_parkes_uwl_search_mode_u8/"
