name = "ACTRIS Cloudnet Lindenberg (DWD) Lufft CHM15k Ceilometer Daily Raw Attenuated Backscatter (beta_raw) Float32"
description = "Native float32 non-screened attenuated backscatter coefficient profiles (beta_raw, sr-1 m-1) from the single DWD Lufft CHM15k ceilometer (serial CHM100110) at the Lindenberg Meteorological Observatory (MOL-RAO), one complete daily time x 1535-gate (15 s x 9.99 m, 0-15.3 km) matrix per Cloudnet lidar product file, for the 1st and 15th of every month of 2024 (24 days), decoded from NetCDF4/HDF5 (shuffle + deflate) with a pure-stdlib HDF5 reader."
homepage = "https://cloudnet.fmi.fi/search/data?site=lindenberg&product=lidar&instrument=chm15k"

