conversion = "Inflate the outer DEFLATE member (CRC32 checked), locate <config>/data/0 through the inner stored-zip central directory, validate the tensor header with pickletools.genops, and write data/0 unchanged: row-major (mu, x, y, z, t, row, col) complex128 = interleaved little-endian float64 (re, im). One sample per configuration."
