sample_index_path = "index/usgs_grandbay_klein3900_sidescan_xtf_u16/samples.jsonl"
summary = "Range-fetch 24 pinned Klein SonarPro XTF members from the USGS archive, walk their XTF packets, and emit each recording file's sonar pings as one ping-major [port 4096 | starboard 4096] little-endian uint16 array."
deterministic_notes = "Selection rule (scripts/xtf_sidescan.py list-band + discover, reproducible with discover.sh): of the 143 .xtf members, every file is a 1,024-byte XTF header followed by N pairs of one 832-byte Klein HeaderType-108 record and one 16,768-byte HeaderType-0 sonar ping, so N = (uncompressed_size - 1024) / 17600 exactly. Keep members with 1000 <= N < 2700 pings (25 members, about 2.2-6.0 minutes at 0.1333 s per ping), then drop members whose sonar pings are not in the majority configuration (2 channels, 4096 samples, channel frequency field 100, slant range 100 m); this removes 15CCT03_SSS_150528180500.xtf (frequency field 500). The band exists because full 30-minute SonarPro rollover files hold about 13,400 pings (about 220 MB of primary data each) and the 1 GB cap would allow only four of them; the band yields 24 complete recording files across six of the seven survey days. The result is pinned in sources.tsv with ZIP offsets, sizes, and CRC32. build.sh re-checks the configuration on every ping and fails on any deviation. Output order follows sources.tsv, ping order follows the file, and sample bytes are verbatim copies of the XTF channel payloads."

[[series]]
id = "klein_sidescan_port_stbd_backscatter_u16"
description = "Raw side-scan sonar backscatter amplitudes from complete Klein SonarPro XTF recording files, port and starboard channels interleaved per ping."
semantic_meaning = "Unprocessed side-scan sonar echo amplitude (raw uint16 counts, 12-13 effective bits, realized range 0 to 4,685) received by the port and starboard transducers of a towed Klein 3900 towfish over an estuarine seafloor, sampled at 4096 slant-range bins per channel per ping out to 100 m slant range, about 7.5 pings per second. Stored orientation: port samples run from far range (port[0], about 100 m slant range) to nadir (port[4095]); starboard samples run from nadir (stbd[0]) to far range (stbd[4095]). Each ping row therefore runs port-far, through nadir, to starboard-far as one continuous across-track line."
role = "primary"
representation_class = "native_numeric"
representation_notes = "XTF CHANINFO declares BytesPerSample = 2 for both sonar channels and the samples are stored as little-endian 16-bit integers; they are copied verbatim, without scaling, gain correction, slant-range correction, or reordering. No widening: the native storage width is 16 bits. CHANINFO UniPolar = 0, but every stored value lies in 0..4,685, so the bytes read identically as uint16 or int16; uint is the honest kind for echo envelope amplitudes."
source_resources = ["xtf_archive_selected_members"]
source_format = "Triton eXtended Triton Format (XTF, FileFormat 0x7B) written by Klein SonarPro 12 (RecordingProgramName 'KleinXlt' 4.0)"
source_field = "HeaderType-0 sonar ping packets: the NumSamples x uint16 sample array following each XTFPINGCHANHEADER for ChannelNumber 0 (CHANINFO TypeOfChannel 1, port) and ChannelNumber 1 (TypeOfChannel 2, starboard)"
filtered_input_path = "filtered/usgs_grandbay_klein3900_sidescan_xtf_u16/build_stats.json"
filtering = "The 24 members of sources.tsv (selection rule in processing.deterministic_notes). Within each file every HeaderType-0 ping is kept; HeaderType-108 Klein auxiliary records (832 bytes of navigation/status fields, e.g. float64 latitude and longitude in radians; no sonar sample arrays) and any other packet types are skipped. The 256-byte ping headers and 64-byte channel headers (navigation, timing, gain) are not emitted."
missing_value_policy = "No values are dropped, imputed, or rescaled. Zero is preserved wherever it occurs. Structural zeros: the first 7 port samples and the last 7 starboard samples of every ping (the far-range end of each channel) are always 0 in the source. They are 14/8192 = 0.17% of values, are kept verbatim, and account for most of the 0.25% per-file zero floor; verify.sh fails if any ping deviates. Other zeros are legitimate low-amplitude readings (water column, weak or shadowed seafloor). A missing 0xFACE magic, an inconsistent NumBytesThisRecord, a ping with a channel count, channel order, NumSamples, frequency field, or slant range outside the canonical configuration, a ping count different from the pinned value, or a channel that is all zero, more than half zero, or has fewer than 64 distinct values fails build and verify."
conversion = "Walk packets from byte 1024 by NumBytesThisRecord, asserting 0xFACE at each step. For each HeaderType-0 ping, check that the record length equals 256 + sum(64 + 2 x NumSamples) rounded up to 64 bytes, then append the port array (4096 uint16) followed by the starboard array (4096 uint16) in stored order, without reordering: port runs from far range (port[0], about 100 m slant range) to nadir (port[4095]) and starboard from nadir (stbd[0]) to far range (stbd[4095]), so each 8192-value ping row runs port-far, through nadir, to starboard-far. One output file per XTF recording file, shape [pings, 2, 4096], little-endian uint16."
numeric_kind = "uint"
bit_width = 16
endianness = "little"
sample_format = "raw little-endian uint16 array, ping-major [ping][port, starboard][stored sample index: port far-to-nadir, starboard nadir-to-far]"
sample_geometry = "sidescan_waterfall_ping_by_channel_by_slant_range_sample"
sample_rank = 3
sample_axes = ["ping", "channel_port_then_starboard", "stored_sample_index_port_far_to_nadir_stbd_nadir_to_far"]
natural_record_kind = "complete_klein_sonarpro_xtf_recording_file"
