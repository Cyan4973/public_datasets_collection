notes = "scripts/inventory.tsv pins date, key, size and single-part MD5 ETag of every file. The SHA-256 of the inventory (6ffd557f3076b29686bd176f3e9b1233c60b8e83af780db72241dfb23e984c75) is pinned in scripts/oisst_sst.py. discover.sh rebuilt it from the 60 monthly ListObjectsV2 pages and required every month to be complete (all calendar days present) and final (no '_preliminary' objects). Excluded: '_preliminary' files, all other dates, data/v2.1 outside 2020-2024, and the anom, err, ice, lat, lon, time and zlev variables."

