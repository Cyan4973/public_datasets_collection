verify_script = "verify.sh"
sample_index_path = "index/nasa_pds_m2020_supercam_libs_mic_audio_i16/samples.jsonl"
summary = "Fetch 634 pinned SuperCam raw-audio FITS products, validate MD5 and FITS structure, walk the HDUs to the final SOUND binary table, and emit its 174,000 big-endian int16 stored codes plus TZERO 32768 as one little-endian uint16 sample per recording."
deterministic_notes = "Selection (discover.sh, scripts/m2020mic.py): candidates = all 12,220 data_raw_audio FITS products under 1,000,000 bytes, sorted by file name (sol, then SCLK); split into 800 equal consecutive windows; in each window the first product (in order) is taken whose primary header has MIC_SAMP=100000, MIC_SAMC=21, MIC_DOWN=F, MIC_GAIN=2, MIC_DURA=1, HSS_NUMW=174000, LIBS_MIC=T, LASDNS00=30, SCMDTYPE=9 and whose final HDU header is EXTNAME SOUND, BINTABLE, NAXIS1=2, NAXIS2=174000, TFIELDS=1, TFORM1='I', TZERO1=32768. 634 windows resolved; 166 windows held only gain-1/gain-3 or other-length products and contribute nothing (probe rejections: 3,495 MIC_GAIN=1, 263 MIC_GAIN=3, 93 HSS_NUMW=294000, 65 too small). Build and verify re-check every keyword, require exactly one SOUND HDU, last in the file, at the pinned offset, with zero padding after the data. Quality policy (build and verify): a recording with fewer than 64 distinct values or one value above 50% of samples is dropped and logged (dead or stuck microphone); none is patched or clipped. Output order = sources.tsv ordinal. verify.sh re-derives each sample with an independent parser and byte-compares, and checks index fields and manifest totals."

[[series]]
id = "supercam_mic_libs_100khz_gain2_u16"
description = "Raw SuperCam microphone pressure waveform, 100 kHz, gain setting 2, 174,000 samples per recording of a 30-shot LIBS burst. In the inspected products the laser-spark shock transients recur every ~6,000 samples (60 ms) although the laser fires at a few Hz, consistent with the instrument storing a short acquisition window per shot back-to-back (not confirmed against the SIS); shots that miss or are weak leave only wind/ambient noise in their window."
semantic_meaning = "Uncalibrated microphone ADC codes (physical FITS value = stored int16 + TZERO 32768): acoustic pressure fluctuations in the ~6 hPa CO2 Martian atmosphere sensed by the SuperCam microphone on the Perseverance remote-sensing mast. The level sits near 1,880 counts with LIBS shock waves reaching hundreds of counts away from it."
role = "primary"
representation_class = "native_numeric"
representation_notes = "FITS stores unsigned 16-bit columns as TFORM 'I' with TZERO 32768 (the PDS4 label calls it SignedMSB2 with value_offset 32768). The emitted value is the physical uint16 ADC code (stored + 32768, identical to flipping the sign bit), the instrument's own reading; stored signed codes would be an offset artifact of the FITS convention (all near -30,900). No scaling, filtering, resampling or calibration."
source_resources = ["supercam_raw_audio_products"]
source_format = "PDS4 FITS 4.0 raw-audio product (LS__*_LUJnn.fits); final binary-table extension EXTNAME 'SOUND'"
source_field = "SOUND table column 'Sound' (TFORM1 'I', TZERO1 32768, 174,000 rows)"
filtered_input_path = "filtered/nasa_pds_m2020_supercam_libs_mic_audio_i16/build_summary.json"
filtering = "Only the SOUND HDU column is emitted; primary header, ODL label, TIMELINE, MU_SOH, BU_SOH and LASERDATA HDUs are read for validation only. Only one recording configuration is kept: 100 kHz, not downsampled, gain 2, 174,000 words, 30-shot LIBS+MIC activity."
missing_value_policy = "The SOUND column declares no TNULL and has no fill value; all 174,000 rows are emitted unchanged. A structurally different product (wrong keyword, SOUND not final, wrong row count or padding) is fatal in download, build and verify. Recordings failing the quality policy (fewer than 64 distinct values, or one value above 50%) are dropped and listed in build_summary.json; verify recomputes the same rule and requires the same set."
conversion = "Walk the 2,880-byte FITS header blocks to the final HDU, check the SOUND header, read 348,000 bytes of big-endian int16 from its data start, add 32768 to each value and write uint16 little-endian. One sample file per FITS product (one natural recording); no cropping, concatenation or resampling."
numeric_kind = "uint"
bit_width = 16
endianness = "little"
sample_format = "raw homogeneous uint16 mono PCM waveform"
sample_geometry = "audio_waveform_1d"
sample_rank = 1
