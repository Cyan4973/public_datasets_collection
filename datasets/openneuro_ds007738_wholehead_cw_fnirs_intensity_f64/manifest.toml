[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/openneuro_ds007738_wholehead_cw_fnirs_intensity_f64/samples.jsonl"
summary = "Validate license/snapshot and the paginated S3 listing against runs.tsv, walk each resting-state SNIRF file's HDF5 metadata over cached 1 MiB byte ranges, fetch only the contiguous /nirs/data1/dataTimeSeries range, and emit that matrix unchanged as one little-endian float64 sample per run."
deterministic_notes = "Scope: every *_task-resting_run-01_nirs.snirf in ds007738 1.0.0 (24 runs, one per subject); task runs and other OpenNeuro fNIRS datasets are excluded. runs.tsv pins key, size and ETag (plus data offset/bytes/time points/SHA-256 once realized). The dataset address and size are resolved at download time from the HDF5 metadata (no hard-coded offset). The reader requires superblock v0, v1 object headers, symbol-table groups, SNIRF formatVersion '1.0', exactly /nirs/data1 with links dataTimeSeries, time and measurementList1..1134, a contiguous unfiltered H5T_IEEE_F64LE (T x 1134) dataset whose size is T*1134*8, a time vector of length T, every measurementList dataType = 1, wavelengths (760, 850) and a channel table (sourceIndex, detectorIndex, wavelengthIndex, dataType, dataTypeIndex per channel) whose SHA-256 equals d8099a28416f150446e432cbe1363c73b9cca2abfdafe9e15f9fb1a8d3eaf987 in every run, so channel order is identical across samples. build.sh and verify.sh run a synthetic SNIRF self-test first; verify.sh re-walks the metadata by path resolution, byte-compares every sample and recomputes every statistic."

[[series]]
id = "cw_fnirs_raw_intensity_f64"
description = "Raw continuous-wave fNIRS optical intensity of a whole-head high-density array (56 sources, 144 detectors, 1134 channels at 760/850 nm), one complete 5-minute resting-state recording per sample."
semantic_meaning = "Detected CW near-infrared light intensity (SNIRF measurementList dataType 1, 'CW amplitude', arbitrary instrument units, range 0 to 0.94) per source-detector-wavelength channel and time frame, sampled at ~8.99 Hz during 5+ minutes of central fixation without a task. Channels mix two wavelengths and short to long source-detector separations within each frame, identically ordered in every sample."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The SNIRF dataset is declared H5T_IEEE_F64LE and every stored bit pattern is copied unchanged. Width disclosure: within a channel the values behave like integer-like mantissas of at most 24 bits times one float64 per-channel scale (ratio/LCM test, realized: 57-99% of testable channels per run pass LCM <= 24 bits at <= 1e-15 error, per-run median LCM 11-21 bits), so they are not 53-bit-entropy measurements; but only the exact zeros (0.037%) are float32-exact, so the matrix cannot be narrowed to float32 without storing per-channel scales. build records the test per sample in the index."
source_resources = ["resting_snirf_ranges"]
source_format = "SNIRF 1.0 (HDF5, superblock v0) contiguous unfiltered H5T_IEEE_F64LE 2-D dataset"
source_field = "/nirs/data1/dataTimeSeries (all 1134 measurementList channels have dataType 1 = raw CW amplitude)"
filtered_input_path = "filtered/openneuro_ds007738_wholehead_cw_fnirs_intensity_f64/ingest_stats.json"
filtering = "All 24 resting-state runs (sub-01..05, 10, 11, 13, 14, 15, 18, 20, 22, 23, 24, 25, 28, 29, 32, 33, 35, 41, 44, 46), the whole matrix of each: every time frame and every channel, no channel selection, trimming or quality filtering. Excluded: task runs (overt, covert, visualorient, longvisualorient/videoattend), the time vector, aux eye-tracking channels, stim, probe geometry, metaDataTags and every other OpenNeuro fNIRS dataset."
missing_value_policy = "Values are preserved bit for bit, including the instrument's 1e-6 floor (dark or saturated long-separation channels: 3.02% of all values, 0.18-15.4% per run) and exact zeros (0.037% overall). Runs sub-20 onward store the quiet NaN 0xFFF8000000000000 (sign bit set, numpy default; no other NaN pattern is accepted) in most channels of the first frame (realized: 908-1,063 of 1,134 values, frame 0 only, in the 13 runs sub-20..sub-46; none in the 11 runs sub-01..18; 0.016% of all values); these NaNs are kept as stored and counted. Fatal: any other NaN payload, +-Inf, NaN above 0.5% of a sample, a constant matrix, fewer than 20% distinct values, more than a quarter of channels constant, a changed shape, dtype, filter, channel layout, wavelength, pin or range checksum."
conversion = "Resolve the dataset's contiguous address and size from the HDF5 object header, fetch exactly that byte range, check the size equals T*1134*8, and write the bytes unchanged (native little-endian float64) to <subject>_task-resting_run-01_dataTimeSeries.bin. Order is the stored row-major order: time-major, i.e. all 1134 channels of frame 0, then frame 1, and so on; the index records sample_shape [T, 1134]."
numeric_kind = "float"
bit_width = 64
endianness = "little"
sample_format = "raw homogeneous little-endian float64 matrix, row-major (time, channel)"
sample_geometry = "fnirs_time_by_channel_matrix_2d"
sample_rank = 2
sample_axes = ["time_frame", "measurement_channel"]
natural_record_kind = "one_complete_resting_state_fnirs_run_intensity_matrix_time_major"
sample_count = 24
total_size_bytes = 646624944
output_path = "samples/openneuro_ds007738_wholehead_cw_fnirs_intensity_f64/cw_fnirs_raw_intensity_f64/"
