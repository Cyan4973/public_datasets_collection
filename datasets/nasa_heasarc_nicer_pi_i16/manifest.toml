deterministic_notes = "Exact source URLs, sizes, hashes, gzip integrity, FITS/NICER/XTI identity, OBS_ID, event-table geometry, all column widths, PI TFORM/scaling/unit/null semantics, fixed minimum-row selection, output uniqueness, per-sample distributions and hashes, and independent source-to-output byte equality are enforced."

[[series]]
id = "nicer_xray_pi_channel_i16"
description = "Pulse-invariant detector energy-channel sequences for complete cleaned NICER X-ray observations."
semantic_meaning = "Calibrated pulse-invariant X-ray detector channel assigned to each temporally ordered photon event in a cleaned NICER/XTI observation."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The NICER EVENTS binary table declares PI as FITS TFORM=1I: one signed 16-bit integer per event, with TSCAL=1, TZERO=0, TNULL=-32768, and unit chan."
source_resources = ["nicer_june_2017_cleaned_event_files"]
source_format = "gzip-compressed FITS with OGIP EVENTS binary table"
source_field = "EVENTS.PI scalar FITS 1I column"
filtered_input_path = "filtered/nasa_heasarc_nicer_pi_i16/ingest_stats.json"
filtering = "Start from 36 pinned June 2017 cleaned observations selected by lexicographic observation ID before payload analysis. Keep all 31 observations whose complete EVENTS table contains at least 1,000 rows; exclude three empty tables and two tables with 21 and 389 events."
missing_value_policy = "Preserve the source-declared signed-int16 TNULL value -32768 if present. No selected observation contains that sentinel. No selected PI event is dropped or imputed."
conversion = "Extract every PI word in source event-row order and byte-swap FITS big-endian signed-int16 storage to canonical little-endian signed-int16. No scaling, calibration arithmetic, sorting, clipping, padding, splitting, or concatenation is applied."
numeric_kind = "int"
bit_width = 16
endianness = "little"
sample_format = "raw homogeneous little-endian signed-int16 NICER PI channel array"
sample_geometry = "variable_length_xray_photon_event_channel_1d"
