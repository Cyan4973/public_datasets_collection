manifest_version = 1
dataset_id = "nihcc_chestxray14_frontal_radiograph_png_u8"
name = "NIH Clinical Center ChestX-ray14 Frontal Chest Radiographs (1024x1024 8-bit grayscale) UInt8"
description = "Frontal-view (PA/AP) chest X-ray images from the NIH Clinical Center ChestX-ray14 release, decoded from the official 1024x1024 8-bit grayscale PNGs: every whole PNG member inside a pinned 14 MiB prefix of each of the 12 official images_NNN.tar.gz tarballs, one raw uint8 image per sample."
homepage = "https://nihcc.app.box.com/v/ChestXray-NIHCC"

[license]
name = "NIH Clinical Center unrestricted use with attribution (ChestX-ray14 FAQ Q04)"
spdx = "LicenseRef-NIHCC-ChestXray14-unrestricted-attribution"
url = "https://nihcc.app.box.com/v/ChestXray-NIHCC"
citation = "Xiaosong Wang, Yifan Peng, Le Lu, Zhiyong Lu, Mohammadhadi Bagheri, Ronald M. Summers. ChestX-ray8: Hospital-scale Chest X-ray Database and Benchmarks on Weakly-Supervised Classification and Localization of Common Thorax Diseases. IEEE CVPR 2017, pp. 3462-3471. Data: NIH Clinical Center, https://nihcc.app.box.com/v/ChestXray-NIHCC"
notes = "FAQ_CHESTXRAY.pdf in the official NIH CC Box folder (72,223 bytes, SHA-256 674665256e6a14c8ebaa93648f438c2b4ca21205167839559bab3ecc89b6b83a) answers 'Q 04: Are there any restrictions in using this dataset?' with: 'The usage of the data set is unrestricted. But you should provide the link to our original download site, acknowledge the NIH Clinical Center and provide a citation to our CVPR 2017 paper.' download.sh fetches the PDF anonymously on every run and fails unless the size, SHA-256 and the extracted Q04 sentence still match. Released by a US federal agency (NIH Clinical Center). This is an explicit unrestricted-use grant with an attribution request, not a named SPDX licence; hence the LicenseRef identifier."

[safety]
contains_sensitive_data = true
contains_personal_data = false
provenance_notes = "Official NIH Clinical Center release on its Box share; no mirrors. De-identified clinical chest radiographs extracted by NIH from the hospital PACS and published as PNGs (the CVPR 2017 paper and the dataset README describe the de-identification). Tar member names (images/<8-digit patient index>_<3-digit follow-up>.png) carry NIH's public pseudonymous patient index only."
usage_notes = "Samples contain only pixel values. The index keeps the tar member name for provenance; the disease labels (Data_Entry_2017.csv), bounding boxes, patient age/sex and view position are not downloaded or emitted. Do not attempt re-identification or linkage. Provide the link to the original download site, acknowledge the NIH Clinical Center and cite the CVPR 2017 paper."

