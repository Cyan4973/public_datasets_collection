dataset_id = "nasa_heliocloud_trace_171_euv_frames_i16"
name = "TRACE 171 A Full-Frame 1024x1024 EUV Images from Near-Lossless Onboard-JPEG Programs, 1998 (int16, HelioCloud SDAC)"
description = "Whole 1024 x 1024 int16 images of the Sun in the Fe IX/X 171 A passband from NASA's TRACE telescope (amplifier A, unsummed, full CCD, 0.5 arcsec pixels), April-October 1998, as archived by SDAC in NASA GSFC HelioCloud after trace_prep dark subtraction and flat-fielding; restricted to frame programs that used the near-lossless onboard JPEG table (FRM_NAM allowlist, confirmed by a per-frame ringing test) and to frames with no empty near-zero histogram bin."
homepage = "https://sdowww.lmsal.com/TRACE/"

[license]
name = "TRACE open data policy; NASA SMD Open Scientific Data Policy"
spdx = "LicenseRef-NASA-SMD-Open-Data"
url = "https://sdowww.lmsal.com/TRACE/Data/DataArchive/dapolicy.htm"
citation = "TRACE (Transition Region and Coronal Explorer) was a NASA Small Explorer mission built and operated by the Lockheed Martin Solar and Astrophysics Laboratory. Handy et al. 1999, Solar Physics 187, 229 (The Transition Region and Coronal Explorer). Data served by the NASA GSFC HelioCloud (gov-nasa-hdrl-data1, SDAC holdings)."
notes = "TRACE data policy page (https://sdowww.lmsal.com/TRACE/Data/DataArchive/dapolicy.htm, HTTP 200 on 2026-10-09; download.sh re-fetches it best effort into downloads/<id>/evidence/trace_dapolicy.htm): 'One feature of the TRACE mission is the open data policy. ... Our fundamental data policy is simple: All TRACE data will be equally available to everyone on the World Wide Web.' The page names no formal license, copyright or attribution clause. NASA basis, as for the accepted nasa_heliocloud_iris_l1_fuv_frames_i16 recipe in the same bucket: the NASA SMD Science Information Policy (https://science.nasa.gov/researchers/science-data/science-information-policy/, fetched best effort by download.sh) states that 'NASA holds this information, including publications, data, and software, as a public trust' and that SMD-funded mission data be made publicly available. TRACE was an SMD Heliophysics Small Explorer; these files are its archived science images served anonymously by NASA GSFC's HelioCloud bucket (no README or license object exists under sdac/trace/). These are open-data policies, not a named license. NASA guidance forbids attributing outputs to NASA or using NASA insignia; cite the mission as above."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official NASA GSFC HelioCloud public bucket (anonymous HTTPS, not requester-pays), SDAC TRACE holdings; images of the solar corona."
usage_notes = "Samples contain only calibrated CCD counts of the Sun in extreme ultraviolet. No personal, human-subject or Earth-observation data. Do not attribute model outputs to NASA or use NASA insignia."

