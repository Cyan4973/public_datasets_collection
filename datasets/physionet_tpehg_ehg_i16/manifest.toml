[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/physionet_tpehg_ehg_i16/samples.jsonl"
summary = "Fetch all 300 TPEHG DB WFDB records, validate them against the official SHA256SUMS.txt and the fixed 12-signal format-16 layout, deinterleave the three unfiltered bipolar channels (signal indices 0, 4, 8) and emit one canonical little-endian int16 sample per channel per record, routed to the step1 or step16 series by the record's ADC code lattice."
deterministic_notes = "Pinned: SHA256SUMS.txt sha256 (transitively every source file), 300 records, 255,741,624 .dat bytes, 302,194 .hea bytes, 10,655,901 frames, 900 samples, 31,967,703 values, 63,935,406 primary bytes; per series 174 records / 18,356,100 values (step1) and 126 records / 13,611,603 values (step16). Every header must declare 12 signals in the fixed order 1, 1_DOCFILT-4-0.08-4, 1_DOCFILT-4-0.3-3, 1_DOCFILT-4-0.3-4, 2, ..., 3_DOCFILT-4-0.3-4, each format 16, gain 13107/mV, ADC resolution 16, ADC zero 0, block size 0, and sampling frequency exactly '20.000000' or '20.000110', recorded as-is. The two header frequency strings coincide exactly with two ADC code lattices (measured on all 900 channels on 2026-10-05): every '20.000000' channel uses all 16 residues mod 16 with the two most common holding at most 0.157 of values; every '20.000110' channel uses exactly two adjacent residues mod 16. The frequency string routes a record to its series, and build and verify both assert the lattice for every channel (step1: 16 residues and top-2 share <= 0.5; step16: at most two adjacent residues). The initial value and 16-bit WFDB checksum of all 12 signals are checked. Samples are written in RECORDS order, channels 1, 2, 3. verify.sh re-derives everything with a separate parser and struct-based little-endian decoder and compares all sample bytes and index fields."

[[series]]
id = "tpehg_ehg_unfiltered_adc_step1_i16"
description = "Unfiltered bipolar abdominal electrohysterogram (uterine EMG) waveforms with full 16-bit ADC codes, about 30 minutes at 20 Hz, one complete channel of one TPEHG DB recording per sample (the 174 records whose header says 20.000000 Hz)."
semantic_meaning = "Successive raw signed 16-bit ADC codes of the potential difference between two abdominal surface electrodes (S1 = E2-E1, S2 = E2-E3, S3 = E4-E3, electrodes 3.5 cm from the navel), digitized at 20 Hz over +/-2.5 mV (13107 ADC units per mV, ADC zero 0). Only analog acquisition filtering precedes digitization; these are the database's 'unfiltered' channels. In these records the codes use the full step-1 lattice."
role = "primary"
representation_class = "native_numeric"
representation_notes = "WFDB format 16 stores two-byte little-endian two's-complement integers. Values are the stored ADC codes, not converted through the gain to physical units. The nine '*_DOCFILT-*' signals in the same frames are offline 4-pole Butterworth band-pass derivatives of these channels and are excluded."
source_resources = ["tpehgdb_wfdb_records"]
source_format = "WFDB format 16, 12 frame-interleaved signals per .dat"
source_field = "WFDB signals '1', '2', '3' (signal indices 0, 4, 8): unfiltered EHG channels S1, S2, S3"
filtered_input_path = "filtered/physionet_tpehg_ehg_i16/ingest_stats.json"
missing_value_policy = "No values are dropped, clipped, or imputed. WFDB's -32768 invalid-sample code and the +32767 rail are preserved unchanged and counted per sample in the index (saturated_low_count, saturated_high_count; none occur in this release). A missing file, checksum mismatch, layout deviation, lattice mismatch, constant or degenerate channel (fewer than 32 distinct values, fewer than 5% value changes, or more than 50% rail values), or duplicate sample fails the recipe."
numeric_kind = "int"
bit_width = 16
endianness = "little"
sample_format = "raw homogeneous little-endian signed-int16 ADC sequence"
sample_geometry = "variable_length_biopotential_waveform_1d"
sample_rank = 1
sample_axes = ["time_sample"]
natural_record_kind = "complete_tpehg_recording_unfiltered_bipolar_channel"
filtering = "The 174 records whose header sampling frequency is '20.000000', all frames, the three unfiltered channels of each; every channel must use all 16 residues mod 16 with the two most common holding at most half of the values. The DOCFILT signals, header comments, tpehgdb.smr, .fvl feature files and the PDF are not emitted."
conversion = "Read each .dat as frames x 12 little-endian int16, take every 12th value starting at signal index 0, 4, and 8, and write each channel unchanged as canonical little-endian int16 to samples/physionet_tpehg_ehg_i16/tpehg_ehg_unfiltered_adc_step1_i16/<record>_ch<1|2|3>.bin. One sample is one complete channel of one recording; records and channels are never concatenated or split."
sample_count = 522
total_size_bytes = 36712200
output_path = "samples/physionet_tpehg_ehg_i16/tpehg_ehg_unfiltered_adc_step1_i16/"

[[series]]
id = "tpehg_ehg_unfiltered_adc_step16_i16"
description = "Unfiltered bipolar abdominal electrohysterogram (uterine EMG) waveforms whose ADC codes lie on a step-16 lattice, about 30 minutes at 20 Hz, one complete channel of one TPEHG DB recording per sample (the 126 records whose header says 20.000110 Hz)."
semantic_meaning = "Successive raw signed 16-bit ADC codes of the same bipolar abdominal EHG channels at the same 13107 units/mV scale, 20 Hz and +/-2.5 mV range. In these records every stored value falls on two adjacent residues mod 16, so the effective resolution is about 12 bits scaled by 16 into the 16-bit code range; they appear to come from a different acquisition setup (the headers also give a different nominal clock, 20.000110 Hz). They are kept as their own series so that no series mixes code lattices."
role = "primary"
