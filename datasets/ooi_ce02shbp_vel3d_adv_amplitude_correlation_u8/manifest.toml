[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/ooi_ce02shbp_vel3d_adv_amplitude_correlation_u8/samples.jsonl"
summary = "Strip OOI port-agent framing (type-1 frames, XOR-checksummed), reassemble the Nortek Vector byte stream, keep checksum-valid Velocity Data packets (0xA5 0x10), and emit per-day beam-planar uint8 amplitude and correlation arrays."
deterministic_notes = "Deployment window 2025-08-28 16:55 UTC (post-turnaround restart) to 2026-08-08 (an instrument swap on 2026-08-09 moves heading 134.8->265 deg, battery 11.5->11.7 V, and pins beam-2 amplitude at 71). Day selection: 2025-09-01 + 6k days, k=0..56, except 2026-02-10 is replaced by 2026-02-11 (that file switches from binary port-agent framing to text <OOI-TS> delimiters at 20:17:31 UTC and fails the strict deframer); all selected files are complete ~31.45 MB days. Nortek configuration packets (0xA5 0x00/0x04/0x05) never appear in the archived streams, so deployment identity is enforced per day from Vector System Data: status byte 0x63 (orientation/scaling/power-level bits) for >=99.9% of packets and median heading 128-140 deg, pitch -3..7 deg, roll -3..6 deg. Per day: every port-agent frame XOR-valid and contiguous to EOF, timestamps inside the UTC day, 690,000-692,000 velocity records (8 Hz nominal 691,200), checksum-failed velocity candidates <=0.01%, unparsed stream bytes <=0.1%, count-byte gaps <=20, every beam >=8 distinct values and no value above 75% share (clear-water noise-floor days reach 53.6%). Sample order is sources.tsv order."

[[series]]
id = "vel3d_beam_amplitude_u8"
description = "Nortek Vector per-beam acoustic return-signal amplitude, beam-planar per UTC day."
semantic_meaning = "Received acoustic signal strength of each of the three receive beams for every 8 Hz ping of the VEL3D-C point velocimeter at the Oregon-shelf seafloor (instrument counts on a roughly logarithmic intensity scale)."
role = "primary"
representation_class = "native_numeric"
representation_notes = "Vector Velocity Data packet bytes 16-18 (AmpB1..AmpB3) are unsigned 8-bit counts; copied unchanged."
source_resources = ["vel3dc108_day_files"]
source_format = "OOI port-agent framed Nortek Vector binary stream"
source_field = "Vector Velocity Data (0xA5 0x10) AmpB1, AmpB2, AmpB3"
filtered_input_path = "filtered/ooi_ce02shbp_vel3d_adv_amplitude_correlation_u8/ingest_stats.json"
filtering = "All checksum-valid Velocity Data packets of each selected complete UTC day; system, header and non-instrument frames are dropped."
missing_value_policy = "No values are imputed or substituted. Velocity packets failing the Nortek checksum are skipped (bounded at 0.01% per day); framing errors, out-of-window timestamps, record-count shortfalls, deployment-guard failures or degenerate beams fail the recipe."
conversion = "Deframe port-agent type-1 payloads, scan the reassembled stream for checksum-valid 24-byte Velocity Data packets, and write [beam1 all records][beam2 all records][beam3 all records] as raw uint8 in packet order."
numeric_kind = "uint"
bit_width = 8
endianness = "little"
sample_format = "raw homogeneous uint8 beam-planar amplitude array"
sample_geometry = "beam_by_time_2d"
sample_rank = 2
sample_axes = ["beam", "velocity_record"]
natural_record_kind = "complete_utc_day_vel3d_port_agent_file"
sample_count = 57
total_size_bytes = 118195383
output_path = "samples/ooi_ce02shbp_vel3d_adv_amplitude_correlation_u8/vel3d_beam_amplitude_u8/"

