notes = "One member per selected scene: <scene>/images/scene_<cam>_geometry_hdf5/frame.NNNN.normal_cam.hdf5 (about 0.5-2.2 MB each). Validated by local-header name, the central-directory CRC-32 and a full HDF5 decode; the per-member offset, size, CRC-32 and sha256 are recorded in a JSON sidecar. size_bytes is 0 because member sizes are resolved from each zip's central directory at download time (the zip sizes themselves are pinned)."

