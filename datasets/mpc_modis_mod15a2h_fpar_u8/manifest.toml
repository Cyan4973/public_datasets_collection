notes = "The Planetary Computer collection modis-15A2H-061 has rel=license link https://lpdaac.usgs.gov/data/data-citation-and-policies/, which redirects to NASA Earthdata 'Data Use Guidance' (https://www.earthdata.nasa.gov/engage/open-data-services-software-policies/data-use-guidance): 'Unless the content is marked with a use restriction or license, data provided from a NASA-led mission are licensed as Creative Commons Zero (CC0). While there are no restrictions on the use of these data, data users are very strongly urged to cite the data used in their work products.' The STAC collection names NASA LP DAAC at the USGS EROS Center as producer and licensor; MOD15A2H carries no product-specific restriction. The STAC 'license' field reads 'proprietary' only as a pointer to that link (same evidence chain as the accepted modis_active_fire_mask_u8 and mpc_modis_mod13a1_ndvi_i16). Preserve the DOI (embedded in every file as identifier_product_doi), NASA/LP DAAC attribution, collection version, item IDs, and dates."

[safety]
