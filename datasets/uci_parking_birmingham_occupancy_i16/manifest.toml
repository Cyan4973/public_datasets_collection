summary = "Validate the official UCI source and emit one little-endian signed-int16 reported-occupancy timeline per complete facility code."
deterministic_notes = "Metadata, rights page, archive, and extracted CSV are pinned by exact size and SHA-256. The parser requires the documented four-column schema, stable positive facility capacity, signed-int16 occupancy, nondecreasing timestamps within each facility, byte-semantically identical fields for same-timestamp duplicate rows, nonconstant complete timelines, aggregate and median-sample floors, and fresh source/output byte comparison. Negative and above-capacity source readings are preserved and characterized."

[[series]]
id = "parking_facility_occupancy_i16"
description = "Complete occupied-space count timeline for one Birmingham parking-facility system code."
semantic_meaning = "Source-reported number of occupied parking spaces at each successive observation for one facility, including signed sensor/reporting anomalies."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The CSV stores occupancy as exact signed decimal integers ranging below zero for a small number of source anomalies. Values are preserved exactly and encoded in the smallest corpus integer width that covers the validated source range."
source_resources = ["parking_birmingham_archive", "uci_482_metadata", "uci_482_rights_page"]
source_format = "UCI comma-separated parking-occupancy table"
source_field = "Occupancy integer column for each SystemCodeNumber facility"
filtered_input_path = "filtered/uci_parking_birmingham_occupancy_i16/ingest_stats.json"
filtering = "Keep every valid source-order Occupancy value for every facility code. Facility code, Capacity, and LastUpdated are used only to validate natural boundaries and temporal order."
missing_value_policy = "Missing fields, malformed integers or timestamps, backward time, conflicting same-timestamp duplicates, changing or nonpositive facility capacity, occupancy outside signed-int16 range, constant timelines, insufficient median natural-sample length, or stale outputs fail the recipe. Exact duplicate, negative, and above-capacity source readings are preserved in order; no values are dropped or imputed."
conversion = "Parse each exact signed decimal occupancy integer, validate -32768 <= occupancy <= 32767, and write it as a little-endian signed int16 while preserving observation order within its facility."
numeric_kind = "int"
bit_width = 16
endianness = "little"
sample_format = "raw homogeneous signed-int16 facility-utilization timeline"
sample_geometry = "parking_facility_time_series_1d"
sample_rank = 1
sample_axes = ["observation_time"]
natural_record_kind = "complete_parking_facility_timeline"
sample_count = 30
total_size_bytes = 71434
output_path = "samples/uci_parking_birmingham_occupancy_i16/parking_facility_occupancy_i16/"
