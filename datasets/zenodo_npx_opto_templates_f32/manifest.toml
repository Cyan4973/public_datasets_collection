deterministic_notes = "Record identity, CC BY 4.0 license, parent archive sizes and MD5 metadata, ZIP/ZIP64 central and local headers, exact member paths/sizes/CRC32, NPY version/dtype/shape/order, full payload hashes, value distributions, finiteness, sparsity, sample/template uniqueness, and byte-exact independent verification are enforced."

[[series]]
id = "npx_opto_kilosort_templates_f32"
description = "Kilosort 4 spike-waveform template tensors for mouse Neuropixels Opto recording sessions."
semantic_meaning = "Mean extracellular spike-waveform templates arranged by Kilosort template identity, 61 waveform time samples, and the session's retained probe channels."
role = "primary"
representation_class = "native_numeric"
representation_notes = "Every selected NPY member declares little-endian float32 (`<f4`) in C order. The recipe removes only the 128-byte NPY header and preserves the complete numeric payload byte-for-byte."
source_resources = ["npx_opto_ks097_zip_ranges", "npx_opto_optopus010_zip_ranges", "npx_opto_optopus012_zip_ranges", "npx_opto_optopus013_0228_zip_ranges", "npx_opto_optopus013_0303_zip_ranges", "npx_opto_optopus013_0305_zip_ranges", "npx_opto_optopus013_0306_zip_ranges"]
source_format = "Deflate-compressed NPY v1.0 members inside ZIP/ZIP64 session archives"
source_field = "raw_ephys_data/probe00/kilosort4.0_spks_2/templates.npy float32 payload"
filtered_input_path = "filtered/zenodo_npx_opto_templates_f32/ingest_stats.json"
filtering = "Keep all 4,363 Kilosort templates, all 61 waveform samples, and all retained channels from each of 14 sessions. Exclude NPY headers, ZIP framing, spike/event tables, behavioral metadata, and other derived arrays."
missing_value_policy = "No template values are dropped or imputed. Changed archive/member identity, malformed ZIP/ZIP64 or NPY structures, wrong dtype/order/shape, non-finite values, degenerate or duplicate templates, duplicate samples, or unexpected aggregate statistics fail the recipe."
conversion = "Inflate each exact ZIP member, validate its NPY header, remove the 128-byte header, and copy the complete little-endian float32 C-order payload verbatim."
numeric_kind = "float"
bit_width = 32
endianness = "little"
