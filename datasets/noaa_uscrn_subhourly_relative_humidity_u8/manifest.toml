[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/noaa_uscrn_subhourly_relative_humidity_u8/samples.jsonl"
summary = "Download all 159 USCRN subhourly01 2024 station-year text files, keep the RELATIVE_HUMIDITY column where RH_FLAG is 0 and the value is within 0-100, and emit one uint8 sample per station-year in UTC time order."
deterministic_notes = "Sources are the complete 2024 directory (159 files) pinned by name and byte size; download.sh validates the HEADERS.txt column order, the readme column positions, 135-byte lines, 23 fields per line, a single WBANNO per file, 2024 UTC dates, integer RH and single-digit RH_FLAG, line count = size/135, total file count and bytes. build.sh parses by whitespace split (field 15 RH, field 16 RH_FLAG), requires strictly increasing UTC timestamps, and writes per-station dropped-row counts to filtered/<id>/ingest_stats.json and the index. verify.sh independently re-derives every sample from the fixed-width columns (cols 95-99, col 101), compares bytes, index fields, sample hashes, manifest counts, floors, non-constancy and uniqueness, and reports samples dominated (>50%) by one value. Station-years with fewer than 1,000 valid values would be excluded by both scripts."

[[series]]
id = "uscrn_rh_5min_u8"
description = "USCRN 5-minute average relative humidity at 1.5 m, integer percent, per station-year."
semantic_meaning = "Relative humidity average over the 5-minute interval ending at the row's UTC time, as archived by NCEI in whole percent, for one USCRN station over calendar year 2024."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The archive publishes RELATIVE_HUMIDITY as an integer percent in a 5-character field; values 0-100 are stored unchanged as uint8. The sensor resolves finer than 1 %, but whole-percent integers are the archived representation; no rescaling or rounding is done locally."
source_resources = ["uscrn_subhourly01_2024_station_files"]
source_format = "USCRN subhourly01 fixed-width 23-column text (CRNS0101-05)"
source_field = "RELATIVE_HUMIDITY (field 16, cols 95-99), gated by RH_FLAG (field 17)"
filtered_input_path = "filtered/noaa_uscrn_subhourly_relative_humidity_u8/ingest_stats.json"
filtering = "All 159 station-year files of 2024 (24 AK, 2 HI, 1 ON, 132 CONUS incl. 19 Alabama regional-network sites). AL_Brewton_3_NNE and AL_Highland_Home_2_S report RH = -9999 for every 2024 row and are excluded by the 1,000-value floor, leaving 157 samples. Keep rows with RH_FLAG == 0 and 0 <= RELATIVE_HUMIDITY <= 100; every other column is discarded."
missing_value_policy = "Rows with RH = -9999 (missing), RH_FLAG = 3 (erroneous; includes the -1 values seen in Alaska winter), RH_FLAG = 1 (overflow), or a flag-0 value outside 0-100 are dropped, not imputed; dropped counts per category and station are recorded in ingest_stats.json and the index (rows_dropped). The kept values stay in time order, so gaps break the strict 5-minute lattice. Malformed lines, mixed WBANNO, or non-increasing timestamps are fatal."
conversion = "ASCII integer -> uint8 (one byte per value, endianness-neutral), concatenated in file (UTC time) order; one .bin file per station-year named after the station."
numeric_kind = "uint"
bit_width = 8
endianness = "little"
sample_format = "raw homogeneous uint8 array"
sample_geometry = "station_time_series"
sample_rank = 1
sample_axes = ["utc_time_5min_valid_rows"]
natural_record_kind = "uscrn_station_year_subhourly_file"
sample_count = 157
total_size_bytes = 15864315
output_path = "samples/noaa_uscrn_subhourly_relative_humidity_u8/uscrn_rh_5min_u8/"
