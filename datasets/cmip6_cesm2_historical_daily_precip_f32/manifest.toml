manifest_version = 1
dataset_id = "cmip6_cesm2_historical_daily_precip_f32"
name = "CMIP6 NCAR CESM2 Historical r1i1p1f1 Daily Global Precipitation Flux Fields (1940-1949), Native Float32"
description = "All 3650 daily-mean global precipitation-flux fields (pr, kg m-2 s-1) of the CMIP6 CESM2 historical run, member r1i1p1f1, for the pinned 1940-1949 decade file (dataset version v20190401). They are decoded from NetCDF4 with a pure-stdlib HDF5 reader into one native little-endian float32 192x288 (lat x lon) field per model day."
homepage = "https://registry.opendata.aws/cmip6/"

[license]
name = "Creative Commons Attribution 4.0 International (CESM2 CMIP6 output; originally published under CC BY-SA 4.0)"
spdx = "CC-BY-4.0"
url = "https://wcrp-cmip.github.io/CMIP6_CVs/docs/CMIP6_source_id_licenses.html"
citation = "Danabasoglu, Gokhan (2019). NCAR CESM2 model output prepared for CMIP6 CMIP historical. Version 20190401. Earth System Grid Federation. https://doi.org/10.22033/ESGF/CMIP6.7627"
notes = "The official WCRP CMIP6 source_id license table lists source_id CESM2 (institution NCAR) with license 'CC BY 4.0' and history '2019-02-18: initially published under CC BY-SA 4.0; 2022-06-16: relaxed to CC BY 4.0'. download.sh fetches that page and checks the row. The PCMDI CMIP6 Terms of Use (TermsOfUse6-2.html) state that as of October 2022 all CMIP6 modeling groups relaxed their licenses to CC BY 4.0. The DataCite record for DOI 10.22033/ESGF/CMIP6.7627 also lists 'Creative Commons Attribution 4.0 International'. The file itself (written 2019-03-13, before the relaxation) still carries the global attribute 'CMIP6 model data produced by <The National Center for Atmospheric Research> is licensed under a Creative Commons Attribution-[]ShareAlike 4.0 International License'. build and verify check that this attribute is present. Under either reading the data is openly licensed with attribution. If the embedded CC BY-SA 4.0 notice is honored conservatively, derivatives must carry the same license (share-alike), which this repository already accepts for other recipes. Keep the NCAR attribution, the dataset citation above and the CMIP6 Terms of Use acknowledgement."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official CMIP6 model output published through the Earth System Grid Federation and mirrored unchanged (same tracking_id hdl:21.14100/c9b7ee29-8ac2-46d4-9e5c-b309b1ef0999) in the anonymous esgf-world S3 bucket listed on the AWS Registry of Open Data (cmip6). Simulated geophysical fields; no personal content."
usage_notes = "Openly licensed climate-model output suitable for numeric compression training, with NCAR/CMIP6 attribution retained."

