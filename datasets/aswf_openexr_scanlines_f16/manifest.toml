contains_personal_data = false
provenance_notes = "Official Academy Software Foundation/OpenEXR conformance images pinned by Git blob SHA-1, size, and SHA-256."
usage_notes = "Outputs contain only decoded native HALF channel values. Container metadata, constant alpha planes, and one source-native FLOAT depth plane are excluded."

