manifest_version = 1
dataset_id = "ceda_ukdale_iam_appliance_power_u16"
name = "UK-DALE 2017 Individual Appliance Monitor Real Power, UInt16 Watts"
description = "Per-appliance real (active) power in integer watts from every EDF EcoManager Transmitter Plug (individual appliance monitor, IAM) channel of UK-DALE houses 2-5: one uint16 sample per channel record, about one reading every 6 s."
homepage = "https://data.ceda.ac.uk/edc/efficiency/residential/EnergyConsumption/Domestic/UK-DALE-2017/"

[license]
name = "Creative Commons Attribution 4.0 International"
spdx = "CC-BY-4.0"
url = "https://creativecommons.org/licenses/by/4.0/"
citation = "Jack Kelly and William Knottenbelt (2015). The UK-DALE dataset, domestic appliance-level electricity demand and whole-house demand from five UK homes. Scientific Data 2:150007, doi:10.1038/sdata.2015.7. Data: UK Domestic Appliance Level Electricity (UK-DALE) 2017 edition, Disaggregated (6s) appliance power, UK Energy Research Centre Energy Data Centre (UKERC-EDC), hosted by CEDA."
notes = "The CEDA ReadMe (ReadMe_DALE-2017.html) entry for 'Disaggregated (6s) appliance power and aggregated (1s) whole house power' states 'Rights: Creative Commons Attribution 4.0 International (CC BY 4.0)'. The in-archive metadata/dataset.yaml rights_list declares the same licence. download.sh re-checks both on every run."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official UKERC-EDC/CEDA archive of the dataset creator's own release. Five anonymised homes in Southern England, metered by the creator for a PhD project with consent. Data carries no names, addresses or occupant identifiers; dataset.yaml gives only a London-area coordinate for the whole dataset."
usage_notes = "Appliance-level electricity load profiles of anonymised households. Only the watt readings (and, as auxiliary, their timestamps) are emitted. Do not attempt to re-identify households."

