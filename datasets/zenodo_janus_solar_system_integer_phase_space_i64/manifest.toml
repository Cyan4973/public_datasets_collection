filtering = "All 24 integrations and every snapshot in each are kept. The per-snapshot float64 t and walltime and the header's initial double particle structs are excluded from the primary series."
missing_value_policy = "No missing values exist in the format. Any header/format violation, truncated or partial snapshot, md5 mismatch, non-increasing time, constant column, or implausible magnitude (positions beyond 100 AU, speeds beyond 10 in simulation units) is fatal; nothing is dropped or imputed."
conversion = "For snapshot k at offset SASIZEFIRST + 448*k, skip the 16 bytes of (t, walltime); for body b in 0..8 take bytes [b*48, b*48+24) of the following 432-byte int block (x, y, z, 3 little-endian int64). Concatenate in (snapshot, body) order; sample shape = [snapshots, 9 bodies, 3 components], C order."
