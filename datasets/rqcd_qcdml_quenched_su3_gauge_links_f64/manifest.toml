[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/rqcd_qcdml_quenched_su3_gauge_links_f64/samples.jsonl"
summary = "Range-fetch 100 pinned gauge-configuration members from the 22.6 GB Zenodo zip, inflate each, decode the torch tensor header without unpickling, and emit each configuration's complex128 link tensor as one interleaved little-endian float64 sample."
deterministic_notes = "Config schedule n = 300 + 47k (k = 0..99) is fixed: configs 0..~50 are a non-equilibrium start (probe mean plaquette 0.695 at config 0, 0.603 at 25, 0.593 at 1000, equilibrium ~0.594 for beta=6.0), so the first 300 are skipped, and 47-config spacing limits Markov-chain autocorrelation. download.sh re-validates record identity, license, archive size/md5, central-directory geometry, and per-member offset/csize/usize/CRC32. build.sh checks torch data.pkl opcodes via pickletools.genops (ComplexDoubleStorage, numel 294912, storage offset 0, shape (4,8,8,8,16,3,3), contiguous stride) and a pinned data.pkl SHA-256, byteorder 'little', data/0 = 4,718,592 bytes, and SU(3) structure. verify.sh re-derives each sample through stdlib zipfile, byte-compares, and checks |entries| <= 1, |U U^dagger - 1| <= 1e-12 and |det U - 1| <= 1e-12 for every link matrix."

