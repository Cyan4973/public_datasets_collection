manifest_version = 1
dataset_id = "eht_public_uvfits_visibilities_f32"
name = "Event Horizon Telescope Calibrated Stokes-I UV Visibilities Float32"
description = "Separate real, imaginary, and statistical-weight sequences from five calibrated EHT UVFITS observations."
homepage = "https://github.com/eventhorizontelescope"

[license]
name = "Open Data Commons Public Domain Dedication and License 1.0"
spdx = "PDDL-1.0"
url = "https://opendatacommons.org/licenses/pddl/1-0/"
citation = "Event Horizon Telescope Collaboration public data releases 2019-D01-01, 2020-D01-01, 2021-D03-01, 2022-D02-01, and 2024-D01-01."
notes = "Each selected official release LICENSE.txt states that its data files are licensed under ODC-PDDL 1.0. The GPLv3 clause in the same notice applies to release scripts, which this recipe does not redistribute as training material. Preserve release and EHT attribution."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Published astronomical interferometry of M87, 3C 279, Centaurus A, and Sagittarius A*; no people or personal identifiers."
usage_notes = "Only calibrated Stokes-I visibility real, imaginary, and positive statistical-weight fields are emitted. UV coordinates, baselines, timestamps, antenna tables, and source metadata remain validation/context metadata rather than primary samples."

