sample_index_path = "index/google_fonts_glyf_coordinates_i16/samples.jsonl"
summary = "Decode every simple glyph from three pinned TrueType glyf tables and emit one font-level interleaved x/y int16 coordinate stream per font."
deterministic_notes = "Commit, source size/SHA-256/Git-blob identity, family license text, SFNT table bounds, head magic, maxp glyph count, loca offsets, glyf flag runs, coordinate deltas, per-glyph bounds, simple/composite/empty counts, glyph-boundary hashes, decoded hashes, and statistics are enforced."

[[series]]
id = "truetype_simple_glyph_coordinates_i16"
description = "Absolute x/y design-unit points from simple TrueType glyph contours."
semantic_meaning = "Vector-outline control and on-curve point coordinates in each font's 2048-unit em square, ordered by glyph index and point order."
role = "primary"
representation_class = "native_numeric"
representation_notes = "TrueType stores losslessly compressed coordinate deltas and flags; the decoder reconstructs the font's exact signed design-unit coordinates. No rasterization, scaling, interpolation, or quantization is applied."
source_resources = ["aclonica_ttf", "robotoslab_ttf", "specialelite_ttf"]
source_format = "TrueType SFNT with head, maxp, loca, and glyf tables"
source_field = "Simple-glyph xCoordinates and yCoordinates reconstructed from glyf flags/deltas"
filtered_input_path = "filtered/google_fonts_glyf_coordinates_i16/ingest_stats.json"
filtering = "Keep all points from nonempty simple glyphs in glyph-index order. Inventory but exclude composite glyphs because they reference and transform already represented simple outlines; exclude empty glyphs."
missing_value_policy = "Malformed tables, invalid offsets/flags/deltas, coordinate overflow, bounding-box mismatches, changed hashes/statistics, or missing sources/licenses fail the build. There are no missing coordinate values and no imputation."
conversion = "Decode repeat-compressed glyph flags, reconstruct x and y from signed/unsigned TrueType delta forms, interleave each point as x then y, and serialize the exact signed coordinates as little-endian int16."
numeric_kind = "int"
bit_width = 16
endianness = "little"
sample_format = "raw homogeneous interleaved int16 TrueType outline coordinates"
sample_geometry = "2d_truetype_outline_points"
sample_rank = 2
sample_axes = ["simple_glyph_point", "xy_coordinate"]
natural_record_kind = "font_simple_glyph_outline_set"
sample_count = 3
total_size_bytes = 287284
output_path = "samples/google_fonts_glyf_coordinates_i16/truetype_simple_glyph_coordinates_i16/"
