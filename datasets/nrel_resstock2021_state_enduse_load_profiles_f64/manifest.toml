evidence_quote = "OEDI submission 4520 'End-Use Load Profiles for the U.S. Building Stock' (DOI 10.25984/1876417): page License badge links https://creativecommons.org/licenses/by/4.0/ ('Creative Commons Attribution 4.0'), and the page's schema.org JSON-LD declares \"license\": \"https://creativecommons.org/licenses/by/4.0/\", \"identifier\": \"https://doi.org/10.25984/1876417\". The OEDI footer adds: 'Content is available under Creative Commons Attribution 4.0 unless otherwise noted.'"
