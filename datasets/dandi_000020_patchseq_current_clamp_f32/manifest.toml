[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/dandi_000020_patchseq_current_clamp_f32/samples.jsonl"
summary = "Validate the pinned dandiset.yaml and assets.yaml, re-derive the 16-donor selection, fetch and SHA-256-verify the 16 NWB blobs, then decode every /acquisition CurrentClampSeries sweep of the gain-0.05 regime into one raw little-endian float32 sample after trimming MIES's unacquired zero/NaN tail."
deterministic_notes = "Selection rule (patchseq_cc.py derive_selection): donors sorted by numeric id, restricted to ids >= 732239848 (the gain-0.05 window located by probe_gain_regime.py; 522 donors), 16 donors at ranks round(i*521/15), first NWB path per donor; sources.tsv must equal the re-derivation byte for byte. Sweeps are selected by the group attribute neurodata_type == 'CurrentClampSeries' (never by name), in sorted /acquisition name order, and must have data unit 'volts', conversion float32(0.001), starting_time rate 50000 Hz and gain float32(0.05); other series are counted by exclusion reason in ingest_stats.json. Pure-stdlib HDF5 decoding (scripts/nwb_hdf5.py) validated on a synthetic HDF5 self-test. Interior MIES zero-fill runs (>= 50 consecutive +/-0.0) are recorded per sample, allowed only once per X7Ramp sweep and at most 2% of it, and their count (44 samples, 62,033 values) is pinned. Files are added whole and in selection order under a 700 MB running primary cap (hard cap 1 GB). verify.sh re-decodes every sweep, byte-compares samples, re-checks index rows, finiteness, non-constancy, untrimmed padding, value span, the exact ADC lattice (bit-exact repack), interior fill runs recounted from the sample bytes, and duplicate payloads, and compares the fresh ingest statistics."

[[series]]
id = "patchseq_cc_membrane_potential_f32"
description = "Whole-cell current-clamp membrane-potential sweeps of mouse visual-cortex Patch-seq neurons (Allen Institute, MIES on ITC-18 with MultiClamp 700B)."
semantic_meaning = "Intracellular membrane potential in millivolts sampled at 50 kHz during one current-clamp stimulus sweep (test pulse, long/short square current steps, ramps, chirps/noise, rheobase search) of one neuron: resting potential near -60 to -80 mV with action potentials overshooting toward +20 to +50 mV. Exception: 44 of the 73 X7Ramp sweeps contain one interior run of 960-1,983 exact 0.0 words (62,033 values in total). This is MIES's unacquired zero fill after the spike-triggered stop of the ramp, not membrane potential. It is kept as stored and listed per sample in the index field interior_fill_runs."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The NWB `data` dataset is stored by the producer as little-endian IEEE float32 in mV (unit 'volts', conversion 0.001), and the stored bit patterns are emitted unchanged. Measured over all 112,275,629 words: each equals float32(k / (3200 * g)) for an integer ITC-18 ADC code k in [-16,768, 8,549], with g the stored float32 gain 0.05000000074505806 and the division in double. That is a 0.00625 mV (1/160 mV) tick lattice; 22,449,239 words lie one ulp toward zero from a correctly rounded float32(k/160). The low mantissa bits are deterministic, following the periodic binary expansion of 1/5: the low byte takes only 5 distinct values, and 14.4% of words have the low 13 mantissa bits zero. Each word therefore carries at most about 15 bits of ADC information (a span of 25,318 codes). float32 is kept because it is the archive's native stored type and the integer codes are not stored, so recovering them would be a local remap (protocol rule 2). This matches the accepted kollmeyer_panasonic18650pf_drive_cycle_voltage_f64 precedent of producer-native floats on an ADC lattice. The gain-0.05 restriction exists only so that the family has one tick lattice."
source_resources = ["assets_yaml", "nwb_sub_732239848", "nwb_sub_740369784", "nwb_sub_746220175", "nwb_sub_757080785", "nwb_sub_761831990", "nwb_sub_775275471", "nwb_sub_799065231", "nwb_sub_812386057", "nwb_sub_825548689", "nwb_sub_839065509", "nwb_sub_853715067", "nwb_sub_868713302", "nwb_sub_899526566", "nwb_sub_918438586", "nwb_sub_959090058", "nwb_sub_1001658958"]
source_format = "NWB 2.2.5 (HDF5 superblock v0) CurrentClampSeries; chunked (8192) float32 dataset with shuffle + deflate filters"
source_field = "/acquisition/<sweep>/data of every group whose neurodata_type attribute is CurrentClampSeries (membrane potential, mV)"
filtered_input_path = "filtered/dandi_000020_patchseq_current_clamp_f32/ingest_stats.json"
filtering = "Keep only /acquisition groups with neurodata_type == 'CurrentClampSeries'. Exclude VoltageClampSeries (pA currents), any other acquisition type, all /stimulus command waveforms, and CurrentClampSeries whose unit/conversion, 50 kHz rate or gain 0.05 differ (counted by reason). After trimming, sweeps shorter than 1,000 values, constant sweeps and sweeps with interior non-finite values are excluded and counted."
missing_value_policy = "MIES writes exact zeros for unacquired spans. (1) Trailing fill: when a sweep ends early, as in rheobase or blip searches that stop after spiking, the remainder is padded with zeros or NaN. The maximal trailing run of +0.0/-0.0/NaN words is trimmed, and stored_values and trimmed_tail_values are recorded per sample (271 sweeps, 59,029,871 of 171,305,500 stored values, all +0.0). (2) Interior fill: after the spike-triggered stop of an X7Ramp ramp, MIES leaves one interior run of exact 0.0 words before the trace resumes. These sweeps are kept whole as natural records and are not split. Each index row lists interior_fill_runs ([[start, length], ...] over runs of at least 50 consecutive +/-0.0 words) and interior_fill_values. ingest_stats.json carries the totals: 44 sweeps from 14 donors, runs of 960-1,983, 62,033 values, at most 0.91% of a sweep, all pinned. These zeros are not membrane potential. Build and verify fail if fill appears outside X7Ramp, more than once per sweep, or above 2% of a sweep. Verify recounts the runs from the sample bytes. The 36 isolated exact zeros outside such runs are genuine ADC code 0. Interior NaN/Inf excludes a sweep, as do fewer than 1,000 values after trimming or a constant sweep, each counted by reason. Nothing is imputed."
conversion = "Pure-stdlib HDF5 walk: superblock v0, then v1 object headers with continuations, then symbol-table groups. Attributes are read with vlen strings resolved from the global heap. The data chunk B-tree (v1, type 1) is traversed; each chunk is zlib-inflated and byte-unshuffled (element size 4), and edge-chunk padding is removed. The decoded float32 little-endian words are kept bit-exact, the unacquired tail is trimmed, and one sample file is written per sweep: samples/<id>/patchseq_cc_membrane_potential_f32/sub-<donor>_ses-<session>__data_<sweep>_AD0.bin. Every emitted word must equal float32(k / (3200 * gain)) for an integer ADC code k, the division done in double. The build checks this on all values with array equality, and verify checks it bit for bit by repacking. Any mismatch fails the recipe."
numeric_kind = "float"
bit_width = 32
endianness = "little"
sample_format = "raw homogeneous little-endian float32 membrane-potential time series"
sample_geometry = "intracellular_voltage_time_series_1d"
sample_rank = 1
sample_axes = ["time_50khz"]
natural_record_kind = "nwb_current_clamp_series_sweep"
sample_count = 736
total_size_bytes = 449102516
output_path = "samples/dandi_000020_patchseq_current_clamp_f32/patchseq_cc_membrane_potential_f32/"
