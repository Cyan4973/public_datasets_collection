citation = "James Webb Space Telescope (NASA/ESA/CSA), NIRCam, program 2736 (JWST Early Release Observations; Pontoppidan et al. 2022, ApJL 936, L14), Mikulski Archive for Space Telescopes (MAST), Space Telescope Science Institute."
notes = "The MAST Data Use Policy states: 'Most data hosted at MAST are in the public domain (see: open data), and therefore do not have restrictions on use.' It names three restricted subsets: exclusive-access data (which 'may not be retrieved except by authorized and authenticated persons'; after expiry 'science data become available for public use without restriction'), community HLSPs (CC BY 4.0), and the copyrighted DSS and Guide Star Catalogs. These files are JWST mission pipeline Level-1b products (not HLSPs, not DSS/GSC), served anonymously from the jwst/public/ prefix of the MAST public bucket, observed 2022-06-07 and released with the ERO package on 2022-07-12. Header CATEGORY = 'COM' because the EROs were executed at the end of commissioning. archive.stsci.edu returned proxy 403 during authoring, so the text was first quoted from the copy saved by the accepted mast_iue_swp_raw_image_u8 recipe. The driver's download.sh run on 2026-10-05 then fetched the page itself; the copy is byte-identical to the IUE copy (81,786 bytes, sha256 f309e1b4708217eafff51feab3fc9780e5b0c7fef79452e6fde486030b37e2c3) and passed the public-domain and copyrighted-list checks. The fetch stays best-effort: a transport failure only warns, a changed page is fatal. Acknowledge JWST, NIRCam, MAST and STScI."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official MAST public bucket (s3://stpubdata, anonymous HTTPS, not requester-pays); raw infrared detector readings of a galaxy-cluster field."
usage_notes = "Only the SCI data unit (detector DN) is emitted. FITS header text, including the PI name card, is never written to samples or the index; index rows carry only file name, detector, filter, exposure numbers, observation date/time, pipeline version and value statistics."

