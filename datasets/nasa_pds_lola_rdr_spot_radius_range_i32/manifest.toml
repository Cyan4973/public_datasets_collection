[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/nasa_pds_lola_rdr_spot_radius_range_i32/samples.jsonl"
summary = "Fetch 28 pinned LOLA RDR orbit products (one per mapping-orbit phase) plus labels and lolardr.fmt; decode the fixed 256-byte little-endian records; keep every laser spot that is not MISSING and whose SHOT_FLAG low byte is 0; emit per orbit one int32 radius sample and one int32 range sample (same kept spots, same order)."
deterministic_notes = "Scope rule (discover.sh): the 28 phase directories of LRO's quasi-circular ~50 km polar mapping orbit, lro_no_01..13 (NOMINAL MISSION) and lro_sm_01..15 (SCIENCE MISSION to 2011-10-31); within each phase the orbit products are sorted by name and tried in bisection order (n/2, n/4, 3n/4, n/8, ...); the first whose 24 x 64-record range-read probe keeps >= 40% of spots is pinned (24 phases at rank 1, lro_sm_04/lro_sm_10 at rank 2, lro_no_04/lro_sm_11 at rank 3; the rejected candidates kept 0-29%). sources.tsv pins phase, file, size, published MD5, record count, label MD5, label MISSION_PHASE_NAME, rank and probe fraction; 5,320,644 records, 1,362,084,864 bytes. Spot policy: keep spot k iff RADIUS_k != -1 and RANGE_k != 4294967295 and (SHOT_FLAG_k & 0xFF) == 0 (lolardr.fmt); order shot-major, spots 1..5. Fatal: size/MD5 mismatch, label field mismatch, fmt START_BYTE/type/unit mismatch, an orbit keeping < 30% of spots, a kept radius outside 1.72e9..1.76e9 mm, a kept range outside 1e7..2.5e8 mm or >= 2^31. Index rows carry phase, source_file, source_md5, orbit_number, start/stop time, product_version, laser (LASER_1 for 18 orbits, LASER_2 for 10), records, spots_total/kept/missing/flagged, kept_fraction, kept_per_spot, min/max (from stored int32), distinct_values and sample_sha256. verify.sh re-derives offsets from lolardr.fmt with its own parser, re-applies the policy on a uint32 word view, compares every sample byte for byte, checks |SC_RADIUS - RADIUS_k - RANGE_k| < 1 km for >= 99% of kept spots per orbit, and rejects constant, < 1000-distinct, non-positive or < 2^24 samples. The geometry check corrects for spacecraft off-nadir pointing, RADIUS ~ SC_RADIUS - RANGE cos(OFFNADIR_ANGLE). 12 of the 28 orbits contain off-nadir slews of 2.3-27.4 deg (max OFFNADIR_ANGLE per orbit is printed by verify), during which RANGE rises by 1/cos(theta). Realized: 28 orbits, 2009-10-04T15:04 .. 2011-10-17T20:17, 5,320,644 records, 26,603,220 spots; kept 14,891,249 (55.98%), missing 11,475,005 (43.13%), flagged 236,966 (0.89%); per-orbit kept fraction 0.4125 (lro_sm_11) .. 0.6255 (lro_sm_02); kept per spot 1..5 = 2,228,748 / 2,175,567 / 4,216,751 / 4,094,920 / 2,175,263. 56 primary samples, 29,782,498 values, 119,129,992 bytes (59,564,996 per series); 391,860 .. 594,067 values per sample, median 557,979. Radius 1,729,991,331 .. 1,744,627,311 mm; range 29,227,370 .. 73,655,275 mm; every sample has >= 93% distinct values. verify.sh SHA-256 of all samples concatenated in index order b0afc376b5ee1b4263279e74e1ac649eb5988f877df0684b44a8379075325a8a."

[[series]]
id = "spot_radius_mm_i32"
description = "Distance from the Moon's centre to each valid LOLA laser-spot centroid, one array per RDR orbit product."
semantic_meaning = "lolardr.fmt RADIUS_k (k = 1..5), 'The distance from the Moon center to the Spot k centroid', LSB_INTEGER, MILLIMETERS, in the MEAN EARTH/POLAR AXIS frame of DE421. Realized values 1,729,991,331 .. 1,744,627,311 mm (lunar topography of about +-10 km about the 1737.4 km reference), so every value uses all four bytes; consecutive values are the five spots of one shot (a ~50 m cross pattern) and then the next 28 Hz shot ~57 m further along track."
role = "primary"
representation_class = "native_numeric"
representation_notes = "Stored exactly as published: the 4-byte LSB_INTEGER field copied unchanged (int32, little-endian). Only the selection of spots is applied; no scaling or re-quantisation."
source_resources = ["lola_rdr_orbits", "lola_rdr_labels", "lolardr_fmt"]
source_format = "PDS3 FIXED_LENGTH BINARY table, 256-byte LSB records (one per 28 Hz LOLA shot, 5 spots), structure LOLARDR.FMT"
source_field = "RADIUS_1..RADIUS_5 (START_BYTE 49 + 40 (k-1), LSB_INTEGER, mm)"
filtered_input_path = "filtered/nasa_pds_lola_rdr_spot_radius_range_i32/build_stats.json"
filtering = "All records of the 28 pinned orbit products, in source (time) order; within a record spots 1..5. A spot is kept iff RADIUS_k != -1, RANGE_k != 4294967295 and (SHOT_FLAG_k & 0xFF) == 0."
missing_value_policy = "Spots with RADIUS_k = -1 (MISSING_CONSTANT) or RANGE_k = 4294967295 (MISSING_CONSTANT; -1 for the LSB_INTEGER-declared RANGE_3) are dropped. Spots whose SHOT_FLAG_k low byte is nonzero are dropped as documented in lolardr.fmt ('Any values other than 0 should be regarded as an invalid measurement'; bits 0-7: not ground, transmit/receive edge missing, transmit energy invalid, autoedit, no pointing). SHOT_FLAG bits 8-9 (RMU phase status) and 16-31 (relative range uncertainty) are not invalidity flags and are not used. No thresholds on the values themselves are used for selection; as fatal sanity checks, every kept radius must lie in 1.72e9 .. 1.76e9 mm and every kept range in 1e7 .. 2.5e8 mm, every orbit must keep >= 30% of its spots, and verify requires |SC_RADIUS - RADIUS_k - RANGE_k cos(OFFNADIR_ANGLE)| < 1 km for >= 99% of kept spots (realized: 100% in every orbit). Dropped counts per orbit (missing, flagged) are in the index."
conversion = "struct '<i' at byte offset 48 + 40 (k-1) of each 256-byte record (PDS3 START_BYTE - 1); kept values appended in shot-major, spot 1..5 order and written as raw little-endian int32, one file <stem>.i32 per orbit product."
numeric_kind = "int"
bit_width = 32
endianness = "little"
sample_format = "raw little-endian int32 1-D array"
sample_geometry = "time_series"
sample_rank = 1
sample_axes = ["laser_spot"]
natural_record_kind = "published_lola_rdr_orbit_product"
sample_count = 28
total_size_bytes = 59564996
output_path = "samples/nasa_pds_lola_rdr_spot_radius_range_i32/spot_radius_mm_i32/"

