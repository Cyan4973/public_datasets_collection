notes = "The DCDB CSB FAQ (https://noaa-dcdb-bathymetry-pds.s3.amazonaws.com/docs/FAQ.html, last updated Aug 8, 2023; fetched 2026-10-05, sha256 86017f3863f94913646e6ca50f59f30cfb0c929207193b3d5ea5398a04ad2b1a) states: 'Regardless of whether the data are provided to the IHO DCDB by a Trusted Node or an individual, the data is dedicated to the public domain in accordance with the \"Creative Commons Zero\" universal public domain dedication ( CC0 1.0 ).' It also states that the DCDB 'archives and shares, freely and without restrictions, depth data contributed by mariners.'"

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official NOAA NODD public S3 bucket, anonymous HTTPS. Per the FAQ, only data from international waters or from coastal states that agreed to public sharing are published. Vessel names (PLATFORM_NAME), UNIQUE_ID, FILE_UUID, DEPTH and TIME are read only for validation, deduplication and overlap checks and are never emitted."
usage_notes = "Samples are coordinate sequences of opted-in vessels (commercial, research and recreational) that the IHO publishes under CC0. The index keeps the public S3 object key for provenance. That key embeds the trusted node's opaque vessel UUID, but no vessel name."

