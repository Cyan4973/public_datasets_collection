summary = "Validate every Kongsberg datagram (length, STX, ETX, 16-bit byte-sum checksum, model 302), group EM302 water-column 'k' datagrams by (date, time, ping counter), keep complete 288-beam pings, and emit each ping's concatenated per-beam int8 amplitude arrays as one sample, with per-beam sample counts and pointing angles as auxiliary series."
deterministic_notes = "Pinned object list with sizes and locally recomputed S3 ETags; full-file datagram framing/checksum scan in download, build and verify; fatal on any framing error, non-EM302 datagram, system serial != 101, TVG function != 30, TVG offset != 20 dB, Nrx-total != 288, non-zero start range sample, out-of-range transmit sector, non-zero/over-long padding, inconsistent per-ping headers, non-strictly-decreasing beam pointing angles, decreasing ping timestamps, interior incomplete pings, or duplicate ping payloads. Files are processed in the pinned order and pings in file order. verify.sh re-decodes with an independent reader and compares sample bytes, index fields, stored-int8 min/max, hashes, dropped-ping accounting, and manifest totals."

[[series]]
id = "em302_ping_water_column_amplitude_i8"
description = "Kongsberg EM302 multibeam water-column backscatter amplitudes, one complete ping per sample."
semantic_meaning = "Received echo amplitude per receive beam and range sample, as logged by the EM302 with its time-varied gain applied (Kongsberg TVG X*log10(R) + 2*alpha*R + offsets, with X = 30 and C = 20 dB recorded in every datagram), in signed 0.5 dB steps; -128 is the native floor/no-signal code. A sample is all 288 receive beams of one ping in beam order (starboard to port, strictly decreasing pointing angle), each beam contributing its Ns range samples starting at range sample 0."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The int8 amplitude bytes are copied unchanged from the 'k' datagram beam blocks; beam headers, transmit-sector entries and datagram framing are removed. Beams are ragged (Ns varies per beam with slant range); the per-beam Ns needed to reshape a sample into a beam x range fan is the auxiliary series em302_ping_beam_sample_count_u16. One-byte values are endianness invariant and labelled little-endian for corpus consistency."
source_resources = ["ex1711_em302_wcd_files"]
source_format = "Kongsberg EM-series datagram stream (.wcd), water column datagram 'k' (0x6B), EM302"
source_field = "Water column datagram per-beam sample amplitude array (int8, 0.5 dB)"
filtered_input_path = "filtered/noaa_wcsd_em302_water_column_i8/ingest_stats.json"
filtering = "All complete water-column pings of the 15 pinned EM302 files. Only 'k' datagrams contribute; auxiliary datagrams (I, R, U, P, A, H and any others) are framing-checked and skipped. The EX1711 EK60 folder and other cruises/sonar models are excluded."
missing_value_policy = "No amplitude is dropped, clipped or imputed; -128 is kept as the native floor code. A ping missing any of its Nd datagrams is dropped only when it is the first or last water-column ping of a file (logging started or stopped mid-ping); an incomplete ping anywhere else is fatal. Pings whose amplitudes are all one value (blank pings) are dropped and counted in ingest_stats.json. Framing, checksum, TVG or geometry violations are fatal."
conversion = "For each complete ping: sort its 'k' datagrams by datagram number, then concatenate every beam's Ns int8 amplitude bytes in datagram/beam order and write them unchanged as one raw int8 file. Index min/max come from the stored int8 values."
numeric_kind = "int"
bit_width = 8
endianness = "little"
sample_format = "raw signed-int8 water-column amplitude vector (ragged beams concatenated)"
sample_geometry = "em302_ping_ragged_beam_by_range"
sample_rank = 1
sample_axes = ["beam_ragged_range_sample"]
natural_record_kind = "complete_em302_water_column_ping"
sample_count = 1953
total_size_bytes = 343505942
output_path = "samples/noaa_wcsd_em302_water_column_i8/em302_ping_water_column_amplitude_i8/"

