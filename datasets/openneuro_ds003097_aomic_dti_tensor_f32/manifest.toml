[safety]
contains_sensitive_data = true
contains_personal_data = false
provenance_notes = "Public deidentified human-subject MRI derivatives released by the AOMIC authors (University of Amsterdam) through OpenNeuro's official anonymous S3 bucket; anonymization was designed with GDPR advice per the dataset acknowledgements."
usage_notes = "Human-subject neuroimaging derivative, flagged sensitive per the openneuro_ds000030 precedent. The recipe keeps only fitted diffusion-tensor voxel values at 2 mm resolution (no anatomical face detail); it downloads no participant tables, demographics, psychometrics, raw DWI, images, or free text. Participant IDs appear only as the OpenNeuro sub-NNNN labels."

