summary = "Discover public TESS SPOC light-curve FITS products, validate native float32 PDCSAP_FLUX columns, then emit one quality-filtered little-endian flux series per target-sector product."
deterministic_notes = "The fixed selection pins 64 exact product URIs, sizes, SHA-256 hashes, row counts, eight TIC targets, and sectors 61-68. Build validates the generic fixed-width FITS table layout, retains only QUALITY=0 finite PDCSAP_FLUX words, and byte-swaps each native big-endian word to little-endian. Verification reparses every pinned FITS file and compares all output bytes. The pinned result retains 1,015,204 of 1,247,392 rows: 224,940 nonzero-quality and 7,248 non-finite rows are excluded."

[[series]]
id = "tess_pdcsap_flux_f32"
description = "One quality-filtered TESS Pre-search Data Conditioning Simple Aperture Photometry light curve per target and observing sector."
semantic_meaning = "Systematics-corrected stellar brightness measured over successive TESS cadences for one target-sector observation."
role = "primary"
representation_class = "native_numeric"
representation_notes = "Only products whose FITS binary-table schema declares PDCSAP_FLUX with TFORM=E are eligible. Retained finite source float32 values are copied without numeric conversion other than FITS big-endian to canonical little-endian byte order."
source_resources = ["selected_tess_lightcurves", "mast_tess_provenance_evidence", "nasa_media_usage_evidence"]
source_format = "TESS SPOC light-curve FITS binary table"
source_field = "PDCSAP_FLUX rows whose QUALITY value is zero and whose flux is finite"
filtered_input_path = "filtered/nasa_tess_lightcurves_f32/ingest_stats.json"
filtering = "Keep public SPOC LC products from the fixed discovery selection. Within each product retain source-order PDCSAP_FLUX values only where QUALITY=0 and flux is finite."
missing_value_policy = "Rows with nonzero QUALITY or non-finite PDCSAP_FLUX are excluded. Missing columns, wrong FITS types, too-short retained light curves, changed source identities, constant samples, duplicates, or stale outputs fail the recipe."
conversion = "Extract each retained native FITS float32 PDCSAP_FLUX word and convert its byte order from FITS big-endian to little-endian without changing the binary32 value."
numeric_kind = "float"
bit_width = 32
endianness = "little"
