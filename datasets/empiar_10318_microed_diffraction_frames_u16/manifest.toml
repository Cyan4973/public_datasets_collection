[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/empiar_10318_microed_diffraction_frames_u16/samples.jsonl"
summary = "Range-fetch 24 pinned SMV frame members (341,983,518 bytes) and the eight central directories from the EMPIAR-10318 ZIPs, inflate each member, validate its SMV header, and emit the 4096x4096 uint16 pixel block unchanged as one raw sample per frame (24 samples, 805,306,368 bytes)."
deterministic_notes = "discover.sh documents pin resolution (listing, HEAD, 64 KiB tail per archive, 4 KiB member-head ranges) and diffs against scripts/archives.tsv and scripts/frames.tsv. download.sh requires an exact 206 Content-Range for every chunk, resumes partial ranges from the bytes on disk, and validates each central directory (SHA-256, EOCD, ZIP64 record and locator, consecutive D520mm_NNNN.img numbering, one .cec, every image 33,554,944 bytes DEFLATE) and each member (local header name, flags 0, method 8, CRC, sizes, own name/extra lengths ending exactly at the range end; raw DEFLATE ending exactly at the member boundary; inflated length 33,554,944 and CRC-32; SMV header). The SMV header must have exactly the keys HEADER_BYTES, DIM, BYTE_ORDER, TYPE, SIZE1, SIZE2, PIXEL_SIZE, BIN, DETECTOR_SN, TIME, DISTANCE, PHI, OSC_START, OSC_RANGE, WAVELENGTH, BEAM_CENTER_X, BEAM_CENTER_Y in that order with HEADER_BYTES=512, DIM=2, BYTE_ORDER=little_endian, TYPE=unsigned_short, SIZE1=SIZE2=4096, PIXEL_SIZE=0.051000, BIN=1x1, TIME=5.720000, DISTANCE=3064.000000, OSC_RANGE=1.000000, WAVELENGTH=0.025071, PHI=OSC_START equal to the pinned angle, a beam centre constant within each series, only form-feed/space padding after the closing brace, and its SHA-256 equal to the pin. Each frame must have at least 256 distinct values, a zero fraction and a modal fraction of at most 0.5, at least 1,000 pixels above 255 and a maximum of at least 1,000 (diffraction signal above background), no constant row or column, and a unique payload. The SHA-256 over '<sample name>\\t<sample sha256>' lines in pin order is pinned (efa1456a2c4eb3e31054d1a6c96c0fa15ca84c223288bc8c69efc4723227a73d) and enforced by build and verify. verify.sh re-inflates every member with a separate one-shot decoder and regex header check, byte-compares each sample, recomputes all statistics and index rows, checks that the sample directory matches the index exactly, and checks manifest sample_count and total_size_bytes. Samples are written in pin order (archive name, then frame position)."

[[series]]
id = "microed_200kv_diffraction_frame_u16"
description = "MicroED continuous-rotation electron-diffraction frames of FUS(37-42) SYSGYS nanocrystals, one 4096x4096 detector frame per sampled 1 degree rotation wedge."
semantic_meaning = "Each value is the 16-bit detector reading for one pixel of a 4k x 4k camera on an FEI Tecnai F20 at 200 kV (wavelength 0.025071 A), integrated over one 5.72 s exposure while the crystal rotated continuously through 1 degree (0.0572 e/A^2 per frame). Frames show sparse Bragg reflections and a diffuse halo around the shadow of the beam stop on a low background (per-frame median 7 to 19, 99th percentile 114 to 331, maxima 10,141 to 32,747 in the realized 24 frames). Values are as stored by the depositors' SMV conversion. The header declares a 51 um pixel and an equivalent camera distance of 3064 mm so that X-ray crystallography software (e.g. HKL2000) accepts the frames as a 4k x 4k ADSC Q210 image; these are geometry labels, and the pixel values themselves are not rescaled."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The SMV header of every frame declares TYPE=unsigned_short, BYTE_ORDER=little_endian, SIZE1=SIZE2=4096 and HEADER_BYTES=512; the samples are bytes 512..33,554,943 of the inflated member, unchanged. EMPIAR's imageset metadata labels the voxel type 'SIGNED 16 BIT INTEGER'; the recipe follows the per-file header, and build/verify record the observed global maximum: 32,747 over the realized 24 frames, with no pixel above 32767, so the sign interpretation is moot."
source_resources = ["selected_frame_members"]
source_format = "SMV (ADSC-style) diffraction image: 512-byte ASCII '{ KEY=VALUE; }' header + 4096x4096 little-endian unsigned 16-bit raster, stored as a raw-DEFLATE member of a per-crystal ZIP archive"
source_field = "SMV image raster after the 512-byte header (SIZE1 fast x SIZE2 slow, TYPE=unsigned_short): detector counts per pixel"
filtered_input_path = "filtered/empiar_10318_microed_diffraction_frames_u16/ingest_stats.json"
filtering = "All eight crystal series are kept, three frames each at the 1/6, 1/2 and 5/6 points of every rotation sweep (rotation angles -50 to +35 degrees). The other 689 frames are not downloaded, to stay under the 1 GB cap. The .cec beam-centre sidecars are skipped. The sibling 120 kV entry EMPIAR-10319 is excluded: a different accelerating voltage and wavelength is a different regime. Every pixel of each kept frame is emitted; nothing is cropped or masked."
missing_value_policy = "There are no missing-value sentinels. Zero is a genuine reading (the beam-stop shadow and dark-noise pixels; 7.8 % to 21.3 % of pixels per realized frame, median 15.7 %) and stays in place. Fatal, identically in build and verify: any size, checksum, CRC, ZIP-structure or SMV-header deviation; a constant frame; fewer than 256 distinct values; a zero or modal fraction above 0.5; fewer than 1,000 pixels above 255 or a maximum below 1,000; any constant row or column; a duplicate frame payload."
conversion = "Parse the ZIP local header using its own name and extra lengths, raw-inflate (zlib wbits -15) to exactly 33,554,944 bytes, check CRC-32, parse and validate the SMV header, and write bytes 512.. (4096 rows of 4096 uint16, slow axis first, little-endian as stored) as one raw sample per frame. No byte swap, rescaling, flipping or cropping."
numeric_kind = "uint"
bit_width = 16
endianness = "little"
sample_format = "raw homogeneous little-endian uint16 MicroED diffraction frame"
sample_geometry = "electron_diffraction_detector_frame_2d"
sample_rank = 2
sample_shape = [4096, 4096]
sample_axes = ["detector_slow_y", "detector_fast_x"]
natural_record_kind = "microed_rotation_series_smv_frame"
sample_count = 24
total_size_bytes = 805306368
output_path = "samples/empiar_10318_microed_diffraction_frames_u16/microed_200kv_diffraction_frame_u16/"
