[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/ahmedml_cfd_surface_mean_pressure_f32/samples.jsonl"
summary = "Range-fetch the VTK XML header and the inline-base64 `pMean` CellData block of 50 pinned AhmedML boundary VTPs, base64-decode each block, check its UInt64 byte-count prefix against 4 x NumberOfPolys, and emit the little-endian float32 payload unchanged as one sample per simulation run."
deterministic_notes = "Run rule (scripts/ahmedml_vtp.py planned_runs): run_1, run_11, ..., run_491 (range(1, 501, 10)), 50 of the 500 geometries; every run has a boundary VTP at the revision. selection.tsv (generated by discover.sh with small Range probes) pins per run the VTP size, LFS sha256, xet hash, NumberOfPoints, NumberOfPolys and the pMean base64 byte span; discover.sh found the span by walking backwards from the file end over the fixed CellData order wallShearStressMean(3) <- yPlusMean <- static(p)_coeffMean <- pMean, using block length ceil((8 + 4*N*ncomp)/3)*4 and confirming each opening tag and decoded UInt64 prefix. download.sh re-validates the pinned span on the fetched window: the bytes before it must end with `</Polys><CellData><DataArray type='Float32' Name='pMean' format='binary'>`, the span must be one unbroken base64 run decoding to exactly 8 + 4N bytes with prefix 4N, and the bytes after it must close the array and open static(p)_coeffMean. Sample order follows selection.tsv. The parser is self-tested on synthetic VTP files (all three base64 padding residues, reordered arrays, line-wrapped base64, compressor attribute, wrong prefix, shifted/truncated windows, NaN, constant and garbage-range fields) at discover, download, build and verify time. The primary floor is met by 50 samples of 724,668-1,404,826 values each (median 1,082,412)."

[[series]]
id = "ahmedml_boundary_pmean_f32"
description = "Time-averaged static pressure on every boundary polygon of one simulated Ahmed-body geometry."
semantic_meaning = "OpenFOAM time-averaged kinematic static pressure (p/rho, m^2/s^2; field `pMean`) on each surface cell of a parametric Ahmed car body from a ~80 convective-time-unit hybrid RANS-LES simulation (OpenFOAM v2212, ~20M-cell volume mesh). The published pressure coefficient array static(p)_coeffMean equals exactly 2 x pMean in the probed cells, consistent with a unit reference velocity and zero reference pressure. One complete surface field per run; values are in the VTP polygon order."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The VTP DataArray is declared type='Float32' in a LittleEndian file; base64 decoding recovers the publisher's float32 bytes, which are emitted unchanged (no conversion, no rescale). Probed blocks carry full 24-bit mantissas and nearly every value is distinct. OpenFOAM computes in double; float32 is the type of the published artifact, not a local narrowing."
source_resources = ["ahmedml_boundary_vtp_pmean_ranges"]
source_format = "VTK XML PolyData (.vtp), byte_order LittleEndian, header_type UInt64, uncompressed inline base64 binary DataArrays"
source_field = "Piece/CellData/DataArray Name='pMean' (Float32, 1 component, one tuple per boundary polygon)"
filtered_input_path = "filtered/ahmedml_cfd_surface_mean_pressure_f32/ingest_stats.json"
filtering = "Only the 50 runs selected by range(1, 501, 10) and only their pMean CellData array. Excluded: static(p)_coeffMean (exact linear rescale of pMean), yPlusMean (mesh-resolution diagnostic), wallShearStressMean (different quantity, 3 components), Points/connectivity/offsets (mesh geometry), boundary_cell_area_<i>.npy (geometry helper), volume_<i>.vtu, slices/, images/ and force CSVs."
missing_value_policy = "pMean has no fill value and none is expected. Every value must be finite and within a +/-10 m^2/s^2 decode-garbage guard (not a physics filter); each field must contain both negative (suction) and positive (stagnation) values, be non-constant, have at least 5% distinct values, and differ from every other selected field. Any violation is fatal in download, build and verify; nothing is dropped or imputed."
conversion = "Take the pinned base64 span (one line, no embedded whitespace), base64-decode it, require decoded length 8 + 4N and UInt64 little-endian prefix 4N where N = NumberOfPolys from the run's <Piece> tag, and write the remaining 4N bytes unchanged as little-endian float32. One sample per run. verify.sh re-derives each sample with an offset-free decoder (tag search, whitespace strip) and byte-compares; index min/max come from the stored float32 values."
numeric_kind = "float"
bit_width = 32
endianness = "little"
sample_format = "raw homogeneous little-endian float32 array"
sample_geometry = "unstructured_surface_mesh_cell_field_1d"
sample_rank = 1
sample_axes = ["boundary_polygon"]
natural_record_kind = "ahmedml_simulation_run_boundary_surface_pmean_field"
sample_count = 50
total_size_bytes = 213128668
output_path = "samples/ahmedml_cfd_surface_mean_pressure_f32/ahmedml_boundary_pmean_f32/"
