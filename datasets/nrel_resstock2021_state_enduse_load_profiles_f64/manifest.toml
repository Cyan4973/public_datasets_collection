sample_index_path = "index/nrel_resstock2021_state_enduse_load_profiles_f64/samples.jsonl"
summary = "Fetch the 49 pinned ResStock 2021 AMY2018 state single-family-detached aggregate CSVs, validate them, select end-use columns by a global non-degeneracy rule, and emit every kept (state, end-use) column as one raw little-endian float64 sample of 35,040 values in timestamp order."
deterministic_notes = "Pins: sources.tsv (state, key, size, single-part ETag md5, LastModified for 49 objects) and columns.tsv (the 54 out.* columns in header order: 6 totals, 48 end uses, each with the pinned keep/drop outcome and the realized evidence). Excluded a priori: the six *.total columns (over all 49 x 35,040 rows electricity.total equals the sum of electricity end uses excluding pv and every other fuel total equals its end-use sum to <= 3.5e-14 relative; site_energy.total equals the fuel totals to <= 3.9e-7; build fails above 1e-9 and 1e-5 respectively). Global selection rule over the 48 end uses, evaluated on all 49 files: drop an end use if in ANY state its series (a) is all +-0, (b) has fewer than 1,000 distinct values, or (c) is an exact rescaling of another state's series for the same end use (identical zero pattern and ratio constant to 1e-9 relative). Realized (equal to the keep list pinned from range probes before download): 17 kept (electricity ceiling_fan, clothes_dryer, clothes_washer, cooking_range, cooling, dishwasher, fans_cooling, fans_heating, heating, interior_lighting, plug_loads, pumps_heating, water_systems; natural_gas clothes_dryer, cooking_range, heating, water_systems); 31 dropped: 17 flagged (a) (6 all-zero in every state: ext_holiday_light, house_fan, pumps_cooling, recirc_pump, vehicle, wood heating; 11 all-zero in 1-9 states), 4 by (b) only (bath_fan min 20 and range_fan min 14 distinct values per year, extra_refrigerator min 91, propane cooking_range 15 in DC), and 10 by (b) and (c) together (fixed-schedule end uses with 72-168 distinct values per year whose state series are exact rescalings in 168-184 state pairs). Rule (c) never decides alone in the realized data; it documents why the fixed-schedule end uses are near-duplicates. The kept end uses have at least 1,309 distinct values per state (natural_gas clothes_dryer in ME) and a median of 29,000-35,040 per end use. build.sh fails if the realized keep list differs from columns.tsv; verify.sh re-derives the rule with a different rescaling test (sum-normalized profiles) and requires identical flags and pair counts. Sample order: states alphabetical, then columns.tsv order. Output bounded at about 234 MB."

[[series]]
id = "resstock_sfd_state_enduse_energy_kwh_15min_f64"
description = "Annual 15-minute energy-consumption profile of one end use for the single-family-detached housing stock of one US state (ResStock 2021, AMY2018 weather)."
semantic_meaning = "Energy consumed by one end use (e.g. electric cooling, natural-gas space heating, plug loads) in kWh per 15-minute interval, summed with ResStock sampling weights over all modeled single-family-detached dwellings of one state, for calendar 2018 actual-meteorological-year weather; interval-ending timestamps 2018-01-01 00:15 .. 2019-01-01 00:00 EST. Natural-gas energy is reported in kWh like electricity. Realized values span 0 to 1.48e7 kWh per interval (per-end-use maxima from 787 kWh for pumps_heating to 1.48e7 kWh for natural_gas heating), depending on end use and on state stock size (37,046 dwellings in DC to 8.13 million in CA); no kept value is negative."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The CSV prints every cell as the shortest round-trip repr of an IEEE-754 double (all 900,126 probed tokens satisfy repr(float(token)) == token, e.g. 2231.8218380655276, 3462031.244523301); float(token) recovers the exact double, which is written unchanged as little-endian float64. In the built output, 0 of 561,304 sampled nonzero stored values (every 50th value of all 833 samples) round-trip through float32. verify.sh requires repr(stored) == source token for every emitted value. Signed zeros are preserved bit-exactly."
source_resources = ["state_sfd_aggregate_csvs", "data_dictionary"]
source_format = "ResStock 2021 timeseries_aggregates by_state CSV (UTF-8/ASCII, comma-separated, unquoted, 59 columns: in.state, in.geometry_building_type_recs, timestamp, models_used, units_represented, 54 out.<fuel>.<end_use>.energy_consumption)"
source_field = "out.<fuel>.<end_use>.energy_consumption table column (float, kWh per 15-minute interval) for the 17 kept end uses"
filtered_input_path = "filtered/nrel_resstock2021_state_enduse_load_profiles_f64/column_selection.json"
filtering = "Only <xx>-single-family_detached.csv state files (49). Only end-use columns that pass the global rule in every state (17 of 48). Excluded: the six totals (sums of end uses); end uses that are all +-0 in some state (in every state, i.e. not modeled: ext_holiday_light, house_fan, pumps_cooling, recirc_pump, vehicle, wood heating; in some states: electric heating_supplement (VT), electric pool_heater (7 states), pv (9 states), fuel_oil heating (4) and water_systems (3), natural-gas hot_tub_heater (7), lighting (DC) and pool_heater (3), propane clothes_dryer/heating/water_systems (DC)); low-cardinality end uses with fewer than 1,000 distinct values in some state (bath_fan, range_fan, extra_refrigerator, propane cooking_range in DC); and fixed-schedule end uses that are both low-cardinality and exact rescalings of each other across same-time-zone states (refrigerator, freezer, exterior and garage lighting, hot tub heater/pump, pool pump, well pump, natural-gas fireplace and grill). Identity columns (in.state, building type), timestamp, models_used and units_represented are not emitted; the latter two go into the index."
missing_value_policy = "No missing values are expected or tolerated: an empty, non-numeric, NaN or infinite cell anywhere in the 54 out.* columns, a missing/extra/out-of-order row, a header change, a wrong state or building type, non-constant models_used/units_represented, or a fuel total inconsistent with its end-use sum is fatal in download.sh (validate), build.sh and verify.sh. Zeros (including -0.0) are genuine values and are kept unchanged; nothing is dropped, imputed or rescaled."
conversion = "float(token) per cell, appended in file (timestamp) order to an array('d') and written as raw little-endian float64 (byte-swapped only on big-endian hosts). One sample = one (state, kept end use) column = 35,040 values = 280,320 bytes, named <STATE>__<fuel>.<end_use>.f64le.bin. Index min/max/distinct/zero/negative counts are computed from the stored doubles."
numeric_kind = "float"
bit_width = 64
endianness = "little"
sample_format = "raw homogeneous little-endian float64 array"
sample_geometry = "annual_15min_time_series"
sample_rank = 1
sample_axes = ["interval_ending_time_est"]
natural_record_kind = "state_building_type_aggregate_end_use_annual_15min_profile_column"
sample_count = 833
total_size_bytes = 233506560
output_path = "samples/nrel_resstock2021_state_enduse_load_profiles_f64/resstock_sfd_state_enduse_energy_kwh_15min_f64/"
