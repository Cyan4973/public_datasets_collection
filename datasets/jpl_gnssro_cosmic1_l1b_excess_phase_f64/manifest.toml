notes = "Three agreeing statements: (1) the AWS Open Data Registry entry (awslabs/open-data-registry datasets/gnss-ro-opendata.yaml) says 'a creative commons license (.../licenses/by/4.0/legalcode) applied to the data contributed by the NASA JPL of the California Institute of Technology' and that each file names its license in 'data_use_license'; (2) the gnss-ro/aws-opendata Readme 'Data use licenses' section lists NASA JPL under the same CC BY 4.0 link (both documents misspell the host as 'creativecommmons.org'; the path is the CC BY 4.0 legal code); (3) every downloaded file's global attribute data_use_license is 'http://creativecommons.org/licenses/by/4.0/' and institution is 'jpl' (checked per file by download.sh, build.sh and verify.sh). UCAR and ROM SAF contributions, which carry different terms, are excluded. Attribute NASA JPL / Caltech and the AWS RO archive."

