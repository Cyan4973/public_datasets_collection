manifest_version = 1
dataset_id = "mpc_goes18_abi_cmi_c13_fulldisk_u16"
name = "GOES-18 ABI CMI Band 13 Full-Disk Brightness-Temperature Codes UInt16"
description = "Twelve complete GOES-18 (GOES-West) ABI L2 Cloud and Moisture Imagery band-13 (10.3 um clean longwave IR window) full-disk 2 km scans, one per month from October 2025 to September 2026, emitted as the native packed 12-bit uint16 brightness-temperature codes with the source off-disk fill preserved."
homepage = "https://planetarycomputer.microsoft.com/dataset/goes-cmi"

[license]
name = "NOAA Open Data Dissemination (NODD) open data; U.S. Government work, no use restrictions"
spdx = "LicenseRef-US-Government-Public-Domain"
url = "https://registry.opendata.aws/noaa-goes/"
citation = "NOAA GOES-R Series Advanced Baseline Imager (ABI) Level 2 Cloud and Moisture Imagery (ABI-L2-MCMIPF), GOES-18, NOAA/NESDIS. Accessed through the NOAA Open Data Dissemination program partner Microsoft Planetary Computer (collection goes-cmi)."
notes = "Grant: the NODD GOES license statement (https://registry.opendata.aws/noaa-goes/) reads 'NOAA data disseminated through NODD are open to the public and can be used as desired ... NOAA requests attribution for the use or dissemination of unaltered NOAA data. However, it is not permissible to state or imply endorsement by or affiliation with NOAA. If you modify NOAA data, you may not state or imply that it is original, unaltered NOAA data.' The NODD FAQ (https://www.noaa.gov/big-data-project-frequently-asked-questions) states 'The NOAA datasets made available through NODD are free for all users to access with no use restrictions and do not require any registration to access' and names Microsoft Azure as one of the three NODD cloud providers. The Planetary Computer collection lists NOAA as licensor; its STAC license field ('proprietary', linking a nesdisia.noaa.gov policy page titled 'Public Domain') is not relied on as the grant. Caveat: every GOES-R NetCDF carries the boilerplate global attribute license='Unclassified data. Access is restricted to approved users only.', which the COG copies into its GDAL metadata; it is a legacy ground-segment attribute contradicted by NOAA's own public NODD distribution of these exact products. Attribute NOAA; the emitted samples are decoded packed codes from Microsoft's COG export, not unaltered NOAA files."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Operational NOAA geostationary weather-satellite imagery (thermal infrared brightness temperature of Earth's disk at 2 km); no people, personal data, or sensitive content."
usage_notes = "Public NOAA environmental data; preserve NOAA attribution and do not imply NOAA endorsement."

