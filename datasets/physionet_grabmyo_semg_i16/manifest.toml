manifest_version = 1
dataset_id = "physionet_grabmyo_semg_i16"
name = "PhysioNet GRABMyo Forearm/Wrist Surface EMG Hand-Gesture Trials Int16"
description = "Every Session 1, trial 1 hand-gesture recording of GRABMyo 1.1.0 (43 participants x 17 gestures = 731 trials): 5 s of 28-channel forearm/wrist surface EMG at 2048 Hz, one frame-interleaved little-endian int16 sample (10,240 frames x 28 channels) per trial, emitted as the published WFDB format-16 stored values."
homepage = "https://physionet.org/content/grabmyo/1.1.0/"

[license]
name = "Creative Commons Attribution 4.0 International"
spdx = "CC-BY-4.0"
url = "https://creativecommons.org/licenses/by/4.0/"
citation = "Jiang, N., Pradhan, A., & He, J. (2024). Gesture Recognition and Biometrics ElectroMyogram (GRABMyo) (version 1.1.0). PhysioNet. https://doi.org/10.13026/89dm-f662. Pradhan, A., He, J., & Jiang, N. (2022). Multi-day dataset of forearm and wrist electromyogram for hand gesture recognition and biometrics. Scientific Data, 9, 733. https://doi.org/10.1038/s41597-022-01836-y. Goldberger, A., et al. (2000). PhysioBank, PhysioToolkit, and PhysioNet. Circulation 101(23), e215-e220."
notes = "The PhysioNet project page (Files section) states 'License (for files): Creative Commons Attribution 4.0 International Public License' and 'Anyone can access the files, as long as they conform to the terms of the specified license' (open access, no credentialing). The release LICENSE.txt (14,842 B, sha256 9a78e7f2..., listed in SHA256SUMS.txt) is the CC BY 4.0 legal code; download.sh pins it and checks its first line. The bundled readme.txt names the Open Data Commons Attribution License v1.0 instead; both are attribution-only permissive licenses, and the recipe follows the project-level CC BY 4.0 grant. Preserve the dataset, article, and PhysioNet attribution."

[safety]
contains_sensitive_data = true
contains_personal_data = false
provenance_notes = "Surface EMG recorded from 43 healthy volunteers at the University of Waterloo, published by PhysioNet as an open-access (non-credentialed) project. Records are named only by session, numeric participant ID, gesture, and trial; the WFDB headers carry no demographic comments."
usage_notes = "Treat as human physiological material. Emitted samples contain only the 28 electrode waveforms; subject-info.csv (anthropometrics) is neither downloaded nor emitted. The upstream project studies these signals as a within-dataset biometric, so the recordings are pseudonymous rather than identity-free; do not attempt re-identification."

