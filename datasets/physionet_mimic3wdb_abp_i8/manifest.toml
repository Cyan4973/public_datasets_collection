manifest_version = 1
dataset_id = "physionet_mimic3wdb_abp_i8"
name = "MIMIC-III Waveform Database Invasive Arterial Blood Pressure (ABP) Channel, WFDB Format-80 Int8"
description = "The 125 Hz invasive arterial blood pressure (ABP) channel of 51 adult ICU waveform segments from the PhysioNet MIMIC-III Waveform Database 1.0 (one segment per record, first qualifying segment in each of 60 pinned records; 9 excluded whole by the content rule), as the stored 8-bit WFDB format-80 digits converted to signed int8 (stored byte - 128). Only segments whose ABP signal carries the single calibration 1.25(-100)/mmHg with 8-bit ADC resolution, all signals in format 80, and at least 500,000 frames are selected; ECG, PLETH, RESP and other channels are never emitted."
homepage = "https://physionet.org/content/mimic3wdb/1.0/"

[license]
name = "Open Data Commons Open Database License v1.0"
spdx = "ODbL-1.0"
url = "https://opendatacommons.org/licenses/odbl/1-0/"
citation = "Moody B, Moody G, Villarroel M, Clifford GD, Silva I. MIMIC-III Waveform Database (version 1.0). PhysioNet (2020). RRID:SCR_007345. https://doi.org/10.13026/c2607m. Original publication: Johnson AEW, Pollard TJ, Shen L, Lehman LH, Feng M, Ghassemi M, Moody B, Szolovits P, Celi LA, Mark RG. MIMIC-III, a freely accessible critical care database. Scientific Data 3, 160035 (2016). Standard PhysioNet citation: Pollard T, et al. PhysioNet as a global platform for biomedical research. Nature Health (2026), doi:10.1038/s44360-026-00096-z."
notes = "The PhysioNet project page states 'Access Policy: Anyone can access the files, as long as they conform to the terms of the specified license. License: Open Data Commons Open Database License v1.0'. The release ships LICENSE.txt with the ODbL 1.0 text (pinned by size and SHA-256); download.sh saves the landing page and requires the access-policy sentence, the license name and the DOI. mimic3wdb is an open-access PhysioNet project (no credentialing or data use agreement, unlike the MIMIC-III Clinical Database). ODbL is share-alike: the derived sample files are an adapted database that must be credited and, if publicly used or redistributed, offered under ODbL 1.0 and kept open. Same open-access class as the accepted PhysioNet recipes (CHARIS, BIDMC, CirCor, TPEHG); ODbL precedent: the accepted OSM, taginfo, OpenFlights and NCLT recipes."

[safety]
contains_sensitive_data = true
contains_personal_data = true
provenance_notes = "De-identified bedside-monitor waveforms of adult ICU patients at Beth Israel Deaconess Medical Center, collected under IRB approval with consent waived because all protected health information was deidentified, and published by PhysioNet as an open-access database. Record names are anonymous numeric IDs; segment headers carry only signal geometry, calibration and a time-of-day base time (no date); master headers carry an ICU location comment."
usage_notes = "Treat as sensitive human clinical material. Emitted samples contain only ABP-channel stored values. Base times, master-header ICU location comments and layout headers are never fetched into or written to samples, index rows, ingest stats or logs (master and layout headers are read only by the author-time discovery script, not by download/build/verify); verify.sh fails if location or time-of-day text appears in the index or stats. The other signals in each .dat are read only to validate their WFDB checksums and are discarded."

