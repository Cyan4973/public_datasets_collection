manifest_version = 1
dataset_id = "earthbigdata_s1_global_coherence_vv_coh12_u8"
name = "Global Seasonal Sentinel-1 Interferometric Coherence, Summer VV 12-day (uint8 tiles)"
description = "Native uint8 seasonal-median 12-day repeat-pass Sentinel-1 C-band VV interferometric coherence (DN = coherence x 100, 0 = nodata) for 150 contiguous 1x1-degree, 3-arcsecond tiles over the interior western United States, decoded from the producer's LZW GeoTIFFs."
homepage = "https://sentinel-1-global-coherence-earthbigdata.s3.us-west-2.amazonaws.com/index.html"

[license]
name = "Creative Commons Attribution 4.0 International"
spdx = "CC-BY-4.0"
url = "https://creativecommons.org/licenses/by/4.0/"
citation = "Kellndorfer, J., Cartus, O., Lavalle, M. et al. Global seasonal Sentinel-1 interferometric coherence and backscatter data set. Sci Data 9, 73 (2022). doi:10.1038/s41597-022-01189-6. Contains modified Copernicus Sentinel data."
notes = "The bucket documentation (index.html, 'License and Citation') states: 'The use of these data fall under the terms and conditions of the Creative Commons Attribution 4.0 International Public License. Contains modified Copernicus Sentinel data.' The Google Earth Engine catalog entry for the same data set (Earth_Big_Data/GLOBAL_SEASONAL_S1/V2019) also lists CC-BY-4.0. Keep the Kellndorfer et al. citation and the Copernicus attribution with any redistribution."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official producer bucket (Earth Big Data LLC / Gamma Remote Sensing AG, under contract for NASA JPL) in the AWS Open Data program; anonymous public HTTPS, not requester-pays; no mirrors."
usage_notes = "Seasonal-median radar coherence over land at ~90 m pixels; no personal data. Only the summer VV COH12 metric is used."

[[origins]]
id = "earthbigdata_s3"
name = "Global Seasonal Sentinel-1 Interferometric Coherence and Backscatter Data Set (AWS S3 bucket sentinel-1-global-coherence-earthbigdata, us-west-2)"
url = "https://sentinel-1-global-coherence-earthbigdata.s3.us-west-2.amazonaws.com/index.html"
type = "bucket"
notes = "Bucket documentation dated 2021-09-08 (Kellndorfer and Cartus) documents tile naming, DN scaling (coherence gamma = DN/100, nodata 0, uint8) and the CC BY 4.0 license. 24,858 tile prefixes exist under data/tiles/."

