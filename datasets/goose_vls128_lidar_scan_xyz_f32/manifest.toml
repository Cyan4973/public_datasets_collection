verify_script = "verify.sh"
sample_index_path = "index/goose_vls128_lidar_scan_xyz_f32/samples.jsonl"
summary = "Range-fetch 64 pinned stored VLS-128 sweep members from the official GOOSE 3D val archive, keep the first three float32 fields (x, y, z) of every 16-byte point record bit-exactly, and emit one N x 3 little-endian float32 sample per sweep."
deterministic_notes = "Selection rule (scripts/goose_zip.py select, documented by discover.sh): for each of the 8 val sequences, sort its *_vls128.bin members by frame number (n = 73..191) and take indices floor((2k+1) n / 16) for k = 0..7. The pinned list in sources.tsv is re-derived from the live central directory on every download. Point order is preserved; samples are named after the source member. Index rows carry point_count, sample_shape [N, 3], sequence, frame, timestamp, source member, CRC32, SHA-256 and min/max computed from the stored float32 values. verify.sh re-derives every sample by byte slicing (no float conversion), re-checks the finite/no-zero-point policy on IEEE-754 bit patterns, rejects constant samples or axes, and checks inventory and manifest totals. Realized: 64 samples, 11,500,411 points, 34,501,233 values, 138,004,932 bytes; median 583,156.5 values per sample (75,290 to 217,338 points per sweep); SHA-256 of all samples concatenated in index order a7cace02b1c8d5f2433d66d043ef1340eeaf5728d1aad63f396342597ddea5d6."

[[series]]
id = "goose_vls128_sweep_xyz_f32"
description = "Cartesian point coordinates of one published Velodyne VLS-128 LiDAR revolution from the GOOSE MuCAR-3 off-road vehicle."
semantic_meaning = "x, y, z position in metres of every returned laser point of one 10 Hz roof-LiDAR revolution, in the roof-LiDAR sensor frame (z up; the ground lies about 2 m below the origin), recorded on unstructured off-road and rural terrain in Bavaria between July 2022 and May 2023 (sequence names indicate field tracks, a training ground, hills and the Mangfall valley, on sunny, rainy and winter days)."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The source stores x, y, z as native little-endian IEEE-754 float32; the sample keeps those three typed values per point bit-exactly. The fourth source field (remission) is integer-valued 0..255 stored as float32 and is dropped rather than emitted as a widened integer."
source_resources = ["goose_3d_val_selected_sweeps"]
source_format = "SemanticKITTI-layout LiDAR scan file (.bin): N x 4 little-endian float32 records (x, y, z, remission), stored uncompressed in goose_3d_val.zip"
source_field = "per-point x, y, z float32 coordinates (first three float32 fields of each 16-byte point record)"
filtered_input_path = "filtered/goose_vls128_lidar_scan_xyz_f32/build_stats.json"
filtering = "8 evenly spaced sweeps from each of the 8 GOOSE 3D val sequences (2022-07-22_flight, 2022-08-30_siegertsbrunn_feldwege, 2022-09-21_garching_uebungsplatz_2, 2022-12-07_aying_hills, 2023-01-20_aying_mangfall_2, 2023-03-03_garching_2, 2023-05-15_neubiberg_rain, 2023-05-17_neubiberg_sunny), out of 961 val sweeps. All points of each selected sweep are kept. Labels, remission, train/test splits and the GOOSE-Ex platforms (ALICE, Spot) are excluded. Sweeps are not filtered by point count: 7 of the 64 published files cover less than 340 degrees of azimuth (6 in 2023-05-17_neubiberg_sunny at 156 to 324 degrees, 1 in 2023-03-03_garching_2 at 323 degrees; see README) and are kept as published."
missing_value_policy = "The upstream files already omit beams without a return (no point lies within about 1 m of the sensor), so point counts vary per sweep. Every x, y, z and remission field must be finite and no point may be an all-zero (x = y = z = 0) padding point; any NaN, infinity or all-zero point is fatal in both build.sh and verify.sh. The realized build found 0 non-finite fields and 0 all-zero points in all 64 sweeps. No values are dropped, reordered, clipped or imputed."
conversion = "Read each payload as N = size / 16 points of four little-endian float32 fields; write fields 0..2 (x, y, z) of every point bit-exactly into an N x 3 row-major (point-major, xyz-interleaved) little-endian float32 array; one sample file per source sweep."
numeric_kind = "float"
bit_width = 32
endianness = "little"
sample_format = "raw little-endian float32 N x 3 point-coordinate array"
sample_geometry = "lidar_point_cloud_points_by_xyz"
sample_rank = 2
sample_axes = ["point", "xyz_component"]
natural_record_kind = "complete_published_vls128_lidar_revolution_scan_file"
sample_count = 64
total_size_bytes = 138004932
