summary = "Decode the pinned normal Modbus/TCP capture and emit uint16 register streams plus IPv4 identification, IPv4 total-length, and TCP response-window sequences."
deterministic_notes = "Source identity, size, MD5, record title, and CC BY 4.0 license are enforced. The parser accepts classic Ethernet/IPv4/unfragmented-TCP PCAP, decodes port-502 packets and Modbus ADUs, correlates function-3/4 responses to requests, and preserves packet order. Exact counts, ranges, cardinalities, transitions, and SHA-256 values are enforced for four register samples and five transport-header samples. Checksums, addresses, ports, TCP sequence/acknowledgment values, the constant request window, and seven uncorrelatable read responses are excluded."

[[series]]
id = "zeroswarm_modbus_input_register_u16"
description = "Anonymous Modbus input-register read sequences from the normal Factory I/O run."
semantic_meaning = "Unsigned 16-bit values returned by Modbus function 4 for input register addresses 0 and 1, one natural sample per address."
role = "primary"
representation_class = "native_numeric"
representation_notes = "Modbus registers are protocol-native unsigned 16-bit big-endian words; outputs preserve each word and convert only to little-endian corpus order."
source_resources = ["zeroswarm_normal_v2_pcap"]
source_format = "Classic PCAP containing Ethernet/IPv4/Modbus-TCP"
source_field = "Function-4 response register words correlated to request start addresses"
filtered_input_path = "filtered/zenodo_zeroswarm_modbus_registers_u16/ingest_stats.json"
filtering = "Keep unit 1 input registers 0 and 1 from all 236,711 complete correlated function-4 responses in capture order."
missing_value_policy = "Missing sources, identity/hash changes, malformed packets, unexpected target keys/counts, changed correlation totals, or constant streams fail the build. The source's exact seven unmatched responses are retained only as an enforced diagnostic count because no request exists to recover their register addresses; no correlated values are dropped or imputed."
conversion = "Decode each two-byte network-order register word as uint16 and write the same value as little-endian uint16."
numeric_kind = "uint"
bit_width = 16
endianness = "little"
sample_format = "raw homogeneous uint16 register time series"
sample_geometry = "1d_industrial_register_time_series"
sample_rank = 1
sample_axes = ["read_observation"]
natural_record_kind = "modbus_unit_register"
sample_count = 2
total_size_bytes = 946844
output_path = "samples/zenodo_zeroswarm_modbus_registers_u16/zeroswarm_modbus_input_register_u16/"

