manifest_version = 1
dataset_id = "figshare_rousettus_vocalizations_i16"
name = "Egyptian Fruit Bat (Rousettus aegyptiacus) Colony Vocalization Recordings, 250 kHz Mono PCM16 (Prat et al. 2017, figshare)"
description = "400 whole triggered ultrasonic-band recordings, evenly spaced over all 293,238 recordings (30 archives, June 2012 to February 2014) of the Prat, Taub, Pratt and Yovel Egyptian fruit bat vocalization dataset, one native little-endian int16 PCM sample (250 kHz, mono) per WAV recording, fetched by HTTP range requests and decoded from LZMA ZIP members."
homepage = "https://doi.org/10.6084/m9.figshare.c.3666502.v2"

[license]
name = "Creative Commons Zero v1.0 Universal (public domain dedication)"
spdx = "CC0-1.0"
url = "https://creativecommons.org/publicdomain/zero/1.0/"
citation = "Prat, Y., Taub, M., Pratt, E. & Yovel, Y. (2017). An annotated dataset of Egyptian fruit bat vocalizations across varying contexts and during vocal ontogeny. Scientific Data 4, 170143. doi:10.1038/sdata.2017.143. Data: Prat, Y., Taub, M., Pratt, E., Yovel, Y. (2017). figshare collection, doi:10.6084/m9.figshare.c.3666502.v2."
notes = "The figshare API reports license {\"value\": 2, \"name\": \"CC0\", \"url\": \"https://creativecommons.org/publicdomain/zero/1.0/\"} for each of the 30 'Egyptian fruit bat vocalizations files NNN' archive articles and for the FileInfo.csv article; download.sh fetches every article JSON and fails unless the license is exactly that and the pinned file id, name, size and md5 are unchanged. The Scientific Data article itself is CC BY 4.0 and states that the CC0 waiver applies to its data. Attribution is not legally required under CC0 but the citation above should be preserved."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official figshare (Springer Nature) collection published with the Scientific Data article; files are served by ndownloader.figshare.com through short-lived presigned S3 redirects. Animal (bat) acoustic recordings from laboratory colony and isolation chambers at Tel Aviv University; no human subjects."
usage_notes = "Public CC0 animal bioacoustic recordings; appropriate for reproducible numeric dataset collection. Only the PCM waveform is emitted; annotations and video are not used."

[[origins]]
id = "figshare_collection_3666502"
name = "figshare collection 3666502 v2: An annotated dataset of Egyptian fruit bat vocalizations across varying contexts and during vocal ontogeny"
url = "https://doi.org/10.6084/m9.figshare.c.3666502.v2"
type = "repository"
version = "v2 (published 2017-09-29)"
notes = "65 articles: 30 vocalization ZIP archives (files101-106, files201-224; 97.8 GB; all CC0), FileInfo.csv, Annotations.csv, Metadata.pdf, Matlab code, and separately curated 'Example of ...' audio/video articles, which this recipe excludes."

[[origins]]
id = "figshare_api"
name = "figshare public API v2"
url = "https://api.figshare.com/v2/articles/"
