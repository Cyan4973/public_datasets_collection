manifest_version = 1
dataset_id = "cdip_waverider_m3_z_displacement_f32"
name = "CDIP Datawell DWR-M3 Waverider Raw Heave Displacement Float32"
description = "Raw 1.28 Hz vertical (heave) sea-surface displacement from Datawell DWR-M3 directional Waverider buoys in the CDIP archive: one contiguous 3-day window from one DWR-M3 deployment at each of 128 CDIP stations, native archive float32 metres."
homepage = "https://cdip.ucsd.edu/"

[license]
name = "CDIP data license: redistribution and use without restriction"
spdx = "LicenseRef-CDIP-Unrestricted"
url = "https://thredds.cdip.ucsd.edu/thredds/dodsC/cdip/archive/100p1/100p1_d10.nc.das"
citation = "Coastal Data Information Program (CDIP), Scripps Institution of Oceanography, University of California San Diego. Station partner and funding per each file's acknowledgment attribute (primarily U.S. Army Corps of Engineers). http://cdip.ucsd.edu"
notes = "Every CDIP archive NetCDF carries the global attribute license = \"These data may be redistributed and used without restriction.\" download.sh fetches each selected deployment's .das and requires that exact string (and the DWR-M3 instrument title) before accepting the window."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official CDIP THREDDS OPeNDAP server operated by Scripps Institution of Oceanography; ocean wave buoy telemetry, no personal content."
usage_notes = "Physical ocean-surface displacement measurements. Preserve CDIP attribution."

[[origins]]
id = "cdip_thredds_archive"
name = "CDIP THREDDS archive (OPeNDAP)"
url = "https://thredds.cdip.ucsd.edu/thredds/catalog/cdip/archive/catalog.html"
type = "data_portal"
notes = "Per-station directories NNNp1 with per-deployment NetCDF files NNNp1_dMM.nc, served via OPeNDAP DAP2 at /thredds/dodsC/."

[[resources]]
id = "dwr_m3_deployment_das"
