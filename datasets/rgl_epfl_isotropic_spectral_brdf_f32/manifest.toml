manifest_version = 1
dataset_id = "rgl_epfl_isotropic_spectral_brdf_f32"
name = "EPFL RGL Material Database Isotropic Spectral BRDF Tensors Float32"
description = "Native float32 measured spectral reflectance tensors (8 incident elevations x 195 wavelengths x adaptive outgoing grid) for all 51 isotropic materials of the EPFL Realistic Graphics Lab material database."
homepage = "https://rgl.epfl.ch/materials"

[license]
name = "Creative Commons Zero v1.0 Universal"
spdx = "CC0-1.0"
url = "https://creativecommons.org/publicdomain/zero/1.0/"
citation = "Jonathan Dupuy and Wenzel Jakob. An Adaptive Parameterization for Efficient Material Acquisition and Rendering. ACM Transactions on Graphics 37(6), Article 274 (SIGGRAPH Asia 2018). DOI 10.1145/3272127.3275059. Data: EPFL Realistic Graphics Lab material database, https://rgl.epfl.ch/materials."
notes = "The database page https://rgl.epfl.ch/pages/lab/material-database states: 'Licensing conditions Unless otherwise noted, all material data is licensed under the Creative Commons Zero ( CC0 ) license.' The per-material panel template on https://rgl.epfl.ch/materials shows 'License:' linking the CC0 1.0 deed for every material, and no material carries an exception. download.sh re-checks both statements on every run."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official goniophotometer measurements of flat material swatches (felts, papers, wall/ceiling/car paints, vinyl wrap films, a maple leaf, a Spectralon reflectance standard, studio-provided paint and fabric samples) published by EPFL RGL on its CloudFront media host."
usage_notes = "Only the numeric spectra tensor is emitted. Material descriptions are kept as index metadata for attribution; renderings, RGB variants, raw pickles and auxiliary tensors are not used."

[[origins]]
id = "rgl_epfl_material_database"
