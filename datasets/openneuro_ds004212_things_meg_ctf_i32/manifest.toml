citation = "Hebart MN, Contier O, Teichmann L, Rockter AH, Zheng CY, Kidder A, Corriveau A, Vaziri-Pashkam M, Baker CI (2023). THINGS-data, a multimodal collection of large-scale datasets for investigating object representations in human brain and behavior. eLife 12:e82580. Data: OpenNeuro ds004212 (THINGS-MEG), doi:10.18112/openneuro.ds004212.v3.0.0."
notes = "The official BIDS dataset_description.json (pinned S3 object version wfsYJNoFXN6rHilyRd9qTP1Uox0FqQcC, MD5 e1cae4f6b155f8325beb0921809b35c3) declares \"License\": \"CC0\" and DatasetDOI doi:10.18112/openneuro.ds004212.v3.0.0; download.sh re-checks both. Citation is requested, not required."

[safety]
contains_sensitive_data = true
contains_personal_data = false
provenance_notes = "Public, de-identified human magnetoencephalography released by the NIH study authors through OpenNeuro under CC0 (NIH IRB protocol 93-M-0170, NCT00001360). Data are fetched from the official OpenNeuro S3 bucket at pinned object versions; no mirrors."
usage_notes = "Human-participant neuroimaging. This recipe emits only anonymous raw MEG gradiometer ADC count streams keyed by BIDS pseudonymous labels (sub-BIGMEG1..4). It does not emit participant tables, demographics, structural MRI, head-shape/fiducial digitisation, head-localisation channels, eye-tracking, event/stimulus files, recording dates, or any free text. res4 headers (which carry recording date/time) stay in the local download cache only and are not copied into samples or the index."

