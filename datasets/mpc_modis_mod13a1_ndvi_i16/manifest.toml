description = "Complete source-native int16 NDVI grids from the Terra MODIS MOD13A1 Collection 6.1 16-day 500 m vegetation-index product: 24 land-dominant sinusoidal tiles on six continents at two opposite-season 2024 composite periods (DOY 017 and 193)."
homepage = "https://planetarycomputer.microsoft.com/dataset/modis-13A1-061"

[license]
name = "Creative Commons Zero 1.0 Universal"
spdx = "CC0-1.0"
url = "https://lpdaac.usgs.gov/data/data-citation-and-policies/"
