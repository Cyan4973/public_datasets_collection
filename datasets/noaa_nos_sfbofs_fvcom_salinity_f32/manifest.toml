type = "file"
version = "SFBOFS FVCOM_4.4.7 fields output (netcdf 4.7.4 / HDF5 1.10.6 writer); 52 objects, t03z cycle nowcast hour 003, dates 2025-01-01 + 7k days (k = 0..51); each 56,605,561 bytes, S3 ETag pinned per object in sources.tsv (itself pinned by SHA-256 in scripts/sfbofs_salinity.py)"
access = "Anonymous HTTPS byte-range GETs with If-Match on the pinned ETag. Per object only nine ranges are fetched (5,036,992 bytes): head [0, 262144), 4096-byte windows at the salinity and time chunk B-tree nodes, the contiguous x/y node coordinates (432,960 bytes), the four raw salinity chunks (4 x 1,082,400 bytes) and the 4096-byte time chunk. Every response must be HTTP 206 with the exact Content-Range, Content-Length and ETag."
size_bytes = 261923584
sha256 = ""
local_path = "downloads/noaa_nos_sfbofs_fvcom_salinity_f32/"
notes = "size_bytes is the total of fetched ranges (52 x 5,036,992), not the 2,943,489,172 bytes of the complete objects. Range offsets are not pinned: they are derived for each object by parsing the fetched head and chunk B-trees (build and verify re-derive them). download_plan.tsv records the SHA-256 of every fetched range. discover.sh documents how sources.tsv was resolved (ListObjectsV2 per exact key). Excluded: other cycles (t09z/t15z/t21z), other nowcast hours and all forecast files, the stations files, and every variable other than salinity (temp, u, v, zeta, fluxes)."

