[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/noaa_nefsc_sbnms_maru_hydrophone_i16/samples.jsonl"
summary = "Fetch 14 pinned 10-channel MARU AIFF files (7 deployments x 2) plus deployment metadata and the NCEI ISO record; de-interleave the big-endian 16-bit SSND frames and emit one little-endian int16 sample per publisher-'Good', live channel."
deterministic_notes = "Selection (discover.sh / scripts/maru.py discover, pinned in files.tsv and meta.tsv): among the 17 nefsc/audio/sbnms deployment folders keep those whose audio objects are all 36,000,054-byte .aif files (10 ch x 1,800,000 frames x 16 bit at 2000 Hz): 200712, 200803, 200809, 200812, 200903_2, 200910_1, 200912, 201004. Dropped: 200803 (NOPP2), whose QUALITY_DETAILS flags every channel 'Unusable'; the FLAC deployments (200806_2, 200903_1, 200905, 200907_3, 200910_2, 200911: single MARU channel per file, different recorders/gain); the 10 kHz AIFF deployments 200806_1 and 200907_1 (180,000,054-byte files, another sampling regime); and 200907_2 (7-channel realigned 2 kHz, 25,200,054 bytes). For each kept deployment the middle .aif in name order fixes a date D and the files *_D_000000.aif and *_D_120000.aif are taken (file-name clock as published; several deployments tag it EST). Channel exclusions, in order, identical in build and verify: (1) channel not listed under quality 'Good' in the deployment JSON (1-based channel numbers, which line up with AIFF channel order: the JSON's blank channels 200712 ch2 and 201004 ch2-3 are the all-zero AIFF channels); (2) all zero; (3) count(min)+count(max) > 1% of frames (railed or stuck unit); (4) one value > 50% of frames; (5) population std < 16 counts (one 12-bit step); (6) byte-identical to an earlier kept channel of the same file. Fatal: any kept value off the 16-count lattice, any size/md5/header mismatch, fewer than 100 kept samples. build.sh and verify.sh run a synthetic self-test (80-bit rate encoding, de-interleave against known channels, every exclusion rule, 9-channel/10 kHz/12-bit-declared/truncated rejection). verify.sh re-checks download md5s, compares the 54 header bytes with the fixed expected layout, de-interleaves by byte lanes instead of the build's array byteswap, re-derives the Good channel set, recomputes exclusions and statistics, and compares every sample byte, index field, exclusion list, the aggregate checksum, floors and these manifest totals. Expected realized output (from 40 KB range probes of every pinned file; to be confirmed by the build): 120 samples (200712 9+9, 200809 7+7, 200812 9+9, 200903_2 9+9 after its all-zero ch4, 200910_1 10+10, 200912 8+8, 201004 8+8), 216,000,000 values, 432,000,000 bytes."

[[series]]
id = "sbnms_maru_2khz_pressure_counts_i16"
description = "15-minute single-site underwater sound-pressure waveforms (2 kHz) from Stellwagen Bank MARU array channels, one sample per kept channel of each pinned 10-channel AIFF file."
semantic_meaning = "Successive raw ADC codes of the hydrophone (acoustic pressure) signal of one bottom-mounted Cornell MARU recorder (one array site), sampled at 2000 Hz with a 12-bit converter and stored MSB-aligned in signed 16-bit (every value is a multiple of 16). Values sit around a recorder-specific DC offset (roughly -500 to -1000 counts) with ambient-noise standard deviations of tens to hundreds of counts and occasional loud events (ships, whale calls). Codes are uncalibrated: no hydrophone sensitivity or gain is applied."
role = "primary"
representation_class = "native_numeric"
representation_notes = "Stored AIFF PCM codes, unchanged apart from big-endian to little-endian byte order and de-interleaving the 10 time-aligned channels; the 12-bit lattice (low 4 bits zero) is kept as stored, not shifted. No filtering, DC removal, resampling or calibration."
source_resources = ["maru_aiff", "deployment_metadata", "iso_record"]
source_format = "AIFF (FORM/AIFF, COMM + SSND), 10 channels, 16-bit big-endian signed PCM, 2000 Hz, 1,800,000 frames per 15-minute file"
source_field = "SSND sound data: one channel (MARU site) of the interleaved 10-channel 16-bit PCM frames"
filtered_input_path = "filtered/noaa_nefsc_sbnms_maru_hydrophone_i16/ingest_stats.json"
filtering = "The 14 files pinned in files.tsv (selection in processing.deterministic_notes). Per file, channels not flagged 'Good' by the publisher's QUALITY_DETAILS, all-zero, railed (min+max share > 1%), single-value-dominated (> 50%), near-constant (std < 16) or duplicate channels are excluded and listed with their statistics in ingest_stats.json."
missing_value_policy = "PCM has no missing-value sentinel. Blank (all-zero) placeholder channels for lost or failed recorders are excluded whole, never emitted; every value of every kept channel is emitted, including any full-scale codes (-32768 / 32752), counted per sample in the index (full_scale_count). Header, size or md5 mismatches are fatal; verify applies the same exclusion rules."
conversion = "Walk the IFF chunks (COMM, SSND, nothing else; FORM size + 8 = file size), require 10 channels, 1,800,000 frames, 16 bits, 80-bit extended sample rate exactly 2000.0, SSND offset 0, block size 0 and 36,000,000 data bytes at byte 54. Read the frames as big-endian int16, byte-swap to native, take channel c as every 10th value starting at c, and write it little-endian as one .bin of 1,800,000 int16 (3,600,000 bytes) named <deployment>__<file stem>__ch<NN>.bin (NN = 1-based channel)."
numeric_kind = "int"
bit_width = 16
endianness = "little"
sample_format = "raw homogeneous little-endian signed int16 PCM, one channel"
sample_geometry = "single_channel_hydrophone_waveform"
sample_rank = 1
sample_axes = ["time_sample_2000hz"]
natural_record_kind = "one_maru_site_channel_of_a_15min_array_aiff_file"
sample_count = 120
