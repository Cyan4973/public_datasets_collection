manifest_version = 1
dataset_id = "mdpl2_nbody_dm_particle_xyz_f64"
name = "MultiDark-Planck 2 (MDPL2) N-Body Dark-Matter Particle Positions, a = 0.7333 Snapshot, Float64"
description = "Native float64 comoving x, y, z positions (Mpc/h) of dark-matter particles in the periodic 1 Gpc/h MDPL2 N-body simulation at scale factor a = 0.7333 (z = 0.36), from the authors' published 72-million-particle downsample on Zenodo; the first 16,000,000 particles in catalog order."
homepage = "https://doi.org/10.5281/zenodo.5259075"

[license]
name = "Creative Commons Attribution 4.0 International"
spdx = "CC-BY-4.0"
url = "https://creativecommons.org/licenses/by/4.0/"
citation = "Huang, S., Leauthaud, A., Bradshaw, C., Hearin, A., Behroozi, P., Lange, J., Greene, J., DeRose, J., Speagle, J., Xhakaj, E. (2021). The Outer Stellar Mass of Massive Galaxies: A Simple Tracer of Halo Mass with Scatter Comparable to Richness and Reduced Projection Effects (1.0) [Data set]. Zenodo. https://doi.org/10.5281/zenodo.5259075. Simulation: Klypin, A., Yepes, G., Gottlöber, S., Prada, F., Heß, S. (2016), MultiDark simulations: the story of dark matter halo concentrations and density profiles, MNRAS 457, 4340; MultiDark Database: Riebe, K., et al. (2013), AN 334, 691."
notes = "Zenodo API metadata.license.id = 'cc-by-4.0' for record 5259075; download.sh re-checks it, and the file's listed size and MD5, on every run. The record description adds no restriction. Upstream, the MultiDark Database credits page (https://www.cosmosim.org/cms/credits/) welcomes use of its simulation data 'for your own scientific purposes without further consultation with the scientists who generated them' and asks for its acknowledgement paragraph and the simulation papers to be cited; that is a statement of intent and a credit request, not a license restriction. The CosmoSim terms of use (https://www.cosmosim.org/accounts/terms_of_use/) govern registered accounts and query storage, not the data (storage is 'provided for scientific uses' and AIP may remove storage used for commercial purposes); this recipe uses no CosmoSim account or service. The MultiDark Database publishes no formal data license, so the grant rests on the Zenodo record's CC BY 4.0. Attribute the Zenodo authors, the MDPL2 simulation and the MultiDark Database."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official author deposit on Zenodo (record 5259075, version 1.0, the latest of two versions), fetched by one HTTP byte range from the Zenodo files API; no mirrors. The particles come from the MDPL2 simulation of the MultiDark project, distributed by the CosmoSim / MultiDark Database at AIP."
usage_notes = "Simulated cosmological particle positions only; no personal or sensitive content."

