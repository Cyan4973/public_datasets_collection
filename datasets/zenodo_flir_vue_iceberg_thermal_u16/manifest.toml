[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/zenodo_flir_vue_iceberg_thermal_u16/samples.jsonl"
summary = "Range-download 360 TIFF members (every 8th 1 Hz frame per session) from five pinned Zenodo zips, raw-inflate and CRC-check each, parse the TIFF IFD, and emit each 640x512 uint16 T-linear temperature plane (0.04 K per count) unchanged as one little-endian sample per frame."
deterministic_notes = "Population: all 2,859 unique .tiff frames in the five non-duplicate session zips (295 + 346 + 634 + 798 + 786; the 20180820 pair is one flight split at 04:00:00). Consecutive 1 Hz frames are near-duplicates, so the bounded subset is frames with index % 8 == 0 in filename (= capture time) order within each session: 37 + 44 + 80 + 100 + 99 = 360 frames, pinned in scripts/frames.tsv (which also lists the unselected frames, selected = 0). discover.sh re-derives the table from tail ranges of the zips. TIFF decode honours II/MM byte order and StripOffsets/StripByteCounts (all observed frames are II with one 655,360-byte strip at offset 8, but this is not assumed). Every frame must carry XMP Camera:TlinearGain = 0.04 (exactly once) and Camera:IsNormalized = 1, else fatal in download/build/verify. Per-frame semantic gates: >= 32 distinct values, modal value <= 25% of pixels, max - min >= 50 steps (2 K), <= 0.1% of pixels at 0 or 65535. Build rejects duplicate frame content (sha256). verify.sh re-inflates and re-decodes every member, compares bytes with the stored sample, recomputes statistics from the stored files, and checks index fields, uniqueness, directory contents, ingest stats, and the manifest totals."

[[series]]
id = "flir_tlinear_temperature_u16"
description = "In-camera T-linear scene (brightness) temperatures, 0.04 K per count, from a FLIR Vue Pro R 640 (13 mm) uncooled microbolometer: 640x512 frames of a drifting iceberg and surrounding seawater."
semantic_meaning = "Per pixel, the camera's in-camera T-linear scene (brightness) temperature in units of 0.04 K: kelvin = value x 0.04 (Celsius = value x 0.04 - 273.15). Observed 6,647-8,031 = about 265.9-321.2 K: iceberg about -6 to 0 C, seawater about 10-17 C, the ship deck at takeoff up to about 48 C. The camera applies its own radiometric calibration and linearization; these are uncorrected scene brightness temperatures (the recipe applies no emissivity or atmospheric correction and no scaling). Evidence: every frame's XMP packet (TIFF tag 700) declares <Camera:TlinearGain>0.04</Camera:TlinearGain> and <Camera:IsNormalized>1</Camera:IsNormalized> (checked for all 360 selected frames and enforced by decode_tiff), and the uploader's notebook make_FLIR_vid.ipynb in the same record converts pixels with image_array * 0.04 - 273.15."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The camera itself writes linearized temperatures (T-linear high-resolution mode, 0.04 K per count, IsNormalized = 1) as an uncompressed 16-bit single-channel TIFF strip; the recipe reverses only the zip deflate and (if MM) byte order and applies no scaling or offset. Evidence: every frame's XMP packet (TIFF tag 700) declares <Camera:TlinearGain>0.04</Camera:TlinearGain> and <Camera:IsNormalized>1</Camera:IsNormalized> (checked for all 360 selected frames and enforced by decode_tiff), and the uploader's notebook make_FLIR_vid.ipynb in the same record converts pixels with image_array * 0.04 - 273.15. The rest of the XMP/EXIF metadata is not emitted."
source_resources = ["session_zip_members"]
source_format = "Uncompressed baseline TIFF (BitsPerSample 16, SamplesPerPixel 1, Photometric MinIsBlack, Make FLIR, Model 'Vue Pro R 640 13mm') stored as a deflated zip member <session>/<YYYYMMDD_HHMMSS>.tiff"
source_field = "IFD0 image strip(s): 640x512 uint16 T-linear scene-temperature raster (0.04 K per count)"
filtered_input_path = "filtered/zenodo_flir_vue_iceberg_thermal_u16/ingest_stats.json"
filtering = "Every 8th frame in capture-time order within each of five unique sessions (360 of 2,859). All pixels of each selected frame are kept. Excluded: the duplicate session zip 20180821_160000.zip, AVI renders and __MACOSX resource forks inside the zips, the example notebook, and the TIFF metadata (EXIF/XMP/FLIR maker notes; the XMP T-linear gain is checked, not emitted)."
missing_value_policy = "Radiometric frames have no missing pixels or sentinel values. Any range-length, Content-Range, CRC32, size, data-descriptor, TIFF-structure mismatch, or missing/different XMP Camera:TlinearGain (must be exactly 0.04) or Camera:IsNormalized (must be 1) is fatal in download.sh, build.sh, and verify.sh, as is any frame failing the semantic gates (distinct values, modal fraction, dynamic range, 0/65535 fraction) or duplicating another frame. Nothing is dropped or imputed."
conversion = "Raw-inflate the zip member, parse TIFF IFD0 with the declared byte order, concatenate StripOffsets/StripByteCounts strips (655,360 bytes), byte-swap only if the TIFF is big-endian (none observed), and write the 327,680 uint16 values unchanged in row-major order as little-endian; one file per frame named <YYYYMMDD_HHMMSS>_h512_w640_u16le.bin."
numeric_kind = "uint"
bit_width = 16
endianness = "little"
sample_format = "raw homogeneous uint16 T-linear scene-temperature raster, 0.04 K per count"
