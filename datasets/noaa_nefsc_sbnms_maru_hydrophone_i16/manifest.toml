notes = "The NCEI ISO 19115 record gov.noaa.ncei.pad:NEFSC_SBNMS_Raw_Data (DOI 10.25921/g3vk-v972) links the exact bucket path console.cloud.google.com/storage/browser/noaa-passive-bioacoustic/nefsc/audio/sbnms and lists as its only constraints: 'Distribution liability: NOAA and NCEI make no warranty, expressed or implied, regarding these data ...', 'Use liability: NOAA and NCEI cannot provide any warranty as to the accuracy, reliability, or completeness of furnished data ...' and 'Cite as: NOAA Northeast Fisheries Science Center and NOAA Office of National Marine Sanctuaries. 2020. ...'. download.sh re-fetches the record and fails if the DOI, the bucket link or the 'Cite as' text is missing or if any other constraint text appears. The bucket's nefsc/README.pdf names the provider as 'NOAA Northeast Fisheries Science Center (NEFSC)' and gives the same citation. NOAA/NEFSC/ONMS products are works of the U.S. Government (17 U.S.C. 105); same basis as the accepted noaa_goes16_xrs_1s_flux_f32 recipe (NCEI ISO record with only a citation request and liability disclaimers). Caveat: the recording instruments are Cornell University MARUs and the deployment metadata list Cornell scientists, but the archive's authorship, citation and distribution are NOAA's and no separate rights statement exists. Keep the citation and the no-warranty disclaimer."

