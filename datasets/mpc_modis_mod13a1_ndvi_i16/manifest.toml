notes = "The Planetary Computer collection's license link is the LP DAAC data-citation-and-policies page, which redirects to NASA Earthdata 'Data Use Guidance' (https://www.earthdata.nasa.gov/engage/open-data-services-software-policies/data-use-guidance): 'Unless the content is marked with a use restriction or license, data provided from a NASA-led mission are licensed as Creative Commons Zero (CC0). While there are no restrictions on the use of these data, data users are very strongly urged to cite the data used in their work products.' The STAC collection names NASA LP DAAC as producer and licensor; MOD13A1 carries no product-specific restriction. The STAC 'license' field reads 'proprietary' only as a pointer to that link (same evidence chain as the accepted modis_active_fire_mask_u8). Preserve the DOI, NASA/LP DAAC attribution, collection version, item IDs, and dates."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Public NASA Earth-observation vegetation-index grids produced by LP DAAC/MODAPS and mirrored by Microsoft Planetary Computer as COGs; no personal or sensitive data."
usage_notes = "CC0 NASA mission data suitable for model training; cite the MOD13A1.061 DOI."

