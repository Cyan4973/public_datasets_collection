manifest_version = 1
dataset_id = "tcia_ldct_siemens_ct_projections_u16"
name = "TCIA LDCT-and-Projection-data Siemens Full-Dose Helical CT Projection Views UInt16"
description = "Stored unsigned 16-bit DICOM-CT-PD projection views (736 detector columns x 64 detector rows) from Siemens SOMATOM Definition Flash full-dose helical chest and abdomen CT scans: 20 deterministically selected views from each of the 100 public CC BY 4.0 Siemens full-dose projection series."
homepage = "https://www.cancerimagingarchive.net/collection/ldct-and-projection-data/"

[license]
name = "Creative Commons Attribution 4.0 International"
spdx = "CC-BY-4.0"
url = "https://creativecommons.org/licenses/by/4.0/"
citation = "McCollough, C., Chen, B., Holmes III, D., Duan, X., Yu, Z., Yu, L., Leng, S., Fletcher, J. (2020). Low Dose CT Image and Projection Data (LDCT-and-Projection-data) (Version 7) [dataset]. The Cancer Imaging Archive. https://doi.org/10.7937/9npb-2637. Format: Chen B. et al., Med. Phys. 42(12):6964 (2015), doi:10.1118/1.4935406. Dataset paper: Moen T. R. et al., Med. Phys. (2020), doi:10.1002/mp.14594."
notes = "The TCIA collection page lists the 'Images of the Chest' and 'Images of the Liver' downloads as CC BY 4.0 and states: 'Changed license for Chest and Liver patients from NIH Controlled Data Access (TCIA Restricted) to CC 4.0.' Every pinned NBIA getSeries row carries LicenseName 'Creative Commons Attribution 4.0 International License' and LicenseURI https://creativecommons.org/licenses/by/4.0/; download.sh re-asserts this on every run. Head (N*) subjects remain NIH-controlled and are not listed by the public API or used here. Attribution must include the data citation and DOI; publications should acknowledge grants EB017095 and EB017185."

[safety]
contains_sensitive_data = true
contains_personal_data = false
provenance_notes = "Official TCIA NBIA public API, de-identified (DICOMANON / CTP) clinical CT projection data from Mayo Clinic released in the LDCT-and-Projection-data collection."
usage_notes = "Samples contain only detector projection codes. The index carries technical acquisition metadata and TCIA pseudonymous subject IDs (C###/L###) for provenance; DICOM demographics, dates and free text are not emitted. Do not attempt participant re-identification or linkage."

