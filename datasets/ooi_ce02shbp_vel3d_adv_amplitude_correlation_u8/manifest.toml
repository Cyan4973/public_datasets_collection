notes = "OOI publishes no checksums. Each file is pinned by size and nginx ETag (hex mtime-size) checked by HEAD before fetching; download.sh self-hashes each file (SHA-256) into download_plan.tsv, and build/verify re-check those hashes."

[local_paths]
downloads = "downloads/ooi_ce02shbp_vel3d_adv_amplitude_correlation_u8/"
filtered = "filtered/ooi_ce02shbp_vel3d_adv_amplitude_correlation_u8/"
