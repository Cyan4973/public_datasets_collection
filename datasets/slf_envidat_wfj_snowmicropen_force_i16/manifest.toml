[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/slf_envidat_wfj_snowmicropen_force_i16/samples.jsonl"
summary = "Range-fetch 291 pinned S36M .PNT members from raw_data.zip (central-directory match + CRC32), parse each SMP v4 header, and emit the samples.force.count big-endian int16 force counts after the 512-byte header as one little-endian int16 sample per profile."
deterministic_notes = "Selection: raw_data.csv rows with File starting 'S36M', BestOfDay=1 and Quality=1 (438 of 478), then PNT header sensor and amplifier range 5000 pC (291 kept; the 147 range-10000 profiles from 2019-03..2020-12 are pinned in excluded_gain10000.tsv because their counts sit on a 2x coarser N/count scale). build.sh asserts firmware 406/408, SMP serial 36, header filename = member stem, spatial resolution 0.00413223 mm, speed 20 mm/s, tip 5000 um, force conversion factor in [0.00129, 0.00132] N/count and equal to the pinned value, and samples.force.count equal to the pinned count. Samples are emitted in members.tsv (zip path) order. verify.sh re-decodes with struct, requires byte equality, sha256, min/max/distinct, no value above 50% of a profile, and manifest totals."

[[series]]
id = "smp_s36m_force_counts_i16"
description = "SnowMicroPen S36M raw penetration-force ADC counts, one complete vertical profile per sample."
semantic_meaning = "Signed 16-bit ADC count of the SMP piezo force sensor sampled every 0.00413 mm of tip travel while the 5 mm tip is driven at 20 mm/s from ~10 cm above the snow surface down through the snowpack; force in newtons = count x samples.conv.force (0.001293-0.001316 N/count across the five sensors used)."
role = "primary"
representation_class = "native_numeric"
representation_notes = "Values are the instrument's own int16 force counts, only byte-swapped from big-endian to little-endian."
source_resources = ["raw_data_zip_selected_members", "raw_data_csv"]
source_format = "SnowMicroPen v4 .PNT binary profile (512-byte big-endian header + big-endian int16 force samples)"
source_field = "force samples (samples.force.count big-endian int16 values starting at byte 512)"
filtered_input_path = "filtered/slf_envidat_wfj_snowmicropen_force_i16/build_summary.json"
filtering = "Keep every force sample of each selected profile, including the native air segment above the snow surface and any sensor-overload saturation (32767) at the bottom; bytes after the last counted sample (padding such as 0x7fff, 0xffff or ASCII fill) are ignored. The first word at byte 512 is kept as snowmicropyn's Pnt.load does, although in ~60% of these files it is an outlier (e.g. 8202, 7061) rather than an air-level count."
missing_value_policy = "No values are dropped, imputed or masked. A missing member, size/CRC mismatch, header field outside the asserted values, count exceeding the file, or a degenerate profile (<50 distinct values, range <100 counts, one value >50% of samples) fails the recipe."
conversion = "Inflate the deflated zip member, read samples.force.count as '>l' at offset 358, read that many '>h' values from byte 512, and write them as little-endian int16 in source order to samples/<id>/smp_s36m_force_counts_i16/<YYYYMMDD>_<S36Mnnnn>.bin. The per-profile conversion factor and spatial resolution are recorded in the index, not applied."
numeric_kind = "int"
bit_width = 16
endianness = "little"
sample_format = "raw homogeneous little-endian int16 force-count array"
sample_geometry = "depth_profile_1d"
sample_rank = 1
sample_axes = ["penetration_depth_step"]
natural_record_kind = "snowmicropen_penetration_profile"
sample_count = 291
total_size_bytes = 239416112
output_path = "samples/slf_envidat_wfj_snowmicropen_force_i16/smp_s36m_force_counts_i16/"
