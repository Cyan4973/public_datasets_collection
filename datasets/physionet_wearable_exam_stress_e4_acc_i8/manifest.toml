manifest_version = 1
dataset_id = "physionet_wearable_exam_stress_e4_acc_i8"
name = "PhysioNet Wearable Exam Stress: Empatica E4 Wrist Tri-Axial Accelerometer Int8"
description = "All 30 Empatica E4 wristband accelerometer session recordings of PhysioNet's Wearable Exam Stress Dataset 1.0.0 (10 university students x midterm_1, midterm_2, Final). Each sample is one session's ACC.csv with its two header rows removed: interleaved x,y,z signed int8 values in the device's native 1/64 g counts (±2 g range), 32 Hz."
homepage = "https://physionet.org/content/wearable-exam-stress/1.0.0/"

[license]
name = "Open Data Commons Attribution License v1.0"
spdx = "ODC-By-1.0"
url = "https://opendatacommons.org/licenses/by/1-0/"
citation = "Amin, M. R., Wickramasuriya, D., & Faghih, R. T. (2022). A Wearable Exam Stress Dataset for Predicting Cognitive Performance in Real-World Settings (version 1.0.0). PhysioNet. RRID:SCR_007345. https://doi.org/10.13026/kvkb-aj90. Standard PhysioNet citation: Goldberger A, et al. PhysioBank, PhysioToolkit, and PhysioNet. Circulation 101(23):e215-e220 (2000)."
notes = "The release ships LICENSE.txt (ODC-By 1.0 text, 20,402 B, SHA-256 86c0ad30..., also listed in the release SHA256SUMS.txt); download.sh pins it by hash. The project page states 'Access Policy: Anyone can access the files, as long as they conform to the terms of the specified license. License: Open Data Commons Attribution License v1.0' (open access, no credentialing or data use agreement); download.sh saves the page and requires those statements and the DOI. Same license and access class as the accepted physionet_charis_icp_i16 and physionet_bidmc_ppg_resp_i16 recipes. Preserve the dataset DOI and PhysioNet attribution."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "De-identified human-subject wearable recordings published by PhysioNet as an open-access database (University of Houston study; 10 students, two female and eight male, gender not given per participant). Upstream unix timestamps are date-shifted for de-identification. Subjects are identified only as S1..S10."
usage_notes = "Only the accelerometer files are fetched and emitted. StudentGrades.txt, the physiological channels (BVP, EDA, TEMP, HR, IBI) and tags.csv are never downloaded. The only header-derived metadata kept is the date-shifted session start time and the 32 Hz rate, as index fields."

