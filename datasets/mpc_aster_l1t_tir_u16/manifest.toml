[[resources]]
id = "aster_l1t_tir_cogs"
origin = "planetary_computer_aster_l1t"
url = "https://astersa.blob.core.windows.net/aster/images/L1T/"
type = "file"
version = "51 exact AST_L1T v003 STAC items (AST_L1T_00302152001103411_20150414204656 ... AST_L1T_00309122003020020_20150430201556), asset TIR; item id, href, Content-Length and Azure Content-MD5 pinned in sources.tsv (resolved by discover.sh on 2026-10-05)."
access = "Public anonymous HTTPS with a Planetary Computer SAS appended per run; resumable curl."
size_bytes = 157104582
sha256 = ""
local_path = "downloads/mpc_aster_l1t_tir_u16/tir/"
notes = "Each COG is a classic little-endian TIFF whose primary IFD is a 5-sample-per-pixel uint16 raster (BitsPerSample 16 x5, SampleFormat 1, PlanarConfiguration 1 = chunky), Deflate-compressed in 512x512 tiles with Predictor 2; GDAL metadata names the bands ImageData10..ImageData14. Overview IFDs are ignored. No GDAL_NODATA tag is set (0 is the swath fill by convention and by inspection). Per-file integrity: exact size and Azure Content-MD5 (published for all 51 files, pinned), full tile-inflate check at download time; sha256 receipts in downloads/<id>/download_receipts.tsv and in the sample index."

[local_paths]
downloads = "downloads/mpc_aster_l1t_tir_u16/"
filtered = "filtered/mpc_aster_l1t_tir_u16/"
