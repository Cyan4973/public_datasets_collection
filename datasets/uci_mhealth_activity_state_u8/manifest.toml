deterministic_notes = "All ten source recordings are retained in numeric subject order. Row order and every documented activity code are preserved. No sensor channels, timestamps, labels remapped by the recipe, or cross-subject concatenations are emitted."

[[series]]
id = "mhealth_activity_id_u8"
description = "MHEALTH activity-state code at each 50 Hz observation."
semantic_meaning = "Documented activity ID 0..12 for each observation in one subject's continuous MHEALTH recording; 0 denotes the null/no-activity class and 1..12 denote the protocol activities."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The source log stores the activity annotation as a numeric integer field. The recipe preserves its value and order, changing only the physical representation to one unsigned byte per observation."
source_resources = ["mhealth_archive"]
source_format = "whitespace_delimited_mhealth_subject_log"
source_field = "column_24_activity_label"
filtered_input_path = "filtered/uci_mhealth_activity_state_u8/ingest_stats.json"
filtering = "Keep the final activity-label field from every valid row in each of the ten complete subject recordings."
missing_value_policy = "Missing subjects, malformed rows, non-integral labels, labels outside 0..12, empty recordings, and constant recordings are fatal. Code 0 is a documented state and is preserved."
conversion = "Parse source column 24 as its documented integer activity ID and write it unchanged as uint8 in source row order."
numeric_kind = "uint"
bit_width = 8
endianness = "little"
sample_format = "raw homogeneous uint8 activity-state sequence"
sample_geometry = "1d_subject_recording_timeline"
sample_rank = 1
sample_axes = ["observation_order"]
natural_record_kind = "complete_mhealth_subject_recording"
sample_count = 10
