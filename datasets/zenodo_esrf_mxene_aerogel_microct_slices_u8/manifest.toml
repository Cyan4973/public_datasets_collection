contains_personal_data = false
provenance_notes = "Official author deposits on Zenodo (University of Manchester / ESRF beamtime). Materials-science instrument data of a synthetic aerogel; no people, animals, or personal data involved."
usage_notes = "Public CC BY 4.0 scientific imaging data; only reconstructed voxel grey levels are emitted."

