[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/dandi_ibl_bwm_spike_amplitudes_f64/samples.jsonl"
summary = "Validate the published version's license and the two pinned assets, walk each NWB file's HDF5 metadata over cached 64 KiB byte ranges, fetch only the deflate chunks of units/spike_amplitudes_uV plus its VectorIndex, and emit one complete little-endian float64 amplitude vector per spike-sorted unit with at least 1,000 spikes."
deterministic_notes = "Session selection: labs ordered by their first processed asset in path order (lab read from /general/lab of each subject's first asset), each lab's first asset kept while the cumulative stored spike count stays <= 62,500,000 (a 500 MB float64 budget), at most three sessions; this yields zadorlab and danlab (selection.tsv; discover.sh reproduces it). Pinned per session in sessions.tsv: blob URL, size, dandi etag and sha2-256, lab, institution, subject, session eid, NWB identifier, unit and spike counts, chunk count (= ceil(spikes / 1,250,000)), total stored chunk bytes, index chunk bytes, kept units and kept spikes. The reader requires superblock v0, v1 object headers, symbol-table groups, H5T_IEEE_F64LE amplitudes and H5T_STD_U32LE index, a deflate-only filter, filter mask 0 and an exact 1-D chunk grid. Each chunk must inflate to exactly 10,000,000 bytes; the valid decoded size must equal 8 x spikes; the index must be monotone with last entry = spikes. build.sh and verify.sh first run a synthetic HDF5 self-test; verify.sh re-decodes by a different strategy and byte-compares every sample."

[[series]]
id = "ibl_unit_spike_amplitudes_uv_f64"
description = "Per-spike peak amplitudes, in microvolts, of individual spike-sorted Neuropixels 1.0 units from the IBL Brain-Wide Map."
semantic_meaning = "Peak amplitude of each spike assigned to one spike-sorted unit, in microvolts (NWB description: 'Peak amplitude of each spike for each unit in microvolts.'), in stored order (element-aligned with the unit's units/spike_times entries, which are not collected). Spike sorting is IBL's iblsorter (Python Kilosort 2.5) on Neuropixels 1.0 probes in head-fixed mice performing the IBL decision-making task; one sample is one unit's complete amplitude vector over the whole recording session."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The NWB column is declared H5T_IEEE_F64LE and every stored float64 bit pattern is copied unchanged. Width disclosure: the values are not full-precision float64 measurements. Within each unit every amplitude equals a float32 per-spike Kilosort amplitude multiplied by one per-unit float64 scale (consistent with the template amplitude times the probe gain, expressed in microvolts). The per-unit ratio/LCM test confirms this: all ratios v_i / v_ref are ratios of 24-bit float32 mantissas to within about 2e-16 (denominator LCM <= 24 bits), while generic float64 gives LCMs of thousands of bits. Realized build: all 1,321 kept units pass the test (LCM 23-24 bits, max relative error 4.4e-16), yet 0 of the 57,416,236 values are float32-exact, so the column cannot be narrowed to float32 without also storing the per-unit scale. build and verify record the test result for every kept unit."
source_resources = ["nwb_zadorlab_csh_zad_001", "nwb_danlab_dy_008"]
source_format = "NWB 2.9.0 HDF5 file (superblock v0); chunked deflate H5T_IEEE_F64LE ragged VectorData with H5T_STD_U32LE VectorIndex"
source_field = "/units/spike_amplitudes_uV sliced by /units/spike_amplitudes_uV_index (one unit row per slice)"
filtered_input_path = "filtered/dandi_ibl_bwm_spike_amplitudes_f64/ingest_stats.json"
filtering = "Both selected sessions, every unit row with at least 1,000 spikes, all of that unit's spikes in stored order. Dropped as below the per-sample floor: 38 of 519 zadorlab units (12,246 spikes) and 174 of 1,014 danlab units (65,243 spikes). Units are kept regardless of Kilosort or IBL quality label. Excluded as different quantities: spike_times, spike_distances_from_probe_tip_um, waveform_mean and every per-unit summary column (firing rate, quality metrics, median/min/max amplitude, etc.)."
missing_value_policy = "The column has no missing-value sentinel. Every value must be finite (any NaN or Inf is fatal), and nothing is clipped, imputed or reordered. Non-positive amplitudes would be kept and counted (the index records nonpositive_values). Fatal: a constant unit, a duplicate sample, a changed shape, chunk grid, dtype, filter, description, pin or range checksum, a non-monotone index, an index whose last entry differs from the spike count, or a decoded size other than 8 x spikes. Units below 1,000 spikes are excluded by rule, not by data quality."
conversion = "For each session: navigate the symbol-table groups to /units, validate both datasets, and walk the v1 chunk B-tree of spike_amplitudes_uV (chunks of 1,250,000 values). zlib-inflate each fetched chunk to exactly 10,000,000 bytes and drop only the edge chunk's padding past the dataset length. Inflate the uint32 index, take unit u's slice [index[u-1], index[u]) (index[-1] = 0), and write those native little-endian float64 bytes unchanged to <subject>_ses-<eid8>_unit<row>.bin."
numeric_kind = "float"
bit_width = 64
endianness = "little"
sample_format = "raw homogeneous little-endian float64 per-unit spike-amplitude vector"
sample_geometry = "spike_sorted_unit_amplitude_sequence_1d"
sample_rank = 1
sample_axes = ["spike_of_unit"]
natural_record_kind = "complete_spike_amplitude_vector_of_one_spike_sorted_unit"
sample_count = 1321
total_size_bytes = 459329888
output_path = "samples/dandi_ibl_bwm_spike_amplitudes_f64/ibl_unit_spike_amplitudes_uv_f64/"
