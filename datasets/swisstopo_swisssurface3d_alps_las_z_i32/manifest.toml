[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/swisstopo_swisssurface3d_alps_las_z_i32/samples.jsonl"
summary = "Download 15 pinned swissSURFACE3D 2021 tile zips. Stream each single LAS 1.2 point-format-1 member through zipfile, with its CRC-32 enforced. Copy the int32 Z at offset 8 of every 28-byte record into one raw little-endian int32 sample per tile."
deterministic_notes = "Selection, documented in scripts/discover.py: STAC bbox 7.85,46.40,8.15,46.60 returns 647 items. Of these, 327 are 2021 tiles with no other-year item for the same tile, and 325 of those have the uniform las2las LAS 1.2 pf1/28 B/scale 0.01/Z offset 0 header. Sorted by id, the tiles at index floor(j*325/15 + 325/30), j=0..14, are kept. download.sh enforces the zip size and SHA-256, a single member with pinned size/CRC, a header that matches the pinned profile, and a full inflate. build.sh requires data Z min/max to equal the header bounds, codes within 100,000-500,000 (1,000-5,000 m), at least 10,000 distinct values, and no single value above 5% of a tile. verify.sh re-derives each sample with whole-record struct decoding, compares bytes and SHA-256, and checks index fields, manifest totals, and duplicates."

[[series]]
id = "swisssurface3d_z_i32"
description = "Per-return LAS Z elevation codes of complete swissSURFACE3D 2021 high-alpine lidar tiles."
semantic_meaning = "Stored LAS point-record Z integer of each lidar return. Height above LN02 datum = Z * 0.01 m (offset 0). The selected tiles span about 1,612-3,883 m, so codes are 161,267-388,304 (about 19 bits, beyond the uint16 range)."
role = "primary"
representation_class = "native_numeric"
representation_notes = "Byte-for-byte copy of the source LAS int32 Z field; no rescaling, reordering, or width change."
source_resources = ["swisssurface3d_2021_tile_zips"]
source_format = "LAS 1.2 point data record format 1 (28-byte records) inside a single-member deflate zip"
source_field = "Z (int32 at record offset 8; scale 0.01, offset 0)"
filtered_input_path = "filtered/swisstopo_swisssurface3d_alps_las_z_i32/ingest_stats.json"
filtering = "Every point record of each of the 15 pinned tiles is kept, including all classes (ground, vegetation, buildings, noise if any). No records are filtered."
missing_value_policy = "LAS Z has no missing-value sentinel, and every record is kept. A truncated member, CRC-32 mismatch, header/profile mismatch, point-count mismatch, data min/max that differ from the header bounds, implausible codes, or a constant/dominated tile is fatal. Nothing is dropped or imputed."
conversion = "Inflate the zip member in streaming blocks of 262,144 records. For each record, copy bytes 8-11 (little-endian int32 Z) into the output in record order. The output is the raw little-endian int32 array of the tile, written as samples/<id>/swisssurface3d_z_i32/<E>_<N>.i32.bin."
numeric_kind = "int"
