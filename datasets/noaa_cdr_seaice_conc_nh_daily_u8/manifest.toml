notes = "Per-file MD5s are pinned collectively through the inventory SHA-256. Files 2022-01-01..2022-05-31 (151) were written by netcdf 4.7.4/HDF5 1.10.6 (superblock v0, deflate only); 2022-06-01..2024-12-31 (945) by netcdf 4.8.1/HDF5 1.12.2 (superblock v2, shuffle+deflate). Five NSIDC processing runs (software ade5087, c9c632e, a11f275, 22aac63, dev) each cover a contiguous date block, all product_version v04r00. Excluded: Southern Hemisphere (316x332 grid), monthly and aggregate files, preliminary/ICDR files, ncei_data/ mirror, years outside 2022-2024, and all other variables (nsidc_bt/nsidc_nt intermediate estimates, stdev, qa, melt onset, interpolation flags)."

