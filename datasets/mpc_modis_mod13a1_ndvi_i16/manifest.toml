summary = "Download 48 pinned MOD13A1.061 NDVI COGs, decode each primary 2400x2400 int16 grid (Deflate tiles, edge padding cropped), and emit it unchanged as one raw little-endian int16 sample per tile and composite period."
deterministic_notes = "Fixed scope: Terra only (MOD13A1, never MYD13A1), Collection 6.1, layer 500m_16_days_NDVI only, calendar year 2024 composite periods starting DOY 017 (2024-01-17..02-01) and DOY 193 (2024-07-11..07-26), and 24 named tiles chosen before download from 53 probed candidates for land dominance (overview-estimated -3000 fill <= 10%) and continental spread: north_america h09v05 h10v05 h10v04 h11v04 h11v03; south_america h11v09 h12v10 h13v10 h12v11; europe h19v04 h20v03; africa h18v07 h19v08 h20v09 h21v08 h20v11; asia h21v05 h23v05 h25v05 h25v06 h27v06 h25v04; oceania h29v11 h30v11. Overview IFDs are ignored. Samples follow sources.tsv order. Index min/max/sums are computed from the stored int16 values."

[[series]]
id = "modis_mod13a1_16day_ndvi_i16"
description = "MOD13A1.061 16-day composite NDVI grids, one complete 2400x2400 sinusoidal tile per sample."
semantic_meaning = "Normalized Difference Vegetation Index (NIR-red)/(NIR+red) from the constrained-view-angle maximum-value composite of Terra MODIS surface reflectance over a 16-day period at 500 m (463.3 m cells) on the MODIS sinusoidal grid; stored value = NDVI x 10000."
role = "primary"
representation_class = "native_numeric"
representation_notes = "500m_16_days_NDVI is a native int16 SDS in the source HDF4-EOS granule (scale_factor 10000, valid_range -2000..10000, _FillValue -3000). The Planetary Computer COG carries the same int16 plane plus HDF-EOS metadata; the recipe only removes TIFF tiling and Deflate compression."
source_resources = ["mod13a1_061_ndvi_cogs"]
source_format = "cloud_optimized_geotiff"
source_field = "500m_16_days_NDVI"
filtered_input_path = "filtered/mpc_modis_mod13a1_ndvi_i16/ingest_stats.json"
filtering = "Keep all 5,760,000 primary-resolution pixels of each of the 48 pinned complete tiles. Tiles were pre-selected as land-dominant; build and verify require fill fraction <= 0.15, at least 1000 distinct valid values, no duplicate grids, and (verify) at least 5% of pixels changing between the two periods of each tile. Realized: fill 0.00-12.7% per sample (max h19v04), valid values -2000..9996, 5,605-11,972 distinct values per sample, 87.5-100% of pixels changing between periods."
missing_value_policy = "Fill -3000 (water, ocean, and pixels with no retrieval) is source-native and preserved in place. Every other value must lie in the documented valid range -2000..10000; any other value, a fill fraction above 0.15, missing or truncated files, size/MD5 mismatches, unexpected TIFF structure or HDF-EOS metadata, corrupt Deflate streams, or degenerate grids are fatal."
conversion = "Parse the classic little-endian TIFF IFD0 (2400x2400, BitsPerSample 16, SampleFormat 2, Compression 8, Predictor 1, 512x512 tiles, GDAL nodata -3000), inflate its 25 tiles with exact-length checks, crop the TIFF edge padding of the last tile row/column (2400 = 4x512 + 352), and write the int16 grid row-major (y, x) little-endian without rescaling, resampling, remapping, or concatenation."
numeric_kind = "int"
bit_width = 16
endianness = "little"
sample_format = "raw homogeneous int16 NDVI grid (scale 0.0001, fill -3000)"
sample_geometry = "2400x2400_modis_sinusoidal_tile"
sample_rank = 2
sample_axes = ["y", "x"]
natural_record_kind = "complete_mod13a1_16_day_ndvi_tile"
sample_count = 48
total_size_bytes = 552960000
output_path = "samples/mpc_modis_mod13a1_ndvi_i16/modis_mod13a1_16day_ndvi_i16/"
