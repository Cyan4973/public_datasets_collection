notes = "The dataset-level SPASE record (hpde/NASA NumericalData/ISIS2/SFS/AverageIonogram/Fairbanks/PT22S.xml, commit 05bd62ab61858558d70006b4035588994386265a, 2026-07-23) declares, inside the AccessInformation of the CDF product itself (not only the metadata block): AccessRights Open; RightsIdentifier CC0-1.0; Note 'CC0 1.0 Universal is the Creative Commons license applicable to all publicly available NASA Heliophysics data products'. The digitized product was produced by NASA GSFC (Data Evaluation Laboratory, ISIS data-restoration project, PI_affiliation NASA GSFC in the CDF global attributes). ISIS-2 itself was a joint Canada-NASA mission; the CC0 statement is NASA's own for this NASA-made digitization. Keep the CDAWeb/PI acknowledgement."

