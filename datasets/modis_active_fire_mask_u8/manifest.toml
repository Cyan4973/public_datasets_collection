[[series]]
id = "modis_8day_active_fire_mask_u8"
description = "MOD14A2 8-day maximum fire-mask classification grids."
semantic_meaning = "Per-pixel maximum MODIS fire-mask class over an 8-day composite: missing/not processed, water, cloud, non-fire land, unknown, or low/nominal/high-confidence fire."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The Planetary Computer COG stores the official FireMask class plane as uint8; the recipe only removes TIFF tiling and Deflate compression."
