[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/google_alphaearth_satellite_embeddings_i8/samples.jsonl"
summary = "Range-fetch generation-pinned BigTIFF metadata and one aligned internal spatial tile across all 64 separately stored embedding axes per source, decode Zstandard locally, and emit the native signed-int8 grids."
deterministic_notes = "The recipe pins six exact GCS objects by name, generation, full size, and provider MD5. For each source it checks the TIFF layout, evaluates a fixed ordered list of interior tile positions using only compressed byte counts, chooses the first position meeting nontriviality thresholds, and fetches the same spatial tile for all 64 axes. Build preserves decoded source bytes exactly and enforces nonconstant, low-NoData outputs."

[[series]]
id = "alphaearth_embedding_axis_i8"
description = "Individual learned AlphaEarth satellite-embedding axes as signed-int8 spatial grids."
semantic_meaning = "One 1024-by-1024 geographic tile for one of the 64 learned AlphaEarth embedding dimensions, with all dimensions spatially aligned within each source COG."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The official COG stores each axis as signed-int8 with PlanarConfiguration=2. The recipe preserves the native two's-complement bytes after independently decoding one Zstandard-compressed internal TIFF tile; it does not dequantize to float or interleave axes."
source_resources = ["official_catalog", "official_stac", "official_gcs_guide", "selected_generation_pinned_cogs"]
source_format = "little-endian BigTIFF Cloud Optimized GeoTIFF, 64 separate signed-int8 planes, Zstandard-compressed 1024x1024 tiles"
source_field = "A00 through A63 embedding-axis planes"
filtered_input_path = "filtered/google_alphaearth_satellite_embeddings_i8/ingest_stats.json"
filtering = "Select six fixed year/UTM-zone source COGs, choose one deterministic nontrivial interior spatial tile per COG, retain all 64 aligned embedding-axis chunks, and reject samples with fewer than 16 distinct values or more than 25% NoData."
missing_value_policy = "Preserve the official signed-int8 -128 NoData sentinel in accepted tiles. Reject a selected tile if any axis is constant/degenerate or its NoData fraction exceeds 25%; do not fill, interpolate, or dequantize values."
conversion = "Parse TIFF metadata, range-fetch exact compressed tile chunks, decode Compression=50000 with the local zstd executable, and write the resulting source-native bytes unchanged. Signed int8 has no multi-byte ordering, but outputs are declared little-endian consistently with the corpus contract."
numeric_kind = "int"
bit_width = 8
endianness = "little"
sample_format = "raw homogeneous signed-int8 embedding-axis grid"
sample_geometry = "fixed_1024x1024_spatial_tile"
sample_rank = 2
sample_axes = ["y", "x"]
natural_record_kind = "alphaearth_embedding_axis_cog_internal_tile"
sample_count = 384
total_size_bytes = 402653184
output_path = "samples/google_alphaearth_satellite_embeddings_i8/alphaearth_embedding_axis_i8/"
