[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/eht_public_uvfits_visibilities_f32/samples.jsonl"
summary = "Validate five official EHT Stokes-I UVFITS releases and emit separate little-endian float32 real, imaginary, and statistical-weight series."
deterministic_notes = "Repository commits, URLs, sizes, Git blob SHA-1s, source SHA-256s, data-specific license notices, complete FITS layouts, random-group axes and parameters, source identities, Stokes coding, output hashes, extrema, distinct counts, and aggregate totals are pinned. RR and LL must be byte-identical; one copy is emitted. RL/LR must be zero/infinity placeholders and are excluded. Verification reparses every source and compares every output byte."

[[series]]
id = "eht_visibility_real_f32"
description = "Real components of calibrated EHT Stokes-I spatial-frequency visibilities."
semantic_meaning = "Signed real Fourier-plane visibility measurements across telescope baselines and observation time."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The source natively stores IEEE-754 float32 in FITS big-endian order. Output reverses each four-byte word to little endian without numeric re-encoding."
source_resources = ["m87_2017_096_hi_uvfits", "threec279_2017_101_hi_uvfits", "cena_2017_100_hi_uvfits", "sgra_2017_097_lo_uvfits", "m87_2018_111_b4_uvfits", "eht_2019_license", "eht_2020_license", "eht_2021_license", "eht_2022_license", "eht_2024_license"]
source_format = "FITS random-groups UVFITS with big-endian float32 DATA triplets"
source_field = "real member of each (real, imaginary, weight) Stokes-I visibility triplet"
filtered_input_path = "filtered/eht_public_uvfits_visibilities_f32/ingest_stats.json"
filtering = "Retain one real word per random group after requiring the source RR and LL words to be byte-identical. Exclude structurally empty RL/LR cross-hand placeholders. Keep each observation separate and preserve random-group order."
missing_value_policy = "Retained values must be finite. RR and LL must be byte-identical with finite positive weights. RL/LR real and imaginary values must be zero and their weights must be zero or positive infinity; any changed pattern fails."
conversion = "Reverse the four source bytes of each retained big-endian float32 word to produce the exact equivalent little-endian bit pattern."
numeric_kind = "float"
bit_width = 32
endianness = "little"
sample_format = "raw homogeneous IEEE-754 float32 visibility real field"
sample_geometry = "uv_visibility_random_group_sequence_1d"
sample_rank = 1
sample_axes = ["random_group_source_order"]
natural_record_kind = "complete_calibrated_uvfits_observation_field"
sample_count = 5
total_size_bytes = 235252
output_path = "samples/eht_public_uvfits_visibilities_f32/eht_visibility_real_f32/"

