manifest_version = 1
dataset_id = "physionet_circor_pcg_i16"
name = "PhysioNet CirCor DigiScope Pediatric Phonocardiogram Recordings PCM16"
description = "Every public 4 kHz mono 16-bit heart-sound (phonocardiogram) recording of the CirCor DigiScope 1.0.3 release: 3,163 auscultation recordings from 942 pediatric patients, one native int16 sample per recording."
homepage = "https://physionet.org/content/circor-heart-sound/1.0.3/"

[license]
name = "Open Data Commons Attribution License v1.0"
spdx = "ODC-By-1.0"
url = "https://opendatacommons.org/licenses/by/1-0/"
citation = "Oliveira, J., Renna, F., Costa, P. D., Nogueira, M., Oliveira, C., Ferreira, C., Jorge, A., Mattos, S., Hatem, T., Tavares, T., Elola, A., Rad, A. B., Sameni, R., Clifford, G. D., & Coimbra, M. T. (2022). The CirCor DigiScope Dataset: From Murmur Detection to Murmur Classification. IEEE Journal of Biomedical and Health Informatics, 26(6), 2524-2535. DOI: 10.1109/JBHI.2021.3137048. The CirCor DigiScope Phonocardiogram Dataset, version 1.0.3, PhysioNet (https://physionet.org/content/circor-heart-sound/1.0.3/). Goldberger, A., et al. (2000). PhysioBank, PhysioToolkit, and PhysioNet. Circulation 101(23), e215-e220."
notes = "The release ships LICENSE.txt (20,402 B, sha256 86c0ad300f6d380591298bc03652e30b81f65954bbf22435812bcfd46812ab06, itself listed in the release SHA256SUMS.txt) containing the ODC Attribution License text; download.sh pins and re-checks it. The project is served from the anonymous PhysioNet open-data bucket (open access, no credentialing), like the accepted physionet_bidmc_ppg_resp_i16 recipe. Preserve the article, dataset, and PhysioNet attribution."

[safety]
contains_sensitive_data = true
contains_personal_data = false
provenance_notes = "De-identified pediatric heart-sound recordings collected in two cardiac screening campaigns in Pernambuco, Brazil, published by PhysioNet as an open-access (non-credentialed) project. Recordings are named only by a numeric study patient ID and auscultation site."
usage_notes = "Treat as human health-related material. Emitted samples contain only the stethoscope PCM waveform; no age, sex, height, weight, pregnancy status, murmur or outcome labels, campaign, or segmentation annotations are downloaded or emitted. As with any stethoscope audio, recordings can contain incidental body or ambient sound (crying, movement, faint voices) picked up through the chest piece at a 4 kHz sampling rate."

