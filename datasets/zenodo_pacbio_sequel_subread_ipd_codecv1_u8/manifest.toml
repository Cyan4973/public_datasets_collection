sample_index_path = "index/zenodo_pacbio_sequel_subread_ipd_codecv1_u8/samples.jsonl"
summary = "Fetch a fixed 256 MiB prefix of the subreads BAM, inflate complete BGZF members (CRC/ISIZE checked), assert the @RG header declares SUBREAD reads with Ipd:CodecV1=ip, FRAMERATEHZ=80 and PM:SEQUEL, walk complete BAM records and emit each subread's 'ip' B:C array unchanged as one uint8 sample."
deterministic_notes = "Pinned record, file size, full-file md5 listing, prefix length and prefix SHA-256. Pure-stdlib BGZF/BAM parser (self-tested on synthetic records covering aux types A,c,C,s,S,i,I,f,Z,H and all B subtypes). Records are taken in physical file order; every complete record in the prefix is used, so the subread count is fixed by the pinned prefix. Empty or single-valued 'ip' arrays are dropped and counted (none were seen in a 4 MiB probe). verify.sh re-derives every sample with an independent gzip-member inflater and aux walker and compares bytes, order, index fields and manifest totals."

[[series]]
id = "subread_ipd_codecv1_u8"
description = "Per-base inter-pulse duration (IPD) of one PacBio subread, as 8-bit CodecV1 codes."
semantic_meaning = "For each called base of a subread, the number of 80 Hz camera frames between the end of the previous fluorescent incorporation pulse and the start of this base's pulse (polymerase kinetics), companded by PacBio CodecV1: codes 0-63 = 0-63 frames, 64-127 = 64-190 frames in steps of 2, 128-191 = 192-444 in steps of 4, 192-255 = 448-952 in steps of 8 (255 = capped at 952 frames)."
role = "primary"
representation_class = "derived_operational_numeric"
representation_notes = "CodecV1 is the instrument's own pinned, per-value, monotone companding code (the Sequel default production configuration writes kinetics this way; the PacBio BAM spec documents it and pbcore implements it). The 8-bit codes are emitted exactly as stored in the BAM; they are not decoded to frames and not widened to uint16. Same shape as the accepted G.711 mu-law recipe: a standardized machine-facing per-sample code with magnitude ordering."
source_resources = ["subreads_bam_prefix"]
source_format = "PacBio unaligned subreads BAM (BGZF), PacBio BAM spec pb:3.0.3, basecaller 5.0.0.6236"
source_field = "BAM aux tag 'ip' (B:C uint8 array, one CodecV1 IPD code per called base), declared by @RG DS Ipd:CodecV1=ip"
filtered_input_path = "filtered/zenodo_pacbio_sequel_subread_ipd_codecv1_u8/ingest_stats.json"
filtering = "Every complete BAM record in the pinned 256 MiB prefix, in file order. Only the 'ip' tag is kept; 'pw', sequence, qualities, sn, rq and other tags are excluded. Empty or single-valued 'ip' arrays are dropped and counted. Short subreads (under 1,000 bases) are kept. Records must be unaligned (flag 4), carry read group dbce2615, and have zm/qs/qe tags matching the read name."
missing_value_policy = "No values are filled, removed or recoded inside a subread. Code 255 (durations of 952 frames or more, capped by the codec) is preserved as a native value. The truncated final BGZF member and final BAM record of the prefix are excluded. A non-B:C 'ip' tag, an 'ip' length different from l_seq or qEnd-qStart, a duplicate read name, a missing tag, or a header without Ipd:CodecV1=ip, FRAMERATEHZ=80 and PM:SEQUEL fail the recipe."
conversion = "Copy the 'ip' array payload bytes (after the B, C subtype and int32 count) of each subread record unchanged into one raw uint8 file. One file per subread (movie/ZMW/qStart_qEnd); subreads of the same ZMW are never concatenated. Endianness is irrelevant for 8-bit values."
numeric_kind = "uint"
bit_width = 8
endianness = "little"
sample_format = "raw homogeneous uint8 CodecV1 IPD code array"
sample_geometry = "per_base_subread_sequence_1d"
sample_rank = 1
sample_axes = ["called_base"]
