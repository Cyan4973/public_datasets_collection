role = "primary"
representation_class = "native_numeric"
representation_notes = "All slices natively store uncompressed little-endian unsigned 16-bit pixels with BitsStored=16. Per-slice RescaleSlope values are retained in the index and are not applied, preserving the exact source integer representation."
