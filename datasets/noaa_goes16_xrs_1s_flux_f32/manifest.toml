manifest_version = 1
dataset_id = "noaa_goes16_xrs_1s_flux_f32"
name = "GOES-16 EXIS/XRS Science-Quality 1-Second Solar Soft X-Ray Flux (XRS-A 0.05-0.4 nm, XRS-B 0.1-0.8 nm) Daily Series Float32"
description = "Native float32 whole-Sun soft X-ray flux at 1 s cadence from the GOES-16 EXIS X-Ray Sensor, NOAA NCEI science-quality Level-2 product xrsf-l2-flx1s_science v2-2-1: the primary XRS-A and XRS-B channel fluxes of 194 UTC days (the 1st and 15th of every month, 2017-02-15..2025-04-01, spanning solar minimum and the solar-cycle-25 maximum; 2 of the 196 selected days are entirely fill and dropped), decoded from NetCDF4/HDF5 with a pure-stdlib reader into one 86,400-value sample per day and channel."
homepage = "https://www.ncei.noaa.gov/products/goes-r-extreme-ultraviolet-xray-irradiance"

[license]
name = "U.S. Government Public Domain (NOAA/NESDIS); file license attribute: redistribution and use without restriction"
spdx = "LicenseRef-US-Government-Public-Domain"
url = "https://www.ncei.noaa.gov/metadata/geoportal/rest/metadata/item/gov.noaa.ncei.swx:exis-l2-goesr/xml"
citation = "Machol, Janet, Stefan Codrescu, and Rodney Viereck. 'GOES-R Series Extreme Ultraviolet and X-ray Irradiance Sensors (EXIS) Level 2 Products'. NOAA National Centers for Environmental Information, 2018. https://doi.org/10.25921/94P8-YE57"
notes = "Every source file carries the global attribute license = 'These data may be redistributed and used without restriction. ' and institution = 'DOC/NOAA/NESDIS'; both are checked per file by download, build and verify. The NCEI ISO 19115 record gov.noaa.ncei.swx:exis-l2-goesr lists only a citation request ('Cite this dataset when used as a source: ...') and the standard NCEI liability disclaimer as use constraints. NOAA/NESDIS products are works of the U.S. Government (17 U.S.C. 105). Preserve the citation/DOI."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official NOAA NCEI archive of GOES-R EXIS Level-2 products (data.ngdc.noaa.gov), anonymous HTTPS; satellite solar irradiance measurements with no personal content."
usage_notes = "Public U.S. Government space-weather data suitable for model training with the NCEI citation retained."

[[origins]]
id = "ncei_goes16_l2_xrs"
name = "NOAA NCEI GOES-16 Level-2 EXIS/XRS archive (xrsf-l2-flx1s_science)"
url = "https://data.ngdc.noaa.gov/platforms/solar-space-observing-satellites/goes/goes16/l2/data/xrsf-l2-flx1s_science/"
type = "data_portal"
notes = "Apache directory listing, year/month subdirectories, one daily NetCDF4 file per UTC day. Probed 2026-10-08: 2,981 files 2017-02-07..2025-04-06 with no missing days, all product version v2-2-1, all last-modified 2025-12-05 (date_created 2025-12-05, netcdf 4.9.2 / HDF5 1.14.3). Users guide: https://data.ngdc.noaa.gov/platforms/solar-space-observing-satellites/goes/goes16/l2/docs/GOES-R_XRS_L2_Data_Users_Guide.pdf"

[[resources]]
id = "xrs_flx1s_daily_netcdf"
origin = "ncei_goes16_l2_xrs"
url = "https://data.ngdc.noaa.gov/platforms/solar-space-observing-satellites/goes/goes16/l2/data/xrsf-l2-flx1s_science/{YYYY}/{MM}/sci_xrsf-l2-flx1s_g16_d{YYYYMMDD}_v2-2-1.nc"
type = "file"
version = "sci xrsf-l2-flx1s v2-2-1 (algorithm xrs05_1s.py v1.4, reprocessed 2025-12-05)"
access = "196 anonymous HTTPS GETs (curl, resumable .part files, 4 parallel), listed with exact byte sizes in files.tsv."
size_bytes = 676343852
sha256 = ""
local_path = "downloads/noaa_goes16_xrs_1s_flux_f32/daily/"
notes = "Selection: the files dated the 1st and 15th of every month in the archive span (first 2017-02-15, last 2025-04-01), a fixed calendar rule chosen before looking at data so solar minimum (2018-2020) and the cycle-25 maximum (2023-2025) are both covered; 196 of 2,981 available days (~6.6%), sized so the primary output (~135 MB) sits just above the ~100 MB downstream selection budget. Per-file byte sizes are pinned (HTTP HEAD content-length, 2026-10-08); per-file SHA-256 of all 196 files is pinned in files.tsv (5 from probe downloads, 191 from the first driver download's observed_sha256.tsv, cross-checked against the 5 probe hashes); plan and build reject any mismatch. download.sh fully decodes every file (HDF5 checksums, datatype, filters, attributes, time axis) before succeeding. Excluded: every other variable in the file (xrsa1/a2/b1/b2 per-diode fluxes, *_flags, *_primary_chan, corrected_current_*, au_factor, roll_angle, yaw_flip_flag, time), other cadences/products (flx1m, avg1m, flare summaries), other satellites (GOES-17/18/19) and the operational (non-science) stream."

