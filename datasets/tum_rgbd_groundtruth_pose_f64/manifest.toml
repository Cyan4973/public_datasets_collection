[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/tum_rgbd_groundtruth_pose_f64/samples.jsonl"
summary = "Validate one exact TUM RGB-D sequence archive, parse its eight-column ground-truth table, use timestamps for ordering only, and emit row-major float64 translation and quaternion matrices."
deterministic_notes = "Build is local-only, requires exactly 3,000 strictly time-ordered finite poses, validates near-unit quaternions, preserves source row/component order, and enforces acceptance floors. Verification independently reparses and compares every value."

[[series]]
id = "tum_rgbd_translation_f64"
description = "Motion-capture translation trajectory as row-major XYZ triples."
semantic_meaning = "Camera/robot ground-truth position in metres for each ordered pose."
role = "primary"
representation_class = "native_numeric"
representation_notes = "Published decimal translation measurements are parsed directly as IEEE-754 float64; no narrower binary representation is widened."
source_resources = ["tum_freiburg1_xyz_archive"]
source_format = "TUM RGB-D groundtruth text table"
source_field = "tx ty tz"
filtered_input_path = "filtered/tum_rgbd_groundtruth_pose_f64/ingest_stats.json"
filtering = "Keep all 3,000 finite poses after strict eight-column and increasing-timestamp validation."
missing_value_policy = "Malformed, missing, non-finite, duplicate-time, or out-of-order rows fail the build; no rows are dropped or imputed."
conversion = "Parse tx, ty, tz decimal fields as float64 and write little-endian row-major XYZ triples in source order."
numeric_kind = "float"
bit_width = 64
endianness = "little"
sample_format = "row-major float64 translation matrix"
sample_geometry = "pose_translation_trajectory"
sample_rank = 2
sample_axes = ["pose", "xyz_component"]
natural_record_kind = "tum_rgbd_groundtruth_sequence_translation_trajectory"
sample_count = 1
total_size_bytes = 72000
output_path = "samples/tum_rgbd_groundtruth_pose_f64/tum_rgbd_translation_f64/"

[[series]]
id = "tum_rgbd_quaternion_f64"
