name = "ICON IVM-A Level-2.7 In-Situ Ion Drift Velocity (Magnetic Zonal / Meridional / Field-Aligned, 1 Hz) Float64"
description = "Native float64 thermal-ion drift velocities (m/s, relative to corotation, in magnetic zonal, meridional and field-aligned components) measured in situ at about 590 km by the Ion Velocity Meter A on NASA's Ionospheric Connection Explorer, one sample per (UTC day, component) for 120 evenly spaced days of the IVM-A L2-7 v06 product (2019-11 to 2022-09), range-extracted from the HelioCloud mirror of the CDAWeb NetCDF4 files."
homepage = "https://icon.ssl.berkeley.edu/Data"

[license]
name = "Creative Commons Zero v1.0 Universal (NASA Science Data license for NASA-led mission data)"
spdx = "CC0-1.0"
url = "https://science.data.nasa.gov/about/license"
citation = "ICON IVM-A Level-2.7 ion parameters, version 6 (Data Product 2.7: IVM Ionospheric Parameters). NASA Ionospheric Connection Explorer (PI T. J. Immel, UC Berkeley SSL; IVM by the University of Texas at Dallas). Immel, T.J., England, S.L., Mende, S.B. et al. (2018), Space Sci Rev 214: 13, https://doi.org/10.1007/s11214-017-0449-2. Heelis, R.A. et al. (2017), Ion Velocity Measurements for the Ionospheric Connections Explorer, Space Sci Rev 212: 615-629. Data served by NASA SPDF/CDAWeb via the NASA GSFC HelioCloud bucket gov-nasa-hdrl-data1."
notes = "NASA Science Data license page (fetched and checked by download.sh): 'Unless the data file is marked with a restrictive notice or license, data that is provided from a NASA-led mission including observations, engineering, calibration, and auxiliary data are licensed as Creative Commons Zero. There are no restrictions on the usage of these data.' ICON is a NASA Explorer mission; every file's Acknowledgement attribute calls it 'the NASA Ionospheric Connection Explorer mission' and Project = 'NASA > ICON'. The in-file Rules_of_Use attribute reads 'Public Data for Scientific Use' (checked per file); the ICON Rules of the Road PDF linked from icon.ssl.berkeley.edu/Data states 'All data released to the public may be utilized for scientific analysis and publication with no restrictions imposed by the ICON mission' and asks users to cite the mission and consult instrument teams. Rules_of_Use is read here as a public-release label rather than a restrictive license; a stricter reading would treat it as a scientific-use notice (see README 'Rights')."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official NASA mission data (ICON Science Data Center products archived at NASA SPDF/CDAWeb) read from NASA GSFC's public HelioCloud S3 bucket with anonymous HTTPS range requests; space-plasma measurements, no human subjects."
usage_notes = "Only the three decoded ion-velocity variables are emitted; density, temperature, flags, geolocation and all other variables are not read into samples."

