citation = "Duwadi S., Rogers D., Boyd A. D., Carlton L. B., Zhang Y., Kawai Gaona A., Pathiyaparambath A. D., Chaudhury R., Zimmermann B. B., O'Brien W. J., von Lühmann A., Boas D. A., Yücel M. A., Sen K. (2026). Whole-Head Cocktail Party fNIRS. OpenNeuro, ds007738 version 1.0.0. doi:10.18112/openneuro.ds007738.v1.0.0"
notes = "The snapshot's dataset_description.json declares \"License\": \"CC0\" and \"DatasetDOI\": \"doi:10.18112/openneuro.ds007738.v1.0.0\"; download.sh re-checks both, the dataset name, and CHANGES ('1.0.0 2026-05-01') on every run. OpenNeuro publishes all datasets under CC0. Citation is courteous, not required."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official OpenNeuro S3 bucket (s3.amazonaws.com/openneuro.org, anonymous). The README states the dataset holds only fNIRS optical measurements and eye-tracking time series, shared under approved IRB consent, with no anatomical scans."
usage_notes = "Only the optical intensity matrix is emitted. Aux channels (eye tracking), stim, probe geometry (positions, labels, landmarks) and metaDataTags (SubjectID, MeasurementDate, ...) are never fetched as payload; the only bytes read near them are HDF5 object headers inside the fetched 1 MiB metadata blocks. The BIDS subject label (sub-NN) appears only as index bookkeeping."

