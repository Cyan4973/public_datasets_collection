[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/sevir_vil_storm_events_u8/samples.jsonl"
summary = "Validate the license statement and the pinned catalog, parse the HDF5 v0 metadata of each STORMEVENTS VIL container from exact head/tail byte ranges, fetch exactly one contiguous uint8 vil[i] cube per selected event, and emit each cube as one raw uint8 sample in stored (row, column, frame) order."
deterministic_notes = "Selection rule (scripts/select_events.py, pinned output events.tsv, re-derived by download/build/verify from the SHA-256-pinned catalog): STORMEVENTS VIL rows with pct_missing == 0 and data_max > 0; per container sort by (time_utc, id), keep the first event of each NWS episode_id, then take 10 events at positions floor((k + 0.5) * M / 10). HDF5 checks: superblock v0, root symbol table with exactly the links 'id' and 'vil'; 'vil' dataspace (N, 384, 384, 49) with N pinned per container, unsigned 8-bit fixed-point datatype, layout v3 contiguous at address 2048 with size N*7,225,344, no filter-pipeline message; 'id' is (N,) fixed 10-byte null-padded strings whose entries equal the catalog id at every file_index. Every range response must be 206 with the exact Content-Range and pinned ETag. Per-event SHA-256 pins in event_sha256.tsv are enforced by download, build and verify. Realized: 60 samples x 7,225,344 values (median 7,225,344), 254 distinct codes (1 and 255 absent), 48.7% zeros; aggregate SHA-256 of the samples concatenated in index order 742700951e156ad4bb24215f0356d9fa4e5f7675cace3242dcd47014ddbec281."

[[series]]
id = "sevir_vil_storm_event_cube_u8"
description = "SEVIR digital vertically integrated liquid (VIL) codes for one 4-hour storm event on a 384 x 384 km, 1 km grid with 49 frames at nominal 5-minute spacing."
semantic_meaning = "Per-pixel, per-frame NEXRAD-mosaic vertically integrated liquid stored as SEVIR's native uint8 digital-VIL code X in 0..254: VIL = 0 kg/m^2 for X <= 5, (X - 2) / 90.66 kg/m^2 for 5 < X <= 18, exp((X - 83.9) / 38.9) kg/m^2 for 18 < X <= 254; 255 is SEVIR's missing-data code."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The values are the source's own stored uint8 codes from the HDF5 'vil' dataset (unsigned 8-bit, contiguous, unfiltered); no rescaling, remapping, transposition or frame selection is applied. The piecewise linear/log code-to-kg/m^2 law is documented by the SEVIR maintainers (SEVIR_Tutorial.ipynb) and is not applied."
source_resources = ["sevir_vil_stormevents_containers", "sevir_catalog_csv"]
source_format = "HDF5 (superblock v0) SEVIR STORMEVENTS VIL file; dataset 'vil' uint8 (N, 384, 384, 49), contiguous at offset 2048"
source_field = "root dataset 'vil', slice vil[file_index, :, :, :] (digital VIL codes)"
filtered_input_path = "filtered/sevir_vil_storm_events_u8/ingest_stats.json"
filtering = "Only STORMEVENTS VIL containers (no RANDOMEVENTS, no ir069/ir107/vis/lght). 60 events, 10 per half-year container, chosen by the pinned catalog rule in deterministic_notes (pct_missing == 0, data_max > 0, one event per NWS episode, evenly spaced in time). All 49 frames and the full 384 x 384 grid of each selected event are kept."
missing_value_policy = "Only events with catalog pct_missing == 0 are selected, so code 255 (SEVIR missing data) must not occur: download, build and verify all fail if any 255 is present. Each cube must also have max code == catalog data_max, min code == catalog data_min (0), at least 16 distinct codes, a zero fraction below 0.9999 and at least 2 distinct frames. Zero codes (no precipitation, VIL below threshold) are genuine observations and are preserved."
conversion = "The HDF5 metadata proves that vil[i] is the contiguous run of 7,225,344 unsigned 8-bit elements at byte offset 2048 + i*7,225,344 in C order (row, column, frame), so the fetched range is the decoded typed array; it is written unchanged as one little-endian uint8 sample (byte order is irrelevant at 8 bits). Frames remain the innermost axis as stored; nothing is transposed."
numeric_kind = "uint"
bit_width = 8
endianness = "little"
sample_format = "raw homogeneous uint8 digital-VIL cube, C order (grid_row, grid_column, frame)"
sample_geometry = "laea_1km_grid_384x384_by_49_frames"
sample_rank = 3
sample_axes = ["grid_row", "grid_column", "frame"]
natural_record_kind = "sevir_storm_event_vil_cube"
sample_count = 60
total_size_bytes = 433520640
output_path = "samples/sevir_vil_storm_events_u8/sevir_vil_storm_event_cube_u8/"
