description = "Full-resolution 1024x1024 unsigned-byte raw CCD frames from the Cassini Imaging Science Subsystem narrow-angle camera, as converted on board from 12-bit ADC counts to 8 bits by the camera's fixed square-root-like look-up table (DATA_CONVERSION_TYPE = TABLE) and downlinked losslessly. Decoded from the PDS Imaging Node COISS_2050-2052 EDR volumes (2008-312 to 2009-041, Saturn rings, F ring movies and Saturnian moons), with the VICAR label, binary telemetry header record and 24-byte per-line binary prefix removed."
