[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/noaa_cdr_seaice_conc_nh_daily_u8/samples.jsonl"
summary = "List and pin the 1096 F17 v04r00 Northern-Hemisphere daily files of 2022-2024, download them with their .mnf checksum manifests, decode each file's cdr_seaice_conc variable with a pure-stdlib HDF5 reader, and emit one raw uint8 448x304 grid per day."
deterministic_notes = "Inventory is pinned by SHA-256 over sorted (date, key, size, MD5) rows; every file is MD5-checked against its .mnf and ETag. The HDF5 reader verifies the lookup3 checksum of every metadata block it touches (superblock v2, OHDR/OCHK, fractal heap header, indirect and direct blocks, v2 B-tree header/internal/leaf nodes). The variable is selected by link name (nine uint8 variables share an identical layout), never by position. Build resolves it through the name-index v2 B-tree; verify resolves it independently through the creation-order v2 B-tree and byte-compares every sample. Per-file attribute checks: flag_values 251..255, flag_meanings, valid_range 0..100, scale_factor float32 0.01, _FillValue 255, _Unsigned true, units, standard_name, long_name; global cdr_variable, product_version v04r00, platform F17, sensor SSMIS, license, and time_coverage_start equal to the filename date. A synthetic HDF5 self-test (scripts/selftest_h5.py) runs before build and verify. Samples are sorted by date. Floors: 1096 samples of 136,192 values each (median 136,192 values); total 149,266,432 values."

[[series]]
id = "cdr_seaice_conc_nh_daily_u8"
description = "Daily Northern-Hemisphere CDR sea-ice concentration rasters on the 25 km NSIDC polar stereographic north grid."
semantic_meaning = "Per-cell CDR passive-microwave sea-ice concentration in percent (codes 0..100; multiply by scale_factor 0.01 for area fraction) for one UTC day, with the variable's own in-raster flag codes 251 pole_hole, 252 lakes, 253 coastal, 254 land_mask, 255 missing_data."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The NetCDF4 variable cdr_seaice_conc is stored as unsigned 8-bit integers (HDF5 fixed-point class, size 1, unsigned, little-endian; _Unsigned=true). The recipe inflates the single deflate-compressed chunk (1x448x304) and writes the stored integer codes unchanged; no scaling, masking or remapping is applied. The shuffle filter in the 945 netcdf-4.8.1 files has element size 1 and is therefore the identity permutation."
source_resources = ["s3_listings_2022_2024", "daily_checksum_manifests", "nh_daily_netcdf_2022_2024"]
source_format = "NetCDF4/HDF5 daily file, variable stored as a single deflate-compressed chunk indexed by a version-1 B-tree"
source_field = "cdr_seaice_conc (uint8, dims time=1 x y=448 x x=304)"
filtered_input_path = "filtered/noaa_cdr_seaice_conc_nh_daily_u8/ingest_stats.json"
filtering = "Keep every 2022-2024 F17 v04r00 Northern-Hemisphere daily file (365 + 365 + 366 = 1096) and only its cdr_seaice_conc variable. No days are dropped, including days where the CDR marks part or all of the ice pack as missing_data (255); ingest_stats.json counts them."
missing_value_policy = "Native in-raster codes are preserved as-is: 251 pole_hole, 252 lakes, 253 coastal, 254 land_mask and 255 missing_data (also _FillValue) are part of the stored variable, not recipe sentinels. Any code outside {0..100, 251..255}, a constant grid, a grid lacking the static lake/coast/land codes or any 0..100 code, a static lake/coast/land mask that differs between days, wrong shape/datatype/filters/attributes/date, a checksum or MD5 mismatch, or a chunk that does not inflate to exactly 136,192 values is fatal in both build and verify."
conversion = "Resolve root link 'cdr_seaice_conc' through the dense link storage (Link Info -> fractal heap -> v2 B-tree), read Dataspace (1,448,304), Datatype uint8, Filter Pipeline (deflate, optionally preceded by 1-byte shuffle) and Layout v3 chunked (1,448,304,1); take the single chunk address and size from the version-1 B-tree leaf (offsets 0,0,0,0, filter mask 0), zlib-inflate it to exactly 136,192 values and write them in stored row-major (y, x) order as one raw uint8 file per day."
numeric_kind = "uint"
bit_width = 8
endianness = "little"
sample_format = "raw homogeneous uint8 sea-ice concentration grid"
sample_geometry = "448x304_nsidc_polar_stereographic_north_25km_grid"
sample_rank = 2
sample_axes = ["y", "x"]
natural_record_kind = "nsidc_cdr_daily_northern_hemisphere_concentration_grid"
sample_count = 1096
total_size_bytes = 149266432
output_path = "samples/noaa_cdr_seaice_conc_nh_daily_u8/cdr_seaice_conc_nh_daily_u8/"
