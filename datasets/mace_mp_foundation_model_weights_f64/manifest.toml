[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/mace_mp_foundation_model_weights_f64/samples.jsonl"
summary = "Validate the ten pinned MIT checkpoints, decode each torch zip's data.pkl with an inert whitelisting unpickler to name every tensor, and emit every float64 torch.nn.Parameter with at least 1,000 values as one raw little-endian sample (exact storage byte range; offset/shape/stride honoured, contiguity required)."
deterministic_notes = "Pinned: README/LICENSE revision and hashes, MIT license cells, per-checkpoint size, central-directory sha256, member count and prefix, data.pkl size/sha256, member CRCs, full sha256 for all 10 files, parameter/buffer counts, selected tensor counts and values per checkpoint and per series, aggregate totals. Order: checkpoints in release order (0a S/M/L, 0b S/M, 0b2 S/M/L, 0b3 M, MPA-0 M), then module-tree order. A cross-checkpoint near-duplicate screen (same name and shape, 8,192 evenly spaced positions, equal or within 1e-6 relative) excludes copies at >=50% matches; the pinned exclusion list is empty (max realized match 1.56%). A full-tensor exact-equality scan against earlier same-named tensors is pinned at 208,965 values (0.27%): neon (Z=10) embedding rows and skip_tp blocks, and part of the argon (Z=18) skip_tp block in 0b, that receive no MPtrj gradient and keep the same-seed initialization; no tensor exceeds 1.54%. verify.sh re-slices every payload by raw local-header offset (not zipfile), recomputes all statistics from source and emitted bytes, and checks index, stats, file inventory and these manifest totals."

[[series]]
id = "mace_equivariant_linear_weight_f64"
description = "Complete e3nn equivariant linear and tensor-product path-weight vectors of MACE-MP checkpoints: element embedding, interaction linear_up/linear, element-dependent skip tensor product, product linear and readout linear weights."
semantic_meaning = "Learned, unit-free mixing coefficients of e3nn o3.Linear / FullyConnectedTensorProduct layers (flattened per-path multiplicity blocks in e3nn order), trained in float64 to predict DFT (PBE/PBE+U) energies, forces and stresses."
role = "primary"
representation_class = "native_numeric"
representation_notes = "Each sample is a torch.nn.Parameter stored by torch.save as a little-endian torch.DoubleStorage; the sample is exactly the parameter's element range of that storage, copied verbatim. Sampled values are not float32-representable and include float64 subnormals from weight decay, so the width is native, not widened."
source_resources = ["mace_mp_0a_small", "mace_mp_0a_medium", "mace_mp_0a_large", "mace_mp_0b_small", "mace_mp_0b_medium", "mace_mp_0b2_small", "mace_mp_0b2_medium", "mace_mp_0b2_large", "mace_mp_0b3_medium", "mace_mpa_0_medium", "repo_readme", "repo_license"]
source_format = "PyTorch zip checkpoint (torch.save of a ScaleShiftMACE module; data.pkl + raw storages)"
source_field = "torch.nn.Parameter tensors named node_embedding.linear.weight, interactions.N.{linear_up,linear,skip_tp}.weight, products.N.linear.weight, readouts.N.linear_1.weight (float64, >= 1,000 values)"
filtered_input_path = "filtered/mace_mp_foundation_model_weights_f64/ingest_stats.json"
filtering = "Keep all 100 matching float64 Parameters with >= 1,000 values (10 per checkpoint); exclude readouts.0.linear.weight (128 values) and readouts.1.linear_2.weight (16 values) as below the per-sample size threshold. Buffers (symmetric-contraction U matrices, atomic energies, scale/shift, radial constants, atomic numbers) are excluded entirely. Kept tensors include untrained neon/argon element blocks identical across same-seed checkpoints (208,965 values, 0.27% of the dataset), disclosed in ingest_stats exact_overlap."
missing_value_policy = "Trained parameters have no missing values. Any non-finite value, constant or majority-zero tensor, changed resource, CRC or inventory drift, non-float64 parameter storage, non-contiguous view or storage overrun fails the recipe; no values are dropped, imputed or rounded within a tensor. Subnormal values are preserved verbatim."
conversion = "Copy elements [offset, offset+numel) of the parameter's DoubleStorage member unchanged (little-endian IEEE-754 binary64). One complete parameter tensor per sample; no concatenation or sharding."
numeric_kind = "float"
bit_width = 64
endianness = "little"
sample_format = "raw homogeneous IEEE-754 float64 learned parameter vector"
sample_geometry = "e3nn_flattened_path_weight_vector"
sample_rank = 1
sample_axes = ["e3nn_path_weight"]
natural_record_kind = "complete_mace_equivariant_linear_parameter_tensor"
