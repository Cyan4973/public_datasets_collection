[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/cfpb_hmda2023_lar_closing_costs_f64/samples.jsonl"
summary = "Stream the pinned national public LAR CSV out of the zip once. For each of four closing-cost columns, collect the reported non-negative decimal dollar amounts of every LAR row by two-letter state_code in file order, and write one little-endian float64 sample per (cost field, state) having at least 1,000 values."
deterministic_notes = "Pinned zip size, member CRC-32, uncompressed size and header hash. File order is preserved within each state, and states are emitted in sorted order. Missing-value policy (identical in build and verify): tokens '', 'NA' and 'Exempt' are missing. A token must match ^[0-9]+(\\.[0-9]+)?$ to be kept. Negative tokens and other malformed tokens are skipped and counted, and more than 0.1% malformed tokens per field is fatal. Rows whose state_code is 'NA' are excluded. (field, state) groups with fewer than 1,000 kept values are not emitted and are listed in filtered/.../ingest_stats.json. verify.sh re-parses the CSV with an independent byte-split parser, re-derives every sample's SHA-256, value count, min/max and zero fraction, and rejects constant samples, samples with fewer than 50 distinct values, and samples where zeros exceed 90%."

[[series]]
id = "hmda2023_total_loan_costs_f64"
description = "HMDA total_loan_costs: total loan costs in US dollars per reported loan."
semantic_meaning = "Total Loan Costs (Closing Disclosure section D) in USD for one closed-end loan reported under Regulation C, for loans in one state."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The source publishes decimal dollar text with up to two decimals, such as 30278.0 or 9919.16. Each token is parsed once into IEEE-754 binary64. Most cent values are not exactly representable in float32, so float64 is the faithful width."
source_resources = ["hmda2023_public_lar_zip"]
source_format = "HMDA public LAR CSV (99 columns) inside a zip64 archive"
source_field = "total_loan_costs"
filtered_input_path = "filtered/cfpb_hmda2023_lar_closing_costs_f64/ingest_stats.json"
filtering = "All LAR rows with a valid two-letter state_code (not 'NA') and a kept total_loan_costs token. States with fewer than 1,000 kept values are excluded."
missing_value_policy = "'', 'NA', 'Exempt' skipped. Negative or malformed tokens are skipped and counted, and more than 0.1% malformed tokens is fatal. No imputation."
conversion = "float(token) to binary64, packed '<d', in source row order within each state, one file per state."
numeric_kind = "float"
bit_width = 64
endianness = "little"
sample_format = "raw homogeneous little-endian float64 array"
sample_geometry = "per_state_loan_record_column"
sample_rank = 1
sample_axes = ["loan_record"]
natural_record_kind = "hmda_lar_state_cost_field_column"
sample_count = 52
total_size_bytes = 40420440
output_path = "samples/cfpb_hmda2023_lar_closing_costs_f64/hmda2023_total_loan_costs_f64/"

