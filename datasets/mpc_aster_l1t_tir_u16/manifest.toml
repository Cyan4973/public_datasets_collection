[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/mpc_aster_l1t_tir_u16/samples.jsonl"
summary = "Download the 51 pinned ASTER L1T TIR COGs (one daytime, sun elevation > 20 deg, low-cloud < 10% scene per region and seasonal window, resolved via the Planetary Computer STAC API), validate size/MD5/TIFF structure, inflate the Deflate tiles, undo TIFF Predictor 2 with a 5-sample stride (mod 2^16), crop edge tiles, and write each complete scene raster as raw little-endian uint16 in source pixel-interleaved order."
deterministic_notes = "Scope was resolved by discover.sh on 2026-10-05 and pinned in sources.tsv: 26 named region bounding boxes x 2 seasonal windows (Feb 15 - Apr 30, Jul 1 - Sep 15); per region a base year in 2000..2006 with fallback to the nearest other year; per window the qualifying item (TIR asset, 0 <= eo:cloud_cover < 10, view:sun_elevation > 20, not already chosen) with the lowest cloud cover, then earliest datetime, then id. 51 of 52 slots resolved; Patagonia Jul-Sep had no qualifying scene in any year. The ASTER archive on Planetary Computer is closed (2000-2006); download.sh requires exactly the 51 pinned scenes and 157,104,582 bytes. build.sh and verify.sh share the degeneracy bounds; verify.sh re-derives every sample with a separate decoder and byte-compares it."

[[series]]
id = "aster_l1t_tir_radiance_dn_u16"
description = "Terra ASTER L1T thermal-infrared bands 10-14 at-sensor radiance digital numbers, one complete scene per sample, pixel-interleaved uint16."
semantic_meaning = "Per-pixel, per-band ASTER TIR at-sensor spectral radiance as the AST_L1T 12-bit digital number, after LP DAAC's precision terrain correction and resampling to a 90 m north-up UTM grid. Bands: 10 (8.125-8.475 um), 11 (8.475-8.825 um), 12 (8.925-9.275 um), 13 (10.25-10.95 um), 14 (10.95-11.65 um). Radiance = (DN - 1) x UCC with fixed per-band unit-conversion coefficients 0.006822, 0.006780, 0.006590, 0.005693, 0.005225 W m-2 sr-1 um-1 (ASTER User Handbook; recorded in the index, not applied). 0 is fill outside the rotated, north-up-resampled swath."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The COG stores the AST_L1T TIR DN as uint16; the recipe only removes TIFF tiling, Deflate and the lossless TIFF Predictor-2 differencing. No scaling, radiance or temperature conversion, reprojection, resampling, masking or band reordering is applied; the source pixel-interleaved band order is kept."
source_resources = ["aster_l1t_tir_cogs"]
source_format = "planetary_computer_cloud_optimized_geotiff_aster_l1t_v003_tir"
source_field = "TIR_Swath ImageData10..ImageData14 (asset TIR)"
filtered_input_path = "filtered/mpc_aster_l1t_tir_u16/ingest_stats.json"
filtering = "Keep every pixel and all five bands of the primary IFD of each planned scene's TIR COG. VNIR and SWIR assets (uint8), overview IFDs, and night scenes (sun elevation <= 20 deg) are not used."
missing_value_policy = "Source-native fill 0 (outside the rotated swath footprint inside the north-up bounding box) is preserved in place, never stripped or remapped. Valid DN are 1..4095. build.sh and verify.sh both require: every value <= 4095; overall fill fraction within 0.05..0.80; per band at least 50,000 valid pixels and 64 distinct valid DN with max > min; fill masks agreeing across the five bands for at least 98% of pixels; Pearson correlation of bands 13 and 14 over jointly valid pixels >= 0.5 and band-13 mean absolute horizontal neighbour difference / std <= 0.75 (decode-correctness guards). Any size/MD5/structure mismatch, short tile, or degenerate scene is fatal."
conversion = "Parse the primary IFD of each classic little-endian TIFF, zlib-inflate every tile (each must yield exactly tile_width*tile_height*5 uint16 values; sparse tiles read as 0), undo Predictor 2 per tile row by cumulative summation of each band's samples with a stride of 5 uint16 elements modulo 65536, copy tile rows into a height x width x 5 row-major grid (north row first, west column first, band 10 first within a pixel), crop right/bottom edge-tile padding, and write the values as little-endian uint16. One sample per scene; per-sample height/width are recorded in the index (sample_shape)."
numeric_kind = "uint"
bit_width = 16
endianness = "little"
sample_format = "raw homogeneous uint16 raster, pixel-interleaved"
sample_geometry = "aster_l1t_scene_90m_utm_north_up_height_x_width_x_5_bands"
sample_rank = 3
sample_axes = ["row_north_to_south", "column_west_to_east", "tir_band"]
natural_record_kind = "complete_aster_l1t_scene_tir_swath_raster"
sample_count = 51
total_size_bytes = 405872250
output_path = "samples/mpc_aster_l1t_tir_u16/aster_l1t_tir_radiance_dn_u16/"
