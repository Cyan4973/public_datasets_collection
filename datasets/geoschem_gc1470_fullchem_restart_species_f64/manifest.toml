name = "GEOS-Chem 14.7.0 Full-Chemistry Benchmark Restart: 3-D Species Dry Mixing Ratio Fields (SpeciesRst_*, 4x5 L72) Float64"
description = "Native float64 dry-air mixing ratios (mol mol-1 dry) of the chemical species (gases and aerosol tracers) carried by GEOS-Chem Classic 14.7.0-rc.0 full chemistry, decoded from the official 4x5-degree, 72-level restart file GEOSChem.Restart.fullchem.20190101_0000z.nc4 (the Support Team README says the fullchem restarts were obtained from the 14.7.0-rc.0 1-year benchmark; the file itself is the 2019-01-01 00Z state at the end of a run starting 2018-12-01); one sample per constituent species variable (21 non-constituent or duplicate tracers excluded) (1 x 72 x 46 x 72 values, C order)."
homepage = "https://geos-chem.readthedocs.io/en/stable/geos-chem-shared-docs/doc/gcid-portal-overview.html"

[license]
name = "MIT License (Expat), as declared for the GEOS-Chem Input Data bucket by the AWS Open Data Registry entry"
spdx = "MIT"
url = "https://geoschem.github.io/license.html"
citation = "The International GEOS-Chem User Community, GEOS-Chem 14.7.0 (1-year full-chemistry benchmark, 14.7.0-rc.0), restart file GEOSChem.Restart.fullchem.20190101_0000z.nc4, GEOS-Chem Input Data on AWS (s3://geos-chem/GEOSCHEM_RESTARTS/GC_14.7.0/). Bey, I., et al. (2001), J. Geophys. Res., 106(D19), 23073-23095, https://doi.org/10.1029/2001JD000807."
notes = "AWS Open Data Registry entry geoschem-input-data.yaml (fetched and checked by download.sh) lists 'Name: GEOS-Chem Input Data', describes the bucket as including '... and other smaller datasets such as model [initial conditions](...)', names the resource 'ARN: arn:aws:s3:::geos-chem', and states 'License: https://geoschem.github.io/license.html'. That page states verbatim: 'GEOS-Chem, including developments, is distributed under the MIT \"Expat\" public license.' The registry YAML was last changed in awslabs/open-data-registry commit 785566b46955a4ef794e9fa411475e3a04a973ff (2025-02-25, Bob Yantosca of the GEOS-Chem Support Team, 'Removed inversions tag in geoschem-input-data.yaml'); download.sh still re-checks the live YAML and license page on every run. The page wording is written for the model; the registry's dataset-level License field is the publisher's declaration for the bucket contents. Restart files are GEOS-Chem's own model output (the simulated model state written by GEOS-Chem itself), not redistributed third-party emission inventories or NASA meteorology. The GC_14.7.0 README advises not to use these restarts for production runs without spin-up; that is a scientific caveat, not a usage restriction."

