url = "https://creativecommons.org/licenses/by/4.0/"
citation = "Griffin, S., Daly, L., Piazolo, S., Forman, L. V., Keller, T., Lee, M. R., Baumgartner, R. J., Trimby, P. W., Benedix, G. K., Irving, A. J., Hoefnagels, B. Constraints on the emplacement of Martian nakhlite igneous rocks and their source volcano from advanced micro-petrofabric analysis. Zenodo, 2021. DOI 10.5281/zenodo.5545821."
notes = "Zenodo record metadata declares license id cc-by-4.0 with access_right open for the whole deposit; the record description names the files as 'Martian nakhlite meteorite electron backscatter data and magma body unit thickness calculation code'. The .ctf files are the deposited data objects. download.sh re-checks the live record license, access and per-file size/md5 before fetching. Preserve the authors and DOI."

