[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/openneuro_ds003097_aomic_cortical_thickness_f32/samples.jsonl"
summary = "Validate the CC0 dataset description, fetch 400 pinned FreeSurfer thickness maps and 200 build stamps, and emit one little-endian float32 per-vertex thickness array per hemisphere file."
deterministic_notes = "discover.sh reproduces selection.tsv from anonymous S3 listings: the 928 sub-NNNN participants are sorted and 200 evenly spaced slots floor(i*928/200) are taken, walking forward to the next participant only if a slot fails eligibility (both thickness files present with MD5 ETags, recon-all.done present, no recon-all.error, exact v6.0.1 build stamp); in the pinned run no participant failed, so no replacements occurred. download.sh checks every object's size and MD5, then the FreeSurfer curv structure (magic FF FF FF, nfaces == 2*nvertices-4, values-per-vertex == 1, size == 15+4*nvertices) and the value domain. build.sh and verify.sh use two independent decoders (array byteswap vs struct unpack/pack), sort samples by participant then hemisphere, compute index min/max from stored float32, reject constant, non-finite, out-of-range, mostly-zero (>15%), mostly-clamped (>5%) or low-diversity (<25% distinct) maps, require the realized 400 samples / 56,920,347 values / 227,681,388 bytes, and enforce the corpus floors and the 1 GB cap."

[[series]]
id = "aomic_cortical_thickness_f32"
description = "Per-vertex cortical thickness maps from FreeSurfer 6.0.1 recon-all, one per hemisphere per participant."
semantic_meaning = "Cortical grey-matter thickness in millimetres at every vertex of one hemisphere's white-surface triangle mesh: FreeSurfer's distance between the white (grey/white boundary) and pial surfaces, computed from 3T T1-weighted MRI of one AOMIC-ID1000 participant."
role = "primary"
representation_class = "native_numeric"
representation_notes = "FreeSurfer writes thickness as big-endian IEEE-754 float32; values are copied exactly, only the byte order changes. No rescaling, masking, smoothing or resampling to a template mesh."
source_resources = ["selected_thickness_maps"]
source_format = "FreeSurfer 6.0.1 new-curv binary (big-endian float32 per-vertex overlay)"
source_field = "surf/{lh,rh}.thickness per-vertex cortical thickness (mm)"
filtered_input_path = "filtered/openneuro_ds003097_aomic_cortical_thickness_f32/ingest_stats.json"
filtering = "Keep surf/lh.thickness and surf/rh.thickness for the 200 participants pinned in selection.tsv (evenly spaced over the sorted 928 sub-NNNN directories). fsaverage/fsaverage5 templates and all other FreeSurfer outputs (curvature, sulc, area, volume, surfaces, labels, stats) are excluded."
missing_value_policy = "FreeSurfer stores no NaN or sentinel; any non-finite value or any value outside [0, 5] is fatal. Zero-thickness vertices are preserved as distributed: they lie overwhelmingly on the non-cortical medial wall where the white and pial surfaces coincide (sub-0001 lh: 6,067 zeros, 6,042 outside lh.cortex.label, about 4.6% of vertices). Values exactly 5.0 are FreeSurfer's default 5 mm thickness clamp and are preserved. Realized per-map zero fraction 3.33-5.42% and clamp fraction 0.01-0.54% (pooled 4.25% and 0.12%). A map with more than 15% zeros, more than 5% clamped values, fewer than 25% distinct values or a constant value is rejected by both build and verify."
conversion = "Validate the 15-byte header (FF FF FF magic, int32 BE nvertices, nfaces == 2*nvertices-4, values-per-vertex == 1) and size == 15 + 4*nvertices, decode the nvertices big-endian float32 values, and write them unchanged in source vertex order as little-endian float32, one sample per hemisphere file. Sample length varies with each participant's mesh (108,686 to 191,104 vertices)."
numeric_kind = "float"
bit_width = 32
endianness = "little"
sample_format = "raw homogeneous little-endian float32 per-vertex cortical thickness map"
sample_geometry = "surface_mesh_vertex_scalar_field"
sample_rank = 1
sample_axes = ["surface_vertex"]
natural_record_kind = "per-hemisphere surface vertex thickness map"
sample_count = 400
total_size_bytes = 227681388
output_path = "samples/openneuro_ds003097_aomic_cortical_thickness_f32/aomic_cortical_thickness_f32/"
