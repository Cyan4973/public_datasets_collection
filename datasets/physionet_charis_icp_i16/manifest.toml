[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/physionet_charis_icp_i16/samples.jsonl"
summary = "Fetch and checksum CHARIS 1.0.0 (all 13 headers, the .dat files of the 9 kept records), validate each header and the WFDB checksum of all three interleaved signals, de-interleave the format-16 frames (stride 3) keeping signal index 2 (ICP), and emit the complete ICP channel of each kept record as its published little-endian int16 stored values (no rescaling, inversion, clipping, or segment cuts)."
deterministic_notes = "Pinned release 1.0.0: SHA-256 and size of SHA256SUMS.txt, RECORDS, all 13 .hea and all 13 .dat entries (scripts/charis_pins.py), plus each record's nsamp and ICP gain, baseline and WFDB checksum. The exclusion list EXCLUDED_RECORDS = charis8, charis9, charis10, charis12 is pinned with its reasons; verify.sh holds its own copy, checks that no excluded record has a sample or index row, and requires every kept record to have at least 50% plausible-ICP windows (minimum charis3, 0.521). The plausible class requires a pressure waveform: lag-1 autocorrelation r1 >= 0.5 (WAVEFORM_MIN_LAG1_AUTOCORR), evaluated exactly in integers as 2*sum(y_i*y_(i+1)) >= sum(y_i^2) with y_i = n*x_i - sum(x); build.py uses an algebraic form, verify.py the direct form. Canonical order charis1-7, charis11, charis13. build.sh and verify.sh each self-test their decoder on a synthetic 3-signal format-16 record (struct-packed, multi-chunk, partial final window, a smooth in-band waveform window, an in-band +/-30-code white-noise window, a wrap across a chunk boundary) with corrupted variants that must be rejected. verify.sh re-derives every sample with an independent byte-level de-interleave and regex header tokenizer, re-hashes sources against SHA256SUMS.txt, re-checks all three WFDB checksums per record, and compares sample bytes, every index field (including the window classes, stretch_vs_native and unused_code_fraction_0_40mmhg), ingest stats, manifest totals and the absence of stray files and demographic header text. Floors: at least 10,000 primary values or 100 KB, median at least 1,000 values per sample. Realized 2026-10-06: 9 samples, 204,043,652 values, 408,087,304 bytes, median 17,095,224 values (charis3), aggregate sample SHA-256 e6248950384520292a76f076757129f3667509843d1ef249d368e6e0bab869ef; all 27 WFDB signal checksums match. Descriptive diagnostics (never used to cut segments): 14.1% of values outside -10..100 mmHg; of 68,017 60-s windows, 81.4% plausible ICP (waveform present), 9.6% arterial blood pressure on the ICP input, 6.5% pegged output at 50-250 mmHg, 1.1% above 250 mmHg, 0.8% ICP-band white noise, 0.3% other high, 0.1% flat in the ICP range, 0.1% negative; 121 wrap-like jumps. All 9 kept records are auto-scaled: stretch vs the native 60.8182 codes/mmHg 1.3193-1.6127; unused-code fraction over 0..40 mmHg 0.242-0.506."

[[series]]
id = "charis_icp_channel_adc_i16"
description = "Complete 50 Hz intracranial-pressure channel of the 9 majority-ICP CHARIS records, as the publisher's auto-scaled WFDB format-16 stored values."
semantic_meaning = "Successive signed 16-bit WFDB stored values of the ICP channel: the analog pressure output of a GE TRAM-rac 4A patient monitor (25 Hz low-pass), sampled at 50 Hz, from an intraparenchymal Camino micro-transducer or, in some patients, a ventriculostomy. Physical pressure is (value - baseline) / gain mmHg with the per-record header calibration, kept as index metadata (adc_gain_per_mmhg, adc_baseline). In all 9 kept records the publisher auto-scaled the channel to the full int16 range (physical minimum and maximum mapped to -32767 and +32767) from a native monitor quantization of 60.8182 codes/mmHg (evidenced by the excluded charis12's unscaled 60.8182(-392)/mmHg ICP and ABP headers and by every record's ECG gain of 6081.5219 or 6081.8245 per mV). The stretch r = gain / 60.8182 = 1.3193-1.6127 leaves at least about 1 - 1/r of the integer codes in the ICP band unused (index fields stretch_vs_native, unused_code_fraction_0_40mmhg = 0.242-0.506: equal to 1 - 1/r to 3 decimals in charis1, 2, 7, 11 and 13, 0.267 vs 0.261 in charis6, and higher in charis3, 4 and 5, where part of the 0..40 mmHg band is never reached). Multi-day ICU recordings retain the channel's non-ICP stretches as published (9.6% of windows carry arterial blood pressure on the ICP input, 6.5% pegged output, smaller shares of crosstalk, in-band white noise, and flat or disconnected output); per-record diagnostics quantify them."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The values are the publisher's stored WFDB format-16 integers (two-byte little-endian two's complement), emitted unchanged: no rescaling back to the native 60.8182 codes/mmHg lattice, no gain or baseline conversion, filtering, resampling, clipping, inversion, or segment removal. They are not raw monitor ADC output: in all 9 kept records the ICP and ABP channels were auto-scaled to full int16 range, so each kept ICP channel has exactly one +32767 and one -32767 value (its physical maximum and minimum), and the stored values sit on a lattice stretched 1.32-1.61x relative to the native scale. The series id keeps WFDB's 'ADC units' terminology for stored digital values."
source_resources = ["charis_wfdb_data", "charis_wfdb_headers", "charis_sha256sums", "charis_records"]
source_format = "Interleaved WFDB format 16 (3 signals per frame: ABP, ECG, ICP; little-endian int16) with WFDB .hea header"
source_field = "ICP (WFDB signal index 2 of 3, units mmHg, stored digital values)"
filtered_input_path = "filtered/physionet_charis_icp_i16/ingest_stats.json"
filtering = "Keep the 9 majority-ICP records (charis1-7, charis11, charis13) and, from each, only the complete ICP signal. A window counts as plausible ICP when its median is in -10..50 mmHg, its peak-to-peak range is at least 1 mmHg, and a pressure waveform is present (lag-1 autocorrelation r1 >= 0.5). Excluded: charis8 (47.7% plausible-ICP windows; 43.3% arterial blood pressure on the ICP input while ABP reads about 0 mmHg, 4.1% flat and 3.4% ICP-band noise), charis12 (38.2% plausible; 57.5% of windows in the ICP band but white noise around a level, r1 < 0.5, with no cardiac component while ABP is pulsatile; also the only unscaled native-lattice record, stretch 1.0), charis10 (20.0% plausible; pegged output at about 101 mmHg and >250 mmHg crosstalk) and charis9 (8.6% plausible under the waveform test, 40.7% without it; 56.3% arterial blood pressure on the ICP input while ABP reads about 0 mmHg; header note 'Intermittent, discontinuous ICP signal'; outlier stretch 2.125 with baseline -13789). The ABP and ECG signals are read only for checksum validation and discarded; header comments are discarded on parse. No time segment is removed from a kept record."
missing_value_policy = "No values are dropped, clipped, rescaled, inverted, or imputed. WFDB format 16 reserves -32768 as the invalid-sample code; any such codes are kept in place and counted per record (invalid_sample_count); the kept data contain none. The single +32767 and -32767 in each kept record are the channel's auto-scaled physical extremes and are kept and counted (positive_rail_count, negative_rail_count). Separately, adjacent values more than 32,768 codes apart are counted as wrap_like_jumps (121 across the kept records), an observed artifact kept as published. Artifact, flat, disconnected, white-noise and arterial-pressure stretches inside kept records stay in the sample and are quantified, not masked. Checksum, size, header geometry, or calibration-pin mismatches are fatal, as is a degenerate channel (fewer than 16 distinct codes, constant, or more than half invalid codes) or a kept record below 50% plausible-ICP windows; verify.sh applies the same policy."
conversion = "Read each kept record's .dat in whole-frame chunks, interpret it as little-endian int16, take every third value starting at index 2 (frame layout ABP, ECG, ICP), and write those stored values unchanged as little-endian int16, one .bin per record named charisN.bin. Length must equal the header nsamp, and the 16-bit sum of each signal must equal its header checksum."
numeric_kind = "int"
bit_width = 16
endianness = "little"
sample_format = "raw homogeneous little-endian signed-int16 WFDB stored-value sequence"
sample_geometry = "variable_length_clinical_waveform_1d"
sample_rank = 1
sample_axes = ["time_sample_50hz"]
natural_record_kind = "complete_charis_patient_recording_icp_channel"
sample_count = 9
total_size_bytes = 408087304
