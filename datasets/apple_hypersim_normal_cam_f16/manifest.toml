manifest_version = 1
dataset_id = "apple_hypersim_normal_cam_f16"
name = "Apple Hypersim Camera-Space Surface-Normal G-Buffers (normal_cam) Float16"
description = "Per-pixel camera-space geometric surface normals (V-Ray normals render element, bump mapping ignored) of photorealistic synthetic indoor scenes from Apple's Hypersim dataset, one native IEEE binary16 768x1024x3 frame per scene for 198 of the 457 public scenes (200 selected, 2 degenerate frames dropped), cut by byte range out of the official stored scene zips."
homepage = "https://github.com/apple/ml-hypersim"

[license]
name = "Creative Commons Attribution-ShareAlike 3.0 Unported"
spdx = "CC-BY-SA-3.0"
url = "http://creativecommons.org/licenses/by-sa/3.0/"
citation = "Mike Roberts, Jason Ramapuram, Anurag Ranjan, Atulit Kumar, Miguel Angel Bautista, Nathan Paczan, Russ Webb, Joshua M. Susskind. Hypersim: A Photorealistic Synthetic Dataset for Holistic Indoor Scene Understanding. ICCV 2021. arXiv:2011.02523."
notes = "README.md of apple/ml-hypersim at commit 3463c5c4a75f3cbfc65ed31cfd6e87204b3a2254 states: 'The Hypersim Dataset is licensed under the [Creative Commons Attribution-ShareAlike 3.0 Unported License](http://creativecommons.org/licenses/by-sa/3.0/).' download.sh re-fetches that README (sha256-pinned) and fails if the sentence is missing. The repository LICENSE.txt is Apple's sample-code license and covers code only; no Hypersim code is used. Share-alike: redistributed or adapted samples must carry the same CC BY-SA 3.0 license and credit Apple / the Hypersim authors (citation above). Only published renders are used; the purchasable Evermotion source assets are not touched."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official Apple ML Research CDN (docs-assets.developer.apple.com, the URLs listed by the upstream repository) and raw.githubusercontent.com at a pinned commit, anonymous. Content is synthetic geometry of artist-made virtual interiors; the upstream README states images containing people and prominent logos were manually excluded from the public release."
usage_notes = "Synthetic computer-graphics ground truth published for research; emitted unchanged as binary16 words for numeric compression research. CC BY-SA 3.0 attribution and share-alike apply to the samples."

[[origins]]
id = "apple_ml_hypersim_cdn"
name = "Apple ML Research Hypersim scene archives"
url = "https://docs-assets.developer.apple.com/ml-research/datasets/hypersim/v1/scenes/"
type = "bucket"
notes = "One stored (method 0) zip per scene, 1.0-15.8 GB; 68 of the 200 selected zips exceed 4 GiB and use zip64 records. Accept-Ranges: bytes; Last-Modified Dec 2020 (pinned per zip in sources.tsv)."

[[origins]]
id = "apple_ml_hypersim_repo"
name = "apple/ml-hypersim GitHub repository"
url = "https://github.com/apple/ml-hypersim"
