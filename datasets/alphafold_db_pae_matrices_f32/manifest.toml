manifest_version = 1
dataset_id = "alphafold_db_pae_matrices_f32"
name = "AlphaFold DB Predicted Aligned Error Float32 Matrices"
description = "Dense directional residue-by-residue predicted-aligned-error matrices for a bounded, biologically varied protein selection."
homepage = "https://alphafold.ebi.ac.uk/"

[license]
name = "Creative Commons Attribution 4.0 International"
spdx = "CC-BY-4.0"
url = "https://creativecommons.org/licenses/by/4.0/"
citation = "Varadi M et al. AlphaFold Protein Structure Database: massively expanding the structural coverage of protein-sequence space with high-accuracy models. Nucleic Acids Research."
notes = "The official AlphaFold DB application states CC-BY-4.0 and requests attribution for its databases and services. Preserve AlphaFold DB, EMBL-EBI, Google DeepMind, UniProt accession, and entry/version attribution."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Public computational protein-structure predictions; no participant or personal fields are present."
usage_notes = "Model-derived structural-confidence data intended as numeric compression training material."

[[origins]]
