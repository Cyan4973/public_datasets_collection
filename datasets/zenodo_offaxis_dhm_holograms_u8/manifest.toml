[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/zenodo_offaxis_dhm_holograms_u8/samples.jsonl"
summary = "Range-fetch 102 pinned Holograms/*.tif members (6 evenly spaced frames from each 405 nm video) out of 17 Zenodo zips via their central directories, validate CRC32 and TIFF layout, decode each LZW + horizontal-predictor TIFF with a pure-Python decoder and write each 2048x2048 uint8 hologram unchanged as one sample."
deterministic_notes = "Pinned: record 10632465, 17 zip keys with size, MD5 and central-directory offset/size (videos.tsv), and per selected member name, CRC32, compressed/uncompressed size, local header offset and next-entry offset (selected_frames.tsv, produced by discover.sh on 2026-10-08). Selection rule per video with N frames: floor((2k+1)*N/12), k=0..5 (evenly spaced, never contiguous; spacing 17-52 frames, about 2.5-7.5 s at ~7 fps). download.sh rejects ZIP64, multi-disk archives, encrypted or non deflate/stored members, non-206 or mismatched Content-Range, local-header mismatches, CRC32/size mismatches and any TIFF that is not 2048x2048, 8 bps, spp 1, compression 5, predictor 2, photometric 1, single IFD. build.sh first runs a synthetic-TIFF self-test of the LZW/predictor decoder (including the legacy end-of-strip EOI width case seen in the 2022.06.09 and 2022.10 source files), then decodes; it rejects frames with fewer than 64 distinct values, a mode above 5%, mean absolute horizontal neighbour difference below 8 (no carrier fringes) or byte-identical duplicates. verify.sh re-decodes every TIFF with an independently written decoder and byte-compares each sample, and checks index fields, sha256s, stats and manifest totals. Samples are ordered by zip key, then frame number. Realized build (2026-10-08): 102 samples, 427,819,008 bytes, 155 legacy-EOI strips of 52,224, aggregate SHA-256 over per-sample SHA-256s ec62329ea22c922568a991f9ca9beaa50bae016fe84f3fef303988d90abb4dc7; verify independently re-decoded all 102."

[[series]]
id = "dhm_offaxis_hologram_u8"
description = "Raw 8-bit 2048x2048 off-axis digital holograms from one custom off-axis common-path DHM (Wallace et al. 2015 design, Allied Vision Prosilica GT2450 camera per Johnston et al. 2024) at 405 nm."
semantic_meaning = "Camera intensity (8-bit digital number) at each pixel of the interference pattern between the object wave scattered by a sample of unresolved particles (30-300 nm alumina, 50 nm gold, 1 um polystyrene beads, 100-200 nm and unextruded lipid vesicles) and the tilted reference wave, recorded in a flat slide or 0.8 mm chamber. The off-axis carrier fringes are amplitude-modulated by the object field; the carrier geometry differs by acquisition session (same instrument and camera, realigned between sessions): 2022.06.09 (4 videos, 24 samples) near-vertical fringes, neighbour correlation rho(dy=1,dx=0)=0.98, horizontal period about 2.8 px, mean |delta| about 8-10 DN vertically vs 83-101 DN horizontally; 2022.07.27 and 2022.08.02 (10 videos, 60 samples) diagonal fringes with about 4 px period on both axes, rho(1,1)=0.98-0.99, mean |delta| 55-66 DN on both axes; 2022.10.05 and 2022.10.17 (3 videos, 18 samples) a different diagonal carrier, rho(3,-1)=0.95-0.98, mean |delta| about 60-67 DN (about 26-29 for PolystyreneFlat). Exposure outlier: 2022.10.05_16-02_PolystyreneFlat was recorded at lower exposure (frame mean 42.7 DN, max 148-163, order-0 entropy 6.32 bits vs 7.33-7.77 bits for the other videos); it is kept as the same quantity on the same instrument."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The hologram TIFFs store the camera frame as 8-bit BlackIsZero grayscale, LZW-compressed with horizontal differencing (predictor 2) in 512 strips of 4 rows. LZW and the predictor are undone losslessly; pixel values are emitted exactly as stored, with no reconstruction, filtering, rescaling or cropping. Phase/amplitude reconstructions and timestamps are not emitted."
source_resources = ["zip_20220609_12_52_unextrudedvesicles", "zip_20220609_12_56_unextrudedcorrole", "zip_20220609_13_00", "zip_20220609_13_04", "zip_20220727_10_44_300nmaluminaflat", "zip_20220727_10_46_100nmalo3_flat", "zip_20220727_10_57_30nmalo3_flat", "zip_20220727_11_02_300nmaluminathick", "zip_20220727_11_14_30nmaluminathick", "zip_20220802_13_17_200nmvesiclesflat", "zip_20220802_13_21_100nmvesiclesflat", "zip_20220802_13_40_200nmvesiclesthick", "zip_20220802_13_47_100nmvesiclesthick", "zip_20220802_13_56_auflat405", "zip_20221005_16_02_polystyreneflat", "zip_20221005_16_11_polystyrenethick", "zip_20221017_12_45"]
source_format = "Baseline TIFF (little-endian, single IFD, 2048x2048, 8-bit grayscale, LZW compression with horizontal predictor) inside deflate ZIP archives"
source_field = "hologram image raster (uint8 camera DN per pixel) of Holograms/NNNNN_holo.tif"
filtered_input_path = "filtered/zenodo_offaxis_dhm_holograms_u8/ingest_stats.json"
filtering = "All 17 405 nm videos of the record; the 520 nm gold video (2022.08.02_14-37_AuFlat520.zip) is excluded as a different laser line: the 520 nm channel of the Thorlabs MCLS-1 (the paper reports a different coherence envelope at 520 nm); the family is restricted to 405 nm illumination. The 405 nm videos do not share a single fringe period (see semantic_meaning). The lower-exposure 2022.10.05_16-02_PolystyreneFlat video is kept. From each video of N frames, frames floor((2k+1)*N/12) for k=0..5 (102 of 4,121 frames). __MACOSX AppleDouble entries, .DS_Store and timestamps.txt are ignored."
missing_value_policy = "uint8 camera frames have no missing-value sentinel; every pixel is kept as stored, including 255 (rare saturation). A frame that fails CRC32, TIFF layout, LZW termination or strip-length checks, a frame with fewer than 64 distinct values, a mode above 5% of pixels, no carrier fringes, or a byte-identical duplicate fails the recipe; nothing is dropped or imputed."
conversion = "Inflate the ZIP member (raw deflate), parse the TIFF IFD, LZW-decode each 4-row strip (MSB-first codes, clear 256, EOI 257, early change), undo horizontal differencing as a running sum modulo 256 within each row, and write the 4,194,304 row-major pixel values unchanged as one sample <zip stem>_fNNNNN.bin; byte order is irrelevant for 8-bit values."
