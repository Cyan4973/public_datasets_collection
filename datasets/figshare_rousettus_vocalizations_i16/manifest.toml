type = "api_query_result"
version = "article version 1 of each archive article"
access = "Anonymous JSON GET, one per archive article (30) plus FileInfo.csv article 4555897."
size_bytes = 0
sha256 = ""
local_path = "downloads/figshare_rousettus_vocalizations_i16/api/"
notes = "Not byte-pinned (view counters and modified dates may change); validated field by field: license CC0 and the file id/name/size/md5 pinned in archives.tsv."

[[resources]]
