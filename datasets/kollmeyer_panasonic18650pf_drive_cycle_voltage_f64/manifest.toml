notes = "Evidence chain (captured 2026-10-05): (1) the pinned BSEBench Tier-1 mirror card (README.md at revision 0f3c96601aa8dcc25f697ef32f3ac918d24433b9, sha256-pinned in download.sh) states 'Kollmeyer, P. (2018). \"Panasonic 18650PF Li-ion Battery Data and Experimental Procedures.\" Mendeley Data, v1. DOI: 10.17632/wykht8y7tg.1 ... Upstream URL: https://data.mendeley.com/datasets/wykht8y7tg/1 ... License: CC-BY-4.0'; (2) the BSEBench Tier-2 sidecars for the same dataset repeat license CC-BY-4.0 with provenance 'Kollmeyer (Mendeley)'; (3) the upstream readme shipped inside the mirror says 'If this data is utilized for any purpose, it should be appropriately referenced.' The upstream Mendeley landing page and the DataCite DOI record were NOT reachable from the collection network (proxy 403), so the CC BY 4.0 grant is taken from the mirror's statement of the upstream license rather than read directly from Mendeley. Attribution: cite the DOI above and credit Dr. Phillip Kollmeyer, University of Wisconsin-Madison."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Laboratory battery-tester logs of a single commercial Li-ion cell in a thermal chamber. Fetched from the BSEBench Hugging Face Tier-1 raw mirror, which re-hosts the upstream Mendeley files unmodified under the upstream folder layout; every file is pinned by git revision, size and LFS SHA-256. The only personal datum in the upstream readme is the experimenter's contact address, which is not emitted."
usage_notes = "Primary payload is the Voltage column only. Current, Power, Ah, Wh, temperatures, Time and TimeStamp are not emitted; Time is used only to validate the 0.1 s logging cadence."

