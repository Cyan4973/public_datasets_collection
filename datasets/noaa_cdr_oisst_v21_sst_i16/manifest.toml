notes = "AWS Registry of Open Data entry noaa-cdr-oceanic (which lists the bucket noaa-cdr-sea-surface-temp-optimum-interpolation-pds): 'NOAA data disseminated through NODD are open to the public and can be used as desired ... NOAA requests attribution for the use or dissemination of unaltered NOAA data.' The bucket's documentation/UseAgreement_01B-09.pdf (21,679 bytes, MD5 51951d39e24c650ceb99027cc533023b) says: 'the CDR data sets are non-proprietary, publicly available, and no restrictions are placed upon their use'. It also asks for acknowledgement and citation (Reynolds et al. 2007; dataset DOI). Keep NOAA/NCEI attribution and the DOI. Do not imply NOAA endorsement."

