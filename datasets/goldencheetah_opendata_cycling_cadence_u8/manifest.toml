manifest_version = 1
dataset_id = "goldencheetah_opendata_cycling_cadence_u8"
name = "GoldenCheetah OpenData Per-Second Cycling Pedalling Cadence UInt8"
description = "Native integer pedalling cadence (rpm) from bike-computer cadence sensors on a 1 s time lattice, one uint8 sample per cycling activity, from 460 pinned athlete archives of the CC0 GoldenCheetah OpenData project (OSF 6hfpz)."
homepage = "https://osf.io/6hfpz/"

[license]
name = "CC0 1.0 Universal"
spdx = "CC0-1.0"
url = "https://creativecommons.org/publicdomain/zero/1.0/"
citation = "GoldenCheetah OpenData Project, Open Science Framework, DOI 10.17605/OSF.IO/6HFPZ."
notes = "The OSF API node https://api.osf.io/v2/nodes/6hfpz/ (public, 'GoldenCheetah OpenData Project') links node_license 563c1cf88c5e4a3877f9e96c, which https://api.osf.io/v2/licenses/563c1cf88c5e4a3877f9e96c/ names 'CC0 1.0 Universal'. The upstream README (github.com/GoldenCheetah/OpenData) states the data is entirely anonymised and that no personally identifiable information is stored or made available."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official OSF project storage, fetched via the osf.io/download/<file id>/ endpoints. Athletes are identified only by random UUIDs; the activity CSVs carry no GPS coordinates."
usage_notes = "Only the cadence column of cycling activities is emitted. Power, heart rate, speed/distance, altitude, ride metrics and the ATHLETE demographics block (gender, year of birth) are never emitted, and the demographics are never read."

[[origins]]
id = "osf_6hfpz"
name = "Open Science Framework project 6hfpz (GoldenCheetah OpenData)"
url = "https://osf.io/6hfpz/"
type = "repository"
notes = "osfstorage root holds 6,613 athlete zips ('<athlete uuid>.zip', 115,614,412,283 bytes) plus an INDEX folder of summary CSVs (not used). They were listed on 2026-10-09 through the files API with sort=name and page[size]=100 (67 pages)."

[[resources]]
id = "athlete_zip_selection"
origin = "osf_6hfpz"
url = "https://osf.io/download/<osf_file_id>/"
type = "archive"
version = "OSF listing 2026-10-09; files last modified 2018-11..2021-12"
access = "Public anonymous HTTPS. osf.io/download/<id>/ redirects to a short-lived signed storage URL, so the recipe always resolves through the osf.io/download endpoint."
size_bytes = 2807759073
sha256 = ""
local_path = "downloads/goldencheetah_opendata_cycling_cadence_u8/zips/"
notes = "460 athlete zips pinned in sources.tsv with OSF file id, size, SHA-256 and MD5. Selection: walk zips in ascending name order (names are random UUIDs), keep those of 100,000 to 20,000,000 bytes, and stop once the cumulative size reaches 2.8e9 bytes. scripts/select_sources.py implements the rule and discover.sh re-derives it."

[local_paths]
downloads = "downloads/goldencheetah_opendata_cycling_cadence_u8/"
filtered = "filtered/goldencheetah_opendata_cycling_cadence_u8/"
