description = "Whole native-float32 density trajectories (21 saved time steps x 512 x 512 periodic grid) of 40 evenly spaced simulations from the PDEBench 2D_CFD_Turb_M1.0_Eta1e-08_Zeta1e-08_periodic_512 training file, fetched by HTTP byte range without downloading the 88 GB file."
homepage = "https://doi.org/10.18419/darus-2986"

[license]
name = "Creative Commons Attribution 4.0 International"
spdx = "CC-BY-4.0"
url = "https://creativecommons.org/licenses/by/4.0/"
citation = "Takamoto, M., Praditia, T., Leiteritz, R., MacKinlay, D., Alesiani, F., Pflueger, D., Niepert, M. PDEBench Datasets. DaRUS, V8, 2022. https://doi.org/10.18419/darus-2986"
notes = "The DaRUS dataset record (latestVersion 8.0, released 2024-02-13) declares license {\"name\": \"CC BY 4.0\", \"uri\": \"http://creativecommons.org/licenses/by/4.0\"} with empty termsOfUse and termsOfAccess; file 164686 is not restricted. download.sh re-checks this on every run. Preserve the dataset citation and DOI."

[safety]
