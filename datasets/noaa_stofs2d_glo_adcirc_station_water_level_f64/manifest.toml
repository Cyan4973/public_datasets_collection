notes = "Per-object sizes and multipart ETags (MD5-of-part-MD5s) are pinned in sources.tsv, itself pinned by SHA-256 in scripts/stofs61.py. These files live in the cycle's rerun/ folder, which the bucket README describes as holding files of the system run 'stored for NOAA internal reference'; they are the native ADCIRC fort.61 station output. Excluded: the 06/12/18z cycles (forecast windows would overlap 00z ones), prep.61 (nowcast-only run), fort.62/63/64/68 and max* files (velocity, full-mesh fields), the post-processed public points.cwl/htp/swl.nc products (classic NetCDF with decimal-rounded, datum/anomaly-adjusted values), fort.61 files up to at least 2024-05-11 (title STOFS_2D_GLOBAL.V1.1.0, version attribute 0d82f1a, 1,687 stations, 960 steps, ~12.1 MB) and cycles from 2026-08-21 on (STOFS v3.1, operational from the 2026-08-17 12z cycle per the bucket README; surf/tide products, no fcst.61)."

