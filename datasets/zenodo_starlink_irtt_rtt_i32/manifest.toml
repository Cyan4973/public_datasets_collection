notes = "Zenodo record 10020034 metadata declares license id cc-by-4.0 (open access); download.sh re-checks it on every run. The upstream README asks users to cite the Zenodo DOI and the PIMRC'23 paper."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official Zenodo deposit by the measuring researchers (University of Victoria). The authors redacted server IPs and domain names before publication. The only remaining address is a private RFC1918 client address in the IRTT config block, and the recipe does not emit it."
usage_notes = "Only integer delay measurements are emitted. Timestamps, addresses, system info and the iPerf3 throughput files are not emitted."

