filtering = "Retain all slices from the three pinned PET WB Corrected series, sorted by unique ImagePositionPatient. Exclude DICOM headers, CT series, identifiers, and physical-value conversion."
missing_value_policy = "No stored voxels are dropped or imputed. Missing slices, changed identities/counts/licenses, compressed transfer syntax, inconsistent geometry or semantics, non-uint16 pixels, duplicate positions/instances, invalid scale factors, malformed bounds, or changed hashes/statistics fail the recipe."
conversion = "Parse each DICOM slice, validate the typed Pixel Data field, order slices geometrically, and concatenate their source-identical little-endian uint16 payloads into one volume per series."
