[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/protomaps_osm_z15_building_coords_i16/samples.jsonl"
summary = "Range-fetch pinned PMTiles pieces, resolve each block tile through the root and leaf directories, gunzip each MVT tile, decode the buildings layer polygon command streams to absolute tile coordinates, and write one int16 sample per tile."
deterministic_notes = "74 cities across six continents (cities.tsv) define aligned 8x8 z15 blocks (block origin = multiple of 8 nearest-centred on the city centre). Tiles are visited in block order then Hilbert tile-id order. Tiles absent from the archive, tiles whose payload is deduplicated outside the block span, tiles without a buildings layer, and tiles with fewer than 1000 building values are skipped, never merged. Archive size/ETag, header region, metadata, leaf directory SHA-256, header fields, span sizes, contiguous block tile-id ranges, layer extent 4096, MVT version 2, strict polygon command structure, and the -64..4160 buffer range are enforced; verify.sh re-decodes every tile and compares bytes. Realized: 3,700 samples from all 74 blocks (4,736 tiles considered; skipped 651 below 1000 values, 294 without buildings layer, 91 deduplicated outside span), 50,182,766 values, median 8,502 values per tile, aggregate sample-hash SHA-256 9ec3b4edda94a263e3d73c8812f66497c94c9f61c0bef69dce1b9f5cfd78eeb7."

[[series]]
id = "osm_building_vertex_xy_i16"
description = "Building footprint polygon vertices of one z15 vector tile as interleaved x,y int16 tile-space coordinates."
semantic_meaning = "Absolute MVT tile-space integer coordinates (extent 4096 per tile edge, y down, 64-unit buffer so -64..4160) of every building and building-part polygon ring vertex in the tile's buildings layer, in feature order, ring order, vertex order."
role = "primary"
representation_class = "native_numeric"
representation_notes = "MVT stores polygon geometry as a command stream of MoveTo/LineTo/ClosePath with zigzag-encoded integer deltas relative to a cursor that starts at (0,0) for each feature. Decoding the deltas reconstructs the tile's exact integer vertex coordinates (lossless, like reconstructing TrueType glyph points from deltas). ClosePath adds no vertex, so the ring start is not duplicated. No rescaling, reprojection, simplification or quantization is applied by this recipe."
source_resources = ["pmtiles_header_root", "pmtiles_leaf_directories", "pmtiles_block_tile_spans"]
source_format = "PMTiles v3 archive of gzip-compressed Mapbox Vector Tile v2 protobuf tiles"
source_field = "buildings layer, Feature.geometry polygon (GeomType 3) command stream decoded to absolute x,y vertices"
filtered_input_path = "filtered/protomaps_osm_z15_building_coords_i16/ingest_stats.json"
filtering = "Only zoom 15, only the buildings layer, only polygon features (non-polygon features would be counted and ignored). Tiles with fewer than 1000 building coordinate values are skipped. All other layers are discarded."
missing_value_policy = "There are no missing coordinates. Malformed protobuf, malformed command streams, extent other than 4096, coordinates outside -64..4160, pinned-identity mismatches, or missing local files fail the build; nothing is imputed."
conversion = "gunzip tile -> parse protobuf Tile.layers -> select layer named buildings -> for each GeomType 3 feature decode command integers (id = c & 7, count = c >> 3) and zigzag deltas into absolute coordinates -> append x,y per vertex -> serialize as little-endian int16; one sample file per tile."
numeric_kind = "int"
bit_width = 16
endianness = "little"
sample_format = "raw homogeneous interleaved little-endian int16 x,y tile-space vertex coordinates"
sample_geometry = "2d_mvt_polygon_vertices"
sample_rank = 2
sample_axes = ["building_ring_vertex", "xy_coordinate"]
natural_record_kind = "z15_vector_tile_buildings_layer"
sample_count = 3700
total_size_bytes = 100365532
output_path = "samples/protomaps_osm_z15_building_coords_i16/osm_building_vertex_xy_i16/"
