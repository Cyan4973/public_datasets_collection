name = "MACE-MP Foundation Interatomic-Potential Checkpoints: Native Float64 Parameter Tensors"
description = "Complete trained float64 parameter tensors (torch.nn.Parameter over DoubleStorage) from all ten MIT-licensed MACE-MP-0a/0b/0b2/0b3/MPA-0 equivariant interatomic-potential foundation checkpoints."
homepage = "https://github.com/ACEsuit/mace-foundations"

[license]
name = "MIT License"
spdx = "MIT"
url = "https://github.com/ACEsuit/mace-foundations/blob/16a9f178706ce053f3ca8531efbab00a305d0854/LICENSE"
citation = "Batatia I. et al., A foundation model for atomistic materials chemistry, arXiv:2401.00096 (2023). MACE-MP foundation models, ACEsuit/mace-foundations."
notes = "The pinned README model table (revision 16a9f178706ce053f3ca8531efbab00a305d0854) ends the MACE-MP-0a, MACE-MP-0b, MACE-MP-0b2, MACE-MP-0b3 and MACE-MPA-0 rows with '| MIT |'; the repository LICENSE is the MIT License (Copyright (c) 2024 MACE-MP). The Hugging Face mirrors mace-foundations/mace-mp-0 and mace-foundations/mace-mpa-0 are also tagged license:mit. OMAT/MATPES/OMOL/MH/POLAR/MDP releases are ASL-licensed and are not downloaded. Preserve the MIT notice and cite the MACE-MP paper."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official GitHub release assets of ACEsuit/mace-foundations; trained model parameters only. No training structures (MPtrj/sAlex), descriptors or user data are downloaded or emitted."
usage_notes = "Checkpoints are decoded with an inert whitelisting unpickler; torch/mace/e3nn are never imported and no pickled code is executed."

