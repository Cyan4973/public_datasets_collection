manifest_version = 1
dataset_id = "gwa_v4_country_wind_speed_100m_f32"
name = "Global Wind Atlas v4 Country Rasters: Mean Wind Speed at 100 m Float32"
description = "Thirty-one complete Global Wind Atlas 4.0 country rasters of modelled long-term mean wind speed at 100 m above ground (0.0025 degree, about 250 m, WGS84 grid; land plus offshore exclusive economic zone), decoded from the official ZSTD/predictor-3 BigTIFFs to raw little-endian float32 with the source NaN nodata preserved outside each country mask."
homepage = "https://globalwindatlas.info/"

[license]
name = "Creative Commons Attribution 4.0 International"
spdx = "CC-BY-4.0"
url = "https://globalwindatlas.info/en/about/TermsOfUse"
citation = "Data obtained from the Global Wind Atlas version 4.0, a free, web-based application developed, owned and operated by the Technical University of Denmark (DTU). The Global Wind Atlas version 4.0 is released in partnership with the World Bank Group, utilizing data provided by Vortex, using funding provided by the Energy Sector Management Assistance Program (ESMAP). For additional information: https://globalwindatlas.info. Main reference: Davis, N. N., Badger, J., Hahmann, A. N., et al., The Global Wind Atlas: A high-resolution dataset of climatologies and associated web-based application, Bulletin of the American Meteorological Society 104(8), E1507-E1525, 2023, https://doi.org/10.1175/BAMS-D-21-0075.1"
notes = "Grant, from the GWA Terms of Use (served in https://globalwindatlas.info/mapframe.bundle.js, fetched 2026-10-06): 'You are encouraged to use the GWA App and the Works to benefit yourself and others in creative ways. The Works are licensed under the Creative Commons Attribution 4.0 International license, CC BY 4.0, except where expressly stated that another license applies.' No other license is stated for the wind-speed GIS layers (the only other license line in the app is CC-BY-4.0 for the Global Atlas of Siting Parameters). Access conditions quoted in the README and honoured by download.sh: the GIS page says 'The provided URL can also be used as an API service' and 'This API service is not to be used for bulk downloads of all countries or datasets'; the Terms of Use also ask users not to 'Use any robot, spider or other automatic device, process or means to access the GWA App for any purpose, including monitoring or copying any of the material on the GWA App'. The recipe fetches a fixed list of 31 country files of one layer at one height (out of roughly 250 countries, 12 layers and 5 heights), sequentially with pauses, directly from the CDN object that the documented API URL redirects to. Attribute DTU/GWA 4.0 with the requested text."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official GWA 4.0 country GIS files from the GWA CDN (gwa.cdn.nazkamapps.com, the redirect target of https://globalwindatlas.info/api/gis/country/{ISO3}/wind-speed/100). Modelled wind climatology on a geographic grid; no people, personal data or sensitive content."
usage_notes = "Modelled climatology (ERA5 2008-2017 forcing, WRF mesoscale at 3 km, PyWAsP microscale downscaling), not measurement. Keep the GWA attribution; do not imply DTU or World Bank endorsement."

