notes = "The figshare API for article 12912257 (version 3) declares license {\"name\": \"CC BY 4.0\", \"url\": \"https://creativecommons.org/licenses/by/4.0/\"} for the article, whose only file is GazeBase_v2_0.zip. download.sh re-checks this on every run. Preserve attribution."

[safety]
contains_sensitive_data = false
contains_personal_data = true
provenance_notes = "Official figshare deposit by the GazeBase authors (Texas State University). De-identified, subject-coded (4-digit numbers) eye-movement recordings from college-aged volunteers, collected under a Texas State University IRB protocol in which subjects gave informed consent and acknowledged dissemination of their data in de-identified form (Griffith et al. 2021, Scientific Data 8:184). Eye-movement signals have biometric character even without names or demographics; GazeBase was designed for eye-movement biometrics research. The demographics workbook GazeBaseDemoInfo.xlsx (first outer-ZIP entry) is never requested."
usage_notes = "Use only under CC BY 4.0. Do not attempt participant identification, linkage, health inference, or biometric profiling. Only gaze-angle time series are emitted; pupil area, validity flags, event labels, target positions and demographics are excluded."

