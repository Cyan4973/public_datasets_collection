manifest_version = 1
dataset_id = "zenodo_mimii_valve_mic_array_i16"
name = "MIMII Industrial Solenoid Valve Sound Recordings, 8-Channel Microphone Array, 16 kHz PCM16 (6 dB SNR product, Hitachi, Zenodo 3384388)"
description = "160 whole 10-second 8-channel microphone-array clips of industrial solenoid valves (product models id_00, id_02, id_04, id_06; 30 normal and 10 abnormal clips per model, evenly spaced), from the 6 dB SNR valve product of the Hitachi MIMII dataset. Each clip is one native little-endian int16 sample of interleaved 8-channel frames (160,000 frames x 8 channels), range-fetched from the 6.9 GB ZIP64 archive and decoded from its deflate WAV members."
homepage = "https://zenodo.org/records/3384388"

[license]
name = "Creative Commons Attribution-ShareAlike 4.0 International"
spdx = "CC-BY-SA-4.0"
url = "https://creativecommons.org/licenses/by-sa/4.0/"
citation = "Harsh Purohit, Ryo Tanabe, Kenji Ichige, Takashi Endo, Yuki Nikaido, Kaori Suefusa, and Yohei Kawaguchi (Hitachi, Ltd.), \"MIMII Dataset: Sound Dataset for Malfunctioning Industrial Machine Investigation and Inspection,\" Proc. 4th Workshop on Detection and Classification of Acoustic Scenes and Events (DCASE), 2019; arXiv:1909.09347. Data: Zenodo record 3384388, version \"public 1.0\", doi:10.5281/zenodo.3384388."
notes = "The Zenodo record states: \"This dataset is made available by Hitachi, Ltd. under a Creative Commons Attribution-ShareAlike 4.0 International (CC BY-SA 4.0) license.\" and its metadata license id is cc-by-sa-4.0 (access_right open). download.sh re-fetches the record JSON and fails unless the license id, that sentence, access_right, version 'public 1.0', and the pinned file key, size and md5 of 6_dB_valve.zip are unchanged. Attribution: credit Hitachi, Ltd. and the authors above, link the record and the license, and indicate changes (here: members extracted from the ZIP, RIFF headers stripped, PCM data chunk kept unchanged). ShareAlike: adapted material that is shared must be offered under CC BY-SA 4.0 or a compatible license; redistributed samples keep this attribution and license."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official Zenodo record published by Hitachi, Ltd. with the DCASE 2019 workshop paper; files are served directly by zenodo.org with HTTP range support. Recordings of industrial machines (solenoid valves) mixed with background noise recorded in real factories; no speech content is targeted and no human subjects are involved."
usage_notes = "Public CC BY-SA 4.0 machine-condition acoustic recordings; appropriate for reproducible numeric dataset collection with attribution and ShareAlike preserved. Only the PCM waveform is emitted; the normal/abnormal label and model id go to the sample index as bookkeeping."

