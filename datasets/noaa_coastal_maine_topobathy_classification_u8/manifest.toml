[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/noaa_coastal_maine_topobathy_classification_u8/samples.jsonl"
summary = "Download 50 pinned COPC tiles, decode every LASzip chunk with the repository decoder tools/laz/laszip.py, and emit byte 16 (classification) of every 30-byte PDRF-6 point record as one raw uint8 array per tile."
deterministic_notes = "Tile selection (scripts/select_tiles.py, reproduced by discover.sh from NOAA's own listing and per-tile minmax CSV; never uses decoded classes): full 500 m footprint (x and y extents >= 499 m), published z-extent straddling the shoreline (min_z <= -3.0 m and max_z >= +3.0 m NAVD88), then in each of the 10 blocks the 5 qualifying tiles at evenly spaced ranks floor((2i+1)m/10) of the key-sorted list. download.sh validates size, multipart ETag, LAS 1.4/PDRF 6/record length 30 header and pinned point count. build.sh checks decoded point count, the 15 extended points-by-return counts and XYZ bounds against each header, and rejects constant tiles or tiles with >1% codes outside the documented scheme. verify.sh re-decodes each tile through the whole-file decode path and compares bytes, hashes, histograms, index fields and manifest totals."

[[series]]
id = "maine_topobathy_classification_u8"
description = "Per-point LAS 1.4 classification codes of NOAA NGS Coastal Maine topobathymetric lidar tiles."
semantic_meaning = "One uint8 ASPRS classification code per lidar point (topobathy domain profile as delivered: 1 unclassified, 2 ground, 7 low noise, 18 high noise, 22 temporal exclusion, 40 bathymetric bottom / submerged topography, 41 water surface, 42 derived (synthetic) water surface, 43 submerged object, 45 water column, 64 submerged aquatic vegetation, 65 submerged temporal exclusion, and the contractor's 71/72/81/82/85 overlap-area codes where present), for every point of one 500 m x 500 m tile, in the tile's stored COPC (octree-node chunk) order."
role = "primary"
representation_class = "native_numeric"
representation_notes = "LAS 1.4 point data record format 6 stores classification as a full byte at record offset 16; classification flags (synthetic/keypoint/withheld/overlap), scanner channel, scan direction and edge bits live in byte 15 and are not mixed in. The byte is copied unchanged."
source_resources = ["maine_topobathy_copc_tiles"]
source_format = "COPC LAS 1.4 point data record format 6, LASzip compressor 3 (layered chunked, POINT14 v3), variable-size chunks"
source_field = "classification (PDRF-6 record byte 16)"
filtered_input_path = "filtered/noaa_coastal_maine_topobathy_classification_u8/ingest_stats.json"
filtering = "All points of the 50 selected tiles; no point is dropped (withheld, overlap and synthetic points keep their codes)."
missing_value_policy = "None: the classification byte has no missing sentinel and every point record is emitted. Missing or invalid downloads, decoder layer-consumption errors, point-count, points-by-return or XYZ-bounds mismatches against the LAS header, constant tiles, and >1% undocumented codes per tile are fatal in build.sh; verify.sh applies the same no-drop policy and requires exact byte equality with a fresh decode."
conversion = "tools/laz/laszip.py decodes each LASzip chunk to 30-byte PDRF-6 records; the build takes records[16::30] for every chunk in file order and writes the bytes unchanged as a raw uint8 array (endianness irrelevant for one-byte values, declared little)."
numeric_kind = "uint"
bit_width = 8
endianness = "little"
sample_format = "raw homogeneous uint8 array"
sample_geometry = "per_point_attribute_in_stored_point_order"
sample_rank = 1
sample_axes = ["point"]
natural_record_kind = "complete_500m_copc_lidar_tile"
sample_count = 50
