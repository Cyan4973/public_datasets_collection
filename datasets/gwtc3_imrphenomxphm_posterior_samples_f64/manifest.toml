[local_paths]
downloads = "downloads/gwtc3_imrphenomxphm_posterior_samples_f64/"
filtered = "filtered/gwtc3_imrphenomxphm_posterior_samples_f64/"
index = "index/gwtc3_imrphenomxphm_posterior_samples_f64/"
