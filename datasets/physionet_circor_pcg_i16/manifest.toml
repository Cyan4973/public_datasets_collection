[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/physionet_circor_pcg_i16/samples.jsonl"
summary = "Fetch and checksum all 3,163 WAV/.hea pairs of CirCor DigiScope 1.0.3, decode each WAV's PCM data chunk after validating RIFF structure and the WFDB header, and emit one little-endian int16 sample per auscultation recording (full population, no subsetting)."
deterministic_notes = "Pinned release 1.0.3 with SHA-256 for SHA256SUMS.txt, LICENSE.txt and RECORDS; every recording and header must match SHA256SUMS.txt; aggregate WAV (578,849,274 B) and header (187,976 B) sizes are pinned. Canonical order is (numeric patient ID, site AV/PV/TV/MV/Phc, repeat suffix). build.sh and verify.sh run a synthetic-input selftest of both decoders; verify.sh re-decodes every recording with the stdlib wave module and compares bytes, index fields, exclusions, the aggregate output SHA-256, and manifest totals. Floors: at least 10,000 primary values or 100 KB, median at least 1,000 values per sample. Realized 2026-10-05: 3,163 samples, 0 exclusions, 289,355,051 values, 578,710,102 bytes, median 85,824 values, aggregate output SHA-256 42342b450a0e91f6442f2105ac0379ed4d47e2de97ab9886588f14a6be82a017; full-scale codes 83,638 (0.029%), present in 1,970 recordings, only 17 recordings above 1%, maximum 4.35%."

[[series]]
id = "circor_pcg_pcm_i16"
description = "Complete 4 kHz phonocardiogram (heart-sound) recordings, one per auscultation recording of the CirCor DigiScope 1.0.3 release."
semantic_meaning = "Successive signed 16-bit PCM amplitude codes of the chest-wall acoustic signal captured by a Littmann 3200 electronic stethoscope (DigiScope Collector) held at one auscultation site of one pediatric patient: aortic (AV), pulmonary (PV), tricuspid (TV), mitral (MV), or another position (Phc). 4000 samples per second."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The WAV fmt chunk declares PCM format tag 1, one channel, 4000 Hz, 16 bits per sample, and the WFDB header declares format 16 with ADC resolution 16, gain 1, zero 0. Emitted values are the stored PCM codes, without gain scaling, filtering, or resampling."
source_resources = ["circor_wav_recordings", "circor_wfdb_headers", "circor_records", "circor_sha256sums"]
source_format = "RIFF/WAVE PCM (format tag 1, mono, 4000 Hz, 16-bit) with companion WFDB .hea header"
source_field = "WAV data chunk: mono 16-bit PCM samples (WFDB signal 0, format 16 at the data-chunk byte offset)"
filtered_input_path = "filtered/physionet_circor_pcg_i16/ingest_stats.json"
filtering = "Keep every recording listed in the official RECORDS file of release 1.0.3: 942 patients; AV 800, PV 766, TV 732, MV 861, Phc 4; the 43 repeat recordings at a site (_1/_2/_3 suffixes) are kept as separate samples. Recordings with fewer than 16 distinct PCM codes, or whose PCM payload is byte-identical to an earlier recording in canonical order, are excluded and listed in ingest_stats.json; more than 1% exclusions fails the build. Demographics and murmur labels (training_data.csv, per-patient .txt) and the .tsv heart-cycle segmentations are neither downloaded nor emitted."
missing_value_policy = "PCM has no missing-value sentinel. Every sample of every retained recording is emitted, including full-scale (-32768 or 32767) clipped codes, whose count and fraction are reported by build and verify. Checksum, RIFF-structure, fmt-parameter, header sample-count, header byte-offset, or site-label mismatches are fatal; verify recomputes the same exclusion rule from the downloads."
conversion = "Walk the RIFF chunk list to locate the fmt and data chunks (no fixed 44-byte header assumption), require PCM tag 1, 1 channel, 4000 Hz, 16 bits, byte rate 8000 and block align 2, require data length = 2 x WFDB sample count and data offset = WFDB byte offset, then write the data-chunk int16 values as raw little-endian int16, one .bin per recording in canonical order."
numeric_kind = "int"
bit_width = 16
endianness = "little"
sample_format = "raw homogeneous little-endian signed-int16 PCM sequence"
sample_geometry = "variable_length_phonocardiogram_waveform_1d"
sample_rank = 1
sample_axes = ["time_sample_4000hz"]
natural_record_kind = "complete_circor_auscultation_recording"
sample_count = 3163
total_size_bytes = 578710102
output_path = "samples/physionet_circor_pcg_i16/circor_pcg_pcm_i16/"
