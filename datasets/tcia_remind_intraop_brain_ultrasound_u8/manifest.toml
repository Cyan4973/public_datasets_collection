manifest_version = 1
dataset_id = "tcia_remind_intraop_brain_ultrasound_u8"
name = "TCIA ReMIND Intraoperative 3D Brain Ultrasound Volumes (US_pre_dura) UInt8"
description = "14 complete native-uint8 reconstructed 3D B-mode ultrasound volumes of the brain and tumour, acquired before dural opening during image-guided neurosurgical resection in the AMIGO suite (Brigham and Women's Hospital), one volume per patient (ReMIND-001 to ReMIND-018), from TCIA's ReMIND collection."
homepage = "https://doi.org/10.7937/3RAG-D070"

[license]
name = "Creative Commons Attribution 4.0 International"
spdx = "CC-BY-4.0"
url = "https://creativecommons.org/licenses/by/4.0/"
citation = "Juvekar, P., Dorent, R., Kögl, F., Torio, E., Barr, C., Rigolo, L., Galvin, C., Jowkar, N., Kazi, A., Haouchine, N., Cheema, H., Navab, N., Pieper, S., Wells, W. M., Bi, W. L., Golby, A., Frisken, S., & Kapur, T. (2023). The Brain Resection Multimodal Imaging Database (ReMIND) (Version 1) [Data set]. The Cancer Imaging Archive. https://doi.org/10.7937/3RAG-D070"
notes = "DataCite metadata for DOI 10.7937/3RAG-D070 lists rightsList 'Creative Commons Attribution 4.0 International' (SPDX cc-by-4.0). All 320 live NBIA ReMIND US series rows report LicenseName 'Creative Commons Attribution 4.0 International License' and LicenseURI https://creativecommons.org/licenses/by/4.0/; download.sh re-checks this for every pinned series. Cite the DOI. TCIA's data usage policy (no re-identification) applies."

[safety]
contains_sensitive_data = true
contains_personal_data = false
provenance_notes = "Public de-identified human clinical intraoperative ultrasound released by TCIA (PatientIdentityRemoved YES, DICOM PS3.15 Annex E profile via CTP/Posda; BurnedInAnnotation NO is asserted for every object). The volumes are reconstructions of tracked 2D sweeps (NRRD) converted to DICOM by PixelMed NRRDToDicom, so they carry no scanner screen overlays. Source DICOM headers carry pseudonymous IDs (ReMIND-NNN) and shifted dates; none of that is emitted."
usage_notes = "Samples contain only Pixel Data voxel values. The committed pin file lists TCIA's public pseudonymous PatientID and UIDs for provenance only. Do not attempt re-identification or linkage; follow the TCIA data usage policy."

