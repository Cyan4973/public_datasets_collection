contains_personal_data = false
provenance_notes = "Public NASA Earth-observation biophysical-variable grids produced by MODAPS (algorithm MODPR_15A2, Boston University/U. Montana heritage) and distributed by LP DAAC, mirrored by Microsoft Planetary Computer as COGs; no personal or sensitive data."
usage_notes = "CC0 NASA mission data suitable for model training; cite the MOD15A2H.061 DOI."

