manifest_version = 1
dataset_id = "mpc_aster_l1t_tir_u16"
name = "Terra ASTER L1T Thermal-Infrared (Bands 10-14) At-Sensor Radiance DN UInt16"
description = "Complete daytime, low-cloud Terra ASTER L1T v003 scenes, thermal-infrared subsystem only: the five TIR bands (ImageData10..14, 8.1-11.65 um) of each scene as precision terrain-corrected at-sensor radiance digital numbers (12-bit DN stored as uint16, 0 = fill outside the rotated swath), 90 m north-up UTM grid, one sample per scene: 51 scenes from 26 climatically diverse regions, two seasonal windows (Feb 15 - Apr 30, Jul 1 - Sep 15), acquired 2000-2006."
homepage = "https://planetarycomputer.microsoft.com/dataset/aster-l1t"

[license]
name = "Public domain (USGS data policy names ASTER imagery as public domain; ASTER Level 1 products free of charge to all users since April 2016)"
spdx = "LicenseRef-Public-Domain"
url = "https://www.usgs.gov/emergency-operations-portal/data-policy"
citation = "NASA/METI/AIST/Japan Spacesystems and U.S./Japan ASTER Science Team. ASTER Level 1 Precision Terrain Corrected Registered At-Sensor Radiance (AST_L1T) Version 3. NASA EOSDIS Land Processes DAAC. https://doi.org/10.5067/ASTER/AST_L1T.003. Accessed through Microsoft Planetary Computer (collection aster-l1t)."
notes = "Grant relied on: the USGS data policy, which the Planetary Computer collection links as its license under the title 'Public Domain' (MPC's original link: https://www.usgs.gov/core-science-systems/hdds/data-policy; current location https://www.usgs.gov/emergency-operations-portal/data-policy). Its 'Public Imagery' section states: 'Most of the satellite images supplied by U.S. Federal civil agencies are public domain (such as Landsat or ASTER). ... All public domain imagery may be used, shared, transferred, or redistributed without restriction. However, there should be acknowledgement of the image source within any derived maps, products, or publications.' (The page is the USGS Hazards Data Distribution System data policy; MPC uses it as the license reference for this collection.) download.sh captures this page at downloads/mpc_aster_l1t_tir_u16/rights/usgs_data_policy.html (MPC link first, current location as fallback), phrase-checks it (regex 'public domain\\s*\\(\\s*such as landsat or aster\\s*\\)' plus 'redistributed without restriction' on the tag-stripped text) before any raster transfer, logs the matched sentences, and pins requested/effective URL, HTTP code, size and sha256 in downloads/mpc_aster_l1t_tir_u16/rights_receipts.tsv; build.sh refuses to run without check=ok receipts and verify.sh re-runs the checks offline. The raw MPC collection JSON is saved next to it (rights/mpc_collection_aster-l1t.json) and checked for the rel=license 'Public Domain' usgs.gov data-policy link, NASA and USGS listed as licensors, and TIR raster:bands 5 x uint16 nodata 0; its STAC 'license' field reads 'proprietary' and only points to that page. Capture of 2026-10-05: MPC's link redirected (HTTP 200) to https://www.usgs.gov/emergency-operations-portal/data-policy, 89,600 bytes, sha256 b91a7cda9f802beaf49b3b7bf3426b3f4dad71435c374bf66424d786cce6712e; MPC collection JSON 9,925 bytes, sha256 65f1fe15ee8394f1b9f8d49f3158f2f99e765c69a713648ce7b548de7fcca8e2 (providers NASA [producer, licensor], USGS [processor, producer, licensor], Microsoft [host, processor]). Supporting, optional and non-fatal: the NASA Earthdata notice 'ASTER Data Available at No Charge' (https://www.earthdata.nasa.gov/news/aster-data-available-no-charge, captured 137,157 bytes, sha256 fd9903ef4c170d9a5c186373fddd936662b409320d56780775cb1c8e532afd30): 'On April 1, 2016, NASA's Land Processes Distributed Active Archive Center (LP DAAC) began distributing Terra ... ASTER Level 1 Precision Terrain Corrected Registered At-Sensor Radiance (AST_L1T) data products over the entire globe at no charge.'; the same page names ASTER as a partnership of NASA, METI, AIST and J-spacesystems. Not claimed: NASA Earthdata's CC0 default, because its Data Use Guidance applies CC0 only to NASA-led missions and says data from partner (non-NASA-led) missions follow the sponsor's terms; ASTER is a METI (Japan) instrument on NASA's Terra. Attribution (requested by the USGS policy): acknowledge NASA/METI/AIST/Japan Spacesystems and the U.S./Japan ASTER Science Team (AST_L1T v003, LP DAAC) as the image source; the samples are decoded DN from Microsoft's COG export, not unaltered LP DAAC files."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official NASA/METI ASTER L1T product hosted by Microsoft Planetary Computer (Azure open data); 90 m thermal-infrared Earth imagery of deserts, mountains, ice, steppe and farmland; no people or personal data are resolvable."
usage_notes = "Public-domain Earth-observation imagery; keep the NASA/METI/AIST/J-spacesystems attribution."

