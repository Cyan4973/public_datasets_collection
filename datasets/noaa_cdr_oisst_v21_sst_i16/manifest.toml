name = "NOAA CDR Daily OISST v2.1 (AVHRR-only, 0.25 deg) Sea-Surface Temperature Grids Int16"
description = "120 final daily global sea-surface temperature analyses of the NOAA 1/4-degree Daily Optimum Interpolation SST v2.1 climate data record (AVHRR-only), dated the 1st and 15th of every month 2020-2024. Each is decoded from NetCDF4 with a pure-stdlib HDF5 reader to one native int16 720x1440 grid (0.01 degC, -999 land fill)."
homepage = "https://www.ncei.noaa.gov/products/optimum-interpolation-sst"

