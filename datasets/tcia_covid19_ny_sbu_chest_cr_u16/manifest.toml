notes = "48 single-image CR series, 15,552,208-15,552,420 bytes each. Per object the pin file fixes FileSize, header length (Pixel Data value offset) and the SHA-256 of all header bytes before Pixel Data; download.sh records full-object SHA-256 values in download_inventory.json on first fetch, and build/verify enforce them."

[local_paths]
downloads = "downloads/tcia_covid19_ny_sbu_chest_cr_u16/"
filtered = "filtered/tcia_covid19_ny_sbu_chest_cr_u16/"
index = "index/tcia_covid19_ny_sbu_chest_cr_u16/"
samples = "samples/tcia_covid19_ny_sbu_chest_cr_u16/"

[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/tcia_covid19_ny_sbu_chest_cr_u16/samples.jsonl"
summary = "Fetch 48 pinned uncompressed Explicit VR Little Endian CR DICOM objects (one per patient), walk each header with a stdlib parser, assert the fixed acquisition and pixel schema, and emit each complete native Pixel Data plane byte-for-byte as one little-endian uint16 sample."
deterministic_notes = "Selection (discover.py, reproducible from the NBIA CR listing via discover.sh): COVID-19-NY-SBU CR series with Manufacturer CARESTREAM HEALTH, ManufacturerModelName DRX-REVOLUTION, BodyPartExamined CHEST, SeriesDescription AP, ImageCount 1, CC BY 4.0, StudyDesc starting 'CHEST AP ' without INFANT, and FileSize in the full-field 2544x3056 bucket (FileSize minus 15,548,928 pixel bytes between 2,048 and 4,096); one series per patient (smallest SeriesInstanceUID); patients ordered by sha256('tcia_covid19_ny_sbu_chest_cr_u16:' + PatientID); the first 48 whose live header validates exact Rows=2544, Columns=3056 are pinned (6 earlier patients in that order were 3056x2544 portrait objects and were skipped). Every object is checked for exact size, header SHA-256, transfer syntax, SOP class, identity UIDs, device, view, imager pixel spacing, pixel schema, identity rescale, lossless status and Pixel Data being the final element. The floor (10,000 values / 100 KB, median 1,000 values) is exceeded by every single sample; verify.sh rejects constant, low-cardinality, >12-bit, duplicate or mostly-zero planes."

[[series]]
id = "sbu_chest_cr_pixel_u16"
description = "Complete portable AP chest radiograph pixel planes, one per distinct patient."
semantic_meaning = "Stored for-presentation computed-radiography pixel values (12 bits stored in 16, 0-4095, MONOCHROME2, higher value = brighter display, identity rescale) of one complete portable anteroposterior chest X-ray acquired on a Carestream DRX-Revolution mobile unit at 0.139 mm imager pixel spacing. These are vendor-processed archived clinical images (ImageType DERIVED\\PRIMARY), not raw detector frames."
role = "primary"
representation_class = "native_numeric"
representation_notes = "Each DICOM object declares BitsAllocated=16, BitsStored=12, HighBit=11, PixelRepresentation=0, SamplesPerPixel=1, PhotometricInterpretation MONOCHROME2, RescaleIntercept 0, RescaleSlope 1, LossyImageCompression 00 and native (unencapsulated) OW Pixel Data in Explicit VR Little Endian, so each emitted uint16 equals the stored 12-bit pixel value."
source_resources = ["pinned_chest_cr_dicom_objects", "nbia_study_series_metadata"]
source_format = "DICOM Computed Radiography Image Storage (1.2.840.10008.5.1.4.1.1.1), Explicit VR Little Endian (1.2.840.10008.1.2.1)"
source_field = "Pixel Data (7FE0,0010)"
filtered_input_path = "filtered/tcia_covid19_ny_sbu_chest_cr_u16/ingest_stats.json"
filtering = "Keep the 48 pinned objects and only their Pixel Data element. DICOM metadata, private GEIIS/Carestream tags, ABDOMEN, DRX-1, PA/LATERAL, cropped-matrix and portrait-orientation objects are excluded."
missing_value_policy = "No pixels are dropped, masked, cropped, filled or imputed; zero-valued collimation border pixels are kept as stored values. Missing, truncated, resized, compressed, rescaled, MONOCHROME1, out-of-12-bit-range, duplicate, constant, low-cardinality or more-than-half-zero images fail the recipe."
conversion = "Walk the explicit-VR header (skipping defined- and undefined-length sequences) to Pixel Data, assert it is the final 15,548,928-byte element, and copy it byte-for-byte in source row-major order (2544 rows x 3056 columns) as little-endian uint16. No windowing, inversion, rescaling, rotation or normalization."
numeric_kind = "uint"
bit_width = 16
endianness = "little"
sample_format = "raw homogeneous little-endian unsigned-int16 chest radiograph plane (12 bits stored)"
sample_geometry = "fixed_2544x3056_chest_radiograph"
sample_rank = 2
sample_axes = ["image_row", "image_column"]
sample_shape = [2544, 3056]
natural_record_kind = "complete_dicom_chest_radiograph_pixel_plane"
sample_count = 48
total_size_bytes = 746348544
output_path = "samples/tcia_covid19_ny_sbu_chest_cr_u16/sbu_chest_cr_pixel_u16/"
