notes = "The AWS Open Data registry entry for the bucket (awslabs/open-data-registry datasets/hpgp-data.yaml, resource arn:aws:s3:::human-pangenomics) states: License: \"[Creative Commons CC0 1.0 Universal](https://creativecommons.org/publicdomain/zero/1.0/deed.en)\". download.sh re-fetches that entry and requires the CC0 line and the bucket ARN on every run."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Human lymphoblastoid cell-line DNA (1000 Genomes / HPRC consented, openly released samples HG01123 ... HG06805). Only the per-base pulse-width kinetics arrays are emitted. Bases, quality values, IPD (fi/ri), MM/ML methylation calls, read names and ZMW numbers are never written to samples or the index; the index records only the public sample ID, movie name, file ordinal and record ordinal."
usage_notes = "One submission, one instrument model (Revio), one chemistry (CM R/P2-C2/5.0-25M), ICS 13.3.0.253824, ccs 8.2.0, jasmine 2.3.0 --6ma, lima 2.11.0, one codec. IPD is deliberately excluded (too close to the accepted Sequel IPD family)."

