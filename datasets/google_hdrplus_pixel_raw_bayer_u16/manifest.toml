manifest_version = 1
dataset_id = "google_hdrplus_pixel_raw_bayer_u16"
name = "Google HDR+ Burst Dataset: Pixel/Pixel XL Raw Bayer CFA Frames (uint16)"
description = "29 complete as-captured raw Bayer (BGGR) sensor mosaics, 4048x3036 10-bit digital numbers stored as uint16, the first input frame (payload_N000.dng) of each burst from Google Pixel and Pixel XL phones in the CC BY-SA HDR+ burst photography dataset."
homepage = "https://hdrplusdata.org/dataset.html"

[license]
name = "Creative Commons Attribution-ShareAlike 4.0 International"
spdx = "CC-BY-SA-4.0"
url = "https://creativecommons.org/licenses/by-sa/4.0/"
citation = "Samuel W. Hasinoff, Dillon Sharlet, Ryan Geiss, Andrew Adams, Jonathan T. Barron, Florian Kainz, Jiawen Chen, and Marc Levoy. Burst photography for high dynamic range and low-light imaging on mobile cameras. ACM Transactions on Graphics (Proc. SIGGRAPH Asia), 35(6), 2016."
notes = "The bucket README (https://storage.googleapis.com/hdrplusdata/README.html) states: 'The dataset is released under a Creative Commons license (CC-BY-SA). This license is broad and largely unencumbered, however our main intention is that the dataset be used for scientific purposes.' The README links the license text to https://creativecommons.org/licenses/by-sa/4.0/. Attribution and the citation above are required; derivatives (including these decoded mosaics) inherit CC BY-SA 4.0. The 'scientific purposes' sentence is a statement of intent, not an added restriction."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official Google Research release in the anonymous public GCS bucket gs://hdrplusdata (not requester-pays). GPS tags were stripped by the publisher. The README notes that subjects include the authors' friends and family and asks that usage stay in good taste."
usage_notes = "Privacy screen: the 40 evenly spaced candidate bursts were reviewed by their dataset-provided gallery thumbnails; 11 bursts showing any real person (portraits, hikers, street/cafe scenes, background visitors) were excluded, leaving 29 people-free scenes (landscapes, architecture, objects, food, one museum photo of a 19th-century painting). The verdict for every reviewed burst is recorded in privacy_screen.tsv. Only the CFA pixel values are emitted; EXIF/DNG metadata other than the index fields is not copied."

[[origins]]
id = "hdrplusdata_gcs"
name = "HDR+ Burst Photography Dataset (Google Research), gs://hdrplusdata"
url = "https://storage.googleapis.com/hdrplusdata/README.html"
type = "bucket"
notes = "Anonymous GCS bucket. Full dataset 20171106/bursts/ (3640 bursts, 28461 frames, 765 GiB). Enumerated through the GCS JSON API with matchGlob=**/payload_N000.dng and pageToken pagination (discover.sh)."

[[resources]]
id = "pixel_n000_dng_selection"
origin = "hdrplusdata_gcs"
url = "https://storage.googleapis.com/hdrplusdata/20171106/bursts/"
