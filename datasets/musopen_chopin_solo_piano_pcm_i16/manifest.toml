manifest_version = 1
dataset_id = "musopen_chopin_solo_piano_pcm_i16"
name = "Musopen 'Set Chopin Free' Solo-Piano Preludes and Etudes, 16-bit 44.1 kHz Stereo PCM"
description = "The Prelude and Etude tracks of Musopen's CC0 'Set Chopin Free' Chopin recordings whose FLAC STREAMINFO is 44.1 kHz / stereo / 16-bit: 39 complete solo-piano pieces (the complete 24 Preludes Op. 28 plus Preludes B. 86, Op. 45 and 'no. 27' by Jeannette Fang; the complete 12 Etudes Op. 25 by Edward Neeman), about 77.6 minutes, one bit-exact decoded int16 interleaved-stereo sample per piece."
homepage = "https://archive.org/details/musopen-chopin-complete-works-flac"

[license]
name = "Creative Commons CC0 1.0 Universal Public Domain Dedication"
spdx = "CC0-1.0"
url = "https://creativecommons.org/publicdomain/zero/1.0/"
citation = "Musopen (musopen.org), 'The Complete Works of Frederic Chopin' / 'Set Chopin Free' Kickstarter project (2013-2015). Performers (from the FLAC tags): Jeannette Fang (Preludes), Edward Neeman (Etudes Op. 25)."
notes = "Evidence chain, all checked by download.sh: (1) the 2013 Kickstarter campaign page (pinned Wayback snapshot 20130908225009, sha256 365d9aec...) FAQ: 'What license will the music recordings be released under? Like all the previous music we released, we will be using Creative Common's CC0 dedication, a public domain dedication: http://creativecommons.org/publicdomain/zero/1.0/'; (2) Musopen's own first-party Internet Archive item musopen-chopin (uploader aaron@musopen.org, 2015) carries licenseurl CC0 1.0 and is the 'download for free' link of MusicBrainz release ab46c4ff-af73-4ed4-bbfb-665d6358b7ec, whose release group 45aa5c1a-a439-4104-9794-bcd87d5f7963 is the one written into the FLAC tags (LABEL=Musopen); (3) the bulk item musopen-chopin-complete-works-flac (third-party upload 2026, publisher Musopen) declares licenseurl CC0 1.0 and ships the Musopen booklet whose title page reads 'SET FREE BY MUSOPEN.ORG'; (4) Wikimedia Commons hosts the same Edward Neeman Op. 25 Etude recordings in Category:Set Chopin Free as public domain (PD-author Musopen). Caveat: the first-party item holds ALAC/MP3 encodings of an earlier, smaller edition (no Etudes; Preludes 7+8 and 19+20 combined, different edits), so the exact Jeannette Fang Prelude files are covered by the project-wide CC0 statement rather than by a per-file first-party page. The compositions are public domain (Chopin d. 1849)."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Studio/concert recordings commissioned by the non-profit Musopen for its crowd-funded Set Chopin Free project; Internet Archive copy (malware-checked by IA curation) with per-file md5 published in the item metadata."
usage_notes = "Public-domain classical piano audio; no voices or personal data. Keep the Musopen and performer credit as a courtesy."

