[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/icon_ivm_a_l27_ion_drift_velocity_f64/samples.jsonl"
summary = "Check the NASA CC0 license page, walk the HDF5 metadata of 120 pinned IVM-A L2-7 daily files over cached 16 KiB byte ranges, fetch one contiguous chunk span per ion-velocity component, inflate and byte-unshuffle every 512-value chunk, drop the NaN fill, and emit each (day, component) as one raw little-endian float64 sample; cross-check one complete file."
deterministic_notes = "sources.tsv pins 120 keys with size, multipart S3 ETag and LastModified (list SHA-256 enforced). Every file must carry Instrument=IVM-A, LogicalSource=ICON_L2-7_IVM-A, Logical_File_ID=ICON_L2-7_IVM-A_<date>_<version>, Project='NASA > ICON', Rules_of_Use='Public Data for Scientific Use', Time_Resolution='1 Second', Data_Version_Major=6, and the name and creation-order link indexes must agree. Each velocity variable must be H5T_IEEE_F64LE, rank 1 with 1-86,500 records (86,400 normally; 86,404 on 2019-11-22; the partial-day file 2021-09-03 has 5,600), equal across the three components, chunked <k> x f8 (k = 512 normally, 510 in the partial file) with filter pipeline shuffle(8)+deflate, Units m/s, Depend_0 Epoch, FillVal NaN, Valid_Min/Max -500/500, a complete 0..n-1 chunk grid with zero filter masks and a byte span at most 1.10 x the stored chunk bytes. Every Jenkins-lookup3 metadata checksum is verified (scripts/h5lite.py, pure stdlib). Samples are written in sources.tsv order to samples/<id>/<series>/<year>/icon_ivm_a_<date>_<version>_<component>.bin. build.sh and verify.sh run a synthetic self-test first (scripts/selftest.py); verify.sh re-derives every sample via the creation-order link index, one-shot inflate and byte-plane unshuffle, byte-compares, recomputes all index fields, rejects NaN/inf, constant, short (< 1,000), low-diversity (< 50% distinct) and duplicate samples, checks the four years 2019-2022 are present, decodes the whole control file independently and checks manifest totals."

[[series]]
id = "ivm_a_ion_drift_velocity_f64"
description = "ICON IVM-A ion drift velocity relative to corotation, one magnetic-coordinate component over one UTC day at 1 Hz."
semantic_meaning = "Bulk thermal-ion (mostly O+) drift velocity in m/s relative to Earth's corotation, measured in situ by the Ion Velocity Meter A (Retarding Potential Analyzer for the ram component, Drift Meter for the two cross-track components) on the ICON spacecraft (circular orbit, 27 degree inclination, about 590 km), rotated into a geomagnetic basis: zonal (perpendicular to B and to the magnetic meridian plane, positive east), meridional (perpendicular to B within the meridian plane, vertical at the magnetic equator, positive up) or field-aligned (along B). One sample is one component's finite values over one UTC day in stored record order; the three components share unit, instrument, cadence and fit process, and their day-to-day statistics overlap (daytime E x B drifts of tens of m/s, larger excursions near the terminators and at night when ion density is low)."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The NetCDF4 variables are stored as IEEE-754 little-endian float64 (Format 'f8'); after inflate and HDF5 byte-unshuffle the stored 8-byte patterns are copied unchanged. Values are full-precision float64 fit outputs (all values within a day distinct in the probes, none float32-exact), not widened integers or decimal-rounded readings."
source_resources = ["ivm_a_l27_pinned_days"]
source_format = "NetCDF4 (HDF5 superblock v2) ICON IVM-A Level-2.7 daily file, version 6, chunked shuffle+deflate float64 variables"
source_field = "ICON_L27_Ion_Velocity_Zonal, ICON_L27_Ion_Velocity_Meridional, ICON_L27_Ion_Velocity_Field_Aligned (each (Epoch,) float64, m/s)"
filtered_input_path = "filtered/icon_ivm_a_l27_ion_drift_velocity_f64/ingest_stats.json"
filtering = "120 pinned days x 3 components. Excluded as other quantities or duplicates of the same vector: ion density and temperature (other units), the instrument-frame Ion_Velocity_X/Y/Z, raw and original velocities, East/North/Up and equator- or footpoint-mapped velocities (linear re-projections of the same measurement), all flags and geolocation. IVM-B files are not listed. A (day, component) with fewer than 1,000 finite values would be skipped and recorded in ingest_stats.json."
missing_value_policy = "The variables' FillVal is NaN; NaN records (instrument off, low ion density, or values the IVM pipeline blanked) are dropped and the remaining finite values are kept in record order, so a sample is the day's valid values without gap markers (the drop count is recorded per sample in the index as nan_fill_dropped). +-inf is fatal (none expected). Values outside Valid_Min/Valid_Max (-500/500 m/s) are kept, not clipped (counted as outside_valid_range_kept). The quality flags ICON_L27_DM_Flag and ICON_L27_RPA_Flag (0 good, 1 caution, 2 photoemission-corrected / should be rejected, 3 should be rejected) are not applied and not emitted: they do not alter the stored values, and filtering on them is an analysis choice. No value is imputed, rescaled or reordered."
conversion = "Walk the HDF5 metadata (scripts/h5lite.py over cached 16 KiB blocks) to each variable's v1 chunk B-tree; read its chunks (169 x 512 values for a full day, edge chunk padded; the chunk length k comes from the layout message) from the cached contiguous span; zlib-inflate each to exactly 8k bytes, undo the HDF5 byte shuffle (byte plane j of k elements -> byte j of each element), concatenate, truncate to the dataset length, drop NaN, and write the native little-endian float64 bytes to one file per (day, component)."
numeric_kind = "float"
bit_width = 64
endianness = "little"
sample_format = "raw homogeneous little-endian float64 velocity time series"
sample_geometry = "daily_in_situ_time_series_1d"
sample_rank = 1
sample_axes = ["time_1hz_valid_records"]
natural_record_kind = "one_velocity_component_of_one_icon_ivm_a_l27_daily_file"
sample_count = 360
total_size_bytes = 223439232
output_path = "samples/icon_ivm_a_l27_ion_drift_velocity_f64/ivm_a_ion_drift_velocity_f64/"
