contains_personal_data = false
provenance_notes = "Official EarthScope (formerly IRIS DMC) FDSN dataselect and station web-service responses only; the FDSN network page and the USGS data-licensing page are fetched as license evidence."
usage_notes = "Historical seismometer digitizer counts; no people or personal information. Access caveat: EarthScope announced that user authentication will be required for all data downloads from 2026-12-15; this recipe uses anonymous access only."

