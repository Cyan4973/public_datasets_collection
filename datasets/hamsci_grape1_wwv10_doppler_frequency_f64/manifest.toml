[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/hamsci_grape1_wwv10_doppler_frequency_f64/samples.jsonl"
summary = "Fetch the 920 pinned G1 WWV10 station-day CSV.gz files from Zenodo record 6590283, classify each file by fixed whole-file rules, and emit the complete Freq column of every kept file as one little-endian float64 sample in file row order."
deterministic_notes = "sources.tsv (from discover.sh / scripts/grape_sources.py select) pins key, node, grid, file start time, size and md5 for all 920 files, ordered by node then start time, plus the expected keep/exclude status of each file. Whole-file exclusion rules, applied in scripts/grape_wwv10.py and re-derived independently in scripts/grape_wwv10_verify.py: header_mismatch (identity line or '#' block disagrees with the file name, receiver G1 or beacon WWV10, or the 'UTC,Freq,Vpk' header is missing), reference_not_gpsdo ('# Frequency Standard' does not name a GPSDO), malformed_row (a data row other than an unterminated final line is not 'YYYY-MM-DDTHH:MM:SSZ, <d+.ddd>, <token>'), time_order (a row timestamp steps backward, i.e. a clock reset after a receiver reboot, or a row lies off the file's UTC date; repeated seconds are allowed and counted as steps_0s), out_of_band (any |Freq - 10,000,000 Hz| > 100 Hz: a re-tuned receiver or another carrier), too_short (fewer than 3,600 rows, one hour at the nominal cadence), constant (fewer than two distinct values). Realized: 903 kept, 17 excluded - time_order 9 (backward jumps of 685-2,783 s landing on hh:17:15-style times; one also out_of_band), out_of_band 6 (two N0000029 files containing ~4,999,999.75 Hz WWV5 data, runs at +370 Hz / -684 Hz / +402 Hz in three files, plus 3 rows at ~20 MHz in the 2020-07-30 reboot file), too_short 4 (56, 1,759, 2,103 and 3,222 rows). Build fails if a realized status differs from the pinned one, if any of the six nodes has no kept file, if the median kept sample is below 1,000 values, or if primary bytes exceed 1 GB. Verify re-derives every status with a separate parser, checks each stored double formats ('%.3f') back to its exact source token, sha256, index min/max from stored doubles, every gap/step/deviation count in the index, no stray sample files, and manifest totals."

[[series]]
id = "grape1_wwv10_received_frequency_hz_f64"
description = "Grape V1 received-carrier-frequency time series of the WWV 10 MHz broadcast, one station-day per sample."
semantic_meaning = "Estimated received frequency, in Hz, of the WWV 10 MHz carrier (Fort Collins, CO) at one Grape V1 receiver, logged about once per second (UTC rows). The receiver and its estimator are disciplined by a GPS-disciplined oscillator, so departures from 10,000,000 Hz (typically within a few Hz) are dominated by ionospheric Doppler shift along the HF propagation path, plus estimator noise when the signal fades."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The source prints Freq with exactly three decimals in a fixed-width %12.3f field (e.g. '  9999999.762', ' 10000000.022'): 10-11 significant digits on a 1 mHz lattice. float32 spacing near 1e7 is 1 Hz, so float32 would erase the Doppler signal; float(token) gives the nearest binary64, which formats back to the exact source token. No offset removal, rescaling, resampling or interpolation."
source_resources = ["zenodo_record_metadata", "grape1_wwv10_station_day_files"]
source_format = "gzip-compressed Grape V1 frequency-estimation CSV, one station-day per file: '#,<start>,<node>,<grid>,...,G1,WWV10' identity line, '#' metadata block, 'UTC,Freq,Vpk' column header, CRLF data rows with space-padded fields"
source_field = "Freq column (estimated received carrier frequency in Hz, three decimals)"
filtered_input_path = "filtered/hamsci_grape1_wwv10_doppler_frequency_f64/file_classification.tsv"
filtering = "Only Grape Gen 1 (G1) files of beacon WWV10 (920 of 3,017 record files); whole files are excluded only by the pinned rules in processing.deterministic_notes (17 excluded, 903 kept: N0000007 280, N0000014 132, N0000015 110, N0000029 17, N00009 292, N00010 72), with per-file statistics in file_classification.tsv. Within a kept file every data row is emitted. The Vpk amplitude column is a different quantity and is not emitted."
missing_value_policy = "No values are imputed or padded. Rows are emitted as logged. Across kept samples, 73,139,962 steps are 1 s, 1,808,480 are 2 s (the logger skips ~2.4% of seconds), 17,477 are longer gaps (outages, partial days) and 53 repeat a second (two distinct measurements stamped with the same second; kept in order). Missing seconds (2,408,216 in total) are not filled; per-sample first/last row time, span, missing_seconds, 0/1/2/>2 s step counts and max step are recorded in the index. Any malformed or non-numeric Freq token (e.g. nan) in a data row would exclude the whole file (none occurred); an unterminated final line that does not parse as a complete row would be dropped and counted (none occurred). Out-of-band, backward-clock, too-short and constant files are excluded whole. In-band excursions during beacon fades are real estimator output and are kept: 993,480 values (1.3%) deviate by more than 5 Hz, 99.995% of them from node N00009 after 2021-01 (bounded within about -6..+10.4 Hz), and the index carries values_beyond_5hz/values_beyond_10hz per sample."
conversion = "gunzip, split lines, skip the identity line and '#' block, require the 'UTC,Freq,Vpk' header, match each row, parse the Freq token with float() to binary64, and write the values in file row order as raw little-endian float64, one file per kept station-day: samples/<id>/<series>/<node>/<source stem>.f64."
numeric_kind = "float"
bit_width = 64
endianness = "little"
sample_format = "raw homogeneous little-endian float64 array"
sample_geometry = "one_value_per_logged_utc_second_in_file_order"
sample_rank = 1
sample_axes = ["logged_utc_second"]
natural_record_kind = "grape_v1_station_day_wwv10_frequency_file"
sample_count = 903
total_size_bytes = 599735000
output_path = "samples/hamsci_grape1_wwv10_doppler_frequency_f64/grape1_wwv10_received_frequency_hz_f64/"
