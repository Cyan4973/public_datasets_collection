notes = "docs.cloudnet.fmi.fi, section 'License': 'Cloudnet data is licensed under a Creative Commons Attribution 4.0 international licence.' followed by the CC BY 4.0 human-readable summary (share, adapt, even commercially; give appropriate credit, link the licence, indicate changes). Retain the Cloudnet / ACTRIS / DWD Lindenberg attribution and per-file PIDs; samples are unmodified decoded beta_raw values (no changes beyond container decoding)."

