summary = "Stream the pinned institutions.tar.gz once with tarfile 'r|gz', keep only institutions/agg_10_minutes/<id>.csv members, locate the n_bytes and id_time columns by header name, and emit one little-endian uint64 n_bytes sample and one little-endian uint32 id_time auxiliary sample per institution."
deterministic_notes = "Member order in the tar stream is never assumed. identifiers.csv lists 283 ids (0..284 with gaps); every id has an agg_10_minutes member, 278 of which have data rows and become samples, while the 5 header-only members (institutions 148, 260, 267, 279, 283) are pinned in build and verify and emit nothing. Rows keep source order and id_time must be strictly increasing and inside the 40,298-window grid of times_10_minutes.csv. Index rows are sorted by series then institution id. verify.sh re-reads the archive with an independent csv-module parser, compares every sample byte, the index, manifest counts and the pinned per-institution counts, ranges and SHA-256 digests in expected_samples.tsv, and rejects constant series and sub-floor output."

[[series]]
id = "institution_n_bytes_u64"
description = "Bytes transmitted per 10-minute window by one CESNET3 institution, over 40 weeks."
semantic_meaning = "For each 10-minute window present in the source, the total number of bytes carried by all IP flows of one institution on the CESNET3 backbone (the n_bytes metric of CESNET-TimeSeries24), in window order."
role = "primary"
representation_class = "native_numeric"
representation_notes = "n_bytes is a native non-negative integer byte counter summed from IPFIX flow octet counters (unsigned 64-bit in IPFIX). Values are copied exactly from the decimal CSV field; only the encoding changes to little-endian uint64."
source_resources = ["institutions_archive", "times_archive", "zenodo_record_metadata"]
source_format = "CSV inside gzip-compressed tar (institutions/agg_10_minutes/<id_institution>.csv)"
source_field = "n_bytes column of the institution-level 10-minute aggregation CSV"
filtered_input_path = "filtered/cesnet_ts24_institution_traffic_bytes_u64/ingest_stats.json"
filtering = "Every institution in identifiers.csv whose agg_10_minutes CSV has data rows (278 of 283; the 10-minute files of institutions 148, 260, 267, 279 and 283 are header-only upstream even though their hourly and daily files have rows); every data row of each such CSV. Excluded: agg_1_hour and agg_1_day (re-aggregations of the same windows), institution_subnets and ip_addresses levels, and every other column (n_flows, n_packets, unique-destination counts, 2-decimal ratios and averages)."
missing_value_policy = "Windows with no row in the source CSV are not imputed: each sample holds only the present windows in id_time order, and the auxiliary id_time series records which windows they are (756,619 of 278 x 40,298 windows are absent, concentrated in small institutions). A header-only 10-minute CSV yields no sample; the set of such institutions is pinned (148, 260, 267, 279, 283) and any other header-only member is fatal. A present row with a blank, non-decimal-integer, signed, fractional, exponent-form or larger-than-uint64 n_bytes or id_time is fatal, as are wrong field counts, non-increasing id_time, id_time outside the 40,298-window grid, carriage returns and non-ASCII bytes. Zero byte counts are kept as real values. build.sh and verify.sh apply the same policy."
conversion = "Parse each n_bytes field as an exact decimal integer (no float round trip) and pack it as little-endian uint64. One sample per institution CSV, values in source row order."
numeric_kind = "uint"
bit_width = 64
endianness = "little"
sample_format = "raw homogeneous little-endian uint64 array"
sample_geometry = "institution_10_minute_traffic_time_series"
sample_rank = 1
sample_axes = ["present_10_minute_window"]
natural_record_kind = "institution_10_minute_aggregation_csv_time_series"
sample_count = 278
total_size_bytes = 83569800
output_path = "samples/cesnet_ts24_institution_traffic_bytes_u64/institution_n_bytes_u64/"

