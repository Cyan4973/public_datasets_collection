[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/umich_nclt_velodyne_hdl32e_xyz_u16/samples.jsonl"
summary = "Download the pinned 2013-01-10 NCLT Velodyne tarball, stream it without extraction, select every 5th velodyne_sync revolution file in utime order, and copy the x, y, z uint16 fields of every 8-byte hit record into one N x 3 little-endian uint16 sample per revolution."
deterministic_notes = "Selection: sort all velodyne_sync members by the utime in their file name and take ranks 0, 5, 10, ... (stride 5, i.e. one 0.1 s revolution per second of the 5 Hz image-synchronized stream). Selected revolutions with fewer than 1,000 hits are skipped and listed in filtered/.../build_stats.json; nothing is substituted. Validation: size + multipart ETag of the archive; gzip CRC32/ISIZE by reading to EOF; one velodyne_hits.bin of 2,771,041,792 bytes starting with the 4 x 0xAD9C packet magic; every sync member size is a multiple of 8 and every laser_id is 0..31 (download.sh); emitted codes must lie in the documented 0..40000 range and no sample or axis may be constant (build.sh and verify.sh). Index rows carry hit_count, sample_shape [N, 3], utime, sync_rank, source member, source and sample SHA-256, per-axis and overall min/max of the stored uint16 codes, and the count of z code 0 hits. verify.sh re-streams the archive, re-decodes the indexed members with independent code, re-derives the stride selection from its own member census, and checks inventory, hashes, stats and manifest totals. Realized: 5,120 sync files, stride 5, 1,024 selected, 0 skipped (the smallest sync file has 13,869 hits); 1,024 samples, 46,219,538 hits, 138,658,614 values, 277,317,228 bytes; hits per sample 13,869 to 178,951 (median 45,171; median 135,510 values); codes 1,959 to 37,120 (x 1,959-37,028, y 2,987-37,120, z 11,356-22,559); aggregate SHA-256 of samples in index order 735534d4e23b915f0431feb531cc07e1d5b1e864bfd1dc4da673cea9ebd5578a. Informational diagnostics (build_stats.json, index): max hits on one laser_id and azimuth wraps of that busiest laser; 10 samples (33 of 5,120 files) hold about three revolutions and 24 (135 files) show no wrap."

[[series]]
id = "nclt_velodyne_sync_xyz_u16"
description = "Cartesian x, y, z codes of every hit in one NCLT velodyne_sync Velodyne HDL-32E revolution, Segway body frame, 5 mm offset-binary uint16."
semantic_meaning = "Position of each laser return of one HDL-32E revolution (per the publisher, the 0.1 s preceding one Ladybug3 image; 33 of the 5,120 files hold about three revolutions), motion-compensated by the publisher for the Segway's egomotion and expressed in the Segway body frame (origin on the wheel axle, x forward, y right, z down), recorded on the University of Michigan North Campus on 2013-01-10. Metres = code x 0.005 - 100, so code 20000 is 0 m and the documented code range 0..40000 spans -100 m to +100 m."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The publisher stores each coordinate as a little-endian uint16 code on a 5 mm lattice offset by 100 m (nclt.pdf section 7.3; read_vel_sync.py converts with code * 0.005 - 100). The sample keeps those codes bit-exactly; no rescaling or rounding is done locally. Motion compensation and the body-frame transform were applied by the publisher before encoding, so this is the dataset's pinned per-revolution representation, not a local remap. The per-hit intensity (uint8) and laser_id (uint8) fields are dropped and not emitted."
source_resources = ["nclt_2013_01_10_vel_tar_gz"]
source_format = "NCLT velodyne_sync/<utime>.bin revolution file inside the gzip tar 2013-01-10_vel.tar.gz: packed 8-byte little-endian hit records (uint16 x, uint16 y, uint16 z, uint8 intensity, uint8 laser_id)"
source_field = "per-hit x, y, z uint16 coordinate codes (bytes 0..5 of each 8-byte hit record)"
filtered_input_path = "filtered/umich_nclt_velodyne_hdl32e_xyz_u16/build_stats.json"
filtering = "Session 2013-01-10 only (the smallest of the 27 NCLT Velodyne tarballs). Every 5th of the 5,120 velodyne_sync files in sorted utime order, starting with the first (1,024 selected, one per second of the 5 Hz stream); files with fewer than 1,000 hits would be skipped and reported, and none was (minimum 13,869 hits). All hits of each selected revolution are kept in source order. velodyne_hits.bin (the raw per-packet sensor-frame stream), intensity, laser_id, Hokuyo scans and other sessions are not used."
missing_value_policy = "The publisher omits laser shots with no return (the HDL-32E is mounted upside down, so many beams see sky), so hit counts vary per revolution. Hits that the sensor reported out of range are documented as set to (0, 0, 0) in the sensor frame before motion compensation, so after the body-frame transform they are not a fixed code; they are kept as published. Codes at the lattice floor would also be kept: the pre-download tail probe showed z code 0 on laser_id 15 and y codes 0 to 60 in unselected files near the end of the session, but no selected sample has any code below 1,959. Files holding more than one revolution (10 selected) and files without an azimuth wrap (24 selected) are kept as published. Nothing is filtered, clipped, or imputed. Fatal in build.sh and verify.sh: record framing not a multiple of 8 bytes, laser_id above 31, any code above 40000, a constant sample or axis, or a hash mismatch."
conversion = "Stream the gzip tar; for each selected velodyne_sync member read N = size / 8 hit records and copy bytes 0..5 (x, y, z uint16 little-endian) of every record into an N x 3 point-major little-endian uint16 array, in source hit order. One sample file per revolution, named <utime>.bin."
numeric_kind = "uint"
bit_width = 16
endianness = "little"
sample_format = "raw little-endian uint16 N x 3 point-coordinate code array (x, y, z interleaved per hit)"
sample_geometry = "lidar_point_cloud_points_by_xyz"
sample_rank = 2
sample_axes = ["hit", "xyz_component"]
natural_record_kind = "nclt_velodyne_sync_per_image_scan_file"
sample_count = 1024
total_size_bytes = 277317228
output_path = "samples/umich_nclt_velodyne_hdl32e_xyz_u16/nclt_velodyne_sync_xyz_u16/"
