[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/zenodo_livox_mid360_driving_reflectivity_u8/samples.jsonl"
summary = "Fetch the one pinned rosbag2 zip and extract its SQLite db3 with zipfile (the extract is temporary). Query every /livox/lidar PointCloud2 message in timestamp order, parse the CDR message honouring the fields array, and emit the float32 'intensity' field of every point as one uint8 sample per frame, in native scan order."
deterministic_notes = "Pinned single file (size 517,088,133, Zenodo MD5). Messages are ordered by bag timestamp, then row id. Samples are named <frame_index:04d>_<bag_timestamp_ns>.u8. Index rows carry the message id, bag and header timestamps, no-return point count, SHA-256, min/max, zero fraction and distinct count. build_stats.json adds per-frame no-return fraction, mode, retroreflective fraction and the overall histogram. verify.sh re-extracts the db3 and re-decodes every point independently with struct.iter_unpack('<3ffBBd'). It re-applies the policy and compares bytes exactly. It rejects constant frames and frames whose most common value exceeds 80%, and checks inventory (2,772), index fields and manifest totals. The extracted db3 (1.47 GB) is deleted by both build and verify."

[[series]]
id = "mid360_frame_reflectivity_u8"
description = "Per-point laser return reflectivity of one /livox/lidar frame from a Livox MID-360 non-repetitive-scan lidar on a driving platform."
semantic_meaning = "Calibrated reflectivity of each point slot of one MID-360 frame (about 0.1 s of rosette-pattern scanning: 4 laser lines fired together, so consecutive groups of 4 points are one firing), on the Livox 8-bit scale where 0-150 is diffuse reflection and 151-255 is retro-reflective. Point slots without a return carry x=y=z=0 and reflectivity 0. They are part of the native fixed-cadence frame and are kept in place."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The MID-360 reports reflectivity as one byte per point. livox_ros_driver2 stores it in the float32 PointCloud2 field 'intensity'. Build and verify assert that every value is exactly one of the float32 patterns of the integers 0..255 (finite, integral, in range, not -0.0), so the uint8 cast is lossless and restores the native width. Nothing is clamped, rescaled or filtered."
source_resources = ["rosbag2_zip"]
source_format = "rosbag2 SQLite storage (.db3), table messages, topic /livox/lidar: CDR-serialized sensor_msgs/msg/PointCloud2 (livox_ros_driver2 layout x,y,z,intensity float32, tag uint8, line uint8, timestamp float64; point_step 26)"
source_field = "PointCloud2 point field 'intensity' (FLOAT32, offset 12 within each 26-byte point)"
filtered_input_path = "filtered/zenodo_livox_mid360_driving_reflectivity_u8/build_stats.json"
filtering = "All 2,772 /livox/lidar messages of the recording are taken; the other topics (IMU, rosout) are ignored. Every point slot of every frame is kept in source order, and neither points nor frames are filtered by content."
missing_value_policy = "No-return point slots (x=y=z=0) carry reflectivity 0 and are kept as 0, the value the sensor driver emits. The no-return count per frame is recorded in the index and build_stats.json. Any intensity that is non-finite, non-integral, negative zero or outside 0..255 is fatal in build and verify. So are any deviation of the CDR layout (encapsulation, frame_id, height 1, point_step 26, intensity FLOAT32 at offset 12, data length) and a lidar message count other than 2,772."
conversion = "Extract the db3 member with zipfile (CRC-checked). Select messages JOIN topics WHERE name='/livox/lidar' ORDER BY timestamp, id. Parse the CDR-LE PointCloud2 with 4-byte alignment relative to the encapsulation header and read the fields array. Take the float32 at offset 12 + 26*i for i in 0..width-1 and write it as one unsigned byte, in point order. The result is one sample file per message."
numeric_kind = "uint"
bit_width = 8
endianness = "little"
sample_format = "raw uint8 per-point reflectivity vector"
sample_geometry = "lidar_point_cloud_points"
sample_rank = 1
sample_axes = ["point"]
natural_record_kind = "livox_mid360_pointcloud2_frame_message"
sample_count = 2772
total_size_bytes = 55440864
output_path = "samples/zenodo_livox_mid360_driving_reflectivity_u8/mid360_frame_reflectivity_u8/"
