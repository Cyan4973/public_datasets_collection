manifest_version = 1
dataset_id = "fermi_lat_weekly_photon_events_f32"
name = "Fermi LAT Weekly All-Sky Photon Events (P305): Energy, Sky Direction and Instrument Angles, Native Float32"
description = "Native float32 per-photon reconstructed energy (MeV), celestial direction (RA, DEC) and instrument-frame incidence angles (THETA, PHI) from the EVENTS tables of 18 Fermi Large Area Telescope weekly all-sky photon files (Pass 8 R3 SOURCE class, processing P305), one week per year from February 2009 to February 2026. One sample per week per field, in stored row order."
homepage = "https://fermi.gsfc.nasa.gov/ssc/data/access/lat/"

[license]
name = "NASA SMD Open Scientific Data Policy"
spdx = "LicenseRef-NASA-SMD-Open-Data"
url = "https://science.nasa.gov/researchers/science-data/science-information-policy/"
citation = "Fermi Large Area Telescope (Atwood et al. 2009, ApJ 697, 1071) weekly photon data, NASA HEASARC / Fermi Science Support Center. Preserve mission week numbers, the P305 processing label, mission/instrument attribution and HEASARC/FSSC acknowledgement."
notes = "Re-read 2026-10-08 from the collection environment. Fermi Science Support Center data policy (https://fermi.gsfc.nasa.gov/ssc/data/policy/, 'Last Updated: 28-Aug-2025'): 'Since the beginning of the second year of operations, all LAT science data has been released as early as possible, typically within a day or two of acquisition. The LAT public archive includes the science data acquired in the first year that was initially proprietary.' NASA SMD Scientific Information Policy: information produced from SMD-funded scientific research activities is to be made publicly available. NASA Images and Media Usage Guidelines: NASA content 'generally are not subject to copyright in the United States'. Same licensing basis as the accepted HEASARC recipes fermi_gbm_tte_nai_photon_arrival_times_f64, nasa_heasarc_batse_cont_counts_i16, nasa_heasarc_nicer_pi_i16 and nasa_heasarc_nicer_detector_u8. download.sh re-fetches the FSSC policy page as soft provenance and fails if a fetched copy no longer states the LAT open-release sentence."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official Fermi LAT weekly photon files (FITS, CREATOR 'FermiDataserver', ORIGIN FSSC) fetched anonymously from the HEASARC FTP-over-HTTPS archive."
usage_notes = "Samples contain only reconstructed gamma-ray photon energies and directions from a space telescope. No human-subject, personal or Earth-imaging content, and no NASA insignia or imagery. NASA's AI-applications conditions (Images and Media Usage Guidelines) apply: do not attribute AI output to NASA or imply NASA endorsement; NASA insignia must not be used in AI training."

