# Staging draft. Realized by build.sh on 2026-10-06: 88 complete snapshots x 3
# series = 264 samples, 477,382,536 primary bytes.
manifest_version = 1
dataset_id = "azure_vm2019_cpu_utilization_readings_f64"
name = "Azure Public Dataset V2 (2019) VM CPU Utilization 5-Minute Fleet Snapshots Float64"
description = "Per-VM CPU utilization (percent) over 5-minute intervals from the Microsoft Azure 2019 VM trace (AzurePublicDataset V2): the first 88 complete fleet snapshots (t = 0..26,100 s, from files 1-2 of 195). Each snapshot holds every VM reading that shares one timestamp (223,522-227,744 VMs, median 226,171.5); min, max and avg CPU are emitted as three native float64 series, one sample per snapshot, values in source row order (19,890,939 readings per series)."
homepage = "https://github.com/Azure/AzurePublicDataset/blob/master/AzurePublicDatasetV2.md"

[license]
name = "Creative Commons Attribution 4.0 International"
spdx = "CC-BY-4.0"
url = "https://github.com/Azure/AzurePublicDataset/blob/master/LICENSE"
evidence_url = "https://api.github.com/repos/Azure/AzurePublicDataset/license"
evidence_quote = "Repository root LICENSE is the CC BY 4.0 legal code ('Attribution 4.0 International ... Creative Commons Attribution 4.0 International Public License'); the GitHub license API reports spdx_id CC-BY-4.0. Code is separately under LICENSE-CODE (MIT). The same repository's AzureVMNoiseDataset2024.md states: 'The data is made available and licensed under a CC-BY Attribution License (https://github.com/Azure/AzurePublicDataset/blob/master/LICENSE).' The trace files are release assets of this repository (release dataset-v2, 'Dataset files migrated from Azure Blob Storage')."
citation = "Eli Cortez, Anand Bonde, Alexandre Muzio, Mark Russinovich, Marcus Fontoura, Ricardo Bianchini. Resource Central: Understanding and Predicting Workloads for Improved Resource Management in Large Cloud Platforms. SOSP 2017. https://www.microsoft.com/en-us/research/wp-content/uploads/2017/10/Resource-Central-SOSP17.pdf. Data: Microsoft Azure, AzurePublicDataset V2 (2019 VM trace), https://github.com/Azure/AzurePublicDataset."
notes = "The repository README asks users of either VM trace to cite the SOSP'17 Resource Central paper. download.sh re-fetches LICENSE on every run and fails if it is no longer the CC BY 4.0 text. The V2 page itself carries no separate license statement; the grant relied on is the repository-level LICENSE covering the repository's data."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official Microsoft Azure / Microsoft Research release assets on github.com/Azure/AzurePublicDataset (release dataset-v2; the legacy Azure Blob URLs redirect there). Sizes and sha256 digests pinned from the GitHub release API. No mirrors."
usage_notes = "Only the three CPU utilization columns are emitted. The encrypted VM id (an anonymized hash, already sanitized by the publisher) is dropped and not stored anywhere in the output. No subscription, deployment or customer information is used."

[[origins]]
id = "azure_public_dataset_v2"
name = "Microsoft Azure Public Dataset V2 (2019 VM trace), GitHub release dataset-v2"
url = "https://github.com/Azure/AzurePublicDataset/releases/tag/dataset-v2"
type = "repository"
version = "release dataset-v2 (id 333244254, published 2026-06-02; trace content is the 2019 V2 trace)"
notes = "30 consecutive days of 5-minute VM CPU readings from one Azure region: 2,695,548 VMs, 1,942,780,023 readings, as one timestamp-sorted row stream cut into 195 vm_cpu_readings gzip CSV files of exactly 10,000,000 rows each (except the last; 166,566,456,024 bytes). The cuts are by row count, so a file boundary can fall inside a snapshot. Only V2 (2019) is used; the 2017 V1 trace (125 files, a different sanitized subset) is never mixed in."

