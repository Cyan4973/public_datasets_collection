sample_index_path = "index/zenodo_astar_niti_sped_patterns_u8/samples.jsonl"
summary = "Range-fetch the IMGBLO header and every 16th scan row of the eight NiTi ASTAR blockfiles, validate and strip each frame's 6-byte prefix, and write each 144x144 uint8 diffraction pattern unchanged as its own sample."
deterministic_notes = "Fixed records, files, sizes, MD5s, header SHA-256s, row stride 16 (rows 0, 16, ... of each map; 92 rows), and per-row SHA-256 pins. download.sh checks 206 status, exact Content-Range and length for every range, the parsed header tuple (IMGBLO, magic 258, VBF offset 4096, DP offset, DP_SZ 144, NX, NY, DP offset + NX*NY*20742 == file size), and every frame prefix (u16 0x55AA, u32 index == row*NX + col). Samples are written in scan order Fig5, Fig6, Fig7, Fig8, FigS5, Fig9, Fig10, Fig11, then scan row, then scan column. verify.sh re-reads the headers by byte offset, byte-compares every sample with the pixel raster of its source frame, rejects constant patterns, patterns with fewer than 8 distinct values, and duplicate rates above 0.5%, and checks manifest totals. Row pins in row_sha256.tsv come from the first driver-run download (2026-10-06). Realized aggregate SHA-256 of all samples in index order: f6792033f01fb98b996caae1137f399c95f7996768066db827c102c35d95b974."

[[series]]
id = "sped_diffraction_pattern_u8"
description = "Raw 8-bit 144x144 precession electron diffraction spot patterns from the NanoMegas ASTAR camera, one per TEM probe position, from eight NiTi wire orientation maps."
semantic_meaning = "Camera intensity (8-bit digital number) at each pixel of the 144x144 ASTAR external-camera image of the TEM fluorescent screen, recorded while the 200 kV beam precesses (0.5-0.7 deg where noted) at one probe position of a 3-4 nm-step scan over a NiTi shape-memory wire lamella: sparse Bragg spots on a dark background with a saturated direct beam."
role = "primary"
representation_class = "native_numeric"
representation_notes = "A NanoMegas blockfile (.blo) holds a 4096-byte IMGBLO header, an NX*NY uint8 virtual bright-field image, then NX*NY diffraction frames in (NY, NX) raster order. Each frame is a 6-byte prefix (u16 0x55AA, u32 frame index) followed by 144*144 uint8 camera pixels, row-major. The prefix is validated and stripped; pixel values are emitted exactly as stored, with no rescaling, background subtraction, centring or binning. The virtual bright-field image is not emitted."
source_resources = ["fig5_blo", "fig6_blo", "fig7_blo", "fig8_blo", "figs5_blo", "fig9_blo", "fig10_blo", "fig11_blo"]
source_format = "NanoMegas ASTAR blockfile (.blo, IMGBLO header magic 258): per-scan-point precession diffraction frames in (NY, NX) raster order after the virtual bright-field image"
source_field = "diffraction-pattern raster (uint8 camera DN per 144x144 pixel)"
filtered_input_path = "filtered/zenodo_astar_niti_sped_patterns_u8/ingest_stats.json"
filtering = "The eight NiTi 144x144 blockfiles (Fig5, Fig6, Fig7, Fig8, Fig S5 of record 15183487; Fig9, Fig10, Fig11 of record 15183021); scan rows 0, 16, 32, ... of each map; every scan point of each kept row (14,781 of 226,341 patterns). Figure PNGs, .res ACOM index results, virtual bright-field images, and blockfiles from other deposits (TiO2, FeCr 512x512) are not used."
missing_value_policy = "uint8 camera frames have no missing-value sentinel. Every value is kept as stored, including 255 (saturated direct beam and strong reflections) and 0 (dark background in low-offset scans). A frame-prefix mismatch, a constant pattern, a pattern with fewer than 8 distinct values, a short row, a Content-Range or checksum mismatch, or byte-identical duplicates above 0.5% of patterns fail the recipe; nothing is dropped or imputed."
conversion = "For each downloaded scan row of NX frames, check each frame's u16 0x55AA marker and u32 index (row*NX + col), drop that 6-byte prefix, and write the following 20,736 pixel values unchanged as one 144x144 uint8 sample named <scan>_r<row>_c<col>.bin; byte order is irrelevant for 8-bit values."
numeric_kind = "uint"
bit_width = 8
endianness = "little"
sample_format = "raw homogeneous uint8 144x144 precession electron diffraction pattern, row-major"
sample_geometry = "electron_diffraction_detector_frame_2d"
sample_rank = 2
sample_axes = ["detector_row", "detector_col"]
natural_record_kind = "sped_scan_point_diffraction_pattern"
sample_count = 14781
total_size_bytes = 306498816
output_path = "samples/zenodo_astar_niti_sped_patterns_u8/sped_diffraction_pattern_u8/"
