filtering = "All rows of the C01:IMRPhenomXPHM table of each of the 33 BBH events. C01:Mixed (a 50/50 resampled union of the XPHM and SEOBNRv4PHM runs, duplicating XPHM draws), C01:SEOBNRv4PHM (RIFT, another code and waveform) and the three NSBH candidates (GW191219_163120, GW200105_162426, GW200115_042309; they only have XPHM:HighSpin/LowSpin runs with different spin priors) are excluded."
missing_value_policy = "The source has no missing values. Any non-finite value, constant column, row count below 1,000, value outside the loose physical bounds in scripts/gwtc3_pe.py, or mass_2_source > mass_1_source is fatal; nothing is dropped or imputed."
conversion = "Read the record table (rows x 8*members bytes), take the 8 bytes at the member's compound offset from every row, and write them in row order as little-endian float64, one file per (event, parameter)."
numeric_kind = "float"
bit_width = 64
endianness = "little"
sample_format = "raw little-endian float64, shape [N_draws]"
sample_geometry = "posterior_sample_column"
sample_rank = 1
sample_axes = ["posterior_draw"]
natural_record_kind = "gwtc3_event_xphm_posterior_parameter_column"
