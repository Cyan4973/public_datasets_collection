[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/csiro_parkes_uwl_search_mode_u8/samples.jsonl"
summary = "Refresh DAP presigned links, range-fetch the FITS headers and one mid-file SUBINT row from each of eight pinned ProxCen_S observations, validate PSRFITS cards and row auxiliary columns, then split each row's DATA cell (TDIM (3328,4,4096), channel fastest, then polarization, then time) into four raw uint8 planes of 4096 time samples x 3328 channels, one per polarization product."
deterministic_notes = "Selection rule (documented in discover.sh / scripts/select_sources.py): among the 39 ProxCen_S observations that have all 16 files inside one UWL collection, take indices round(i*38/7), i=0..7, in time order; use file _8 and row NAXIS2//2 = 112. All eight headers carry FRONTEND UWL, BACKEND Medusa, OBS_MODE SEARCH, SRC_NAME ProxCen_S, TRK_MODE TRACK, CAL_MODE OFF, OBSFREQ 2368, NBITS 8, SIGNINT 0, ZERO_OFF 127.5, NPOL 4, POL_TYPE AABBCRCI, NCHAN 3328, CHAN_BW 1 MHz, NSBLK 4096, TBIN 128 us, NAXIS1 54792232, NAXIS2 224, NSUBOFFS 1792. The DATA column offset (266,280 bytes) is computed from TFORM1..9 widths and must equal NAXIS1 minus the 54,525,952-byte DATA cell; the HDU layout must predict the DAP fileSize exactly. Pinned rows must have OFFS_SUB = (112 + 0.5) * TSUBINT, DAT_FREQ = 704.5 + k MHz, and all 3328 DAT_WTS nonzero. Output order and file names are deterministic; floors: 32 samples of 13,631,488 values each. Realized build: 32 samples, 436,207,616 bytes; SHA-256 over the concatenated raw 32-byte per-sample SHA-256 digests, sorted by sample_path (raw bytes, not hex strings), is 40fef49881f6b3188443e2e05f67e245d04c06daa2459cc67e9827db93d3ba25."

[[series]]
id = "parkes_uwl_search_aa_u8"
description = "AA (receptor A auto-power) plane of one Parkes UWL SEARCH-mode SUBINT row."
semantic_meaning = "Requantized detected power of receptor A (linear feed) per 1 MHz channel (704-4032 MHz) and per 128 us sample over one 0.524 s sub-integration while tracking Proxima Centauri; 8-bit unsigned code with ZERO_OFF 127.5, scaled per channel by the backend."
role = "primary"
representation_class = "native_numeric"
representation_notes = "PSRFITS SEARCH-mode DATA with NBITS 8 and SIGNINT 0 stores one unsigned byte per value; bytes are copied verbatim (no byte swapping, scaling, or offset). DAT_SCL/DAT_OFFS (outval = dataval*scl + offs) are not applied."
source_resources = ["p1018_proxcen_subint_rows"]
source_format = "PSRFITS (FITS binary table) SEARCH-mode SUBINT HDU, Medusa backend, 8-bit unsigned samples"
source_field = "SUBINT column DATA (TFORM '54525952B', TDIM '(3328,4,4096)'), polarization index 0 (AA) of POL_TYPE AABBCRCI"
filtered_input_path = "filtered/csiro_parkes_uwl_search_mode_u8/ingest_stats.json"
filtering = "One complete SUBINT row (row 112 of 224, file _8) from each of eight pinned ProxCen_S on-source observations; calibrator scans (1421-490_S, 1934-638_S), pulsar J1644-4559_S, reference (_R) and noise-diode (_ND_S, _ND_R) scans are excluded."
missing_value_policy = "No values are dropped, imputed, or masked. Pinned rows must have all 3328 channels with nonzero DAT_WTS (a zero-weight channel fails the recipe). Clipped code 255 values are genuine and kept; no pinned AA plane contains code 0. verify requires the combined 0/255 share to stay below 2% per plane."
conversion = "Bytes data[t*13312 + 0*3328 + c] for t in 0..4095, c in 0..3327 of the DATA cell are written in (t, c) order: a row-major 4096 x 3328 uint8 matrix per sample."
numeric_kind = "uint"
bit_width = 8
endianness = "little"
sample_format = "raw uint8 matrix, time-major, frequency channel fastest"
sample_geometry = "dynamic_spectrum_time_by_frequency_channel_2d"
sample_rank = 2
sample_axes = ["time_sample", "frequency_channel"]
natural_record_kind = "psrfits_search_subint_row_polarization_plane"
sample_count = 8
total_size_bytes = 109051904
output_path = "samples/csiro_parkes_uwl_search_mode_u8/parkes_uwl_search_aa_u8/"

