description = "Per-scan-point EBSD pattern-quality rasters, Band Contrast (BC) and Band Slope (BS), native 0-255 integers, one raster per map from the 10 legacy Oxford HKL CHANNEL5 .ctf exports of nakhlite thin sections in Zenodo record 5545821."
