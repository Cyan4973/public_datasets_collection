manifest_version = 1
dataset_id = "physionet_tpehg_ehg_i16"
name = "PhysioNet Term-Preterm EHG Database Unfiltered Electrohysterogram Int16"
description = "Native signed-int16 ADC codes of the three unfiltered bipolar abdominal electrohysterogram (uterine EMG) channels from all 300 recordings of the PhysioNet Term-Preterm EHG Database v1.0.1, one sample per channel per recording, split into two primary series by the two ADC code lattices present in the release (full 16-bit codes vs codes on a step-16 lattice)."
homepage = "https://physionet.org/content/tpehgdb/1.0.1/"

[license]
name = "Open Data Commons Attribution License v1.0"
spdx = "ODC-By-1.0"
url = "https://opendatacommons.org/licenses/by/1-0/"
citation = "Fele-Zorz, G., Kavsek, G., Novak-Antolic, Z., & Jager, F. (2008). A comparison of various linear and non-linear signal processing techniques to separate uterine EMG records of term and pre-term delivery groups. Medical & Biological Engineering & Computing, 46(9), 911-922. Term-Preterm EHG Database v1.0.1, PhysioNet, DOI 10.13026/C2FW2V. Standard PhysioNet citation: Pollard, T., Moody, B. E., Lehman, L., Gow, B., Fernandes, C., Xie, C., Johnson, A., Mark, R. G., & Heldt, T. (2026). PhysioNet as a global platform for biomedical research. Nature Health. DOI 10.1038/s44360-026-00096-z."
notes = "The project page (https://physionet.org/content/tpehgdb/1.0.1/) states 'Access Policy: Anyone can access the files, as long as they conform to the terms of the specified license. License: Open Data Commons Attribution License v1.0'. The 1.0.1 release ships no LICENSE file, so download.sh fetches the project page and fails unless it still names that license. Open access, no credentialing. Preserve the article, dataset DOI, and PhysioNet attribution."

[safety]
contains_sensitive_data = true
contains_personal_data = false
provenance_notes = "De-identified abdominal EHG recordings from 300 pregnancies (one per pregnancy) made 1997-2005 at the University Medical Centre Ljubljana and published by PhysioNet as an open-access project. Records are named only by a numeric record id. Header comments carry clinical fields (gestation, age, parity, abortions, weight, hypertension, diabetes, placental position, bleeding, funneling, smoking)."
usage_notes = "Treat as human health-related material. Emitted samples contain only the three unfiltered EHG ADC waveforms; no header comment, clinical field, term/preterm label, tpehgdb.smr summary, or .fvl feature table is emitted (the summary and feature files are not even downloaded). Index rows carry only record id, channel, signal geometry, the header sampling-frequency string, and value statistics."

