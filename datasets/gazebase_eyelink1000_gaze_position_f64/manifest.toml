summary = "Range-fetch 24 pinned per-subject zips from the GazeBase bulk archive, then decode every recording CSV (one subject x session x task) into one little-endian float64 array for x and one for y, NaN preserved in place."
deterministic_notes = "Subjects are the first 24 Round_1 entries of the outer central directory (1001-1024). Recordings are processed in sorted member-name order. Columns are located by header name. build.sh parses by line splitting and checks repr/Decimal round-trip; verify.sh re-parses with csv.DictReader and normalized-Decimal round-trip, re-derives every sample byte-for-byte, checks index fields (size, count, NaN count, finite min/max, sha256), the shared exclusion rule, non-constancy, at least 10 distinct values, that source decimals have at most 6 places, and manifest sample_count/total_size_bytes. Per-sample NaN fractions are in the index and filtered/<id>/ingest_stats.json."

[[series]]
id = "gaze_x_deg_f64"
description = "Horizontal left-eye gaze position, one array per GazeBase recording."
semantic_meaning = "Horizontal gaze angle of the left eye in degrees of visual angle relative to screen centre, sampled at 1 kHz by an EyeLink 1000 during one task (fixation, horizontal saccades, random saccades, reading, video 1, video 2, or the Balura game) of one session of one subject."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The source publishes x as decimal text with up to 6 fractional digits (e.g. -11.457567); values sit on the converted tracker lattice (0.1 px steps of the 1680x1050 px, 474x297 mm display viewed at 550 mm: about 0.0029 deg at screen centre, smaller with eccentricity). Over all 40,396,050 emitted finite x and y values, 641,515 (about 1.6%) cannot be reproduced from float32 (round(float32(v), 6) != v); all of them have |value| >= 16 deg, where the float32 ulp exceeds 1e-6 (3.3% of values lie in that range). Only 12,391 (about 0.03%) are exactly representable in float32. float64 is the narrowest IEEE width that reproduces every published decimal; each value is float(text) exactly as published."
source_resources = ["gazebase_round1_subjects_1001_1024"]
source_format = "CSV inside per-subject zip inside GazeBase_v2_0.zip (header n,x,y,val,dP,lab,xT,yT in task-dependent order)"
source_field = "x"
filtered_input_path = "filtered/gazebase_eyelink1000_gaze_position_f64/ingest_stats.json"
filtering = "All recording CSVs of subjects 1001-1024 (Round 1, sessions S1 and S2, all seven tasks). A recording is excluded for both axes only if either axis has fewer than 1,000 finite values or more than 50% NaN; exclusions are listed in ingest_stats.json. Columns n, val, dP, lab, xT, yT are not emitted."
missing_value_policy = "The literal token NaN (EyeLink track loss / blink rows, val = 4) is kept in place as the canonical quiet NaN 0x7FF8000000000000, preserving 1 kHz row alignment; no rows are dropped or imputed. Exact 0 is a genuine lattice value, not a sentinel. Any other non-numeric token, inf, malformed row, or non-round-tripping decimal is fatal. build.sh and verify.sh apply the identical rule."
conversion = "Parse each x token with float(), check that its shortest repr equals the source decimal, and pack all rows of the recording in source order as little-endian IEEE-754 float64 into samples/<id>/gaze_x_deg_f64/S_<subject>_S<session>_<TASK>.bin."
numeric_kind = "float"
bit_width = 64
endianness = "little"
sample_format = "raw homogeneous little-endian float64 gaze-angle time series"
sample_geometry = "eye_tracker_gaze_time_series_1d"
sample_rank = 1
sample_axes = ["time_1khz"]
natural_record_kind = "gazebase_eyelink_recording_one_subject_session_task"
sample_count = 335
total_size_bytes = 167782088
output_path = "samples/gazebase_eyelink1000_gaze_position_f64/gaze_x_deg_f64/"

