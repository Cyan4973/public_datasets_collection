notes = "files.tsv pins the sol directory, file name, sol number, byte size, PDS4-label MD5, table record count, header length and label start/stop time for each of the 28 files. download.sh and build.sh reject any size or MD5 mismatch. Selection, resolved by discover.sh and scripts/select_files.py: fetch the labels of all 496 ~87M ps_calib products and keep those whose table holds 887,000-888,500 records over 88,700-88,800 s (one Mars sol at 10 Hz) with the standard 9-field schema (all 496 qualify; records 887,702-887,780). Then take 28 at evenly spaced positions of the sol-ordered list (index round(i*495/27)). This rule was fixed before looking at any pressure values. Excluded: the other 468 full-sol 10 Hz files (download-cap headroom; ~100 MB primary is the downstream selection budget), partial-sol and 2 Hz/20 Hz ps_calib products (other cadence regimes), ps_calibevent products, data_raw, and the TWINS wind/temperature bundles."

