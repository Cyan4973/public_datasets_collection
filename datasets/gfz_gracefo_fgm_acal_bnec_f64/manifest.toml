[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/gfz_gracefo_fgm_acal_bnec_f64/samples.jsonl"
summary = "Fetch 64 pinned daily GRACE-FO ACAL_CORR v0201 CDFs, decode each with a pure-stdlib CDF v3 reader (whole-file GZIP, VXR chain, per-block GZIP CVVRs), and emit the complete B_NEC variable of each file as one row-major little-endian float64 [records, 3] sample (86,400 records, or 86,399 for the 4 files whose upstream record set omits one epoch)."
deterministic_notes = "Selection (scripts/select_days.py, documented by discover.sh): slot dates 2018-06-15 + 45k days up to 2026-08-31; GF1 on even slots, GF2 on odd slots, falling back to the other satellite on the same date; complete-day v0201 files only; months 2024-12, 2025-02, 2026-05 excluded; at most one satellite per date. Result: 64 of 67 slots (34 GF1, 30 GF2; 3 slots in excluded months skipped). Build runs a synthetic CDF self-test, then enforces file identity attributes, CDF_DOUBLE[3] layout, equal record counts across Timestamp/B_NEC/B_FGM/q_NEC_FGM/B_FLAG, every Timestamp on the exact 1 s CDF_EPOCH lattice of the file's UTC day (strictly increasing, first 00:00:00, last 23:59:59, at most 10 absent epochs; realized: 60 files complete, 4 files missing exactly one epoch), LABELS_BNEC = Bnorth/Beast/Bcentre, finite values, per-component nonconstancy, |B| within 5,000..80,000 nT, and distinct sample hashes. Verify re-decodes every source and byte-compares through a separate byte-swap path, checks index min/max against stored float64, manifest counts, and that B_NEC equals the conjugate-q_NEC_FGM rotation of B_FGM within 1e-6 nT on every 7th epoch. Build also requires all seven dB_* disturbance terms to be finite CDF_DOUBLE[3] arrays with the B_NEC record count, classifies each file as all-seven-identically-zero or all-seven-nonzero (a mixed state is fatal), records disturbance_terms_zero and disturbance_total_rms_nT per sample, and fails unless the zero class is exactly the pinned 17 dates 2022-11-21..2024-11-10 (47 nonzero); it also requires every component to have all-distinct values and zero float32-exact values. Verify re-classifies the terms from raw bytes, recomputes the RMS with exact summation (math.fsum) within 1e-3 nT, re-counts distinct and float32-exact values (via the low 29 mantissa bits), and re-checks the 17/47 split."

[[series]]
id = "gracefo_fgm_acal_corr_b_nec_f64"
description = "Daily GRACE-FO calibrated platform-magnetometer field vectors in the local North-East-Centre frame."
semantic_meaning = "Geomagnetic field vector in nT sampled at 1 Hz along the near-polar low Earth orbit (~490 km at launch, slowly decaying) by the active AOCS fluxgate magnetometer (FGM A) of one GRACE-FO satellite, as published by GFZ in ACAL_CORR v0201: aligned and vector-calibrated against a geomagnetic reference model and expressed in the local North, East, Centre (downward) frame. GFZ also publishes seven satellite-disturbance correction terms (dB_MTQ_FGM, dB_XI_FGM, dB_NY_FGM, dB_BT_FGM, dB_ST_FGM, dB_SA_FGM, dB_BAT_FGM: magnetorquers, non-linearities, temperature, solar array, battery). In 47 samples these are nonzero (RMS of their per-record sum 12.3..74.0 nT, median 29.8 nT, against a +/-50,000 nT signal). In the 17 samples dated 2022-11-21..2024-11-10 all seven are published as exactly 0.0 on every record, so no disturbance correction is present in those files; upstream (README, DOI page) does not document this. One sample is one complete UTC day of one satellite."
role = "primary"
representation_class = "native_numeric"
representation_notes = "Upstream B_NEC is CDF_DOUBLE (IEEE-754 binary64) in network byte order. Samples hold the identical binary64 values, byte-swapped to little-endian; no rounding or rescaling. Realized-sample evidence, enforced by build and re-checked by verify: in every sample each of the three components has all-distinct values (distinct count = record count), and none of the 16,588,788 stored values is exactly representable in float32 (index fields component_distinct_counts and float32_exact_values)."
source_resources = ["acal_corr_daily_selection"]
source_format = "NASA CDF v3 daily file, whole-file GZIP compressed, per-variable GZIP CVVR blocks, network encoding"
source_field = "zVariable B_NEC (CDF_DOUBLE, zDims [3], one record per 1 s epoch of the UTC day, UNITS nT, labels Bnorth/Beast/Bcentre)"
filtered_input_path = "filtered/gfz_gracefo_fgm_acal_bnec_f64/ingest_stats.json"
filtering = "Keep only the complete B_NEC variable of each of the 64 pinned files. Excluded: B_FGM (same measurement in the instrument frame), q_NEC_FGM, the dB_* disturbance-correction terms, Latitude/Longitude/Radius, B_FLAG (per-sample nonzero count recorded in the index), the label variables, and Timestamp (verified to lie on the lattice midnight + k seconds; the few absent epochs are listed per sample in the index field missing_epoch_seconds, so the time axis is fully recoverable without a timestamp series). The dB_* terms are read only to classify each file: index fields disturbance_terms_zero (all seven terms identically 0.0; 17 samples) and disturbance_total_rms_nT (RMS over records and components of the per-record sum of the seven terms, rounded to 1e-3; 0.0 for the 17, 12.269..74.042 nT for the other 47). No sample is dropped or re-selected on this basis."
missing_value_policy = "The upstream B_NEC FILLVAL is NaN. Shared by build and verify: every Timestamp must equal the file date's midnight + k*1000 ms with integer k, strictly increasing, first k = 0 and last k = 86399; at most 10 lattice epochs may be absent (upstream omits the record rather than filling it); every record listed in the VXR chain must be physically present (no sparse or padded records); every B_NEC value must be finite. The sample keeps exactly the records present, in order: no fill is inserted for absent epochs, which are listed per sample in index field missing_epoch_seconds (realized: 4 of 64 samples lack one epoch each, at seconds 2296, 15049, 51046 and 65891). Any NaN, infinity, off-lattice or duplicated epoch, or more than 10 absent epochs is fatal; nothing is dropped, imputed or reordered. B_FLAG is not used to remove values."
conversion = "Decompress the whole file (GZIP body at byte 40 after the CCR header, prepend the uncompressed magic), parse CDR/GDR/zVDR/ADR chains, follow B_NEC's VXR chain (VXRnext links and nested VXRs) to its CVVR blocks (each a separate GZIP stream; currently 4 blocks of 21,600 records), concatenate records in order, unpack as big-endian float64 and repack as little-endian float64. Output layout is row-major [records, 3]: for each present 1 s epoch the interleaved triple (B_N, B_E, B_C)."
numeric_kind = "float"
bit_width = 64
endianness = "little"
sample_format = "raw homogeneous little-endian float64 array, row-major [records, 3] (records = 86,400 minus absent epochs), interleaved (B_N, B_E, B_C) per epoch"
sample_geometry = "satellite_daily_vector_time_series_2d"
sample_rank = 2
sample_axes = ["utc_second_of_day", "nec_component"]
natural_record_kind = "gracefo_fgm_acal_corr_daily_satellite_file_b_nec_array"
sample_count = 64
total_size_bytes = 132710304
output_path = "samples/gfz_gracefo_fgm_acal_bnec_f64/gracefo_fgm_acal_corr_b_nec_f64/"
