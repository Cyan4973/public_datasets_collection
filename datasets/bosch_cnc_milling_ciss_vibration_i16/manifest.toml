contains_personal_data = false
provenance_notes = "Official publisher repository (boschresearch on GitHub), fetched anonymously from raw.githubusercontent.com at a pinned commit; every file is matched to its git blob SHA-1 in the commit tree. Content is machine vibration only: no people, locations, or personal identifiers."
usage_notes = "Industrial machine-monitoring sensor data published for research benchmarking; emitted unchanged as integer acceleration readings for numeric compression research."

