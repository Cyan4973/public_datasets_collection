[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/figshare_fukuchi_marker_trajectories_f32/samples.jsonl"
summary = "Validate the pinned C3D archive, deinterleave each unique walking trial's point records, and emit independent native little-endian float32 frame-by-marker matrices for the X, Y, and Z coordinate fields."
deterministic_notes = "Article identity/license, archive size/MD5, every ZIP member and CRC, C3D processor and native-float storage, point geometry, marker schemas and rates, missing-point status words, exact duplicate selection, output distributions, hashes, and aggregate totals are enforced. Verification independently reparses the archive and compares source-derived hashes with all outputs."

[[series]]
id = "walking_marker_x_f32"
description = "Walking-trial anatomical-marker X-coordinate matrices."
semantic_meaning = "Lateral anatomical-marker positions in millimetres over each complete overground or treadmill walking trial."
role = "primary"
representation_class = "native_numeric"
representation_notes = "Negative POINT:SCALE selects native float32 C3D point records. The X word of every frame/marker tuple is retained with its original little-endian IEEE-754 bits."
source_resources = ["original_c3d_archive"]
source_format = "Intel little-endian floating-storage C3D"
source_field = "POINT data component X"
filtered_input_path = "filtered/figshare_fukuchi_marker_trajectories_f32/ingest_stats.json"
filtering = "Retain each unique dynamic walking trial and deinterleave the X coordinate into a frame-by-marker matrix. Exclude 50 static calibration members, three later exact duplicate point payloads, point status/residual words, analog channels, and metadata."
missing_value_policy = "The source represents unavailable marker coordinates as exact 0.0 values aligned with a nonzero point-status word. Preserve those coordinate zeros without imputation. Non-finite values, changed schemas, unexpected missingness encoding, duplicate outputs, or degenerate trials fail."
conversion = "Copy every native little-endian X float32 word from source point tuples into row-major frame/marker order. No numeric conversion, scaling, interpolation, coordinate transformation, or cross-axis interleaving is performed."
numeric_kind = "float"
bit_width = 32
endianness = "little"
sample_format = "raw homogeneous little-endian float32 C3D marker-coordinate matrix"
sample_geometry = "walking_trial_marker_coordinate_matrix_2d"
sample_rank = 2
sample_axes = ["point_frame", "anatomical_marker"]
natural_record_kind = "complete_walking_trial_marker_coordinate_axis"
sample_count = 1966
total_size_bytes = 192118272
output_path = "samples/figshare_fukuchi_marker_trajectories_f32/walking_marker_x_f32/"

