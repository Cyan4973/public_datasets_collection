sample_index_path = "index/zenodo_nakhlite_ebsd_band_contrast_slope_u8/samples.jsonl"
summary = "Download the 10 pinned CHANNEL5 .ctf EBSD maps whole, stream-parse each one, and write its BC and BS columns as two YCells x XCells uint8 rasters in raster order."
deterministic_notes = "Fixed record, 10 files, sizes and md5s (maps.tsv), and grids/steps from each header. download.sh rejects files whose size, md5, first line ('Channel Text File'), Author tag (must be empty), Device (0), KV (20), TiltAngle (70), JobMode (Grid), XCells/YCells/XStep/YStep (pinned) or last-row grid position do not match, or that lack exactly one Phase/X/Y/BC/BS column. build.sh locates X, Y, BC, BS by name from the column line, places each data row at grid cell (round(Y/YStep), round(X/XStep)), and fails on off-lattice coordinates, duplicate or missing cells, row count != XCells*YCells, a wrong field count, or any BC/BS that is not a decimal integer in 0..255 (no clamping). verify.sh re-checks md5s, re-derives both rasters with an independent parser, byte-compares every sample, checks index fields and sha256s, rejects samples with fewer than 16 distinct values or a zero share above 0.8, prints the zero (unindexed) share per sample, and checks manifest totals."

[[series]]
id = "ebsd_band_contrast_u8"
description = "EBSD Band Contrast (BC), 0-255 per scan point, one raster per CHANNEL5 nakhlite map."
semantic_meaning = "Kikuchi pattern quality at each SEM beam position: the CHANNEL5 Band Contrast, an 8-bit measure of the average Hough-transform peak intensity of the detected Kikuchi bands relative to the overall pattern intensity. High over well-crystallised, well-polished grains, low at grain boundaries, cracks, fine-grained mesostasis and epoxy; 0 where no pattern was solved. 20 kV, 70 deg tilt, 2.5-15 um step."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The CHANNEL5 indexer stores Band Contrast as an integer 0..255 per scan point; the .ctf writes it as a decimal integer column. Values are emitted exactly as stored, reordered only from file row order to raster order (identical for these files, which are already written x-fastest)."
source_resources = ["ctf_nwa998_ug1", "ctf_y749_72a", "ctf_nwa998_t1", "ctf_y802_36a", "ctf_y593_127a", "ctf_gv_bm1975m16p19783", "ctf_mil_090136_50", "ctf_y593_106a", "ctf_lafayette_usnm1505_5_lam", "ctf_y749_64a"]
source_format = "Oxford HKL CHANNEL5 .ctf (Channel Text File): tab-separated header plus one row per grid scan point with columns Phase X Y Bands Error Euler1 Euler2 Euler3 MAD BC BS"
source_field = "BC (Band Contrast, integer 0..255)"
filtered_input_path = "filtered/zenodo_nakhlite_ebsd_band_contrast_slope_u8/ingest_stats.json"
filtering = "All scan points of the 10 legacy CHANNEL5 maps (Device 0, empty Author): NWA 998 (UG1, T1), Y000749 (64A, 72A), Y000593 (106A, 127A), Y000802 (36A), Governador Valadares BM1975,M16,P19783, MIL 090136 (50) and Lafayette USNM 1505-5. No pixel is dropped; AZtec Device 1 maps, NWA 817 and Caleta El Cobre are excluded as different acquisition regimes."
missing_value_policy = "No sentinel is substituted. Non-indexed or off-sample points carry BC=0 in the source and are kept as 0 (zero share per sample is reported by verify.sh; realized per-map zero share 1.3% (GV) to 19.7% (NWA998_T1), 10.5% for MIL 090136; the BC and BS zero masks are identical pixel for pixel; exact per-map shares are in the verify log). Malformed rows, values outside 0..255, non-integer values, duplicate or missing grid cells, or a row count different from XCells*YCells are fatal; nothing is clamped, imputed or dropped."
conversion = "Stream each .ctf line by line; take XCells, YCells, XStep, YStep from the header and the BC column position by name from the column line; for each row write int(BC) into byte (round(Y/YStep)*XCells + round(X/XStep)) of a YCells*XCells uint8 buffer; emit the buffer as samples/<id>/ebsd_band_contrast_u8/<map_id>.bin (row-major, scan x fastest, single bytes so byte order is moot)."
numeric_kind = "uint"
bit_width = 8
endianness = "little"
sample_format = "raw homogeneous uint8 2-D EBSD map raster, row-major (YCells x XCells)"
sample_geometry = "ebsd_scan_grid_raster_2d"
sample_rank = 2
sample_axes = ["scan_y", "scan_x"]
natural_record_kind = "ebsd_map_scan_grid"
sample_count = 10
total_size_bytes = 30822116
output_path = "samples/zenodo_nakhlite_ebsd_band_contrast_slope_u8/ebsd_band_contrast_u8/"

