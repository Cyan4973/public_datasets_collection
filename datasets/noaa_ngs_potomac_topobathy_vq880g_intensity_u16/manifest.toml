verify_script = "verify.sh"
sample_index_path = "index/noaa_ngs_potomac_topobathy_vq880g_intensity_u16/samples.jsonl"
summary = "Download 48 pinned COPC tiles of NOAA project 8727, decode every LASzip chunk with tools/laz/laszip.py, and copy each PDRF-7 record's Intensity (bytes 12-13) unchanged into one little-endian uint16 array per tile."
deterministic_notes = "Tile list pinned in sources.tsv (delivery, key, size, ETag, LastModified, URL, header point count), resolved by discover.sh from the 2026-10-08 S3 listing. download.sh validates size, ETag, LAS 1.4 / PDRF 7 / 36-byte records and point count, and records SHA-256. build.sh is local-only and multiprocess (JOBS env, default min(16, cpus)); it checks decoded point count, the 15 points-by-return counts and X/Y/Z bounds against each header, rejects samples with < 64 distinct values or one value > 50 %, preserves stored point order and values, and writes ingest_stats.json (per-tile histograms summary, shares of 0 and 65535, scanner-channel and flight-line counts). verify.sh re-decodes every tile, re-extracts Intensity with a different code path (struct per record), byte-compares every sample, and checks index fields, sha256/min/max, stray files, floors, cap and manifest totals."

[[series]]
id = "potomac_topobathy_intensity_u16"
description = "LAS Intensity of every point of one 500 m x 500 m topobathy tile, in stored COPC order."
semantic_meaning = "Return-pulse intensity (uint16 counts as recorded by the Riegl VQ-880-G and written by QSI RiProcess) of each lidar point; green (532 nm) bathymetric returns and NIR water-surface/topographic returns of the same instrument are interleaved as delivered."
role = "primary"
representation_class = "native_numeric"
representation_notes = "LAS 1.4 point data record format 7 stores Intensity as an unsigned 16-bit little-endian integer at record offset 12; values span the full 0..65535 range (65535 = saturation). The bytes are copied unchanged. The scanner-channel bits (byte 15, bits 4-5) are 0 for every probed point, so green and NIR returns cannot be separated from stored fields; the interleaved stream is the native file content."
source_resources = ["potomac_topobathy_copc_tiles"]
source_format = "COPC LAZ (LAS 1.4 point data record format 7, LASzip compressor 3)"
source_field = "Intensity"
filtered_input_path = "filtered/noaa_ngs_potomac_topobathy_vq880g_intensity_u16/ingest_stats.json"
filtering = "All point records of the 48 pinned tiles; no class, return, flag or value filtering. RGB (all zero in this project) and every other field are not emitted."
missing_value_policy = "Intensity is a required PDRF-7 field; no sentinel exists. Values 0 and 65535 are native readings and are kept. A decode error, point-count, points-by-return or bounds mismatch fails the build; no tile is skipped."
conversion = "laszip.iter_chunks decodes each tile's chunks into 36-byte LAS records; bytes 12 and 13 of every record are concatenated in stored order into a raw little-endian uint16 array, one .bin per tile named <delivery>__<tile>.bin."
numeric_kind = "uint"
bit_width = 16
endianness = "little"
sample_format = "raw homogeneous uint16 LAS intensity array"
sample_geometry = "las_point_attribute_stream"
sample_rank = 1
sample_axes = ["point"]
natural_record_kind = "copc_lidar_tile"
sample_count = 48
total_size_bytes = 306796952
output_path = "samples/noaa_ngs_potomac_topobathy_vq880g_intensity_u16/potomac_topobathy_intensity_u16/"
