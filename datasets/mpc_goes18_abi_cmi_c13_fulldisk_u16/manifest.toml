notes = "Each COG is a classic little-endian TIFF: primary IFD 5424x5424, BitsPerSample 16, SampleFormat 1, Deflate, Predictor 1, 512x512 tiles (11x11 = 121), GDAL_NODATA 65535, plus four overview IFDs that are ignored. GDAL metadata carries the source NetCDF name (NC_GLOBAL#dataset_name), NETCDF_VARNAME CMI_C13, scale_factor 0.06145332, add_offset 89.620003, units K, valid_range {0,4095}, sensor_band_bit_depth 12. Per-file integrity is the Azure Content-MD5 (base64 MD5) plus exact size; sha256 of the decoded rasters is recorded in the sample index."

