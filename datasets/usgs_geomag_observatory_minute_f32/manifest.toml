summary = "Fetch month-bounded USGS variation JSON, validate exact one-minute timestamp grids and X/Y/Z component arrays, then emit one little-endian float32 station/component/year sample."
deterministic_notes = "Station set, year, product type, sampling period, components, monthly boundaries, missing-value rule, and float32 conversion are fixed. Download inventory hashes pin the realized API responses."

[[series]]
id = "usgs_geomag_xyz_minute_f32"
description = "Calendar-year minute geomagnetic X, Y, or Z component at one USGS observatory."
semantic_meaning = "Ground magnetic-field component in nanoteslas over time, sampled once per minute by a fixed USGS geomagnetic observatory."
role = "primary"
representation_class = "derived_operational_numeric"
representation_notes = "The official API publishes decimal JSON measurements with 0.01-nT digital sampling metadata. Retained values are deterministically rounded once to IEEE-754 float32, whose resolution remains finer than 0.01 nT over the observed range."
source_resources = ["geomag_2024_monthly_json"]
source_format = "USGS Geomagnetism Web Services Timeseries JSON"
source_field = "values entries with id X, Y, or Z from the variation product"
