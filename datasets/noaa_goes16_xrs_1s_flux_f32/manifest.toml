[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/noaa_goes16_xrs_1s_flux_f32/samples.jsonl"
summary = "Download the 196 pinned daily XRS 1-s science files, decode xrsa_flux and xrsb_flux with a pure-stdlib HDF5 reader (shuffle + deflate, single chunk, v1 chunk B-tree), and write each day's 86,400 stored float32 values unchanged as one raw little-endian sample per channel."
deterministic_notes = "Inventory files.tsv fixes the 196 dates, filenames and byte sizes. The HDF5 reader (scripts/h5lite.py, copied unchanged from datasets/noaa_cdr_seaice_conc_nh_daily_u8) verifies the lookup3 checksum of every metadata block it touches. Variables are selected by link name; build resolves them through the name-index v2 B-tree, verify independently through the creation-order v2 B-tree with its own un-shuffle and bit-pattern missing-value classification, and byte-compares every sample. Per file: superblock v2; datatype message exactly little-endian IEEE float32 (11201f00...177f000000); dataspace (86400,); filter pipeline exactly [shuffle(4), deflate]; one chunk (86400) with filter mask 0 that inflates to exactly 345,600 bytes and ends the zlib stream; variable attributes units 'W/m2', long_name 'Primary XRS-A/B channel flux.', _FillValue -9999.0; global id = filename, platform g16, title, institution, license, time_coverage_resolution PT1S, time_coverage_start = filename date; the float64 time variable must be strictly increasing and lie within the UTC day (+-2 s). Day policy: a day is dropped (both channels) if either channel is more than 50% fill/NaN or has fewer than 100 distinct valid values; dropped days are listed in filtered/.../ingest_stats.json and re-derived by verify. Samples sorted by series then date. A synthetic HDF5 self-test (scripts/selftest_xrs.py) runs before build and verify. Realized: 196 inventory days, 2 dropped (2017-05-01 and 2017-12-01: both channels 100% fill, GOES-16 post-launch commissioning outages), 194 days kept; maximum kept-day fill fraction 7.4% (2024-09-15, 6,379 fill records). Floors: 388 samples of 86,400 values (median 86,400); 33,523,200 primary values."

[[series]]
id = "goes16_xrsa_flux_1s_f32"
description = "GOES-16 XRS-A (0.05-0.4 nm) primary-channel whole-Sun soft X-ray flux, 1 s cadence, one UTC day per sample."
semantic_meaning = "Science-quality Level-2 solar soft X-ray irradiance in W/m^2 in the short-wavelength XRS-A band, one value per 1-s record (86,400 per UTC day). xrsa_flux is the product's primary XRS-A channel: XRS-A1 normally, switching to the high-flux XRS-A2 diode during large flares (xrsa_primary_chan, not emitted). Values are as measured at the spacecraft (the file's au_factor variable, not applied, converts to 1 AU). Values near the instrument noise floor (quiet Sun, eclipse periods) can be slightly negative (probed minimum about -2e-8 W/m^2); they are kept as published."
role = "primary"
representation_class = "native_numeric"
representation_notes = "xrsa_flux is stored in the NetCDF4 file as IEEE float32 (HDF5 floating-point class, size 4, little-endian). The recipe inflates and un-shuffles the single chunk and writes the stored 32-bit words unchanged; no scaling, interpolation, masking or remapping."
source_resources = ["xrs_flx1s_daily_netcdf"]
source_format = "NetCDF4/HDF5 daily file (sci_xrsf-l2-flx1s v2-2-1), variable stored as one shuffle+deflate chunk indexed by a version-1 B-tree"
source_field = "xrsa_flux (float32, dims time=86400, units W/m2, _FillValue -9999)"
filtered_input_path = "filtered/noaa_goes16_xrs_1s_flux_f32/ingest_stats.json"
filtering = "Keep only xrsa_flux from each of the 196 inventory days. Records flagged in xrsa_flags (eclipse, particle_spike, calibration, off_point, ...) are kept with their stored flux values, exactly as published; flags are not emitted. Days failing the day policy (more than 50% fill/NaN in either channel, or fewer than 100 distinct valid values) are dropped for both channels (realized: 2017-05-01 and 2017-12-01, both 100% fill)."
missing_value_policy = "The product's own _FillValue -9999.0 (missing records, e.g. around data gaps) is preserved in place as the stored float32 word 0xC61C3C00, and any NaN would be preserved bit-exactly; probed days hold 0-481 fill values (2024-05-10: 481) and no NaN. Per-sample fill_count and nan_count are recorded in the index. Infinite values, a wrong datatype/shape/filter/attribute/date, a non-monotonic or out-of-day time axis, a checksum failure or a chunk that does not inflate to exactly 86,400 values are fatal in build and verify. Fill-dominated days (>50%) are dropped as described in filtering; verify re-applies the same rule from its own decode."
conversion = "Resolve root link 'xrsa_flux' (dense link storage: Link Info -> fractal heap -> v2 B-tree), read Dataspace (86400), Datatype float32 LE, Filter Pipeline [shuffle element size 4, deflate] and Layout v3 chunked (86400, 4); take the single chunk from the version-1 B-tree leaf (offsets 0,0; filter mask 0), zlib-inflate to exactly 86,400 x 4 B, invert the 4-lane byte shuffle and write the 86,400 little-endian float32 values in record order to samples/.../goes16_xrsa_flux_1s_f32/YYYYMMDD.f32."
numeric_kind = "float"
bit_width = 32
endianness = "little"
sample_format = "raw homogeneous float32 time series"
sample_geometry = "one_utc_day_of_1s_records"
sample_rank = 1
sample_axes = ["time"]
natural_record_kind = "goes16_xrs_l2_flx1s_science_daily_file_variable"
sample_count = 194
total_size_bytes = 67046400
output_path = "samples/noaa_goes16_xrs_1s_flux_f32/goes16_xrsa_flux_1s_f32/"

