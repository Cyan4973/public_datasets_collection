[[resources]]
id = "phase1_laz_tile_selection"
origin = "srsp_open_data_s3"
url = "https://srsp-open-data.s3.eu-west-2.amazonaws.com/lidar/phase-1/laz/27700/gridded/"
type = "file"
version = "88 tiles pinned in scripts/tiles.tsv (key, size, S3 ETag, sha256, point count), selected 2026-10-08 by scripts/discover.py; sha256 pinned from the first verified download"
access = "Anonymous HTTPS GET of each pinned key; resumable curl."
size_bytes = 433958092
sha256 = ""
local_path = "downloads/srsp_scotland_phase1_lidar_scan_angle_i8/laz/"
notes = "Selection: 128 candidates evenly spaced over the sorted key list; a candidate is kept when a range-read decode of its first 50,000-point chunk shows a non-constant scan angle. 40 candidates (all of HY, NH, NJ, NK and western NN, plus NR8188 and four northern NO tiles) were dropped because those collection areas were delivered with the scan angle byte zeroed in every point. Per-tile sha256 is pinned in scripts/tiles.tsv and enforced by download.sh; a single aggregate sha256 does not apply to an 88-file selection. Realized: 88 tiles, scan angle range -29..+29 degrees, per-tile span 15..58 (median 50), overall zero share 2.0%, largest single-value share in any tile 15.5%."

