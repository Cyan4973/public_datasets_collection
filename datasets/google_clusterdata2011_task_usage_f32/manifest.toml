# Staging draft. Realized by build.sh on 2026-10-08 (repair 1): 83 complete
# windows x 2 series = 166 samples, 83,802,628 primary bytes (12,210,234 rows
# read). The CPU-rate series was removed as a widened half-precision code.
manifest_version = 1
dataset_id = "google_clusterdata2011_task_usage_f32"
name = "Google Borg Cluster Trace 2011 (clusterdata-2011-2) Task Usage 5-Minute Cluster Windows: Cycles and Memory Accesses per Instruction, Float32"
description = "Per-task resource-usage measurements from the Google Borg cell trace clusterdata-2011-2 (May 2011, ~12.5k machines): the first 83 complete 5-minute measurement windows of the trace (window starts 600..25,200 s, from task_usage parts 0-4 of 500). Each window holds every task_usage row whose measurement period starts in it; the hardware-counter measures cycles per instruction (CPI) and memory accesses per instruction (MAI) are emitted as two float32 series, one sample per window, values in source row order, empty fields dropped and counted. CPU rate is deliberately not emitted (a widened half-precision source code)."
homepage = "https://github.com/google/cluster-data/blob/master/ClusterData2011_2.md"

[license]
name = "Creative Commons Attribution 4.0 International"
spdx = "CC-BY-4.0"
url = "https://creativecommons.org/licenses/by/4.0/"
evidence_url = "https://github.com/google/cluster-data/blob/master/ClusterData2011_2.md"
evidence_quote = "The data and trace documentation are made available under the [CC-BY](https://creativecommons.org/licenses/by/4.0/) license. By downloading it or using them, you agree to the terms of this license. (ClusterData2011_2.md, the official page for the clusterdata-2011-2 trace, which also states: 'The trace is stored in Google Storage for Developers in the bucket called clusterdata-2011-2.')"
citation = "Charles Reiss, John Wilkes, Joseph L. Hellerstein. Google cluster-usage traces: format + schema. Google Inc., version 2.1, 2011/2014. Data: Google clusterdata-2011-2, https://github.com/google/cluster-data."
notes = "download.sh re-fetches ClusterData2011_2.md on every run and fails unless it still states the CC-BY 4.0 grant for the clusterdata-2011-2 bucket. The page asks users to join a mailing list; that is a request, not an access condition: the bucket is public and anonymous."

[safety]
contains_sensitive_data = false
contains_personal_data = false
provenance_notes = "Official Google bucket gs://clusterdata-2011-2 over anonymous HTTPS (storage.googleapis.com/clusterdata-2011-2/...). This is its own bucket, distinct from the other Google buckets on the shared storage.googleapis.com host used by unrelated accepted recipes. Part sizes/md5 pinned from the GCS JSON object listing; sha256 pinned from the bucket's own SHA256SUM file."
usage_notes = "Only two numeric measurement columns are emitted. Job IDs, task indices and machine IDs (already obfuscated by the publisher), timestamps, flags, CPU rate and the memory/disk/page-cache columns are dropped and stored nowhere in the output."

