[processing]
download_script = "download.sh"
build_script = "build.sh"
verify_script = "verify.sh"
sample_index_path = "index/exomol_state_energy_levels_f64/samples.jsonl"
summary = "Fetch the version-pinned ExoMol master file and .def files, re-derive one dataset per molecule, fetch those .states.bz2 files, decode the six-decimal energy column, exclude whole datasets whose line count disagrees with the .def, whose energy tokens are malformed or not six-decimal, whose IDs are not strictly increasing, that are not on a uniform 1e-6 cm^-1 decimal lattice, or whose energies are float32 values printed with six decimals (float32_lattice), and emit one little-endian float64 sample per kept dataset in native file order."
deterministic_notes = "Selection: for each of the 102 molecules in exomol.all order, the first dataset (master order) whose .def 'No. of states' is within [1,000, 5,000,000]; 77 molecules qualify. Neither exomol.all nor the .def/.def.json files carry a 'recommended' flag (only the HTML pages do), so master order is the tie-break. Whole-dataset exclusion rules, pinned in scripts/exomol_states.py and per dataset in sources.tsv expected_status: def_count (decoded line count differs from the .def/.def.json state count; 9 datasets), token_format (an energy token not matching -?d{1,6}.dddddd, e.g. nan, 5-decimal or free-format values; 4), id_sequence (IDs not strictly increasing from 1, i.e. duplicates or out of order; 2), lattice (for k = 1, 2, 3 the share of tokens whose six-digit fraction ends in >= k zeros implies a coarse-token share q_k = (c_k/n - 10^-k)/(1 - 10^-k) above 0.02 + 5 sigma_k; 24), float32_lattice (over valid tokens with |E| >= 1024 cm^-1, at least 100 eligible and more than 5% equal to the six-decimal print of the nearest float32, i.e. a float32-ULP effective lattice; 2: BH AX and NaO NaOUCMe at share 1.000, every kept dataset <= 0.004), negative_reference (more than 1% negative energies; none). Exclusion reasons combine, so these counts overlap: 34 datasets are excluded and 43 kept. Gaps in otherwise increasing IDs (7 kept datasets keep their original calculation numbering) are reported, not excluded; completeness is enforced by the .def count. Build fails if a realized status or line count differs from the pinned one; verify re-derives every status with an independent integer micro-unit parser. Integrity: pinned SHA-256 and line count per file; every stored double equals the exact decimal micro-unit value divided by 10^6 and formats back to the source token."

[[series]]
id = "exomol_state_energy_cm1_f64"
description = "Rovibronic state energy term values of one molecule's ExoMol line list."
semantic_meaning = "Energy term value E of every rovibronic state of one isotopologue line list, in cm^-1 relative to the dataset's zero of energy (its lowest state), exactly as published in column 2 of the ExoMol .states file."
role = "primary"
representation_class = "native_numeric"
representation_notes = "The source prints each energy as a fixed-point decimal with exactly six decimals (declared F12.6 / C %12.6f), up to 11 significant digits (e.g. 29170.834712); float32 cannot hold these. Each token is parsed to the nearest IEEE-754 binary64, which equals the decimal micro-unit count divided by 10^6 and round-trips to the source text. No rescaling, sorting or deduplication."
source_resources = ["exomol_master", "exomol_def_files", "exomol_selected_def_json", "exomol_selected_states_bz2"]
source_format = "bzip2-compressed ExoMol .states text file (fixed-format, space-separated records)"
source_field = "column 2, E: state energy in cm^-1 (F12.6, C format %12.6f) as declared by states_file_fields in the dataset .def.json"
filtered_input_path = "filtered/exomol_state_energy_levels_f64/dataset_classification.tsv"
filtering = "One dataset per molecule by the pinned selection rule; whole datasets are excluded only by the pinned def_count, token_format, id_sequence, lattice, float32_lattice or negative_reference rules (34 of 77; listed with statistics in filtered/<id>/dataset_classification.tsv and the README). Within a kept dataset every state record is emitted; no rows are dropped. Degeneracy, J, uncertainty, lifetime, Lande g, quantum labels and the calculated-energy column of MARVELized files are not emitted."
missing_value_policy = "No missing values are emitted or imputed. A record with fewer than two fields or a non-integer ID is fatal. Any non-finite or malformed energy token (e.g. the 76 'nan' energies of AlO ATP) excludes the whole dataset (token_format), as does a line count that differs from the .def state count (def_count). Negative energies are kept verbatim (one value, -0.146155 in ScO LPB); a dataset with more than 1% negative values would be excluded (negative_reference)."
conversion = "Stream-decode the .bz2, split each record on whitespace, parse field 2 with float() to binary64, and write the values in native file (state ID) order as little-endian float64, one file per dataset. The order is the ExoMol J/symmetry-block order, so the stream is a sawtooth of ascending runs."
numeric_kind = "float"
bit_width = 64
endianness = "little"
sample_format = "raw homogeneous little-endian float64 array"
sample_geometry = "one_value_per_rovibronic_state_in_file_order"
sample_rank = 1
sample_axes = ["state"]
natural_record_kind = "exomol_isotopologue_dataset_states_file_energy_column"
sample_count = 43
total_size_bytes = 249344616
output_path = "samples/exomol_state_energy_levels_f64/exomol_state_energy_cm1_f64/"
